# Maillard JAX bake-off environment (plan W4 step H2, pulled forward; 2026-11-04).
#
# A SEPARATE env, `maillard-jax`: environment.yml's package set plus JAX (CPU, float64) and
# diffrax / equinox / optimistix. It backs ONLY results/validation/jax_bakeoff_sulfur_lane.* and
# src/kinetic_core_jax/. The core `maillard` env, whose package set backs every other number in
# results/validation/, is not touched. Create with
#     mamba env create -f environment-jax.yml     (or: conda env create -f environment-jax.yml)
# and run as the native backend does:  source <conda.sh>; conda activate maillard-jax; ...
name: maillard-jax
channels:
  - conda-forge
dependencies:
  # --- environment.yml, verbatim ---
  - python=3.12
  - pip
  - setuptools
  - pytest
  - coverage
  - numpy>=2.0
  - scipy
  - numba
  - matplotlib
  - networkx
  - pyyaml
  - jsonschema
  - rdkit
  # --- the bake-off's additions ---
  # pinned 2026-11-06 at the versions every results/validation/jax_* record and the JAX tests ran on
  - jax=0.12.0.1
  - jaxlib=0.12.0.1     # CPU build
  - pip:
      - diffrax==0.7.2
      - equinox==0.13.8
      - lineax==0.1.1
      - optimistix==0.1.0
