# Maillard runtime environment.
#
# 2026-09-01 (cleaning branch, Phase 1a): the xTB / DFT / MLP refinement lane was
# removed, and with it pyscf, xtb, crest, geometric, ase, pytorch, sella, mace-torch,
# e3nn, huggingface_hub and the pyGSM build patches. Everything listed here is imported
# by src/, scripts/ or tests/ (checked with grep on that date); do not add a dependency
# without a consumer.
name: maillard
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - setuptools
  - pytest
  - hypothesis
  - numpy>=2.0
  - scipy
  - pandas
  - matplotlib
  - rdkit
  - cantera>=3.2.0
  - pyyaml
  - optuna
  - networkx
  - jupyter
  - ipykernel
  - ipywidgets
  - pip:
      - SciencePlots
