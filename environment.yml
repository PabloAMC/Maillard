# Maillard runtime environment.
#
# 2026-09-08: trimmed to what src/, scripts/ and tests/ import (checked with grep). The
# quantum-chemistry stack left on 2026-09-01 with its lane; cantera, optuna, pandas, tqdm,
# SciencePlots, hypothesis and the notebook stack left on 2026-09-08 because nothing imports
# them. Do not add a dependency without a consumer. jsonschema is the schema gate's;
# rdkit rebuilds the compound registry and backs one unit test.
name: maillard
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - setuptools
  - pytest
  - coverage
  - numpy>=2.0
  - scipy
  - matplotlib
  - networkx
  - pyyaml
  - jsonschema
  - rdkit
