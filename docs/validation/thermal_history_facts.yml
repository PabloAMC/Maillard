# heating_facts.yml -- the thermal history of every fitted and scored pot, as the sources state it.
#
# Read-only curation, 2026-10-28, for wave B64 (thermal programme). Nothing in the repository was
# edited. Every quote below was read with `pdftotext -q` from data/articles/<stem>.pdf unless
# `read_in` says otherwise ("dossier" = data/lit/extraction_dossiers/*, "bundle" = a benchmark
# bundle's own content_verification / provenance note). Quotes are verbatim except for pdftotext
# artefacts, which are marked [sic] or normalised and flagged (e.g. Cerny's LWT PDF prints "1C" for
# "°C"; Hofmann 1995's OCR prints "Model 11" for "Model II" and "mol&" for "mol/L").
#
# Page convention: "PDF p. N" is the N-th page of the file on disk; the printed journal page is
# given where the PDF prints it.
#
# time_convention vocabulary (from the request):
#   ramp_only            the stated time IS the heat-up (Hofmann 1995)
#   hold_after_reaching  time counted after the sample reached temperature
#   includes_come_up     time from insertion; come-up inside it
#   ramp_plus_hold       both stated
#   unstated
# Where the source itself is silent but a sibling paper (same lab, same apparatus) decides it, the
# record carries `time_convention: unstated` plus `best_reading:` with the sibling cited.
#
# come_up_estimate fields are MY engineering estimates (inference, not in any source); they are
# there so a reader can rank pots by how wrong isothermal integration is. Treat them as low
# confidence and never as data.
#
# Dose arithmetic used in the notes (my derivation -- please re-check): for a linear ramp at rate
# beta (K/min) ending at T_max, the time-equivalent at T_max of an Arrhenius step with barrier Ea is
#   t_eq ~= R*T_max^2 / (Ea*beta)        (valid when Ea*(T_max-T_0)/(R*T_max^2) >> 1)
# Hofmann ramp 20 -> 145 C in 20 min: beta = 6.25 K/min, T_max = 418.15 K, R*T_max^2 = 1.454e6 J/mol
#   Ea =  80 kJ/mol -> t_eq = 2.9 min;  Ea = 100 -> 2.3 min;  Ea = 120 -> 1.9 min.
# So "isothermal 20 min at 145 C" carries ~7-10x the dose of "ramp only", while "ramp + 20 min
# hold" carries only ~1.1x the isothermal dose. The decision that matters is ramp-only vs not.

meta:
  generated: "2026-10-28"
  for: "B64 thermal-history wave (worktree b64-thermal-history)"
  pdf_root: "/Users/pabloantoniomorenocasares/Developer/Maillard/data/articles (main checkout; the worktree has no PDFs)"
  fit_system_list_source: >-
    scripts/generators/generate_kinetic_core_b2_3_fit.py SYSTEMS (35 systems) +
    scripts/generators/generate_kinetic_core_b8_fit.py B8_SYSTEMS (feng_arp_100, feng_arp_120) = 37.
    Every one is integrated isothermally at t_c for `minutes` from t = 0.

# =====================================================================================================
# 1. THE HOFMANN-LAB AUTOCLAVE: every Hofmann/Schieberle paper on disk, its heating wording verbatim
# =====================================================================================================
hofmann_lab_autoclave:
  question: "Hofmann & Schieberle 1998 anchor pots: 'ramp only' (20 -> 145 C within 20 min, then cool) or 'ramp + 20 min hold' or isothermal 20 min?"
  verdict: ramp_only
  probabilities:
    ramp_only_20_to_145C_in_20min: 0.80
    ramp_then_20min_hold_at_145C: 0.12
    isothermal_20min_at_145C_instant_come_up: 0.03
    other_or_mixed: 0.05   # e.g. ramp + short undeclared dwell, or a different programme for the 50 mL fed pots
  what_no_paper_states:
    - "No Hofmann/Schieberle paper on disk states a hold at 145 C after a ramp."
    - "No paper states a come-up time separate from the 20-min ramp; the ramp is the only time ever given."
    - "No paper states how the Roth autoclave is heated (no oil bath, heating jacket, or oven is named)."
    - "No paper states a cooling method or duration: only 'After cooling' (1995, 1997, Schieberle 2000) and 'After cooling of the reaction mixtures to 20 °C' (1998)."
  deciding_evidence:
    - id: E1_same_apparatus_same_pot
      text: >-
        1995 (ribose) and 1997 (glucose, rhamnose) describe the SAME charge (Cys 3.3 mmol + sugar
        10 mmol in 100 mL 0.5 M phosphate pH 5.0) in the SAME vessel (Roth Model II, 200 mL) and give
        the ramp as the whole thermal description, followed directly by 'After cooling'. 1998 uses the
        same charge and the same autoclave ('200 mL; Type II; Roth, Germany') and cites 1995/1997 as the
        processed flavours 'manufactured by heating ribose ... and glucose or rhamnose ... in the
        presence of cysteine' (1998, PDF p. 1 = p. 235).
    - id: E2_self_paraphrase_1997
      text: >-
        Hofmann 1997 paraphrases ITS OWN ramp, in its own Results, with the exact words the 1998 Methods
        use: Methods 'by raising the temperature within 20 min from 20 to 145 °C'; Results 'A solution of
        glucose and cysteine was thermally treated for 20 min at 145 °C'. The lab's 'thermally treated for
        20 min at 145 °C' is demonstrably the 20-min ramp.
    - id: E3_same_numbers_cited_to_ramp_papers
      text: >-
        Schieberle 2000 (ACS Symp. Ser. 756) Table III prints, for 'a thermally treated (145°C; 20 min)
        aqueous cysteine/ribose' pot, 2-furfurylthiol 121 and 2-methyl-3-furanthiol 198 ug/L -- exactly
        Hofmann 1998 Table 1's 12.1 and 19.8 ug per 100 mL. Its Experimental 2.1 says the model 'was
        reacted for 20 min ... at 145°C in an autoclave' and that details 'are reported elsewhere (4, 5)';
        refs 4 and 5 are Hofmann & Schieberle 1995 (JAFC 43:2187) and 1997 (JAFC 45:898), the two ramp
        papers. (Strictly, the sentence says isolation/GC-O/sensory details are elsewhere; the heating
        is restated in the same shorthand.)
    - id: E4_compression_in_1995
      text: >-
        Within Hofmann 1995 itself the ramp is compressed to 'reacted for 20 min' (Table 1 footnote) and
        '(145 °C; 20 min)' (abstract). Every later '145 °C / 20 min' in this lab is the same compression.
    - id: E5_dose_consistency_check_INFERENCE
      text: >-
        Schieberle 2000 Table IV (same charge, 'in a laboratory autoclave' at 100 C) gives MFT 4.5, 13.8,
        156, 179 ug after 30, 60, 360, 720 min. The 145 C / 20 min pot gave 19.8 ug. By the ramp
        arithmetic above, ramp-only is worth ~1.9-2.9 min at 145 C, i.e. ~45-125 min at 100 C for
        Ea 80-120 kJ/mol -> expected ~10-45 ug, bracketing 19.8. A 20-min hold (~22 min at 145 C) is
        worth ~350-1400 min at 100 C -> expected >= 150 ug. The measured 19.8 ug sits with ramp-only.
        Caveats: MFT is an intermediate (its loss may have a higher barrier), the 100 C autoclave runs
        have their own come-up, and Ea is not measured. Supporting, not decisive. My derivation.
  against_ramp_only:
    - "Read alone, 1998's Methods sentence ('thermally treated for 20 min at 145 °C') is the normal way to write an isothermal hold; a reviewer-facing quantitative paper might have changed protocol. Nothing positive supports a change, and E3 says the 1998 numbers were still being cited to the 1995/1997 procedure in 2000."
    - "The fed-precursor pots are 50 mL in the same 200 mL autoclave. If the ramp was a fixed programme, it is the same 20 min; if it was 'heat at full power', 50 mL would come up faster. Unstated; this is the 'other_or_mixed' mass."
  cooling_note: >-
    Unstated in every paper. A 200 mL bench autoclave cooled passively spends minutes above 100 C, so
    some dose accrues after the 20-min mark; nothing on disk bounds it.

  papers:
    - source_id: hofmann1995_extraction
      pdf: hofmann1995.pdf
      citation: "Hofmann & Schieberle 1995, J. Agric. Food Chem. 43:2187-2194"
      uses_roth_autoclave: true
      pot: "L-cysteine 3.3 mmol + D-ribose 10 mmol, phosphate buffer 100 mL, 0.5 mol/L, pH 5.0"
      apparatus: autoclave
      vessel: "laboratory autoclave, Model II, Roth, Karlsruhe (volume not printed here; 200 mL in 1997)"
      fill_mL: 100
      time_convention: ramp_only
      ramp_min: 20
      ramp_from_C: 20
      ramp_to_C: 145
      hold_min: null
      come_up_min: null
      cooling: {method: "'After cooling' (unspecified)", time_min: null}
      quotes:
        - text: "were allowed to react in a laboratory autoclave (Model II; Roth, Karlsruhe, Germany) by raising the temperature within 20 min from 20 to 145 °C."
          location: "Experimental Procedures, 'Model Reaction', PDF p. 2 (p. 2188); OCR prints 'Model 11'"
          read_in: pdf
        - text: "After cooling, the dark yellow reaction mixture was extracted five times with diethyl ether"
          location: "'Isolation of the Volatile Reaction Products', PDF p. 2 (p. 2188) -- the very next sentence; no hold in between"
          read_in: pdf
        - text: "A mixture of ribose (10 mmol) and cysteine (3.3 mmol) was reacted for 20 min in phosphate buffer (100 mL; 0.5 mol/L; pH 5.0)."
          location: "Table 1 footnote a, PDF p. 3 (p. 2189)"
          read_in: pdf
        - text: "a thermally treated solution (145 °C; 20 min) of cysteine/ribose"
          location: "Abstract, PDF p. 1 (p. 2187)"
          read_in: pdf
      confidence: high
      notes: "The dossier (hofmann1995_extraction.md Flags 2) already reads the 20 min as the ramp."

    - source_id: hofmann1995b (no dossier of this name; JAFC 43:2946, 2-acetyl-2-thiazoline)
      pdf: hofmann1995b.pdf
      uses_roth_autoclave: "a 'laboratory autoclave', make not named"
      apparatus: autoclave
      fill_mL: 50
      time_convention: unstated
      quotes:
        - text: "The reaction was performed in sodium/potassium phosphate buffer (50 mL; pH 5.0; 0.5 mol/L) at 145 °C in a laboratory autoclave."
          location: "Table 4 footnote b (the 20-min AT-degradation row), PDF p. 2 (p. 2947)"
          read_in: pdf
        - text: "At the end of the reaction times detailed in Tables 3-5, the mixtures were cooled to room temperature."
          location: "Quantification of 2-Acetyl-2-thiazoline, PDF p. 2"
          read_in: pdf
      confidence: high
      notes: "'Heating was performed in sunflower oil at 100 °C' in the same table refers to the reaction MEDIUM of another row, not to how the autoclave is heated."

    - source_id: hofmann1996_extraction
      pdf: hofmann1996.pdf
      uses_roth_autoclave: false
      notes: "MFT stability study (JAFC 44:251); no autoclave pot, no heating wording relevant to the anchor."

    - source_id: "hofmann1998_reconciliation (hofmann1996b.pdf is aliased to it)"
