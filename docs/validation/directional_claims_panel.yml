panel:

  # =====================================================================
  # SUGAR IDENTITY
  # =====================================================================
  - claim_id: SUG-01
    statement: "With cysteine, pentoses generate much higher 2-methyl-3-furanthiol (MFT) than hexoses."
    claim_type: ordering
    category: sugar_identity
    observables: ["MFT"]
    conditions:
      A:
        label: "cysteine + D-ribose"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
      B:
        label: "cysteine + D-glucose"
        system: {precursors: {L-Cysteine: 10.0, D-Glucose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
    expected_relation: "A>B"
    source:
      ref: hofmann1998
      quote: "Although pentoses generated much higher amounts of FFT and MFT than hexoses when heated in the presence of cysteine, glucose and rhamnose also gave significant yields."
    fit_status: fit_adjacent
    fit_note: "The A-side reproduces cys_ribose_140C_Hofmann1998, a per_row_recovery fit target of sulfur_barrier_refit_hofmann.json (4 free barriers / 2 rows) and sulfur_barrier_refit_pentodiulose.json. Excluded from the headline."
    model_scope_note: "Expressible: both sugars resolve and both MFT and FFT are model observables."

  - claim_id: SUG-02
    statement: "With cysteine, pentoses generate much higher 2-furfurylthiol (FFT) than hexoses."
    claim_type: ordering
    category: sugar_identity
    observables: ["FFT"]
    conditions:
      A:
        label: "cysteine + D-ribose"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
      B:
        label: "cysteine + D-glucose"
        system: {precursors: {L-Cysteine: 10.0, D-Glucose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
    expected_relation: "A>B"
    source:
      ref: hofmann1998
      quote: "Although pentoses generated much higher amounts of FFT and MFT than hexoses when heated in the presence of cysteine, glucose and rhamnose also gave significant yields."
    fit_status: fit_adjacent
    fit_note: "Same per-row fit target as SUG-01."
    model_scope_note: "Expressible."

  - claim_id: SUG-03
    statement: "In a cysteine/hexose (glucose) system FFT is the more important thiol; MFT is the one that is key in cysteine/pentose systems. So FFT > MFT in cysteine + glucose."
    claim_type: ordering
    category: sugar_identity
    observables: ["FFT"]
    conditions:
      A:
        label: "FFT in cysteine + glucose"
        observable: "FFT"
        system: {precursors: {L-Cysteine: 10.0, D-Glucose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
      B:
        label: "MFT in cysteine + glucose"
        observable: "MFT"
        system: {precursors: {L-Cysteine: 10.0, D-Glucose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
    expected_relation: "A>B"
    source:
      ref: cerny2015
      quote: "2-furanmethanethiol, together with 5-acetyl-3,4-dihydro-2H-1,4-thiazine, was among the most important aroma compounds identified in a thermally treated solution of L-cysteine and glucose and played a more important role than 2-methyl-3-furanthiol, which is key in aqueous L-cysteine/pentose systems"
      quote_form: verbatim_page_elided
      quote_form_note: >-
        A running page header interrupts the sentence in the scanned chapter text and was dropped; no other change.
    fit_status: independent
    fit_note: "The cysteine/GLUCOSE system is not a benchmark anywhere in data/benchmarks/; the sulfur fit targeted the ribose row only."
    model_scope_note: "Expressible: within-system ordering of two model observables."

  - claim_id: SUG-04
    statement: "Conversely, MFT > FFT in the cysteine/pentose system (MFT is 'key' there)."
    claim_type: ordering
    category: sugar_identity
    observables: ["MFT"]
    conditions:
      A:
        label: "MFT in cysteine + ribose"
        observable: "MFT"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
      B:
        label: "FFT in cysteine + ribose"
        observable: "FFT"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
    expected_relation: "A>B"
    source:
      ref: cerny2015
      quote: "...played a more important role than 2-methyl-3-furanthiol, which is key in aqueous L-cysteine/pentose systems (Hofmann and Schieberle, 1997)."
      quote_form: verbatim_page_elided
      quote_form_note: >-
        A running page header interrupts the sentence in the scanned chapter text and was dropped; no other change.
    fit_status: fit_adjacent
    fit_note: "Both sides are the cys_ribose_140C_Hofmann1998 row and BOTH observables are the fitted targets of sulfur_barrier_refit_hofmann.json. This is pure fit recovery; excluded."
    model_scope_note: "Expressible but uninformative - it is the fitted row."

  - claim_id: SUG-05
    statement: "Furfural is the characteristic dehydration product of pentoses; the model should give more furfural from a pentose than from a hexose under identical conditions."
    claim_type: ordering
    category: sugar_identity
    observables: ["Furfural"]
    conditions:
      A:
        label: "cysteine + D-ribose"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
      B:
        label: "cysteine + D-glucose"
        system: {precursors: {L-Cysteine: 10.0, D-Glucose: 10.0}, temp_C: 140, ph: 5.0, water_activity: 0.98, time_min: 30}
    expected_relation: "A>B"
    source:
      ref: cerny2015
      quote: "Furfural is nearly always detected in reactions of L-cysteine with pentoses. ... When furfural was replaced by glucose, furfural and 2-furanmethanethiol were still detected, suggesting that glucose can likewise serve as a precursor for furfural and 2-furanmethanethiol, even though glucose is less effective as a precursor than pentoses (ribose, xylose), as shown by Hofmann and Schieberle (1998b)."
    fit_status: fit_system_overlap
    fit_note: "Furfural is NOT among the fitted observables of sulfur_barrier_refit_hofmann.json (which fitted MFT/FFT barriers), but the A-side system is the fitted row."
    model_scope_note: "Expressible."

  - claim_id: SUG-06
    statement: "Ribose and xylose are both pentoses but are not interchangeable precursors in the literature (different downstream ratios are reported for each)."
    claim_type: ordering
    category: sugar_identity
    observables: ["MFT"]
    evaluable: false
    expected_relation: "A>B"
    conditions: {}
    source:
      ref: cerny2015
      quote: "glucose is less effective as a precursor than pentoses (ribose, xylose)"
    fit_status: independent
    model_scope_note: >-
      UNEVALUABLE - MEASURED MODEL LIMITATION. Substituting D-Xylose for D-Ribose
      produced numerically IDENTICAL predictions to 4+ significant figures for every
      observable (furfural 511.88, MFT 242.38, FFT 218.00, disulfide 120.59,
      2,5-dimethylpyrazine 59.42). The model resolves both pentoses to the same
      reactive representation, so it cannot express ANY ribose-vs-xylose comparison.

  # =====================================================================
  # pH DIRECTION
  # =====================================================================
  - claim_id: PH-01
    statement: "In cysteine/ribose model systems, MFT is drastically reduced at pH 6.5 relative to pH 4.5; thiols are favoured at low pH."
    claim_type: ordering
    category: ph
    observables: ["MFT"]
    conditions:
      A:
        label: "pH 4.5"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 4.5, water_activity: 0.98, time_min: 30}
      B:
        label: "pH 6.5"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 6.5, water_activity: 0.98, time_min: 30}
    expected_relation: "A>B"
    source:
      ref: cerny2015
      quote: "At low pH, levels of 2-methyl-3-furanthiol and 2-furanmethanethiol are, in general, higher. Consistent with these findings, model reactions between L-cysteine and ribose at pH 4.5-6.5 showed drastically reduced levels at pH 6.5 for the sulfur odourants 2-methyl-3-furanthiol, 2-methyl-3-thiophenethiol as well as for their corresponding disulfides (Farmer and Mottram, 1990)."
    fit_status: fit_system_overlap
    fit_note: "Same chemical system as the per-row fit target, but the fit set the absolute level at pH 5.0 only; no pH series was ever fitted, so the pH-response ratio is out-of-sample."
    model_scope_note: "Expressible - pH is a first-class condition."

  - claim_id: PH-02
    statement: "Same pH direction for the corresponding disulfide (bis(2-methyl-3-furyl) disulfide): lower at pH 6.5 than at pH 4.5."
    claim_type: ordering
    category: ph
    observables: ["bis(2-methyl-3-furyl) disulfide"]
    conditions:
      A:
        label: "pH 4.5"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 4.5, water_activity: 0.98, time_min: 30}
      B:
        label: "pH 6.5"
        system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 6.5, water_activity: 0.98, time_min: 30}
    expected_relation: "A>B"
    source:
      ref: cerny2015
      quote: "...showed drastically reduced levels at pH 6.5 for the sulfur odourants 2-methyl-3-furanthiol, 2-methyl-3-thiophenethiol as well as for their corresponding disulfides (Farmer and Mottram, 1990)."
    fit_status: fit_system_overlap
    fit_note: "As PH-01. The disulfide is a reported-not-fitted observable in sulfur_barrier_refit_hofmann.json."
    model_scope_note: "Expressible."

  - claim_id: PH-03
    statement: "Raising pH from 4 to 7 in a cysteine/xylose/thiamine system SUPPRESSES 2-furanmethanethiol (FFT) formation - FFT is favoured with decreasing pH."
    claim_type: monotonic_direction
    category: ph
    observables: ["FFT"]
    conditions:
      series:
        - label: "pH 4.0"
          system: {precursors: {L-Cysteine: 10.0, D-Xylose: 10.0, Thiamine: 5.0}, temp_C: 140, ph: 4.0, water_activity: 0.98, time_min: 30}
        - label: "pH 5.5"
          system: {precursors: {L-Cysteine: 10.0, D-Xylose: 10.0, Thiamine: 5.0}, temp_C: 140, ph: 5.5, water_activity: 0.98, time_min: 30}
        - label: "pH 7.0"
          system: {precursors: {L-Cysteine: 10.0, D-Xylose: 10.0, Thiamine: 5.0}, temp_C: 140, ph: 7.0, water_activity: 0.98, time_min: 30}
    expected_relation: "decreasing"
    source:
      ref: cerny2015
      quote: "The increased formation of thiols at low pH was also observed by Cerny and Briffod (2007) who found that formation of 2-furanmethanethiol, 3-mercapto-2-pentanone and 4,5-dihydro-2-methyl-3-furanthiol was favoured in heated aqueous model systems of L-cysteine, xylose and thiamine with decreasing pH from 7 to 4."
      quote_form: verbatim_page_elided
      quote_form_note: >-
        A running page header interrupts the sentence in the scanned chapter text and was dropped; no other change.
    fit_status: independent
    fit_note: "No cysteine/xylose/thiamine benchmark exists in data/benchmarks/; nothing was fitted to this system."
    model_scope_note: "Expressible - all three precursors resolve and FFT is an observable. NB the model treats xylose identically to ribose (see SUG-06)."

  - claim_id: PH-04
    statement: "Raising pH shifts the Maillard product spectrum from sulfur compounds toward NITROGEN heterocycles - pyrazines and thiazoles increase with pH."
    claim_type: monotonic_direction
    category: ph
    observables: ["2,5-Dimethylpyrazine"]
    conditions:
      series:
        - label: "pH 4.5"
          system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 4.5, water_activity: 0.98, time_min: 30}
        - label: "pH 5.6"
          system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 5.6, water_activity: 0.98, time_min: 30}
        - label: "pH 6.5"
          system: {precursors: {L-Cysteine: 10.0, D-Ribose: 10.0}, temp_C: 140, ph: 6.5, water_activity: 0.98, time_min: 30}
    expected_relation: "increasing"
    source:
      ref: cerny2015
      quote: "Higher pH produced more thiazoles (e.g. 2-acetylthiazole). ... At pH 4.5, sulfur compounds dominated the volatile fraction, whereas with pH 6.5 nitrogen compounds prevailed. ... In the same reaction at pH 7.1, heterocyclic compounds (thiazoles, thiazolines, pyrazines and others) dominate."
    fit_status: independent
    fit_note: "2,5-dimethylpyrazine is not a fitted observable in any live fit record."
    model_scope_note: "Expressible: 2,5-dimethylpyrazine is the model's only nitrogen-heterocycle observable, so it is the available proxy for 'nitrogen compounds'."

  - claim_id: PH-05
    statement: "Furfural/HMF (acid-catalysed sugar dehydration) should NOT rise with pH the way nitrogen heterocycles do; sugar dehydration to furfural is favoured under acidic conditions."
    claim_type: monotonic_direction
    category: ph
    observables: ["Furfural"]
    conditions:
      series:
        - label: "pH 4.0"
