# Directional-accuracy claims panel
#
# WHY THIS FILE EXISTS
# --------------------
# The model's ABSOLUTE accuracy is documented and poor (see AUDIT.md and
# results/validation/). Its actual use case is ORDINAL: screening formulations,
# ranking off-flavour markers, choosing a direction to move a process knob.
# Nobody had ever measured whether it gets DIRECTIONS right. This panel is the
# evidence base for that question.
#
# EVERY claim here carries a verbatim quote from a source that was actually
# retrieved (file or URL recorded under `source.retrieved_from`). No claim is
# written from memory. Claims that the current model cannot express are kept in
# the file with `evaluable: false` and a reason, because "the machinery cannot
# say" is itself a finding.
#
# FIT STATUS (the honesty axis)
# -----------------------------
#   independent          no side of the comparison reproduces a declared fit
#                        target. These form the HEADLINE score.
#   fit_system_overlap   the comparison lives in the same chemical system as a
#                        per-row fit target, but is a RATIO the fit's free
#                        parameters cancel out of (e.g. a pH sweep through a
#                        system whose absolute scale was fitted at one pH, where
#                        no pH series was ever fitted). Reported separately and
#                        added to a secondary "screening" score.
#   fit_adjacent         a declared fit target with per-row leverage is literally
#                        one side of the comparison. EXCLUDED from the headline.
#                        Cross-check against src/fit_target_index.py and
#                        results/validation/*refit*.json.
#
# SCORING
# -------
#   scratchpad runner (not in-repo, deliberately): builds a synthetic benchmark
#   payload per condition and calls src.benchmark_validation.evaluate_benchmark_payload.
#   Predictions closer than 5% relative are scored "flat" (no separation), which
#   counts as a MISS against a claim that asserts an ordering.
#
# QUOTE FIDELITY
# --------------
# Every `source.quote` was checked programmatically against the retrieved source
# text. Where a quote is not a contiguous verbatim string, `source.quote_form`
# says why. The three forms that occur:
#   verbatim              (default, no quote_form key) - exact contiguous text.
#   verbatim_page_elided  - a running page header sits inside the sentence in the
#                           scanned text ("...(Hofmann and | 194 Flavour Development,
#                           Analysis and Perception in Food and Beverages | Schieberle,
#                           1997)"); the header is dropped, nothing else changed.
#   table_row_reformatted - numbers are verbatim from the source table; column
#                           separators were rewritten as "|" and, where the PDF
#                           extraction put the Tukey significance letters on their own
#                           line ABOVE the data row, the letters were re-attached to
#                           their columns in reading order. Which rows this affects is
#                           stated per claim.
#   transliterated        - Greek letters written out (alpha-, epsilon-); otherwise exact.
#
# Generated: 2026-08-27, Wave S2. Nothing in the model was tuned to build this.

