    expected_relation: "decreasing"
    source:
      ref: ma2024
      quote: "Acrylamide content increased with increasing feed rates and decreasing barrel temperature, with the highest amount observed at 8 kg/h and 130 C, respectively (Figure 2 C,D). A decrease in acrylamide content at higher temperatures was also reported by Mottram et al. [11]. ... Elevated temperatures promoted the accumulation of CEL, methylglyoxal and 2,3-butanedione while diminishing the accumulation of CML, acrylamide, glyoxal and 3-deoxyglucosone."
    source_conditions: "Die-zone temperature setpoints 130 / 150 / 170 C, 30% moisture, SPI + corn starch, twin-screw extrusion (Section 4, temperature experiment)."
    fit_status: independent
    fit_note: "acrylamide_spi_extrusion_130C_ACSRef3.json is a projection_constant_refit target, but at global_low_leverage (2 constants / 16 rows), which by the repo's own rule (src/fit_target_index.py) stays in the coverage denominator. No temperature series was ever fitted."
    model_scope_note: "Expressible: asparagine + glucose is the acrylamide route and acrylamide is a model observable. Caveat: the model has no extrusion residence-time/SME coupling, so 'barrel temperature' is mapped to reaction temperature at fixed time."

