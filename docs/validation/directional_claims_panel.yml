        - label: "130 C"
          system: {precursors: {L-Asparagine: 10.0, D-Glucose: 10.0}, temp_C: 130, ph: 6.0, water_activity: 0.5, time_min: 20}
        - label: "150 C"
          system: {precursors: {L-Asparagine: 10.0, D-Glucose: 10.0}, temp_C: 150, ph: 6.0, water_activity: 0.5, time_min: 20}
        - label: "170 C"
