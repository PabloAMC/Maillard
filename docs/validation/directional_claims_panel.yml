      paper says so itself in one sentence, quoted verbatim: "Approximate quantities of the
      volatiles in the concentrated headspace from each sample were estimated by comparison
      of their peak areas, in the total ion current chromatogram, with that of the
      1,2-dichlorobenzene internal standard using a response factor of 1. This allowed
      comparison of the relative contributions the volatiles made to the headspaces of the
      different systems BUT DID NOT PROVIDE ABSOLUTE CONCENTRATIONS IN THE AQUEOUS SOLUTIONS."
      (Emphasis added; the words are the authors'.) Table 1's own footnote a reads
      "Approximate quantities in headspace (ng/mmol of sugar)". So this source can NEVER
      become an absolute benchmark in this repository, at any future date, on any amount of
      further work - the quantity it reports is not the quantity the model predicts. It is
      admissible here and only here. Reported precision, for the record: "The mean coefficient
      of variance (CV) for quantities of individual components was 22% and, with the exception
      of some compounds that were present in relatively small amounts, no compound showed a
      CV >40%."
    protocol_note: >-
      Conditions, verbatim: "Separate solutions of cysteine (0.1 M) and the ribose-containing
      compound (0.1 M) were prepared using water or the appropriate buffer. ... Equal
      quantities of the solutions were mixed, and 6.0 mL of the mixture (i.e., 0.3 mmol of
      each reactant) was transferred to the reaction ampules. The ampules were flame-sealed
      and then heated in a CERTOclav autoclave (Kelomat, Traun, Austria) for 30 min at 140
      degC under a pressure of 0.28 MPa (2.8 bar)." So 50 mM cysteine + 50 mM sugar, 140 degC,
      30 min. THIS CONFIRMS WAVE S2b's SECOND FINDING: the retired benchmark
      data/benchmarks/cys_ribose_140C_Hofmann1998.json's conditions block (140 degC / 30 min /
      equimolar) is Mottram & Nobrega's protocol attached to Hofmann & Schieberle's citation.
      One detail Wave S2b could not check is now checkable and is ALSO wrong: the retired file
      declares 10 mM, while Mottram & Nobrega's system is 50 mM. The conditions block was not
      even a faithful copy of the protocol it was borrowed from.
