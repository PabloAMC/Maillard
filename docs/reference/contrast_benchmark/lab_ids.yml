# Duplicate data from docs/reference/conflicts_register.yml (kind `duplicate`) that touch atlas cells (rule 5).
# `adds_lab` is set only when the copy and the original are different labs: then every listed cell also carries the
# original's lab. Same-lab entries are recorded so that a reader sees they were checked; they cannot inflate a count.
data_copies:
  - register: CF-018
    copy: cammerer1994
    original: wedzicha1992
    same_lab: false
    adds_lab: leeds_wedzicha
    cells: ["F31#6"]
    note: >-
      Cammerer's Table 3 90 C row reprints Wedzicha 1992 Table 5 (1.0 : 1.0 row; Cammerer prints pH 5 for 5.5;
      DUPLICATE_CONFIRMED, P 0.97). F31#6's water arm therefore holds Leeds data, so the cell carries Leeds as well as
      TU Berlin and its contrast is not a clean within-lab pair.
  - register: CF-005
    copy: kang2026_SI
    original: zhai2023foodchem
    same_lab: true
    cells: ["F04#12", "F04#14", "F04#25"]
    note: "Ho network both sides. F04#14 states it is a copy of Zhai 2021 Fig. 6 and is counted once there."
  - register: CF-066
    copy: zhai2023jafc
    original: zhai2021
    same_lab: true
    cells: ["F04#15", "F25#5", "F26#20"]
    note: "Ho network both sides; the ledgers count the shared arms once (CF-066 remedy)."
  - register: CF-006
    copy: schieberle1998
    original: hofmann1998_reconciliation
    same_lab: true
    cells: ["F25#11", "F26#15", "F26#16"]
    note: "DFA both sides: Table IV's aqueous 145 C column reprints Hofmann 1998 T1; the dry 180 C arm is new."
  - register: CF-006
