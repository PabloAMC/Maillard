# Canonical laboratory ids for the contrast benchmark (v1, 2026-11-01).
#
# Purpose: the benchmark's unit of independence is the LABORATORY (one research group), not the paper. The pathway
# atlas (docs/reference/pathway_atlas/F*.yml) records `lab` as free text; this file maps every distinct `lab` string
# to one canonical id. scripts/generators/build_contrast_split.py reads it and FAILS on any atlas `lab` string that is
# not listed here, so a new spelling cannot slip into the split as a new laboratory.
#
# Merge rules (applied in this order; each non-obvious merge says why in `merge_note`):
#   1. Spelling and affiliation variants of one group are one lab ("DFA Garching (Hofmann / Schieberle)" =
#      "DFA Garching (Hofmann & Schieberle)" = "DFA Garching (Hofmann)").
#   2. One institute's interlinked co-author groups are one lab when the same senior authors chain the papers
#      (Nestle: Cerny & Davidek, Davidek & Blank, Roberts & Kraehenbuehl ...). Conservative: over-merging can only
#      move cells from TEST to DEVELOPMENT and lower the independent-lab count; it can never fake independence.
#   3. A PRINCIPAL INVESTIGATOR who moved keeps one lab when the later work reuses the earlier designs (Cerny: Nestle ->
#      Firmenich; Hofmann: DFA -> TUM Freising). A junior author who moved does not carry the lab (Cerny's 1994 DFA
#      paper as Grosch's student is DFA; Kerler's Quest and Nestle papers stay in their institutes).
#   4. A paper by two groups ("X with Y", "X + Y") is the LEAD group's (the first-named / home group), and the partner
#      is listed under `collaborations:`. A cell carries every lab id of its string: it is DEVELOPMENT if ANY of its labs
#      is a development lab, and for the independent-lab count it belongs to its lead lab only.
#   5. Duplicate data (docs/reference/conflicts_register.yml, kind `duplicate`): a cell whose numbers are a reprint of
#      another lab's data also carries the ORIGINAL lab's id (`data_copies:`), so one data set never counts as two labs.
#      Same-lab duplicates are listed for the record; they cannot inflate a lab count.
#
# `text_aliases`: case-sensitive regular expressions (word-bounded by the generator) that identify this lab when
# ENGINE_VS_LITERATURE secs. 2 - 5 or one of the two cited preregs NAME it without a cell index ("Glomb", "Leahy",
# "DFA"). Author-year citations ("Zhai 2019", "Cerny 2003") are resolved automatically through the atlas dossier stems,
# so they need no alias here. Aliases were reviewed on 2026-11-01 against every capitalised token of the cited text;
# the generator refuses to run if that text changes (sha256), so a new name cannot go unreviewed.

