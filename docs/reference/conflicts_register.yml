  - id: CF-063
    kind: self_contradiction
    scope: sulfur_rows
    sources: [zhang2025b]
    quantity: "TTCA / CAMA / Lys-ARP decay in Zhang 2025b Figs. 2d-h: printed first-order fits vs the plotted points"
    observation: >-
      The printed rate fits do not reproduce the plotted points: extrapolated to t = 0 they imply C/C0 of 0.72 and 0.47,
      not 1, and at 50 min only about half the charged reactants are accounted for by the measured species (route
      adjudication, 2026-10-29).
    explanations:
      - "The fits were made over a later window (an induction or heat-up period excluded) and the intercept was not reported."
      - "An unmeasured sink (oligomers, bound forms) takes up the missing half, so the mass balance is open, not wrong."
    tests: []
    status: open
    remedy: "The route table uses the points (Figs. 2a-c, 2g/h converted with C0 = 40 mM), never the printed constants; the sub-model 2 probe reports this pot's mass balance separately."
    affects: []
  - id: CF-064
    kind: self_contradiction
    scope: sulfur_rows
    sources: [zhai2021]
    quantity: "error bars of the TTCA series in Zhai 2021 Figs. 3a, 4b and 6"
    observation: >-
      The same means carry different SD bars in Figs. 3a and 4b, and in Fig. 6 the pH 5.5 xylose-alone control and the
      TTCA + xylose series carry the same set of SDs (route adjudication, 2026-10-29).
    explanations:
      - "The bars were copied between panels when the figures were assembled, so the printed SD is not the series' own scatter."
    tests: []
    status: open
    remedy: "These rows' printed SDs are not trusted as their own: the sub-model 2 fit estimates a per-series noise scale (fitting.fit_with_series_noise) rather than weighting by the bars."
    affects: []
  - id: CF-065
    kind: conflict
    scope: sulfur_rows
    sources: [hofmann1998_reconciliation, zhai2023foodchem]
    quantity: "molar yield of FFT from furfural + H2S and of MFT from norfuraneol + H2S"
    observation: >-
      FFT from furfural + H2S is 0.48 mol % in Hofmann & Schieberle (pH 5, 145 C, 20 min, isotope dilution) but about
      23 % in Zhai 2023 Food Chem Fig. 6 (pH 7, 120 C, 20 min); MFT from norfuraneol is 0.19 % against about 34 %. A
      50-180x gap at milder temperature (thiol adjudication, 2026-10-29).
    explanations:
      - "pH: at pH 7 a larger share of the sulfide is HS-, the nucleophile; predicts the gap shrinks at matched pH."
      - "Quantification: Zhai's thiols are semi-quantitative (no authentic-standard response factor); predicts the gap is a scale factor common to all of Zhai's thiol rows."
      - "A co-reactant: ammonium or the amine in Zhai's system opens a route Hofmann's binary system lacks; predicts the gap depends on the amine charge."
    tests: []
    status: open
    remedy: "Sub-model 4 fits Zhai's thiol rows shape-only (semi_quantitative, SCALE_TAU = inf), so only the isotope-dilution rows set the absolute yield; the probe reports the two laboratories' residual levels separately."
    affects: []
  - id: CF-066
    kind: duplicate
    scope: sulfur_rows
    sources: [zhai2021, zhai2023foodchem, zhai2023jafc]
    quantity: "TTCA 10 mM (+/- xylose 10 mM) pH 7 dicarbonyl time courses (3-DX, 1-DX, MGO, GO), 100 / 120 / 140 C, 20-120 min"
    observation: >-
      One data set printed three times. ORIGINAL of the 100 C arms: Zhai 2021 JAFC Fig. 5 'TTCA-7' and 'TTCA-Xyl-7'
      (vector; means identical to the plotted digit in all four species). Copies: Zhai 2023 Food Chem Figs. 2-3 (100 C
      TTCA and TTCA + Xyl arms) and Zhai 2023 JAFC Fig. 5 (T-100 C, 20-120 min), the JAFC print with different SD bars for
      the same means. Second family: the TTCA-alone 120 / 140 C arms of Food Chem Figs. 2-3 (online Sep 2022) are JAFC
      Fig. 5's T-120 / T-140 at 20-120 min (the first reader's raster read of Food Chem matches the adjudicator's vector
      read of JAFC in 33 of 34 points within read error). The exception: T-140 3-DX at 120 min is ~0.63 mM in Food Chem
      but 0.420 +- 0.024 in JAFC -- exactly T-100's mean AND error bar at 120 min, i.e. a cell copied within the JAFC
      figure (sub-model 3 adjudication, 2026-10-29).
    explanations:
      - "The group reuses control arms across papers without saying so; the JAFC T-140 120-min point is a copy-paste slip in the figure source."
    tests: []
    status: duplicate_confirmed
    remedy: >-
      Counted once in data/lit/fit_rows/deoxyosone_submodel.yml by transcription, not by flag: the 100 C arms under Zhai
      2021 (zhai2021_fig5ab_deoxyosones_ph_ladder / zhai2021_fig5_dicarbonyls_ph_ladder, pH 7 pots); the TTCA-alone 120 /
      140 C arms and T-100 from 140 min under JAFC (zhai2023jafc_fig5bc_deoxyosones / zhai2023jafc_fig5_arp_dicarbonyls,
      vector values with SDs, to 180 min); Food Chem contributes only its TTCA + Xyl 120 / 140 C arms. The JAFC T-140 3-DX
      120-min point is dropped (the Food Chem value 0.626 is the likelier truth but cannot be attached to the JAFC series).
      The ledgers carry non-dropping flags (arm_reprint_of / reprinted_in): duplicate_of would make fit_rows._drop_copies
      drop whole entries, and each of these entries also holds arms printed nowhere else. Copy -> original map for
      count_once: zhai2023foodchem (100 C arms) -> zhai2021; zhai2023jafc (T-100 20-120) -> zhai2021; zhai2023foodchem
      (TTCA-alone 120 / 140 C) -> zhai2023jafc (counted there).
    affects: [zhai2021_fig5ab_deoxyosones_ph_ladder, zhai2021_fig5_dicarbonyls_ph_ladder, zhai2023foodchem_fig2_deoxyosones, zhai2023foodchem_fig3_cys_da_mgo_go, zhai2023jafc_fig5_arp_dicarbonyls, zhai2023jafc_fig5bc_deoxyosones]
  - id: CF-067
    kind: self_contradiction
    scope: corpus
    sources: [hofmann1999]
    quantity: "glycolaldehyde from xylose + L-alanine (pH 7, reflux): Hofmann 1999 Fig. 10 vs Table 3 (browning activity / colour-dilution factor)"
    observation: >-
      Where the paper prints a point twice, its figure reads 0.86-0.90x its table for glycolaldehyde (10, 60, 120 min),
      while methylglyoxal agrees (0.99-1.03) and glyoxal at 10 min agrees exactly -- so it is not a reading error (two
      independent readers, 2026-10-30). Also: the derivatising reagent is printed as 2 umol per quarter pot (2 mL of
      1 mmol/L OPD), below the dicarbonyl it must trap (MGO alone 2.5 umol at 180 min): a misprint for 1 mol/L, or
      OPD-limited (then early dicarbonyl values are lower bounds).
    explanations:
      - "The figure was drawn from a different analysis or replicate set than the table."
      - "A transcription slip in Table 3's glycolaldehyde colour-dilution factor."
    tests: []
    status: open
    remedy: "The keyed table takes the printed table value where both exist and carries the disagreement as the row's error (0.066 dex)."
    affects: []
  - id: CF-068
    kind: conflict
    scope: corpus
    sources: [schieberle2000, yiltirak2026]
    quantity: "MFT and FFT from ribose + cysteine in 0.5 M phosphate at pH 5 - 5.5, 100 C, 4 h (both SIDA)"
    observation: >-
      Schieberle 2000 Table IV (ribose 100 / cysteine 33 mM, pH 5, closed autoclave): MFT 138 ug/L at 1 h and 1560 at
      6 h (about 800 at 4 h, interpolated), FFT 31 -> 1100. Yiltirak 2026 SI Table S3 (ribose 25 / cysteine 25 mM,
      K phosphate pH 5.5, 3 mL in a 20 mL tube under air): MFT 6.88, FFT 1.28 ug/L at 4 h. A x120 gap in MFT where
      the 4x lower ribose and the 0.5 pH unit explain about x10 (Hofmann 1998's pH ladder: MFT falls x22 from pH 3 to
      7). The joint thiol fit's lane predicts the Yiltirak pot HIGHER than Schieberle's (s042: x3.7 at 100 C), so no
      lane chemistry reconciles them. Units and quantification of both verified by two readers.
    explanations:
      - "Headspace oxygen: 17 mL air over 3 mL (about 50 mM-equivalent O2 against 25 mM cysteine) oxidises cysteine and the thiols during heating; the lane's oxygen consumers are off and no measured cysteine autoxidation rate is in the corpus."
      - "Free-thiol losses between heating and analysis in Yiltirak (labelled standards added to a 30 uL aliquot after heating, extraction into 1 M NaOH): thiols bound as disulfides or adducts are not counted."
      - "Garching's 100 C time course over-reads (CF-055 records an internal text vs table inconsistency in the same laboratory's tables)."
    tests:
      - "Any third laboratory's SIDA ribose + cysteine pot at 100 - 120 C with the vessel headspace stated."
      - "An oxygen-consumer arm with a measured cysteine autoxidation rate: does it move Yiltirak down without moving Schieberle?"
    status: open
    remedy: "Both stay as data: Schieberle in the joint fit, Yiltirak a declared hold-out. Neither is down-weighted; the spread is reported as between-laboratory error if the thiol layer ships as a declared limitation (thiol prereg sec. 6)."
    affects: [schieberle2000_t4_100c_time_course, yiltirak2026_tables3_buffer_arm_mft_fft]
  - id: CF-069
    kind: conflict
    scope: corpus
    sources: [martins2005, davidek2008]
    quantity: "loss of acetic acid in heated sugar + glycine solutions (the trunk's r_aa_frag)"
    observation: >-
      The trunk's acetic-acid loss, fitted on Martins 2005's glucose + glycine acids, runs at 0.0164 /min at 120 C
      (Ea 20 kJ/mol on its lower bound). Davidek 2008 (xylose + glycine, 0.2 M phosphate, isotope dilution) measures
      acetic acid on a plateau from 60 to 240 min at pH 8 (26.9 -> 27.6 mol%) -- a loss of at most ~4e-4 /min, >= 40x
      slower. Acetic acid is thermally stable in water at 120 C, so the fitted loss stands in for another deficiency
      of the Martins fit (a missing late acid sink, or the acid budget's split between formic and acetic).
    explanations:
      - "The Martins fit used r_aa_frag to absorb a late fall in measured acetic acid that has another cause (volatilisation, a sampling or derivatisation artefact, a pH-dependent extraction)."
      - "Glucose and xylose systems differ in a late acetic-acid consumer the lane lacks."
    tests:
      - "The pentose + amine entry arm (E) frees k_aa_frag on Davidek 2008 and re-scores Martins 2005 and Davidek 2006a / b at its optimum."
    status: open
    remedy: "k_aa_frag is a coordinate of arm E; nothing shipped changes until a fit and its audit decide."
    affects: [davidek2008_fig1_xylose_gly_acetic_residual_xylose]
