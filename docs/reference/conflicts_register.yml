  # ---- registered 2026-11-01 from the pathway-condition atlas (docs/reference/pathway_atlas/) ----

  - id: CF-086
    kind: self_contradiction
    scope: corpus
    sources: [liu2023b, cerny2003]
    quantity: "share of 2-methyl-3-furanthiol from recombined ribose fragments, [13C5]-ribose 1:1 + cysteine, 0.5 M K3PO4 pH 5.88, 168 C, 20-60 min (CAMOLA, EI-MS)"
    observation: >-
      Liu 2023 (LWT 182:114874) prints that ribose-fragment recombination makes an "auxiliary contribution (19%)" to
      MFT (sec. 3; liu2023b dossier sec. 2). Its Table 3 (re-read from data/articles/Liu2023b.pdf, 2026-11-01) gives MFT
      at 20 min as M+0..M+5 = 41 / 3 / 2 / 1 / 12 / 40 (40 / 3 / 2 / 1 / 12 / 41 at 40 min), so the 19 % is the sum of
      the M+1..M+4 channels and is carried mostly by M+4. M+4 / M+5 = 0.30, which equals MFT's NIST EI [M-H]+ / M+
      ratio, 0.28: the M+4 channel is the fully labelled molecule's M-1 ion. The Methods say the hydrogen loss "were
      adjusted by [M - 1]+/[M]+", but the table carries the uncorrected ratio, so the methods and the table disagree.
      With M+4 corrected (12 - 0.28 x 40 ~ 1), the fragment share is ~6-7 %, the level of the label's impurity and of
      Cerny & Davidek 2003's non-(0, 5) channels at 95 C (<= ~5 %, cerny2003 Table 2 row 7). Found by
      docs/history/mechanism_reviews_2026-10-31/thiols.md sec. 0 (P 0.8); the atlas cells F23 cell 6 and F24 cell 6
      read it. Two-reader PDF re-read 2026-11-01 (docs/reference/contrast_benchmark/README.md, reread_status): both readers confirm the printed
      table; reader A asked whether the Methods' adjustment (sec. 2.7: natural 13C / 33S / 34S subtracted, and "the
      hydrogen loss from the ions were adjusted by [M - 1]+/[M]+") means this entry's correction double-counts. It
      does not: had the adjustment been applied to the labelled cluster, MFT's M+4 would be ~1 (12 - 0.28 x 40), not
      12; the printed M+4 / M+5 is the uncorrected value. The adjustment the Methods describe is the one this entry
      applies, and it did not reach the labelled MFT ion (for furfural and 2-methylfuran M+0 ~ M+4 + M+5, the mark of
      an adjustment applied to the unlabelled ion only; for MFT M+0 ~ M+5, the mark of none).
    explanations:
      - "EI-MS artefact: the claimed [M-1]+ correction was not applied (or not applied to the labelled ion), so the labelled MFT's own M-1 fragment is read as an M+4 isotopologue."
      - "A real fragment route at 168 C (the paper's reading): would need an M+4 isotopologue that by chance matches the EI [M-H]+ ratio in four unrelated compounds, a C4 + C1 recombination that fills M+4 (12) but not M+1 (3), and a labelled : unlabelled excess that equals the unlabelled ion's m/z 113 loss."
    tests:
      - "The same table's furans show the same signature (thiols.md sec. 0): furfural M+4 / M+5 = 23 / 21 against NIST [M-H]+ / M+ 0.99; 2-methylfuran 20 / 29 against 0.58. Each M+4 tracks its own compound's EI M-1 ratio."
      - "The unlabelled : labelled imbalance (41 : 52 at 20 min) equals the unlabelled ion's uncounted M-1 (thiols.md sec. 0)."
      - "Same pot, same nominal mass (re-read 2026-11-01): 2-furfurylthiol M+4 / M+5 = 4 / 45 = 0.09 against its NIST EI [M-H]+ / M+ 0.05 (m/z 113 / 114 = 109 / 2169, webbook JCAMP C98022) plus ~0.05 from 99 % 13C label purity; MFT 12 / 40 = 0.30 against 0.28 (2799 / 9999, C28588741). The two thiols differ exactly as their own spectra do."
      - "Symmetry (re-read 2026-11-01): random C4 + C1 recombination in a 1:1 pool fills M+1 and M+4 equally; MFT prints M+1 3 against M+4 12 at every time point."
      - "Corrected share (re-read 2026-11-01; M+4 minus 0.28 x M+5, M+0 and M+5 restored by 1.28, renormalised): non-(0, 5) channels 6.2 / 5.9 / 6.6 % at 20 / 40 / 60 min; C2 + C3 (M+2 / M+3) 3-4 %."
    status: explained
    remedy: >-
      Read Liu 2023's MFT labelling as ~94 % intact C5 and ~6 % fragments (5.9-6.6 % at 20-60 min; band 4-9 %, the
      upper end from the M+1 = M+4 symmetry; 19 % only if the authors' raw spectra contradict every test above).
      P 0.9 (up from 0.8 on the same-pot 2-furfurylthiol control and the symmetry test, 2026-11-01). Like every
      labelled pot in F24 the share counts only the mixed half of random 1:1 recombinants, so it is comparable with
      Cerny 2003 / Zhao 2019 / Du 2023, not an absolute recombined fraction. The claim "MFT is an intact C5, fragments
      <= ~6 % in labelled pots" therefore holds at 168 C; no measured rise of the fragment share with temperature
      follows. The atlas cells F23 cell 6 (dominant, intact C5) and F24 cell 6 (minor, was conflicting) cite this
      entry. The dossier's sec. 2 sentence carries the superseded note; the ledger note of
      liu2023b_carbon_module_labelling still prints the uncorrected 81 / 19 %; annotate it in a dossier wave (not
      edited here). No engine constant uses the number.
    affects: [liu2023b_carbon_module_labelling]

