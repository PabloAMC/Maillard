  - id: CF-077
    kind: code_mismatch
    scope: other_lane
    sources: [leahy1989, zhou2023]
    quantity: "the methylpyrazine cross-pair rate of the B18 condensations: mixing ratio R = MPZ^2 / (PZ * DMP)"
    observation: >-
      src/kinetic_core/network.py gives the three condensations r_akg_pz {AKG: 2} -> PZ, r_akm_dmp {AKM: 2} -> DMP and
      r_ak_mpz {AKG: 1, AKM: 1} -> MPZ ONE shared k_cond, and reaction_rates evaluates plain mass action (k * prod
      c^nu), so PZ = k A^2, DMP = k M^2, MPZ = k A M and R = 1. The docstrings (network.py r_ak_mpz: "2 sqrt of the two
      homo rates"; parameters_pyrazine.py: "rate_MPZ = 2 sqrt(rate_PZ rate_DMP) ... with its factor two"; the B18 fit
      reports' mixed_route line) promise the statistical cross-pair factor, i.e. R = 4. The code lacks the factor 2:
      methylpyrazine is under-predicted 2x against the engine's own design (3.5x / 7x against Leahy's lysine-glucose /
      lysine-ribose pots), and every calibrated Ho row with R >= 1.86 rejects the engine (e.g. Zhou 2023 ARP + Cys pH
      8, R 2.43). Found by the pyrazine-rivals red team (docs/history/pyrazine_rivals_2026-10-31/red_team.md sec. 2,
      checked in the env: AKG 0.3, AKM 0.7, k = 1 gives R = 1.0); code re-read 2026-11-01 (network.py r_akg_pz /
      r_akm_dmp / r_ak_mpz and reaction_rates).
    explanations:
      - "The factor was written into the docstrings and the pre-registration ('geometric mean ... with its factor two') but never into the rate constants: all three reactions take k_cond unscaled."
    tests:
      - "Mass-action arithmetic from the code: R = (k A M)^2 / (k A^2 * k M^2) = 1 for any A, M, k."
      - "Red team sec. 2 numeric check in the env (R = 1.0)."
    status: error_confirmed
    remedy: >-
      Fix in its own PR (methylpyrazine predictions move; ask the owner first): give the cross pair its statistical
      factor (2 k_cond on r_ak_mpz, or k_cond / 2 on the homo pairs, which changes PZ / DMP too and needs a B18 re-fit),
      and choose the form by the pyrazine-rivals verdict, not by the docstring: the red team finds the random-pairing
      R = 4 itself rejected by Leahy and the Ho rows. Until then the docstrings must not be quoted as the engine's R.
    affects:
      - zhou2023_table1_ph6_ph8_arp_cys_volatiles
      - leahy1989_tab3_pyrazine_distribution_95c_2h
      - {file: src/kinetic_core/network.py, symbol: r_ak_mpz}
