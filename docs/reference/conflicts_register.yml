      0.0042 - 0.0065, no replicates); the shipped k_mgo_mel gives 0.0368 /min at 130 C, x7 faster than this amine-free
      loss (k_mgo_mel lumps the amine channel, so this bounds the MGO-alone part only). Pfeifer 2013 is the same
