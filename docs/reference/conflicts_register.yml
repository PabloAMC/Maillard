    scope: sulfur_rows
    sources: [hofmann1998_reconciliation]
    quantity: "table citations of the Hofmann & Schieberle 1998 fed-precursor fit rows"
    observation: >-
      The values in the B2.3 fit rows are right; five table labels are wrong, and the module docstring claims a table
      that no row reads. Against hofmann1998.pdf: ribose + H2S -> MFT 15.1 ug, 0.01 % is Table 4 ("Generation of MFT
      from Ribose or NF in the Presence of Hydrogen Sulfide"), coded "T6" (row fed_ribose_h2s_MFT; system anchor
      "T3/T6"); NF + cysteine -> MFT 50.8 ug is Table 10 only, coded "T4" (fed_nf_cys); the C2 + C3 pH ladder (15.5 ug
      at pH 3.0, 311.5 at 7.0) is Table 8 expts 1 and 3, coded "T10 pH ladder" (fed_c2c3_MFT_pH3 / _pH7); thiamin -> MFT
      8.2 ug is Table 10, coded "T8" (fed_thiamine_MFT). C2 + C3 at pH 5 (268.1 ug) is printed in both Table 8 expt 2
      and Table 10 (coded T10: acceptable, counted once). The docstring lists "Hofmann 1998 Tables 3/4/6/7/8/10" as
      FIT; Table 6 (furan-2-aldehyde and NF from hydroxyacetaldehyde + 2-oxopropanal, pH 3/5/7) has no system and no
      row (no HA + MGO pot exists in SYSTEMS). The "T3/T6" string is repeated in src/kinetic_core/sulfur.py and
      parameters_sulfur.py. The benchmark JSONs (hofmann1998_c2c3_recombination_*, _norfuraneol_cysteine_*) quote
      the right tables (8 and 10).
    explanations:
      - "Table numbers transcribed from an earlier inventory, not from the PDF."
    tests:
      - "hofmann1998.pdf Tables 3, 4, 6, 8 and 10 read 2026-10-29 (p. 237-240); every coded value matches its printed cell."
    status: error_confirmed
    remedy: >-
      Labels only, no number moves. generate_kinetic_core_b2_3_fit.py: docstring "Tables 3/4/6/7/8/10" ->
      "Tables 3/4/7/8/10 (Table 6 is not read)"; SYSTEMS fed_ribose_h2s anchor "T3/T6" -> "T3/T4", fed_nf_cys "T4" ->
