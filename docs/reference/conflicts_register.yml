  - id: CF-088
    kind: conflict
    scope: other_lane
    sources: [farmer1992, xu2011]
    quantity: "reading of the fall in lipid-oxidation aldehydes when cysteine + pentose is heated with lipid (antioxidant Maillard products vs carbonyl capture)"
    observation: >-
      Both papers measure the same pattern: the Maillard reactants cut lipid aldehydes, the unsaturated ones most, and
      raise 1-alcohols and 2-alkylfurans. Farmer, Mottram et al. 1992 (four lipids +- Cys + ribose, 0.5 M phosphate pH
      5.6, N2, 140 C, 1 h) reject an antioxidant reading because ketones, also lipid-oxidation products, "showed little
      change", and attribute the aldehyde loss to reactions with amino / thiol groups, NH3 and H2S (farmer1992 dossier
      sec. 1; PDF abstract and Discussion). Xu et al. 2011 (lard, fresh or oxidised, + Cys + xylose, 0.2 M phosphate pH
      5.0, 120 C, 60 min) read the same pattern as the antioxidant effect of Maillard reaction products, citing Elmore,
      Campo, Enser & Mottram (their ref. 14), and measure no oxidation marker in the heated pots (PV / AV only for the
      lard before use; xu2011 dossier sec. 1). Atlas: F30 cells 2 and 20.
    explanations:
      - "Carbonyl capture (Farmer): aldehydes, and alpha,beta-unsaturated ones fastest, are consumed by cysteine's amine / thiol and by NH3 / H2S; a true antioxidant would also cut the other oxidation products."
      - "Antioxidant MRPs (Xu): reductones / melanoidins slow lipid oxidation; predicts all oxidation products to fall, ketones included."
    tests:
      - "Xu 2011's own Table 2 (xu2011 dossier sec. 2; oxidised lard alone vs + Cys / Xyl, ug/mL): saturated methyl ketones are not lowered (2-decanone 1.22 -> 1.52, 2-tridecanone 1.15 -> 1.27, 2-nonanone n.d. -> 1.17), while the enone (E)-3-octen-2-one, a Michael acceptor, falls 2.63 -> n.d. and 2-pentylthiophene (H2S + dienal) appears: Farmer's discriminator, applied to Xu's data, favours capture."
    status: explained
    remedy: >-
      Read the aldehyde fall in lipid + Cys + pentose pots as capture by the Maillard reactants (cysteine, NH3, H2S),
      not as an antioxidant effect; no lipid-oxidation rate in the lipid lane is to be lowered by Maillard products on
      the strength of xu2011. Antioxidant claims need an oxidation marker (PV, conjugated dienes, O2 uptake) measured
      after heating.
    affects:
      - farmer1992_tab1_lipid_volatiles_pm_cys_rib
      - xu2011_table2_lipid_oxidation_volatiles_lard_vs_lard_maillard

  - id: CF-089
    kind: conflict
    scope: sulfur_rows
    sources: [arnold1971, grosch1992]
    quantity: "effect of cysteine on thermal thiamine degradation (and so on thiamine-derived MFT / H2S), ~100 C, pH 5-7, dilute"
    observation: >-
      Dwivedi & Arnold 1971 (thiamine 0.12 mM, 0.1 M phosphate, boiling water, 30 min): with cysteine 1 mg/mL (8.3 mM,
      ~70x the thiamine) "no thiamine was lost" at pH 5-7, and all H2S came from cysteine (arnold1971 dossier sec. 1,
      3.1; PDF p. 924). Grosch & Zeiler-Hilgart 1992 (thiamine 60 uM, 0.2 M pyrophosphate pH 5.7, 2 h reflux, SIDA):
      cysteine 0.65 mM (~11x the thiamine) raises thiamine-MFT x7 (4.7 +- 1.2 -> 33 +- 3.7 ug / 500 mL, Table II rows
      1, 4), while ribose + cysteine alone gives < 0.1 ug, so the MFT needs thiamine to degrade (grosch1992 dossier
      sec. 1; PDF abstract: "Addition of cysteine ... enhanced the formation of MF-SH from thiamine"). Atlas: F27 cells
      for arnold1971 (cysteine arm) and grosch1992 (Tables II, III, VIII).
    explanations:
      - "Cysteine dose: Grosch's own dose series (Table III, thiamine 30 umol + ribose 670 umol, Cys 0-2720 umol) peaks at 170-325 umol (Cys : thiamine ~6-11) and falls to 2.0 ug at 2720 umol (~91x), below the cysteine-free 5.2: at Arnold's ratio (~70x) Grosch also sees less thiamine-MFT."
      - "Detection: thiamine-MFT is a small fraction of the thiamine (33 ug MFT = ~0.29 umol, ~1 % of 30 umol), so Grosch's x7 needs only ~1 % of the thiamine to degrade, likely within the resolution of Arnold's colorimetric duplicate assay ('no thiamine lost')."
      - "Time and medium: 30 min in phosphate (Arnold) vs 2 h in pyrophosphate (Grosch)."
    tests: []
    status: open
    remedy: >-
      The engine's thiamine route (sulfur.py "THE THIAMINE ROUTE") is first order in thiamine with no cysteine term,
      and its H2S share comes from Arnold's cysteine-free series. Until a cysteine x thiamine series with thiamine
      measured is on disk, treat the cysteine effect on the thiamine route as dose-dependent and unmodelled: do not fit
      a cysteine-free thiamine constant to cysteine-rich pots without a declared band, and score Grosch's Table III shape
      (optimum then fall) as a directional check, not a level.
    affects:
      - arnold1971_figs2_3_thiamine_loss_ph_time
      - {file: src/kinetic_core/sulfur.py, symbol: "THE THIAMINE ROUTE"}

  - id: CF-090
    kind: conflict
    scope: sulfur_rows
    sources: [hincelin1992, bolton1993]
    quantity: "effect of added xylose on MFT formed from thiamine"
    observation: >-
      Hincelin, Ames, Apriyantono & Elmore 1992 (thiamine HCl 0.05 mol +- xylose 1 mol in 250 mL water, held at pH 7
      with NaOH, 1 h in a Likens-Nickerson SDE head, ~100 C, relative areas): xylose raises MFT 2 -> 14 % of the isolate,
      "a 4-5-fold increase in absolute yield", and doubles H2S (hincelin1992 dossier sec. 1). Bolton, Reineccius,
      Liardon & Huynh-Ba 1993/1994 (bouillon solids, 30 %, pH 5.5-5.8, a_w 0.83, sealed vial, 120 C, 1 h, SIDA-like
      GC/MS-SIM): 6.3 mM xylose leaves MFT unchanged (489 +- 90 vs 425 +- 103 ng, n = 3, t ~0.8) and the 34S share
      unchanged (12.50 vs 12.11 %); the authors cite Hincelin as the contrasting result (bolton1993 dossier sec. 3,
      item 8). Bolton's citation gives Hincelin's temperature as 140 C; Hincelin's pot boiled (~100 C, not printed).
      Atlas: F27 cells for bolton1993 and hincelin1992; F27 condition_dependence.
    explanations:
      - "Sugar background: Hincelin's baseline is thiamine with no sugar; Bolton's already holds glucose 46.8 mM (3.4x the thiamine) and IMP (a ribose source), so 6.3 mM xylose adds little carbonyl."
      - "Sugar dose: xylose : thiamine 20 : 1 (Hincelin) vs ~0.5 : 1 (Bolton)."
      - "pH: 7 (Hincelin, NaOH-held) vs 5.5-5.8 (Bolton); thiamine releases H2S only at pH >= 6.5 (Dwivedi & Arnold 1971, outside this pair), so a xylose + H2S -> norfuraneol / MFT route can run at pH 7 and not at 5.5."
      - "Measurement: open SDE stripping with relative areas (Hincelin) vs a sealed, isotope-checked pot (Bolton); water a_w 1 vs 0.83."
    tests: []
    status: open
    remedy: >-
      No single 'xylose effect on thiamine-MFT' factor: the two pots differ in sugar background, sugar dose, pH and
      read-out at once. Score each as its own directional check (Hincelin: MFT ratio ~4.7 at pH 7, sugar-free
      baseline; Bolton: ratio ~0.87, not significant, in a glucose-rich matrix). A pH-7 vs pH-5.5 xylose +- thiamine
      pair in one design would separate the pH explanation from the sugar-background one.
    affects:
      - hincelin1992_tables1_2_thiamine_xylose_volatiles
      - bolton1993_tab2_mft_34s_split
