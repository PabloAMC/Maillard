  - id: CF-011
    kind: conflict
    scope: sulfur_rows
    sources: [cao2017, zhai2019, zhai2021, zhang2025b, kang2026_SI, guan2012]
    quantity: "cysteine-route formation rate TTCA -> Cys-Amadori (k_form at 90 C) and the TTCA equilibrium K"
    observation: >-
      In route-calibration stage 1 the Xie laboratory's pots (Cao 2017: Cys + Xyl 0.40 M, 0.2 M phosphate pH 5.5, 90 C;
      Zhang 2025b blank: 40 mM, 0.2 M phosphate pH 6.5, 120 C) form the Amadori compound faster than the Jiangnan
