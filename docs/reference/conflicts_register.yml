        patent's 4 h level (the B59b-held-out shape) and holds only at the tight corner. FFT (0.022 /min) is within the
        bound at the loose corner. On Schieberle 2000 no pot-independent sink inside the bound fits the shape and keeps
        B60's 145 C fed rows: the zero-sink limit gives 360/30 -0.03 and 720/30 +0.06 dex but moves 7 rows out. The
