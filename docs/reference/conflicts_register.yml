  - id: CF-001
    kind: condition_error
    scope: sulfur_rows
    sources: [meynier1995]
    quantity: "MFT, FFT and furfural fold change pH 4.5 -> 6.5 in the cysteine + ribose pot (Table 3)"
    observation: >-
      The B2.3 hold-out (section 9, "MEYNIER 1995, directional") integrates Meynier's three pH-fold rows on the
      Hofmann pot: {"PENT": 100, "Cys": 33}, 145 C, 20 min, default buffer BUFFER_HOFMANN (0.5 M orthophosphate).
      The paper, p. 362 (Preparation of the reaction mixtures): "an aqueous solution containing the amino acid
      (100 mM) and ribose (70 mM) was prepared in disodium pyrophosphate (0.2 M). Five portions of 25 ml were placed
      in 50 ml volumetric flasks ... The final volumes were then adjusted to 50 ml with pyrophosphate buffer ...
      heated in sealed glass ampoules at 140 C under pressure for 1 h". So the pot is cysteine 50 / ribose 35 mM,
      0.2 M pyrophosphate, 140 C, 60 min. Every element of the simulated pot differs (concentrations 2x and 0.35x,
      buffer species and strength, temperature, time). The same rows also ran this way in the closed B2.1 / B2.2
      hold-outs. The directional claim PH-01 (results/validation/core_directional_scores.json) already runs the
      right pot (50 / 35 mM, 140 C, 60 min, pyrophosphate 0.2 M), so the two checks of one table disagree on its
      conditions. Second defect in the same rows: the furfural target "15-49x (midpoint 25x)" does not reproduce
      the table; the verified cysteine-pot fall is > 39x (meynier1995 dossier, Flags 2; 15x and 49x are the glycine
      and methionine pots).
    explanations:
      - "Copy-paste of the Hofmann pot when the rows were written (B2.1); no source states the Hofmann conditions for Meynier."
    tests:
      - "meynier1995.pdf p. 362 methods re-read 2026-10-29 (quoted above); the 2x make-up is explicit."
      - "Table 3 re-read: MFT 15.2 at pH 4.5, not detected (<0.1) at 6.5, so > 152x stands; the dossier's raster re-read gives furfural > 39x in the cysteine pot."
    status: error_confirmed
    remedy: >-
      scripts/generators/generate_kinetic_core_b2_3_holdout.py section 9 (and any successor hold-out): run m45 / m65
      as run(p, {"PENT": 35.0, "Cys": 50.0, "OX": OX_AMBIENT}, 140.0, 60.0, ph=4.5 / 6.5,
      buffer=BufferSpec(kind="pyrophosphate", pyrophosphate_mol_l=0.2, declared=True, source="Meynier & Mottram 1995
      p. 362")); change the FUR row's observed fold from 25 (label "15-49x") to the censored "> 39" (score as a lower
      bound). MFT > 152 and FFT 6.1 stay. The closed B2.1 / B2.2 artefacts are frozen evidence: annotate, do not
      regenerate.
    affects:
      - meynier1995_table3_cys_ribose_ph_ladder
      - {file: scripts/generators/generate_kinetic_core_b2_3_holdout.py, symbol: "9. MEYNIER 1995, directional"}

  - id: CF-002
    kind: self_contradiction
    scope: sulfur_rows
    sources: [kang2026_SI, kang2026]
    quantity: "temperature of Kang 2026 SI Table S5 (TTCA pH ladder 5.5 / 7 / 8)"
    observation: >-
      Table S5's caption and Fig. 1b's caption say 120 C ("under different pH values of 5.5, 7 and 8 at the
      temperature of 120 C"; Fig. 1 legend "(b) effect of pH (5.5, 7, and 8) at 120 C"). But S5's pH 7 column equals
      Table S4's 100 C column mean for mean (MFT 1.237, FFT 3.734, 2-acetylthiazole 3.079, sulfur total 13.978,
      grand total 17.359), not S4's 120 C column (MFT 1.388, FFT 4.107, total 42.024), and its SDs differ (MFT +-0.061
      in S5 vs +-0.142 in S4). The 120 C column of S4 is independently anchored by the main paper's Table 1 control
      row (MFT 1.388, FFT 4.107; kang2026_SI dossier sec. 3). So S5's pH 7 column is a 100 C result, and the
      temperature of its pH 5.5 and 8 columns is unknown (100 or 120 C). The methods (sec. 2.4) state all three pH
      values and all three temperatures without saying which combinations were run. No current fit or check reads
      S5; it touches the fit because the B2.3 fit cites it as the reason to discard S4's SDs.
    explanations:
      - "The pH series was run at 100 C and the caption is wrong (then S5 pH 5.5 / 8 are 100 C data)."
      - "The pH series was run at 120 C and the pH 7 column was pasted from the wrong S4 column (then pH 5.5 / 8 are 120 C data and the pH 7 anchor is lost)."
    tests:
      - "Kang2026_supplementary.pdf Tables S4 and S5 compared cell by cell 2026-10-29 (text layer; matches the dossier's 600-dpi raster read)."
    status: error_confirmed
    remedy: >-
      No model change now (S5 is unused). Ledger kang2026_si_table_s5_ttca_ph_ladder keeps temperature
      100_or_120_C_UNRESOLVED; if S5 ever enters, use only within-table pH ratios relative to the pH 7 column, run at
      100 C with a 120 C sensitivity arm, and count its pH 7 column as a copy of zhai2023foodchem Table 1 100 C (CF-005).
      Ask the corresponding author (Jiangnan) which temperature the pH series used.
    affects:
      - kang2026_si_table_s5_ttca_ph_ladder
      - kang2026_si_table_s4_ttca_tladder
      - {file: scripts/generators/generate_kinetic_core_b2_3_fit.py, symbol: "The SDs are NOT used"}

  - id: CF-003
