      -0.39, from 37.6 mM of cysteine carboxyl carried out with its amine declared destroyed
      (ph_state.AMINE_FATE_BASIS). Positive control, out of sample: Hou 2026 (GX-ARP 5 mM, water, 120 C) measured 7.0
