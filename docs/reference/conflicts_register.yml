  - id: CF-063
    kind: self_contradiction
    scope: sulfur_rows
    sources: [zhang2025b]
    quantity: "free xylose and cysteine loss in Zhang 2025b's blank (Figs. 2g-h): printed first-order fits vs the plotted points, and the pot's mass balance"
    observation: >-
      The printed rate fits do not reproduce the plotted points: extrapolated to t = 0 they imply C/C0 of 0.72 (xylose)
      and 0.47 (cysteine), not 1, and at 50 min only about half the charged reactants are accounted for by the measured
      species (route adjudication, 2026-10-29). [Correction 2026-11-01: the fits are for xylose and cysteine, Figs. 2g-h
      (blank k_Xyl 0.073, b -0.324; k_Cys 0.059, b -0.760; zhang2025b dossier), not for TTCA / CAMA / Lys-ARP as the old
      quantity said.] PER-PART STATUS: xylose fit -- EXPLAINED (a straight line through a curved ln trace including t =
      0); cysteine fit -- the printed constant does not belong to the plotted points (a paper-side slip or another
      series' fit); mass balance -- a 1 : 1 cysteine : xylose deficit formed within 5 min, passed to CF-076.
    explanations:
      - "The fits were made over a later window (an induction or heat-up period excluded) and the intercept was not reported."
      - "An unmeasured sink (oligomers, bound forms) takes up the missing half, so the mass balance is open, not wrong."
    tests:
      - >-
        Cluster 2 (2026-11-01, pre-registered T11; cf063_refit.py in the session scratchpad). XYLOSE: the printed line
        (k 0.073, b -0.324) is reproduced exactly by an ordinary least-squares line through the plotted t = 0 point and
        the 5-40 min points (k 0.0729, b -0.320); the non-zero intercept is the curvature of a fast first 5 min, not a
        heat-up lag (best lag fit puts the lag at -10 min, i.e. no lag). CYSTEINE: no contiguous window of >= 4 points,
        with or without t = 0, reproduces (0.059, -0.760) within 15 % / 0.1; every free fit gives k 0.071-0.074 /min, b
        -0.20 to -0.30, and the printed line misses the points by +0.23 to +0.37 (5-30 min) and -0.13 to -0.20 (40-50
        min). MASS BALANCE: cysteine pool (Cys + TTCA + CAMA) 69 % at 5 min, 58 % at 30 min, 52 % at 50 min; xylose pool
        65 / 57 / 53 %. The deficit is ~12-14 mM already at 5 min and grows slowly after (to ~19 mM), and it is EQUAL for
        cysteine and xylose at every time (12.3 vs 14.1 at 5 min, 19.4 vs 19.0 at 50 min).
    status: explained
    remedy: >-
      Xylose: explained (a straight line fitted through a curved ln trace including t = 0); the constant is an apparent
      5-40 min average and stays unused. Cysteine: the printed constant does not belong to the plotted points (paper-side
      slip or another series' fit); never used. The route table keeps using the points (Figs. 2a-c, 2g/h converted with
      C0 = 40 mM). The missing half is a 1 : 1 cysteine : xylose pool formed within the first 5 min (equal deficits
      exclude cystine or H2S, which take cysteine only, and sugar degradation, which takes xylose only): most likely an
      unmeasured Cys-Xyl adduct in fast exchange (open-chain / Schiff-base / hemithioacetal or a TTCA isomer outside the
      MRM transition), which is CF-076's question -- passed there as "a fast, reversible-looking 1 : 1 pool of ~30-50 %
      of the charge", not as a slow irreversible sink. P(adduct rather than a destructive sink) ~0.65. Extended 2026-11-05
      (M1 + M2 refit prereg, results/validation/kinetic_core_m1m2_supply_routes_refit_prereg.md sec. 0A and sec. 17 (c);
      PDF p. 7 at 400 dpi): the blank is re-confirmed (keyed ln(C/C0) -0.680 ... -3.910 match the 400-dpi read; OLS 5 - 50
      min k 0.0715, b -0.297; the printed line misses by +0.375 at 5 min, +0.23 at 30, -0.20 at 50; no window reproduces
      it, the prereg's search). Every printed cysteine intercept, x1 - x16, is -0.632 to -0.900 (xylose -0.303 to
      -0.337), and the x1 line misses its points by about +0.4 at 5 - 10 min and -0.6 at 50 min, read by eye at 400 dpi
      (the prereg marks this UNVERIFIED beyond eyeball; no lysine-arm point is keyed). So the cysteine fits misfit the
      panel, the lysine arms likely included; a label swap with another panel is P ~0.15 (the prereg's estimate). The
      cysteine part stays "never used"; the lysine arms' points are keyed before any claim rests on them. See also CF-109
      (the high-lysine arms below the ELSD curve's zero point).
    affects: [zhang2025b_fig2dh_rate_fits]
