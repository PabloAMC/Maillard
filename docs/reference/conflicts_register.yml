      10^-2.919 -> 10^-2.648, x1.87 (the earlier "~5x" was a shift in sigmas, not a fold); the residual gap at the joint
      fit is 3-6x (Cao's Cys-Amadori -0.33 to -0.57 dex, Zhai 2019's at 90 C +0.14 to +0.27). The Jiangnan pots also
      want K above Cao's measured band (K on its upper bound 0.075).
    explanations:
      - "Phosphate catalysis of the Amadori step: every Xie pot is in 0.2 M phosphate, every Jiangnan pot in water."
      - "pH: Cao's blank falls 5.49 -> 4.67 (0.5 h) -> 4.15 (5 h); Zhai 2019's starts at 7.4 and is never re-measured (its in-situ trajectory is unknown: carry it as latent, not measured); thiazolidine K rises ~20x from pH 5.6 to 7.5 (Kallen 1971, formaldehyde analogue). (Corrected 2026-11-01: the earlier 'falls to 4.9 (90 C)' is Zhai 2023 Food Chem's unattached 'pH from 7.0 to 4.9' in its TTCA 10 mM pots, not Zhai 2019; conflict_analyses/CF-011.md sec. 1, zhai2019 dossier sec. 2.) (Added 2026-11-01, cluster 5: Hou 2026's unbuffered ARP pot of the same laboratory network falls 7 -> 5.05 in 20 min, so Zhai 2019's latent band is realistic, not proven; Zhang 2025b is 0.2 M phosphate pH 6.5, start pH only.)"
      - "Concentration (0.4 M vs 0.08 M) and laboratory (method, calibration). (Cluster 5, 2026-11-01: monotone pH and concentration laws are excluded, because the two Xie pots bracket Zhai 2019 in both and are both faster; what is left of this line is the laboratory / quantification half, Jiangnan ELSD at low CAMA 0.2-5.6 mM, calibration unprinted, P 0.3.)"
      - "The Zhai 2021 rows run at the wrong pH (CF-010) bias k_ttca_deg and the ring opening that both arms share."
    tests:
      - "root-cause analysis 2026-10-29 (docs/reference/conflict_analyses/CF-011.md): most likely dihydrogen-phosphate catalysis of the Amadori step, Zhai's water ladder holding the formation barrier near its floor (0.45); the register's 'Zhai 2019 pH 7.4 -> 4.9' is Zhai 2023 Food Chem's, and '3.8 at 130 C' has no source on disk. Settled by the designed protocol's buffer arm C."
      - "results/validation/kinetic_core_cysteine_route_calibration_prereg.md: leave-one-source-out refits, review items 4, 5, 8 and sec. 6 verdict (constants not forwarded; stage 1b to include pH laws and phosphate catalysis)."
      - "docs/guides/LITERATURE_SEARCH_2026-10-29_phosphate_thiazolidine.md: no direct measurement of phosphate catalysis of TTCA -> Cys-Amadori, nor K(pH) for a cysteine-sugar thiazolidine at 60-140 C; nearest anchors Davidek 2002 (x1.3-3.5, degradation, 90 C), Munanairi 2007 (~10-12x per equivalent, 37 C, A280), Kim 1986 (thiazolidine k1 ~10x per pH unit 5.5-8, 25 C)."
      - "Cluster 5 probe 1, forced-input version, no engine (2026-11-01; docs/history/conflict_resolution_2026-11-01/cluster5/verdict.md sec. 4): apparent CAMA formation per TTCA, k_app = [dCAMA + k_cd integral CAMA] / integral TTCA at both edges of k_cd. Zhai 2019's own Arrhenius line has Ea 69 kJ/mol (scatter +-0.3 dex), not the 40 kJ/mol floor; the Xie pots run x3.1-3.3 (Cao, 90 C) and x1.6-3.6 (Zhang 2025b, 120 C) above it. The two Xie pots bracket Zhai in pH (4.2-4.7 and ~6.3-6.5 vs ~5-6) and concentration (400 and 40 vs 83 mM) and are both faster, so monotone pH and concentration laws are excluded; post-quench TTCA re-formation moves Zhai's TTCA by <= 5-15 % (<= 0.07 dex). Guan 2012 (third laboratory) shows phosphate speeds Amadori-compound DECAY at 110-130 C, which would lower CAMA, so phosphate must speed formation more than decay. Unexplained: Cao's first 30 min run at Zhai's rate (8.8e-4 vs 9.8e-4 /min). Remaining P: phosphate catalysis of formation 0.5, Jiangnan ELSD quantification of low CAMA 0.3, other (laboratory, heat-up) 0.2 -- below 0.6, so the entry stays open (note, 2026-11-01)."
      - >-
        resolve2_pyrbuf (2026-11-01, prereg first; docs/history/conflict_resolution_2026-11-01/resolve2_pyrbuf/, its
        red team binding): buffer catalysis is NON-SATURATING to 0.5 M in dilute pots, order 1.0 - 1.35 (Potman, E5
        TEST: I(0.5) / I(0.1) 5.7 against <= 1.67 for a Michaelis factor with K <= 0.1 M; power >= 0.85 at run-to-run
        noise; Kallen's plateau is a change of rate-determining step, CF-093). The DEV band kappa_P [5, 40] /M (Guan,
        Davidek, Zyzak, Bell; A3-provisional, pending its own prereg) gives x2 - 9 at 0.2 M: phosphate catalysis is
        SUFFICIENT for the 3 - 6x residual, not shown to occur. Kallen 1971b's no-catalysis-below-pH-5 test used
        carboxylates, not phosphate, and by microscopic reversibility a catalysed dehydration implies a catalysed
        ring-opening path, so Kallen does NOT place Cao's catalysis on the Amadori rearrangement (red team, required
        item 4). Guan (DEV): acetate / citrate kappa 1.6 / 3.4 /M on Amadori decay vs phosphate 28 - 38 (<= 0.1x
        phosphate at 110 C, <= 0.3x at 130 C), while carboxylates speed browning (Saunders, Rizzi): a citrate arm at
        equal in-situ pH separates step-specific phosphate catalysis (citrate ~ water) from general catalysis (citrate
        0.3 - 1x phosphate); P(step-specific) 0.5 (CF-094). P(phosphate catalysis of formation) 0.5, unchanged.
