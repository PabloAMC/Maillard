  - id: CF-065
    kind: conflict
    scope: sulfur_rows
    sources: [hofmann1998_reconciliation, zhai2023jafc, munch1997]
    quantity: "molar yield of FFT from furfural + sulfide and of MFT from norfuraneol + sulfide"
    observation: >-
      FFT from furfural + H2S is 0.48 mol % in Hofmann & Schieberle 1998 Table 3 (20 mM each, 0.5 M phosphate pH 5,
      145 C, 20 min, isotope dilution) but about 24 % in Zhai 2023 JAFC Fig. 6a (furfural + AMMONIUM SULFIDE 10 mM
      each, pH 7.0, 120 C, 20 min, pressure bottle, headspace not stated; g/L axis, semi-quantitative); MFT from
      norfuraneol is 0.19 % (Hofmann Table 4) against about 34 % (Zhai Fig. 6b). A 50-180x gap at milder temperature
      (thiol adjudication, 2026-10-29). (Corrected 2026-11-01: the Zhai source is the JAFC paper's Fig. 6, not Zhai 2023
      Food Chem, which has no fed-sulfide figure; and its sulfide is (NH4)2S, so NH3 is co-released -- not H2S alone.
      data/lit/source_verification/thiol_submodel.yml, ledger zhai2023jafc_fig6_sulfide_furanoids; zhai2023jafc
      dossier sec. 3.3.) Munch 1997 Table 5 reprints Hofmann's 0.48 % (expt 3, CF-101) and adds an H2S dose
      (0.25 mmol: 130.1 ug, 0.12 %) and a cysteine arm (1 mmol: 25.3 ug, 0.02 %) on the same furfural pot.
    explanations:
      - "pH: at pH 7 a larger share of the sulfide is HS-, the nucleophile; predicts the gap shrinks at matched pH."
      - "Quantification: Zhai's thiols are semi-quantitative (no authentic-standard response factor); predicts the gap is a scale factor common to all of Zhai's thiol rows."
      - "A co-reactant: the NH3 / NH4+ released by Zhai's (NH4)2S (20 mM ammonium against 10 mM furanoid) opens a route Hofmann's binary H2S system lacks; predicts the gap depends on the ammonium charge."
      - "Thiol loss during Hofmann's 20 min hold at 145 C (MFT less stable than FFT); post hoc (not pre-registered), unbounded without an Ea. For FFT it predicts a cysteine-over-H2S FFT ratio ~0.2 in Munch T5 (2026-11-03)."
    tests:
      - "Cluster 3 (2026-11-01, cf065_speciation.py, engine B51 as shipped): in-situ pH 5.34 (Hofmann, 145 C, 0.5 M phosphate) vs 6.33 (Zhai, 120 C; the 20 mM NH4+ buffers it down from the 7.0 label); HS- 9.6 % vs 47 % of dissolved sulfide (4.9x, not ~50x); dissolved sulfide 15-24 % (Vg/Vl 3) vs 34-70 %. Implied second-order gap log10(Zhai / Hofmann) at 120 C after temperature, headspace and speciation: FFT +1.38 [0.94, 1.83] dex, MFT +2.52 [1.96, 3.07] (median [5-95 %]); the condition corrections remove ~1.1 dex. P(gap <= 0.5 dex) = 0 for both. The residual differs between the thiols by 1.1 dex, so one common Zhai scale factor cannot be the whole residual. Negative controls pass (Hofmann T7 1 vs 2 mmol: operator 2.00x, measured 2.22x)."
      - "Munich cluster (2026-11-03, docs/history/conflict_resolution_2026-11-03/munich_sulfur/results.md, pre-registered; munch1997.pdf Table 5 and hofmann1998.pdf Table 10 read on the page). (1) Order in H2S from Munch T5 expts 2 / 3: n = 1.04 [0.90, 1.18]; FFT is linear in sulfide up to 20 mM (no saturation, no threshold; fixed sink <= 1.8 % of the dose), the yield scales with the H2S charge; rate-limited and H2S-limited (complete conversion then loss) structures both predict 3.7-4.1, so this excludes a saturating yield, not the low-conversion assumption behind cluster 3's transfer (red team 2026-11-03). Shipped B60 engine: 3.95 vs 4.23 (-0.03 dex). (2) 0.11-0.48 % of the furfural (0.46-0.48 % of the H2S) ends as FFT: below 1 %, so formation is rate-limited if FFT survives. (3) Cysteine-over-H2S contrasts at 1 mmol each, 50 mL: FFT from furfural 0.046 (Munch T5 1 / 3), inside the Zheng-thermolysis donor band 0.028-0.075 at pH 5.0-5.34; MFT from NF 0.24 (Hofmann T10), 0.5-0.9 dex above it, so cysteine does more than release H2S on the NF route (reductant or MFT protection). (4) The shipped engine predicts the furfural contrast 0.234 (+0.71 dex; absolute +0.94 dex): it reaches Hofmann's 0.48 % by converting ~all furfural to FFT within ~15 s and destroying ~99 % of it (r_fur_fft_hs + r_fur_fft 19.5 mM, 97.7 % of the furfural; closure 0.1 % on a 20001-point grid; 0.83 vs 2.8 mol % is the fitted pH drift 5.0 -> 5.34 vs a pH-5.0 clamp, the parameter sets are identical). The contrast is governed in the engine by furfural's lifetime in the Cys arm: k_fur_decay x3 gives R 0.023 with Hofmann's 0.48 % unchanged; slow formation with a surviving product gives 0.0055 under the engine's furfural sink. It constrains furfural lifetime x k_cys_h2s x FFT survival jointly and does not discriminate product loss. Closing it via k_cys_h2s needs ~8x (P 0.15); a furfural-Cys adduct at HMF-like rates is negligible (red team, munich_sulfur/redteam.md)."
      - >-
        M0 checks batch 2, CK-34 (2026-11-06; results/validation/m0_checks_batch2.md sec. 2): the remedy's proposed H2S
        vessel partition (Kaw(145 C) 2.18, pK1 6.49, in-situ pH 5.34; phi 0.141 at Vg/Vl 3, 0.330 at 1), applied to
        every H2S-consuming step, moves Munch's cysteine-over-H2S FFT contrast only from 0.234 to 0.147 - 0.157 (+0.51
        to +0.53 dex against the measured 0.046; refutation line 0.20 dex); the H2S dose ratio stays in band (3.70 -
        3.75 vs 4.23). Furfural is fully consumed in both arms. Restoring fed_furfural_h2s_FFT under the partition needs
        k_fur_fft / k_fur_fft_hs x10^0.84 (~1 / phi), which returns the contrast to +0.71; k_nf_mft's bias is +0.23 dex,
        not 0.6 - 0.8. The partition is a correct conditions term that the fitted furfural constants already absorb; it
        does not explain the contrast. Nominated instead: the furfural lifetime in the cysteine arm (k_fur_decay) and FFT
        survival in the hold, i.e. deciders (ii) and (iii).
    status: open
    remedy: >-
      Explained in part (conditions ~1.1 dex, with the second-order law now checked on Munch's H2S dose); the residual
      stays open. Notes (P < 0.6): FFT residual -- quantification (Zhai's RF = 1 scale) 0.50, NH3 chemistry 0.25,
      product loss in Hofmann's hold 0.25 (the Munch cysteine contrast does not discriminate it: red team), other 0.10;
      MFT residual -- quantification 0.40, product loss / a depression that cysteine relieves 0.25 (held until the engine's
      own R_NF 0.14 is decomposed: it already carries r_mgo_cys_h2s and ch_cys_ox), NH3 0.20, other 0.15.
      Zhai Fig. 6 stays shape-only: sub-model 4 fits Zhai's thiol rows shape-only (semi_quantitative, SCALE_TAU = inf),
      so only the isotope-dilution rows set the absolute yield; the probe reports the two laboratories' residual levels
      separately. Data (proposed, not applied): munch1997 Table 5 enters as two within-study ratio rows against expt 3
      (count once, CF-101): the H2S-dose ratio as VALIDATION only, sigma >= 0.1 (as a fit row it would count expt 3 twice; shipped engine passes, -0.03 dex), and the
      cysteine-over-H2S ratio as a HELD-OUT DIAGNOSTIC (shipped engine fails, +0.71 dex), not a fit row, until the
      engine's fed-pot FFT turnover is examined at the mechanism step; both ratios are robust to CF-102 (<= 0.09 dex
      between 50 and 100 mL). No constant changes on this evidence (no tuning of k_fft_decay or k_cys_h2s). Deciders:
      (i) one fed pot, furfural or norfuraneol + Na2S vs + (NH4)2S at matched in-situ pH, stated fill, SIDA after
      cooling; (ii) residual free furfural and H2S at 20 min in Hofmann's fed furfural + H2S pot (engine ~0 for both;
      slow formation > 90 % furfural left), now the decider of the cysteine contrast; (iii) direct FFT stability: authentic
      FFT 20 mM heated 20 min at 145 C, pH 5, 0.5 M phosphate, with and without H2S, by SIDA. Engine consequence (proposed, not applied): the B2.3 fed-sulfide rows
      charge 20 mM H2S as fully dissolved, while at Hofmann's Vg/Vl = 3 and 145 C only 15-24 % is dissolved, so
      k_fur_fft_hs and k_nf_mft are biased low by 0.6-0.8 dex against small-headspace pots; add an H2S vessel-partition
      operator (Kaw(T) from henry_constants.yml, Vg/Vl per pot, declared band when unstated).
      [Amended 2026-11-06 (register pass; M0 checks batch 2, CK-34): the partition does not explain the
      cysteine-over-H2S contrast. It is a conditions term the fitted furfural constants absorb (x10^0.84, ~1 / phi), so
      the bias above holds for k_fur_fft / k_fur_fft_hs (0.84 dex) and not for k_nf_mft (+0.23 dex). Carry the operator
      in any refit that mixes vessels, refitted together with k_mgo_mp and the ribose + H2S route (three in-sample rows
      shift by more than 1 sigma under it); it is not a stand-alone engine change. The contrast's candidates are the
      furfural lifetime and FFT survival, decided by (ii) and (iii).]
    affects:
      - hofmann1998_t3_fft_c5_h2s
      - hofmann1998_t4_mft_ribose_nf_h2s
      - zhai2023jafc_fig6_sulfide_furanoids
      - munch1997_tab5_fft_furfural_cys_h2s
      - {file: scripts/generators/generate_kinetic_core_b2_3_fit.py, symbol: fed_furfural_h2s_FFT}
      - {file: src/kinetic_core/parameters_sulfur.py, symbol: k_fur_fft_hs}
