  - id: CF-086
    kind: self_contradiction
    scope: corpus
    sources: [liu2023b, cerny2003]
    quantity: "share of 2-methyl-3-furanthiol from recombined ribose fragments, [13C5]-ribose 1:1 + cysteine, 0.5 M K3PO4 pH 5.88, 168 C, 20-60 min (CAMOLA, EI-MS)"
    observation: >-
      Liu 2023 (LWT 182:114874) prints that ribose-fragment recombination makes an "auxiliary contribution (19%)" to
      MFT (sec. 3; liu2023b dossier sec. 2). Its Table 3 (re-read from data/articles/Liu2023b.pdf, 2026-11-01) gives MFT
      at 20 min as M+0..M+5 = 41 / 3 / 2 / 1 / 12 / 40 (40 / 3 / 2 / 1 / 12 / 41 at 40 min), so the 19 % is the sum of
      the M+1..M+4 channels and is carried mostly by M+4. M+4 / M+5 = 0.30, which equals MFT's NIST EI [M-H]+ / M+
      ratio, 0.28: the M+4 channel is the fully labelled molecule's M-1 ion. The Methods say the hydrogen loss "were
      adjusted by [M - 1]+/[M]+", but the table carries the uncorrected ratio, so the methods and the table disagree.
      With M+4 corrected (12 - 0.28 x 40 ~ 1), the fragment share is ~6-7 %, the level of the label's impurity and of
      Cerny & Davidek 2003's non-(0, 5) channels at 95 C (<= ~5 %, cerny2003 Table 2 row 7). Found by
      docs/history/mechanism_reviews_2026-10-31/thiols.md sec. 0 (P 0.8); the atlas cells F23 cell 6 and F24 cell 6
      read it.
    explanations:
      - "EI-MS artefact: the claimed [M-1]+ correction was not applied (or not applied to the labelled ion), so the labelled MFT's own M-1 fragment is read as an M+4 isotopologue."
      - "A real fragment route at 168 C (the paper's reading): would need an M+4 isotopologue that by chance matches the EI [M-H]+ ratio in three unrelated compounds."
    tests:
      - "The same table's furans show the same signature (thiols.md sec. 0): furfural M+4 / M+5 = 23 / 21 against NIST [M-H]+ / M+ 0.99; 2-methylfuran 20 / 29 against 0.58. Each M+4 tracks its own compound's EI M-1 ratio."
      - "The unlabelled : labelled imbalance (41 : 52 at 20 min) equals the unlabelled ion's uncounted M-1 (thiols.md sec. 0)."
    status: explained
    remedy: >-
      Read Liu 2023's MFT labelling as ~94 % intact C5 and ~6 % fragments (band 5-19 % until the authors' raw spectra
      settle it); no measured rise of the fragment share with temperature follows from it. The atlas cells F23 cell 6
      (dominant, intact C5) and F24 cell 6 (conflicting) cite this entry. The dossier's sec. 2 sentence and the ledger
      note of liu2023b_carbon_module_labelling still print the uncorrected 81 / 19 %; annotate them in a dossier
      wave (not edited here). No engine constant uses the number.
    affects: [liu2023b_carbon_module_labelling]

