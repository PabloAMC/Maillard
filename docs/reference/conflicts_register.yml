      cross-paper estimate with Bork 2022); MGO alone 65 / 31 % left at 30 / 120 min fits second order, k2 ~1.8 - 1.9e-4
      /mM/min ("suggested, not identified": two time points); amino acids speed MGO loss 2.6 - 9.7x at 30 min; the
      excess over MGO alone scales as [Ala]^0.75 (0.84 on 0 - 120 min), assuming the MGO-alone channel adds. Kanzler's
      Ea lies above even B1's CI. pH drift and O2 unstated, no come-up correction. CF-095 covers the missing MGO + amine
      consumption, not the barrier or the order.
      [Added 2026-11-05, two notes, each checked against its dossier. (1) Kanzler 2021 (kanzler2021 dossier sec. 4 items
      1 - 4; same laboratory and nominally the same pot: MGO 100 mM alone, pH 5.0 unbuffered, 100 C, triplicates) gives
