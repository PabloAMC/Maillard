      fed_thiamine "T8" -> "T10"; the same five changes in the FIT_ROWS anchors (fed_ribose_h2s_MFT, fed_nf_cys_MFT,
      fed_c2c3_MFT, fed_c2c3_MFT_pH3, fed_c2c3_MFT_pH7, fed_thiamine_MFT); "T3/T6" -> "T3/T4" in src/kinetic_core/sulfur.py
