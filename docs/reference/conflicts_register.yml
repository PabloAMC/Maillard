    kind: self_contradiction
    scope: corpus
    sources: [cremer2000, weenen2001, hofmann2000, ge1997, kim1996, agcam2022, xia2022]
    quantity: "trunk papers that contradict themselves (none read by a current fit)"
    observation: >-
      From the dossiers: cremer2000 - methods "70 to 110 C", figures 80 / 90 / 100 / 110 C (Flag 3). weenen2001 -
      glucose + Phe at pH 3.2 is 0.006 % in Table II entry 3 and 0.03 % elsewhere (5-fold). hofmann2000 - Experimental
      says "0.5 mmol/L" buffer (twice), table footnotes 0.5 mol/L (Tables 1, 2, 3, 5) or 0.1 mol/L (Table 4). ge1997 -
      a rate constant that falls with a 14 C rise; Table 2's R2 (0.6046 at 54 C) below the stated 0.714 threshold;
      Table 1's K and Table 2's k1 mutually inconsistent at 68 and 81 C. kim1996 - Fig. 4 caption 1 % glucose, text p.
      61 10 %. agcam2022 - methods 0-90 min, results prose 0-120 min; three t1/2 values inconsistent with their own k.
      xia2022 - "pseudo-first-order" in words, zero-order units (mmol L-1 min-1) in Table 1. Ledger statuses:
      digitised / figure-only / text-only for all. PER-PART STATUS (2026-11-01): hofmann2000 -- RESOLVED (2026-10-31,
      below). xia2022 -- RESOLVED (P 0.9): the printed unit is right; Table 1 / 2 k are zero-order initial slopes and
      "pseudo-first-order" is the slip. ge1997 R2 item -- RESOLVED (P 0.8): the threshold is a critical value of r, the
      table prints R2. ge1997 K vs k1 at 68 / 81 C -- OPEN (implied 1.19 / 1.13 vs 0.71 / 0.96: not a unit factor or a
      transposition). cremer2000 -- EXPLAINED (P 0.85): "70 to 110 C" is the headspace oven's range for all experiments,
      not the isotherm set. agcam2022 -- EXPLAINED (P 0.85) by its dossier's rulings (methods authoritative, 0-90 min;
      the three t1/2 refused). weenen2001 -- OPEN, a run difference rather than a slip (P(single slip) 0.15). kim1996 --
      OPEN (1 % vs 10 %, P 0.5 either way). Overall status open while any part is open.
    explanations:
      - "weenen2001: two runs of one nominal protocol, not one slip: Table II vs Table III differ x5 (glucose) and x0.31 (Glc-Phe ARP) in opposite directions; the text supports Table II's glucose cell (Phe alone 0.006 %). Methods pH 3.5 vs tables pH 3.2."
      - "kim1996: undecided; Fig. 4's M-1 level against the 1 % spikes of Figs. 2-3 (same matrix) would show a 10x loading."
    tests:
      - "xia2022 (cluster 1, 2026-11-01): Fig. 5B (3-DG) is drawn to 15 mmol/L over 0-80 min; k(3-DG, 130 C) 0.0357 read as min-1 on 200 mM glucose would reach ~190 mmol/L by 80 min, read as mmol L-1 min-1 2.9 mmol/L, inside the axis; G-ARP 0.43 x 35 min = 15 mmol/L."
      - "ge1997: the 0.714 is the critical value of a correlation coefficient (rs, alpha 90 %); sqrt(0.6046) = 0.778 > 0.714, and every printed R2 (0.6046-0.7417) gives r 0.78-0.86."
      - "cremer2000: the sentence reads heated '3 to 120 min in the headspace oven at 70 to 110 C', matched by the autosampler's '70-110 C; 3-120 min'; powders ran at 90 C; isotherms 80 / 90 / 100 / 110 C (Figs. 6-7), four Arrhenius points; no 70 C series."
      - "weenen2001: glucose + Phe 0.006 % (Table II) vs 0.03 % (Table III), x5; Glc-Phe ARP 1.6 % vs 0.5 %, x0.31: no single factor maps one table onto the other."
    status: open
    remedy: >-
      Carry each open part as condition_uncertain in its ledger entry; resolve only if the paper is ever entered as a
      row. 2026-10-31: hofmann2000 IS now entered (fit table strecker_hofmann2000, two readers + adjudication): the
      buffer is ruled per pot from its table footnote (0.5 mol/L Tables 1 - 3, 5, Fig. 3; 0.1 mol/L Table 4 as printed,
      alternative 0.5), the Experimental's 0.5 mmol/L a misprint (it cannot hold pH 7 against 0.1 M reactants).
      2026-11-01: xia2022 rows in mmol L-1 min-1 as zero-order initial slopes at fixed 200 + 200 mmol/L; cremer2000
      isotherms 80 / 90 / 100 / 110 C; ge1997 R2 item closed, K / k1 at 68 and 81 C remain condition_uncertain;
      weenen2001 both tables kept as separate runs, and any use of the ARP / glucose PA contrast at pH 3.2 carries the
