    remedy: >-
      Fix in its own PR (it moves shipped numbers): r_flp_decay without LYSP, k_glyc re-derived -- or keep the
      lysine-returning scheme and refit k_flp_decay against Nguyen's measured time courses (Figs. 2-3, mass balance
      Fig. S1B), not his constants; the S1B lysine balance decides between the two. Until then the arm is flagged.
