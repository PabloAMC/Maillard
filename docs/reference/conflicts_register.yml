  - id: CF-015
    kind: conflict
    scope: sulfur_rows
    sources: [us10076126, us8920862, schieberle2000, hofmann1998_reconciliation]
    quantity: "MFT / FFT ratio and MFT time shape in buffered cysteine + xylose pots (Nestle patents vs each other and the papers)"
    observation: >-
      US 10,076,126 (xylose + Cys 1:1, 0.23-0.25 mol/kg, phosphate pH 5.5, 110 C, 4 h, isotope dilution): MFT/FFT 3.6
      (2.9-4.4) at 4 h; MFT(t)/MFT(4 h) 0.008 / 0.067 / 0.31 / 1 at 0.5 / 1 / 2 / 4 h (a lag, then acceleration). US
      8,920,862 (xylose : Cys 3:1, 95 C, 6 h, buffer arm): MFT/FFT 0.50 - a 7x disagreement between the two patents;
      its structured-lipid arm raises MFT 10.1x and FFT 7.4x over buffer. Hofmann 1998 (145 C, 20 min, pH 5): MFT/FFT
      19.8/12.1 = 1.6. Schieberle 2000 (100 C) rises for 12 h without the patent's lag. The shipped B60 constants give
      the Nestle curve 0.42 / 0.80 / 1.05 / 1 (front-loaded).
    explanations:
      - "Different temperature, xylose:cysteine ratio and concentration between the two patents."
      - "Patent analytics (single runs, not peer reviewed)."
    tests:
      - "root-cause analysis 2026-10-29 (conflict_analyses/CF-015.md): two opposite displacements: US 8,920,862's concentrated 3:1 xylose recipe favours FFT (0.40); US 10,076,126's standards went through the heating (0.25). MFT agrees across sources; FFT differs."
      - >-
        Cluster 4 (2026-11-01, docs/history/conflict_resolution_2026-11-01/cluster4/results.md sec. 5), outside tests of
        the sugar : cysteine ratio. Within study (Xu 2008, 140 C, one laboratory, a double ratio free of response
        factors): ribose x3 at fixed Cys moves MFT/FFT 8.6 -> 0.75, -1.06 dex (xu2008 dossier), against the patents'
        -0.86 dex for xylose x3: same sign, similar size. Across isotope-quantified pots: 1:1 reads 3.6-3.8 (US
        10,076,126, co-heated standard) and 5.4 (Yiltirak 2026, 100 C / 4 h, standard after heating); 3:1 reads 1.4
        (Schieberle 2000, 6-12 h), 1.5-1.6 (Hofmann 1998, 145 C) and 0.50 (US 8,920,862): three laboratories. IS timing
        alone predicts the co-heated pot above every post-IS pot; Yiltirak (post-IS) is higher, so IS timing is at most
        a co-term (it would need lambda_M - lambda_F = 0.0082 /min for all 0.86 dex; with Kumazawa 2003's FFT loss that is
        lambda_M 0.012-0.015 /min). Temperature runs the wrong way (Yiltirak MFT/FFT 5.4 -> 1.06 from 100 to 130 C, so 95
        C should raise US 8,920,862's ratio). P(ratio >= half the gap) 0.6; P(IS timing >= half) 0.25.
    status: explained
    remedy: >-
      Explained 2026-11-01 (cluster 4, P 0.6) for the RATIO half: the sugar : cysteine ratio is the main cause, IS timing
      a possible co-term. MFT/FFT is reported, not fitted; the sugar : Cys dependence is a test of the engine's
      furfural -> FFT vs C5 -> MFT split (score Xu 2008's double ratio, free of response factors). The SHAPE half is not
      explained: the US 10,076,126 shape and level are scored only through a co-heated-standard tracer operator (the
      spike run under the same loss law), which is not built; until then they stay unscored (red team of clusters 2-4,
      claim 4). The US 8,920,862 level stays a B59b hold-out (plan).
    affects:
