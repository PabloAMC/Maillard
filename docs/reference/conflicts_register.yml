  - id: CF-093
    kind: conflict
    scope: other_lane
    sources: [kallen1971b, potman1989, davies2005, zyzak1995, thornalley1999, larralde1995, saunders1966]
    quantity: "concentration law of buffer catalysis (the E5 fix's 'saturating' factor)"
    observation: >-
      Kallen 1971b: phosphate catalysis of thiazolidine formation saturates at x3.1 - 4.4 (two-reader re-read of the
      Fig. 7 ceilings C3 / C2 = 4.43 / 3.06 / 4.06; half-saturation 17 - 29 mM, pH 6.1 - 6.6, 25 C, I 1.0 M KCl).
      Potman 1989 (glucose consumption, 100 C, pH 5.6, E5 TEST): no saturation to 0.5 M, initial-rate order 1.34; per-M
      increment flat 22 - 29 /M on the 5-h secant but 48 - 81 /M on the 3-h secant (window-dependent; k0 +-24 % at 5 h,
      +-60 % at 3 h from read error). Potman's own Series A (phosphate 1.2 M in a 30 - 40 % dry-matter pot) gains only
      x11.6 (kappa ~9 /M) where a linear kappa 25 predicts ~x31: 0.43 dex short. Davies 2005 (acetate, browning, 50 C):
      order 1.15 - 1.3 to 0.5 M. Zyzak 1995 (fructoselysine decay, 37 C, chelator): linear to 0.2 M. Thornalley 1999
      (E5 TEST): convex 10 - 100 mM. Larralde 1995 (keyed held-out, not in a frozen split): a linear law k0 + kP [P].
      The E5 fix in ENGINE_VS_LITERATURE.md sec. 3 says "saturating".
    explanations:
      - >-
        Change of rate-determining step (Kallen's own reading): catalysis acts on the catalysed dehydration; the
        plateau is the uncatalysed amine attack, so saturation is network-specific, not a property of the buffer. A
        LUMPED step whose uncatalysed part can become rate-limiting (the engine's r_schiff lumps attack and dehydration)
        therefore carries a hyperbolic factor in c by Kallen's own F-net algebra; "no Michaelis term" holds only for
        steps the network resolves.
      - "Buffer binding / catalyst saturation that would apply to every step (the E5 fix as written)."
      - "Concentrated-matrix ceiling (Potman Series A, 1.2 M phosphate at 30 - 40 % dry matter; the Potman dossier's own warning that a linear term over-predicts in concentrated matrices by >= 5x): water activity / ionic strength / buffer capacity limit the factor in foods; Wolf 1977a's pots carry ~1-2 M buffer in the water phase."
    tests:
      - "resolve2_pyrbuf T1 (Potman, E5 TEST, 5-h secant): I(0.5) / I(0.1) = 5.7 (4.6 - 7.3); a Michaelis factor with K <= 0.1 M allows <= 1.67. Power at run-to-run noise (Fig. 4 vs Fig. 7, 3 - 8 % points; red team potman_power.py): the rule calls a linear law non-saturating 94 % (sd 5) / 85 % (sd 8), a K 0.1 M law 0.7 % / 8 %, i.e. power >= 0.85. T1 rejects K <= ~0.3 M; K 0.5 M (max ratio 3.0) sits on the threshold."
      - "resolve2_pyrbuf T4 (Kallen, E5 TEST) re-scored by the red team on the re-read ceilings x4.43 / 3.06 / 4.06: the buffer-free attack plateau (Fig. 6, pH 4.5 - 5.2, 10^3.4 per free base) predicts x3.6 / 3.9 / 6.8 at pH 6.12 / 6.31 / 6.62, residuals +0.09 / -0.11 / -0.22 dex (pass). It checks level consistency only: the predicted rising pH trend is not seen, and a saturating law fits Kallen equally well. CF-076 already uses Kallen's saturation to reject a linear catalysed exchange (E1c)."
      - "resolve2_pyrbuf T5 (Thornalley, E5 TEST): GO, 3-DG and MGO convex in phosphate (50 mM point 15 - 28 % below the 10 - 100 mM chord)."
      - "Unlisted systematic confounds (red team): phosphate at pH 5.6 is 1.6 units below pKa2, so buffer capacity and pH drift scale with concentration (Potman's 0.4 / 0.5 M arms plateau after 3 h; drift admitted, not reported); ionic strength co-varies with buffer in Potman, Bell and Guan (only Kallen held I at 1.0 M). Neither plausibly gives x3.4 alone, so the rejection of saturation with K <= 0.3 M survives; 'linear' itself is not shown (order 1.0 - 1.35)."
    status: open
    remedy: >-
      Note 2026-11-01 (resolve2_pyrbuf, red-teamed): NON-SATURATING with K <= 0.3 M in dilute pots is explained, P
      0.8; "linear, no Michaelis term" as an engine law for lumped steps and concentrated foods is NOT, P 0.45; so the
      entry stays open. Rewrite the E5 fix as "non-saturating to 0.5 M in dilute pots (order 1.0 - 1.35)", a per-step
      factor k_s = k_s,u (1 + sum_b kappa_{s,b} c_b) only on steps the network resolves, with a hyperbolic factor
      where a lumped step's uncatalysed part can limit, and a declared concentrated-matrix ceiling (Potman Series A)
      (ENGINE_VS_LITERATURE.md sec. 7 amendment; atlas P2). All numeric kappa bands are A3-provisional, pending their
      own prereg and red team, before any code.
    affects:
      - {file: docs/reference/pathway_atlas/ENGINE_VS_LITERATURE.md, symbol: "saturating, fading at pH 8"}
      - potman1989_fig4_5_phosphate_dose_series
      - kallen1971b_fig7_phosphate_catalysis_saturation
      - davies2005_tab1_acetate_ladder_late_browning_rate

