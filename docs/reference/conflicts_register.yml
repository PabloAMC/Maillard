  - id: CF-031
    kind: conflict
    scope: other_lane
    sources: [farmer1992, elmore1997, xu2011, yiltirak2026, us8920862, du2025, whitfield1988, elmore2002, zhang2022]
    quantity: "effect of lipid on meaty thiols (MFT, FFT) in cysteine + sugar pots"
    observation: >-
      Lipid lowers the thiols in some studies (Farmer 1992, Elmore 1997, Xu 2011) and raises them in structured lipid
      (US 8,920,862: MFT x10.1, FFT x7.4 over buffer; du2025). (Corrected 2026-11-01, cluster 4 sec. 8: the earlier
      "raises them in emulsions (Yiltirak 2026)" compared the emulsion with buffer + oil, not with the aqueous control.
      Within-study MFT signs: Whitfield 1988 -0.47 dex (lecithin), Elmore 2002 -1.14 (25 mM methyl linoleate), Xu 2011
      -1.32 fresh / -2.16 oxidised lard, Yiltirak 2026 buffer + oil -0.58 to -0.98 vs buffer and emulsion -0.07 to
      -0.27 vs buffer (+0.31 to +0.71 vs buffer + oil; FFT emulsion vs buffer +0.13 to +0.33 at 3 of 4 cooks); raised
      only in US 8,920,862's structured-lipid mesophase, +1.0 dex (FFT +0.87; single run), and slightly with free C18
      acids, du2025 +0.10.) Touches the sulfur lane's thiol sinks
      (CF-013). Amended 2026-11-01 (pathway atlas F30): Yiltirak 2026 supports only half of the 'raises' side. Its
      Table S3 (25 mM ribose + Cys, 0.5 M phosphate pH 5.5, four equivalent cooks 100 C / 4 h - 130 C / 0.5 h) has
      emulsion MFT BELOW plain buffer at every cook (3.73 vs 6.88, 2.83 vs 3.29, 1.28 vs 2.4, 1.29 vs 1.71 ug/L); MFT
      is higher in the emulsion only against buffer + fresh oil (x2.1-5.2), and buffer + oil is the lowest arm
      everywhere (MFT 0.45-0.75, ~x10 below buffer at 100 C). FFT is raised by the emulsion over buffer at three of
      four cooks (2.74 vs 1.28, 2.81 vs 1.46, 2.17 vs 1.62; 1.28 vs 1.68 at 120 C). So for MFT Yiltirak belongs with
      the 'lowers' studies, with an oil-phase (not oxidised-lipid) suppression; only its FFT and its emulsion-vs-oil
      contrast are on the 'raises' side (yiltirak2026 dossier sec. 3-4).
      [Amended 2026-11-01, resolve2_sulfur as corrected by its red team] Zhang 2022 SI (Hefei; Xyl + Cys, pH 7.2
      unbuffered, 120 C / 90 min, 4 : 1 oil : aqueous, phases separated): WATER-PHASE free MFT x0.36 - 4.8 and FFT
      x0.93 - 6.5 vs the oil-free control, the opposite sign to Xu 2011 (same sugar, amino acid and temperature) and
      Reading. The control holds 95 % of its water-phase MFT as bis(2-methyl-3-furyl) disulfide (2.81 vs 0.14 ng/mL),
      which vanishes from every raw-oil water phase: the water-phase free + disulfide pool falls x1/3.4 - 1/25 (raw
      oils) and x1/1.0 - 1/3.5 (lipase-hydrolysed, mildly oxidised ENTH oils). The OIL phase was measured too and holds
      both species: disulfide 288.49 (coconut RM), 59.74 (coconut EM), 21.74 (palm RM), 20.64 (peanut EM) ng/mL; free
      MFT 13.79 (olive RM), 17.76 (coconut RM), 10.18 (peanut EM) ng/mL. So the 'pool' falls are WATER-PHASE pools;
      the system pool is not known from these data. Species measured by lab: free MFT only -- Xu 2011, Whitfield
      1988, Yiltirak 2026, US 8,920,862, du2025; free AND disulfide -- Elmore 2002 (pool x1/17 with linoleate,
      < 1/100 with linolenate) and Zhang 2022 (both phases).
    explanations:
      - "Measurement species, WATER PHASE ONLY (resolve2_sulfur, 2026-11-01; red team: P 0.65 -> 0.4): the oil-free control is 95 % disulfide; with oil the water phase holds free MFT only, so Zhang 2022's free-MFT rise is a speciation shift and its water-phase pool falls as Xu's free MFT (x1/21, fresh lard) and Elmore's pool (x1/17) do. Does not explain the oxidation direction (Zhang's ENTH oils suppress less; they are lipase-hydrolysed, PV <= 4.3 vs Xu's 184; free fatty acids raise MFT in du2025: hydrolysis, P ~0.5) or the Nestle mesophase raise (single run)."
      - "Disulfide partition into the oil phase plus increased formation with oil (lower pH 4.3 - 4.7, more xylose consumed): the lipophilic disulfide leaves the water phase into the 4 : 1 oil, where Zhang 2022 measured it (P ~0.35, red team 2026-11-01; against pure partition: the ENTH water phases keep 0.6 - 2.3 ng/mL disulfide under the same 4 : 1 oil). Other: 0.25."
      - "Lipid aldehydes as thiol sinks vs an oil phase protecting thiols from aqueous oxidation / binding."
      - "Physical partition: a fresh (unoxidised) oil phase alone suppresses MFT ~10x in Yiltirak 2026, so part of every 'lipid lowers MFT' result may be partitioning into oil, not carbonyl chemistry; the interface (emulsifier) recovers part of it."
      - "Aliquot sampling of Yiltirak's non-emulsified oil arm (a 30 uL aliquot from a creaming oil layer under-samples a lipophilic thiol); P ~0.25 (cluster 4, 2026-11-01). The pattern is mixed: MFT falls more than FFT (-0.98 vs -0.03 to -0.24), as log K_ow predicts, but the more polar 3M2B falls -0.52."
    tests:
      - "Cluster 4 (2026-11-01, docs/history/conflict_resolution_2026-11-01/cluster4/results.md sec. 8): a headspace partition operator without isotope standards, 1 / (1 + phi K_ow) at log K_ow(MFT) 1.5-2.0 and phi <= 1.5 %, explains at most 0.1-0.4 dex of the 0.5-2.2 dex falls, and the falls scale with the oxidation load (fresh < oxidised lard; PUFA ester): chemistry (thiol capture by lipid electrophiles) rather than the operator. Verdict EXPLAINED IN PART, P 0.55 -- below 0.6, so the entry stays open (note, 2026-11-01)."
      - >-
        resolve2_sulfur (2026-11-01; docs/history/conflict_resolution_2026-11-01/resolve2_sulfur/corrections.md sec. C,
        red team redteam.md sec. 4 binding): species table per lab from the Methods and tables. The PRE-REGISTERED
        rule (every lab that measured the disulfide shows pool suppression within x3) FAILS: Zhang 2022's ENTH arms
        (5 of 10) give x1/1.0 - 1/3.5 vs Elmore's x1/17 (5 - 17x apart); the pass reported by the resolution came from
        restricting to raw oils after seeing the data, so the speciation reading is NOT established (at best
        inconclusive). The pool channel has one lab beyond Hefei's water phase (Reading, one study, SDs 63 % and 105 %);
        the >= 2-lab rule is met only on the free-MFT channel (Huazhong + Reading), and the Huazhong cell is E12 TEST.
        Partition is not excluded: the oil phase holds both species (observation). Hold-out hygiene: the resolution
        viewed the keyed TEST table heldout_zhang2021_table3.yml (E7 TEST lab, sec. 10 of the contrast-benchmark README)
        and F25#17@us8920862 (E7 TEST) before proposing a structure; both are seen-by-designer and must be excluded from
        any E7 score of a structure chosen after 2026-11-01, or reported with and without. Xu 2011's lard contrast is
        E12's TEST contrast F28#20@xu2011 (split_v2_per_change.yml; indexing 0-based, the Huazhong lard cell): it must
        not calibrate an E7 term. P(an E7 capture term supported by >= 2 DEV labs on one channel, without TEST cells)
        ~0.3.
    status: open
    remedy: >-
