  - id: CF-091
    kind: self_contradiction
    scope: other_lane
    sources: [zhai2021]
    quantity: "13C5-TTCA formed from 13C5-xylose + the cysteine released by TTCA, 10 mM pots, 100 C, pH 5.5-8 (Zhai 2021 Fig. 7a, 3-20 uM)"
    observation: >-
      The Methods obtain the labelled TTCA by subtracting the unlabelled TTCA content of one pot from the total of
      another, i.e. as a difference of two ~6-10 mM measurements. That difference has a resolution of ~0.1-0.4 mM (the
      Fig. 4b replicate SDs), 10-100x the plotted values (3-20 uM) and their +-0.5 uM bars. Either the quantitation was
      direct (the m/z 259 / 254 area ratio) and the Methods misdescribe it, or the plotted values are below the
      method's resolution. Found by the cluster-5 re-run of EX-054 (2026-11-01, Addendum A; Fig. 7a read once, 400 dpi,
      never keyed): at face value Fig. 7a rejects the provisionally admitted CF-076 point (z 6.3) and no sampled draw of
      any rival passes it (minimum z 2.2-2.9).
    explanations:
      - "Direct LC-MS/MS quantitation of 13C5-TTCA (Table 1 lists its fragments) with the Methods sentence describing an earlier or a different calculation."
      - "Quantitation by difference as printed: the plotted values and bars are below the method's resolution and carry no information beyond a bound."
    tests:
      - "Cluster 5 label check (docs/history/conflict_resolution_2026-11-01/cluster5/verdict.md sec. 2, caveat 4): S5a (face value) is a sensitivity reading only; S5b (resolution-limited bound, <= ~0.3 mM) is passed by both feasible points of CF-076 (0.18 / 0.04 mM)."
    status: open
    remedy: "Author request (already queued for the label fraction): the direct m/z 259 / 254 area ratios of TTCA in the 13C5-xylose pots. Until answered, Fig. 7a is a bound (<= ~0.3 mM), not a measurement; it is never a fit row. If the authors confirm direct quantitation, S5a becomes primary for CF-076."
    affects:
      - {file: data/lit/extraction_dossiers/zhai2021_extraction.md, symbol: "13C5-TTCA"}

