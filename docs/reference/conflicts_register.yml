  - id: CF-072
    kind: code_mismatch
    scope: corpus
    sources: [nguyen2016]
    quantity: "the protein-glycation arm (B20): the fructoselysine-protein decay r_flp_decay"
    observation: >-
      src/kinetic_core/network.py r_flp_decay writes FLP -> TDG + LYSP, returning the protein lysine to the pool.
      Nguyen 2016's fitted network (nguyen2016_extraction.md, the supplementary equations) returns NO lysine: lysine is
      consumed only by k3, and AP -> CML / CEL / MRPs leave d[lys]/dt untouched. The dossier warns that a network that
      writes the lysine back and uses Nguyen's constant is not Nguyen's model. The frozen k_glyc at 120 C is 0.64x
      Nguyen's printed k3, consistent with the fit compensating for the different network. Found by the matrix
      mechanism review (2026-10-31). Merged 2026-11-01 from CF-052 (the same finding, first registered 2026-10-29
      against parameters_glycation.k_flp_decay; now a pointer here): the SI also shows a t = 0 sugar : lysine ratio of
      about 6:1, not the stated 10:1, and the 10-min recovery in M1 at 120 C plots as 107.7 % where the text says 104 %.
    explanations:
      - "A transcription choice in B20: the Amadori decay written with amine release as in the free-amino-acid trunk."
      - "A deliberate declared departure not recorded in the choices register."
    tests:
      - "nguyen2016 dossier 'Supplementary material (read 2026-10-29)': Fig. S2A/B equations transcribed -- d[lys]/dt = -k3[glu][lys] - k6[lys][GO]; AP -> CML / CEL / MRPs leave lysine untouched (re-checked 2026-11-01 against network.py r_flp_decay {FLP: 1} -> {TDG: 1, LYSP: 1})."
      - "Refit B20 with the lysine kept out (Nguyen's structure) and compare k_glyc with Nguyen's k3; score the casein-glucose rows."
      - "wolf1977a (J Food Sci 42:1540; Crossref-verified 2026-11-01; red-teamed, docs/history/conflict_resolution_2026-11-01/wolf1977a/ and resolve2_pyrbuf/redteam.md sec. 5), FDNB lysine in soy / glucose / cellulose at a_w 0.65, 95-125 C: does NOT discriminate. Shipped constants: the return structure leaves 0.32-0.42 at 105 C / 54 min / 4 % glucose, no-return 0.05-0.14, observed 0.43 (+0.5 to +0.8 dex between rivals) -- but with k_glyc free (a no-return refit needs it 0.3-0.5 dex below shipped, inside the between-lab band) both structures fit Table 2 at rms 0.06 dex, and Table 3 (95 C, 1 %), the order test and the 125 C design end points separate them by <= 0.07 dex. The plateau with 2.5 % glucose left rejects a BARE no-return network (P 0.8) but not no-return + an inaccessible lysine pool (the engine's available_fraction) or + FDNB counting Amadori lysine. LR return : no-return+pool ~1; return : bare no-return ~2. P(Wolf 1977a decides CF-072) 0.1. The companion's reprocessing plateau is CF-096."
      - "Decider (proposed 2026-11-01): a sugar-chase on plateau material -- free glucose removed, re-dried to the same a_w, reheated; the return structure predicts available and LC-MS total-free lysine (enzymatic hydrolysis, not acid) rising at ~k_flp_decay (>= +0.2 dex in 60 min at 105 C), the no-return structure none. Cheaper first: Nguyen 2016 Fig. S1B lysine balance."
