  - id: CF-004
    kind: condition_error
    scope: sulfur_rows
    sources: [zhai2023foodchem, zhai2023jafc, kang2026_SI]
    quantity: "quantification class of the TTCA temperature ladder (Zhai 2023 Food Chem Table 1 and its reprints, incl. Kang SI Table S4)"
    observation: >-
      The B2.1 / B2.3 fit enters Kang S4's 100 and 120 C MFT, FFT and furfural as absolute levels ("Tier A, R^2
      0.9989"). The original's methods (Zhai 2023 Food Chem p. 3, sec. 2.7) state: "The detected compounds were
      quantified by the comparison of peak areas and the correction factor was 1", with Wi = f' x Ai x ms / (As x V).
      The JAFC companion's SI Table S2 (read 2026-10-29) prints 31 calibration curves that are digit for digit Kang SI
      Table S3; 8 of the 39 compounds have no curve; and 30 of 430 non-zero cells lie below their own curve's zero-
      response point, so the curves cannot have produced them: 2-methylthiazole y = 0.0084 x - 0.0521 has its
      x-intercept at +6.20 ug/L, yet Kang S4 prints 0.142 / 0.194 / 0.254. So the numbers came from f' = 1 (single
      internal standard, 1,2-dichlorobenzene): semi-quantitative. The B8 wave (Amendment 17) already called the ladder
      semi-quant but kept the six level rows in the objective at sigma_log 0.4; every later objective (B9, the B47
      52 rows, B58-B64) inherits them. Other absolute uses: the B2.3 hold-out's kang_140C_MFT / FFT / FUR level rows
      (PASS_BAND_LEVEL), and the cross-compound ratio row kang_100C_MFT_over_FFT, which is not response-factor-free
      under f' = 1 (the printed slopes differ 7.4x between MFT 0.0039 and FFT 0.0287). No data/ benchmark file
      carries the ladder (grep for Kang / 10.1016/j.foodchem.2022.134420 in data/benchmarks: none).
    explanations:
      - "The JAFC paper and Kang copied a calibration list from another project; the ladder itself was computed with f' = 1 (supported by the 2-methylthiazole cells)."
    tests:
      - "zhai2023jafc dossier 'Supplementary material (read 2026-10-29)' sec. 'What Table S2 says' items 1-4, checked against Kang2026_supplementary.pdf Table S3 (identical) and Table S4 (2-methylthiazole 0.142 / 0.194 / 0.254) on 2026-10-29."
      - "zhai2023foodchem dossier sec. 2.1 quote of the f' = 1 formula."
    status: error_confirmed
    remedy: >-
      Every fit and check row from the ladder enters the M6 measurement model as method class semi_quantitative
      (src/kinetic_core/fitting.py MeasurementModel, SCALE_TAU["semi_quantitative"] = inf), one series per compound
      per source table, so only within-compound shape counts. Concretely: (1) generate_kinetic_core_b2_3_fit.py FIT_ROWS
      kang_100C_MFT, kang_120C_MFT, kang_100C_FFT, kang_120C_FFT, kang_100C_FUR, kang_120C_FUR -> method
      semi_quantitative, series "zhai2023foodchem_table1/<species>", anchors re-cited to Zhai 2023 Food Chem Table 1;
      drop "Tier A". (2) kang_100C_MFT_over_FFT: remove (cross-compound, RF-dependent). (3) B8's
      zhai_MFT_fold_120_over_100 / zhai_FFT_fold_120_over_100 duplicate (1) once the levels are scale-free: keep one
      form only (CF-005). (4) generate_kinetic_core_b2_3_holdout.py kang_140C_MFT / _FFT / _FUR: score as 140/120 ratios
      within compound, not levels. (5) No data/ file to change; ledger already semi_quantitative.
    affects:
      - kang2026_si_table_s4_ttca_tladder
      - zhai2023foodchem_table1_ttca_tladder
      - zhai2023jafc_fig3_ttca_arm_volatile_grid
      - zhai2023jafc_tables2_calibration_and_mgo_go_cys
      - {file: scripts/generators/generate_kinetic_core_b2_3_fit.py, symbol: "Tier A, R^2 0.9989"}
      - {file: scripts/generators/generate_kinetic_core_b2_3_fit.py, symbol: "kang_100C_MFT_over_FFT"}
      - {file: scripts/generators/generate_kinetic_core_b8_fit.py, symbol: "zhai_MFT_fold_120_over_100"}
      - {file: scripts/generators/generate_kinetic_core_b2_3_holdout.py, symbol: "kang_140C_"}
      - {file: src/kinetic_core/fitting.py, symbol: "class MeasurementModel"}

