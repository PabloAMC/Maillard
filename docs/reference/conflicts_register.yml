  - id: CF-088
    kind: conflict
    scope: other_lane
    sources: [farmer1992, xu2011]
    quantity: "reading of the fall in lipid-oxidation aldehydes when cysteine + pentose is heated with lipid (antioxidant Maillard products vs carbonyl capture)"
    observation: >-
      Both papers measure the same pattern: the Maillard reactants cut lipid aldehydes, the unsaturated ones most, and
      raise 1-alcohols and 2-alkylfurans. Farmer, Mottram et al. 1992 (four lipids +- Cys + ribose, 0.5 M phosphate pH
      5.6, N2, 140 C, 1 h) reject an antioxidant reading because ketones, also lipid-oxidation products, "showed little
      change", and attribute the aldehyde loss to reactions with amino / thiol groups, NH3 and H2S (farmer1992 dossier
      sec. 1; PDF abstract and Discussion). Xu et al. 2011 (lard, fresh or oxidised, + Cys + xylose, 0.2 M phosphate pH
      5.0, 120 C, 60 min) read the same pattern as the antioxidant effect of Maillard reaction products, citing Elmore,
      Campo, Enser & Mottram (their ref. 14), and measure no oxidation marker in the heated pots (PV / AV only for the
      lard before use; xu2011 dossier sec. 1). Atlas: F30 cells 2 and 20.
    explanations:
      - "Carbonyl capture (Farmer): aldehydes, and alpha,beta-unsaturated ones fastest, are consumed by cysteine's amine / thiol and by NH3 / H2S; a true antioxidant would also cut the other oxidation products."
      - "Antioxidant MRPs (Xu): reductones / melanoidins slow lipid oxidation; predicts all oxidation products to fall, ketones included."
    tests:
      - "Xu 2011's own Table 2 (xu2011 dossier sec. 2; oxidised lard alone vs + Cys / Xyl, ug/mL): saturated methyl ketones are not lowered (2-decanone 1.22 -> 1.52, 2-tridecanone 1.15 -> 1.27, 2-nonanone n.d. -> 1.17), while the enone (E)-3-octen-2-one, a Michael acceptor, falls 2.63 -> n.d. and 2-pentylthiophene (H2S + dienal) appears: Farmer's discriminator, applied to Xu's data, favours capture."
