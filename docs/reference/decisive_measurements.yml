  - id: thiol_loss_cysteine_dependence
    plan_step: "joint M1c + M2 refit (M1's C2, entering its rival set by amendment before its freeze); M0 CK-23 (MF-01)"
    added: "2026-11-06"
    question: >-
      Is the in-pot loss of MFT a pot-independent first-order sink (the shipped k_mft_decay), a temperature-only law, or
      a loss that free cysteine slows (M1's C2)?
    rivals_from: [results/validation/m0_checks_batch2.md, CF-013]
    rivals:
      - "the shipped pot-independent first-order k_mft_decay (a lone standard lost at 0.107 /min at 110 C): refuted as too fast by the co-heated-standard bound (CK-23) and retired as the sole answer"
      - "a temperature-only law (0.003 /min at 100 C, 1.36 at 145 C): needs an apparent Ea ~176 kJ/mol, outside Gigl's measured 7 - 102, so not admissible with cited constants"
      - "M1's C2: a loss that free cysteine slows (EX-050's form), nominated by CK-23 as a reading, not a size, conditional on the shipped instant supply"
    why_not_on_disk:
      - blocker: >-
          The only in-pot bound is US 10,076,126's co-heated [2H3]-MFT / [2H2]-FFT standards (weighed in before 0.5 - 4 h at
          110 C), with no standard amount, recovery or LOD printed: lambda <= 0.019 - 0.058 /min under a declared f_min
          band, a bound, not a measured loss.
        cites: [results/validation/m0_checks_batch2.md, CF-013, data/lit/extraction_dossiers/us10076126_extraction.md]
      - blocker: >-
          The pots that order the sink by cysteine (Grosch 0 / 0.65 mM, Schieberle 33 mM, the patent 250 mM) differ in
          temperature, sugar, design and laboratory, and the C2 reading holds only under the shipped instant supply: M1
          found a real reservoir, and with a slower supply the sink needed at 100 C changes.
        cites: [results/validation/m0_checks_batch2.md, results/validation/kinetic_core_m1_results_review.md, EX-061]
      - blocker: >-
          Schieberle 2000 Table IV and Grosch 1992 are seen (M1's D1, spent by EX-061; CK-23, CK-42), so they may falsify
          a sink but never credit one.
        cites: [results/validation/m0_checks_batch2.md, EX-061, docs/guides/STATUS_AND_PLAN.md]
    measurement:
      source: >-
        CK-23's decisive data (m0_checks_batch2 sec. 2); CF-013's designed protocol (conflict analysis CF-013 sec. 4: a
        before-heating isotope standard in sister vials); atlas E12 (ENGINE_VS_LITERATURE, designed experiments)
      summary: >-
        [2H3]-MFT charged before heating in sister vials at 0 and >= 30 mM cysteine, same pentose, at 100 and 120 C, which
        separates C2 from a temperature-only law; and labelled MFT spiked mid-cook (atlas E12).
      arms:
        - name: "[2H3]-MFT charged before heating, two cysteine levels"
          design_written: true
          conditions: >-
            CF-013's protocol: one free-sugar pentose + Cys pot, 0 - 160 min, one vial set per temperature with [2H3]-MFT /
            [2H2]-FFT charged before heating and after-cooling standards in sister vials; cysteine 0 and >= 30 mM, the same
            pentose
          species: [MFT, FFT, "[2H3]-MFT", "[2H2]-FFT", free cysteine, pentose, norfuraneol, furfural, H2S]
          ph_values: "not stated in the records"
          ph_basis: [not_stated]
          temperatures_C: [100, 120]
          o2: "not stated in the records"
          replicates: "not stated in the records"
        - name: "atlas E12: labelled MFT spiked mid-cook"
          design_written: true
          conditions: "labelled MFT spiked mid-cook, Cys 0 - 150 mM, with the disulfide measured (cluster 4 E3)"
          species: [labelled MFT, the MFT disulfide]
          ph_values: "not stated in the records"
          ph_basis: [not_stated]
          temperatures_C: ["110 - 140"]
          o2: "argon vs air"
          replicates: "not stated in the records"
    decides:
      - outcome: "the before-heating standard is lost more slowly at >= 30 mM cysteine than at 0, at both temperatures"
        means: "M1's C2 (a loss that free cysteine slows)"
      - outcome: "the standard's loss is the same at 0 and >= 30 mM cysteine and moves only with temperature"
        means: "a temperature-only law, its barrier then measured against Gigl's 7 - 102 kJ/mol"
      - outcome: "the before-heating and after-cooling standards in sister vials"
        means: "formation and loss measured separately (CF-013's analysis: the single most informative test)"
      - outcome: "E12: the mid-cook loss vs cysteine, argon vs air, with the disulfide"
        means: "the loss law, O2 and reversibility at process temperature"
