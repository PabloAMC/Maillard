            each pH; 2 h; sealed with stated fill (27 pots)
          species: [HMF, DMHF, MGO, 3-DG / 1-DG (OPD), acrylamide (Asn arm), glucose]
          ph_values: "5.0, 6.5, 8.0"
          ph_basis: [label_25C, cooled]
          temperatures_C: [130]
          o2: "not stated in the records (sealed, stated fill)"
