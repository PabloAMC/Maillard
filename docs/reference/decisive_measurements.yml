          ph_values: "7.0"
          ph_basis: [label_25C]
          temperatures_C: [100]
          o2: "argon vs air; vial scale, headspace / liquid ratio and deoxygenation method stated"
          replicates: "not stated in the records"
        - name: "(b) trapped fed ARP-Phe under argon, MGO and GO quantified"
          design_written: true
          conditions: >-
            Fed ARP-Phe at the Table 2 charge (0.1 M, 0.5 M phosphate); in-situ OPD at a stated concentration, plus a
            post-incubation-trap control for OPD-made osone (the continuous-OPD artefact, M3b sec. 3.2); MGO and GO
