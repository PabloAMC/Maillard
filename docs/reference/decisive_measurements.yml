      source: "case M0a sec. 4 (design not yet reviewed; the case is parked and folded into M4 part A)"
      summary: >-
        One laboratory: glucose 0.25 M + L-alanine, + L-asparagine, + glycine (control) 0.25 M, and glucose alone;
        0.2 M phosphate held at pH 5.0 / 6.5 / 8.0; 130 C, 2 h, sealed with stated fill; HMF, DMHF, MGO, 3-DG / 1-DG
        (OPD), acrylamide (Asn arm), glucose; label and cooled pH; n = 3 independent heatings per cell (36 pots).
      arms:
        - name: "glucose + amine (Ala and Asn: acrylamide lane; Gly: trunk lane)"
          design_written: true
