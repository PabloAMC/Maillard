  - id: glucose_mft_carbon_origin
    plan_step: "M4 (development grade on disk, decider W6)"
    added: "2026-11-05"
    question: >-
      The claim is restated as a hexose C5 entry into 1-DPO with its carbon origin undecided: does glucose MFT keep C-1
      as its methyl (C-6 lost through 1-DG: R1, or R2 below norfuraneol on the same supply) or lose C-1 as formic acid
      through glucosone (R5); and does the cysteine-hexose Amadori pool feed the C5 entry or act only as a cysteine sink
      (R4')?
    rivals_from: [docs/reference/cases/M4_glucose_mft_protein_amine.md, data/lit/extraction_dossiers/glomb2010_extraction.md]
    rivals:
      - "R0: the current engine (~0 MFT, refused); its C2 + C3 route is falsified as the hexose MFT route"
      - "R1 (the claim, C-1-retained form): Glc + Cys -> Cys-hexose Amadori -> 1-DG + Cys -> 1-DPO + C1 (C-6 lost; MFT's methyl = glucose C-1) -> the pentose steps"
      - "R5 (the claim, C-1-lost form): the oxidative route, Cys-hexose Amadori -> glucosone -> beta-cleavage (C-1 lost as formic acid) -> 1-DPO -> the pentose steps (Glomb 2010; MFT's methyl = glucose C-2)"
      - "R2: the same supply entering below norfuraneol (1-DG + amino acid -> a 1,4-dideoxy C6 -> a 1,4-dideoxy C5 -> MFT)"
      - "R3: C2 + C3 recombination, a declared-failing control (falsified by Du 2023 / Zhao 2019b's measured label share)"
      - "R4 (as written; the band-now record only): the hexose -> C5 entry alone on the amine-free 1-DG supply, no Cys-hexose pool; falsified by D5"
      - "R4': the Cys-hexose pool exists as a cysteine sink only; the C5 entry is fed by cysteine-catalysed or amine-free enolisation, not through the pool"
    why_not_on_disk:
      - blocker: >-
          R1 vs R5 is an explicit pair that cannot be decided on disk, and the spent-data rule (plan sec. 7 item 2,
          2026-11-06) lets spent or seen data falsify a constant-free prediction but never credit a rival: D3 (BTBU / CAAS
          label shares) nominated E1, D1 (Hofmann 1998 Table 5) was seen through R0's probe, and D2's pH 3 / 7 arms are
          MF-12 observations. So on disk C2 + C3 as the hexose MFT route is falsified (R0's route and R3), R4-as-written
          is falsified by D5, and no rival is credited.
        cites: [docs/guides/STATUS_AND_PLAN.md, docs/reference/cases/M4_glucose_mft_protein_amine.md, data/lit/extraction_dossiers/du2023_extraction.md, data/lit/extraction_dossiers/zhao2019b_extraction.md]
      - blocker: >-
          No positional label on MFT itself: Tressl 1994's [1-13C]- / [6-13C]-glucose + Cys pots (pH 5, 160 C) report
          neither MFT nor norfuraneol; its only documented hexose C5 loses C-1 via 3-DG and has no methyl.
        cites: [data/lit/extraction_dossiers/tressl1994_extraction.md, docs/reference/cases/M4_glucose_mft_protein_amine.md]
      - blocker: >-
          Glomb 2010 (Halle, 50 C) labels the hexose 1-DPO as C-1-lost via glucosone; nothing at >= 100 C measures it.
        cites: [data/lit/extraction_dossiers/glomb2010_extraction.md]
      - blocker: >-
          O2 drains 1-DG too (x3.4 lower at 50 C in Gobert 2009, x4.4 lower in Glomb 2010), so an air / N2 contrast does
          not single out R5: it moves R1 in the opposite direction.
        cites: [data/lit/extraction_dossiers/gobert2009_extraction.md, data/lit/extraction_dossiers/glomb2010_extraction.md]
      - blocker: >-
          Tressl & Rewicki 1999 (same laboratory) says MFT's glucose pathway 'was established' with no datum, and its
          Fig. 14 (no conditions, no citation) has FFT and furfural from [1-13C]-glucose 50 % singly labelled, against
          Tressl 1994's unlabelled furfuryl skeleton; unresolved, so neither share is used.
        cites: [data/lit/extraction_dossiers/tressl1999_extraction.md, data/lit/extraction_dossiers/tressl1994_extraction.md]
      - blocker: >-
          No fed 1-DG or fed glucosone + H2S and no fed Cys-hexose Amadori compound -> MFT exist on disk, so neither which
          dicarbonyl feeds 1-DPO nor whether the pool feeds it (R4') can be read.
        cites: [docs/reference/cases/M4_glucose_mft_protein_amine.md]
    measurement:
      source: >-
        case M4 sec. 4.4 (the designed experiment, W6) and its proposed update to this entry, as on branch m4-case-ready
        (PR #90: ready to freeze as development grade, decider W6, not frozen; main carries the 2026-11-04 text)
      summary: >-
        One laboratory, three arms (n = 3 independent heatings per cell, sealed with stated fill and headspace, pH stated
        cooled on every sample and in situ where possible, LOD / LOQ and recovery per assay, SIDA for MFT, FFT and NF).
        Levels come from unlabelled replicate pots; labelled pots report isotopologue shares only and carry no d3-MFT
        standard (d3 collides with 13C-MFT's M+3 channel; use a 13C / 34S standard with no channel overlap). OPD trapping
        under argon with 1 mM DTPA, post-incubation trapping primary, with sugar + OPD and Amadori + OPD blanks (the
        continuous-trapping glucosone artefact). Arms: Hofmann's glucose + Cys pot with positional and methyl-locating
        glucose labels; fed 1-DG vs fed glucosone; fed Cys-hexose Amadori compound beside a matched glucose + Cys pot.
      arms:
        - name: "Arm 1: which carbon"
          design_written: true
          conditions: >-
            Hofmann's design: Cys 33 + glucose 100 mM, 0.5 M phosphate, 20 min; glucose as [1-13C], [6-13C], [2-13C] or
            [1,2-13C2] (the methyl-locating label, read through an MFT fragment that keeps the methyl carbon), 1:1
            [13C6] / [12C6] and unlabelled; each under air and under N2; at 145 C at pH 3 / 5 / 7, and a second
            temperature, 120 C, for the [1-13C] and [2-13C] glucose cells with the N2 / air pair at pH 5
          species: [MFT, norfuraneol, FFT, furfural, MP, each isotopologue-resolved, a methyl-locating MFT fragment]
          ph_values: "3, 5, 7 at 145 C; 5 at 120 C"
          ph_basis: [label_25C, cooled, in_situ]
          temperatures_C: [120, 145]
          o2: "air and N2 arms, degassed with argon headspace"
          replicates: "n = 3 independent heatings per cell"
        - name: "Arm 2: fed C6 dicarbonyls (1-DG vs glucosone)"
          design_written: true
          conditions: "synthetic 1-DG (Glomb 2000 route) or synthetic glucosone, 2 mM, + Na2S or Cys 6 mM, +-glycine 33 mM, 0.5 M phosphate, 2 - 20 min"
          species: [MFT, norfuraneol, DDP, 1-DPO and 3-DPO (OPD quinoxalines, argon + DTPA), acetic acid, formic acid, residual dicarbonyl]
          ph_values: "5, 7"
          ph_basis: [label_25C, cooled, in_situ]
          temperatures_C: [145]
          o2: "N2 primary, air as a secondary arm"
          replicates: "n = 3 independent heatings per cell"
        - name: "Arm 3: fed Cys-hexose Amadori compound beside a matched sugar pot"
          design_written: true
          conditions: >-
            synthetic D-fructose-L-cysteine (de Roos's preparation) 10 mM, 0.5 M phosphate, 0 - 60 min; beside a glucose +
            Cys pot at matched Cys, pH and temperature
          species: [the Amadori compound, free cysteine, glucosone, 1-DG and 3-DG (OPD), MFT, norfuraneol]
          ph_values: "3, 5, 7"
          ph_basis: [label_25C, cooled, in_situ]
          temperatures_C: [100, 145]
          o2: "N2 and air"
          replicates: "n = 3 independent heatings per cell"
    decides:
      - outcome: "Arm 1: [1-13C] gives a labelled MFT methyl and [6-13C] unlabelled MFT (C-1 retained, C-6 lost)"
        means: "R1 or R2"
      - outcome: "Arm 1: C-1 lost (an unlabelled methyl from [1-13C], a labelled one from [2-13C])"
        means: "R5"
      - outcome: "Arm 1: ~50 % labelled from both positional labels"
        means: "C-1 / C-6 equilibration (Tressl 1999 Fig. 14); the methyl-locating label decides: [2-13C] in the methyl means R5, [2-13C] in the ring with a C-1 methyl means R1 / R2 (the N2 / air contrast is secondary: O2 drains 1-DG too)"
      - outcome: "Arm 1: the R1 / R5 share shifts between 120 and 145 C"
        means: "a temperature-dependent R1 / R5 mixture"
      - outcome: "Arm 1: norfuraneol's label pattern equals MFT's, or is independent of it"
        means: "R1 or R5 (through norfuraneol) or R2 (bypass); a mixed pattern means R3; read at pH 3 / 5 / 7 it also gives D1 and D2 in a second laboratory"
      - outcome: "Arm 2: MFT forms from fed 1-DG without the amino acid, through 1-DPO and norfuraneol"
        means: "R1; MFT needing the amino acid, with a 1,4-dideoxy quinoxaline and no norfuraneol, means R2"
      - outcome: "Arm 2 under N2: MFT and C-1-lost 1-DPO form from fed glucosone; or fed 1-DG gives 1-DPO and MFT and fed glucosone does not"
        means: "R5; or R1 (fed 1-DG vs fed glucosone under N2 is the cleanest R1 / R5 split)"
      - outcome: "Arm 3: MFT per mol of fed Amadori compound consumed far below the sugar pot's MFT per mol of glucose-bound Cys"
        means: "R4' (the pool is a cysteine sink); comparable or more means R1 / R5 (the pool feeds 1-DPO)"
      - outcome: "Arm 3: the Amadori compound's decay, Cys return and 1-DG / 3-DG over pH"
        means: "part G's supply constants (formation, decay, Cys return, oxidative exit) and the mechanism of the glucose MFT pH maximum (D2)"
    unlocks:
      - "M4 part G beyond development grade: on disk it records only falsifications ('C2 + C3 falsified as the hexose MFT route; R4-as-written falsified; no rival credited')"
      - "M4 items 6 - 9, which wait for designed data (plan M4 row); W3 carries R1 / R2 / R5 as declared-zero steps until then"
      - "the route behind section 2's hexose rows ('HEXOSE ENTRY UNIDENTIFIED'); their absolute levels would still fall under H0"
    existing_data_route: "W6: the BTBU / CAAS MFT yields per glucose consumed would give D4 a second laboratory (case M4, open questions for the build, item 8); no record says they would settle which carbon is lost"
    status: open
    disagreements:
      - about: "the positional evidence on disk"
        cites: [data/lit/extraction_dossiers/tressl1994_extraction.md, data/lit/extraction_dossiers/tressl1999_extraction.md, data/lit/extraction_dossiers/glomb2010_extraction.md, docs/guides/STATUS_AND_PLAN.md]
        note: >-
          Tressl 1994 (C-1 lost, no equilibration, for the furfuryl skeleton) and Tressl & Rewicki 1999 Fig. 14 (C-1 / C-6
          equilibrated, 50 % labelled) disagree within one laboratory. The plan's M4 row and the case on main say no
          positional glucose label exists on disk; the case on PR #90 counts Tressl 1994 as one, but not on MFT, and Glomb
          2010 (50 C) labels a C-1-lost hexose 1-DPO. None changes the decisive design: Arm 1 carries a methyl-locating
          label so that it is not hostage to C-1 / C-6 equilibration.

  - id: thiol_absolute_second_lab
    plan_step: "H0-lift (W1.2)"
    added: "2026-11-05"
    question: >-
      Do the thiol lane's absolute MFT / FFT levels transfer to a laboratory the model has never seen, i.e. does
      tau_ABS fall to 0.8 dex or below once new laboratories' absolute rows are scored?
    rivals_from: [results/validation/kinetic_core_between_lab_tau_h0_prereg.md]
    rivals:
      - "D2 branch (i), shipped: tau_ABS > 0.8 dex, relative within-laboratory predictions only, absolute levels refused"
      - "D2 branch (ii): tau_ABS <= 0.8 with U > 0.8, absolute predictions with tau-widened intervals, 'provisional; tau biased low'"
      - "D2 branch (iii): U <= 0.8, absolute predictions with tau-widened intervals, provisional"
    why_not_on_disk:
      - blocker: >-
          The thiol lane's absolute evidence comes from one laboratory (DFA Garching): tau_ABS(all) 0.964 dex with
          U >= 1.60 (the grid top), branch (i).
        cites: [EX-059, results/validation/kinetic_core_thiol_lolo_nested_tau.md, src/kinetic_core/thiol_relative_only.py]
      - blocker: >-
          The forward-citation sweep's two finds did not qualify: Vauthey 2000 (Cys + ribose MFT nd, FFT tr, recovery never
          measured) and Lopez 2019 (a mushroom-protein matrix, per kg mushroom, no MFT, no replicate noise).
        cites: [data/lit/extraction_dossiers/vauthey2000_extraction.md, docs/reference/cases/M1c_amendment_A1_vauthey2000.md, CF-125, data/lit/extraction_dossiers/lopez2019_extraction.md]
      - blocker: >-
          The P1 TEST tables keyed 2026-11-01 (three new laboratories) carry no ABS-class thiol-lane observable.
        cites: [results/validation/kinetic_core_between_lab_tau_h0_prereg.md]
    measurement:
      source: "H0 prereg sec. 9 (the upgrade condition H0'); plan W1.2"
      summary: >-
        Absolute MFT / FFT from new laboratories, predicted by the frozen structure with no refit and scored under H0's
        rule unchanged; the pots themselves are not designed by any record.
      arms:
        - name: "H0' re-score"
          design_written: false
          requirement: >-
            design not yet written (any pot the engine can simulate): ABS-class thiol-lane rows (absolute MFT / FFT) from
            new laboratories, their split hash frozen first, predicted from s042_r3en_fixed with no refit, and scored with
            H0's tau_ABS(all), omega(all) and tau_FIG(all) unchanged. With two laboratories the coverage SE is ~0.21 and
            the sign-flip test's minimum p is 1/4, so H0' is weak.
    decides:
      - outcome: "H0' leaves tau_ABS at or below 0.8 dex"
        means: "branch (ii) or (iii): absolute thiol levels ship for a new laboratory with tau-widened intervals (owner sign-off: shipped outputs move)"
      - outcome: "tau_ABS stays above 0.8 dex"
        means: "branch (i) stands: relative within-laboratory predictions only"
    unlocks:
      - "absolute thiol levels for a new laboratory: the panel rows section 2 lists as refused for their absolute level (H0 / EX-059)"
    existing_data_route: "W6 author replies and the pending WUR blind-test samples (plan W1.2; the engine's refusal text in thiol_relative_only)"
    status: open
    disagreements:
      - about: "how many new laboratories lift the refusal"
        cites: [results/validation/kinetic_core_between_lab_tau_h0_prereg.md, src/kinetic_core/thiol_relative_only.py, docs/guides/STATUS_AND_PLAN.md]
        note: >-
          H0's prereg triggers H0' on the first batch that keys >= 2 NEW laboratories with ABS-class rows; the plan's
          W1.2 row, the engine's refusal text and the wishlist's section 6 say 'a second independent laboratory'. The
          pre-registered condition is the prereg's; read literally, the one-laboratory wording would trigger H0' a
          laboratory early. Aligned 2026-11-06 (register pass): the plan's W1.2 row, the engine's refusal text and
          short reason, the model card and the wishlist's section 6 now say "at least two new laboratories", the
          prereg's condition.

  - id: methylglyoxal_self_loss
    plan_step: "M4 (R3's MGO loss band); trunk k_mgo_mel"
    added: "2026-11-05"
    question: >-
      What are the order and the barrier of methylglyoxal's loss, alone and with an amino acid, at the trunk's dilute
      concentrations?
    rivals_from: [CF-122, docs/reference/cases/M4_glucose_mft_protein_amine.md]
    rivals:
      - "the trunk's k_mgo_mel: first order, pH-free, Ea 20 kJ/mol (B1 fit, at the FITTED_EA_BOUNDS floor; 95 % CI -42 to 82)"
      - "Kanzler 2026's measured law: MGO alone second order (k2 ~1.8 - 1.9e-4 /mM/min, 'suggested, not identified'), amino acids adding [Ala]^0.75 - 0.84, apparent Ea 95 - 121 kJ/mol in the amino-acid pots"
      - "the M4 case's band: Ea 95 - 121 kJ/mol, level at 100 C pinned to B60, order 1 (order ~2 a sensitivity)"
    why_not_on_disk:
      - blocker: >-
          MGO alone has no temperature series: Kanzler 2026's 60 - 140 C series is MGO + amino acid, MGO alone is at
          100 C (two time points) and Bork 2022 at 130 C, so its barrier exists only as a cross-paper estimate.
        cites: [CF-122, data/lit/extraction_dossiers/kanzler2026_extraction.md, data/lit/extraction_dossiers/bork2022_extraction.md]
      - blocker: >-
          Every source is one laboratory lineage (TU Berlin: Kanzler / Rohn, Kroh, Bork); Pfeifer 2013 (MGO alone,
          130 C) is the same lineage, not a second laboratory.
        cites: [data/lit/extraction_dossiers/pfeifer2013_extraction.md, docs/reference/cases/M4_glucose_mft_protein_amine.md]
      - blocker: >-
          Within that laboratory Kanzler 2021's nominally identical MGO-alone pot loses MGO x3.2 faster (k2 5.9e-4 vs
          1.85e-4 /mM/min, 0.5 dex); with its point the MGO-alone barrier against Bork becomes 47 - 66 kJ/mol, not
          ~95 - 113.
        cites: [data/lit/extraction_dossiers/kanzler2021_extraction.md]
      - blocker: >-
          Every pot is 100 mM MGO, pH 5 unbuffered, drift and O2 unstated, no come-up correction; the trunk's pots are
          ~1000x more dilute, where a second-order channel would not dominate.
        cites: [CF-122]
    measurement:
      source: "CF-122's decider"
      summary: >-
        MGO loss at <= 1 mM, with and without an amino acid, at three temperatures with the pH held.
      arms:
        - name: "dilute MGO loss, +-amino acid"
          design_written: true
          conditions: "MGO <= 1 mM, with and without an amino acid; the records fix neither the amino acid nor its level"
          species: [methylglyoxal]
          ph_values: "held, value not stated"
          ph_basis: [not_stated]
          temperatures_C: ["three, values not stated"]
          o2: "not stated in the records"
          replicates: "not stated in the records"
    decides:
      - outcome: "first vs second order in MGO at <= 1 mM"
        means: "whether k_mgo_mel's first-order form holds at the trunk's dilution"
      - outcome: "the barrier, alone and with the amino acid"
        means: "against B1's 20 kJ/mol floor, Kanzler's 95 - 121 (amino-acid pots) and 47 - 113 kJ/mol (MGO alone, cross-paper)"
      - outcome: "the excess over MGO alone vs amine level"
        means: "whether the [amine]^0.75 - 0.84 catalysis transfers to dilute pots (M4 part A)"
    unlocks:
      - "k_mgo_mel's barrier (B1's 95 % CI spans zero) and M4's MGO loss band (R3 is the rival this law moves most; D4's x13 - 33 C3-pool sensitivity at 145 C)"
    existing_data_route: null
    status: open
    disagreements:
