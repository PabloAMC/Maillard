# DECISIVE MEASUREMENTS (2026-11-05; owner: a durable record of WHICH measurement would decide each mechanism question
# the literature on disk cannot, while designed experiments (plan W6) stay last).
#
# Hand-kept, like the registers. One entry per open STRUCTURAL question (which rival mechanism holds), not per fitted
# coordinate: the generated data wishlist (src/data_wishlist.py) already derives "what to measure next" for
# unidentified coordinates from the fit artifacts; this file is the curated half, rendered as the wishlist's last
# section. Nothing here is a measurement, a fit or a forecast.
#
# Rules for an entry:
#   - Every blocker cites its record: a CF- / EX- / CR- id (checked against its register) or a repo path (checked to
#     exist). A record that is not on this branch yet is listed under `pending_records` with where it lives; the
#     loader then accepts it and reports the mark as stale once the record lands.
#   - `measurement` is taken from the case / prereg / register entry that names a design, never invented beyond what
#     the records support. Where no record writes a design, the arm says `design_written: false` and states only what
#     the record asks for ("design not yet written").
#   - pH basis tags: cooled (read after cooling), label_25C (the solution as prepared, at room temperature), in_situ
#     (at reaction temperature, or held there by a pH-stat), not_stated (the record does not say).
#   - `status`: open (undecided on disk) | provisional (the governing design is a draft awaiting its pre-freeze step;
#     needs `status_note`) | decided (needs `decided_by`).
#   - Never cite a private file (the laptop-only article folder); cite the dossier.
# Checked by src/decisive_measurements.py (tests/unit/test_decisive_measurements.py).

