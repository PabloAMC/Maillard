        cites: [docs/reference/cases/M3b_anoxic_donor_supply.md, data/lit/extraction_dossiers/hofmann2000b_extraction.md, results/validation/kinetic_core_m3_strecker_layer_prereg.md]
    measurement:
      source: >-
        M3 prereg secs. 19 and 23 (the W6 designs; coordinator: not requested now); case M3 secs. 4 (D3, D4); case M3b
        (parked) and PR #87's proposal for arm (a)'s scale, headspace and deoxygenation and for arm (b); CK-50
