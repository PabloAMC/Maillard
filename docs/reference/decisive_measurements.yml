      summary: >-
        Three fed pots, none requested yet: (a) ARP-Phe with the ARP itself measured under argon and under air, the vial
        scale, the headspace / liquid ratio and the deoxygenation method stated; (b) a trapped fed-ARP-Phe pot under argon
        with MGO and GO quantified beside the three osones, with a post-incubation-trap control; and 1-DG fed with Phe,
        whose design is not yet written.
      arms:
        - name: "(a) fed ARP-Phe, the ARP measured per atmosphere"
