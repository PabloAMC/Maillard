      - blocker: >-
          The fed-DFG kinetics (Martins 2003, Davidek 2002) measure the total loss only, a one-sided bound; neither
          quantifies glucosone, and neither states the atmosphere.
        cites: [data/lit/extraction_dossiers/martins2003_extraction.md, data/lit/extraction_dossiers/davidek2002_extraction.md]
      - blocker: >-
          The route is oxidative and metal-catalysed (glucosone very low under argon, x 2 - 8 lower deaerated), so its
          rate depends on an O2 / metal state that no kinetic source on disk states.
        cites: [data/lit/extraction_dossiers/hofmann2000b_extraction.md, data/lit/extraction_dossiers/gobert2009_extraction.md]
