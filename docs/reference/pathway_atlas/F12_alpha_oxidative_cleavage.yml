condition_dependence: >-
  SHOWN: (1) Under pure 18O2 at 90 C and pH 8 (Nestle) the O2 alpha-cleavage of 1-DG carries ~1/3 of acetic acid, with
  the C4-aldonic counterpart rising x3 (air) to x7 (O2) over argon; the TOTAL acetic acid is O2-independent, i.e. the
  oxidative and hydrolytic routes share one 1-DG pool and O2 only re-partitions it. (2) At 37-50 C and pH 7.4 (Glomb,
  fed 1-DG + amine, 0.1 M phosphate) air raises glyceric acid x4.3, lactic acid x4-6 and the formyl / glycerinyl amides
  x1.4-1.7, lowers erythrulose and gamma-pyranone, and does NOT raise acetic acid (erythronic acid not found): the O2
  route there feeds C3 acids, not the Baeyer-Villiger acetic branch. (3) The O2 excess falls from 37 to 50 C
  (lactic 140 -> 90 mmol/mol; glyceric lower at 50 C). (4) Glyceric acid comes from glucose C-4..C-6 in both labs.
  NOT SHOWN: any air (rather than pure O2) share at 90-140 C; any pH ladder of the O2 route (pH 6 vs 8 at 90 C is a
  presence check only); any pentose; any chelator-only arm separating O2 from trace metals (every Glomb deaerated arm
  carries DTPA); the O2 route with free sugar + amine at 37-50 C. The two labs do not measure the same quantity (18O
  share vs aerated-minus-deaerated yield), so "two labs" holds for the DIRECTION (O2 raises C2-C4 acids from 1-DG), not
  for a magnitude. In sealed food-process vials (air headspace, 100-140 C) the O2 supply is finite; nothing on disk
  measures it for this family.
best_supported_regimes:
  - "alkaline (pH 8) / 90 C / dilute / glucose + glycine / phosphate / 18O2: operating, ~1/3 of acetic acid (labelling, one lab)"
  - "neutral (pH 7.4) / 37-50 C / dilute / fed 1-DG + amine / phosphate / air vs deaerated + DTPA: operating for lactic and glyceric acid (two papers, one lab, within-study factor)"
unknown_regimes:
  - "100-140 C with air headspace (the process regime): no O2 contrast on any acid"
  - "acid and mild acid (pH < 6): none"
  - "pentoses (1-deoxypentosone): none"
  - "intermediate_aw / low_aw: none"
  - "O2 vs metals separated (chelator without deaeration): none"
  - "free sugar + amine at low T with O2 contrast: none"
  - "cysteine pots (thiols compete for O2): none"
competing_families:
  - "F11_beta_dicarbonyl_cleavage: same 1-DG pool; wins without O2 and carries >= 2/3 of acetic acid even under 18O2 at 90 C"
  - "F08_oxidative_osone: O2 also oxidises the Amadori compound / sugar to glucosone (Gobert 2009) upstream of 1-DG"
  - "F15_redox_reductones: O2 oxidation of the 1-DG reductone / alpha-oxo-enediol to a tricarbonyl (Voigt 2010, proposed) is the step that makes the O2-dependent C3 acids; cysteine autoxidation competes for dissolved O2"
  - "1-DG cyclisation to gamma-pyranone (deaerated favours it, Voigt 2010)"
engine: >-
  Not in the engine as an acid route. There is no O2-dependent acid step on the trunk or the sulfur lane; the only O2
  consumers are ch_cys_ox (cysteine) and ch_red_ox_dpo / ch_red_ox_nf (the 'reductone' pool DPO / NF + OX -> FRAG_C,
  fitted, unidentified), which send the oxidised deoxyosone to inert carbon, not to glyceric / lactic / aldonic acids.
  For acetic acid this is consistent with the literature (O2-independent total, davidek2006b). For the C3 acids it is a
  gap: the engine carries no lactic / glyceric acid species, so the O2 re-partition of 1-DG (x4-6 at 37 C) cannot be
  represented, and the titratable acid budget (Brands: half the acid unidentified) has no O2 term. Engine condition
  dependence: none, since OX is zero in every default pot (B11 defaults).
