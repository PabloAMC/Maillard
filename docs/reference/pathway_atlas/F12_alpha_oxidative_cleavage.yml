family: F12_alpha_oxidative_cleavage
definition: "oxidative alpha-dicarbonyl cleavage (O2) -> acids (lactic, glyceric, acetic)"
# Built 2026-11-01 (pathway-atlas agent). Laboratories: Nestle Lausanne (Davidek 2006a / 2006b), Glomb Halle (Voigt 2009,
# Voigt 2010, Smuda 2010 - one lab), ICT Prague (Novotny 2008, persulfate only).
# Scope note: the Glomb O2 contrasts (lactic, glyceric) do not say WHICH oxidative step makes the acid - a Baeyer-Villiger
# alpha-cleavage (Davidek) or O2 oxidation of the reductone to a tricarbonyl followed by HYDROLYTIC cleavage (Voigt 2010
# Fig. 5, proposed). Both are recorded here as "the O2 route to C2-C4 acids"; only the 18O2 cells mark the Baeyer-Villiger step.
markers:
  - "18O from 18O2 in the carboxyl of the acid (one 18O per molecule; no acid / water exchange checked): davidek2006b. An O2-dependent acid made via a tricarbonyl + hydrolysis would carry NO 18O, so 18O measures the Baeyer-Villiger share only (voigt2010 sec. 1)."
  - "The C4-aldonic counterpart of acetic acid from 1-DG (erythronic / threonic acid = glucose C-3..C-6), rising with O2 (davidek2006b); glyceric acid from glucose C-4..C-6 only (davidek2006b, voigt2010 Table 1 / text)."
  - "An air vs argon (deaerated) contrast on lactic / glyceric / formyl products at fixed precursor (Glomb: deaerated arm also has 1 mM DTPA, so O2 and chelation are confounded)."
  - "Fed alpha-diketone (2,3-pentanedione) gives acetic + propanoic acid and NO propanal / acetaldehyde: rules out hydrolytic alpha-cleavage, consistent with oxidative alpha-cleavage (davidek2006a, O2 not varied)."
