  - key: {ph: neutral, temperature: low, water: dilute}
    tags: {ph_basis: in_situ, T_C: 25, sugar: none, carbonyl: formaldehyde, amine: cysteine, oxygen: not_stated, buffer: phosphate, metals: not_controlled}
