# Pathway-condition atlas: F04 (cysteine + sugar / carbonyl -> thiazolidine, its ring opening, and the Cys-Amadori route).
# Built 2026-11-01 from the extraction dossiers (data/lit/extraction_dossiers/), the cysteine-exchange record
# (docs/history/cys_exchange_2026-10-31/) and the cysteine review (docs/history/mechanism_reviews_2026-10-31/cysteine.md).
# Vocabulary: docs/reference/pathway_atlas/families.yml. Every quote is verbatim from the first dossier listed in its cell.
# Laboratories (independent): Kallen (U. Pennsylvania), Fife (USC), Pesek & Frost (N. Illinois), Schubert (Rockefeller),
# Kim / Yun / Park (Korea), de Roos (Givaudan), Xie (BTBU, Beijing), Zhang / Cui / Ho (Jiangnan), Mizutani / Obata (Hokkaido).
# Only THREE of them (Givaudan, BTBU, Jiangnan) work on a cysteine-SUGAR thiazolidine; the rest are carbonyl analogues.
# Duplicates counted once: Kang 2026 SI Fig. S3 = Zhai 2021 Fig. 6 (pH 7 arm, CF-076); Zhai 2021 / Zhai 2023 Food Chem /
# Zhai 2023 JAFC dicarbonyl arms (CF-066); Zhao 2017b is a same-lab sibling run of Cao 2017's blank (not a second lab).
# ph key "not_stated" is used where the source states no pH (solid storage, CO2-swept pots); it is outside the bins on purpose.

family: F04_thiazolidine_ttca
definition: "cysteine + sugar / carbonyl -> thiazolidine (TTCA) and its ring opening / Cys-Amadori"
markers:
  - "TTCA (2-threityl-thiazolidine-4-carboxylic acid) or the hexose analogue measured directly (LC-MS MRM / HPLC-ELSD against a purified standard) in a free cysteine + sugar pot; NOT mass alone: TTCA and the Cys-Amadori compound share m/z 254 (zhai2020_extraction.md)"
  - "a mass-action quotient [TTCA] / ([Cys][sugar]) that stays constant while all three concentrations move (pre-equilibrium; cao2017_extraction.md arithmetic 1)"
  - "free cysteine RELEASED from fed purified TTCA (rise then fall), and the Cys-Amadori compound (N-(1-deoxy-D-xylulos-1-yl)-L-cysteine / the tetrahydro-1,4-thiazine) appearing from fed TTCA or from Cys + sugar"
  - "label exchange: exogenous 13C5-xylose appearing in TTCA (re-formation), or 13C5-TTCA's xylose appearing in another amine's Amadori compound (ring release); 13C5-TTCA's intact C5 in MFT for the downstream route"
  - "trapping of the released thiol (iodoacetate -> S-carboxymethylcysteine) from a thiazolidine"
  - "the two opposite-sign perturbations of the exchange: added cysteine delays every downstream marker; added sugar speeds TTCA loss"
  - "NOT a marker of release: iodine uptake (it reads C-S ring-chain opening to the iminium-thiol, which is fast; schubert1936_extraction.md sec. 1 (3)); NOT a marker of formation: browning or volatiles"

cells:
  # ---------------- carbonyl-analogue physical chemistry (mechanism and pH shape; no transferable constant) ----------------
  - key: {ph: neutral, temperature: low, water: dilute}
    tags: {ph_basis: in_situ, T_C: 25, sugar: none, carbonyl: formaldehyde, amine: cysteine, oxygen: not_stated, buffer: phosphate, metals: chelated}
    contrast: "pH 5.57 -> 6.56 -> 7.45 (0.01 M phosphate, I 1.0 M KCl, EDTA): K_app 6.53e5 -> 2.32e6 -> 1.30e7 M^-1, x20; the ring couples to the cysteine monoanion (K_F3'/K_F2' = 217); TC ring-N pKa 6.24"
    status: operating
    quote: "so the apparent K rises ~20× between pH 5.6 and 7.5"
    quantity: "K_app x20 over 1.9 pH units at 25 C; hydrolysis k_r ~1e-6 s^-1 (t1/2 ~9 d) at pH 5.6-6.6 with kallen1971b (corrected relaxation reading, scratchpad cluster5/kallen1971_correction.md)"
    evidence: fed_intermediate
    lab: "Kallen (U. Pennsylvania)"
    dossiers: [kallen1971_extraction.md, kallen1971b_extraction.md]
    where: "Tables III-IV; Fig. 4 (approach to equilibrium from TC hydrolysis)"
  - key: {ph: acid, temperature: low, water: dilute}
    tags: {ph_basis: in_situ, T_C: 25, sugar: none, carbonyl: formaldehyde, amine: cysteine, oxygen: not_stated, buffer: carboxylate, metals: not_controlled}
    contrast: "cyanoacetate / formate / acetate buffer 0.05 -> 0.4 M at pH 2.3-5.0: no change in the formation rate (amine attack on unhydrated formaldehyde limits, uncatalysed); derived k_r FALLS with acidity (+0.54 log per pH unit, pH 2.8 -> 5.6)"
    status: operating
    quote: "by cyanoacetate, formate or acetate, 0.05-0.4 M, pH 2.3-5.0"
    quantity: "k_f (per total Cys) 0.014 / 0.12 / 0.59 M^-1 s^-1 at pH 2.84 / 4.47 / 5.57; no buffer catalysis below pH 5"
    evidence: within_study_factor
    lab: "Kallen (U. Pennsylvania)"
    dossiers: [kallen1971b_extraction.md]
