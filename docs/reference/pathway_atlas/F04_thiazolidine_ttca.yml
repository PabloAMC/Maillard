condition_dependence: >-
  SHOWN: (1) Formation is fast and extensive wherever free cysteine meets a pentose at >= 80 mM: 18 % of Cys bound at
  room temperature before heating (Zhai 2019), 65-89 % within 0.5 h at 70-90 C (Zhai 2019 Fig. 3A; Cao 2017 / Zhao 2017b),
  ~45 % at 120 C in phosphate (Zhang 2025b), with a constant mass-action quotient (~60 L/mol, Cao, in-situ pH 4.2-4.7).
  Two sugar labs (BTBU, Jiangnan) plus Givaudan's qualitative 50 C pre-equilibrium. (2) Temperature: above ~110 C the
  TTCA pool peaks and drains (Zhai 2019, 130 C: 46 -> 6.9 mM); released free Cys stays <= 16 mol % of fed TTCA at
  100-140 C (one data set, Kang S3 = Zhai 2021 Fig. 6). (3) pH: fed-TTCA loss rises x10 from label pH 5.5 to 8 (Zhai 2021,
  unbuffered, in-situ pH drifts to ~4.7-5.1, CF-010); the cysteine monoanion carries the ring equilibrium (Kallen, x20 in
  K from pH 5.6 to 7.5, formaldehyde, 25 C); the Cys-Amadori is most stable at pH ~5 and decays 3x faster at pH 6
  (de Roos); spray-dried TTCA converts to the Cys-Amadori more at pH 7.5-9.5 (Zhai 2020). (4) The TTCA -> Cys-Amadori
  branch is large in concentrated, acid, phosphate pots (Cao: Cys-ARP / TTCA 0.56 at 5 h, pH ~4.2; de Roos: <= 35 %) and
  small in unbuffered pH 7.4 water (Zhai 2019: <= 0.06) -- a cross-LAB contrast confounded by pH, buffer and
  concentration (CF-011). (5) Added amines speed the drain of TTCA (glycine, Cao; lysine, Zhang 2025b; same lab) but no
  study separates catalysis from competition for the sugar. (6) Exchange is reversible: added Cys delays downstream
  markers, added Xyl speeds loss, and 13C5 labels cross between TTCA and free sugar / Gly-Amadori (Zhai 2021, Zhao 2019)
  -- but no study gives a label share, so no cell can be `dominant` on that basis. (7) Rate-law form from analogues
  only: ring opening (C-S) is fast and is NOT release (Fife; Schubert's iodine); release is slow (k_r ~1e-6 s^-1 at 25 C
  for TC); buffer catalysis is absent below pH ~5 and saturates (x3.5-5) with phosphate above 5.5 (Kallen 1971b).
  ASSUMED / NOT SHOWN: any K(pH) or K(T) for a cysteine-SUGAR thiazolidine; the Arrhenius transfer of TC's k_r; whether
  the dilute (10 mM) vs concentrated (83-400 mM) discrepancy is catalysis, in-situ pH or a second cysteine sink
  (CF-076, EX-054 admits no rival); whether TTCA formed in ARP + Cys pots comes from deoxyosones or from ARP reversal
  (Wei 2022). Also unseen: the share of fed-TTCA loss that is ring opening vs direct degradation.
best_supported_regimes:
  - "acid / moderate (90 C) / concentrated / pentose + Cys, 0.2 M phosphate: TTCA formation in pre-equilibrium (K ~60 L/mol) then isomerisation to the Cys-Amadori -- operating (1 lab, BTBU, with a same-lab sibling run; mass balance)"
  - "neutral (label) / moderate-high (70-130 C) / dilute-concentrated / pentose + Cys, unbuffered water: TTCA formation (incl. at room temperature) and its drain above ~110 C -- operating (1 lab, Jiangnan)"
  - "neutral (label) / moderate-high / dilute fed TTCA: reversible ring release with label crossover -- operating (2 labs: Jiangnan 13C5-xylose, BTBU 13C5-TTCA)"
  - "mild_acid / moderate / concentrated (20-40 % water) / pentose + Cys: thiazolidine pre-equilibrium at 50 C and Cys-Amadori <= 35 % at 85-95 C -- operating (Givaudan, qualitative / yields)"
  - "analogue physical chemistry (formaldehyde, aryl aldehydes, 25-90 C, pH 1-12): mechanism and pH shape only (Kallen, Fife, Pesek, Schubert, Kim; 5 labs)"
unknown_regimes:
  - "hexose aldose + free cysteine thiazolidine at any condition (only de Roos's Table II glucose Cys-Amadori yields; no hexose TTCA concentration time course on disk)"
  - "K(pH) and K(T) for any cysteine-sugar thiazolidine; Cao's K is one temperature (90 C) and one in-situ pH band (4.2-4.7)"
  - "alkaline (> 7.5, in situ) at process temperature: only label pH 8 pots that drift acid"
  - "very_high (> 140 C) in solution; only spray-drying (Zhai 2020)"
  - "intermediate a_w at process temperature (de Roos 20-40 % water is the only one, a_w unmeasured); low a_w only as 25 C storage (Kang) and spray-drying"
  - "peptide- and protein-bound cysteine (no thiazolidine from a Cys residue measured); glutathione or N-terminal cysteine thiazolidines not covered here"
  - "inert vs air for the thiazolidine itself (no O2 contrast on disk; the cysteine sink in Wei 2022 and Zhai 2021 that looks like oxidation is not attributed)"
  - "phosphate 0 vs 0.2 M at fixed pH in one cysteine-sugar pot (the deciding experiment for CF-011 / CF-076; designed experiment E4)"
  - "dilute (10 mM) Cys + free sugar FORMATION time course (only fed-TTCA decay is dilute)"
  - "competition of other carbonyls for cysteine at process temperature beyond the Zhao 2017b lipid-aldehyde arms (MGO / GO / furfural thiazolidines: Mizutani's furfural ring only at 120 C H2S)"
competing_families:
  - "F22_cysteine_h2s: thermolysis of free cysteine competes for the same cysteine; the ring slows H2S only 1.2-3.5x (Mizutani), so binding is not protection"
  - "F28_thiol_losses: a fast non-TTCA cysteine sink (~70 % of Cys in 20 min, Wei 2022; ~19 mM unaccounted in Zhang 2025b; >= 84 % of fed TTCA's Cys never seen free, Kang S3) -- wins in dilute unbuffered water at pH ~7; TTCA wins in concentrated acid phosphate pots (Cao)"
  - "F02_amadori_heyns / F03_amadori_reversion: other amines (glycine, lysine) compete for the sugar released by the ring and drain TTCA (Cao, Zhang 2025b); the Gly-Amadori is the faster route at 140 C (Hou 2017)"
  - "F06 / F07 deoxyosone hub: TTCA / Cys-Amadori feed 3-DX > 1-DX; free Cys suppresses the hub (Zhai 2019, Zhai 2023 JAFC, Wei 2022), and TTCA may also form FROM deoxyosones (Wei 2022, unproven)"
  - "F18 / F26 lipid aldehydes: heptenal takes cysteine away from xylose (Zhao 2017b)"
  - "F23_mft_intact_c5: TTCA's intact C5 reaches MFT (97 %, Zhao 2019); the downstream consumer, not a competitor"
engine: >-
  In the engine (src/kinetic_core/sulfur.py, read only): r_ttca_cys (TTCA -> Cys + PENT, k_ttca_cys ~0.0286 /min at 100 C,
  Ea 64.1, NO pH factor, NO solute / buffer term) and r_ttca_deg (TTCA -> DPO + fragments without free Cys, no pH factor)
  are always on; TTCA is a FED species. r_ttca_form (B58: Cys + PENT -> TTCA by detailed balance with Cao's K = 60 L/mol,
  pH- and T-flat) and the de Roos route r_cama_form / r_cama_dpo / r_cama_tdp (B59b: formation pH-flat, Ea 100.9 transferred
  from a glucose system; decay on de Roos Fig. 4's pH table) are behind switches that are OFF by default
  (parameters_sulfur.TTCA_FORMATION.enabled / CYS_AMADORI_ROUTE.enabled = False). Mismatches: (1) the shipped engine
  cannot sequester cysteine in a Cys + pentose pot, while the literature binds 18-89 % of it before or within 0.5 h of
  heating; (2) every exchange constant is pH-flat where the literature shows strong pH dependence (fed-TTCA loss x10
  over label pH 5.5-8; analogue K x20 over pH 5.6-7.5), and the engine reads label pH in pots that drift ~1-3 units;
  (3) no amine or buffer catalysis of ring release / TTCA -> Cys-Amadori, while glycine and lysine visibly speed the
  drain (mechanism unresolved) and Kallen 1971b says phosphate catalysis saturates and is absent below pH 5 (against a
  linear k_P law); (4) the engine's exchange releases cysteine 2-30x faster than Zhai 2021's dilute pots allow
  (EX-054 E0 rejected, single lab; CF-076), yet a slower exchange fails the concentrated pots; (5) one lumped ring
  opening + hydrolysis step, where Fife shows two (harmless only while release is rate-limiting); (6) no water-activity
  or very-high-T dependence for TTCA, though a_w is the main storage stressor (Kang) and spray-drying converts TTCA to
  the Cys-Amadori (Zhai 2020).
