family: F24_mft_fragments
definition: "MFT from C2 + C3 fragment recombination"
# Conventions as in F23_mft_intact_c5.yml (water bin from all solutes, buffer included; buffer molarity in tags.buffer_M).
# The F24 share is visible ONLY in a 1:1 mixture of unlabelled and uniformly labelled sugar (mixed isotopomers
# M+2 / M+3, and M+1 / M+4 from C1 + C4) or with a positional label. A pot with 100 % labelled sugar sees only
# CROSS-SOURCE recombination (sugar fragment x thiamine or amino-acid fragment); that is recorded as such.
markers:
  - "1:1 unlabelled : [13C5]pentose or [13C6]hexose: MFT M+2 / M+3 (C2 + C3) above the enrichment-impurity level; M+1 / M+4 for C1 + C4"
  - "[1-13C]ribose: MFT with the label off the 2-methyl carbon, or a 0 / 1 / 2-label spread"
  - "fed hydroxyacetaldehyde + 1-mercapto-2-propanone (or + 2-oxopropanal / H2S) giving MFT: the step can run"
  - "1-mercapto-2-propanone (the C3 sulfur intermediate) measured in a sugar + cysteine pot"
  - "EI-MS caveat: the [M-H]+ ion of an M+5 isotopomer sits at M+4; a share computed without the (M-1)/M correction reads as fragments (Liu 2023 re-read)"
