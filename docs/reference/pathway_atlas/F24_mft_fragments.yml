condition_dependence: >-
  SHOWN: fragment recombination is a FEASIBLE MFT route (fed hydroxyacetaldehyde + 1-mercapto-2-propanone is the most
  efficient fed MFT route at 145 C, 0.24 mol %, x20 from pH 3 to 7, x5.8 dry), and its C3 sulfur partner exists in a
  glucose + Cys pot (Table 9; one lab, Garching). But wherever a 1:1 label could see it, recombination carries
  <= ~1-6 % of MFT: 95 C pentose (Cerny 2003 / 2004), 140 C glucose + GSH (Zhao 2019b, BTBU), 150 C glucose + Cys
  (Du 2023, CAAS), 168 C ribose + Cys (Liu 2023, ~6 % after the EI correction; 19 % as printed), and cross-source
  mixing with thiamine <= ~1 % at 145 C, pH 4-7 (Cerny 2007 / 2007b). Three labelling labs; no temperature trend is
  measured once the Liu artefact is removed. So F24 is feasible but not operating at a measurable share in aqueous
  aqueous pots from 95 to 168 C, pH 5-6.5. The fed pair's pH sign (rises to pH 7) is opposite to total MFT's (falls to
  pH 7), a further sign that the fed route is not what makes MFT in sugar pots. ASSUMED / unshown: that F24 gains at
  low a_w or > 170 C (the only recombination evidence there is for butane-2,3-dione at 180 C dry, cited, not MFT);
  that hexose pots without a sugar label run F24 (the engine's hexose assumption; labelling says no).
best_supported_regimes:
  - "mild_acid-neutral / moderate-very_high (95-168 C) / dilute or concentrated (0.2-0.5 M phosphate) / pentose or glucose + Cys or GSH: absent or <= ~6 % (labelling, 3 labs: Cerny, BTBU, CAAS)"
  - "fed C2 + C3, no sugar, 145 C pH 3-7 and 180 C dry: operating (fed_intermediate, 1 lab: Garching)"
unknown_regimes:
  - "low a_w / dry heating (180 C silica, meat crust) with a 1:1 sugar label: never measured for MFT"
  - "> 170 C (roasting) with a label"
  - "100-140 C pentose pots with a 1:1 label (Cerny 2007 / 2007b used 100 % labelled xylose: own-fragment recombination invisible)"
  - "alkaline pH (> 7.5), where the fed C2 + C3 route is fastest and enolisation favours fragmentation"
  - "intermediate a_w, protein-bound amines, ammonium, peptides other than GSH"
  - "a second laboratory for the fed C2 + C3 -> MFT yield (Garching only)"
competing_families:
  - "F23_mft_intact_c5: wins the MFT carbon wherever labelled (>= 94-99 %)"
  - "F10_retroaldol_c3_c2 / F09_namiki_c2: supply the C2 + C3 fragments (hydroxyacetaldehyde, MGO)"
  - "F26_thiazoles_thiophenes: 1-mercapto-2-propanone and MGO + H2S also feed thiazoles, mercaptoketones and the C4 diketone route; 2-acetylthiazole is 64 % non-glucose C3 in Zhao 2019b"
  - "F22_cysteine_h2s: H2S supply is limiting for the C3 thiol (Table 7)"
engine: >-
  In the engine: r_ha_mp_mft (HA + MP -> MFT, Hofmann T10), r_mgo_mp (MGO + H2S -> MP, T7), fed by r_dpo_c2c3
  (DPO -> HA + MGO) and r_glc_c2c3 (glucose -> HA + MGO + C1). Mismatches: (1) the hexose route to MFT is ONLY C2 + C3
  (r_glc_c2c3 note: 'Hexoses reach MFT ONLY through fragmentation') with the hexose C5 entry r_odg_dpo off by default,
  while Zhao 2019b and Du 2023 show hexose MFT is an intact glucose C5 with < 1 % mixed channels: F24 should carry ~0
  of hexose MFT, not all of it. (2) the fitted C2 + C3 drain on DPO sits at +2.2 to +2.4 dex (thiol prereg sec. 8;
  STATUS_AND_PLAN B.7); whether that drain reaches MFT through r_ha_mp_mft at a share above the labelled <= 6 % in
  Cerny's or Liu's pots should be read off the engine regime map (not run here). (3) r_ha_mp_mft is fitted at 145 C
  only (Hofmann T8 / T10) and carries the fed pair's rising pH law, which must not leak into sugar-pot MFT. (4) The
  thiol prereg sec. 11's 'fragment share 0.19 at Liu's conditions' signature rests on the Liu 19 %, now read as an
  EI artefact (withdrawn per MECHANISM_REVIEWS_2026-10-31 row 5); any engine target of 10-30 % fragments at 168 C is
  unsupported.
