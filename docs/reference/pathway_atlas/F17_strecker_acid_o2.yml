# Pathway-condition atlas, family F17 (literature side). Written 2026-11-01 from the extraction dossiers named per
# cell; vocabulary and status caps from docs/reference/pathway_atlas/families.yml. Every quote is a verbatim substring
# of the cited dossier (checked by scratchpad check_atlas.py, whitespace-normalised). Numbers marked "mine" are derived
# by this atlas, not printed. The O2-independent dicarbonyl aldehyde is F16; lipid / keto-acid donors (and their O2
# dependence) are F18; the O2 diversion of the Amadori compound to glucosone itself is F08.
family: F17_strecker_acid_o2
definition: "the O2 route to Strecker ACIDS (e.g. phenylacetic acid); Amadori-compound oxidative route to Strecker products"
markers:
  - "Strecker ACID (phenylacetic, 3-methylbutanoic acid) that rises under air vs argon in the SAME fed-donor pot (Hofmann 2000 Table 4: PAA x1.6 - 5.5) while the aldehyde does not."
  - "Labelled aldehyde fed into the pot does NOT become labelled acid (< 1 % in 30 min, [13C2]PA): the acid comes by a branch parallel to the aldehyde (the hemiaminal / enaminol), not by oxidising the aldehyde. A model that makes PAA from PA fails this marker."
  - "Metal catalysis on the acid only: Cu(II) raises PAA x1.33 with PA unchanged (fed MGO)."
  - "Amadori oxidative route: a FED Amadori compound gives the Strecker aldehyde (and acid) x9 - 10 more under air than argon, with the same PA / PAA ~2 in every atmosphere; with an OPD trap the ARP's main dicarbonyl switches from 1-deoxyosone (argon) to glucosone (air + Cu)."
  - "A fed Amadori compound out-producing its free sugar + amino acid at equal charge marks an Amadori-centred route but NOT its oxidative character, unless the atmosphere is varied (such cells are 'unattributed')."
