condition_dependence: >-
  SHOWN (all at 85 - 100 C, pH 7 label, phosphate, one laboratory for every O2 contrast). The Strecker ACID needs
  O2 when the donor is a C2 / C3 dicarbonyl (MGO, glyoxal: 77 - 82 % of the acid is O2-dependent) and much less for
  C6 dicarbonyls (38 - 55 %); Cu(II) adds x1.3 to the acid only. The acid is not made by oxidising the aldehyde
  (label, < 1 %). The acid branch grows with pH (x7 from pH 3 to 9, figure-only) and with time (PAA / PA 1.6 ->
  2.3 over 500 min). A fed Amadori compound makes the aldehyde (and acid) x9 - 10 more under air than argon with
  an atmosphere-independent PA / PAA ~2, and under air + Cu the trapped ARP dicarbonyl switches to glucosone; the
  glucose pot is less O2-sensitive for the aldehyde (x3.5, vessel-flagged, CF-074) but as sensitive for the acid
  (x9). Two other labs (Quest, Phe; Ho network, Met) show the Amadori compound out-produces the free sugar at equal
  charge (x2 - 270, largest at pH 3.2), but neither varied O2. NOT SHOWN: any O2 contrast at > 100 C, at low water,
  outside phosphate pH 7, with a chelated arm, or in a second laboratory; any measurement of the hemiaminal /
  enaminol intermediate or of dissolved O2.
best_supported_regimes:
  - "neutral / moderate (98 C) / dilute / fed MGO or glyoxal + Phe under air: the O2 route carries most of the Strecker acid (fed_intermediate + argon contrast; DFA only, PROVISIONAL)"
  - "neutral / moderate (100 C) / dilute / fed ARP-Phe under air: an O2-dependent Amadori route to PA and PAA operates (x9 - 10; DFA only)"
  - "acid and neutral / moderate / dilute: fed Amadori compound > free sugar as a Strecker source (Quest, Phe; with DFA at pH 7 in air) -- oxidative character unattributed"
unknown_regimes:
  - "any temperature above 100 C with an air / argon contrast"
  - "intermediate_aw and low_aw (no O2 contrast on the acid or the ARP route)"
  - "acid and mild_acid pH with controlled O2 (the pH series is under uncontrolled air)"
  - "chelated vs not_controlled metals at food trace levels (only 5 - 25 mM Cu(II) added)"
  - "amino acids other than Phe for the acid (Leu / Ala acids measured once, glucose pot, air only; acetic acid not Strecker-specific)"
  - "a second laboratory for any F17 marker (evidence map 2.6: SINGLE)"
  - "dissolved-O2 dose: the atmosphere is argon vs air-saturated closed vial, never a partial-pressure series"
competing_families:
  - "F16_strecker_aldehyde: the same imine / enaminol gives the aldehyde without O2; under argon F16 wins for every donor, under air F17 takes the acid share (PA / PAA 0.50 for MGO, 3.3 for glucosone)."
  - "F08_oxidative_osone: O2 on the Amadori compound makes glucosone (trapped) instead of the Strecker products; the two are the same oxidative step's two exits."
  - "F07_enol23_1deoxyosone: under argon the ARP goes to 1-deoxyosone + free amino acid instead."
  - "F12_alpha_oxidative_cleavage: O2 also cleaves the dicarbonyls to acids (acetic acid from 1-DG), which is why the Ala 'Strecker acid' (acetic acid) is not route-specific."
  - "F18_lipid_strecker: lipid enals need O2 for the aldehyde itself (the opposite of F16)."
engine: >-
  NOT IN THE ENGINE. There is no Strecker ACID species and no O2-dependent Strecker step. The only O2 lever is B29
  (trunk_conditions.OXIDATIVE_ENTRY_STEPS = k_ama_g, k_glc_g: the oxidative entries to glucosone, F08) and its
  ATMOSPHERE_FACTORS table holds only air = 1.0, so any argon or air + Cu pot is refused rather than answered. The
  only Amadori -> Strecker-aldehyde step is r_marp_mtal (B22b, methionine ARP -> methional, first order, Ea 85
  declared at one temperature), not shipped (B22B_SHIPPED = False) and with NO oxygen term, although the measured
  Amadori route is x9 O2-dependent (engine_family_map.yml). MISMATCHES: (a) no acid exit, so the engine cannot carry
  the x4 - 5.5 air / argon acid effect or the pH 3 -> 9 branch swing; (b) the B29 note's argument (aldehyde
  O2-independent from fed dicarbonyls, so the O2 dependence sits upstream) is right for the dicarbonyl aldehyde but
  omits the direct ARP route, which the forced-input feasibility (EX-049) found necessary for the glucose pot (DC-only
  rejected) while the blind test (EX-051) rejected its present shape; (c) no metal term.
