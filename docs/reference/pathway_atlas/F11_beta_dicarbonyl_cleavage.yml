family: F11_beta_dicarbonyl_cleavage
definition: "hydrolytic beta-dicarbonyl cleavage -> acids (acetic, formic) + C_n-1 fragments"
# Built 2026-11-01 (pathway-atlas agent, families F11-F15). Sources: extraction dossiers only (no PDF re-read).
# Laboratories: Nestle Lausanne (Davidek / Blank: 2002, 2005, 2006a, 2006b, 2008 - one lab; davidek2005's glucose
# series and Fig. 4 duplicate davidek2006a Table 1 / Table 2 and are counted once), Glomb Halle (Voigt 2009, Smuda 2010),
# Wageningen (Martins 2005 / 2005b, Brands 2001, Knol 2010 - one lab), ICT Prague (Novotny 2008), McGill (Yaylayan).
markers:
  - "Fed 1-deoxyosone (synthetic 1-DG) gives acetic acid at ~0.5-0.8 mol/mol with no oxidant and no amine (davidek2006a Fig. 3), with its C4 counterpart (erythrulose / tetroses; voigt2009, davidek2006a Fig. 7)."
  - "O2-independence of acetic acid: argon = air = 18O2 totals, and >= 2/3 of acetic acid carries no O2-derived oxygen under 18O2 (davidek2006b). This is what separates F11 from F12 for the SAME 1-DG parent."
  - "13C pattern: acetic acid carries hexose C-1/C-2 (~70 %) or pentose C-1/C-2 (77-89 %) - this marks the 1-deoxyosone ORIGIN, not the cleavage type: glycolaldehyde oxidation and the F12 Baeyer-Villiger route also put C1-C2 into acetic acid (huyghuesdespointes1996 sec. 5). Read together with the O2 marker."
  - "Fed model beta-diketone (2,4-pentanedione) splits to acetic acid + acetone near-equimolar (davidek2006a Fig. 5)."
  - "Amine-induced variant: N-epsilon-acyl-lysine amides (acetyl, formyl, lactoyl, glycerinyl) from fed 1-DG, absent from acid + amine controls (smuda2010)."
  - "Negative marker: fed 3-DG gives hardly any acetic acid (davidek2006a) - the 3-deoxyosone is not a beta-cleavage parent of acetic acid. No marker on disk identifies the ROUTE to formic acid (beta-cleavage of maltosone-type 1,4-glycosylated osones, alpha-cleavage of 3-DG and sugar-only chemistry all give it)."
