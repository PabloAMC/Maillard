condition_dependence: >-
  SHOWN: (1) The hydrolytic beta-cleavage of the 1-deoxyosone is the main acetic-acid route in dilute aqueous phosphate
  at pH 6-8, 37-120 C, with or without amine: labelling (Nestle, glucose and xylose), the 18O2 / argon contrast (Nestle,
  90 C pH 8) and fed 1-DG (Nestle 120 C without amine; Glomb 37 C with alanine / Boc-lysine) - two laboratories by fed
  intermediate, one by labelling. (2) pH: the fed-1-DG yield is steep below pH 6 (0.20 at pH 5 vs 0.80-0.84 at
  pH >= 6.5, saturating), and the acetic yield from glucose / DFG collapses toward pH 4 (1-4 mol %); Martins' fit and
  the DFG / 1-DG comparison (davidek2005 sec. 1 item 3) put the pH-6->8 rise mainly upstream (2,3-enolisation share),
  not in the cleavage. (3) Amine: not required (amine-free 1-DG); amine-as-nucleophile < 1 % (Smuda); amine ACCELERATION
  of the cleavage untested anywhere - but the amine raises acetic acid from glucose x2.6 (Brands, casein) by making the
  Amadori 2,3-enolisation available; amine identity changes the 1-DG acid yield x2 in one lab (CF-080, open). (4) O2:
  total acetic acid O2-independent at 90 C pH 8 (the hydrolytic route compensates when O2 is excluded); 37 C deaerated
  gives 18 % MORE acetic acid. (5) Buffer: at constant in-situ pH, phosphate does not change acetic acid per DFG
  decomposed (Davidek 2002, 90 C) - so H4 (phosphate-calibrated 1-DX sink applied to water) is about rates, not yields.
  (6) Temperature: label shares and yields similar at 90 and 120 C; Ea of the lumped step ~76 kJ/mol (two Wageningen
  fits). ASSUMED (not shown): the pentose 1-deoxyosone behaves like 1-DG (only Davidek 2008's label supports it); the
  amine-free alkaline acetic acid (Novotny) is beta-cleavage. FORMIC ACID: no route marker; the fed 3-DG yields are
  tiny (<= 1.7 mol %), sugar-only chemistry carries most of it (Brands), so formic acid is not evidence for F11.
best_supported_regimes:
  - "neutral-alkaline (pH 6-8) / 90-120 C / dilute / hexose or pentose + glycine, phosphate: dominant (labelling + 18O2, Nestle)"
  - "neutral (pH 6.5-8) / 120 C / dilute / fed 1-DG, NO amine, phosphate: dominant (fed, Nestle)"
  - "neutral (pH 7.4) / 37 C / dilute / fed 1-DG + alanine, phosphate: dominant (fed + partial mass balance, Glomb)"
unknown_regimes:
  - "acid (pH < 4.5) and mild acid with labelling: only unlabelled yields (1-4 mol %) and the pH-5 fed-1-DG point"
  - "intermediate_aw and low_aw aqueous-free systems: only a pyrolysis label that cannot discriminate (Yaylayan)"
  - "very_high T (> 140 C) with a route marker: Knol's lumped fit only"
  - "water (unbuffered) vs phosphate for the 1-deoxyosone itself (fed 1-DG or 1-DX in water): none; only DFG at constant pH (Davidek 2002)"
  - "pentose 1-deoxyosone fed directly: none; amine-free pentose acetic acid: Novotny arabinose in alkali only"
  - "amine acceleration (same precursor with / without amine): none anywhere"
  - "protein-bound amine: Brands casein (unlabelled) only; cysteine pots: none"
competing_families:
  - "F12_alpha_oxidative_cleavage: same 1-DG pool under O2; at 90 C pH 8 F12 takes ~1/3 of acetic acid but the total does not change (compensation); at 37 C O2 raises glyceric / lactic acid and lowers acetic acid"
  - "F13_furans_dehydration (1-DX -> norfuraneol, 1-DG -> acetylformoin / DMHF) and 1-DG cyclisation (gamma-pyranone): compete for the 1-deoxyosone; Nakamura's 1-DX is 76 % of xylose at pH 8 yet norfuraneol peaks at 4-16 mol %"
  - "F15_redox_reductones / F16 Strecker: the 1-deoxyosone as Strecker donor (1,4-dideoxyosone, Nedvidek; r_dpo_ddp with cysteine)"
  - "F10_retroaldol_c3_c2: retro-aldol of 1-DG to MGO is negligible at 37-50 C (Voigt 2009); beta-cleavage wins"
engine: >-
  In the engine: r_odg_aa (trunk, 1-DG -> AA + C4, Martins step 8, k 1.45 /min at 100 C, Ea 76; the trunk has NO pH
  state, so the step is pH-flat while fed 1-DG gives x4 less acetic acid at pH 5 than at pH >= 6.5); r_dpo_aa (sulfur
  lane, 1-DPO -> AA + C3, fitted on Davidek 2008, slope or saturating pH law, aa_pk 6 from Davidek 2006a Fig. 3 - this
  matches the literature's shape; amine-independent, as Davidek 2006a allows); r_fru_acids (Fru -> FA + AA, Martins step
  10); r_tdg_fa (3-DG -> FA + C5, Martins step 5). MISMATCHES: (a) r_aa_frag destroys acetic acid at a rate >= 40x the
  Davidek 2008 plateau allows (CF-069, open). (b) r_tdg_fa: with Martins' constants (k5 3.45e-2 /min, Ea 30; k9 8.12e-4
  L/mmol/min, Ea 95.2) the engine's 3-DG -> formic share at 120 C and 0.1 M glycine is ~13 % of 3-DG [my arithmetic, not
  an engine run], against <= 1.7 mol % formic from FED 3-DG + glycine at 120 C, pH 4-8 (Davidek 2006a; formic not by
  SIDA): ~x8 too much formic acid from 3-DG, if the arithmetic holds - worth one engine check. (c) No O2 term on the
  acetic-acid total, which is right (davidek2006b); no amine-nucleophile amide channel, which is right at < 1 %.
  (d) No phosphate-vs-water factor on the cleavage, consistent with Davidek 2002 for yields; the rate side is untested.
