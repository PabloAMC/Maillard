family: F23_mft_intact_c5
definition: "MFT from an intact C5 unit (ribose / 1,4-dideoxypentosone / norfuraneol + H2S)"
# Conventions of this file (2026-11-01):
# - water bin from the REACTANT charge (sugar + amine + fed intermediate), buffer molarity stated in tags.
# - "C5 unit" includes a hexose's C5 fragment (C-1 or C-6 loss) when a 1:1 [13C6]-glucose label shows MFT as
#   0 : 5 isotopomers only; tagged subroute: hexose_c5. The F23 / F24 split is read ONLY from 1:1 (unlabelled :
#   uniformly labelled) mixtures or positional labels; a pot whose sugar is 100 % labelled cannot see C2 + C3
#   recombination of its own fragments, so those cells say "sugar-derived" and nothing more.
# - subroute tag: intact_c5_total (MFT carries one sugar's C5, whatever the intermediate), free_nf (via free
#   norfuraneol), ddp_or_bound (intact C5 not via free NF: 1,4-dideoxypentosone or an amine-bound C5).
markers:
  - "1:1 unlabelled : [13C5]pentose (CAMOLA): MFT isotopomers only M+0 and M+5, the 1-4-label channels at the
    impurity level (98-99 % enrichment) -> intact C5; mixed channels -> F24"
  - "[1-13C]ribose: MFT singly labelled, label on the 2-methyl carbon (ribose C-1 -> methyl)"
  - "fed unlabelled norfuraneol against [13C5]ribose at equimolar charge (Cerny pot D): the unlabelled MFT share is
    the free-NF sub-route's share"
  - "free-NF marker isomer 2-mercapto-3-pentanone: made from fed NF (Cerny pot D 96 % NF-derived; Whitfield 1999),
    absent when the free-NF pool is small; present / absent from the sugar alone reads the NF sub-route on or off"
  - "1:1 unlabelled : [13C6]glucose: MFT as M+0 / M+5 only -> a hexose C5 fragment, not C2 + C3"
  - "1,4-dideoxypentosone (DDP) trapped as 2-methyl-3-(2'-hydroxyethyl)quinoxaline (o-phenylenediamine in situ)"
  - "fed intermediates (NF, ARP, TTCA) + H2S / cysteine giving MFT: shows the step can run, not its share"
