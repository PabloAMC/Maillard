condition_dependence: >-
  SHOWN: wherever a 1:1 label could see it, MFT keeps one sugar's C5 (95 C: Cerny 2003 / 2004, 95 %; 140-150 C from
  glucose: Zhao 2019b, Du 2023, a hexose C5 with < 1-6 % mixed channels; 168 C: Liu 2023b, ~81 % printed, ~94 % on the
  EI re-read). Three labelling labs (Cerny, CAAS, BTBU), pH 5-6.5, dilute phosphate pots, so F23 is the dominant MFT
  carbon route from 95 to 168 C. Inside F23 the sub-route shifts with temperature and pH: at 95 C, pH 5 free NF
  carries only 7 % even when fed at the ribose's charge, and its marker 2-mercapto-3-pentanone is absent (intact C5
  not via free NF dominant: DDP or an amine-bound C5; DDP is trapped only with alpha-amino acids, Nedvidek). At 145 C
  the NF marker appears only at pH >= 6 (Cerny 2007) while fed NF makes MFT at pH 4.5 and none at 6.5 (Whitfield
  2001); Hofmann's ribose pot holds 3000x more NF than MFT. So free NF is a minor MFT channel at 95 C and an
  operating but unquantified one at 145 C; its share at 145 C is NOT measured (no labelled pot D at 145 C). In
  concentrated boiled pots (de Roos, 37 % water) the NF marker forms from ribose although fed NF stays a poor MFT
  source. Total MFT falls x22-150 from pH 3-4.5 to 6.5-7 in two labs (Garching, Reading; unattributed), and buffer
  catalyses the branch 2-8x (Reading). ASSUMED, not shown: that the same intact-C5 route holds at 100-140 C in pentose
  pots (no 1:1 pentose label between 95 and 168 C; Cerny 2007 / 2007b used fully labelled xylose), and the pH
  dependence of the intact-C5 route itself (only total MFT is measured across pH). Thiamine competes for the MFT
  carbon at dilute loadings (F27: 54-98 % of MFT).
best_supported_regimes:
  - "mild_acid / moderate (95 C) / dilute / pentose + cysteine, phosphate: dominant (labelling, 1 lab: Cerny 2003 + 2004), free-NF sub-route minor (7 %)"
  - "neutral / high-very_high (140-150 C) / dilute / glucose + Cys or GSH: dominant as a hexose C5 (labelling, 2 labs: BTBU, CAAS)"
  - "mild_acid / very_high (168 C) / pentose + Cys: dominant (labelling, CAAS; share 81-94 % depending on the EI correction)"
  - "free-NF sub-route: operating at 140-145 C, mild_acid (fed NF, 2 labs: Garching, Reading); shut for MFT at pH 6.5 (Reading); its marker forms from xylose only at pH >= 6, 145 C (Cerny)"
unknown_regimes:
  - "100-140 C with a 1:1 pentose label (the regime of the Schieberle / Hofmann / Yiltirak pots): no CAMOLA on disk"
  - "the NF share at 145 C (no labelled fed-NF competition pot above 95 C) and its time dependence (no time-resolved pot D)"
  - "alkaline pH (> 7.5) and acid pH < 4.5 with a label"
  - "low a_w / dry heating: Hofmann's 180 C silica arm has no label for MFT; confounded with T, t and buffer"
  - "intermediate a_w (meat-like, 0.5-0.9) with a label; de Roos 37 % water has yields but no label"
  - "protein-bound amines, peptides other than GSH, ammonium as the amine"
  - "oxygen contrast (air vs inert) on any MFT route"
  - "DDP never fed and never measured as quinoxaline in a cysteine pot at known temperature; its rise before MFT is unobserved"
  - "ribose-5-phosphate / IMP (meat's ribose forms) with a label"
competing_families:
  - "F24_mft_fragments: the alternative carbon route; at <= 5-6 % wherever a 1:1 label could see it (95, 140, 150, 168 C)"
  - "F27_thiamine_gsh_sources: thiamine wins MFT carbon at dilute loadings (Cerny 2007: 75-90 %; Wang 2012: > 98 %; falls to 54 % at 300 / 100 / 100 mM)"
  - "F26_thiazoles_thiophenes: free NF goes mostly to mercaptoketones (16x MFT), dithiolanones and thiophenones, increasingly at pH 6.5; the same H2S feeds them"
  - "F13_furans_dehydration / F06: 3-deoxypentosone -> furfural -> FFT (F25) competes for the pentose at acid pH; F07 1-deoxypentosone is F23's entry"
  - "F28_thiol_losses: disulfide-bound MFT is ~35 % of the NF-made MFT at 140 C pH 4.5 (Whitfield 1999)"
engine: >-
  In the engine: r_ddp_mft / r_ddp_mft_hs (DDP + H2S / HS-, the intact-C5 route, fed by r_dpo_ddp: DPO + Cys -> DDP +
  Strecker products), r_nf_mft (free NF + H2S) and r_dpo_nf, plus r_arp_dpo / r_cama_dpo / r_ttca_deg as C5 sources.
  Mismatches: (1) the shipped lane made ~100 % of its MFT through free NF (k_ddp_mft frozen ~7500x below k_nf_mft;
  thiol prereg sec. 9) against Cerny's 7 % at 95 C; round 3 admitted R3En (DDP formation without the free-amine law),
  but Cerny pot D still fails in every arm (0.98-0.99 NF share; STATUS_AND_PLAN B.5) and the early DDP supply is ~10x
  too fast in the first hour. (2) Hexoses reach MFT in the engine ONLY via C2 + C3 (r_glc_c2c3 note) and the hexose
  C5 entry r_odg_dpo is off (HEXOSE_C5_ENTRY k = 0), while two labelling labs show hexose MFT is an intact C5
  (Zhao 2019b, Du 2023). (3) The NF marker 2-mercapto-3-pentanone (r_nf_mp3p) is the right diagnostic, but the
  engine has no temperature- or pH-switch making it absent at 95 C / pH 5 and present at 145 C / pH >= 6; whether
  it is reproduced is untested. (4) No buffer-catalysis term on DPO / DDP formation (Mottram 2002: 2-8x); phosphate
  enters only through pH. (5) The intact-C5 route's pH law is fitted (R3En), the measured pH dependence is of total
  MFT only, so the split of the x22-150 acid preference between supply (DPO / DDP) and the H2S / HS- step is not
  identified by the literature.
