condition_dependence: >-
  SHOWN: in aqueous pentose + cysteine pots at pH 4-6 the furfural route is the FFT route. Three labelling / fed
  results from two laboratories (Nestle / Firmenich, Cerny; DFA Garching, Hofmann) agree: fed furfural out-competes
  ribose 92 : 8 in one pot (95 C, pH 5), ribose C-1 lands on the CH2SH carbon (95 C), norfuraneol contributes 0 %, and
  FFT stays > 99 % intact pentose C5 at 145 C over pH 4-6 even with thiamin present; fed furfural is 60x ribose and 7x
  the 3-deoxyosone (145 C, pH 5). The pH dependence is strong and one-signed in four studies (Cerny 2007, Hofmann
  1998, Meynier 1995, and the Hofmann hexose rows peak at pH 5): FFT falls 6-19x from pH 3-4.5 to 6.5-7 and is not
  detected at pH 7 / 145 C (Cerny 2007), with furfural vanishing first (pH 6). The fall tracks furfural supply, not an
  H2S shortage: H2S-driven products rise at pH >= 6 in the same pots (F26 cells). The only fed system at pH 7
  (Zhai, (NH4)2S, 120 C) gives the highest molar yield (~22 %, CF-065, semi-quantitative), so at neutral pH the step
  itself is fast and furfural formation is what fails. Water: dry 180 C raises ribose FFT 8x (but furfural 1500x, so
  FFT per furfural collapses) and lowers hexose FFT 2x; glycerol raises FFT ~56x at 110 C (patent); T and water are
  confounded in every dry contrast. Sugar: pentose 4x hexose at 145 C, with no labelling of the hexose route. Lipid:
  phospholipids lower FFT 1.4-2x (Reading, one group) while a structured-lipid phase raises it 7x (patent, CF-031).
  Concentration: no FFT at meat-like mM levels at 100 C (Grosch). ASSUMED, not shown: that the 95 C / 145 C labelling
  transfers to 100-140 C (no labelled FFT cell in the high bin; the high-bin cells rest on Zhai's fed pot) and that
  the step is the same in hexose pots. In roasted coffee the route is NOT shown: FFT and furfural anti-correlate
  (Poisson) and furfuryl alcohol supplies >= 34 % of FFT (Cerny 2021); thiamine alone also makes FFT (Grosch).
  Independent laboratories with marker evidence for the route: 2 (Cerny's Nestle/Firmenich line counted once; DFA
  Garching) plus 1 fed-only (Zhai). DFA Garching's Schieberle 1998 / Hofmann 1998 FFT cells are one data set (CF-006).
best_supported_regimes:
  - "mild_acid / moderate (95 C) / dilute / pentose + Cys, phosphate: dominant (1 lab, labelling + fed, three independent markers)"
  - "mild_acid / very_high (145 C) / dilute / pentose + Cys, phosphate: dominant (labelling, Cerny 2007) and fed-efficiency operating (Hofmann T3); 2 labs"
  - "acid (pH 3-4) / very_high / dilute / pentose + Cys: FFT highest (2 labs, within-study pH ladders)"
  - "neutral (pH 6.5-7) / high-very_high / dilute / pentose + Cys: FFT 6-19x lower to undetected (3 labs, within-study pH ladders); furfural is the limiting partner"
unknown_regimes:
  - "low temperature (<= 60 C): no formation data at all"
  - "alkaline (> 7.5): never studied for FFT formation"
  - "intermediate a_w (0.5 - 0.9): only the two end points (aqueous, dry silica 180 C), confounded with T"
  - "high bin (100 - 140 C) with labelling: no labelled FFT study; only fed (Zhai, pH 7) and level-only ladders"
  - "hexose pots: FFT measured (Hofmann) but never labelled in water (in roasted coffee [13C6-fructose]-sucrose gives FFT 0 % M+5, Poisson 2009); the furfural-from-hexose step is unshown"
  - "peptide / protein-bound amine and real meat matrices: no marker study (coffee results point away from free furfural)"
  - "oxygen (air vs inert) on FORMATION: no within-study contrast"
  - "time-resolved labelling (does the furfural share change during a cook?): none"
  - "furfuryl alcohol + H2S in water: not fed in any aqueous pot on disk"
competing_families:
  - "F13_furans_dehydration: supplies furfural; F25 is capped by it at pH >= 6 (furfural gone before FFT, Cerny 2007; Meynier furfural 3.9 -> tr)"
  - "F23_mft_intact_c5: same pentose and H2S pool; 3-deoxyosone -> furfural -> FFT vs 1-deoxy / 1,4-dideoxyosone -> MFT; MFT wins in water at pH 3-5, FFT wins dry (Schieberle 1998) and at pH 6-6.5 (Meynier MFT/FFT < 0.07)"
  - "F26_thiazoles_thiophenes: H2S diverted to thiophenones / dithiolanes / mercaptoketones at pH >= 6 and to lipid alkylthiophenes / thiapyrans with phospholipid"
  - "F28_thiol_losses: FFT disulfide from the free-thiol pool (binomial in Cerny 2003), melanoidin / protein binding and Fenton loss (losses, not formation)"
  - "F31_melanoidins / F21: furfural consumed by amines (lysine) - Meynier furfural 39x lower with Cys/Lys than Gly at pH 4.5"
  - "F27_thiamine_gsh_sources: thiamine makes FFT without pentose (Grosch Table II)"
  - "rival FFT routes outside the family list: furfuryl alcohol -> FFT (Cerny 2021, coffee roast); C2 + C3 feed (hydroxyacetaldehyde + mercapto-2-propanone) also gives FFT (Hofmann 1998 T8: 26 / 40 / 58 ug at pH 3 / 5 / 7, rising with pH; may pass through furfural, Hofmann T6)"
engine: >-
  In the engine. Furfural is made by r_tdp_fur (3-deoxypentosone -> FUR, k_tdp_fur) and r_glc_fur (hexose -> FUR,
  k_glc_fur); FFT only by r_fur_fft (FUR + H2S, k_fur_fft) and r_fur_fft_hs (FUR + HS-, k_fur_fft_hs; the prereg
  records 89-99.5 % of FFT through this branch). Sinks: r_fur_decay; ch_fft_decay, ch_thiolate_loss_fft,
  ch_thioether_fft, ch_protein_ss_fft, ch_dimer_fft, ch_add_fft_dpo / _tdp. Topology matches the labelling (furfural
  as the only FFT precursor in pentose pots). Mismatches: (1) pH direction - because FFT forms mainly through the HS-
  branch, the engine's formation rises with pH; the prereg reports measured FFT falling x19 from pH 3 to 7 (Hofmann
  T2) while predicted FFT rises x180, so the engine must lose FFT at pH 7 through ch_thiolate_loss_fft rather than
  fail to form it; the literature says furfural supply collapses (Cerny 2007, Meynier). (2) No water / a_w term:
  dry 180 C (FFT x8, furfural x1500) and glycerol (x56) are outside the engine. (3) No furfuryl-alcohol species and
  no thiamine -> FFT or C2 + C3 -> FFT route, so coffee-type or thiamine-rich systems cannot be represented.
  (4) Fed-sulfide rows charge H2S as fully dissolved (CF-065 remedy note). (5) Hexose FFT rests on r_glc_fur, a
  step no labelling supports. Read only: src/kinetic_core/sulfur.py, species_sulfur.py, parameters_sulfur.py.
