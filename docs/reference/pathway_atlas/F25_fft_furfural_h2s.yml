# Pathway-condition atlas, family F25 (literature side). Written 2026-11-01 from the extraction dossiers only.
# Every cell's `quote` is copied verbatim from the first dossier it cites (grep -F finds it, markdown included).
# Status convention used here: F25 is a ROUTE (furfural + H2S), so FFT measured without a route marker is
# `operating` only where a marker study (labelling or fed furfural) exists in the same primary-axis bin
# (ph x temperature x water); elsewhere it is `unattributed`.
family: F25_fft_furfural_h2s
definition: "furfural + H2S -> 2-furfurylthiol (FFT)"
markers:
  - "Fed furfural competing with [13C5]pentose in one pot: the unlabelled (furfural-derived) share of FFT (Cerny 2003 pot E)."
  - "Positional label: ribose C-1 found at the FFT CH2SH carbon, i.e. at the former furfural CHO carbon (Cerny 2004, [1-13C]ribose)."
  - "Intact-C5 label pattern: FFT only M+0 / M+5 from a 1:1 [12C5]/[13C5] pentose charge (no M+1..M+4 beyond the ~4-5 point isotopic-impurity budget), with furfural itself intact in the same pot."
  - "Fed-precursor efficiency at equal charge: furfural vs 3-deoxyribosulose vs ribose + H2S -> FFT mol % (Hofmann 1998 T3); furfural + sulfide molar yield (Zhai 2023 JAFC Fig. 6)."
  - "Negative markers for rival routes: fed norfuraneol contributes 0 % of FFT (Cerny 2003 pot D); fed [2H4]-furfural / d2-furfuryl alcohol label transfer in roasted coffee (Poisson 2009; Cerny 2021)."
