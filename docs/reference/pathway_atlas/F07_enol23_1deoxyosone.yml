# Pathway-condition atlas, family F07 (written 2026-11-01, atlas agent "hub"; vocabulary: families.yml).
# Bin conventions as in F06_enol12_3deoxyosone.yml: pH boundary values go to the upper bin (4.5 -> mild_acid,
# 6.0 -> neutral, 7.5 -> neutral); temperature upper edges inclusive (100 C / aqueous reflux -> moderate); tags.operator
# "formation_flux" = trap present during heating, "standing_level" = trap after the run; "[derived here]" = this file's
# arithmetic on printed numbers; "not_stated" = the source prints no value for that axis.
family: F07_enol23_1deoxyosone
definition: "2,3-enolisation -> 1-deoxyosone (1-DG / 1-DX)"
markers:
  - "IN-SITU trapped 1-deoxyosone quinoxaline (2-methyl-3-(1',2',3'-trihydroxypropyl)quinoxaline from 1-DG; 2-methyl-3-(1',2'-dihydroxyethyl)quinoxaline from 1-DX) with OPD present from t = 0: the FORMATION split (Beck 1988, Nedvidek 1992, Gobert 2009)."
  - "Acetic acid carrying glucose C-1 / C-2 (or xylose C-1 / C-2) from 13C isotopomers: the 1-deoxyosone's beta-dicarbonyl cleavage signature (Davidek 2005 / 2006a / 2008); combined with the fed 1-DG acetic-acid yield it bounds the share of the ARP that passed through 1-DG."
  - "Fed 1-DG / fed ARP products specific to the 1-deoxyosone: acetic acid + C4 (erythrulose, 1-deoxythreosone), acetylformoin / norfuraneol / 2,3,4-pentanetrione, hydroxyacetone from glucose but NOT from 3-DG (Weenen 1998), 1,4-dideoxyosones with alpha-amino acids (Nedvidek)."
  - "Standing 1-deoxyosone by EX-SITU OPD: presence only. 1-DG is gone within ~5 min at pH >= 6 and 120 C (Davidek 2006a), so its standing level understates its flux by an order of magnitude or more."
