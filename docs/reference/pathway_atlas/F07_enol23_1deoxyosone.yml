condition_dependence: >-
  SHOWN: (i) pH - every in-situ trap and every fit puts the 2,3-enolisation share up with pH: 62 % -> 95 % of trapped
  osone flux from pH 4.5 to 7 (Beck), 1-DG / 3-DG x5 from pH 5 to 7 (Nedvidek), pD 0.60 vs 0.35 (Martins 2005b), and
  the labelled acetic acid bounds >= 50 % (pH 6) / >= 67-70 % (pH 8) of a fed glycine ARP through 1-DG at 120 C
  (Davidek). The same pH rise makes the STANDING 1-DG smaller relative to its flux (Deng 2021 pH 7.5; Davidek 2006a
  lifetime < 2 min at pH >= 6), which is why standing ratios point the other way at the late, acidified times of
  unbuffered pots (Hou 2026, Zhou 2024b). (ii) Oxygen - at 50 C air LOWERS the trapped 1-DG x3.4 (Gobert), the flux
  going to glucosone instead; untested at 100-140 C. (iii) Amine structure - a tertiary-N ARP routes ~all to 1-DG even
  at pH 4.5 (Beck); amine-free 1-DG formation exists in the glucose glass (Kocadagli). (iv) Sugar - pentose ARPs show
  F07 by labelling (Davidek 2008) and by fit (Desclaux 51 : 1), but there is NO in-situ trap on a pentose amino-acid
  ARP. ASSUMED / UNSHOWN: temperature dependence beyond Martins' fitted Ea; phosphate vs water (every flux datum is in
  phosphate: Beck, Nedvidek, Gobert, Davidek, Desclaux, Martins); acid juices (pH 3.4) show no standing 1-DG.
best_supported_regimes:
  - "neutral-to-alkaline / moderate-high / dilute / hexose ARP in phosphate: dominant over F06 (Ledl school trapping; Nestle labelling + fed; Wageningen fit: 3 labs)"
  - "neutral / high / dilute / pentose + glycine in phosphate: operating, >= ~12-25 % of xylose (Nestle labelling) and 98 % of the fitted enolisation (Reading fit): 2 labs"
  - "neutral / low (50 C) / dilute / glucose + lysine, deaerated: the largest trapped C6 osone (Glomb, 1 lab)"
unknown_regimes:
  - "in-situ trapping of a pentose amino-acid (or cysteine) ARP: no formation split for 1-DX exists on disk"
  - "unbuffered water vs phosphate for the 2,3-enolisation at 100-140 C (hub H4): every flux datum is in phosphate"
  - "O2 / argon at 100-140 C"
  - "acid (< 4.5) at cooking temperature (juices are 27-37 C, standing only)"
  - "intermediate a_w and protein-bound lysine"
  - "amine acceleration of the 2,3-enolisation itself (no amine-free ARP analogue; Smuda / Voigt pots all carry an amine)"
competing_families:
  - "F06_enol12_3deoxyosone: loses the formation flux to F07 at pH >= ~6; wins the standing level"
  - "F08_oxidative_osone: under air at 50 C takes flux away from 1-DG (Gobert: glucosone 44.5 vs 1-DG 6.9 mmol/mol)"
  - "downstream sinks that define the 1-DG lifetime: F11 beta-cleavage (acetic acid, 0.8 mol/mol, amine-free), F12 oxidative cleavage (lactic / glyceric x4-6 with air, Voigt 2010), F13 norfuraneol / acetylformoin, F15 / F16 Strecker reduction to 1,4-dideoxyosones (Nedvidek); F10 retro-aldol of 1-DG is negligible (Voigt 2009)"
engine: >-
  Hexose trunk: r_ama_odg (Martins k7) and the amine-free r_fru_odg (Kocadagli step 8); 1-DG exits r_odg_aa, r_odg_af,
  r_odg_da. k_ama_odg carries the same 0.69 dex/pH factor as k_ama_tdg (trunk_conditions.PH_STEPS), so the engine's
  F07 / F06 split does not move with pH - the in-situ and labelled data say it moves ~0.25-0.45 dex per pH unit toward
  F07. No O2 term on r_ama_odg (only k_ama_g / k_glc_g carry the atmosphere lever, and argon refuses), so Gobert's air
  vs deaerated shift (x3.4 on 1-DG) cannot be represented. Pentose lane: r_arp_dpo and r_pent_dpo carry the "base"
  factor and r_arp_dpo_thermal none - the direction matches the literature. The shipped Cys-ARP route fixes
  dpo_share = 0.30 (split_law "none"), from Zhai 2019's STANDING 3-DX / 1-DX 2.1-2.6; the formation-flux evidence
  (Beck pH 7, Desclaux pH 6, Davidek's labelled bound) puts the 1-deoxyosone share at >= 0.5-0.98 at pH 6-8 in
  phosphate. A standing ratio used as a flux split under-states F07 by up to ~2 decades if the transfer to pentose ARP
  in water holds (red team claim 3b gives that transfer P 0.35; carry dpo_share as a band reaching >= 0.9). The
  PAMA enolisations are pinned 4.1x (to 1-DP) and 9.1x (to 3-DP) above ARP's derived rates to sit on Desclaux, a
  0.5 M phosphate fit (parameters_sulfur.py note): phosphate vs amino-acid identity is unresolved there.
