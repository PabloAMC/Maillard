# =======================================================================================================================
# ENGINE GAPS -- families with no engine reaction (or none on in the shipped configuration), and families whose key
# condition the engine cannot express.
# =======================================================================================================================
engine_gaps:
  no_reaction: [F09_namiki_c2, F12_alpha_oxidative_cleavage, F18_lipid_strecker, F20_extra_pyrazine_routes, F32_dha_crosslinks]
  no_shipped_reaction: [F17_strecker_acid_o2, F21_pyrroles_pyridines]
  partial:
    F02_amadori_heyns: "aldose only; no Heyns compound from fructose"
    F03_amadori_reversion: "no reversion to sugar + amine; amine release only inside the hub steps"
    F04_thiazolidine_ttca: "formation off; only a charged TTCA reacts"
    F22_cysteine_h2s: "cysteine's own Strecker H2S off"
    F23_mft_intact_c5: "pentose only; the hexose -> C5 entry is off"
    F26_thiazoles_thiophenes: "no lipid aldehyde / NH3 route; thiophenes off"
    F30_lipid_oxidation_crossover: "lipid side only; no crossover into Maillard routes"
    F31_melanoidins: "in-pot formation of binding melanoidins off; binders are a matrix input"
  condition_not_expressible:
    oxygen:
      families: [F05_protein_glycation, F08_oxidative_osone, F12_alpha_oxidative_cleavage, F15_redox_reductones, F17_strecker_acid_o2, F19_aminoketone_pyrazine, F28_thiol_losses, F30_lipid_oxidation_crossover]
      why: "trunk: only 'air' has a factor (trunk_conditions.py:275), other atmospheres raise; sulfur: OX seeded 1.0 in every pot (engine.py:2533) and every O2 supply / consumer constant is 0; lipid: no LOOH formation."
    amine_class:
      families: [F01_schiff_glycosylamine, F02_amadori_heyns, F06_enol12_3deoxyosone, F07_enol23_1deoxyosone, F16_strecker_aldehyde, F19_aminoketone_pyrazine]
      why: "Gly is the only trunk amine (PRO / MET added to it, engine.py:2560/2565; Met / Pro chains off); pyrazine constants are alanine data; no other Strecker donors; pentose + non-sulfur amine off; sulfur 'base' factor is the cysteine pKa for every amine."
    buffer:
      families: [F01_schiff_glycosylamine, F02_amadori_heyns, F06_enol12_3deoxyosone, F07_enol23_1deoxyosone, F10_retroaldol_c3_c2, F11_beta_dicarbonyl_cleavage, F29_acrylamide]
      why: "no step anywhere carries a buffer-catalysis term; phosphate (CF-011) is only a titrant in the sulfur pH state."
    water:
      families: [F05_protein_glycation, F06_enol12_3deoxyosone, F07_enol23_1deoxyosone, F13_furans_dehydration, F14_caramelisation_amine_free, F16_strecker_aldehyde, F22_cysteine_h2s, F23_mft_intact_c5, F28_thiol_losses]
      why: "a_w acts only on k_schiff (trunk) and the acrylamide pair; the sulfur and lipid lanes have none; dilute vs concentrated is not a variable; below a_w 0.33 the trunk multiplier is held."
    ph_in_the_dynamic_lane:
      families: [F03_amadori_reversion, F06_enol12_3deoxyosone, F07_enol23_1deoxyosone, F10_retroaldol_c3_c2, F11_beta_dicarbonyl_cleavage, F13_furans_dehydration]
      why: "the sulfur lane computes pH but its 29 trunk steps get none (TRUNK_PH_TERMS False, sulfur.py:1278); the trunk and acrylamide lanes use a static declared / initial pH; the lipid lane none."

vocabulary_gaps:
  - "methionine sulfur chemistry: methional -> methanethiol -> DMDS (r_mtal_msh); no family"
  - "asparagine deamidation to aspartate (a_asn_asp); no family"
  - "lumped sinks of named products to accounting pools (X_unassigned_sink: 18 keys)"
