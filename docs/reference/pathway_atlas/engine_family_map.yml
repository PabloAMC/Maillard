  # =====================================================================================================================
  # network.METHIONINE_REACTIONS (B22 / B22b) -- trunk lane only; NOT SHIPPED
  # =====================================================================================================================
  r_go_met:
    lanes: [trunk]
    family: F16_strecker_aldehyde
