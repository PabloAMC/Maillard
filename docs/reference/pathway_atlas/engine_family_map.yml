# Pathway-condition atlas, ENGINE SIDE: which engine reaction implements which family, and the condition
# dependence the engine CODES for it (a map, 2026-11-01; no simulation grid).
#
# Read from: src/kinetic_core/network.py (TRUNK_REACTIONS and its blocks), sulfur.py (FULL_REACTIONS =
# network.REACTIONS + FED_3DEOXY_REACTIONS + SULFUR_REACTIONS, REACTION_PH_FACTOR, inactive_reactions),
# acrylamide.py (FULL_ACRYLAMIDE_REACTIONS = network.REACTIONS + ACRYLAMIDE_REACTIONS), lipid.py (its analytic
# steps), trunk_conditions.py, acrylamide_conditions.py, parameters_sulfur.ph_factor, engine._integrate_program.
# The numbers (Ea, pH ratios, on/off) were read from the shipped configuration (engine.core_parameters(lane) and the
# lanes' rate-constant functions at 100 C), not from a run.
# Vocabulary: families.yml (binding). Checker: scripts/generators/check_engine_family_map.py
#   ./scripts/docker_maillard.sh run "python -m scripts.generators.check_engine_family_map"
#
# FIELDS (per reaction)
#   lanes      -- the lanes whose reaction tuple carries the key (the checker verifies this against the tuples).
#   family     -- ONE primary family id from families.yml, or one of the pseudo ids below.
#   secondary  -- optional further family ids.
#   shipped    -- true when the step carries a non-zero rate in the SHIPPED configuration (checker: k != 0 at 100 C,
#                 pH 7 / the lane's reference, and not in sulfur.inactive_reactions()). off_reason says which switch.
#   ph         -- the coded pH factor, per lane where lanes differ. Ratios are k(pH)/k(reference) at 100 C.
#   T          -- the coded temperature law (Arrhenius Ea in kJ/mol unless stated) and its evidence class.
#   o2, amine, buffer, water -- the coded term; OMITTED MEANS "none: no term in the code".
#   note       -- what matters for the comparison with the literature atlas.
#
# PSEUDO IDS (not families; engine steps outside the families.yml vocabulary)
#   X_unassigned_sink         -- a lumped loss of a named species to FRAG / MEL accounting pools, no chemistry named.
#   X_outside_vocabulary      -- named chemistry that no family in families.yml covers (listed under vocabulary_gaps).
#   X_transport               -- mass transfer, not a reaction (gas-liquid oxygen supply).
#
# LANE-LEVEL CONDITION MACHINERY (what the per-reaction fields abbreviate)
#   pH, trunk lane: STATIC, the DECLARED pH (process.ph), applied once to k_ref by trunk_conditions.apply
#     (engine.py:2657). Terms: Martins 2003 slope 0.69 dec/unit about pH 6.8 on k_ama_tdg / k_ama_odg / k_ama_mgo
#     (trunk_conditions.py:126; x0.057 at pH 5, x14.9 at pH 8.5); 0.77 dec/unit on k_tdg_fa (trunk_conditions.py:145);
#     the Leahy two-slope pyrazine term (knot 7, ref 6.8) on k_go_ak / k_mgo_ak (x0.091 at pH 5, x2.6 at pH 8.5) and,
#     by transfer, on k_go_met / k_mgo_met / k_mgo_pro / k_ha_athp. Everything else on the trunk: no pH term.
#   pH, sulfur lane: DYNAMIC in-situ pH (ph_state), factor kinds from sulfur.REACTION_PH_FACTOR (sulfur.py:1158),
#     normalised to 1 at pH 5 (parameters_sulfur.ph_factor, :992). The 29 trunk steps the lane carries get NO pH term:
#     sulfur.TRUNK_PH_TERMS = False (sulfur.py:1278).
#     Ratios quoted below are k(pH)/k(pH 7) at 100 C, I = 0:
#       acid        [H+]                        x100 at pH 5,  x0.01 at pH 9
#       base        free cysteine-amine fraction x0.010 at pH 5, x86 at pH 9
#       neutral_h2s neutral H2S fraction         x4.3 at pH 5,  x0.013 at pH 9
#       hs_anion    HS- fraction                 x0.043 at pH 5, x1.29 at pH 9
#       thiolate    thiolate fraction            x0.017 at pH 5, x2.4 at pH 9
#       hydroxide   [OH-] (only on switched-off steps)
#   pH, acrylamide lane: STATIC, INITIAL pH, window 4-8 held at the edges (acrylamide_conditions.py:122-123):
#     k_asn_glc 0.235 dec/unit (x0.38 pH 5, x1.9 pH 8), k_acr_dp 0.149 dec/unit (x0.54 pH 5, x1.5 pH 8). The 26 trunk
#     steps the lane carries: no pH term.
#   pH, lipid lane: none (engine.NO_PH_TERM_LANES).
#   water: trunk lane a_w multiplier on k_schiff ONLY (trunk_conditions.py:82; x3.5 at a_w 0.6, held below 0.33);
#     acrylamide lane: flat formation term on k_int1_acr inside a_w 0.34-0.99 and an elimination shape on k_acr_dp
#     (x0.58 at a_w 0.6); sulfur and lipid lanes: none. No term distinguishes dilute from concentrated solutions.
#   oxygen: trunk lane: an atmosphere lever on k_glc_g / k_ama_g (trunk_conditions.py:266) whose factor table holds
#     only air = 1 (trunk_conditions.py:275): any other atmosphere RAISES. Sulfur lane: an oxidant state OX seeded at
#     1.0 ambient for every pot (engine.py:2533, also under inert_gas), resupply k_ox_supply = 0 and the two O2
#     consumers k_cys_ox / k_red_ox = 0 in the shipped report: OX is a fixed, non-replenished oxidant charge consumed
#     only by the thiol dimerisations. Acrylamide and lipid lanes: none (the lipid LOOH pool is an input; no
#     initiation, parameters_lipid.py:593).
#   amine: the trunk's single amine is Gly; PRO and MET are ADDED TO Gly on the trunk lane (engine.py:2560, :2565);
#     the B18 pyrazine constants are alanine data declared as glycine; bound lysine LYSP is charged only from a
#     protein loading. Sulfur lane: cysteine is the catalyst of pentose enolisation (r_pent_*), the pentose + other
#     amine entry is OFF; ARP (a fed pentose Amadori compound) is the only non-sulfur amine route. Acrylamide lane:
#     Asn, plus Gln / Lys / Ala / Cys as competitors.
#   buffer: no reaction carries a buffer (phosphate / carboxylate) CATALYSIS term anywhere. The sulfur lane uses the
#     buffer only as a titrant in the pH state. Every Martins / De Vleeschouwer constant was measured in phosphate.
#   temperature: Arrhenius per step (KineticParameter / SulfurParameter.k_at). The sulfur lane's fitted formation steps
#     share ONE barrier, 64.08 kJ/mol (frozen lumped_formation_Ea_kJ_mol), the osone / furfural / norfuraneol sinks
#     one 143.5 (carbonyl_sink), the thiol sinks one 101.3 (thiol_sink); measured overrides in
#     parameters_sulfur.MEASURED_EA_OVERRIDES. The lipid rate is a Q10 = 2.45 law from 25 C (parameters_lipid.py:312).

schema: engine_family_map/v1
vocabulary: docs/reference/pathway_atlas/families.yml
pseudo_ids: [X_unassigned_sink, X_outside_vocabulary, X_transport]

lanes:
  trunk: {tuple: network.TRUNK_REACTIONS, n: 55}
  sulfur: {tuple: sulfur.FULL_REACTIONS, n: 132, composition: "network.REACTIONS (26) + FED_3DEOXY_REACTIONS (3) + SULFUR_REACTIONS (103)"}
  acrylamide: {tuple: acrylamide.FULL_ACRYLAMIDE_REACTIONS, n: 42, composition: "network.REACTIONS (26) + ACRYLAMIDE_REACTIONS (16)"}
  lipid: {tuple: "none (analytic steps in lipid.integrate_lipid)", n: 6}

reactions:
  # =====================================================================================================================
  # network.REACTIONS -- B1 + B7, carried by trunk, sulfur and acrylamide lanes (same constants in all three)
  # =====================================================================================================================
  r_schiff:
    lanes: [trunk, sulfur, acrylamide]
    family: F01_schiff_glycosylamine
    shipped: true
    ph: "none in every lane"
    T: "Ea 96.8, measured (Martins 2005 step 1, composite)"
    amine: "Gly = the generic amine (PRO, MET added to it on the trunk lane)"
    water: "trunk lane only: a_w multiplier x3.5 at a_w 0.6 (Pereyra Gonzales 2010, measured on bound-lysine loss)"
  r_amadori:
    lanes: [trunk, sulfur, acrylamide]
    family: F02_amadori_heyns
    shipped: true
    ph: "none"
    T: "derived: 44.9 x k_schiff x amine loading, so Ea 96.8 by construction"
    amine: "Gly generic"
    water: "trunk lane: inherits the k_schiff a_w multiplier through the derivation"
    note: "Aldose only: the fructose / Heyns arm does not exist (Fru has no amine reaction)."
  r_glc_fru:
    lanes: [trunk, sulfur, acrylamide]
    family: F14_caramelisation_amine_free
    shipped: true
    ph: "none"
    T: "Ea 123.0, measured (Martins step 2)"
    note: "Lobry de Bruyn isomerisation; amine-independent and pH-independent in code although base-catalysed."
  r_fru_glc:
    lanes: [trunk, sulfur, acrylamide]
    family: F14_caramelisation_amine_free
    shipped: true
    ph: "none"
    T: "Ea 93.0, measured (Martins step 3)"
  r_ama_tdg:
    lanes: [trunk, sulfur, acrylamide]
    family: F06_enol12_3deoxyosone
    secondary: [F03_amadori_reversion]
    shipped: true
    ph: "trunk: +0.69 dec/unit about 6.8 (x0.057 pH 5, x14.9 pH 8.5); sulfur: none (TRUNK_PH_TERMS False); acrylamide: none"
    T: "Ea 97.0, measured (Martins step 4)"
    amine: "Gly generic; the amine is regenerated"
  r_tdg_fa:
    lanes: [trunk, sulfur, acrylamide]
    family: F11_beta_dicarbonyl_cleavage
    shipped: true
    ph: "trunk: +0.77 dec/unit about 6.8 (x0.041 pH 5, x20 pH 8.5); sulfur: none; acrylamide: none"
    T: "Ea 30.0, measured (Martins step 5; flagged ea_conflicts_with_knol_2010, three_laboratories_disagree_b44)"
  r_ama_mgo:
    lanes: [trunk, sulfur, acrylamide]
    family: F10_retroaldol_c3_c2
    secondary: [F03_amadori_reversion]
    shipped: true
    ph: "trunk: +0.69 dec/unit (Martins); sulfur: none; acrylamide: none"
    T: "Ea 125.0, measured (Martins step 6)"
    amine: "Gly generic; regenerated"
  r_ama_odg:
    lanes: [trunk, sulfur, acrylamide]
    family: F07_enol23_1deoxyosone
    secondary: [F03_amadori_reversion]
    shipped: true
    ph: "trunk: +0.69 dec/unit (Martins); sulfur: none; acrylamide: none"
    T: "Ea 107.0, measured (Martins step 7)"
    amine: "Gly generic; regenerated"
  r_odg_aa:
    lanes: [trunk, sulfur, acrylamide]
    family: F11_beta_dicarbonyl_cleavage
    shipped: true
    ph: "none in every lane"
    T: "Ea 76.0, measured (Martins step 8)"
  r_tdg_mel:
    lanes: [trunk, sulfur, acrylamide]
    family: F31_melanoidins
    shipped: true
    ph: "none"
    T: "Ea 95.2, measured (Martins step 9, the mass sink)"
    amine: "Gly generic (consumed)"
  r_fru_acids:
    lanes: [trunk, sulfur, acrylamide]
    family: F14_caramelisation_amine_free
    secondary: [F11_beta_dicarbonyl_cleavage]
    shipped: true
    ph: "none"
    T: "Ea 237.0, measured but flagged ea_poorly_determined (Martins step 10)"
  r_glc_frag:
    lanes: [trunk, sulfur, acrylamide]
    family: F14_caramelisation_amine_free
    shipped: true
    ph: "none"
    T: "Ea 180.7, fitted (B1); k(100 C) = 1e-8 /min, effectively inert"
  r_mgo_mel:
    lanes: [trunk, sulfur, acrylamide]
    family: F31_melanoidins
    shipped: true
    ph: "none"
    T: "Ea 20.04, fitted (B1) and sitting on the 20 kJ/mol lower bound"
    amine: "none: MGO enters the melanoidin pool without an amine (carbon only)"
  r_fa_frag:
    lanes: [trunk, sulfur, acrylamide]
    family: X_unassigned_sink
    shipped: true
    ph: "none"
    T: "Ea 20.5, fitted at the lower bound; k(100 C) 3.5e-8 /min"
  r_aa_frag:
    lanes: [trunk, sulfur, acrylamide]
    family: X_unassigned_sink
    shipped: true
    ph: "none"
    T: "Ea 20.0, fitted at the lower bound"
  r_glc_tdg:
    lanes: [trunk, sulfur, acrylamide]
    family: F06_enol12_3deoxyosone
    secondary: [F14_caramelisation_amine_free]
    shipped: true
    ph: "none"
    T: "Ea 107.2, measured in a 160-200 C glucose melt (Kocadagli), extrapolated below 160 C"
    amine: "amine-free"
    water: "none (measured in a melt, applied in water too)"
  r_tdg_ddg:
    lanes: [trunk, sulfur, acrylamide]
    family: F13_furans_dehydration
    shipped: true
    ph: "none"
    T: "Ea 36.9, fitted (B7, melt data, extrapolated below 160 C)"
  r_ddg_hmf:
    lanes: [trunk, sulfur, acrylamide]
    family: F13_furans_dehydration
    shipped: true
    ph: "none"
    T: "Ea 0 (author-fixed to zero; 'does not follow Arrhenius')"
  r_fru_int:
    lanes: [trunk, sulfur, acrylamide]
    family: F13_furans_dehydration
    secondary: [F14_caramelisation_amine_free]
    shipped: true
    ph: "none"
    T: "Ea 100.4, measured in the melt, extrapolated below 160 C"
  r_int_hmf:
    lanes: [trunk, sulfur, acrylamide]
    family: F13_furans_dehydration
    secondary: [F14_caramelisation_amine_free]
    shipped: true
    ph: "none"
    T: "Ea 151.4, measured in the melt, extrapolated below 160 C"
  r_fru_odg:
    lanes: [trunk, sulfur, acrylamide]
    family: F07_enol23_1deoxyosone
    secondary: [F14_caramelisation_amine_free]
    shipped: true
    ph: "none"
    T: "Ea 99.3, measured in the melt"
    amine: "amine-free"
  r_tdg_mgo:
    lanes: [trunk, sulfur, acrylamide]
    family: F10_retroaldol_c3_c2
    shipped: true
    ph: "none (a 0.63 dec/unit term was tried in B40 and rejected by the Leitzen hold-out; trunk_conditions.py:153)"
    T: "Ea 84.8, measured in the melt"
  r_hmf_self:
    lanes: [trunk, sulfur, acrylamide]
    family: X_unassigned_sink
    shipped: true
    ph: "none"
    T: "Ea 0 by declaration (one temperature, 5 C)"
  r_odg_af:
    lanes: [trunk, sulfur, acrylamide]
    family: F13_furans_dehydration
    shipped: true
    ph: "none"
    T: "Ea 0 by declaration (level transferred from the pentose fit)"
  r_af_dmhf:
    lanes: [trunk, sulfur, acrylamide]
    family: F13_furans_dehydration
    secondary: [F15_redox_reductones]
    shipped: true
    ph: "none"
    T: "Ea 76.0, declared 'not rate-limiting' assumption"
    note: "A reduction with no reductant in the stoichiometry."
  r_mgo_dmhf:
    lanes: [trunk, sulfur, acrylamide]
    family: F13_furans_dehydration
    secondary: [F10_retroaldol_c3_c2]
    shipped: true
    ph: "none"
    T: "Ea 0 (single temperature, digitised bar chart); k 1.2e-9 L/(mmol min)"

  # =====================================================================================================================
  # network.FED_3DEOXY_REACTIONS -- trunk and sulfur lanes (not acrylamide)
  # =====================================================================================================================
  r_ddg_tdg:
    lanes: [trunk, sulfur]
    family: F06_enol12_3deoxyosone
    secondary: [F13_furans_dehydration]
    shipped: true
    ph: "none"
    T: "Ea 36.9, declared equal to the forward dehydration (B39 fit)"
  r_ddg_dgal:
    lanes: [trunk, sulfur]
    family: F06_enol12_3deoxyosone
    secondary: [F13_furans_dehydration]
    shipped: true
    ph: "none"
    T: "Ea 36.9, declared (B39)"
  r_dgal_ddg:
    lanes: [trunk, sulfur]
    family: F06_enol12_3deoxyosone
    secondary: [F13_furans_dehydration]
    shipped: true
    ph: "none"
    T: "Ea 36.9, declared (B39)"

  # =====================================================================================================================
  # network.DICARBONYL_REACTIONS (B13) -- trunk lane only
  # =====================================================================================================================
  r_glc_g:
    lanes: [trunk]
    family: F08_oxidative_osone
    shipped: true
    ph: "none"
    T: "Ea 125.9, measured (Kocadagli, glucose melt in air)"
    o2: "atmosphere lever; only air answerable (factor 1), argon / air_cu raise"
  r_g_go:
    lanes: [trunk]
    family: F10_retroaldol_c3_c2
    secondary: [F08_oxidative_osone]
    shipped: true
    ph: "none"
    T: "Ea 4.2, fitted (B21; barrier consistent with zero)"
  r_odg_da:
    lanes: [trunk]
    family: F10_retroaldol_c3_c2
    secondary: [F11_beta_dicarbonyl_cleavage]
    shipped: true
    ph: "none"
    T: "Ea 150.8, measured in the melt"
  r_go_sink:
    lanes: [trunk]
    family: X_unassigned_sink
    shipped: true
    ph: "none"
    T: "Ea 0 (author-fixed)"
  r_da_sink:
    lanes: [trunk]
    family: X_unassigned_sink
    shipped: false
    off_reason: "k = 0 +/- 0 in the source (diacetyl accumulates), carried at zero"
    ph: "none"
    T: "Ea 0"

  # =====================================================================================================================
  # network.PYRAZINE_REACTIONS (B18) -- trunk lane only
  # =====================================================================================================================
  r_go_ak:
    lanes: [trunk]
    family: F16_strecker_aldehyde
    secondary: [F19_aminoketone_pyrazine]
    shipped: true
    ph: "Leahy two-slope term, knot 7, ref 6.8 (x0.091 pH 5, x2.6 pH 8.5)"
    T: "Ea 103.1, fitted (B18, Zhou 2024 three temperatures)"
    amine: "Gly; fitted on ALANINE data declared as glycine (+/- 0.5 dex)"
  r_mgo_ak:
    lanes: [trunk]
    family: F16_strecker_aldehyde
    secondary: [F19_aminoketone_pyrazine]
    shipped: true
    ph: "Leahy two-slope term (as r_go_ak)"
    T: "Ea 114.9, fitted (B18)"
    amine: "Gly; alanine data declared as glycine"
  r_akg_pz:
    lanes: [trunk]
    family: F19_aminoketone_pyrazine
    shipped: true
    ph: "none"
    T: "Ea 0, declared fast (shared k_cond)"
  r_akm_dmp:
    lanes: [trunk]
    family: F19_aminoketone_pyrazine
    shipped: true
    ph: "none"
    T: "Ea 0, declared fast (k_cond)"
  r_ak_mpz:
    lanes: [trunk]
    family: F19_aminoketone_pyrazine
    shipped: true
    ph: "none"
    T: "Ea 0, declared fast (k_cond)"

  # =====================================================================================================================
  # network.GLYCATION_REACTIONS (B20) -- trunk lane only; carry flux only when a protein loading charges LYSP
  # =====================================================================================================================
  r_glc_lysp:
    lanes: [trunk]
    family: F05_protein_glycation
    secondary: [F01_schiff_glycosylamine, F02_amadori_heyns]
    shipped: true
    ph: "none"
    T: "Ea 96.8, declared (B20; not fitted)"
    amine: "protein-bound lysine LYSP (from matrix site density x available fraction)"
    water: "none (the trunk a_w term is on k_schiff, not on k_glyc)"
  r_flp_cml:
    lanes: [trunk]
    family: F05_protein_glycation
    secondary: [F08_oxidative_osone]
    shipped: true
    ph: "none"
    T: "Ea 113.0, declared (Berk 2021)"
    o2: "none (an oxidative cleavage with no O2 term)"
  r_flp_cel:
    lanes: [trunk]
    family: F05_protein_glycation
    shipped: true
    ph: "none"
    T: "Ea 92.0, declared"
  r_flp_decay:
    lanes: [trunk]
    family: F05_protein_glycation
    secondary: [F06_enol12_3deoxyosone, F03_amadori_reversion]
    shipped: true
    ph: "none (the free-amine Amadori decays carry the Martins slope; the bound one does not)"
    T: "Ea 97.1, declared"
  r_cml_loss:
    lanes: [trunk]
    family: F31_melanoidins
    secondary: [F05_protein_glycation]
    shipped: true
    ph: "none"
    T: "Ea 0, declared"

  # =====================================================================================================================
  # network.AQUEOUS_GLYOXAL_REACTIONS (B21) -- trunk lane only
  # =====================================================================================================================
  r_ama_g:
    lanes: [trunk]
    family: F08_oxidative_osone
