    contrast: "[3-13C]alanine vs [2-13C]glycine, glucose vs fructose: methylpyrazine and 2,5-DMP 0 % labelled in all four pots; 2,6-DMP 25-30 % labelled with glycine only (F20)"
    status: dominant
    quote: "methylpyrazine and 2,5-dimethylpyrazine in all four pots is a direct confirmation"
    quantity: "0 % of molecules 13C-labelled from the amino acid (methylpyrazine, 2,5-DMP), four pots; no absolute yields printed"
    evidence: labelling
    lab: "Nestle Research Centre, Lausanne (Amrani-Hemaimi / Cerny / Fay)"
