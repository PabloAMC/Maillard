condition_dependence: >-
  SHOWN. (1) Structure: in sugar + amino acid pots at 120-180 C the ring carbons of pyrazine, methylpyrazine and
  2,5-DMP are dicarbonyl / sugar carbon (13C, two labs: Nestle, Reading) and the ring N of pyrazine comes from two
  independently aminated halves (15N, Ho network), i.e. aminoketone pairing for PZ and 2,5-DMP. (2) pH: in
  sugar + lysine pots yield rises steeply with label pH 5 -> 7 -> 9 (Reineccius; x260 / x2 per step, buffer changes
  7 -> 9) and in Ho-network ARP pots pH 8 >> 7 (x14 with Cys); fed MGO + Cys rises x3.6 from label pH 6 to 8 (Ho
  network). But with FED methylglyoxal + alanine at ~0.85 M, pH 4 acetate gives 2.1x MORE 2,5-DMP than pH 7
  phosphate (Ghent): the pH law of the cascade (dicarbonyl supply) and of the fed step differ. In-situ pH is not
  measured in any pyrazine pot except via sister arms (Zhou 2023 / 2024 / 2025b fall to pH 4-5 within 30-60 min),
  so most pH bins are label bins. (3) Temperature: fed-dicarbonyl Ea 100-112 kJ/mol (Ho network, 100-120 C);
  whole-cascade Ea 114-187 kJ/mol (Reineccius, 75-95 C, curved 3-point plots). (4) Water: one a_w ladder (milk
  powder, maximum at a_w 0.75; Reineccius); whey peptides peak at a_w 0.33 (Ghent, confounded by pre-incubation).
  (5) Amine: lysine >> asparagine (x35 on pyrazine), Lys synergy and Arg inhibition with glycine (Rutgers),
  N-terminal Gly / Ala / Ser dipeptides 20-34x free amino acids at 130 C but inverted at 180 C (Ghent), proline
  ~nil, NH3 + hydroxyketone and NH3 + sugar also give aminoketone pyrazines. (6) O2: not limiting (Shibamoto, open
  air vs O2-enriched) and no effect of O2 removal in propanediol (Quest, qualitative). (7) Buffer: phosphate 1.8x
  bicarbonate at pH 7 (Ghent). ASSUMED (nowhere measured): that the condensation is fast relative to the Strecker
  step (the one measured aminoketone analogue is ~1e7x slower than the engine's k_cond), that the dihydropyrazine
  oxidises rather than diverts, and that one constant serves all three pairings (rejected for MPZ, see F20).
best_supported_regimes:
  - "very_high T / low a_w roast / hexose + free Ala or Gly: 2,5-DMP via aminoketone pairing dominant (2 labs, 13C labelling: Nestle, Reading)"
  - "high T / dilute / pentose ARP + Ala, in situ acid after 30 min: parent pyrazine via pairing of two aminated C2 units dominant (1 lab-network, 15N + 13C labelling: Ho network)"
  - "high T / dilute / fed glyoxal or methylglyoxal + alanine, label pH 8: operating with measured rates and Ea (Ho network only)"
  - "moderate T / dilute / hexose + lysine, label pH 5-9: operating, strongly pH-dependent (Reineccius only)"
  - "high T / concentrated / fed MGO + Ala, pH 4 acetate: minor beside the pyrrole sink (Ghent only)"
unknown_regimes:
  - "Any in-situ-pH-controlled pyrazine pot below pH 6 with a sugar: every acid cell is either a label (Reineccius citrate-phosphate) or an unbuffered drift (Ho network); no pH-stat pyrazine study."
  - "low T (<= 60 C) in a real Maillard pot: only the ALA analogue; no pyrazine formation data."
  - "Free aminoacetone / aminoacetaldehyde or the dihydropyrazine measured in any pot: never (no trapping, no derivatised LC-MS): the pairing rate and the aminoketone lifetime are unmeasured."
  - "A measured aminoacetone or aminoacetaldehyde self- or cross-condensation rate (only the ALA analogue)."
  - "O2-free (argon) aqueous pots: no air vs inert contrast in water; the O2 role in aromatisation is untested in water."
  - "a_w ladder with free amino acids (only milk powder and a pre-incubation-confounded whey series)."
  - "protein-bound lysine as the amine with a marker (milk powder is product-only)."
  - "labelling in aqueous moderate-T (75-100 C) pots: the 13C carbon-origin result is shown only at 120-180 C."
  - "phosphate vs non-catalytic buffer at a fixed in-situ pH in a sugar pot (only fed MGO at ~0.85 M)."
competing_families:
  - "F21_pyrroles_pyridines: aminoacetone + 2 MGO -> 2,5-diacetyl-3-methylpyrrole wins at ~0.85 M when acid (pH 4 acetate) or MGO-rich (1:3): pyrazine 1/38 - 1/231 of the pair (Ghent); at pH 7 phosphate they are about equal."
  - "F20_extra_pyrazine_routes: the dihydropyrazine is also the substrate of Strecker / sugar aldehyde addition (25-50 % of 2,6-DMP, 2,3-DMP and TMP in glycine-rich roasts); methylpyrazine has a route beside pairing."
  - "F16_strecker_aldehyde: the aminoketone is the Strecker co-product; amine-driven dicarbonyl sinks (imidazoles, aldol, F21) compete for the same dicarbonyl upstream."
  - "F04_thiazolidine_ttca / F26_thiazoles: cysteine diverts MGO to 2-acetylthiazole and changes pH; with Cys the Ho ARP pots make more pyrazine at pH 8."
  - "Aminoacetone autoxidation back to MGO + NH4+ (dutra2001, 37 C, phosphate pH 7.4; not a cell here): an O2 sink competing with condensation where O2 is resupplied."
engine: >-
  IN THE ENGINE (B18, src/kinetic_core/network.py PYRAZINE_REACTIONS; constants parameters_pyrazine.py): Strecker
  r_go_ak (GO + Gly -> AKG + 2 FRAG_C) and r_mgo_ak (MGO + Gly -> AKM + 2 FRAG_C), plus B22's r_go_met / r_mgo_met
  (methionine), then three condensations r_akg_pz {AKG: 2} -> PZ, r_akm_dmp {AKM: 2} -> DMP and r_ak_mpz
  {AKG: 1, AKM: 1} -> MPZ, all on ONE k_cond = 1e4 L/(mmol min), Ea 0, no pH term. MATCHES: the topology (ring
  carbons from the dicarbonyl, N from the amine; 13C two labs, 15N Ho network) and the fed-dicarbonyl Ea (fitted on
  Zhou 2024). MISMATCHES: (a) CF-077: the cross pair lacks its statistical factor 2, so the engine's R = 1 (docstring
  promises 4); (b) k_cond is declared fast with no barrier while the only measured aminoketone condensation
  (ALA analogue) is ~1e7x slower, pH-dependent (x80 from pH 4.8 to 7.4) and has Ea 44 kJ/mol; (c) pH acts only on
  the two Strecker steps (0.20 dex/unit above 7, 0.58 below, fitted on Leahy's cascade ratios): Ghent's fed MGO + Ala
  pH 4 vs 7 goes the OTHER way (x2.1 up at pH 4), so the below-7 slope is a supply effect wrongly put on the step
  (red team S7); (d) no phosphate / buffer-anion term (Ghent x1.8 phosphate vs bicarbonate); (e) no a_w term on the
  pyrazine steps (a_w acts only on k_schiff) against Leahy's x4 rise from a_w 0.32 to 0.75; (f) amine identity:
  glycine only (alanine -> glycine declared +/- 0.5 dex), no lysine factor (x35 vs asparagine), no peptide,
  protein-bound or NH3 aminoketone source (Van Lancker, Scalone, Shibamoto, Elmore all show these make pyrazines);
  (g) no 2-aminopropanal, so no 2,6-DMP (8-9x below 2,5-DMP from fed MGO; 30 % of 2,6-DMP is F20 anyway); (h) no
  dihydropyrazine species and no O2 in the net condensation (consistent with the weak O2-independence evidence, but
  untested in water); (i) no pyrrole sink for AKM (F21) and no aminoketone O2 sink (dutra2001). The B18 ship-rule
  caveat stands: from sugar + amine pots the engine misses Leahy's 95 C total by ~2.8 dex.
