# Pathway-condition atlas, family F19 (literature side). Written 2026-11-01 from the extraction dossiers named per
# cell; vocabulary and status caps from docs/reference/pathway_atlas/families.yml. Every quote is a verbatim substring
# of the cited dossier (checked by grep). Numbers marked "mine" are derived by this atlas, not printed.
family: F19_aminoketone_pyrazine
definition: "aminoketone condensation -> dihydropyrazine -> pyrazine (incl. mixed pairs)"
markers:
  - "13C on the amino acid does NOT appear in the ring carbons or ring methyls of the product (methylpyrazine, 2,5-dimethylpyrazine): the ring is two dicarbonyl-derived C2 / C3 units and the amine gives only N (Amrani-Hemaimi 1995, Low 2007)."
  - "15N from a labelled amine enters the ring N with a binomial 0 / 1 / 2 x 15N isotopomer pattern (two independently aminated halves), and under pairing label(MPZ) = mean(label(PZ), label(DMP)) (red-team identity test)."
  - "A fed alpha-dicarbonyl + amine gives its own homo-pyrazine (glyoxal -> pyrazine; methylglyoxal -> 2,5-dimethylpyrazine >> 2,6-dimethylpyrazine, the regiochemistry of aminoacetone vs 2-aminopropanal)."
  - "Mixing bound: under random pairing of two aminoketone pools R = MPZ^2 / (PZ x DMP) <= 4; R > 4 is evidence AGAINST pairing as the sole MPZ route (it is booked under F20, which carries the alternative)."
  - "A fed alpha-aminoketone self-condenses (second order) to the dihydropyrazine; only an analogue (5-aminolevulinic acid) is measured. No study on disk traps or quantifies the dihydropyrazine or free aminoacetone / aminoacetaldehyde in a Maillard pot."
  - "A secondary amine (proline) or a missing primary amine gives (almost) no alkylpyrazine: the aminoketone needs a primary amine."
