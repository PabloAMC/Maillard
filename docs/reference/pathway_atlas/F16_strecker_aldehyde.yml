# Pathway-condition atlas, family F16 (literature side). Written 2026-11-01 from the extraction dossiers named per
# cell; vocabulary and status caps from docs/reference/pathway_atlas/families.yml. Every quote is a verbatim substring
# of the cited dossier (checked by scratchpad check_atlas.py, whitespace-normalised). Numbers marked "mine" are derived
# by this atlas, not printed. Lipid-carbonyl and alpha-keto-acid donors are F18; the oxygen route to the Strecker
# ACID and the Amadori-compound oxidative route are F17; aminoketone fates are F19 - F21.
family: F16_strecker_aldehyde
definition: "dicarbonyl + amino acid -> Strecker aldehyde + aminoketone + CO2 (per donor)"
markers:
  - "A FED alpha-dicarbonyl (MGO, glyoxal, 3-DG, glucosone, 3-deoxypentosone / tetrosone) + amino acid, with no sugar present, gives the amino acid's Strecker aldehyde (R-CHO with one carbon fewer than the amino acid) above the amino-acid-alone blank: the route's existence marker per donor."
  - "Under ARGON the aldehyde from a fed dicarbonyl is unchanged (air / argon 0.85 - 0.93, Hofmann 2000 Table 4): an oxygen-INdependent aldehyde in a fed-dicarbonyl pot is this route; an aldehyde that collapses under argon in a sugar or Amadori pot is F17 (or the oxidative entry upstream, F08)."
  - "Donor-identity ranking at fixed amino acid (MGO > glyoxal > 3-DG ~ glucosone; C4 > C5 > C6 3-deoxyosones) and amino-acid identity at fixed donor (Ile > Leu > Phe > Met with MGO)."
  - "The co-product is the dicarbonyl's alpha-aminoketone (aminoacetone from MGO), which is what feeds F19 / F21; the Strecker AMINE (decarboxylated, not deaminated) is the competing non-oxidative exit and is small in water (<= 3 % of aldehyde) but not in low water."
  - "In a SUGAR + amino-acid pot the aldehyde alone carries no route marker: dicarbonyl route (this family) and the Amadori oxidative route (F17) make the same product, so such cells are 'unattributed' unless an argon arm or a fed precursor separates them."
