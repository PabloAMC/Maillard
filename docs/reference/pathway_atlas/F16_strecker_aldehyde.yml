condition_dependence: >-
  SHOWN. (1) Donor: in fed pots every alpha-dicarbonyl tested gives the aldehyde, with the same ranking in two labs
  (MGO > glyoxal > 3-DG, DFA and Quest cells), but the size of the donor effect differs by >= 20x between them
  (x1.4 at pH 7 argon, DFA; x35 MGO / 3-DG at pH 3.2 with SDE, Quest; CF-073). (2) Oxygen: the aldehyde from a
  fed dicarbonyl is O2-independent (one lab, four donors, 98 C); a glucose pot under N2 still makes aldehydes
  (Reineccius). (3) pH: fed-dicarbonyl PA peaks at pH 5 and falls only 2x to pH 9 (DFA, figure); Quest gets its
  largest yields at pH 3.2. In GLUCOSE pots acid pH suppresses the aldehyde (x25 lower at pH 3.2 than pH 7, Quest,
  buffer-confounded) because the sugar's dicarbonyl supply is slow there; the pH dependence of a sugar pot is the
  supply's, not this step's. (4) Temperature: occurs from 25 C (weeks, Bordeaux) to 170 C (minutes, DFA / TUM);
  apparent barriers in sugar pots (80 - 124 kJ/mol, Reineccius, Eichner, Becker) are supply barriers. (5) Water:
  low water (silica 10 %) speeds the branched-chain aldehydes and raises the Strecker AMINE share to 19 - 27 % for
  Phe / Met (one lab). (6) Amine: identity at fixed donor Ile > Leu > Phe > Met (DFA only); in mixtures the
  amino acids compete non-additively (Reading, frying); in a protein-rich matrix the aldehyde tracks the sugar,
  not the free amino acid (Reading). ASSUMED (no study): the aminoketone co-product yield per aldehyde (never
  measured with the aldehyde in one pot), the step's own temperature law in water with a fixed donor (only the
  170 C DFA course plus 98 C), and any phosphate effect on the step.
best_supported_regimes:
  - "neutral / moderate (98 C) / dilute / fed alpha-dicarbonyl + Phe, argon or air: dominant route to PA, O2-independent (DFA; fed_intermediate, one lab)"
  - "acid (pH 3.2) / moderate / dilute / fed dicarbonyl + Phe: dominant, same donor ranking (Quest; second lab, magnitude conflicting, CF-073)"
  - "neutral / very_high (170 C) / dilute / fed MGO + Leu / Ile / Phe / Met: dominant aldehyde exit, amine <= 3 % (DFA / TUM)"
  - "existence of the 3-DG donor: two labs (DFA, Missouri); existence at 25 C pH 3.5: one lab (Bordeaux)"
unknown_regimes:
  - "alkaline (> 7.5) with a fed dicarbonyl at a measured in-situ pH (only DFA's figure-only pH 9 point)"
  - "concentrated (>= 0.5 M) fed-dicarbonyl pots; intermediate_aw fed-dicarbonyl pots (only sugar pots at a_w 0.52)"
  - "fed-dicarbonyl pots with glycine, Ala or Cys as the measured aldehyde donor (Ala only in the glucose pot; Gly gives formaldehyde, never quantified)"
  - "peptide or protein-bound amine as the Strecker amine source (no fed-dicarbonyl study on disk)"
  - "the aminoketone co-product measured alongside the aldehyde (no study)"
  - "1-deoxyosone (1-DG) as a fed donor (never fed; only 3-DG, glucosone, MGO, GO, 3-deoxypentosone / tetrosone)"
  - "phosphate vs non-phosphate buffer at equal pH for the Strecker step"
  - "pentose pots with a measured Strecker aldehyde and a donor marker (Weenen's 3-deoxyxylosone 2.6 % is the only pentose-donor number)"
competing_families:
  - "F17_strecker_acid_o2: under air the same imine / enaminol gives the ACID; for C2 / C3 donors the acid exceeds the aldehyde in air (PA / PAA 0.50 - 0.68), for C6 donors the aldehyde wins (2.4 - 3.3). In sugar pots the Amadori oxidative route makes the same aldehyde (fitted ~84 % share in the best EX-049 optimum)."
  - "F18_lipid_strecker: lipid enals / epoxyalkenals / keto acids degrade the same amino acids; no study puts a sugar and a lipid donor in one pot with a marker."
  - "F19_aminoketone_pyrazine and F21_pyrroles_pyridines consume the aminoketone co-product; F06 / F07 / F10 make the donors."
  - "the Strecker AMINE exit (non-oxidative decarboxylation) competes in low water (Granvogl model A); in water it is <= 3 % of the aldehyde."
  - "non-Strecker amino-acid sinks (imines, melanoidins): (PA + PAA) is only 6 - 18 % of the Phe consumed by MGO (DFA)."
engine: >-
  IN THE ENGINE ONLY AS THE B18 / B22 / B24 STRECKER STEPS, NOT AS A STRECKER-ALDEHYDE LANE. network.py
  PYRAZINE_REACTIONS r_go_ak (GO + Gly) and r_mgo_ak (MGO + Gly), shipped, second order in donor and glycine, Ea
  103.1 / 114.9 fitted on Zhou 2024's PYRAZINE rates (alanine declared as glycine), the aldehyde (formaldehyde) booked
  to FRAG_C; r_go_met / r_mgo_met (methional, B22) and the proline step (B24) are not shipped; the sulfur lane's
  r_mgo_cys_strecker is zero unless set, and r_dpo_ddp (cysteine + 1-deoxyosone, F15 primary) carries a Strecker
  event. No 3-DG, glucosone or pentosone donor; no Phe / Leu / Ile Strecker aldehyde species; no Strecker amine exit.
  MISMATCHES: (a) pH: the engine scales both Strecker steps by the Leahy PYRAZINE two-slope term (0.58 dex per pH unit
  below 7: x0.091 at pH 5 vs pH 6.8), but the fed-dicarbonyl aldehyde PEAKS at pH 5 (DFA) and is largest at pH 3.2
  (Quest); the Strecker prereg's review allows <= 0.07 dex / pH on the step, so the engine's acid suppression belongs
  to the supply or the pyrazine condensation, not here. (b) Donor set: 3-DG / glucosone donors give 73 - 76 % of
  MGO's aldehyde under argon (DFA), which the engine omits entirely. (c) Constants come from pyrazine rates (a ~1 %
  aminoketone -> pyrazine yield, F21's pyrrole sink) rather than from the aldehyde, so the engine's Strecker flux is
  ~1.9 dex below Hofmann's (MECHANISM_REVIEWS finding 6). (d) No water-activity term on the step, while low water
  changes the aldehyde / amine split (Granvogl model A). (e) The engine's Strecker is O2-independent, which MATCHES
  the fed-dicarbonyl control; the O2 sensitivity of sugar pots belongs to F17 / F08 (B29 lever on k_glc_g / k_ama_g,
  factors unfitted, so argon pots are refused).
