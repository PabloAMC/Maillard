condition_dependence: >-
  OXYGEN: the only within-study O2 contrasts are at <= 50 C and they disagree by matrix. In coffee solids at 25 C the
  loss needs air (x15-45 slower under N2, Charles-Bernard), while in a ribose / cysteine process flavouring at 50 C air
  ~ argon for MFT (van Seeventer, data not presented); no study varies O2 on thiols at process temperature (cluster 4
  sec. 1). METALS: radical / metal-catalysed oxidation is shown for FFT (Fe + H2O2 + reductant, Blank) and cysteine
  (Cu / Fe, Ehrenberg) in clean systems, but a chelator does not slow the coffee loss (DTPA null). pH: the FFT loss at
  121 C rises steeply from pH 5 to 7 with the disulfide as main product (Kumazawa), and protein interchange needs a
  thiolate (pH 2 null, Adams); the Michael capture rate follows the thiolate fraction (Esterbauer, GSH). Yet the MFT
  disulfide share at 120 C is pH-flat from 6 to 8 (Zhou), so the thiolate law is shown for FFT and analogues, not for
  MFT's oxidation branch. TEMPERATURE: below ~110 C net thiol rises for hours in cysteine-pentose pots (Wang 100-110 C;
  CF-013 with Schieberle 2000), while at 120-168 C thiols peak and fall (Wang, Liu); the in-pot first-order loss
  inferred at 100 C (Grosch, thiamine pots, ~0.04 /min) and the co-heated-standard bound at 110 C (Nestle, <= 0.02-0.05
  /min, 0.25 M Cys) cannot be one constant (cluster 4, P 0.15). CYSTEINE: protects at 50 C storage (van Seeventer, with a
  minimum near 50 mM for MFT) and only weakly in Grosch's 100 C pot; Esterbauer gives the competition basis (Cys ~61x
  GSH); no designed Cys series at process T exists. SUGAR: ribose alone has no effect on storage loss (van Seeventer).
  MATRIX: coffee melanoidins capture FFT covalently and essentially irreversibly at 30 C (labelling, disulfide < 1.5 %,
  DTE no release), whereas protein (albumin, beef, ovalbumin, beta-lactoglobulin) exchanges with disulfides and can
  RETURN the thiol (reservoir in beef, 83-90 % of units accounted); lipid oxidation load lowers MFT 14-143x at 120-140 C
  (Elmore, Xu, Wang), selectively over FFT, with no adduct identified. REVERSIBILITY: the disulfide reverts to thiol at
  100 C in water when the thiol is drawn off (Guth); Michael adducts of enals and quinones revert, and their K falls
  with temperature (Esterbauer, Stack). The disulfide is a MINOR sink where measured against a thiol deficit at 30-100 C
  (Hofmann, Grosch) and the major product only in FFT pots at pH >= 6 (Kumazawa) or with an oxidised additive (Zhang
  2024, cystine).
best_supported_regimes:
  - "neutral / low T / dilute / coffee melanoidin: covalent capture of FFT dominant over oxidation (1 lab, labelling + disulfide balance)"
  - "mild_acid / low T / dilute / coffee solids: loss O2-dependent and carbonyl-nucleophile-competed, chelator-insensitive (1 lab, two within-study factors; CF-081 open on the site density)"
  - "neutral-to-alkaline / low-high T / protein matrix: thiol-disulfide interchange with protein -SH, thiol released, needs thiolate and exposed SH (1 lab, Reading: 3 papers, 3 within-study factors; MS adducts from a 2nd lab, Minnesota)"
  - "mild_acid-neutral / high T / dilute: oxidation to the disulfide operating, a measured product (Ogawa, Jiangnan, BTBU, Reading, DFA: 5 labs), minor where weighed against a thiol deficit (DFA)"
  - "any / high T / water: disulfides are a reversible reservoir, not a terminal sink (DFA trap + label; Reading beef mass balance: 2 labs)"
  - "mild_acid / high T / lipid present: MFT lost selectively (Reading, Huazhong, BTBU: 3 labs) - sub-route unattributed"
  - "mild_acid / low T (50 C storage) / concentrated: MFT-specific non-oxidative non-disulfide sink, suppressed by cysteine (1 lab, mass balance; storage channel only)"
unknown_regimes:
  - "any O2 vs inert contrast on MFT / FFT loss at >= 100 C (none on disk; the designed E3 / Yiltirak-fill experiment in cluster 4 is the decider)"
  - "a designed cysteine series on thiol LOSS at process temperature (labelled MFT spiked during heating, Cys 0-150 mM): only Grosch's two pots and the patent's derived bound"
  - "moderate T (60-100 C) in pentose / cysteine pots: only the 80 C coffee brew (no marker) and Adams' 10-min 90 C step"
  - "low_aw / dry / roasting: no thiol-loss study with a marker (Chen 2000 / 2002 at 180 C report levels only)"
  - "alkaline (> 7.5) at process T for MFT: only Zhou's pH 8 arm (unbuffered, drifting)"
  - "covalent thiol-electrophile adducts identified IN a heated sugar + cysteine pot (deoxyosone, furfural, norfuraneol, enal adducts of MFT): never measured; only thiamine (jhoo2002, not keyed here), melanoidin / pyrazinium (30 C) and model quinones / enals / proteins"
  - "reversibility of melanoidin capture at process temperature (DTE negative is cited, 30 C, FFT only); MFT kinetics with melanoidins (rFD only)"
  - "the identity of van Seeventer's missing MFT and whether the C-5 coupling runs at >= 100 C"
  - "metal effects at process T (chelator or metal-spike arm in a Maillard pot)"
  - "plant-protein matrices (no free-SH / S-S titres; Mottram's albumin vs casein suggests SH content governs)"
competing_families:
  - "F31_melanoidins: melanoidin sites are the capture partner in coffee (dominant at 30 C); in pentose pots the electrophile pool is not identified (engine k_mele_site inert)"
  - "F30_lipid_oxidation_crossover / F26_thiazoles_thiophenes: lipid enals compete for H2S and the thiols' precursors; lipid lowers MFT (Elmore, Xu, Wang) and makes alkylthiophenes, so capture of MFT and suppression of its formation are not separated"
  - "F04_thiazolidine_ttca: TTCA binds cysteine reversibly, lowering the free Cys that protects thiols (van Seeventer's MFT minimum near 50 mM is attributed to it)"
  - "F15_redox_reductones: reductones and the H2S / dicarbonyl redox couple supply or scavenge the oxidant the disulfide route needs; ascorbate protects in coffee (1/k_rel 4-24)"
  - "F27_thiamine_gsh_sources: thiamine releases a pyrimidinylmethyl electrophile that consumes MFT (jhoo2002), so thiamine-pot loss rates (Grosch) may be capture, not a generic sink"
  - "F22_cysteine_h2s: H2S / HS- consumes disulfides (persulfide) and competes with odorant thiols for electrophiles and oxidant"
engine: >-
  In the engine (src/kinetic_core/sulfur.py, read only), thiol loss is carried by: ch_mft_decay / ch_fft_decay
  (k_mft_decay, k_fft_decay; first order, irreversible, "unassigned sink"; shipped k_mft_decay frozen at 10^0.13 = 1.36
  /min at 145 C, ~0.095 /min at 110 C; k_fft_decay 0.15 /min at 145 C); ch_thiolate_loss_mft / _fft (k_thiolate_loss,
  0.028 /min at 145 C, thiolate-fraction pH factor, from Kumazawa); ch_dimer_mft / _fft (k_dimer_mft / _fft, 2 RSH + OX,
  thiolate tag, Zhang 2024 anchor; sitting on the 0.5 ceiling, bound-limited) with ch_mftd_decay / ch_fftd_decay
  (k_dimer_decay ~0) and ch_dimer_release_* (k_dimer_release = 0, inert); ch_mmft (k_mmft, MFT + MeSH);
  ch_thioether_mft / _fft + ch_thioether_release(_fft) (k_thioether 5.01e-4 L/mmol/min on the MELE site pool, reverse
  from Stack's K(T)); ch_protein_ss_mft / _fft (k_protein_ss 6.05e-6, terminal, PROT_SS zero in every scored panel);
  ch_oligomer_mft / _fft (k_oligomer = 0, van Seeventer kept a hold-out); ch_add_mft/fft_dpo/tdp (k_add, irreversible
  thiol + deoxypentosone, inert at zero); ch_mele_from_dpo/tdp/ddp (k_mele_site, inert); O2 consumers ch_cys_ox,
  ch_red_ox_* and ox_supply inert (B11 not shipped; OX seeded at the ambient level only). network.py carries no
  odorant-thiol loss (only the methanethiol -> dimethyl disulfide step of B22). MISMATCHES with the literature cells:
  (1) k_mft_decay is pot-independent and has no cysteine, O2, pH or matrix term, while the 0.25 M-Cys patent pot needs
  lambda(110 C) <= 0.02-0.05 /min against the engine's 0.095 (CF-013; P(too fast by >= 3x at <= 110 C in a Cys-rich pot)
  ~0.75, thiol rivals) and Grosch's thiamine pot sits at the engine's size; one constant serving both has P ~0.15
  (cluster 4), and a Cys-suppression / electrophile-capture law is the proposed form. (2) The disulfide is effectively a
  terminal store (k_dimer_release = 0, k_dimer_decay ~0), whereas Guth (100 C, water) and Mottram 1996b (beef) show it
  reverting to thiol; and no thiol-disulfide exchange with cystine / protein -SH exists in the reducing direction
  (Mottram, Adams), only the terminal protein_ss arrow at a rate ~4 dex below Adams' interchange estimate. (3) O2 enters
  only through the dimer's OX at ambient seeding; the coffee loss's x15-45 O2 dependence and any vessel-O2 effect
  (CF-068) cannot be expressed, and there is no metal species (Blank, Ehrenberg). (4) Michael capture is either
  irreversible (k_add, inert) or uses the quinone K(T) of Stack for melanoidin thioethers, while Hofmann's pyrazinium
  adducts are not released by DTE: the reversible thioether channel may be the wrong sign of reversibility for coffee
  melanoidin; its site density carries the CF-081 x30 band. (5) Lipid electrophiles are not partners of any sulfur-lane
  thiol channel, so the 14-143x lipid falls (Elmore, Xu, Wang) cannot be produced. (6) The thiolate pH factor on
  ch_dimer_* matches Kumazawa's FFT direction but would predict a pH-dependent MFT disulfide share that Zhou's 120 C pot
  does not show. (7) The 50 C storage channel (k_oligomer) is zero by declaration; correct as a storage channel, and it
  must not be borrowed as a processing law.
