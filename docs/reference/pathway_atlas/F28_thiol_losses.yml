# Pathway-condition atlas, family F28 (thiol losses). Compiled 2026-11-01 from the extraction dossiers, the
# thiol-rivals record (docs/history/thiol_rivals_2026-10-31/), the cluster-4 resolutions of 2026-11-01 and the
# red team of claims 2-4. Vocabulary: docs/reference/pathway_atlas/families.yml (binding).
# Conventions used in this file:
#   - temperature: 100 C is binned `high` (processing); storage / model work at <= 60 C is `low`. Storage and
#     processing sinks are DIFFERENT CHANNELS (thiol-rivals red team): a `low` cell never sets a processing law.
#   - ph_basis: `label` = nominal buffer pH; `in_situ` = measured at reaction temperature; `not_stated` = the dossier
#     gives no pH (the bin is then the closest plausible one and says so in `quantity`).
#   - evidence `trapping` is used for a route whose PRODUCT ADDUCT was identified (MS / NMR) or whose reverse step was
#     driven by a thiol trap; the other kinds as in families.yml.
#   - `matrix` is an extra tag (coffee, protein, beef, lipid) where the loss partner is a matrix, not a reagent.
#   - Laboratories: DFA Garching; Nestle Research Center Lausanne, Kraehenbuehl / Roberts group (Charles-Bernard
#     Part 1 + Part 2 = one material, CF-081 is between them, counted ONCE; US 10,076,126 is the same group);
#     Nestle Lausanne, Blank group (with SCRI Dundee); Reading (Mottram / Elmore); Quest Naarden; Ogawa Chiba; BTBU
#     Beijing (Wang 2022 and Zhang 2024 counted as one); Jiangnan Wuxi (Zhang X. / Ho); Huazhong Wuhan; Beijing (Liu);
#     Graz (Esterbauer); Nebraska Omaha (Stack); Minnesota (Reineccius); Stockholm (Ehrenberg).
family: F28_thiol_losses
definition: "thiol losses: oxidation / disulfides, capture by carbonyls / quinones / melanoidins / protein (reversible or not)"
markers:
  - "OXIDATION: the symmetrical / mixed disulfide measured as a product (with a thiol mass balance), and an O2 vs N2 / argon contrast on the loss within one study; metal dependence shown by a chelator or metal-omission arm."
  - "OXIDATION caveat (operator): disulfides found in solvent extracts can be work-up artefacts (Hofmann 1995: absent from the headspace of the same pot); SDE of protein matrices reduces disulfides to thiols (Mottram 1996b). A disulfide is a marker only with the work-up stated."
  - "REVERSIBILITY of the disulfide: free thiol recovered from the disulfide on heating (thiol trap, D2O label: Guth 1995) or by protein -SH (Mottram 1996, Adams 2001)."
  - "CAPTURE: the covalent adduct identified (LC/MS or NMR of the thiol-melanoidin / thiol-pyrazinium / thiol-quinone / thiol-protein adduct; labelled thiol found on the macromolecule); a competing nucleophile (hydroxylamine, cysteine, GSH) that slows the loss; free-thiol recovery (DTE / DTT / TCEP, or DTNB-driven reverse rate) for reversibility."
  - "PROTEIN: native vs denatured protein (exposed -SH titre by Ellman), pH 2 null (no thiolate), disulfide -> free thiol conversion."
  - "NET LOSS without any of the above (thiol falls with time, or with an added matrix / lipid) is recorded as `unattributed`: it does not say which sub-route ran, and a lower thiol with an additive can also be lower FORMATION."
