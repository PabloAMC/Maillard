# Pathway-condition atlas: F29_acrylamide (literature side). Built 2026-11-01 from the extraction dossiers only.
# Every quote is verbatim from the cited dossier. Bins follow families.yml; "not_stated" is used for a pH the study
# never reports (powders, silica gel), never a guessed bin. Water bin "dilute" counts reactant solutes (sugar + amine),
# not the buffer. Formation and elimination are both in this family; each cell says which part it bears on.
family: F29_acrylamide
definition: "asparagine + carbonyl -> acrylamide (and its elimination)"
markers:
  - "ATOM MAP (labelling): acrylamide's C3 skeleton and amide N from asparagine ([13C]/[15N]-Asn). NOT ON DISK: no dossier holds a labelling study of acrylamide formation (Zyzak 2003 / Stadler 2002 / Mottram 2002 Nature are not in data/lit; the on-disk zyzak1995 and mottram2002 are different papers). Every formation cell below therefore rests on precursor omission / addition, not on a label."
  - "FED INTERMEDIATE: 3-aminopropionamide (3-APA) or a fed carbonyl (HMF, a lipid carbonyl) + Asn giving acrylamide; 3-APA measured as an intermediate (gokmen2012)."
  - "TRAPPED / MEASURED INTERMEDIATE: the decarboxylated Asn Schiff base / azomethine ylide (Orbitrap m/z 250 from glucose, gokmen2012)."
  - "PRECURSOR OMISSION: glucose + glutamine without asparagine gives 'negligibly small' acrylamide (claeys2005) -- the weakest marker, but the only one most kinetic papers carry."
  - "ELIMINATION markers: loss of SPIKED acrylamide; the S-(2-carbamoylethyl) thiol adduct; 3-(alkylamino)propionamides and the acrylamide they release on reheating (zamora2010, hidalgo2010)."
  - "NON-markers: an acrylamide level in a pot or food with Asn + sugar says SOME acrylamide route ran (operating), not which carbonyl fed it."
