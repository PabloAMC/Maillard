    status: operating
    quote: "the model was able to fit the loss of acrylamide (k6)"
    quantity: "k6 = 88.1 +/- 25 e-3 /min at 160 C; k6/k4 = 34.8 (dossier arithmetic): acrylamide is a fast-turnover intermediate. 0.2 M Asn + 0.2 M Glc, 0.1 M phosphate pH 6.8"
