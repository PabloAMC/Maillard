condition_dependence: >-
  FORMATION. Shown: (i) pH -- in phosphate ln k_F rises 0.54 per initial-pH unit from 4 to 8 (Leuven, one lab,
  devleeschouwer2006), and in potato net acrylamide peaks near cold pH 7.7-8 (Stockholm, rydberg2003): two labs agree
  on the sign (more formation toward pH 8), but the Leuven law holds only in phosphate -- citrate at pH 4 is 7x slower
  and citrate shows no log-linear law, so the "pH effect" in the literature is partly a phosphate-catalysis effect
  (also CF-011 territory). All pH values are INITIAL; the pots drift by up to -2.25 units (pH 8) and +1.2 (pH 4).
  (ii) Sugar -- fructose > glucose in three labs (Leuven powders 110-165 %, Stockholm potato 2.9x per mol added,
  Wageningen 3 % vs 1.5 % across two papers), sucrose > glucose at low T only (Leuven). (iii) Water -- formation is
  flat from a_w 0.34 to 0.99 (Leuven, two papers; single lab); what moves with a_w is elimination (minimum at 0.82).
  (iv) Temperature -- no acrylamide at 100 C in dilute phosphate (Wuxi); a fed-HMF route overtakes glucose above
  ~120 C on silica (Hacettepe); apparent Ea 84 (silica) vs 130-208 kJ/mol (aqueous, pH-dependent) is CF-039.
  (v) Competing amines -- Gly, Gln, Lys lower acrylamide in potato (Stockholm, Reading) mainly by sugar competition;
  in dilute pots Gln changes k_F only and Lys changes k_E only (Leuven); Cys acts by scavenging, inhibition refuted by
  model discrimination (Leuven). (vi) Carbonyl type -- HMF (fed, Hacettepe) and lipid alkadienals (Seville, review
  barriers only) can supply the carbonyl; no study on disk measures their SHARE of acrylamide in a sugar pot.
  ELIMINATION. Shown: first-order loss with k_E/k_F ~35 (Wageningen) and 170-280 (Leuven) at 160 C in glucose pots;
  not identifiable in a fructose pot at pH 5.5 (Wageningen); faster at low pH in potato (Stockholm, spiking); thiol
  adducts irreversible (Seville, tested), amine adducts reversible with release rising with pH and in citrate over
  phosphate (Seville). ASSUMED everywhere: the atom map (no labelling on disk).
best_supported_regimes:
  - "neutral (initial, phosphate) / 120-200 C / dilute or a_w 0.88-0.99 / glucose or fructose + Asn: operating, k_F and k_E fitted by 2 labs (Leuven, Wageningen); formation constants agree within 1.2x across labs (knol2010 dossier)"
  - "mild_acid-neutral / 160-180 C / potato or potato dough (concentrated -> low a_w) / endogenous Asn + sugar: operating, 3 labs (Stockholm, Reading, Reading/Hacettepe) with within-study additions"
  - "elimination by thiols and amines, 80-180 C, pH 2-8: operating, 2 labs (Seville fed acrylamide; Leuven fitted k_E2), reversibility only from Seville"
unknown_regimes:
  - "ANY labelling regime: no [13C]/[15N]-Asn study on disk, so the atom map and the share of non-Asn routes (acrolein + NH3; Quan 2020's k8 is unmarked) are unmeasured"
  - "share of acrylamide from HMF, dicarbonyls (MGO / GO) or lipid carbonyls in a SUGAR pot: fed-only evidence, never a competition with the sugar present"
  - "in-situ pH: every constant is indexed to initial pH; no study follows pH during the acrylamide run except as end-point drift"
  - "low T (< 100 C) formation: none detected at 100 C (Quan 2020); no data below; storage (37-60 C) only for elimination"
  - "protein-bound amine as competitor or as Michael acceptor scavenger: extrusion data (goncuoglu2026, ma2024) are level-only, no kinetics; plant-protein matrices otherwise unstudied"
  - "pentose sugars and alt-protein sugar systems: no acrylamide kinetics with ribose / xylose on disk"
  - "air vs inert as a factor on acrylamide formation: never varied (hidalgo2015 states O2 inhibits olefin formation, qualitatively)"
competing_families:
  - "F05_protein_glycation / F01_schiff_glycosylamine with other amines: Gly, Gln, Lys compete for the sugar (wins in potato with >= 35 mM added amine, rydberg2003; low2006)"
  - "F16_strecker_aldehyde: the same Asn-carbonyl Schiff base decarboxylates to the azomethine ylide; Strecker (aldehyde) vs 3-APA / acrylamide (olefin) split, O2 favours the aldehyde (hidalgo2015, qualitative)"
  - "F13_furans_dehydration: HMF formation competes for the hexose but then FEEDS acrylamide above ~120 C (gokmen2012)"
  - "F28_thiol_losses / F22_cysteine_h2s: cysteine is both a sugar competitor and the acrylamide scavenger (devleeschouwer2009); the engine runs the acrylamide and sulfur cysteine sinks in separate lanes by decision"
  - "F18_lipid_strecker: lipid carbonyls degrade Asn to 3-APA as they degrade Phe to phenylacetaldehyde (hidalgo2015)"
engine: >-
  In the engine: src/kinetic_core/acrylamide.py ACRYLAMIDE_REACTIONS on top of the B1 trunk -- a_asn_glc_sb (Asn + Glc,
  k_asn_glc), a_sb_int1, a_int1_acr (formation), a_int1_mel (fitted non-acrylamide fate), a_asn_asp / a_asp_sink,
  elimination a_acr_dp (first order, fitted to Claeys / De Vleeschouwer / Knol k_E), a_acr_cys (De Vleeschouwer k_E2),
  a_acr_gln / a_acr_lys / a_acr_ala (fitted Michael scavengers), sugar competitors a_cys_glc / a_gln_glc / a_lys_glc /
  a_ala_glc; condition factors in acrylamide_conditions.py (initial-pH factor 10^(0.235 (pH-6.8)) on formation and
  10^(0.149 (pH-6.8)) on elimination, window 4-8, held outside; flat formation a_w term and the 2007 elimination a_w
  shape). MATCHES: first-order elimination and its maximum; the a_w shape; the pH sign; cysteine as scavenger, not
  inhibitor. MISMATCHES: (1) the only carbonyl is glucose -- no fructose initiation in the lane (CF-034 runs Knol
  2010's fructose pot with Glc), no sucrose, no HMF / dicarbonyl / lipid-carbonyl route and no 3-APA, although
  fructose > glucose is a three-lab result and HMF overtakes glucose above ~120 C; (2) the pH factor is the PHOSPHATE
  law applied to every buffer -- in citrate at pH 4 the literature is ~7x lower than phosphate, and at pH 6 citrate is
  2.4x higher, so carboxylate pots are mis-scaled by up to ~0.8 dex; (3) initial-pH only, while pots drift up to 2 units;
  (4) amine scavenging (a_acr_gln / lys / ala) is irreversible, but Zamora 2010 shows amine adducts are ~90 %
  reversible and release acrylamide on reheating (pH- and buffer-dependent); only the thiol adduct is irreversible;
  (5) Knol 2010 finds no identifiable elimination at pH 5.5 / fructose while the lane always eliminates at the fitted
  rate; (6) glycine is not a named acrylamide-lane competitor, although Low 2006 / Rydberg 2003 show glycine is among
  the strongest (it acts only through the trunk's glucose consumption, if composed); (7) no protein-bound amine in the
  lane (extrusion rows score 4247x low, ma2024 dossier).
