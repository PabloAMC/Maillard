# Pathway-condition atlas, family F20 (literature side). Written 2026-11-01 from the extraction dossiers named per
# cell and docs/history/pyrazine_rivals_2026-10-31/ (EX-052 and its red team); vocabulary and status caps from
# docs/reference/pathway_atlas/families.yml. Every quote is a verbatim substring of the cited dossier (grep-checked).
family: F20_extra_pyrazine_routes
definition: "pyrazine routes other than aminoketone pairing (aldehyde / C1 incorporation, alkyl side chains, methylpyrazine extra route)"
markers:
  - "Aldehyde addition to the dihydropyrazine: 13C from a labelled amino acid appears in ONE alkyl substituent (C-2 of the ethyl from [3-13C]alanine = acetaldehyde; a methyl from [2-13C]glycine = formaldehyde), one 'y' per ring (Amrani-Hemaimi 1995, Low 2007)."
  - "Amino-acid-specific alkylpyrazines that appear only in the pot holding that amino acid (2-methylbutyl from Ile, isobutyl from Val, phenylethyl from Phe, ethyl-dimethyl from Ala), and vanish when the amine is a peptide that makes no Strecker aldehyde."
  - "Methylpyrazine extra route: R = MPZ^2 / (PZ x DMP) > 4 (beyond random pairing) is a SIGNATURE only; it is equally explained by pair-specific condensation constants or dihydropyrazine fates (EX-052 P1x / P1y), so on its own it is unattributed."
  - "Methylpyrazine extra route, label marker: label(MPZ) below the mean of label(PZ) and label(DMP) in the same pot (15N), which no pairing variant can produce (red-team identity test); or a 13C sugar isotopomer in MPZ that pairing of the measured C2 / C3 pools does not give (M+3 in Zhou 2025b)."
  - "C1 / cross-product leak: methylpyrazine (or pyrazine) formed in a pot fed a single dicarbonyl, bounding C1 addition to the bare dihydropyrazine or dicarbonyl interconversion."
