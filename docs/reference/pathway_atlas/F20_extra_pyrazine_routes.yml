condition_dependence: >-
  SHOWN. Aldehyde addition to the dihydropyrazine runs at 180 C in low-water roasts with free amino acids (13C:
  Nestle, Reading; fed MGO + Ala: DFA) and carries 25-100 % of the ethyl / extra-methyl pyrazines, ~45-50 % of
  2,6-DMP, 2,3-DMP and TMP in a glycine-flooded potato; it needs a free amino acid's Strecker aldehyde or a
  sugar-fragment aldehyde (Ghent: adducts vanish with peptides at 130 C; Arg / Lys / Ser give sugar-aldehyde
  adducts); larger Strecker aldehydes (Leu, Ile, Met, Phe) add at 130-180 C in water or a starch bed but not at
  90 C neat (Ghent, Rutgers). It does NOT make methylpyrazine from glycine formaldehyde (Reading label) and C1 leak
  into MPZ in glyoxal-only pots is ~1-2 % (Ghent). The methylpyrazine excess (R > 4) is shown at 75-95 C pH 9
  (Reineccius), 100 C in 8 M NH3 (UC Davis), and in Ho-network ARP pots, and its 15N label deficit at 120 C in an
  acidifying ARP pot (Ho network): an extra MPZ route with its own N source is favoured over pair-specific pairing,
  but only by one post hoc test. pH: the only within-study pH contrast (fed MGO + Cys, label 6 / 7 / 8) shows the
  unexpected PZ / MPZ from an MGO-only pot FALLING with pH while 2,5-DMP rises. ASSUMED / unshown: any temperature,
  water or pH dependence of the addition step itself; the identity of the extra MPZ route; aqueous 95-130 C labelling
  of the addition step.
best_supported_regimes:
  - "very_high T / low a_w roast / hexose + Ala or Gly: aldehyde addition operating, dominant for 3-ethyl-2,5-DMP (2 labs by 13C: Nestle, Reading; plus fed MGO + Ala at DFA)"
  - "very_high T / intermediate a_w potato / glycine-rich: formaldehyde addition ~half of 2,6-DMP, 2,3-DMP, TMP; absent for MPZ (Reading, 13C)"
  - "high T / dilute / peptide amine: addition starved (Ghent only, peak areas)"
  - "methylpyrazine extra route: operating in one acid-drifting ARP pot (Ho network, 15N, post hoc); unattributed mixing signature in 3 more systems (Reineccius, UC Davis, Ho)"
unknown_regimes:
  - "aqueous moderate T (75-100 C) with a label able to see aldehyde addition: none (every 13C study is a 180 C roast)."
  - "acid (< 4.5, in situ) or alkaline (> 7.5, in situ) with labelling: none; the addition step has no pH law anywhere."
  - "the chemical identity of the methylpyrazine extra route (hydroxy-C2 / C3 dehydration, three-component, ARP-nitrogen): no fed hydroxyacetone / glycolaldehyde + aminoketone test, no argon vs air test (EX-052 missing experiments 2-3)."
  - "low T (<= 60 C): nothing."
  - "protein-bound amine: nothing with a marker."
  - "Zhou 2024's [M-H]+ correction: unread SI; it decides whether the 15N deficit is real."
  - "a cross-lab replicate of the Leahy lysine-glucose R with MS-confirmed MPZ (single lab, NPD)."
  - "Strecker aldehyde vs sugar-fragment aldehyde share of the addition in a sugar pot: only the Ghent amino-acid screen (areas) and Reading's glycine label bound it."
competing_families:
  - "F19_aminoketone_pyrazine: the same dihydropyrazine either aromatises (F19 product) or adds an aldehyde (this family); oxidation wins unless the aldehyde is abundant (adduct : parent a few % at 90 C dry, ~50 % in a glycine-flooded 180 C potato)."
  - "F16_strecker_aldehyde: the added aldehyde is the Strecker aldehyde; its loss to the dihydropyrazine is a Strecker-aldehyde sink."
  - "F10_retroaldol_c3_c2: sugar-fragment formaldehyde / acetaldehyde and C2 / C3 pools feed both the extra MPZ route and the adducts."
  - "F21_pyrroles_pyridines and F26 thiazoles (Cys): compete for MGO and aminoketone in the Cys + MGO pot where PZ / MPZ appear unexpectedly."
engine: >-
  NOT IN THE ENGINE. network.py B18 books the Strecker formaldehyde (and B22's CO2) to FRAG_C, a dead end; there
  is no dihydropyrazine species, no aldehyde-addition step, no trialkyl / ethyl / extra-methyl pyrazine, no 2,6- or
  2,3-DMP, and no methylpyrazine route other than r_ak_mpz (AKG + AKM, shared k_cond). MISMATCHES: (a) methylpyrazine
  is under-predicted twice over: CF-077 (R = 1 for want of the cross-pair factor 2) and no extra route against the
  measured R 7.5-52 (Leahy), ~440 (Shibamoto) and the 15N deficit (Zhou 2024): against Leahy's lysine-glucose /
  lysine-ribose pots the engine is 3.5x / 7x low; (b) the Strecker formaldehyde, which the literature shows alkylating
  dihydropyrazines (~half of 2,6-DMP / 2,3-DMP / TMP in a glycine-rich roast), is lost as unassigned fragment carbon;
  (c) B22's methional and any Strecker aldehyde are never consumed by pyrazine adducts. None of the engine's three
  shipped species is wrong because of (b)-(c) (MPZ and 2,5-DMP carry no amino-acid carbon), but any future trialkyl
  or 2,6-DMP target needs the dihydropyrazine branch. The red team's minimum change (factor 2 on r_ak_mpz plus a
  one-sided MPZ band +0.3 to +1.1 dex) is pending owner approval.
