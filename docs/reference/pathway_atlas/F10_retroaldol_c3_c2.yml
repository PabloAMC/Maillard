condition_dependence: >-
  SHOWN: (i) 1-DG retro-aldol is negligible from a fed 1-DG at 37-50 C, pH 7.4, with or without air (Glomb; counterpart
  amounts mismatched), and the amine-free glass fit also refuses 1-DG -> MGO (Kocadagli) - two labs. (ii) 3-DG -> MGO is
  tiny at 37-50 C (1.3-2.8 % of 3-DG lost, Thornalley; none detected, Gobert) but material from a fed 3-DG at 100 C,
  pH 8, in situ (Weenen, relative units), and kept by the glass fit at 160-200 C: a strong temperature dependence that
  no study measures inside one design. Amine raises 3-DG -> MGO x2 at 37 C (Thornalley) but not at 100 C (Weenen 56 vs
  57). (iii) The ARP retro-aldol is a fitted step (Martins: highest Ea, 124.5; rises with amine x1.6 and pH 0.51 dex /
  unit); labelling supports C3-C4 cleavage only under pyrolysis (Yaylayan, proline, 250 C). (iv) Sugar retro-aldol
  without amine is shown in sub/supercritical water (Kabyemela). (v) Pentose: no fed 1-DX / 3-DX test exists; the one
  counterpart series (Hofmann 1999) gives glycolaldehyde 5-37x below MGO, and CAMOLA shows the C5 skeleton intact in
  MFT at 95 C (Cerny 2003) while labelled xylose C3 units reach methylpyrazine at 120 C, pH 8 (Zhou 2025b). The Jiangnan
  claim of a cystine-promoted deoxyosone retro-aldol (Hou 2026) fails its own mass balance.
best_supported_regimes:
  - "neutral / low (37-50 C) / dilute / fed hexose deoxyosones in phosphate: absent (1-DG) to minor (3-DG, <= 3 %) - Glomb, Thornalley: 2 labs, fed"
  - "neutral / moderate-high / dilute / hexose ARP + glycine: operating as a fitted DFG -> MGO step (Wageningen only)"
  - "very_high / dry or supercritical / hexose: operating (Yaylayan labelling, pyrolysis; Arai, hot water): 2 labs, no amino acid in water"
unknown_regimes:
  - "fed 1-deoxypentosone or 3-deoxypentosone -> MGO / glycolaldehyde at 100-140 C (the engine's r_dpo_c2c3 has no fed test)"
  - "fed hexose deoxyosone at 100-140 C with a calibrated MGO (Weenen's is uncalibrated and biphasic)"
  - "pH dependence of any deoxyosone retro-aldol (only the fitted ARP step has a pD)"
  - "O2 (the Glomb 1-DG tests are air vs deaerated and negative both ways; nothing at cooking T)"
  - "phosphate vs water; cysteine pots; low a_w with an amino acid"
competing_families:
  - "F11_beta_dicarbonyl_cleavage: the 1-deoxyosone's real C-C cleavage (acetic acid + C4 / hydroxyacetone + glyceric acid; 0.55-0.84 mol/mol) - it, not retro-aldol, empties 1-DG"
  - "F12_alpha_oxidative_cleavage under air (lactic / glyceric acid x4-6, Voigt 2010)"
  - "F09_namiki_c2 and F08 (glyoxal / glycolaldehyde from the Schiff base or the osone)"
  - "F13 (3-DG -> HMF / 3,4-dideoxyosone) and F31 (3-DG + amine -> melanoidin) for the 3-deoxyosone pool"
engine: >-
  Four steps carry the family: r_ama_mgo (Martins k6, DFG -> MGO; scaled by the shared trunk pH exponent 0.69, not by its
  own pD 0.51); r_tdg_mgo (Kocadagli step 11, amine-free 3-DG -> MGO; its B40 pH term was rejected by the Leitzen
  hold-out); r_dpo_c2c3 (1-deoxypentosone -> glycolaldehyde + MGO, 1 : 1, retro-aldol) and r_glc_c2c3 (glucose -> HA +
  MGO + C1). Mismatches: (1) r_dpo_c2c3 rests on the hexose analogue that the Glomb lab refuted with fed 1-DG (negligible
  MGO, mismatched counterparts) and on no pentose fed test; Hofmann 1999's HA : MGO of 0.03-0.2 does not show a 1 : 1
  source; its parameter note leans on MFT label / yield arguments (Hofmann 1998 T10, Cerny), i.e. on the product, not on
  the cleavage. (2) r_glc_c2c3's C2 + C3 + C1 stoichiometry is not a retro-aldol pattern: the measured sugar retro-aldols
  give C2 + C4 (aldose) or C3 + C3 (ketose) (Kabyemela; Huyghues-Despointes). (3) No temperature structure: the
  literature says 3-DG -> MGO is ~0 at 37-50 C and material at >= 100 C; the engine's r_tdg_mgo barrier comes from a
  160-200 C glass fit. (4) The pentose lane has no glyoxal-forming cleavage at all.
