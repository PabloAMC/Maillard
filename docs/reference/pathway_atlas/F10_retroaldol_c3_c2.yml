# Pathway-condition atlas, family F10 (written 2026-11-01, atlas agent "hub"; vocabulary: families.yml).
# Bin conventions as in F06_enol12_3deoxyosone.yml (pH boundary -> upper bin; 100 C / reflux -> moderate; operator tags;
# "[derived here]" = this file's arithmetic; "not_stated" = axis not printed). The family has four sub-routes that the
# literature treats separately; tags.sub_route says which one a cell bears on:
#   sugar (open-chain aldose / enediol -> C2 + C4, C3 + C3), ARP (Amadori compound -> MGO / C3 + C3-amine),
#   3-DG / 3-DX, 1-DG / 1-DX (incl. the pentose C2 + C3 split DPO -> glycolaldehyde + MGO that the engine carries).
family: F10_retroaldol_c3_c2
definition: "retro-aldol cleavage of sugars / deoxyosones -> MGO, glyoxal, hydroxyacetone, glyceraldehyde"
markers:
  - "COUNTERPART STOICHIOMETRY: a retro-aldol makes both halves - C3 + C3 (MGO + glyceraldehyde), C2 + C4 (glycolaldehyde + erythrose), C2 + C3 for a pentose (glycolaldehyde + MGO). Matched amounts of both halves from a FED parent are the discriminating test (Voigt 2010 / Smuda 2013: 'extremely mismatched' for 1-DG)."
  - "Label position from singly 13C-labelled sugars: C3 units drawn ~50 : 50 from C1-C3 and C4-C6 (Huyghues-Despointes 1996), MGO label on CHO vs CH3 (Weenen 1998 Scheme 1, from a 1994 study not on disk); intact-skeleton vs scrambled isotopomers in CAMOLA (Cerny 2003; Zhou 2025b)."
  - "Fed deoxyosone -> MGO (or GO) yield with the parent's loss measured (Thornalley 1999, Gobert 2009, Voigt 2009, Weenen 1998)."
  - "Not markers: MGO alone (it also forms by triose dehydration, hydroxyacetone oxidation, beta-cleavage partners); a fitted 'DFG -> MGO' constant (Martins k6) is a topology choice, not a demonstration."
