condition_dependence: >-
  SHOWN (amine release): heated alone, a hexose Amadori compound of a primary amino acid returns most of its amine as
  it decomposes, in three labs and every condition tested: glycine 0.74-0.88 per DFG at 90 C, pH 5-8 held hot (Nestle),
  71-96 % at 100-120 C, pH 6.8 (Wageningen), methionine 88 % at 100 C in phosphate (Jiangnan). Release is lower at
  mild-acid pH (Martins pH 5.5: 26-81 %; Davidek's water series rises 0.74 -> 0.84 from pH 5 to 8), and the standing
  yield falls with time and temperature because the released amine is consumed again (Deng, Zhang 2025). The PENTOSE
  ARPs of the Jiangnan pots return far less: GX-ARP 0.25-0.40 glycine per ARP at 120 C (Hou), in pots whose in-situ pH
  falls to 3.5-5; whether the gap is the sugar (pentose), the in-situ acidity, or the dilute 5 mM charge is not
  separable (single lab, no contrast). SHOWN (reversion proper): parent aldoses are a minor channel at 90-120 C
  (3-8 mol %, Nestle and Wageningen) but a major one at 37 C (hexoses ~20 % of fructoselysine, Baynes); phosphate raises
  reversion at pH 5-6 (Nestle x2.5-6 at 90 C; SCUT x1.3-1.5 at 130 C) and speeds Amadori decomposition on every channel
  (37 C x3.4 over 10-200 mM; 90 C x1.3-3.6 depending on pH; 110-130 C x1.5-3.8), with an effect that fades at pH 8
  (Davidek). Air speeds decomposition ~4x at 37 C and diverts it to oxidative cleavage (Zyzak; chelator confound).
  ASSUMED, not shown: the temperature dependence of reversion itself (no reverse constant is estimated anywhere); any
  amine catalysis of release (added Met changes nothing, Deng; added Ala speeds release, Zhou 2024 qualitative).
best_supported_regimes:
  - "mild acid to neutral / 90-130 C / dilute / hexose ARP of a primary amino acid, water or phosphate: amine release dominant (3 labs, fed intermediate: Nestle, Wageningen, Jiangnan)"
  - "neutral / 90-120 C / dilute / hexose ARP: reversion to parent aldoses minor, 3-8 mol % (2 labs, fed intermediate)"
  - "neutral / 37 C / dilute / fructoselysine model: reversion operating, ~20 % of the decomposition (1 lab)"
  - "mild acid / 90-130 C / phosphate: reversion and decomposition both accelerated by phosphate (3 labs, within-study factor)"
unknown_regimes:
  - "intermediate and low a_w: no fed-Amadori release or reversion measurement in any low-moisture system"
  - "very high T (> 140 C): no fed-ARP release yield"
  - "acid (< 4.5) held in situ: only the drifting Hou pots reach it; no held-pH release yield below 5"
  - "alkaline (> 7.5) with release measured: only Davidek pH 8 and Zhou 2024 label pH 8"
  - "pentose ARP reversion to free xylose: never quantified (Wei: 'not observed', no detection limit)"
  - "protein-bound Amadori compounds at process temperature: lysine return is disputed by model structure (CF-072, see F05), no fed protein-ARP release measurement here"
  - "O2 effect on release at process temperature: none (only 37 C)"
  - "peptide Amadori compounds: release of the peptide vs its breakdown not measured (Cui 2022 confounded)"
competing_families:
  - "F06_enol12_3deoxyosone / F07_enol23_1deoxyosone: the channels that RELEASE the amine; release is their stoichiometric by-product, not a rival"
  - "F10_retroaldol_c3_c2: the ARP retro-aldol (to MGO) also releases the amine in Martins' scheme"
  - "F16_strecker_aldehyde and F31_melanoidins: consume the released amine, which is why standing release yields fall with time and temperature"
  - "F01_schiff_glycosylamine / F04_thiazolidine_ttca: re-capture of the released sugar (and, in Wei 2022, possibly cysteine trapping of the reverted xylose)"
  - "F12_alpha_oxidative_cleavage: under air at 37 C the Amadori compound's decomposition shifts to oxidative cleavage (CML) at the expense of reversion"
engine: >-
  Trunk (engine_family_map.yml): r_ama_tdg, r_ama_odg, r_ama_mgo (and B21's r_ama_g) each return one glycine, i.e. 100 %
  release, with the Martins pH slope (+0.69 dec / unit about 6.8) on the three decays. That matches the hexose fed-DFG
  data at pH 6.8 (71-96 %) and overstates release at pH 5.5 (26-81 %), but because the measured yields are net of
  re-consumption the comparison needs the engine's own net free glycine, not its stoichiometry. Mismatches: (1) NO
  reversion step anywhere (AMA -> Glc + Gly): fine at 90-120 C (3-8 mol %) but wrong at <= 60 C (Baynes ~20 %) and for
  any pot where cysteine or a second amine can trap the reverted sugar (Wei 2022). (2) No phosphate term on Amadori
  decomposition, although four labs (Nestle, Baynes, SCUT, Jiangnan) show 1.3-12x acceleration that fades at pH 8.
  (3) Sulfur lane: the fed pentose ARP's decays (r_arp_tdp, r_arp_dpo, r_arp_decay) send the amine nitrogen to FRAG_N, i.e.
  NO amine release, whereas the same laboratory measures 25-40 % glycine release from GX-ARP (Hou) and regenerated
  alanine from AX-ARP (Zhou 2024 / 2025b); the disabled pentose entry (r_pama_*) carries an amine_return share (default
  1.0), so the two pentose routes disagree with each other. (4) No O2 dependence of the Amadori decomposition at 37 C
  (~4x), probably irrelevant at process temperature but untested there. (5) No amine catalysis of release, consistent
  with Deng's null for added Met.
