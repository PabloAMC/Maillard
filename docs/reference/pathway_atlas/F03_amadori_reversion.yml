# Pathway-condition atlas: F03 (Amadori compound -> free amine + sugar-derived fragments: amine release on
# enolisation / cleavage, and true reversion to the parent sugars), built 2026-11-01 from the extraction dossiers
# (data/lit/extraction_dossiers/). Vocabulary: docs/reference/pathway_atlas/families.yml. Every quote is verbatim from
# the FIRST dossier listed in its cell.
# The family has TWO observables, kept apart in every cell:
#   (a) AMINE RELEASE: free amine per mol Amadori compound decomposed (any channel: 1,2- / 2,3-enolisation, retro-aldol);
#   (b) REVERSION proper: parent aldoses (glucose + mannose; for xylose ARPs, xylose) formed from the fed Amadori compound.
# Laboratories (independent): Nestle (Davidek / Blank), Wageningen (Martins / van Boekel), Baynes USC (Zyzak),
# South China University of Technology (Guan / Yu), Jiangnan (Zhang X / Cui / Ho: Deng 2021, Hou 2026, Wei 2022,
# Zhou 2024, Zhang 2025 are ONE laboratory).
# Duplicates: Martins 2003 Part I (martins2003b) and Part II (martins2003) are one experiment; Part I Table 1 = thesis
# Table 4.1.1 (glycine yields; martins2003b_extraction.md sec. 0); counted once.
# Measured yields are NET of downstream consumption (the released amine reacts again: Strecker, melanoidins), so a
# release yield is a LOWER bound on the share of decomposition that released the amine.
# Fed-intermediate cells may carry `dominant` (families.yml): a fed Amadori compound whose decomposition returns most
# of its amine shows that amine release is the main fate of the Amadori nitrogen in that regime.
# ph key "not_stated" is outside the bins on purpose (as in F04).

family: F03_amadori_reversion
definition: "Amadori compound -> free amine + sugar-derived fragments (amine release / regeneration)"
markers:
  - "free amine (glycine, methionine, alanine, lysine) appearing from a FED purified Amadori compound, per mol Amadori compound decomposed"
  - "parent aldoses (glucose + mannose in ~7 : 3; xylose for pentose ARPs) appearing from a fed Amadori compound with no free sugar at t = 0 (reversion proper); fructose formed without lag is a third, direct product"
  - "isotope: 14N / 15N in products when a 14N-ARP is heated with 15N free amine (amine exchange), or 13C-sugar crossing into another amine's Amadori compound"
  - "trapping: a sugar trap (cysteine -> TTCA, a second amine -> its own ARP) capturing the aldose a fed Amadori compound releases"
  - "NOT a marker: amine loss in a sugar + amine pot (it nets formation against release), or fitted 'reverse' constants in a network that never fed the Amadori compound"

