# Pathway-condition atlas, family F08 (written 2026-11-01, atlas agent "hub"; vocabulary: families.yml).
# Bin conventions as in F06_enol12_3deoxyosone.yml (pH boundary -> upper bin; 100 C / aqueous reflux -> moderate;
# tags.operator formation_flux = trap during heating, standing_level = trap after the run; "[derived here]" = this
# file's arithmetic; "not_stated" = axis not printed by the source).
family: F08_oxidative_osone
definition: "oxidative routes: glucosone / osones (Wolff autoxidation of sugar, Amadori oxidation)"
markers:
  - "The 2-osulose itself (glucosone = 2-hexosulose; 2-pentosulose; threosone) as its quinoxaline, ideally trapped IN SITU, AND its dependence on O2: air vs argon / deaerated inside one study (Gobert 2009). Without an O2 or chelator arm a measured glucosone is presence only (it can also arise by Amadori / enaminol oxidation with no free O2 measured)."
  - "Chelator sensitivity (DTPA / DETAPAC) and Cu2+ acceleration of the osone or of its C2 product glyoxal: the metal-catalysed autoxidation signature (Thornalley 1999). Note: in the Glomb protocol deaeration and DTPA come together, so 'O2' there means 'O2 + adventitious metals'."
  - "Which parent: glucosone from the free sugar with NO amine (Wolff; Thornalley glucose alone, Kocadagli / Lee glucose glass and cake) vs from a FED Amadori compound (Deng 2021, Hamzalioglu 2026 fit). The two are separated only by feeding."
  - "Fed glucosone fate (Gobert 2009: t1/2 8 h at 50 C, ~1 % to smaller dicarbonyls, glyoxal 0.07 %): bounds how much glyoxal the osone can carry."
