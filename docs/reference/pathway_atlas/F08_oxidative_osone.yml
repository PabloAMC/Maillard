condition_dependence: >-
  SHOWN: oxygen is the defining factor at low temperature - glucosone x8 under air vs deaerated in situ at 50 C
  (Gobert) and C4 osone (threosone) x2-4 with air from 1-DG (Voigt 2009; DTPA confound); metals: glyoxal from glucose
  alone falls -87 % with DETAPAC at 37 C (Thornalley), so the 37-50 C oxidative chemistry is largely metal-catalysed;
  phosphate raises it (x14 GO, 10 -> 100 mM, metal-confounded). pH: from a fed ARP glucosone is larger at initial pH
  7.5 than 5.5 (Deng, standing). Parent: glucosone comes both from the free sugar without amine (Thornalley's GO, the
  glass / cake, juices at pH 3.4) and from a fed Amadori compound (Deng; Hamzalioglu fit in milk); the Baynes fed-ARP
  pot under air at 37 C found NO glucosone (Zyzak), so ARP oxidation to glucosone is not general at physiological
  metal levels. Amine: leucine raises glucosone 4-10x in cake (Lee). Temperature: only fits (Ea 76 in milk; the
  engine's 126 in the glass). ASSUMED / UNSHOWN: any O2 contrast at 100-140 C; the pentose osone outside one reflux
  series (Hofmann 1999) and Gobert's fed-glucosone products.
best_supported_regimes:
  - "neutral / low (37-50 C) / dilute / glucose +- amine in phosphate, air: operating and O2- / metal-dependent (Glomb, Thornalley; Baynes negative for a fed ARP): 3 labs"
  - "neutral / moderate-high / dilute / fed hexose ARP: operating as a standing osone (Jiangnan; Hacettepe milk fit)"
  - "acid / low / juices and low_aw / very_high / glucose glass or cake: operating (Hacettepe, SayFood: 2 labs), standing levels and fits"
unknown_regimes:
  - "air vs argon (or chelator) at 100-140 C in any aqueous pot: no study on disk"
  - "pentose osone (2-pentosulose) beyond Hofmann 1999's single reflux series; no pentose O2 contrast"
  - "cysteine pots: osone formation vs thiol O2 scavenging (cysteine autoxidation competes for O2) - unmeasured"
  - "alkaline (> 7.5) and intermediate a_w with a defined amine"
competing_families:
  - "F06 / F07 (non-oxidative enolisations of the same ARP / enediol): under air at 50 C F08 takes flux mainly from F07 (Gobert)"
  - "F09_namiki_c2 and F10_retroaldol_c3_c2 for glyoxal: glucosone carries little glyoxal (0.07 % at 50 C, Gobert), so most GO needs another route"
  - "F17_strecker_acid_o2 / ARP oxidative route to Strecker products (Hofmann 2000b: x9.2 air vs argon from an ARP) and F28 thiol oxidation competing for O2"
  - "F05_protein_glycation (CML by oxidative ARP cleavage under air, Zyzak)"
engine: >-
  Trunk only (DICARBONYL_REACTIONS / AQUEOUS_GLYOXAL_REACTIONS): r_glc_g (Kocadagli glass, Ea 125.9), r_ama_g (B21, fitted
  on Hamzalioglu's milk constants) and r_g_go (glucosone -> GO; per the Gobert dossier its aqueous barrier is ~4 kJ/mol,
  'consistent with zero', fitted at 110-140 C). The only O2 lever is trunk_conditions.ATMOSPHERE_FACTORS on k_ama_g /
  k_glc_g with air = 1 and every other atmosphere REFUSED (no fitted factor): the literature's clearest F08 fact (x8
  glucosone, air vs deaerated, Gobert) has no channel, and there is no chelator / metal axis (Thornalley -87 %). The
  near-zero r_g_go barrier keeps glucosone -> glyoxal fast at 50 C, where Gobert measures 0.07 %. The sulfur (pentose)
  lane has no osone, no glyoxal-producing step and no O2 route to either (B11's OX consumers are cysteine and the
  reductone pool only), though Hofmann 1999 measures 2-pentosulose and the Jiangnan pots measure glyoxal.
