# Pathway-condition atlas: F30_lipid_oxidation_crossover (literature side). Built 2026-11-01 from the extraction
# dossiers only. Quotes verbatim from the cited dossier. Scope: lipid oxidation products (or a lipid phase) ENTERING or
# DIVERTING Maillard routes, and Maillard reactants / products acting back on lipid oxidation. The lipid-carbonyl
# Strecker donor (F18), lipid aldehyde + H2S heterocycles (F26) and thiol traps (F28) are separate families; cells here
# that touch them are the crossover evidence (lipid present vs absent, labelled lipid carbon, fed lipid carbonyl), and
# say which neighbour they also bear on. "not_stated" marks a pH the study does not report.
family: F30_lipid_oxidation_crossover
definition: "lipid oxidation products entering Maillard routes (and Maillard products as antioxidants)"
markers:
  - "LABELLED LIPID CARBON in a Maillard product: 13C-dienal C5 -> pyridine C2 (zhou2000); CAMOLA with [13C6]-glucose showing the unlabelled (non-sugar) share of a sulfur heterocycle when lipid is added (du2023, du2025)."
  - "LABELLED NITROGEN from the amine / ammonia into a lipid-carbon heterocycle: 15N-NH3 -> pyridine N (zhou2000); 15N-amide share of 2-pentylpyridine (kim1996b)."
  - "FED LIPID CARBONYL + amine / ammonia / H2S giving a product that cannot form without it: 2-alkylpyridines, 2-alkylthiophenes, 2-alkyl-2H-thiapyrans (zamora2020, du2023, whitfield1988, elmore2002)."
  - "LIPID PRESENT vs ABSENT in one Maillard pot (within-study factor): the change in Maillard products (MFT, FFT, thiophenes, pyrazines) and the change in lipid volatiles (aldehydes consumed by the Maillard reactants)."
  - "Loss of amine sites (Lys, His) or thiol on a protein / peptide against a lipid aldehyde dose (meynier2004, doorn2002)."
  - "NON-markers: a lipid volatile (hexanal, 2-pentylfuran) in a Maillard pot -- it may be carried in, or formed by lipid oxidation alone (CF-033: lipid-type volatiles in lipid-free pots)."
