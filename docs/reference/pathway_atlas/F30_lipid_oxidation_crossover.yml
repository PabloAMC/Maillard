condition_dependence: >-
  SHOWN. (1) Lipid present vs absent in Cys + pentose pots at 120-145 C, pH 5-6.5: MFT falls 2-143x with phospholipid,
  PUFA ester, fresh oil or lard in four labs (Reading x3 papers = one lab group, Belfast/Reading, Huazhong), and the fall
  grows with unsaturation (18:3 > 18:2, elmore2002) and with prior oxidation (oxidised > fresh lard, xu2011); a FRESH oil
  phase alone suppresses MFT ~10x (yiltirak2026), so part of the effect is physical partitioning, not lipid-carbonyl
  chemistry. The exceptions are a GSH + glucose pot with free fatty acids (MFT +19-30 %, du2025) and FFT in an emulsion
  (x2.1 over buffer, yiltirak2026) -- CF-031 stays open and its 'emulsions raise MFT' half is only true against
  buffer+oil. (2) The reverse flow: Maillard reactants consume unsaturated lipid aldehydes (> 10x) more than saturated
  ones (~2x) and leave ketones untouched (farmer1992, elmore2002, xu2011: three labs agree on the pattern; they disagree
  on the antioxidant reading, CF-088, where xu2011's own unchanged ketones favour capture). (3) Lipid carbon and amine nitrogen form heterocycles: dienal + NH3 -> 2-alkylpyridine
  is labelled in two labs (Rutgers 15N; Kentucky 13C + 15N), runs at ROOM TEMPERATURE at pH 9 and needs free NH3 (pH
  9 > 7 > 4.5), is > 10x stronger in oil than in water, and its N comes from amide side chains (Gln 97 %) rather than
  the alpha-amine. Dienal + H2S -> 2-alkylthiophene: 92 % non-glucose carbon (CAMOLA, one lab). (4) O2 shifts the
  lipid-carbonyl attack on amino acids toward the aldehyde (Strecker): PAC x1.1-9.4 under air across eleven lipids, while the
  amine (decarboxylation) falls at pH 6 but rises for five lipids at pH 3 (Seville, one lab; Table 1 re-read 2026-11-01).
  (5) Lipid enals take thiols >> His > Lys at 20-23 C (Colorado, Graz, Nantes), thiol adducts of simple 2-alkenals
  are reversible within hours. ASSUMED / NOT SHOWN: any of this at low a_w with protein-bound amine; any rate at
  process temperature for enal + protein; any quantitative antioxidant effect of MRPs on lipid oxidation.
best_supported_regimes:
  - "mild_acid / 120-145 C / dilute / pentose + cysteine + lipid (phospholipid, PUFA ester, lard): lipid suppresses MFT and thiophenethiols (operating; 3 independent labs, within-study factor; magnitude 2-143x)"
  - "neutral-alkaline / room T to 180 C / dilute or oil / dienal + NH3 or amide amino acid: 2-alkylpyridine formation (dominant route to that product; 2 labs with labelling, 1 lab fed)"
  - "neutral / 140-180 C / Cys + sugar + dienal: lipid carbon is the skeleton of 2-alkylthiophenes (labelling, 1 lab; fed with H2S in Reading, elmore1997 -- see F26)"
unknown_regimes:
  - "low a_w / dry (crust, extrudate) with lipid present in a Maillard pot: only kim1998 (oil medium, figure-only) and zamora2015 / zamora2020 (sand / silica, fed carbonyls); no lipid-present-vs-absent contrast at low a_w"
  - "protein-bound amine (Lys / His / N-termini) competing with lipid carbonyls at process temperature: meynier2004 / doorn2002 are 20-23 C only; the Seville Lys browning series (hidalgo1993) reads colour, not adduct"
  - "alkaline pH (> 7.5) with sugar + amine + lipid together at cooking T: zhou2000 is room-T soy slurry only"
  - "inert vs air as a factor in a lipid + Maillard pot: never varied in the CF-031 studies (zamora2015 varies O2 for the lipid-carbonyl Strecker only)"
  - "Maillard products as antioxidants: NO study on disk measures an oxidation marker (PV, conjugated dienes, O2 uptake, hydroperoxide decay) with and without MRPs; xu2011 asserts it, farmer1992 rejects it"
  - "hexose sugars with lipid: only du2023 / du2025 (CAAS, one lab) and nothing with a free amino acid other than cysteine / GSH"
  - "the SHARE of a Maillard product's loss that is chemical (carbonyl capture of H2S / thiol) vs physical (partition into oil): only yiltirak2026 separates oil phase from oxidised lipid, at one pH"
competing_families:
  - "F18_lipid_strecker: lipid carbonyls as Strecker donors -- wins over the amine (decarboxylation) branch under air (zamora2015)"
  - "F26_thiazoles_thiophenes: lipid aldehyde + H2S / NH3 heterocycles; draws H2S away from F23 / F24 (MFT) and F25 (FFT) -- elmore2002's reading of the MFT loss"
  - "F28_thiol_losses: enals and their oxidation products trap thiols (thiol >> His > Lys, doorn2002; reversible for 2-alkenals, esterbauer1975)"
  - "F05_protein_glycation: lipid enals and sugars compete for protein Lys / His (meynier2004 vs nguyen2016-type glycation); no study runs both"
  - "F21_pyrroles_pyridines: 2-alkylpyridines from dienal + NH3 compete with sugar-derived pyridines for NH3; ammonia from amide deamidation (kim1996b) also feeds F19 pyrazines"
  - "F29_acrylamide: lipid alkadienals convert Asn to 3-APA / acrylamide (hidalgo2015, barriers only)"
engine: >-
  Not in the engine as chemistry. src/kinetic_core/lipid.py is a separate hydroperoxide-decomposition lane (Frankel
  slate x Schroen yield, DECADIENAL_BREAKAGE to hexanal) co-integrated with the Maillard lanes as a DIRECT SUM:
  lane_coupling_verdict() declares the species sets disjoint and the only candidate coupling, the aldehyde-lysine
  COVALENT_SINK, 'INERT BY RULING' (parameters_lipid.COVALENT_SINK.enabled False). src/kinetic_core/matrix_sites.py
  binds aldehydes and HMF to protein sites AFTER integration by a declared pseudo-first-order factor (meynier2004 /
  anantharamkrishnan2020b brackets), which removes aldehyde from the reported free pool but does not consume the
  Maillard amine pool or feed any product. No reaction key consumes a lipid carbonyl with H2S, NH3, cysteine, an amino
  acid or Asn; no 2-alkylpyridine, 2-alkylthiophene or thiapyran species; no lipid-phase partition of MFT / FFT.
  MISMATCHES with the literature: (1) the engine predicts NO change in MFT / FFT when lipid is added, against a 2-143x
  suppression in four labs (and a phase-only ~10x in yiltirak2026); (2) the engine cannot express the reverse flow
  (Maillard reactants removing > 90 % of unsaturated lipid aldehydes, farmer1992 / elmore2002), so hexanal-type
  predictions in a Maillard + lipid pot over-state the unsaturated aldehydes; (3) no NH3 / amide-N sink into
  2-pentylpyridine, which runs even at room T at pH 9 (zhou2000) -- relevant for alkaline-extracted plant isolates;
  (4) the direct-sum ruling is contradicted by the literature: the lanes share H2S, thiols, NH3 and protein Lys.
