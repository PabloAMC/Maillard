family: F14_caramelisation_amine_free
definition: "amine-free sugar degradation (caramelisation, enolisation without amine)"
# Built 2026-11-01 (pathway-atlas agent). Laboratories: Wageningen (Brands 2001), ICT Prague (Novotny 2008), Rizzi
# (Miami University; Rizzi 2004, Rizzi 2010 - one lab), Kroh TU Berlin (Hollnagel 2000), Hacettepe (Kocadagli 2016),
# Garrett (University of Florida, 1969), Reading (Mottram 2002), DFA Garching (Hofmann 1998), Nestle (Blank 1997),
# Hebrew University (Haleva 1999), Tohoku (Kabyemela 1999, supercritical water).
# The amine-free 1-DG cleavage (davidek2006a Fig. 3) is a fed-intermediate result and is filed under F11.
markers:
  - "The product appears in the AMINE-FREE arm of a within-study amine contrast (sugar alone vs sugar + amine, same pot otherwise), with a method that sees it in the amine arm."
  - "Glucose <-> fructose (Lobry de Bruyn-Alberda van Ekenstein) isomerisation without amine; net sugar loss unchanged by an added amine (brands2001)."
  - "In-situ OPD trapping of deoxyosones / MGO from a sugar heated without amine (hollnagel2000, rizzi2004)."
  - "Buffer-species catalysis of the amine-free arm (phosphate vs bis-tris; dose) - phosphate-catalysed caramelisation is a distinct, EDTA-insensitive regime (rizzi2004)."
  - "Retro-aldol C4 + C2 / C3 + C3 fragments from glucose / fructose in hot compressed water (kabyemela1999)."
