condition_dependence: >-
  SHOWN: (1) Amine-free degradation is not negligible next to Maillard at 120 C in phosphate: net glucose loss is the
  same with and without casein (isomerisation dominates), formic acid is mostly sugar-only, and ketoses make acids ~3x
  faster than aldoses with no Maillard increment (Wageningen). (2) Buffer: phosphate is a catalyst of amine-free
  degradation at pH ~7, 100 C (Rizzi: bis-tris gives nothing, dose super-linear, EDTA-insensitive), and phosphate-
  catalysed pentoses build a mM reductant pool (F15). (3) pH: specific-acid catalysis gives furfural only at pH ~0
  (Garrett); at pH 3.8-5.7 amine-free ribose furfural is pH-flat (Reading); amine-free HMF falls x25 from pH 3 to 5
  (Naim); amine-free furaneol from rhamnose appears at pH 7, not pH 5 (Naim); alkali turns ~90 % of a sugar into acids in
  1 h (Prague). (4) Products the amine-free route cannot make: no norfuraneol from free ribose (Reading) and no HDMF
  from xylose (Nestle) - the 1-deoxyosone furanones need the amine (or a phosphate ester). (5) Dry melts: MGO >
  deoxyosones without amine (Kroh, trap in situ), and the 3-DG / fructose split of the hexose deoxyosones (Hacettepe):
  3-DG only from glucose, 1-DG only from fructose. ASSUMED: that the amine-free enolisation rates measured in
  phosphate transfer to water or carboxylate buffer (no amine-free sugar pot in water vs phosphate at constant pH
  except Brands' / Rizzi's buffer-type swaps).
best_supported_regimes:
  - "neutral (pH 6.8-7.3) / 100-120 C / dilute hexose or pentose / phosphate: operating (Wageningen, Rizzi; within-study)"
  - "alkaline / ~100 C / dilute / no buffer: operating, ~90 % to acids (Prague)"
  - "acid (pH ~0) / 60-80 C: operating, furfural 70-92 % (Garrett)"
unknown_regimes:
  - "intermediate_aw (0.5-0.9) amine-free: none"
  - "amine-free pentose degradation at constant in-situ pH across 5-8 (only phosphate pH 7.1 and unbuffered drifts)"
  - "amine-free sugar in unbuffered water vs phosphate at the same pH, 100-145 C: none with a deoxyosone measured"
  - "the amine-free share of a real Maillard pot's deoxyosones (labelled amine vs unlabelled? no design on disk)"
  - "O2 effect on caramelisation: none"
  - "disaccharides (sucrose, maltose) aqueous: Hollnagel's dry maltose only"
competing_families:
  - "F01_schiff_glycosylamine / F02_amadori_heyns: the amine competes for the sugar (fructose 45 vs 35 mM with casein) but does not speed net glucose loss at 120 C"
  - "F06 / F07 enolisation hub: the amine-free enolisations feed the same 3-DX / 1-DX pools (the engine's r_pent_caramel supplies 39-45 % of its 3-DX, hub H5)"
  - "F13_furans_dehydration: amine-free furfural / HMF floor vs amine-dependent furanones"
  - "F15_redox_reductones: phosphate-catalysed amine-free reductones (Rizzi 2010)"
engine: >-
  In the engine: r_glc_fru / r_fru_glc (Martins isomerisation, no amine), r_glc_frag (FITTED amine-independent sugar
  lane), r_fru_acids (Fru -> FA + AA), r_glc_tdg / r_fru_odg / r_tdg_mgo / r_fru_int (Kocadagli's amine-free melt limbs,
  applied to aqueous pots), r_glc_c2c3 / r_glc_fur (hexose fragmentation for the sulfur lane), r_pent_caramel (PENT ->
  TDP, NO pH factor since B2.1) and r_pent_thermal_dpo (PENT -> DPO). MISMATCHES: (a) no buffer-species catalysis
  anywhere (Rizzi 2004: amine-free browning is phosphate-REQUIRED at pH 7; bis-tris gives none) - the engine's
  amine-free lane runs at the same rate in water and phosphate. (b) r_pent_caramel supplies 39-45 % of the engine's 3-DX
  (hub H5) on a rate anchored on Hofmann 1998's H2S pots, while Zhai 2021's free-xylose contrast suggests less. (c)
  Kocadagli's dry-melt constants (160-200 C, freeze-dried) are carried into aqueous pots at 100-145 C. (d) k_fru_glc
  from Martins' glucose system over-predicts fructose -> glucose in a fructose-only charge x5-10 (Brands). Engine pH
  dependence of the amine-free lane: none on the trunk (no pH state), none on r_pent_caramel - consistent with
  Mottram's pH-flat ribose furfural, inconsistent with the x25 HMF fall pH 3 -> 5 (Naim) if that fall is the
  amine-free limb's.
