condition_dependence: >-
  FORMATION, SHOWN. Labelling in three labs (Iowa State, Leeds, Wageningen/Leeds) shows that in glucose + glycine (or
  casein) both sugar carbon and amine nitrogen enter the non-dialysable polymer roughly 1:1 in water and in the dry at
  70-125 C, with 25-67 % of glycine decarboxylated (more in solution than dry, Fang; ~2/3 at 70 C pH 5.5, Mundt) and
  25-50 % of glucose backbones fragmented (Fang 2010). The stoichiometry is condition-dependent: reactant ratio moves
  C/N 6.6 -> 9.3 (Leeds), dry roasting doubles sugar per amine (~2.2 vs 1.2-1.3, TU Berlin), pentose carries ~2x the
  sugar per N of glucose (TU Berlin, dry), and dry glucose + alanine climbs to C/N 21 at 200 C (TU Berlin / BAM) --
  i.e. at low a_w and very high T an amine-free (caramel-type) carbon input becomes large. Precursors: a fed Amadori
  compound gives much less colour than the Glc + Gly pot it mimics (Wageningen), so the main colour route does not run
  through the Amadori compound; among fed fragments C2 (glycolaldehyde), furfural and the 3-deoxyosones are the
  strongest browning precursors at pH 7 (Garching, visual colour). pH: from DFG, pH 6.8 >> pH 5.5 (Wageningen).
  SINK, SHOWN. At 25-30 C, covalent thioether binding of thiols to a melanoidin-derived pyrazinium electrophile is
  proven by adduct identification (Garching) and its kinetics need O2 (Nestle, 15-40x slower under N2). At room T the
  HMW fraction also binds odorants REVERSIBLY by pi-pi stacking (pyrazines ~50 %); temperature lowers reversible and
  raises covalent binding (Freising). Above 30 C only the 80 C brew decay exists, without an adduct (unattributed).
  ASSUMED: everything at cooking temperature (100-180 C) for the sink; melanoidin formation from protein-bound amine
  other than casein; the magnitude of the site density (CF-081, ~1.5 dex).
best_supported_regimes:
  - "formation, glucose + glycine, 70-125 C, aqueous or dry: amine + sugar co-incorporation with partial decarboxylation (dominant; labelling, 2 independent labs Iowa State + Leeds, plus Wageningen/Leeds on casein)"
  - "formation stoichiometry vs reactant ratio / water / sugar / T: within-study factors, 2 labs (Leeds; TU Berlin incl. BAM)"
  - "sink, coffee melanoidin + thiols at 25-30 C, pH 5.2-6: covalent thioether binding, O2-dependent (Garching trapping + Nestle factor; Freising qNMR)"
unknown_regimes:
  - "the SINK at process temperature (100-180 C): no binding or adduct measurement above 60 C; the 80 C brew is unattributed"
  - "melanoidins from plant-protein-bound Lys / Arg or peptides: only casein (brands2002b) on disk"
  - "formation share vs pH below 5 or above 8 (only DFG at 5.5 / 6.8 and Fang's pH 8 solution)"
  - "air vs inert as a factor on melanoidin formation or composition: never varied"
  - "cysteine-containing (S-) melanoidins and their binding of thiols: none on disk"
  - "melanoidins made in the model's own pots (ribose / xylose + Cys, 120-145 C) as thiol sinks: only coffee / roasted matrices are studied"
  - "phosphate vs carboxylate buffer on melanoidin formation: never contrasted"
  - "non-thiol odorant binding (pyrazines, aldehydes, furanones) other than gigl2021's single RT qNMR series"
competing_families:
  - "F13_furans_dehydration / F06_enol12_3deoxyosone: 3-DG and furfural feed both furans and the polymer; in pentose pots 3-deoxypentosone carries most early browning activity (hofmann1999)"
  - "F09_namiki_c2 / F10_retroaldol_c3_c2: C2 / C3 fragments are the most potent browning precursors (glycolaldehyde CD 1024, MGO 256) and enter the polymer (fang2010: 25-50 % fragmented backbones)"
  - "F19_aminoketone_pyrazine / F21_pyrroles_pyridines: compete for the same dicarbonyls and amine; pyrazines are also bound reversibly by melanoidin (gigl2021)"
  - "F14_caramelisation_amine_free: at low a_w and >= 180 C sugar-only carbon enters the polymer (mohsin2018 C/N up to 21)"
  - "F28_thiol_losses: the melanoidin covalent channel is one of the thiol sinks; under air at 25 C it dominates over disulfide formation (hofmann2001, < 1.5 %), but oxidation-dependent (charlesbernard2005)"
engine: >-
  Formation: src/kinetic_core/network.py r_tdg_mel (3-DG + Gly -> MEL_C 8 + MEL_N 1, Martins step 9, measured) and
  r_mgo_mel (MGO -> MEL_C 3, fitted; amine-free carbon), plus the acrylamide lane's a_int1_mel and B20's CML -> MEL
  pools; the melanoidin is an ELEMENTAL terminal pool. Sink: src/kinetic_core/sulfur.py ch_thioether_mft /
  ch_thioether_fft on the MELE site pool with reversible release (ch_thioether_release*, K from Stack 2018, K falling
  with T), MELE charged from a real matrix at MELANOIDIN_SITE_DENSITY 9.0 mmol/g (CF-081) or made by the pot from the
  deoxypentosones (ch_mele_from_dpo / tdp / ddp, k_mele_site, inert default), and ch_add_mft_dpo (B25).
  MATCHES: 3-DG + amine as a melanoidin route; covalent thiol binding to matrix electrophiles; heating releasing bound
  thiol (sign consistent with the reversible fraction in gigl2021). MISMATCHES: (1) a FIXED C/N = 8 repeat unit with
  one sugar per N, against measured C/N 6.6-9.3 (aqueous, ratio-dependent, ~2/3 decarboxylated glycine) and 13-21
  (dry, high T), and sugar per N 1.2-1.3 (water) vs 2.2 (dry) -- the engine has no water or ratio dependence of
  stoichiometry; (2) no 1-DG, glyoxal, glycolaldehyde, furfural or 3-deoxypentosone -> melanoidin step in the trunk,
  although C2 and furfural are the most potent fed browning precursors; (3) the Amadori -> 3-DG -> melanoidin path is
  the main trunk route, while fed DFG makes much less colour than Glc + Gly (martins2003b); (4) the thioether channel
  is one channel with one barrier and no O2 requirement, while the literature shows an O2-requiring covalent channel
  (15-40x slower under N2) plus a reversible pi-pi channel of the opposite T-sign; (5) no binding of non-thiol odorants
  (pyrazines ~50 % bound at RT); (6) the site density is Part 2's reagent dose (CF-081, x30 above Part 1's measured
  consumption); (7) no sink constant exists above 80 C, so every cooking-temperature use is an extrapolation.
