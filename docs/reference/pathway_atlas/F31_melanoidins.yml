# Pathway-condition atlas: F31_melanoidins (literature side). Built 2026-11-01 from the extraction dossiers only.
# Quotes verbatim from the cited dossier. Two halves: FORMATION (what enters the non-dialysable polymer, from which
# precursors, under which conditions) and the melanoidin as a SINK / BINDER (of thiols and other odorants). Colour
# (A420 / A470, visual dilution) is NOT a melanoidin marker on its own: low-MW coloured compounds also absorb, and
# fluorescence is not a proxy for binding (meynier2004 via hidalgo1993 dossier). "not_stated" marks an unreported pH.
family: F31_melanoidins
definition: "melanoidin formation and melanoidins as sinks / binders"
markers:
  - "LABELLED PRECURSOR CARBON / NITROGEN recovered in the NON-DIALYSABLE (> 3.5 / > 12 kDa) fraction: 13C / 15N glycine and site-specific 13C glucose by solid-state NMR (fang2009, fang2010); 14C sugar, whole glycine and glycine C-1 (mundt2004); 14C sugar on casein (brands2002b)."
  - "ELEMENTAL STOICHIOMETRY of the isolated polymer (C/N, sugar per N 'a', CO2 and H2O lost per N) against reactant ratio / T / water (wedzicha1992, cammerer1994, mohsin2018, mundt2004)."
  - "FED PRECURSOR -> colour or polymer: fed Amadori compound (martins2003b), fed dicarbonyls / furans with an amine (hofmann1999, colour-dilution only)."
  - "SINK markers: covalent adduct identified on the polymer (LC/MS thioether adducts, [2H]-NMR line broadening, hofmann2001); free fraction by qNMR with covalent share by mass balance (gigl2021); thiol loss suppressed by carbonyl blockers (hydroxylamine) or by N2 (charlesbernard2005)."
  - "NON-markers: A420 / A470 alone (low-MW colourants), a thiol loss in a whole brew with no adduct (oxidation, protein or polyphenol could do it -- charlesbernard2005a's class correlations are equal)."
