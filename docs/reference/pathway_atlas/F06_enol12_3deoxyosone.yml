condition_dependence: >-
  pH is the one axis with in-situ (formation) evidence: the 3-deoxyosone share of the trapped C6 osone flux falls from
  ~38 % (pH 4.5) to ~5 % (pH 7) for a propylamine ARP (Beck 1988) and from ~19 % (pH 5) to ~5 % (pH 7) for glucose +
  beta-alanine (Nedvidek 1992), one school, hexose, ~0.35-0.45 dex per pH unit in the split. Martins 2005b's fitted
  pD (0.35 for k4 vs 0.60 for k7) agrees in direction but its absolute k4 still RISES with pH: F06 is not
  acid-catalysed in absolute terms, it just gains less than F07 from base. Every standing-level series (Martins 2003b,
  Zhai 2021, Hou 2026, Deng 2021) shows the same direction more steeply, as expected when the 1-deoxyosone is far
  shorter-lived. Temperature: only fitted Ea (97 vs 107 kJ/mol, Martins 2005) - a weak fall of the F06 share with T;
  the amine-free glass ratio is flat 160-200 C (Kocadagli). Oxygen: F06 is O2-independent at 50 C (Gobert, in situ),
  while O2 moves flux into glucosone (F08) and out of 1-DG (F07). Phosphate: raises 3-DG formation at 37 C (Thornalley
  x3.8 for 10 -> 100 mM, metal-confounded) and speeds Amadori decomposition without changing its product split (Zyzak);
  nothing at 100-140 C. Amine: F06 runs without amine (glucose alone at 37 C; amine-free glass at 160-200 C) and an
  amine raises it (BOC-Lys x6 at 37 C, chelator-sensitive; leucine x4-10 in cake). Sugar: hexose and pentose both
  show it; the pentose flux split is known only from one fit (Desclaux, 2 %) and no in-situ trap.
best_supported_regimes:
  - "mild_acid / moderate / dilute / hexose ARP (alkylamine, glycine): operating, ~20-40 % of trapped osone flux (1 school in situ + Wageningen fit, 2 labs)"
  - "neutral / moderate / dilute / hexose ARP: minor in flux (~5 %, Ledl school in situ), yet the LARGER standing osone (DFA, Wageningen, Glomb ex situ) - the observation operator decides which you see"
  - "neutral-to-acid drifting / high / dilute / pentose ARP or Cys-ARP in water: operating, standing levels only (Jiangnan, 1 lab; CF-060 / CF-062 / CF-083 scale caveats)"
  - "neutral / low (37-50 C) / dilute / glucose +- amine in phosphate: operating, O2-independent, phosphate- and metal-sensitive (Thornalley, Glomb, Baynes: 3 labs)"
unknown_regimes:
  - "any in-situ (formation) split for a PENTOSE amino-acid ARP at any pH (the hub's central number is unmeasured)"
  - "alkaline (> 7.5) formation flux; the only alkaline points are standing (Zhai 2021 pH 8) or a fit (Martins pH 7.5)"
  - "phosphate vs water at 100-140 C (Deng 2021 water vs 0.1 M phosphate at 100 C is the nearest, ARP decay only)"
  - "O2 / argon at 100-140 C (Gobert is 50 C)"
  - "intermediate a_w (0.5-0.9) with a defined amine; protein-bound lysine at cooking temperature (milk fits only)"
  - "cysteine vs non-thiol amine on the FLUX split (Jiangnan trap signatures are standing ratios, CF-071)"
competing_families:
  - "F07_enol23_1deoxyosone: same enaminol / ARP; wins the formation flux at pH >= ~6 in every in-situ and fitted study; F06 wins only below ~pH 5"
  - "F08_oxidative_osone: under air with trace metals at 37-50 C glucosone out-traps 3-DG ~10x (Gobert in situ)"
  - "F03_amadori_reversion: at 37 C reversal to the aldoses (7.5-22 %) exceeds 3-DG (1-1.6 %) from a fed ARP (Zyzak)"
  - "F10_retroaldol_c3_c2 (ARP -> MGO, Martins k6) and F11 / F31 sinks of 3-DG"
  - "F14_caramelisation_amine_free: the amine-free 1,2-enolisation feeds the same pool (glass, glucose alone)"
engine: >-
  Hexose trunk: r_ama_tdg (Martins k4) and the amine-free r_glc_tdg (Kocadagli step 3), r_tdg_ddg / r_ddg_hmf
  downstream. trunk_conditions.py scales k_ama_tdg, k_ama_odg and k_ama_mgo by ONE shared pH exponent (0.69 dex per pH
  unit, Martins 2003 Table 3), so the engine's hexose 1,2- vs 2,3- split is pH-INVARIANT: this contradicts Beck /
  Nedvidek (in situ) and Martins 2005b (pD 0.35 vs 0.60), which all move the split ~0.25-0.45 dex per pH unit.
  Pentose lane (sulfur.py): r_arp_tdp (acid factor) + r_arp_tdp_thermal (no factor), r_pent_tdp (acid), r_pent_caramel
  (no factor). Labelling the ARP 1,2-enolisation "acid" makes its ABSOLUTE rate fall with pH, while Martins' k4 rises
  with pH (pD +0.35); only the ratio direction matches. The Cys-ARP route (CYS_AMADORI_ROUTE) ships dpo_share = 0.30,
  i.e. 70 % of the decay to 3-DX, anchored on Zhai 2019's STANDING 3-DX / 1-DX = 2.1-2.6; the formation-flux data on
  disk (Desclaux fit 2 %, Beck 5 % at pH 7, hexose / alkylamine) put the F06 flux share near 2-5 % at neutral pH, so the
  engine uses a lifetime-weighted ratio as a flux split (transfer caveat: Beck / Desclaux are hexose or phosphate, red
  team claim 3b P 0.35). r_pent_caramel supplies 39-45 % of the engine's 3-DX (hub H5); no source on disk measures an
  amine-free pentose 1,2-enolisation share in water. No O2, phosphate or metal axis on any F06 step (literature:
  phosphate / metals matter at 37 C; O2 does not).
