# Pathway-condition atlas, family F06 (written 2026-11-01, atlas agent "hub"; vocabulary: families.yml).
# Bin conventions used in this file (families.yml gives open intervals only):
#   - a boundary value goes to the bin it opens upward for pH (4.5 -> mild_acid, 6.0 -> neutral, 7.5 -> neutral);
#     for temperature the upper edge is inclusive (100 C and aqueous reflux ~100-103 C -> moderate; 120 / 140 C -> high).
#   - ph_basis "label" = the pH set before heating (no in-situ record); "in_situ" = measured during / after heating.
#   - tags.operator: "formation_flux" when o-phenylenediamine (OPD) or another trap is PRESENT DURING HEATING (each
#     osone is caught as it forms: a cumulative formation split), "standing_level" when the trap is added after the run
#     (the level is formation / loss, i.e. lifetime-weighted: a short-lived osone is under-represented).
#   - "not_stated" is used for a primary axis the source does not print (Nedvidek 1992 prints no temperature; Hayashi
#     1980 has no pH); it is not a bin.
#   - Derived shares marked "[derived here]" are this file's arithmetic on the dossier's printed numbers.
family: F06_enol12_3deoxyosone
definition: "1,2-enolisation -> 3-deoxyosone (3-DG / 3-DX)"
markers:
  - "IN-SITU trapped 3-deoxyosone quinoxaline (2-(2',3',4'-trihydroxybutyl)quinoxaline from 3-DG; 2-(2',3'-dihydroxypropyl)quinoxaline from 3-DX) with OPD present from t = 0: a FORMATION split against the 1-deoxyosone (Beck 1988, Nedvidek 1992, Gobert 2009)."
  - "A fed Amadori compound (or fed TTCA / Cys-ARP) giving the 3-deoxyosone, with the parent decay measured: says the 1,2-enolisation runs from that parent (Martins 2003b, Zyzak 1995, Deng 2021, Hou 2026)."
  - "Standing 3-deoxyosone level by EX-SITU OPD: proves presence, NOT share; the 3-DX / 1-DX standing ratio is weighted by the two lifetimes (1-DG gone within 5 min at pH >= 6, 120 C, Davidek 2006a) and inverts the flux ratio."
  - "Downstream signatures that are 3-deoxyosone-specific: HMF / furfural via the 3,4-dideoxyosone (Kocadagli 2016 model discrimination), formic acid carrying C-1 of [1-13C]3-DG (Weenen 1992). Furfural / HMF alone are NOT a marker (fructofuranosyl-cation route, F13)."
  - "Not a marker: total quinoxaline or dicarbonyl sums; GC/HPLC peak areas without isomeric response (Nedvidek's two C6 quinoxalines are isomers, so their RATIO is usable)."
