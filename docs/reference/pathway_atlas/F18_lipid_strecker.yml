# Pathway-condition atlas, family F18 (literature side). Written 2026-11-01 from the extraction dossiers named per
# cell; vocabulary and status caps from docs/reference/pathway_atlas/families.yml. Every quote is a verbatim substring
# of the cited dossier (checked by scratchpad check_atlas.py, whitespace-normalised). Numbers marked "mine" are derived
# by this atlas, not printed. Every quantitative cell but one is from ONE laboratory (Instituto de la Grasa, Seville);
# the Reading cell is indirect. Lipid aldehyde + H2S / NH3 heterocycles are F26 / F21; lipid oxidation itself is F30.
family: F18_lipid_strecker
definition: "lipid carbonyls (enals, epoxyalkenals, HNE) as Strecker donors / keto-acid route"
markers:
  - "A FED lipid carbonyl (2,4-alkadienal, 4,5-epoxy-2-alkenal, 4-oxo-2-alkenal, 4-hydroxy-2-nonenal, hydroperoxide) + amino acid, with NO sugar, gives the Strecker aldehyde above the amino-acid-alone blank, linear in the carbonyl dose."
  - "The nitrogen ends in a LIPID-derived product (N-substituted pyrroles, 2-alkylpyridines, nona-1,3-dien-1-amine), not in a sugar aminoketone: no pyrazine co-product is expected from this route."
  - "The free carboxyl is required: the amino-acid METHYL ESTER gives no Strecker aldehyde (Hidalgo 2004); aldehyde formed at 37 C, not in the GC injector, shown by cysteamine trapping."
  - "Keto-acid route: the transamination product (phenylpyruvic acid from Phe) appears beside the aldehyde; a FED alpha-keto acid degrades a second amino acid to its Strecker aldehyde without forming the amine."
  - "Oxygen signature OPPOSITE to F16: for alkadienals / hydroperoxides the aldehyde collapses under N2 (x4 - 9 less) and the Strecker AMINE (non-oxidative decarboxylation) takes over."
