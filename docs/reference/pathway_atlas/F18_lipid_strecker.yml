condition_dependence: >-
  SHOWN (one laboratory, Seville, for every quantitative cell). Lipid carbonyls degrade free Phe to its Strecker
  aldehyde from 37 C (hours, epoxyalkenals / HNE / oxoalkenals; yields 0.5 - 25 % depending on the paper, CF-078) to
  180 C (1 h, alkadienals / hydroperoxides 8 - 17 %). OXYGEN: alkadienals, hydroperoxides and HNE need O2 for the
  aldehyde (x4 - 9 more under air at 140 C on sand; Ea 27.6 in air vs 78.0 under N2), because they first oxidise to
  epoxy / keto species; without O2 the same imine decarboxylates to the Strecker AMINE, which dominates at pH 6
  under N2. Keto-acid donors are nearly O2-independent (+19 % over 0 - 100 % O2). pH: acid favours the aldehyde
  at 140 - 180 C (exponential fall pH 2 - 12) and in acetonitrile at 37 C (optimum <= 3), but an aqueous
  epoxyalkenal series at 37 C peaks at pH 6.9 (CF-079). TEMPERATURE: low-Ea donors win at 37 C, competing channels
  set the ranking at 80 - 180 C. WATER: all pots are acetonitrile-water, buffer at 20 - 90 mM, or sand slurries;
  the water series on sand moves both exits. A transamination exit (alpha-keto acid) can exceed the aldehyde at
  37 C (x2.5) and is itself a slow donor (~2 % per day at 60 C). Second laboratory: Reading shows only that
  UNOXIDISED linoleic acid is not a donor at 100 C and that lipid amplifies methional with glucose (unattributed).
  ASSUMED / NOT SHOWN: any lipid-donor Strecker in a pot with sugar where the lipid route is marked; any amino acid
  other than Phe (and Gly as keto-acid source); protein-bound amine; purely aqueous pots at 100 - 140 C.
best_supported_regimes:
  - "acid / very_high (180 C) / dilute buffer / alkadienal or hydroperoxide + Phe under air: operating, 8 - 12 % PA in 1 h (Seville, several papers; one lab)"
  - "acid / high (140 C) / low_aw sand / 11 lipid carbonyls + Phe, air vs N2: operating, O2-dependent (Seville; one lab)"
  - "low (37 C) / dilute (acetonitrile-water) / HNE or epoxydecenal + Phe: dominant source of PA in a sugar-free fed pot, magnitude CONFLICTING (CF-078)"
  - "acid / moderate (100 C) / dilute / alpha-keto acid + Phe: operating, no amine (Seville)"
unknown_regimes:
  - "any pot with sugar AND a lipid carbonyl in which the lipid route is marked (label, fed carbonyl with sugar)"
  - "a second laboratory for any quantitative lipid-donor Strecker yield or pH / O2 law (evidence map 2.10: SINGLE)"
  - "purely aqueous pots at 60 - 140 C (the 37 C aqueous series is area ratios only)"
  - "amino acids other than Phe (Leu, Ile, Val, Met aldehydes never measured with a lipid donor; Hidalgo 2016 added them but measured Phe's products only)"
  - "protein-bound or peptide amine with a lipid donor"
  - "alkaline in-situ pH with a measured aldehyde yield beyond the figure-only series"
  - "intermediate_aw (0.5 - 0.9) at a measured a_w"
competing_families:
  - "F16_strecker_aldehyde: sugar dicarbonyls compete for the same amino acid; no study has both donors with a marker (designed experiment E7)."
  - "the Strecker AMINE exit (non-oxidative decarboxylation): wins under N2 at pH 6 (PEA / PAC up to 11)."
  - "F30_lipid_oxidation_crossover: the same carbonyls go to hexanal (9 - 14 % of decadienal), pyrroles and melanoidin-type polymers; F21 (dienal + NH3 -> 2-alkylpyridines) and F26 (dienal + H2S -> thiophenes) take the same donors."
  - "F28_thiol_losses / covalent amine adducts: N-substituted 2-pentylpyrroles are the main product of epoxyalkenal + amine, ahead of the aldehyde."
engine: >-
  NOT IN THE ENGINE. The lipid lane (lipid.py) and the Maillard lanes share no species: lane_coupling_verdict
  permits co-integration as a DIRECT SUM because the only candidate coupling (aldehyde-lysine covalent sink) is
  inert by ruling, so the engine predicts x1 for any lipid effect on a Strecker aldehyde. No lipid carbonyl acts on
  an amino acid; no keto-acid species; no Strecker amine; no Phe aldehyde. MISMATCHES: (a) lipid carbonyls give
  Strecker aldehydes at yields comparable to or above the sugar dicarbonyls (8 - 17 % at 180 C vs ~1 % from fed MGO
  at 98 C) and from 37 C upward; (b) their O2 dependence is the opposite of the engine's Strecker (which is
  O2-independent, correct only for sugar dicarbonyls); (c) the lipid lane's 2,4-decadienal is a reactant here that
  Met depletes /4 (Mandin), a cross-term the direct sum forbids. A plant-protein + oil matrix is where the omission
  matters most; the evidence is one laboratory, so a declared band, not a fitted step, is what it supports.
