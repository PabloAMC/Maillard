# Pathway-condition atlas, family F26 (literature side). Written 2026-11-01 from the extraction dossiers only.
# Every cell's `quote` is copied verbatim from the dossier it cites (grep -F finds it, markdown included).
# Status convention used here: F26 is a PRODUCT-CLASS family (thiazoles, thiazolines, thiophenes / thiophenones,
# alpha-mercaptoketones), so a detected product means the family operates; the MARKERS below decide WHICH sub-route
# (intact sugar chain vs fragment vs norfuraneol vs lipid aldehyde vs cysteamine) made it. `dominant` is used only
# where labelling or a fed partner fixes the sub-route's share.
family: F26_thiazoles_thiophenes
definition: "thiazoles / thiazolines / thiophenes / mercaptoketones (incl. lipid aldehyde + H2S / NH3)"
markers:
  - "Mercaptopentanone isomer + label: 3-mercapto-2-pentanone M+5 (or C-1 labelled) from [13C5] / [1-13C]ribose = intact ribose chain via the 1,4-dideoxyosone; 2-mercapto-3-pentanone unlabelled when unlabelled norfuraneol is fed against [13C5]ribose = the norfuraneol (NF) route (Cerny 2003 / 2004)."
  - "3-mercapto-2-butanone label: max 4 labels from [13C5]ribose (a C4 from a C5, no recombination); [1-13C]ribose split 54 : 46 = C-1 loss vs C-5 loss (Cerny 2004)."
  - "Thiazole C-2 label from [1-13C] / [13C5]ribose (one sugar carbon, as formaldehyde, + cysteine N, S) (Cerny 2003 / 2004)."
  - "Fed partners: alkanal + alpha-hydroxyketone / alpha-dione + (NH4)2S -> 2-alkyl-3-thiazolines / thiazoles (Elmore 1997); cysteamine + methylglyoxal -> HDT -> 2-acetyl-2-thiazoline (Hofmann 1995b); fed norfuraneol + Cys or H2S -> mercaptoketones / thiophenones (Whitfield 1999 / 2001); methylglyoxal + H2S -> mercapto-2-propanone (Hofmann 1998 T7); furan + sulfide -> thiophene (Zhai 2023)."
  - "Lipid markers: 2-alkylthiophenes / 2-alkylthiapyrans / 1-alkanethiols that appear ONLY when a lipid or a 2,4-dienal is present (Farmer 1990, Whitfield 1988, Du 2023), and carry no sugar carbon under [13C6]glucose CAMOLA (Du 2023)."
  - "Carbon-source negatives: 3-thiophenethiol 95 % unlabelled from [13C5]ribose = cysteine carbon (Cerny 2003); thiophenone > 98 % unlabelled from [13C5]xylose with thiamin = thiamin carbon (Cerny 2007)."
