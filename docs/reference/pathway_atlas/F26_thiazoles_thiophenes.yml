condition_dependence: >-
  F26 is a product class with several sub-routes, and the literature resolves them by labelling only in pentose +
  cysteine pots at pH 5, 95 C (Cerny 2003 / 2004) and pH 4-7, 145 C (Cerny 2007), and for the lipid thiophene in one
  glucose pot (Du 2023). SHOWN: (a) MERCAPTOPENTANONES - at 95 C the intact ribose chain makes 3-mercapto-2-pentanone
  (96 % intact, C-1 labelled) and the NF-marker isomer 2-mercapto-3-pentanone is absent; it appears at 140-145 C
  (Hofmann 1995 minor isomer; Whitfield 1999 fed NF 1:1 with its isomer) and, with thiamin, only at pH >= 6, then
  >= 94 % pentose-derived (Cerny 2007). So the NF route to mercaptoketones needs higher T and is favoured at higher pH;
  the ribose-chain route works at 95 C. (b) pH - every within-study ladder agrees that mercaptoketones collapse from pH
  4.5 to 6.5-7 (Meynier > 54x, Whitfield 2001 ~25 to >= 775x, Cerny 2007 xylose part ~24x) while thiazoles
  (Meynier: 2-acetylthiazole > 440x up) and thiophenones / trithiolanes / dithiolanones (Whitfield 2001; Cerny 2007)
  rise: H2S and NH3 shift from mercaptoketones into ring products at neutral pH. Mercapto-2-propanone in glucose pots
  peaks at pH 5 (Hofmann T9). (c) WATER - dry 180 C raises 2-acyl-2-thiazolines ~7x and lowers 3-mercapto-2-pentanone
  6x (Schieberle 1998 SIDA; T and water confounded). (d) CO-REACTANT - cysteine instead of H2S raises mercaptoketones
  10-17x from fed NF (Whitfield 1999). (e) LIPID - 2-alkylthiophenes / thiapyrans appear only with PUFA-rich lipid or
  a 2,4-dienal (Reading: 4 studies, one group; Du 2023 labelling: 92 % aldehyde + H2S); 2-alkyl-3-thiazolines form
  readily from alkanal + hydroxyketone + NH3 + H2S in a fed alkaline pot (Elmore 1997) but no study on disk detects
  long-chain alkylthiazoles in a cysteine + sugar + lipid pot (Du 2023: none; Farmer / Whitfield: only short-chain);
  phospholipids halve mercaptoketones and leave thiazoles unchanged. (f) THIAZOLINES via cysteamine: HDT -> AT rises
  13x from pH 3 to 9 at 100 C, and AT decays > 99 % in 20 min at 145 C (Hofmann 1995b), but how much cysteamine
  cysteine yields is unmeasured. (g) Carbon sources: thiazole C-2 is 44-65 % sugar C-1; 3-thiophenethiol is cysteine
  carbon; a pH >= 6 thiophenone is thiamin carbon. Independent laboratories: Cerny (Nestle / Firmenich, counted
  once), DFA Garching, Reading (Mottram group; Whitfield, Farmer, Meynier, Elmore counted once), Zhai / Jiangnan, Du
  2023 - five, of which three have labelling or fed-partner evidence for mercaptoketones and two (Reading fed, Du
  labelling) for lipid thiophenes. ASSUMED, not shown: rates of any F26 sub-route; that Elmore's alkaline
  ammonium-sulfide chemistry applies at pH 5-6 in cysteine pots; that the 95 C / 145 C labelling transfers to
  100-140 C.
best_supported_regimes:
  - "mild_acid / moderate (95 C) / dilute / pentose + Cys: 3-mercapto-2-pentanone from the intact ribose chain dominant, NF-isomer absent (1 lab, labelling, 2 papers)"
  - "mild_acid / high (140 C) / dilute / fed NF + Cys: mercaptoketones dominant NF thiol products, 16 : 1 over MFT (1 lab, fed)"
  - "neutral (pH 6-7) / high-very_high / dilute / pentose or NF + Cys: mercaptoketones minor-to-absent, thiophenones / thiazoles / trithiolanes up (3 labs, within-study pH ladders + labelling)"
  - "mild_acid-neutral / high-very_high / dilute / Cys + sugar + PUFA lipid or 2,4-dienal: 2-alkylthiophenes / thiapyrans operating (2 labs: Reading 4 studies, Du 2023 labelling)"
  - "mild_acid / very_high / low_aw (dry 180 C): 2-acyl-2-thiazolines up, mercaptoketones down (1 lab, SIDA, T-confounded)"
unknown_regimes:
  - "low temperature (<= 60 C) and the 100-140 C bin with labelling: no mercaptoketone / thiazole label study"
  - "alkaline (> 7.5) in cysteine + sugar pots: only fed (NH4)2S (Elmore, Zhai) and the isolated HDT ladder"
  - "intermediate a_w (0.5 - 0.9): only aqueous vs dry silica 180 C"
  - "long-chain 2-alkyl(-4-methyl)thiazoles / 3-thiazolines in real Cys + sugar + lipid pots: never detected on disk (Du 2023 negative)"
  - "cysteine -> cysteamine yield (needed for the 2-acetyl-2-thiazoline route): unmeasured"
  - "hexose pots with labelling of mercaptoketones / thiazoles: none (Du 2023 labels only the lipid thiophenes)"
  - "time courses of any F26 product: none (all single time points)"
  - "oxygen contrast (air vs inert): none within one study"
  - "protein-bound amine / meat matrices with a marker: none"
competing_families:
  - "F23_mft_intact_c5 / F24_mft_fragments: norfuraneol and the 1,4-dideoxyosone split between MFT and mercaptoketones (mercaptoketones 16 : 1 over MFT from fed NF, Whitfield 1999); at pH 6.5 both lose to thiophenones / dithiolanes"
  - "F25_fft_furfural_h2s: shares H2S; FFT falls with pH while F26 ring products rise"
  - "F19_aminoketone_pyrazine and F21_pyrroles_pyridines: compete for NH3 and the hydroxyketone / dione (Elmore: tetramethylpyrazine 12-30 %, imidazoles to 28 %, trialkylpyridines to 48 % of area; Farmer / Du: 2-alkylpyridines from the same dienal as the thiophene)"
  - "F22_cysteine_h2s: supplies H2S and NH3 (cysteine's own Strecker in Du 2023); cysteine gives 10-17x more mercaptoketones than free H2S from fed NF"
  - "F27_thiamine_gsh_sources: thiamin supplies 77-90 % of 3-mercapto-2-pentanone and a pH >= 6 thiophenone (Cerny 2007)"
  - "F28_thiol_losses: mercaptoketone / thiol disulfides (Whitfield 1999: 7.5 % of thiol as disulfide, alpha-dicarbonyl as the proposed oxidant)"
  - "F30_lipid_oxidation_crossover: lipid aldehydes take H2S (thiophenes / thiapyrans) and halve mercaptoketones"
engine: >-
  Partly in the engine (src/kinetic_core/sulfur.py, species_sulfur.py, parameters_sulfur.py; read only).
  Mercaptoketones: MP3P (2-mercapto-3-pentanone) only from norfuraneol + H2S (r_nf_mp3p, k_nf_mp3p; ch_redox_mp3p,
  the B27 redox branch, phi = 0 by default); MP2P (3-mercapto-2-pentanone) only from thiamine via HMP (r_hmp_mp2p);
  MP (mercapto-2-propanone) from MGO + H2S (r_mgo_mp, k_mgo_mp); all decay through k_thiol_decay. No
  3-mercapto-2-butanone species (2,3-butanedione DA exists in network.py, with no DA + H2S step). Thiazoles: only
  2-acetylthiazole, r_cys_actz (Cys + MGO, k_cys_actz); no thiazole, alkylthiazoles, 3-thiazolines; 2-acetyl-2-
  thiazoline (HDT / ATD) is a declared deferred lane. Thiophenes / thiophenones: one lumped SHET pool from NF + HS-
  (r_nf_shet, k_nf_shet, inert zero unless a B49 report supplies it) and DMHFS; no furan + sulfide -> thiophene, no
  cysteine-carbon thiophenethiol, and lipid.py has no sulfur chemistry (no dienal + H2S -> 2-alkylthiophene /
  thiapyran, no alkanal + NH3 + H2S -> thiazoline). Mismatches: (1) the engine has NO route from ribose (without
  thiamine) to 3-mercapto-2-pentanone, the isomer that labelling shows is made from the intact ribose chain at 95 C
  and that Hofmann / Meynier / Farmer measure in thiamine-free pots; (2) the only 2-mercapto-3-pentanone route is NF,
  which matches the marker, but whether r_nf_mp3p reproduces its absence at 95 C and presence at 140-145 C / pH >= 6
  was not checked here; (3) the observed opposite pH directions (mercaptoketones down, thiazoles / thiophenones up,
  Meynier) need SHET and a thiazole route that are inert or missing; (4) 2-acetylthiazole has one source and the
  prereg records it x1000 high in Zhou 2022 while the hofmann1995b dossier records it 1750x low in Zhang 2025b - the
  single Cys + MGO channel cannot fit both; (5) no water term for the dry thiazoline rise.
