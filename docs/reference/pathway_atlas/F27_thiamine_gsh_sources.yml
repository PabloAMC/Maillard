condition_dependence: >-
  THIAMINE. SHOWN by labelling (Firmenich, Minnesota / Nestle, BTBU; 3 labs): thiamine is the main MFT source
  whenever it is present at food-like or dilute loadings, and its share falls as the pentose + cysteine loading rises
  (85 -> 54 % at pH 5, 145 C, 1x -> 2x; < 2 % xylose MFT at 1.2 mM thiamine, 132 C). Across pH 4-7 at 145 C the share
  moves only 75-90 % (labelling cells 3-5), so pH barely shifts the route mix while it strongly shifts levels. 34S
  shows thiamine also supplies ~92 % of MFT SULFUR in a bouillon at a_w 0.83, 120 C (cell 7). Within-study (no
  label): thiamine >> ribose + cysteine at meat-like concentrations, 100 C (DFA, cell 16), and at 69 C in ham
  cysteine + sugar gives no MFT at all (INRA, cell 19); but fed thiamine alone at 20 mM, 145 C is a weak MFT source
  per mole (0.01 %, cell 15). Thiamine as an H2S donor: SHOWN to switch on between pH 6 and 7 at ~100-121 C (35S and
  methylene blue, Nebraska, cells 8-11); yet Cerny's cysteine-free pot puts thiamine sulfur on a xylose skeleton at pH
  5, 145 C (cell 2), so some sulfur transfer exists below the H2S threshold at higher T (free H2S or S-transfer
  unresolved). Partners: cysteine raises thiamine-MFT 7x at 100 C, pH 5.7 (Grosch) but stops thiamine degradation
  for 30 min at ~100 C, pH 5-7 (Arnold) - a tension between two labs at different cysteine:thiamine ratios (~11 vs 70;
  Grosch's own dose series drops below its cysteine-free level at ~91) and times (CF-089); exogenous H2S raises
  thiamine-MFT 3x (Grosch), consistent with Bolton's HMP -> oxofuran + H2S route; xylose raises thiamine-MFT 4-5x at
  pH 7 in an SDE pot with no other sugar (Reading) but not at pH 5.5-5.8, a_w 0.83 in a glucose-rich blend (Bolton)
  (CF-090). Water: MFT needs water (absent in PG, Hartman 1984); total S volatiles peak
  near a_w 0.72 (cell 21, unattributed). Thiamine pyrophosphate is inactive (cell 17). GLUTATHIONE. SHOWN (Rutgers,
  Jiangnan; 2 labs, no labelling): GSH is a weaker sulfur donor than free cysteine for MFT (18x at 120 C, pH 7.5;
  n.d. vs 9.6 mg/mol at pH 2.2, 180 C) and for polysulfides (30x with glucose, 180 C), but nearly as good for FFT
  (1.3-2.1x); with glucose its sulfur volatiles rise 2.1x from pH 3 to pH 6-8 at 160 C (cell 22); the reduced thiol
  is required (sulfonic acid gives none). GSH disappears mainly by gamma-glutamyl cleavage (pGlu + Cys-Gly -> Cys),
  7-14x faster than its H2S release (cell 25), and its ribose Amadori compound is itself an MFT / FFT precursor
  (cell 27). GSH's own H2S kinetics (80-110 C, pH 3-9) are in F22 cell 4. ASSUMED, not shown: any labelled split of
  GSH vs thiamine sulfur; the in-situ pH of every unbuffered GSH pot.
best_supported_regimes:
  - "mild_acid-neutral (pH 4-7) / very_high (145 C) / dilute-concentrated / pentose + cysteine + thiamine: thiamine route dominant for MFT, 54-90 % (1 lab, Firmenich, two papers that share one arm: CF-007)"
  - "mild_acid / high (120-132 C) / intermediate_aw or dilute / thiamine present at low loading: thiamine dominant for MFT carbon and sulfur (2 labs: Minnesota / Nestle 34S, BTBU 13C)"
  - "mild_acid / moderate (100 C) / dilute, meat-like concentrations: thiamine >> ribose + cysteine (1 lab, DFA, SIDA, no label)"
  - "acid-mild_acid (pH <= 6) / high (121 C): thiamine releases <= 4 % of its sulfur, thiazole retains it (1 lab, 35S); H2S from thiamine at pH >= 6.5-7 (same lab)"
  - "neutral / high-very_high / dilute / GSH + sugar: GSH operating as a weaker S donor than cysteine (2 labs, within-study)"
unknown_regimes:
  - "thiamine route share by labelling at moderate T (< 100 C) and at alkaline pH (> 7.5): no labelled pot"
  - "thiamine route share with a hexose (glucose) and no pentose, by labelling (Bolton's glucose pot did not label carbon)"
  - "thiamine -> H2S at pH < 6.25 above 121 C (Cerny pot D implies sulfur transfer at 145 C, pH 5; no H2S measured)"
  - "low_aw / dry (only propylene-glycol qualitative data, Hartman 1984)"
  - "GSH vs cysteine vs thiamine sulfur by isotope (no 34S-GSH study on disk)"
  - "GSH in protein / meat matrices; GSSG as a donor"
  - "thiamine route rates: no time course of HMP, MFT and thiamine loss in one pot"
competing_families:
  - "F23_mft_intact_c5 (pentose / norfuraneol + H2S): the labelled alternative to the thiamine route; wins at high pentose + cysteine loading and loses at dilution (Cerny Table 5, Wang 2012)"
  - "F22_cysteine_h2s: cysteine is the sulfide donor the sugar route needs and, per Arnold 1971, suppresses thiamine degradation"
  - "F25_fft_furfural_h2s: FFT keeps its xylose skeleton in every thiamine pot; thiamine (or GSH) only supplies its sulfur"
  - "F28_thiol_losses: Grosch's 4-5x SDE vs reflux gap is an in-pot MFT sink in the thiamine pots; Hartman's PG pots shift MFT to its disulfide"
  - "F04_thiazolidine_ttca and F05_protein_glycation analogues: GSH forms its own Amadori compound (RG-ARP) that competes with free-GSH thermolysis"
engine: >-
  In the engine (src/kinetic_core/sulfur.py, parameters_sulfur.py, species_sulfur.py; read only). Thiamine: THI ->
  r_thi_hmp (-> HMP; k_thi_hmp, fitted, thiol_assembly barrier family, no literature note), r_hmp_mft, r_hmp_mp2p,
  r_hmp_decay, r_thi_mesh, and r_thi_h2s (B50: a DERIVED share of thiamine loss, thiamine_h2s_share = 0 below pH
  6.25, 0.04 at 6.5, 0.39 at >= 7, temperature-independent, from Arnold 1971). The first-order thiamine vs
  second-order sugar structure reproduces the dilution direction of the labelled share (Cerny Table 5, Wang 2012).
  Mismatches: (1) no pH factor on the thiamine steps (REACTION_PH_FACTOR has none), while thiamine loss rises from
  4-8 % (pH 3.5) to 33-59 % (pH 8) in 15-30 min at 121 C (Dwivedi 1972); (2) r_thi_h2s = 0 at pH 5 cannot give Cerny
  2007b pot D's xylose-skeleton FFT (no cysteine, pH 5, 145 C); (3) no HMP -> oxofuran + H2S -> MFT edge, so Bolton's
  ~8 % cysteine-sulfur MFT has no route except the sugar lane; (4) MP2P comes only from HMP, but Cerny 2007b pot F
  makes it > 95 % from xylose without thiamine; (5) no cysteine inhibition of thiamine degradation (Arnold 1971);
  (6) no water-activity term (Bolton a_w 0.83, Hartman). Glutathione: GSH species with one reaction, r_gsh_h2s
  (k_gsh_h2s = glutathione_thermolysis_k, Zheng & Ho Table III refit); matches F22's measured GSH H2S kinetics at
  80-110 C. Mismatches: no gamma-glutamyl cleavage GSH -> pGlu + Cys-Gly -> Cys (Zhou 2023c: GSH loss 7-14x the H2S
  constant, so the engine's GSH lingers and releases no cysteine); no GSH-Amadori species (CF-058, Feng 2022 rows
  excluded); no S-oxidised GSH / cysteine species (the negative controls are unscorable).
