family: F27_thiamine_gsh_sources
definition: "thiamine and glutathione as sulfur / MFT precursors"
markers:
  - "Thiamine as MFT CARBON source: unlabelled MFT (and 3-mercapto-2-pentanone) in a [13C5]pentose + cysteine + thiamine pot (CAMOLA-type); the unlabelled fraction is the thiamine route (Cerny 2007 / 2007b, Wang 2012)."
  - "Thiamine as MFT SULFUR source: 34S-cysteine + thiamine, the 32S share of MFT sulfur (Bolton 1993); 35S-thiamine sulfur balance between intact thiazole and lost (volatile, H2S) sulfur (Dwivedi & Arnold 1972)."
  - "Thiamine as a sulfide donor to a SUGAR skeleton: a sulfur product carrying the pentose label in a cysteine-free pentose + thiamine pot (FFT > 99 % xylose in Cerny 2007b pot D); H2S measured from thiamine alone (Dwivedi & Arnold 1971)."
  - "The thiamine route's intermediate: 5-hydroxy-3-mercapto-2-pentanone isolated and identified (Cerny 2008); thiamine-only markers 4,5-dihydro-2-methyl-3-furanthiol, the dihydrofuranone, 3-mercapto-2-butanone (>= 95 % thiamine carbon)."
  - "Glutathione as a sulfur source: sulfur volatiles from GSH + sugar with GSH the only sulfur; the reduced vs S-oxidised (glutathionesulfonic acid) negative control; GSH degradation intermediates measured (pyroglutamic acid, Cys-Gly, free Cys)."
  - "No-labelling within-study contrasts (thiamine vs cysteine, GSH vs cysteine, +/- thiamine, +/- GSH in the same lab and protocol) are recorded as operating at most."
