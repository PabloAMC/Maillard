condition_dependence: >-
  SHOWN (one laboratory, non-aqueous): an amine-bound glyoxal-level C2 forms within 10-20 min at ~78 C in ethanol, ahead
  of 3-DG, needs the amine (alkali alone gives none) and peaks near a 10-fold amine excess (Hayashi & Namiki 1980).
  Everything aqueous is UNATTRIBUTED: early glyoxal (Hofmann 1999), amine-raised glyoxal from glucose (Weenen 1998 x2.2,
  Thornalley x5) and glyoxal beyond what glucosone can supply (Gobert) all fit the Namiki route, but each also fits
  sugar / ARP autoxidation, and the amine-dependent glyoxal at 37 C is wholly chelator-sensitive (Thornalley). The
  pentose evidence goes the other way in one study (alanine LOWERS glyoxal from xylose, Weenen). pH: glyoxal formation
  rises modestly from pH 5 to 7 (Nedvidek, in situ, x1.4); Brands 2002c cites Hayashi & Namiki 1986 for C2 / C3
  fragments rising with pH (not on disk). Oxygen: glyoxal x2 with air at 50 C (Gobert) - Namiki's C2 imine is at the
  glyoxal oxidation level, so an oxidation (or disproportionation) is implied; never tested with an O2 arm. Temperature,
  phosphate, cysteine: no data.
best_supported_regimes:
  - "ethanol / ~78 C / glucose + alkylamine: operating, >= 1.2-7.4 % of glucose to the C2 diimine (Nagoya, 1 lab, no water, no pH)"
unknown_regimes:
  - "every aqueous regime: no aqueous study carries a marker that separates Schiff-base fragmentation from sugar or ARP autoxidation"
  - "amino acids (all Hayashi amines are alkylamines); cysteine; protein-bound lysine"
  - "pH dependence in water; temperature dependence; O2 / argon; phosphate"
  - "glycolaldehyde (the C2 at the hydroxyaldehyde level) from the Schiff base: never measured (Hofmann 1999 glycolaldehyde is a standing level without route marker)"
competing_families:
  - "F08_oxidative_osone (Wolff autoxidation of the sugar; ARP oxidation): the same glyoxal, same O2 / metal dependence; glucosone itself carries little GO (0.07 %, Gobert)"
  - "F10_retroaldol_c3_c2 (sugar retro-aldol C2 + C4 gives glycolaldehyde; amine-free in hot water, Kabyemela)"
  - "F01 / F02 (the Schiff base goes on to the Amadori compound): the Namiki share of the Schiff-base flux is unmeasured"
engine: >-
  NOT IN THE ENGINE. The trunk's Schiff base (SB, r_schiff -> r_amadori) is 'irreversible and sink-free': every
  condensed molecule reaches the Amadori pool and SB has no C2 exit. The trunk's only glyoxal source is glucosone
  cleavage (r_g_go, fed by r_glc_g / r_ama_g); the Hayashi dossier already flags the missing amine-dependent C2. The
  sulfur (pentose) lane has no glyoxal source at all, while every Jiangnan pentose pot measures glyoxal (Zhou 2025b's GO
  rises with free xylose + amine). Glycolaldehyde (HA) enters only via the retro-aldol steps r_dpo_c2c3 / r_glc_c2c3.
  Given the evidence, an F09 step would be a declared, unattributed arm (no aqueous marker), not a fitted route.
