# Pathway-condition atlas, family F09 (written 2026-11-01, atlas agent "hub"; vocabulary: families.yml).
# Bin conventions as in F06_enol12_3deoxyosone.yml (pH boundary -> upper bin; 100 C / reflux -> moderate; operator tags;
# "[derived here]" = this file's arithmetic; "not_stated" = axis not printed). Hayashi 1980 runs in 95-99 % ETHANOL: it
# is keyed water: low_aw (non-aqueous) with tags.medium, because no families.yml water bin describes an alcohol.
family: F09_namiki_c2
definition: "Namiki route: Schiff-base fragmentation -> C2 (glyoxal / glycolaldehyde)"
markers:
  - "An amine-bound C2 at the glyoxal level (glyoxal dialkylimine) appearing BEFORE the Amadori compound / 3-DG, isolated or trapped (Hayashi & Namiki 1980); its follow-on N,N'-dialkylpyrazinium radical cation (ESR) - the 1975 / 1977 papers that show it are NOT on disk."
  - "Amine dependence of the early C2: present with amine, absent from sugar + alkali alone (Hayashi 1980), and rising with amine excess."
  - "Glyoxal (or glycolaldehyde) from sugar + amine at a rate or yield the FED Amadori compound cannot supply under the same conditions (fed-ARP glyoxal is small: Deng 2021 <= 0.085 mM from 0.2 M ARP; Gobert: glucosone gives 0.07 % GO)."
  - "Not markers by themselves: early glyoxal timing (Wolff autoxidation of the sugar is also early); chelator / O2 sensitivity (shared with F08); pyrazine labelling of a GO pool (Zhou 2025b) that does not say whether the C2 came from the Schiff base, the free sugar or the ARP."
