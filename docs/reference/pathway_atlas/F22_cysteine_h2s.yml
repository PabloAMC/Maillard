condition_dependence: >-
  SHOWN: (pH) neat cysteine and glutathione release H2S faster as pH rises from 5 to 9 (x9-17 for cysteine at
  80-110 C, Zheng & Ho cell 1), with a separate, faster-than-pH-5 channel at pH 3 (cell 2); Mizutani 1960 confirms the
  pH-5 constant at ~100 C in a second laboratory with a different assay (cell 5). (T) Ea 123-135 kJ/mol for cysteine,
  ~84-111 for GSH, only over 80-110 C (cells 3-4); GSH is the faster donor at 80-90 C but the advantage vanishes by
  100-110 C (cell 4). Above 110 C there is one H2S number (Li 2022, 160 C / 160 s), 20x below the Zheng
  extrapolation (cell 9), and a 90 C sealed-vial time pair that suggests a net loss by 120 min (cell 8).
  (Carbonyl partner) Binding cysteine as a thiazolidine lowers H2S 1.2-3.5x, except furfural which doubles it (cell
  6); an enaminol / Strecker partner raises H2S to 4-8 mol % in 1 h at 100 C, roughly first order in the partner and
  4.6-47x the neat thermolysis rate (cross-study, cell 12); MAA is trapped from cysteine + a tricarbonyl (cell 11).
  No study measures H2S from cysteine + a real sugar or deoxyosone, so "a dicarbonyl accelerates H2S" rests on one
  1965 letter with glucosamine / ninhydrin. (Sugar, downstream only) With glucose, cysteine's acetaldehyde + H2S
  condensates fall 16x at 180 C (cell 15): sugar consumes or diverts the H2S / acetaldehyde, H2S itself unmeasured.
  (Oxidation state) the reduced thiol is required (cell 16); cystine also releases H2S, slower at first, then faster
  (cell 7). (Protein) protein-bound cysteine gives H2S at 0.25-3.4 % of its Cys, < 5 % of its reactions (cell 10).
  ASSUMED, not shown: that the pH law and Ea hold above 110 C; the in-situ pH (every buffered study gives the
  room-temperature label; the unbuffered ones never measured it); any O2 effect (Zheng N2-flushed, Li air, Mizutani
  CO2-swept, never contrasted for cysteine).
best_supported_regimes:
  - "neutral-alkaline / moderate (80-110 C) / dilute / no sugar / free Cys: operating, H2S release measured and pH-resolved (2 labs: Rutgers kinetics, Hokkaido confirmation at pH ~5; Copenhagen at pH 7, 90 C)"
  - "mild_acid / moderate (~100 C) / dilute / no sugar: operating, ~1 % of S in 6 h (2 labs agree to 1.5x)"
  - "moderate / dilute / cysteine + Strecker or enaminol partner: operating, H2S 4-8 mol % in 1 h and MAA trapped (1 lab, 1965, no blank, pH unknown)"
unknown_regimes:
  - "H2S time course in any cysteine + reducing-sugar or cysteine + deoxyosone pot (none on disk; the scratchpad H2S search estimates P ~0.15 that one exists)"
  - "the MAA -> H2S + acetaldehyde split and its rate; acetaldehyde and NH3 yields from cysteine + dicarbonyl"
  - "high and very_high T (> 110 C) kinetics: one single-determination point (Li 2022, 160 C); Shu 1985, Zhang 1988 and Tai 1997 at 160-180 C measured no H2S"
  - "intermediate_aw and low_aw: no H2S measurement from cysteine at reduced water activity"
  - "in-situ pH during heating: never measured in any H2S study"
  - "O2 vs inert as a within-study factor for cysteine H2S release"
  - "protein-bound cysteine beyond whey (meat proteins), and peptide-bound vs free in sugar pots"
competing_families:
  - "F04_thiazolidine_ttca: binds free cysteine as TTCA; Mizutani shows thiazolidines still release 0.3-0.8x the H2S (furfural adduct 2x), so it slows, not stops, H2S supply"
  - "F16_strecker_aldehyde (cysteine as donor): the same cysteine + dicarbonyl event, whose sulfur fate (MAA vs H2S) is the F22 Strecker branch"
  - "F28_thiol_losses: H2S and cysteine oxidation / capture; Li 2022's 120-min deficit and Zheng's sealed-system K both fold sinks into the observable"
  - "F26_thiazoles_thiophenes: consumes H2S + acetaldehyde + NH3 into trithiolanes, thialdine, thiazoles (Shu, Zhang); wins in cysteine-only pots"
  - "F27_thiamine_gsh_sources: GSH and thiamine as parallel sulfide donors; Arnold 1971 reports that cysteine suppresses thiamine degradation"
engine: >-
  In the engine (src/kinetic_core/sulfur.py, read only). Thermolysis: r_cys_h2s (Cys -> H2S + CBX + FRAG_C 2 +
  FRAG_N 1, k_cys_h2s = cysteine_thermolysis_k, Zheng & Ho matched (Ea, A) pairs, pH-3 pair below pH 5, interpolation
  5-9, clamped above 9) and r_gsh_h2s (k_gsh_h2s = glutathione_thermolysis_k, Table III refit). These MATCH the
  literature's pH and T dependence inside 80-110 C (Mizutani within 0.67-1.05x at 100 C, pH ~5; Li within 1.1-1.5x
  at 90 C, 10 min). Mismatch: above 110 C the engine extrapolates the Ea (Li 2022 160 C point 0.05x the
  extrapolation), and the 120-min deficit at 90 C is carried only by r_h2s_loss. NH3 goes to FRAG_N (amine fate
  declared in CENTRE_LEDGER); no NH3 or acetaldehyde species. Strecker: r_dpo_ddp (1-deoxyosone + Cys) sends the
  sulfur as MAA to inert FRAG_S; its H2S branch r_dpo_ddp_h2s (B59a, share 0.042 / 0.080 from Kobayasi) and the MGO
  Strecker pair r_mgo_cys_strecker / r_mgo_cys_h2s exist but are OFF by default (STRECKER_SULFUR.enabled = False,
  MGO_CYSTEINE_STRECKER zero). So by default the engine has no carbonyl-accelerated H2S, against Kobayasi's 4-8 mol %
  (4.6-47x thermolysis); the literature cannot yet give a share per Strecker event, only floors. No MAA or
  acetaldehyde species, so Shu's MAA rings and the trithiolane / thialdine markers are not scorable. Thiazolidine
  H2S: the engine's TTCA releases H2S only via free cysteine; Mizutani's 0.3-0.8x (and furfural 2x) is not
  represented. No protein-bound cysteine H2S channel; no cystine -> H2S.
