family: F22_cysteine_h2s
definition: "cysteine -> H2S (+ NH3, acetaldehyde, mercaptoacetaldehyde): thermolysis and cysteine's own Strecker"
markers:
  - "H2S measured directly (sulfide ISE, methylene blue after Zn-acetate trapping, headspace GC-FPD) from cysteine or glutathione heated WITHOUT a carbonyl partner: the thermolysis (beta-elimination) route."
  - "NH3 released alongside H2S from cysteine alone (Nessler; Mizutani 1960 Table II): the amine half of the thermolysis / desulfuration."
  - "Mercaptoacetaldehyde (MAA) trapped or isolated (bis-2,4-DNPH of its disulfide) when cysteine meets an alpha-dicarbonyl: the cysteine Strecker route; acetaldehyde + H2S co-detected."
  - "H2S yield in the presence of a dicarbonyl / enaminol partner in excess of the neat-thermolysis rate measured under the same T and pH (within-study, or against Zheng & Ho's constants): the reductive Strecker release (Kobayasi & Fujimaki)."
  - "Weaker, downstream markers (do not identify the route alone): MAA-derived rings (1,2,3-trithia-5-cycloheptene, 2-/3-thiophenethiol) from cysteine alone; acetaldehyde + H2S (+ NH3) condensates (3,5-dimethyl-1,2,4-trithiolanes, thialdine, trimethyl-thiadiazine) from cysteine alone."
  - "Negative control: an S-oxidised cysteine (cysteinesulfinic / cysteic acid) gives no sulfur volatile, so the reduced thiol is required."
