condition_dependence: >-
  SHOWN. Pyrroles: the aminoacetone + MGO pyrrole (2,5-diacetyl-3-methylpyrrole) is the main aminoacetone-derived
  product at ~0.85 M in pH 4 acetate (x80 vs pH 7 phosphate) and rises with MGO excess, but appears only with MGO, not
  glyoxal or other dicarbonyls (Ghent; one lab, fed, calibrated); N-methylpyrroles take their N from glycine when
  glycine competes (Rutgers, 15N, 180 C). Pyridines: dienal / enal + NH3 is the route with free NH3 as N donor, shown
  by 13C + 15N in soy slurry at room temperature (Kentucky), by amide-15N at 180 C in water (Rutgers), and as yields
  on silica at 180 C (Seville); favoured by alkaline pH (free NH3; text ordering pH 9 > 7 > 4.5), by an oil medium
  (x10, Rutgers, cross-study) and by amide amino acids (NH3 release). Imidazoles: glyoxal + primary amine gives
  1,3-disubstituted imidazoles + formic acid at 4-25 C and molar concentration (De Haan lab); with ammonium the
  imidazole route is >= 70-75 % of dicarbonyl loss, with amino acids and methylglyoxal it is ~1 % (aldol wins), and
  glyoxal + amines above pH 4 go mostly to oligomers. ASSUMED / unshown: the free-aminoacetone step of the pyrrole;
  any imidazole or pyrrole formation at 100-140 C in a dilute aqueous sugar pot; temperature dependence of the
  pyrrole; the Maillard-side (non-lipid) pyridine route (Hwang's pyridines have no marker).
best_supported_regimes:
  - "acid / moderate-high T / concentrated / fed MGO + Ala: pyrrole operating, the main aminoacetone sink (Ghent only, calibrated)"
  - "alkaline / low T / dilute / dienal + NH3 (soy): pyridine dominant by 13C + 15N (Kentucky)"
  - "neutral / very_high T / dilute or oil / dienal + amide amino acid: pyridine via free NH3, dominant for Gln (Rutgers, 15N) and calibrated yields on silica (Seville): 3 labs for the dienal + NH3 pyridine"
  - "acid-mild_acid / low T / concentrated / glyoxal + NH4+ or primary amino acid: imidazole dominant as dicarbonyl / amine fate (De Haan lab only)"
unknown_regimes:
  - "pyrroles at dilute concentration (< 0.5 M) or with a sugar as the dicarbonyl source: no calibrated pyrrole data outside Adams' ~0.85 M fed-MGO pots; Hwang's starch-bed pyrroles are uncalibrated."
  - "labelling of the pyrrole route (does it go through free aminoacetone, or NH3 / amine + 3 MGO?): none."
  - "imidazoles at Maillard temperatures (60-180 C) or in sugar pots: none on disk (only 4-25 C atmospheric chemistry)."
  - "pyridines from sugar-derived carbonyls with a marker: none (Hwang 1995b is product-only)."
  - "alkaline in-situ pH at high T for any F21 product: none."
  - "O2 vs inert for pyrroles (Adams' Scheme 3 has a reduction step): none."
  - "peptide or protein-bound amine for pyrroles / imidazoles: none."
  - "a temperature ladder for any F21 product except Adams' two points (100 vs 130 C, pyrrole x1.5)."
competing_families:
  - "F19_aminoketone_pyrazine: the pyrrole competes with 2,5-DMP for aminoacetone and MGO; the pyrrole wins when acid or MGO-rich at ~1 M, they are equal at pH 7 phosphate."
  - "F16_strecker_aldehyde / F10: glyoxal + amine imidazole and MG + amine aldol consume the dicarbonyl and the amine without a Strecker aldehyde or aminoketone (Sedehi: total glyoxal + glycine consumption transported to 100 C is ~1000x the engine's Strecker constant; transfer is an assumption)."
  - "F26_thiazoles_thiophenes: lipid dienal + H2S -> 2-pentylthiophene and thiazolines compete with dienal + NH3 -> pyridine for the same dienal (Elmore, Zhang)."
  - "F30_lipid_oxidation_crossover: every dienal / enal pyridine cell is also a lipid-crossover cell."
  - "F31_melanoidins: imidazole-forming glyoxal + amine pots brown; the N-containing oligomers of glyoxal + amines above pH 4."
engine: >-
  NOT IN THE ENGINE. There is no pyrrole, pyridine or imidazole reaction and no species for them (network.py,
  species.py; grep finds pyrrole / pyridine only in the B24 proline lane). Consequences: (a) AKM (aminoacetone) has
  only the condensations as sinks: no aminoacetone + MGO pyrrole sink, which Ghent shows takes 38-231x the 2,5-DMP at
  pH 4 / ~0.85 M and ~1x at pH 7 phosphate; (b) glyoxal's loss is r_go_sink (Kocadagli dry-glass, first order,
  amine-independent, barrier fixed to zero) and methylglyoxal has no amine-dependent sink, whereas the literature's
  glyoxal + amine -> imidazole + formic acid and MG + amine aldol consumption scale with amine and pH (De Haan lab,
  4-25 C only); (c) no lipid enal / dienal + NH3 -> pyridine route (the lipid lane has no N chemistry; NH3 is not an
  engine species), although three labs show 2-pentylpyridine from 2,4-decadienal + free NH3 with C and N labels;
  (d) the only N-heterocycles besides pyrazines are B24's proline products (1-pyrroline + MGO -> 2-acetyl-1-pyrroline,
  1-pyrroline + hydroxyacetone -> ATHP), a proline-specific route outside these cells. Whether the missing sinks
  matter at 100-140 C in dilute pots is not measured (no high-T imidazole or dilute pyrrole data).
