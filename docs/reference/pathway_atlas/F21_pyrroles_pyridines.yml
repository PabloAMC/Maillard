# Pathway-condition atlas, family F21 (literature side). Written 2026-11-01 from the extraction dossiers named per
# cell; vocabulary and status caps from docs/reference/pathway_atlas/families.yml. Every quote is a verbatim substring
# of the cited dossier (grep-checked). The lipid-aldehyde pyridines also belong to F30 (crossover); they are kept here
# because the ring is a dicarbonyl / enal + N heterocycle, and are flagged as such.
family: F21_pyrroles_pyridines
definition: "aminoketone / dicarbonyl -> pyrroles; pyridines; imidazoles"
markers:
  - "Pyrrole from aminoketone + dicarbonyl: an isolated, NMR-identified 2,5-diacetyl-3-methylpyrrole (one aminoacetone + two MGO) whose yield rises with MGO : amine and competes with 2,5-DMP for aminoacetone (Adams 2008). NO label shows the pyrrole passes through FREE aminoacetone (NH3 or amine + 3 MGO gives the same molecule; red team sec. 4)."
  - "Pyrrole N source: 15N partition of the ring N between a labelled and an unlabelled amine in one pot (Hwang 1995b; prose numbers only)."
  - "Pyridine from enal / dienal + NH3: 13C at dienal C5 -> pyridine C2 and 15N-NH3 -> ring N (Zhou & Boatright 2000); amide-15N share of the ring N (Kim 1996b); D2O deuterium counts (Zamora 2020)."
  - "Imidazole from glyoxal + amine: 1,3-disubstituted imidazole + formic acid by NMR / ESI-MS, odd ring carbon from a SECOND glyoxal (no 3-R products), with a stoichiometry on amine loss (De Haan 2009); pathway shares of dicarbonyl loss by NMR (Sedehi 2013)."
