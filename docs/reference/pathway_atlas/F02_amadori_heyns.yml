    status: operating
    quote: "ARP accounts for ~100 % of glucose lost at ≤ 1 h"
    quantity: "ARP 8.5 % of glucose at 1 h, 21.3 % at 5 h (0.4 M Glc / Gly, start pH 5.6, no phosphate; Fig. 1, read +-1.5 %)"
    evidence: mass_balance
    lab: "Unilever Vlaardingen (Potman & van Wijk)"
    dossiers: [potman1989_extraction.md]
