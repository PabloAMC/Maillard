# Pathway-condition atlas: F02 (Amadori rearrangement of aldose-amine adducts; Heyns rearrangement of ketose-amine
# adducts), built 2026-11-01 from the extraction dossiers (data/lit/extraction_dossiers/). Vocabulary:
# docs/reference/pathway_atlas/families.yml. Every quote is verbatim from the FIRST dossier listed in its cell.
# Laboratories (independent): Wageningen (Martins / van Boekel; Brands), Unilever Vlaardingen (Potman & van Wijk),
# Rutgers (Ge & Lee), Nestle (Davidek / Blank), Jiangnan (Zhang X / Cui / Ho: Xia 2022, Tang 2019, Zhou 2025b are ONE
# laboratory), Winterswijk hospital (Weykamp), Reading (Parker: Piornos 2025), Hacettepe (Goekmen).
# Duplicates: the pH 6.8 column of Martins 2005b Table 2 = its Table 1 'pH drop <= 1' column = its Table 4 '1:1'
# column (martins2005b_extraction.md); counted once. Martins 2003 Part I / Part II replot one experiment (F03 file).
# Formation of the Amadori compound from sugar + amine is recorded here; its DECOMPOSITION products are in F03 (amine
# release / reversion) and F06 / F07 / F10 (deoxyosones, retro-aldol). Protein-bound lysine glycation is F05; the
# protein cells below are only the Heyns / Amadori contrast. Cysteine -> Cys-Amadori via the thiazolidine is F04.
# ph key "not_stated" is outside the bins on purpose (as in F04).

family: F02_amadori_heyns
definition: "Amadori (aldose) / Heyns (ketose) rearrangement"
markers:
  - "the Amadori compound (N-(1-deoxy-ketos-1-yl)-amine) quantified against a purified standard (HPAEC-PAD, HPLC-ELSD, LC-MS/MS MRM), rising from sugar + amine; for protein-bound lysine, furosine after acid hydrolysis"
  - "the Heyns compound (2-amino-2-deoxy-aldose) from a ketose + amine, quantified (for protein: CML after periodate oxidation); its ABSENCE from a fructose pot whose method could see it is a marker result"
  - "mass balance: Amadori compound formed ~= sugar consumed at early times (no other sink yet)"
  - "fed intermediate: the purified Amadori compound gives the same downstream products as sugar + amine, at equal or higher yield per mol"
  - "NOT a marker: net amine or sugar loss alone (lumps F01 + F02), browning, or a fitted 'Amadori' / 'Heyns' pool in a multiresponse model with no measured ARP"

