condition_dependence: >-
  SHOWN: the Amadori compound is the first stable product of aldose + primary amine in water at 37-130 C, and at early
  times it carries essentially all the sugar consumed (Potman, mass balance, 100 C; Tang, > 96 % mass balance under
  dehydration, 80 C). Temperature: four labs give barriers for the lumped condensation + rearrangement of 83-97 kJ/mol
  (Martins 96.8, Xia 84.8, Zhou 2025b pentose 83.1; Tang GX formation 96.0) and Ge's rearrangement step alone ~145
  (recomputed, disputed method). pH: formation rises with pH, ~0.5 decade per pH unit over 4.8-7.5 at 100 C (Martins
  2005b, label pH, phosphate) and steeply above pH 8 at 80 C (Ge, buffer-confounded); GSH-xylose loss under dehydration
  only x1.65 from pH 5.4 to 9.4 (Tang). Amine: peptides form their Amadori compounds faster than glycine (TriGly 5-7x,
  Xia, one lab). Buffer: phosphate speeds both formation and breakdown, so the standing Amadori level is LOWER in
  phosphate (Potman; and F03 cells). Water: removing water while heating raises the GSH-xylose ARP yield ~8x (Tang,
  a_w unmeasured); real low-moisture matrices (malt, hazelnut) contain Amadori compounds but give no clean rate. Heyns:
  fructose + casein shows no detectable Heyns product while losing as much lysine as glucose (Brands; not_detected, no detection limit), and in
  hazelnut the fitted Heyns route is ~5x slower than Amadori (unmeasured pools). The ketose-amine adduct therefore does
  NOT accumulate as a Heyns compound in the conditions studied; fructose's amine loss goes elsewhere. ASSUMED, not shown:
  any O2 effect on formation (no contrast); in-situ pH during formation (every pH axis above is a label pH).
best_supported_regimes:
  - "neutral to mild acid / 80-130 C / dilute / glucose + glycine: operating, Ea ~85-97 kJ/mol, ~0.5 dec / pH (3 labs: Wageningen, Jiangnan, Unilever; mass balance + measured ARP)"
  - "early times in any aqueous aldose + amine pot: the Amadori compound carries ~all sugar consumed (2 labs, mass balance)"
  - "fructose + protein lysine / neutral / 120 C: Heyns compound not detected (1 lab; no detection limit or positive control, so not shown absent)"
unknown_regimes:
  - "acid (< 4.5): no Amadori formation rate (Ge's pH 2-4 points are below resolution; Martins starts at 4.8)"
  - "very high T (> 140 C) in water: no measured ARP formation rate"
  - "intermediate a_w with a measured a_w: none (Tang's dehydration and the malt / hazelnut matrices have no a_w record)"
  - "Heyns compound measured in any free-amino-acid fructose pot: none in the corpus; the Heyns side is only fitted (Knol 2010 bypasses it, Goncuoglu fits it) or not detected (Brands)"
  - "pentose + glycine Amadori FORMATION kinetics in water: only Zhou 2025b (alanine, concentration and pH unstated) and Tang (GSH); the glycine-xylose ARP is always fed purified"
  - "O2 / inert contrast and metal chelation for formation: none"
  - "phosphate concentration law for FORMATION at fixed pH with the ARP measured: none (Potman's phosphate arms have no ARP numbers)"
competing_families:
  - "F01_schiff_glycosylamine: the Schiff base reverts faster than it rearranges (Weykamp 37 C ~100x; Ge 68-97 C 2-3x)"
  - "F04_thiazolidine_ttca: with cysteine the sugar is held as TTCA; the Cys-Amadori compound forms from it"
  - "F14_caramelisation_amine_free: fructose loses as much amine as glucose without a Heyns compound (Brands), so ketose chemistry may run through sugar fragments rather than a Heyns rearrangement"
  - "F29_acrylamide: with asparagine the Schiff base decarboxylates before rearranging"
engine: >-
  In the engine (engine_family_map.yml): r_amadori (SB -> AMA) in trunk, sulfur and acrylamide lanes, shipped, its constant
  DERIVED from k_schiff by a pinned 44.9x ratio; the sulfur lane's fed ARP is a species (ARP) with no formation step from
  xylose + glycine in the shipped engine (r_pent_amine -> PAMA exists but PENTOSE_AMINE_ENTRY is disabled); the
  Cys-Amadori route (r_cama_form) is disabled. Mismatches: (1) no Heyns step: fructose has no amine reaction in the trunk,
  which agrees with Brands' Heyns non-detect but leaves fructose's measured amine loss unmodelled. (2) No pH term on the
  formation (Martins 2005b pD 0.50 for exactly this step, and Ge's steep rise above pH 8) while the engine applies pH only
  to the three Amadori-decay steps. (3) No phosphate term on formation or on breakdown (Potman, Davidek, Zyzak, Guan all
  show phosphate catalysis). (4) Glycine only: peptides form their ARP 5-7x faster (Xia) and other amino acids differ;
  the engine has one amine. (5) Shipped Ea 96.8 (Martins) vs 84.8 (Xia, same pot design, water instead of phosphate):
  a 12 kJ/mol spread across two labs, inside the band one would expect from buffer and pH drift, not a demonstrated
  conflict. (6) The a_w multiplier on k_schiff rises to ~3.7x at a_w 0.4-0.7 (milk-powder lysine loss); Tang's
  dehydration shows the direction (x8 ARP yield), no source on disk gives a free-amine a_w law.
