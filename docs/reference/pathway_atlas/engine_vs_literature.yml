settling_experiments:
- id: E1
  experiment: 1:1 [13C6] / [12C6]-glucose + Cys, 120 C, pH 5 and 6.5, time-resolved, with a ribose arm and fed 1-DG + H2S. Or the BTBU / CAAS authors' MFT yields per glucose consumed
  decides: the hexose C5 rate and its share vs pentose (sets the band)
- id: E2
  experiment: o-phenylenediamine in-situ trap on a PENTOSE amino-acid ARP (xylose-Gly) at pH 4.5 / 6 / 7.5 in water vs 0.1 M phosphate, 100 - 120 C
  decides: the pentose split law and its buffer dependence (no in-situ pentose trap exists)
- id: E3
  experiment: fed MGO / 3-DG / glucosone + Leu, Ile, Phe at 100 - 120 C, pH 5 - 7, pH-stat, argon vs air, with SIDA aldehyde AND the aminoketone in one pot. Or DFA's raw Table 4 / Fig.
    4 numbers and Quest's SDE recovery (CF-073)
  decides: the donor set, the step pH law, the 20x magnitude conflict
- id: E4
  experiment: same pot as E3, adding 2,5-DMP, pH-stat 4 / 5 / 6 / 7, dilute (Ghent was ~0.85 M)
  decides: whether the below-7 slope belongs to the step or to the supply
- id: E5
  experiment: xylose + Gly and glucose + Gly at fixed in-situ pH 6.0, phosphate 0 / 0.05 / 0.2 M vs citrate, measuring Amadori decay, 1-DG / 3-DG trap, MFT (+Cys)
  decides: the buffer factor's form and saturation (CF-011, designed experiment E4)
- id: E6
  experiment: the Cerny pot D design at 120 and 145 C (fed unlabelled NF vs [13C5]ribose, equimolar), plus 2-mercapto-3-pentanone. Or Cerny's raw 145 C isotopologue data
  decides: the free-NF share at process T (unknown above 95 C)
- id: E7
  experiment: 'Cys + ribose, pH 5.5, 120 C: buffer vs buffer + fresh oil vs + oxidised oil (PV series) vs + hexanal / 2,4-decadienal dosed, with MFT, FFT, H2S and the aldehydes'
  decides: chemical capture vs physical partition (Yiltirak is the only separation, one pH)
- id: E8
  experiment: ribose + Cys, pH-stat 4.5 / 5.5 / 6.5 at 140 C, time-resolved furfural, FFT, furfuryl alcohol, 3-DP (OPD), MFT
  decides: the supply law vs the step law (Meynier is one time point)
- id: E9
  experiment: '[13C6]-glucose vs fructose + [15N]-Asn, competition pots, phosphate vs citrate at equal in-situ pH'
  decides: carbonyl shares and the buffer factor (no labelling on disk)
- id: E10
  experiment: dilute (10 mM) Cys + xylose formation time course, pH-stat 4.5 / 5.5 / 6.5, phosphate 0 vs 0.2 M, with TTCA + free Cys (CF-076 / CF-011)
  decides: K(pH), k_r, catalysis
- id: E11
  experiment: one pentose + Cys pot at 100 / 120 / 140 / 160 C with the route markers (2-mercapto-3-pentanone, 1:1 label)
  decides: per-route barriers
- id: E12
  experiment: labelled MFT spiked mid-cook, Cys 0 - 150 mM, argon vs air, 110 - 140 C, with the disulfide measured (cluster 4 E3)
  decides: the loss law, O2 and reversibility at process T
- id: E13 - E14
  experiment: fed GO + MGO + Ala dilute, pH-stat, 100 - 130 C, with PZ / MPZ / DMP and the pyrrole. Or Zhou 2024 SI ([M-H]+ correction)
  decides: the cross-pair R, the extra MPZ route, the pyrrole sink at dilute concentration
- id: E15
  experiment: DFA's fed ARP-Phe pot in a second lab, at 120 C, argon / air / chelator
  decides: the O2 route's existence above 100 C
