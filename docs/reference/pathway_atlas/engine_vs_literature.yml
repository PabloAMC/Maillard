ranking:
- rank: 1
  id: E1 (F23-a / F24-a)
  error_and_minimum_structure: 'Hexose MFT has no intact-C5 route. Glucose + Cys gives ~0 MFT (ribose / glucose 4e10 vs 10.4 measured); what little there is runs 100 % through C2 + C3,
    which labelling shows carries <= 1 - 6 %. Fix: enable the existing hexose -> C5 entry (r_odg_dpo, 1-DG -> 1-DPO + C1) with a declared band anchored on Hofmann T1 (ribose / glucose
    MFT 10.4x) and the labelled C5 pattern; bound C2 + C3 <= 6 % of MFT'
  score_ExOxR: 3x3x3 = 27
  confidence: H
  effective_score: '27'
  status: V *p*
  implement: band-now (HEXOSE_C5_ENTRY exists)
- rank: 2
  id: E2 (F06-a, F06-c)
  error_and_minimum_structure: 'The hexose 1,2- vs 2,3-enolisation split cannot move with pH, and the sulfur lane''s trunk steps get no pH at all. Fix: per-step Martins exponents (k4
    ~0.35, k7 ~0.60 dec / pH; the code''s own Table 3 slopes 0.37 / 0.92 / 0.72) in place of the pooled 0.69. In the sulfur lane, apply them at in-situ pH (TRUNK_PH_TERMS)'
  score_ExOxR: 3x2x3 = 18
  confidence: H
  effective_score: '18'
  status: V
  implement: band-now (per-step exponents in trunk_conditions; TRUNK_PH_TERMS exists)
- rank: 3
  id: E3 (F16-a, -b)
  error_and_minimum_structure: 'No Strecker-aldehyde lane. 3-methylbutanal, 2-methylbutanal, PA and methional are not shipped; donors are GO / MGO only. Fix: a per-amino-acid aldehyde
    product on the existing dicarbonyl + amino-acid steps, with 3-DG / glucosone donors at 0.7 - 0.8x MGO (DFA argon), and a declared x20 magnitude band for CF-073'
  score_ExOxR: 2x3x3 = 18
  confidence: H
  effective_score: '18'
  status: V
  implement: A3 (new species and amine axis)
- rank: 4
  id: E4 (F16-c / F19)
  error_and_minimum_structure: 'The pyrazine-cascade pH law sits on the Strecker STEP (x0.091 at pH 5), against fed-dicarbonyl Strecker peaking near pH 5 and fed MGO + Ala pyrazine x2.1
    higher at pH 4. Fix: move the below-7 slope to the supply / condensation; the step gets <= 0.07 dec / pH, as the Strecker prereg allows'
  score_ExOxR: 2x3x3 = 18
  confidence: H
  effective_score: '18'
  status: V
  implement: band-now (PYRAZINE_PH_SLOPES are parameters)
- rank: 5
  id: E5 (F01-b / F03-b / F13-b / F14-a / F19-c / F23-c / F29-b)
  error_and_minimum_structure: 'No buffer-species catalysis anywhere, while phosphate accelerates Amadori decay, condensation, amine-free degradation, HDMF, the MFT branch, acrylamide
    and pyrazines 1.3 - 12x (>= 7 labs). The constants were measured in phosphate, so unbuffered and citrate foods are mis-scaled. Fix: a buffer-anion factor on the Amadori-decay and
    enolisation steps (saturating, fading at pH 8)'
  score_ExOxR: 3x2x3 = 18
  confidence: H
  effective_score: '18'
  status: V
  implement: 'A3 (new axis); interim: a declared transfer band on phosphate-calibrated constants in non-phosphate pots'
- rank: 6
  id: E6 (F23-b)
  error_and_minimum_structure: 'MFT runs 99.9 % through free norfuraneol (measured 7 %; NF a poor source in 3 labs). Fix: re-weight k_ddp_mft vs k_nf_mft under a fit constraint NF share
    <= 0.15 at 95 C, pH 5 (Cerny pot D)'
  score_ExOxR: 3x3x2 = 18
  confidence: H
