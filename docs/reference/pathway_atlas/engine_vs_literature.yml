# Engine vs literature (2026-11-01): machine-readable twin of ENGINE_VS_LITERATURE.md. Generated from that file plus the
# red-team-filtered atlas classification (scratchpad scripts rebin.py / classify2.py / mkyaml.py); regimes keyed "ph|T|water".

schema: engine_vs_literature/v1
date: '2026-11-01'
companion: docs/reference/pathway_atlas/ENGINE_VS_LITERATURE.md
inputs:
- docs/reference/pathway_atlas/F*.yml (561 cells, 10 excluded)
- families.yml
- engine_family_map.yml
- tasks/overnight_log_2026-11-01.md (leads)
- docs/reference/conflicts_register.yml
red_team_rules:
  excluded_cells:
  - F02#12
  - F07#14
  - F10#0
  - F23#15
  - F24#13
  - F25#6
  - F25#7
  - F29#4
  - F30#15
  - F31#3
  temperature_rebinned_from_T_C: low <= 60, moderate <= 100, high <= 140, very_high > 140 C (range midpoint); 48 cells moved
  absent_without_lod: read as not_detected (14 cells); M2 on such cells is a lead
  dominant_weighting: only labelling / fed flux; F25 dominant outside Cerny's fed-furfural pot, F31 dominant, F30 quantities treated as operating
  high_confidence_basis: labelling / fed cells of F23/F24, F16/F17, F19, F01-F06; else lower
  F23_F24_water_bins: unreliable
classification_rule:
  settled: '>= 2 independent labs (lab map below) with labelling / fed_intermediate / trapping / within_study_factor, same direction class ({dominant, operating} vs {minor, absent-with-LOD})'
  unsettled: single lab, mixed / conflicting, or weaker evidence kinds only
  unknown: no cell
  grid: 4 pH x 4 T x 4 water = 64 bins per family, 2048 total
counts:
  grid_bins: 2048
  settled: 31
  unsettled: 217
  unknown: 1800
  offgrid_bins_with_unreported_axis: 41
  offgrid_settled: 3
