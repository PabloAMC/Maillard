  status: V *p*
  implement: band-now (fit constraint, no switch)
- rank: 7
  id: E7 (F30-a / F28-d / F26-c)
  error_and_minimum_structure: 'The lipid lane is a direct sum: the engine predicts no MFT / FFT change with lipid, vs 3 - 143x suppression (x10 from an oil phase alone) and the reverse
    removal of enals. Fix: a lipid-carbonyl + H2S / thiol capture and an oil-phase partition, jointly integrated'
