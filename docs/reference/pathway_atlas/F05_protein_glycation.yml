condition_dependence: >-
  SHOWN. (1) Glycation of protein-bound lysine runs in every regime looked at, from 37 C (Zyzak, Thornalley) through
  85-140 C in water (Brands, Nguyen, Tang, Hamzalioglu) to 160-220 C dry roasts (Berk, Sen, Ramirez-Jimenez): eight
  laboratories, all on furosine and / or available-lysine markers; no study looked for it and failed to find it.
  (2) pH: one within-study contrast only, Brands 2002c, glycation x2.25 slower at initial pH 5.9 than 6.8 (~0.4 dex /
  pH, 120 C, casein); nothing below pH 5.9 or above 7.4. (3) Temperature in water: Brands 2002c Ea 97 +/- 3 kJ/mol
  over 90-130 C (five temperatures); Hamzalioglu 2026 52 +/- 19 (milk, 110-140 C, four temperatures); Nguyen 2016
  Q10 ~1.1 (two temperatures, called apparent); in dry seeds the glycation step is not temperature-resolved (Berk Ea
  -122, R2 0.65). Available-lysine loss in milk powder: Ea 121-135 (Pereyra, 37-60 C). The barrier is uncertain by
  ~2x between laboratories. (4) Water: in powders the rate is flat over a_w 0.31-0.71 and ~4x lower at 0.98 (milk
  powder, no humectant); with glycerol a maximum at a_w ~0.5 and loss still 69-71 % at a_w 0.14-0.39 (Warmbier); a
  glass (a_w 0.33 at 37 C, just above Tg) cuts it 56x (Pereyra). Dry heating glycates soy / pea protein much more
  than wet heating per unit time-temperature (Tang). (5) Sugar: lactose = glucose within HPD on casein (Nguyen);
  fructose removes lysine as fast as glucose but through fragments, with no Heyns compound (Brands). (6) Protein
  identity changes the extent and even the ordering (pea vs soy flips between wet and dry, Tang). (7) Phosphate
  speeds bound-Amadori decay x3.8 from 10 to 200 mM at 37 C (Zyzak, collagen); untested at process temperature.
  (8) Downstream: CML from the Amadori compound is the fitted route in aqueous casein, milk and sesame (Nguyen,
  Hamzalioglu, Berk), but the same Hacettepe network gives a nonzero GO + bound-Lys route in three of five roasted
  seeds (Sen 2022); CEL from the Amadori compound in aqueous casein (Nguyen) vs from MGO + bound lysine in sesame
  (Berk) and milk at 110 C (Hamzalioglu k12). All route statements are model discrimination (kinetic_fit); no
  labelling on disk. ASSUMED (not shown): that one per-amine constant transfers between casein, whey and globular
  plant proteins (the matrix review's ~1.9x casein-Lys / glycine ratio is a derived same-lab comparison,
  docs/history/mechanism_reviews_2026-10-31/matrix.md); that the bound Amadori compound returns its lysine (Brands
  2002c, Berk, Hamzalioglu networks: yes; Nguyen: no; CF-072).
best_supported_regimes:
  - "neutral / high T / dilute / hexose or lactose + casein-bound Lys, phosphate or milk salts: operating (2 lab families: Wageningen FQD x3 papers, Hacettepe; kinetic_fit + furosine / SIDA lysine; one fed-intermediate result)"
  - "not_measured pH / low T / intermediate a_w / powders (casein-glucose-glycerol, skim milk powder, pea / soy + glucose): operating (3 labs: Minnesota, Buenos Aires, Wageningen; available-lysine loss, within-study a_w contrasts)"
  - "not_measured pH / very high T / low a_w / sucrose + seed protein (dry roasts): operating (1 lab, Hacettepe, two papers that disagree on the CML route)"
unknown_regimes:
  - "acid and mild acid below pH 5.9 (no protein-glycation study on disk below the Brands initial-pH-5.9 arm)"
  - "alkaline (> 7.5)"
  - "pentose + protein-bound lysine (no study on disk; ribose / xylose are the savoury-flavour sugars)"
  - "cysteine-containing pots with protein (does added Cys compete with bound Lys for the sugar?)"
  - "pea / soy isolate glycation KINETICS at cooking temperature (Tang gives two end points; Troise one soybean time course); no rate constant for a plant protein"
  - "in-situ pH in any real-food / powder / roast study (none measured)"
  - "high T (100-140 C) at intermediate a_w with a measured a_w (Troise's soybean is the only near case, a_w unmeasured)"
  - "inert vs air at process temperature (only Zyzak at 37 C contrasts N2 + chelators vs air, on a model Amadori compound)"
  - "phosphate vs non-phosphate buffer at process temperature (Zyzak / Thornalley are 37 C only)"
  - "route discrimination by labelling (no 13C / 15N study of CML or CEL origin on protein in the corpus)"
competing_families:
  - "F01_schiff_glycosylamine / F02_amadori_heyns with FREE amino acids for the same sugar: bound Lys is ~60 mmol/kg vs ~1 mmol/kg free amino acids in a 16 % pea product, so bound Lys should take most of the sugar-amine flux there (derived, matrix review); in dilute free-amino-acid pots it is absent"
  - "F14_caramelisation_amine_free for the sugar: casein did not change net glucose loss at 120 C over 40 min (Brands 2001); with fructose the fragments, not the sugar, glycate"
  - "F10_retroaldol_c3_c2 / F08_oxidative_osone supply GO / MGO that bound Lys traps as CML / CEL (Berk, Sen, Hamzalioglu k12; Lo 1994 for MGO + BSA at 37 C, not carded here)"
  - "F03_amadori_reversion: reversion of the bound Amadori compound to sugar + lysine is seen at 37 C (collagen hexoses ~17 %, Zyzak) but not at 120 C (no sugars from fed glycated casein, Brands 2001)"
  - "F28_thiol_losses / F31_melanoidins: protein-bound Amadori compounds feed the protein-bound melanoidin (Brands 2001 Fig. 4) and compete for carbonyls with thiol capture"
engine: >-
  In the engine as Build Wave B20 (src/kinetic_core/network.py GLYCATION_REACTIONS; parameters_glycation.py):
  r_glc_lysp (Glc + LYSP -> FLP, k_glyc), r_flp_cml (FLP -> CML), r_flp_cel (FLP -> CEL, lumped via MGO), r_flp_decay
  (FLP -> TDG + LYSP), r_cml_loss (CML -> melanoidin pools). All five constants are fitted to Nguyen 2016 M1 only
  (one lab family, 120 / 130 C). MISMATCHES with the literature cells: (a) CF-072: r_flp_decay returns LYSP with a
  constant fitted to Nguyen's lysine-NOT-returned network. Note the structural evidence is split: Brands 2002c,
  Berk 2021 and Hamzalioglu 2026 networks DO return lysine on the Amadori -> dicarbonyl steps, Nguyen does not;
  so the engine's structure has support but its constant does not (refit against Brands / Nguyen time courses, not
  Nguyen's k8). (b) Sugar: only glucose glycates LYSP; lactose (Nguyen M2, Hamzalioglu milk) and sucrose-derived
  glucose (Berk, Sen) are outside it; there is no fructose + LYSP step, which matches Brands (k10 -> 0) but the
  fragment + LYSP route that carries fructose's lysine loss (Brands k13) is absent. (c) pH: k_glyc and k_flp_decay
  carry no pH term (trunk_conditions PH_STEPS covers only the free-amine k_ama_* steps; rate_transfer
  licensed_at_measurement_ph_only) while Brands 2002c shows x2.25 per 0.9 pH on glycation and x4.4 on Amadori decay.
  (d) Water: AW_STEPS = (k_schiff,) only, so glycation of protein has no a_w term although the a_w evidence (Pereyra,
  Warmbier, Tang) is all protein-bound lysine. (e) Temperature: k_glyc Ea declared 96.8 kJ/mol (Martins k_schiff),
  close to Brands' 97 +/- 3 for casein; Hamzalioglu's 52 +/- 19 (milk) and the lysine-loss 121-135 (powder) bracket it.
  (f) CML route: GO -> CML not written, consistent with Nguyen / Berk / Hamzalioglu, contradicted in three of five
  matrices by Sen 2022 (same lab as Berk). CEL route: engine lumps FLP -> CEL (Nguyen); Berk and Hamzalioglu
  (110 C) prefer MGO + bound Lys, so the engine's CEL does not respond to the MGO pool. (g) No phosphate
  catalysis of bound-Amadori decay (Zyzak x3.8 at 37 C; untested hot). (h) The CML loss k_cml_loss is declared
  flat (Nguyen's k11 falls with temperature); no other lab measures a CML sink (Berk omits it; Hamzalioglu k22
  Ea 43 +/- 23).
