# Pathway-condition atlas, family F05 (written 2026-11-01 by an atlas agent; literature side only, nothing fitted).
# Vocabulary: docs/reference/pathway_atlas/families.yml. Every cell quotes its dossier verbatim (<= 15 words).
# Deviation from the bins, flagged: where a study did not measure pH (real foods, dry roasts, powders) the ph key is
# `not_measured` rather than a bin, so no cell is placed on an inferred pH. Tags use `not_stated` where the paper is silent.
family: F05_protein_glycation
definition: "glycation of protein-bound lysine (fructoselysine, CML / CEL)"
markers:
  - "loss of REACTIVE (OPA / FDNB-available) lysine of a protein with no free amine present, sugar-dependent (a sugar-free or ketose control shows it is not hydrolysis or crosslinking alone)"
  - "furosine (acid-hydrolysis product of protein-bound fructosyl- / lactulosyl-lysine) rising: the bound Amadori compound itself; a rise-then-fall marks its consumption"
  - "CML / CEL measured on the protein hydrolysate AFTER NaBH4 reduction (without it, fructosyl-lysine converts partly to CML in hot HCl: an analytical route, not a reaction route)"
  - "route inside F05: model discrimination between Amadori -> CML / CEL and GO / MGO + bound lysine -> CML / CEL (a constant fitted to zero); weak (kinetic_fit), no labelling exists on disk"
  - "fed pre-glycated protein (isolated glycated casein / collagen) heated alone: its products (acids, sugars, regenerated lysine) are the bound Amadori compound's fate"
  - "glycated-peptide mass shifts on Lys (+162 hexose, +58 CML, +72 CEL) after digestion"
cells:
