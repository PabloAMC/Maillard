condition_dependence: >-
  SHOWN: (1) Furfural is made from the intact pentose C5 (two labs by labelling: Firmenich at pH 5 / 145 C, Jiangnan at
  initial pH 8 / 120 C) and a fed 3-deoxypentosone out-performs ribose x10 (Garching, via FFT). (2) pH: furfural falls
  steeply with pH from 4.5 to 6.5-7 in amino-acid + pentose pots at 140-145 C (Reading > 39 to > 1500x; Firmenich gone at
  pH >= 6, standing pool) and HMF falls x15-25 from pH 3 to 5 at 70 C (Naim); at pH 7 / 100 C furfural and HMF are
  small exits of a large deoxyosone pool (Garching: furfural 0.06 mol % vs 3-DP 1 mol %). (3) Furanones run the other
  way on the acid side: norfuraneol rises from pH 5.5 to a pH 6.5 maximum at 100 C (Murata, two papers) and furaneol rises
  x60 from pH 3 to 5 at 70 C (Naim); but at 140 C / 1 h norfuraneol FALLS from pH 4.5 to 6.5 in all four Reading pots -
  the net level is formation minus a strongly base-catalysed decay (Mikami pH 8 k = 0.032 /min at 100 C), so the pH
  optimum moves with temperature and time (not registered as a CF; candidate). (4) Amine: free pentose alone gives no
  norfuraneol at 140 C (Reading) and no HDMF at 90 C (Nestle), while furfural from free ribose is amine-independent and
  pH-flat (F14 cell). (5) Buffer: phosphate x4.3 over malonate for HDMF (Nestle). (6) HMF in a dry amine-free glucose
  melt comes mainly from the fructose cyclic route, not 3-DG (Hacettepe, model discrimination). (7) Temperature: net
  furfural from glucose + cysteine has an apparent Ea ~150 kJ/mol (Minnesota). ASSUMED: furfural from pentose goes
  through the 3-deoxypentosone in aqueous Maillard pots (the label shows an intact skeleton, the fed 3-DP shows
  competence; neither shows the share).
best_supported_regimes:
  - "mild_acid (pH 4-5.5) / 140-145 C / pentose + amino acid, phosphate or pyrophosphate: furfural operating-dominant (labelling Firmenich; pH contrast Reading)"
  - "neutral (pH 6-7) / 100 C / dilute pentose + lysine, phosphate: norfuraneol operating, 4-22 mol % (one lab, two papers)"
  - "acid (pH 3) / 70 C / glucose + arginine: HMF operating, 1.3 mol % in 48 h (one lab)"
unknown_regimes:
  - "the 3-DP -> furfural SHARE of the 3-DP pool vs pH (no fed-3-DP pH ladder; no 3-DP-trap suppression test)"
  - "norfuraneol formation separated from its decay at 120-145 C (only net levels; no label on NF formation)"
  - "maltol (disaccharide 1-deoxyosone): nothing on disk"
  - "intermediate_aw: none; low_aw only for HMF in an amine-free melt"
  - "alkaline (> 7.5) furfural with an in-situ pH: Zhou's pots start at pH 8 unbuffered and drift down"
  - "protein-bound amine: none"
competing_families:
  - "F10_retroaldol_c3_c2: the 3-deoxyosone's retro-aldol to GO / MGO wins at higher pH (Zhou 2025b's reading of the pH-fall effect); furfural wins as pH falls"
  - "F11_beta_dicarbonyl_cleavage: competes for the 1-deoxyosone pool that makes norfuraneol / acetylformoin (DFG: acetic acid up to 0.64 mol/mol vs norfuraneol <= 16 mol % from pentose)"
  - "F25_fft_furfural_h2s and F23_mft_intact_c5: H2S consumes furfural and norfuraneol (standing furfural gone at pH 6 while FFT persists, Cerny 2007)"
  - "F14_caramelisation_amine_free: the amine-free furfural / HMF floor (pH-flat ribose furfural; fructose cyclic HMF)"
  - "F20_extra_pyrazine_routes / F16: Strecker aldehydes add C1 / C2 to pentose furanones (HDMF / EHMF, Blank 1997)"
engine: >-
  In the engine: furfural via r_tdp_fur (3-DP -> FUR, Ea 147 kJ/mol from Schirle-Keller 1992), r_glc_fur (hexose ->
  furfural, 'acid' pH factor), fed by r_pent_tdp / r_arp_tdp ('acid' factor) and r_pent_caramel / r_arp_tdp_thermal (no
  pH factor); furfural sink r_fur_decay (large, unidentified) and r_fur_fft. Norfuraneol via r_dpo_nf (no pH tag) with
  r_nf_decay (pH-free, ~700x slower than Mikami at pH 8) and r_nf_decay_oh (hydroxide-catalysed, B61, OFF by default).
  HMF via the two Kocadagli limbs (r_glc_tdg -> r_tdg_ddg -> r_ddg_hmf; r_fru_int -> r_int_hmf), matching the
  literature's two-limb topology; r_hmf_self is negligible at cooking temperature (declared gap). DMHF via r_odg_af /
  r_dpo_af -> r_af_dmhf and r_mgo_dmhf. MISMATCHES: (a) with B61 off, nothing makes norfuraneol fall at pH 8 (Mikami,
  Nakamura) or with pH at 140 C (Meynier); the engine's NF pH law is the DPO supply law only. (b) Furfural: a pH-free
  amine-free source (r_pent_caramel) puts a pH-flat floor under furfural, which is right for free ribose (Mottram 2002,
  pH 3.8-5.7) but may cap the > 1500x fall Meynier measures from pH 4.5 to 6.5 in the glycine pot - to be checked
  against the engine (CF-001's corrected pot). (c) No phosphate-vs-carboxylate factor (Blank 1997 x4.3 for HDMF).
  (d) The 3-DP -> furfural Ea (147) is a NET-accumulation Ea from a hexose + cysteine pot, applied to a pentose
  dehydration step.
