family: F13_furans_dehydration
definition: "deoxyosone dehydration -> furfural / HMF; 1-deoxyosone -> furanones (norfuraneol, furaneol), maltol"
# Built 2026-11-01 (pathway-atlas agent). Laboratories: Firmenich (Cerny 2007 / 2007b), Jiangnan (Zhou 2025b), DFA
# Garching (Hofmann 1998, Hofmann 1999), Reading (Meynier 1995, Mottram 2002), Murata Ochanomizu (Mikami 2017, Nakamura
# 2020 - one lab), Nestle Lausanne (Blank 1997), Hebrew University (Haleva 1999), Hacettepe (Kocadagli 2016), Reineccius
# Minnesota (Schirle-Keller 1992). Garrett 1969 (strong-acid pentose -> furfural) is filed under F14 (amine-free).
markers:
  - "Furfural / HMF carrying the INTACT sugar skeleton: all-or-none 13C5 (or 13C6) in a CAMOLA / labelled-sugar pot, no partially labelled isotopomers (cerny2007b, zhou2025b). This separates dehydration of an intact C5 / C6 unit from fragment recombination, but not 3-deoxyosone dehydration from other intact-skeleton dehydrations (cyclic fructose route for HMF)."
  - "Fed 3-deoxyosone gives more furfural-derived product than the sugar at equal charge (hofmann1998 Table 3, read through FFT)."
  - "HMF limb discrimination by multiresponse fit: 3-DG / 3,4-DG limb vs fructose cyclic-intermediate limb (kocadagli2016jafc; model test, not a label)."
  - "Norfuraneol (C5) and furaneol / HDMF (C6): formed only with an amine (or a phosphate-ester sugar), at near-neutral pH, from the 1-deoxyosone pool; the HDMF label pattern splits intact-C6 / C5 + Strecker-C1 (blank1996 / 1997; Strecker share via a Strecker-inactive amine, blank1997 Table 2)."
  - "In-situ OPD trapping that shows the 1-deoxypentosone carrying most of the xylose flux at the pH where norfuraneol forms (nakamura2020 Fig. 9)."
