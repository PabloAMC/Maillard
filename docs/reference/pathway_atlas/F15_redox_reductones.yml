condition_dependence: >-
  SHOWN (all single-laboratory or qualitative): (1) Strecker-coupled reduction: alpha-amino acids give more
  1,4-dideoxyosone than beta-alanine (Ledl; no numbers, temperature unstated). (2) Amine-free reductants exist: a mM
  reductone pool from pentoses in 0.1 M phosphate at pH 7.1 / 100 C (ribose > arabinose > xylose >> glucose; Rizzi) and
  < 1 mol % 1,4-dideoxyhexosulose from dry glucose at 100 C (Kroh). (3) Reduced products appear without added reductant:
  furfuryl alcohol rises with pH from 4.5 to 6.5 at 140 C while furfural falls (Reading), and approaches the furfural
  level at 120-150 C in glucose + cysteine (Minnesota); pyruvaldehyde disproportionates at 100 C (McGill). (4) A
  reductant raises H2S from cysteine in proportion to its charge (Tokyo). (5) The reductone norfuraneol is lost by an
  O2- and metal-dependent, base-accelerated route (Murata, two papers): fast at pH 8 / 100 C in air, stable at pH 6.
  NOT SHOWN: any reduction rate constant; the pH or temperature dependence of a reductant pool; the share of the
  1-deoxyosone that is reduced rather than cleaved (F11) or cyclised (F13); any pot that varies O2 and measures a
  reductant; the 1,4-dideoxypentosone as a measured MFT intermediate.
best_supported_regimes:
  - "neutral (pH 7.1) / 100 C / dilute pentose / 0.1 M phosphate / no amine / air: operating, mM reductone pool (one lab, measured pool)"
  - "mild acid -> neutral (4.5-6.5) / 140 C / pentose + amino acid / pyrophosphate: furfural reduction operating, rising with pH (one lab)"
  - "alkaline (pH 8) / 100 C / air: norfuraneol oxidative loss operating (one lab, two papers)"
unknown_regimes:
  - "everything quantitative at 120-145 C with an amine (the process regime): no reductant titre, no 1,4-dideoxyosone yield"
  - "acid (< 4.5): none"
  - "inert atmosphere: no reductant measured under argon"
  - "intermediate_aw: none"
  - "protein-bound amine: none"
  - "temperature dependence of the Strecker-coupled reduction: Nedvidek states no temperature"
competing_families:
  - "F11_beta_dicarbonyl_cleavage: the 1-deoxyosone is either cleaved (acetic acid, 0.8 mol/mol fed 1-DG at pH >= 6.5) or reduced (1,4-dideoxyosone, < 1 mol %): cleavage wins wherever both were measured"
  - "F16_strecker_aldehyde: the Strecker step on a 1-deoxyosone yields the reduced 1,4-dideoxyosone (Scheme 3); dicarbonyl Strecker donors otherwise give aminoketones"
  - "F12_alpha_oxidative_cleavage / F08: O2 consumes the reductones (to tricarbonyls, Voigt 2010 proposed; norfuraneol, Nakamura)"
  - "F23_mft_intact_c5: the 1,4-dideoxypentosone (DDP) as the proposed MFT precursor vs norfuraneol"
  - "F25_fft_furfural_h2s: furfural reduction to furfuryl alcohol competes with FFT for furfural"
engine: >-
  In the engine: r_dpo_ddp (DPO + Cys -> DDP + CO2 + fragments, 'base' pH factor) is the Strecker-coupled reduction,
  but ONLY with cysteine as the amino acid - Nedvidek's observation is generic to alpha-amino acids and absent with
  beta-alanine; glycine / alanine pots have no 1,4-dideoxyosone route. DDP feeds MFT (r_ddp_mft, r_ddp_mft_hs).
  ch_red_ox_dpo / ch_red_ox_nf treat DPO and NF as a 'reductone pool' that consumes O2 to inert FRAG_C (fitted,
  expected unidentified); r_af_dmhf reduces acetylformoin with no reductant; ch_dimer_release_mft reduces the disulfide
  with an untracked reductant (zero by default). MISMATCHES: (a) no reductant species or titre (Rizzi's mM pool from
  amine-free phosphate pentose is unrepresented; DPO stands in only as an O2 sink). (b) No furfural -> furfuryl alcohol
  step: the observed reduced pool (~furfural level, Schirle-Keller; rising with pH, Meynier) sits inside the
  unidentified r_fur_decay. (c) Norfuraneol loss: r_nf_decay_oh (B61, OFF by default) makes it hydroxide-catalysed and
  O2-independent, while Nakamura shows degassing or DTPA suppresses it; the measured 0.032 /min is an aerobic rate.
  ch_red_ox_nf carries the O2 dependence but is fitted, not anchored on Mikami / Nakamura. (d) MAA -> H2S + acetaldehyde
  needs a reductant (Kobayasi) that the engine does not supply.
