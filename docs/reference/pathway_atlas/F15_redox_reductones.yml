family: F15_redox_reductones
definition: "reductones / 1,4-dideoxyosones and redox coupling (incl. Strecker-coupled reduction)"
# Built 2026-11-01 (pathway-atlas agent). Laboratories: Ledl Stuttgart (Nedvidek 1992), Kroh TU Berlin (Hollnagel 2000),
# Rizzi (Miami University, 2010), McGill (Yaylayan; Huyghues-Despointes 1996), University of Tokyo (Kobayasi 1965),
# Minnesota (Reineccius; Schirle-Keller 1992), Reading (Meynier 1995), Murata Ochanomizu (Mikami 2017, Nakamura 2020 - one
# lab), Nestle Lausanne (Cerny & Davidek 2003). Every redox claim on disk is qualitative or a pool size; no reduction RATE
# for any acceptor (MAA, furfural, acetylformoin, 1-deoxyosone) is measured anywhere.
markers:
  - "1,4-dideoxyosone (quinoxaline of 1,4-dideoxypentosone / -hexosone) formed in higher amount with an alpha-amino acid than with beta-alanine at the same sugar (Strecker-coupled reduction of the 1-deoxyosone; nedvidek1992)."
  - "A titratable 2-electron reductant pool (DCIP, ascorbic-acid equivalents) and its tentative identity (the 1-deoxy-2,3-osone; rizzi2010)."
  - "Reduced products with no added reductant: furfuryl alcohol (furfural + 2H), 1,2-propanediol (MGO + 2H), HDMF from acetylformoin; and H2S from a C-S reductive cleavage that scales with an enaminol reductant (kobayasi1965)."
  - "Carbon pattern of a 1,4-dideoxyosone in its products (ribose C-1 as the MFT 2-methyl; cerny2003 / cerny2004) - consistent with, not proof of, the route."
  - "O2 / chelator dependence of a reductone's loss (degassing or DTPA suppresses it; nakamura2020)."
