    verdict: partial
    conclusion: "Acetic acid transfers (Martins 2005b hold-out 5 / 5); formic acid does not (1 / 4); leave-one-lab-out fails (1 / 10 cells); nothing ships."
    follow_up: "Formic exit to the literature; acid amounts across pH as fit data (done later via Davidek, EX-013)."
