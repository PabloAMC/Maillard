# EXPERIMENT REGISTER (2026-10-31; owner: "are we logging the experiments we did, the hypothesis, results and
# conclusions, in case we want to revisit them in the future?").
#
# One entry per experiment -- a fit arm, a probe, a diagnosis, a literature search -- so that "did we ever test X,
# and what did it say?" is a lookup. The full reasoning lives in the design document each entry links; the numbers
# live in the artifacts, pinned by the commit that wrote them (a superseded run survives at its commit).
# Fields: id, date, kind (fit | probe | diagnosis | literature | review), question, hypothesis, design (document and
# section), expected (as pre-registered, with P where one was written), artifacts, commit, verdict
# (supported | rejected | partial | inconclusive | superseded | pending), conclusion, follow_up.
# Earlier waves (B1-B64) are recorded in tasks/data_restructure_plan.md sec. 7 and docs/history/; this register
# starts with Phase 2's sub-models (2026-10-29).
# Checked by scripts/ci/experiment_register_gate.py (every fit / probe / diagnosis / signature artifact in
# results/validation must appear in some entry's artifacts).
entries:
