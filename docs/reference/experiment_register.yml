# EXPERIMENT REGISTER (2026-10-31; owner: "are we logging the experiments we did, the hypothesis, results and
# conclusions, in case we want to revisit them in the future?").
#
# One entry per experiment -- a fit arm, a probe, a diagnosis, a literature search -- so that "did we ever test X,
# and what did it say?" is a lookup. The full reasoning lives in the design document each entry links; the numbers
# live in the artifacts, pinned by the commit that wrote them (a superseded run survives at its commit).
# Fields: id, date, kind (fit | probe | diagnosis | literature | review), question, hypothesis, design (document and
# section), expected (as pre-registered, with P where one was written), artifacts, commit, verdict
# (supported | rejected | partial | inconclusive | superseded | pending), conclusion, follow_up.
# Earlier waves (B1-B64) are recorded in tasks/data_restructure_plan.md sec. 7 and docs/history/; this register
# starts with Phase 2's sub-models (2026-10-29).
# Checked by scripts/ci/experiment_register_gate.py (every fit / probe / diagnosis / signature artifact in
# results/validation must appear in some entry's artifacts).
entries:
  - id: EX-001
    date: "2026-10-29"
    kind: fit
    question: "Do the acid sinks and exits fitted on Martins' glucose data transfer to other laboratories (sub-model 1, arm A)?"
    hypothesis: "The acetic-acid sink is ~5x smaller than shipped and the formic exit is pH-independent."
    design: "results/validation/kinetic_core_ph_acid_submodel_prereg.md secs. 3-5"
    expected: "Done-tests on raw residuals; leave-one-lab-out within 0.30 per data set x observable."
    artifacts: [results/validation/kinetic_core_ph_acid_submodel_fit_A.md, results/validation/kinetic_core_ph_acid_submodel_fit_A.json]
    commit: 23efd67
    verdict: partial
    conclusion: "Acetic acid transfers (Martins 2005b hold-out 5 / 5); formic acid does not (1 / 4); leave-one-lab-out fails (1 / 10 cells); nothing ships."
    follow_up: "Formic exit to the literature; acid amounts across pH as fit data (done later via Davidek, EX-013)."
  - id: EX-002
    date: "2026-10-29"
    kind: fit
    question: "Do pH slopes on the Amadori steps explain the acid pH dependence (sub-model 1, arm B)?"
    hypothesis: "Martins 2003's measured slopes, applied in the sulfur lane, reproduce the pH trend."
    design: "results/validation/kinetic_core_ph_acid_submodel_prereg.md secs. 4-5, Amendment 1"
    expected: "Slopes inside Martins' band; no pH trend in residuals."
    artifacts: [results/validation/kinetic_core_ph_acid_submodel_fit_B.md, results/validation/kinetic_core_ph_acid_submodel_fit_B.json,
                results/validation/kinetic_core_ph_acid_submodel_fit_B_superseded_amendment1.md, results/validation/kinetic_core_ph_acid_submodel_fit_B_superseded_amendment1.json]
    commit: 1b6aeac
    verdict: partial
    conclusion: "First run's slopes on bounds (DFG at the wrong pKa; label-scale slopes) -> Amendment 1; rerun: acetic 5 / 5 on the hold-out, formic 0 / 4."
    follow_up: "As EX-001."
  - id: EX-003
    date: "2026-10-29"
    kind: fit
    question: "Do slopes on the glucose-consuming steps (condensation, sugar) close the acid pH trend (sub-model 1, arm C)?"
    hypothesis: "The pH trend is the glucose steps' slopes, not the formic exit."
    design: "results/validation/kinetic_core_ph_acid_submodel_prereg.md Amendment 2"
    expected: "In-sample pH trend gone; hold-out passes."
    artifacts: [results/validation/kinetic_core_ph_acid_submodel_fit_C.md, results/validation/kinetic_core_ph_acid_submodel_fit_C.json,
                results/validation/kinetic_core_ph_acid_submodel_holdout_score.md]
    commit: ebe99d6
    verdict: rejected
    conclusion: "In-sample it worked by putting the condensation slope on its bound; the frozen hold-out rejected it (low-pH drifting runs 10 - 200x low in acid)."
    follow_up: "The hold-out did its job: an in-sample improvement that would have damaged low-pH predictions was stopped."
