notes: "ames2001b.yml has no pH contrasts; arms are from ames2001b__families.yml (ames2001b-4/-5/-6/-111). pH set by NaOH at 0, 3 or 6 g/L of extruder water feed 'to produce extrudates at three pH levels', no buffer (the 0 g/L arm received no NaOH). Final pH = pH of the extrudate after extrusion, measured per the AOAC flour method (5 g extrudate stirred 30 min in 20 mL tap water of pH 7.3), so it is a slurry pH, not an in-process pH."
