source: martin2001
pdf: data/articles/martin2001.pdf
reader: resolved
scope_note: 'Resolved from readers A (150) and B (351), 11 matched; every other row re-read against the PDF. Fried potato-slice
  model (leached slices infused per Table 2, 180 C oil falling to ~160 C, 2 min; temp_C keyed 180). Amino acid identity keyed
  as one categorical contrast per series with ''none'' (W or G) as a level; glucose addition as precursor dose 0 vs 500 mg/100
  mL per background. Pairs with all arms nd not keyed; blank cells nd_no_limit; L/I/P/M pyrazines nd from the text. Not keyed:
  untreated chips U (many levers), W for pyrazines (no Table 4 column), sulfides (off the family list), two-lever pairs the
  paper does not discuss (B''s G vs L, W vs GL, F/G vs GFA etc.), Table 5 for systems whose amounts Table 4 prints, Fig. 2
  yields for systems with Table 4 amounts except GA and X (needed as partners of FA, GFA, Y). Tables 5 and 6 keyed quantity
  share. Mixed X vs single amino acid + glucose keyed for the parent Strecker aldehyde (discussed p. 3888).'
