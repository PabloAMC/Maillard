# Reader B, step 9 keying (PREREG secs. 3 - 4, A1 - A6). Key what the source prints.
source: madruga1995
pdf: data/articles/madruga1995.pdf
reader: b
scope_note: 'One 4-level initial-pH ladder (4.0/4.5/5.0/5.6; final pH 4.4/4.9/5.4/5.8, Table 1) in beef, HCl-adjusted with
  no added buffer (meat''s own buffering). Unit printed as ''mg kg-1 meat'' (kept as printed); Tr footnote reads ''trace (2
  mg kg-1 meat)'', keyed as trace with limit 2; ND has no printed limit. n not printed exactly (''usually no less than three
  headspace collections''). Not keyed (not on the declared lists): 2-ethyl-(5 or 6)-methylpyrazine, 2,3-diethyl-5-methylpyrazine,
  bis(2-furanylmethyl) trisulphide, decanal, 2-hexyl/2-heptylfuran, mercaptoketones, thiophenes, dimethyl sulphides.'
contrasts:
- id: madruga1995-1
  odorant: 2-Methyl-3-furanthiol
  lever_class: pH
  lever: initial pH of minced beef set by HCl addition before cooking (pH before cooking)
  focal: true
  location: 'Table 2 (final pH: Table 1)'
  digitised: false
  unit: mg kg-1 meat (approximate, vs 65 ng dichlorobenzene internal standard)
  quant_type: peak_area
  time_course_rule: not a time course
  ph_control: adjusted_unbuffered
  arms:
  - label: pH 4.0
    lever_value: 4.0
    value: 130
    censor: none
    limit: null
    n: null
    sd: 20
    conditions:
      ph: 4.0
      ph_basis: initial
      final_ph: 4.4
      final_ph_location: Table 1
      temp_C: 140
      time_min: 30
      precursors:
        beef (M. psoas major): 100 g
        acid: 12 ml 1 M HCl
      buffer: none
      matrix: meat (minced beef)
      headspace: unstated
