  to peak, a rate-like quantity); Fig. 2 (time courses duplicating Table 2''s temperature lever); Fig. 4 (DMP mixture vs pH;
  series not attributable at 15 min). DMP and methylbutanal are printed mixtures (odorant_unlisted).'
