# One file per source and reader. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: lee2024oven
pdf: data/articles/lee2024.pdf
reader: a
scope_note: 'No table prints marker values: all values digitised from Fig. 1 (AA, F, 5-MF, FA, 5-HMF; G and G+L) and Fig. 2 (3-MB and four pyrazines; G+L only) by marker-centroid pixel reading (axis-calibrated);
  markers indistinguishable from the baseline or occluded are keyed censor below_value with limit = 2.5% of the panel y-axis maximum (a digitising floor, not a printed LOD); SD error bars not digitised
  (sd null); n = figure-legend n per temperature (25 Hz and 50 Hz runs pooled as repetitions, sec. 3.1). 3-MB at 200 C from 10 min is above the calibration range (hatched) and not keyable. Glucose and leucine
  amounts, pH and water content are not printed (batter per Lee et al. 2020). Not keyed: convection level 25 vs 50 Hz (Table 2 prints ANOVA p-values only, no arm values); Fig. 4 (re-plots the Fig. 1 vapour
  F and 5-HMF data with matrix concentrations that the paper states come from Lee et al. 2022, Food Chem 376:131917, i.e. reprinted, plus model fits); text-only fold statements (AA ~10-fold, 5-MF/FA 5-fold,
  FA ~5-fold G vs G+L at 54 min 200 C; text gives units mmol where figures print nmol). Arms at 93 and 118 min exist at 140 C only; time_course_rule longest common time = 88 min.'
