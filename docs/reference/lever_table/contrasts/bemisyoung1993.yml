reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader b (11). The readers agree on the 10 Table 2 pyrazine ladders;
  reader b also keys furfuryl alcohol from Table 3 (% of non-pyrazine compounds), re-read and confirmed (10.15 / 6.39 / 9.79
  / 16.43 / 12.12 / 12.97 / 2.06 / 0.31 at pH 1 / 2.34 / 4 / 5.97 / 7 / 9 / 9.64 / 12): kept (bemisyoung1993-11). Values are
  composition shares (relative weight %), not amounts. Initial pH set with NaOH/HCl, unbuffered (adjusted_unbuffered); final
  pH measured but not printed. Conventions (resolver, uniform with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit
  with value null; all-ND contrasts kept; one compound printed twice carries duplicate_of; co-eluting mixtures odorant_unlisted;
  odorant names canonicalised to the compound_keys display name, printed name in odorant_printed; IS semi-quantification and
  SIFT-MS ppb relative, calibration with authentic standards absolute.'
