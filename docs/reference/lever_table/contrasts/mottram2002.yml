source: mottram2002
pdf: data/articles/mottram2002.pdf
reader: resolved
scope_note: 'Approximate headspace quantities vs 1,2-dichlorobenzene IS with response factor 1: peak_area. tr = <0.5 ng/mmol
  (trace, limit 0.5); ''-'' = below detection limit ~0.1 ng/mmol (nd_with_limit); ''+'' = present, quantification confounded
  by adjacent peak (nd_no_limit, value null). Unbuffered arms drift in pH on heating (final pH in each label). ''Phosphate''
  buffer is 0.2 M pyrophosphate per Methods; phthalate 0.3 M. Buffer-type contrasts keyed with levels none / phosphate / phthalate
  (the two buffers also differ in concentration, 0.2 vs 0.3 M, as the paper designed). Mixed contrasts: only unbuffered (initial
  5.6) vs phosphate 4.2, the pair the paper discusses. 2-methyl-3-(2-furylmethyldithio)furan keyed as the MFT-FFT mixed disulfide.
  Table 2 has no thiol.'
