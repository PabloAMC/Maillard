scope_note: Table S1 (2.5 % sugar) gives the sugar-identity contrasts and, for compounds not in Fig. 5, the heated control (no sugar) vs 2.5 % sugar pairs. Fig. 5 (methional, furfural, hexanal, 2-pentylfuran)
  is digitised for the 0-3.5 % dose ladders and for sugar identity at 0.5, 1.5 and 3.5 %; where the text prints a Fig. 5 value it is used instead of the reading. Bars absent in Fig. 5 are keyed nd_no_limit.
  The unheated control (25 C) is not keyed (heating is not a single lever here). Compounds with every arm nd in a contrast are skipped.
