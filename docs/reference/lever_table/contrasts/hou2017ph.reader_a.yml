reader: a
scope_note: 'Table 2 is an image; its values are read from the page''s hidden text layer, where blank cells are dropped. Cell
  positions of rows with fewer than 4 values were fixed by the printed subtotals (N-heterocycle, furan, ''other'' and thiol
  subtotals sum exactly); rows not fixable that way (bis(2-furfuryl) disulfide in both blocks; bis(2-methyl-3-furyl) disulfide
  DB-WAX block) are not keyed. Two column blocks (HP-5MS, DB-WAX) quantify the same pots: HP-5MS keyed first, DB-WAX as duplicate_of
  where both print the compound. Printed 3-ethyl-2,5-dimethylpyrazine keyed as 2-ethyl-3,6-dimethylpyrazine. No pyrazine class
  total printed. Final pH = initial - printed drop (Table 1). Text says 6.5, abstract 6.6.'
