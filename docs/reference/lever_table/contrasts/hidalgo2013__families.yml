source: hidalgo2013
pdf: data/articles/hidalgo2013.pdf
reader: resolved
scope_note: 'All values digitised from figures (no tables). Fig. 1 (alpha-keto acid identity) not keyed: carbonyl-reactant
  identity is not a listed lever class. Fig. 2D temperature keyed once, at the longest time (30 min; 100/120/140 C), not at
  20 min. Fig. 2B 100 C 1 h vs 37 C 6 days keyed only at 20 umol GlyKA, the pair the text discusses (30% lower). Fig. 3 glycine-alone
  controls plot at ~0 on a 0-800 nmol axis and cannot be read: keyed nd_no_limit. Fig. 2A pH 6 citrate/phosphate points overlap
  (readers swapped them; within 0.05 dex).'
