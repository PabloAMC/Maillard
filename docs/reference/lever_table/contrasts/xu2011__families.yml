# Resolved (third read) from reader_a / reader_b; rows the comparison listed were re-read in the PDF.
source: xu2011
pdf: data/articles/xu2011.pdf
reader: resolved
scope_note: 'Semi-quantitative (cyclohexanone IS, no per-analyte calibration), keyed peak_area. Table 2 (2E)-octenal prints
  no entry for Xyl-Cys-fresh lard, so its contrasts with that arm are not keyed; pairs with every arm n.d. are not keyed;
  Table 2 has no no-lard arm. Mixed pairs (Xyl-Cys added vs lard heated alone) kept: the text discusses them. Family compounds
  not on the declared list (e.g. (2E)-heptenal, (E)-2-decenal, 2-methylfuran) were keyed by neither reader and are not added
  here. Thiols/thiophenes out of scope.'
contrasts:
