    censor: none
    limit: null
    n: 3
    sd: 3.09
    conditions:
      ph: 5.0
      ph_basis: initial
      temp_C: 120
      time_min: 60
      precursors:
        L-cysteine: 0.2 g in 10 mL
        D-xylose: 0.2 g in 10 mL
      buffer: 0.2 mol/L phosphate (Na2HPO4/NaH2PO4)
