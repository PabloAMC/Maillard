source: kim2008
pdf: data/articles/kim2008.pdf
reader: a
scope_note: 'Tables 1-3, HPLC with authentic-standard calibration (absolute), mM/L, mean +- SD of three experiments. Each
  pH has its own buffer (0.5 M acetate pH 4, phosphate pH 7, carbonate pH 10), so pH ladders are mixed (pH + buffer type).
  Sugar alone is keyed as level ''none'' in the amino-acid network. ''-'' keyed as ND. Not keyed: HMF (not on the declared
  list). Final pH not printed (''heated without pH control'').'
contrasts:
- id: kim2008-1
  odorant: furfuryl alcohol (FFA)
  lever_class: mixed
  lever: initial pH 4 / 7 / 10, each with its own buffer (acetate / phosphate / carbonate)
  focal: true
  location: Tables 1-3
  digitised: false
  unit: mM/L
  quant_type: absolute
  time_course_rule: not a time course
  ph_control: buffered
  arms:
  - label: Glc pH 4
    lever_value: 4
    value: null
    censor: nd_no_limit
    limit: null
    n: 3
    sd: null
    conditions:
      ph: 4
      ph_basis: initial
      final_ph: null
      final_ph_location: ''
      temp_C: 100
      time_min: 120
      precursors:
        glucose: 1 M (final concentration)
