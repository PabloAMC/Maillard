source: "adams2001"
pdf: "data/articles/adams2001.pdf"
reader: "resolved"
scope_note: "Only FFT (2-furanmethanethiol, Table 3, GC-MS) qualifies; 2-furfuryl methyl disulfide and the alkyl/allyl disulfides are not target compounds; Tables 1-2 and Figs 1, 3, 4 carry no target odorant. The two arms differ in matrix (water vs 1% ovalbumin) AND pH (protein adjusted to pH 8.0 with NaOH; water blank pH not stated or adjusted), so keyed 'mixed' (PREREG sec. 3). Whether the water blank was heated is not stated. The water arm is ND with no limit and no quantified FFT in the water column, so the contrast is keyed but enters no estimate. FFT here comes from thiol-disulfide interchange of an added disulfide with protein, not from sugar-amine chemistry."
