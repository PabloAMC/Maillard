source: mottram2002
pdf: data/articles/mottram2002.pdf
reader: a
scope_note: 'Target odorants: 2-furfural and methylpyrazine (Table 1), 2-furfural and 4-hydroxy-5-methyl-3(2H)-furanone (norfuraneol,
  Table 2); unbuffered arms drift to final pH 3.9-4.4 (recorded in labels); Table 1 ''tr'' <0.5 and ''-'' <~0.1 ng/mmol; Table
  2 heating conditions taken as the reaction conditions (140 C, 30 min); Not keyed (all arms censored): 2-furfural sugar identity
  in phosphate buffer, pH 5.6; 2-furfural buffer IMP; methylpyrazine sugar identity in unbuffered; methylpyrazine sugar identity
  in phosphate buffer, pH 4.2; methylpyrazine buffer IMP; methylpyrazine pH IMP; methylpyrazine unbuffered vs phosphate 4.2
  Rib-PO4; methylpyrazine unbuffered vs phosphate 4.2 ribose; methylpyrazine unbuffered vs phosphate 4.2 IMP; 4-hydroxy-5-methyl-3(2H)-furanone
  Table 2 buffer ribose.'
