source: huang2010
pdf: data/articles/huang2010.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader a (90). Table 3 (aldehydes / furans; 9 odorants x before-
  and after-roasting pH ladders): readers agree on every value. Decided calls: liquor pH measured on the product is ph_basis
  final with final_ph = that pH (Table 3 / Figs 1 - 3), ph_control adjusted_unbuffered (K2CO3 alkalization); arms that differ
  in roasting stage (alkalized before vs after roasting at near-matched pH) are lever_class mixed (reader a keyed them, reader
  b did not; kept: huang2010-25 - 66). Digitised values (Figs 1 - 3, digitised: true) are the geometric mean of the two readers,
  who agree within 0.07 dex on every point kept. Figures re-read (pdftoppm -r 200 / 600): Fig. 1 (300,000 ppb axis, ~240 ppb
  per pixel at 600 dpi) points at pH <= 7.0 lie within one marker height of zero and overlap, so they are not keyed (reader
  b''s pH 5.9 - 6.98 values, read at its stated +-2,000 ppb resolution, dropped), except After-TrMP at pH 7.03 (readers 11,400
  / 10,600; diamond top visible, kept); After-DMP at pH 7.03 (readers 4,300 / 5,700, 0.12 dex apart, square overlapped by
  two markers) is not keyed. The unlabelled After-series points at pH ~5.2 / 5.33 in Figs 1 - 2 (not in Table 3, pH not printed)
  are not keyed (reader b keyed them). Fig. 3 x positions re-read: pH 5.33 / 6.02 / 6.52 / 6.98 / 7.6 / 8.01 (reader b; reader
  a rounded to 5.3 / 6.0 / ...); final_ph from the x position. Fig. 3 phenylacetaldehyde 40 C at pH 6.98: readers 66 / 77
  (0.07 dex), mean kept. Fig. 3 40 C values sit near the axis (4,000 ppb scale); kept as both readers agree. SIFT-MS headspace
  ppb (relative). Not keyed: Figs 4 - 5 (ratios), Fig. 6 commercial powders (proprietary processes), off-list compounds. DMP
  and 2-/3-methylbutanal are printed isomer mixtures (odorant_unlisted). Conventions (resolver, uniform with batch 1): printed
  ND, ''-'', blank or 0 is nd_no_limit with value null; all-ND contrasts kept; one compound printed twice carries duplicate_of;
  co-eluting mixtures odorant_unlisted; odorant names canonicalised to the compound_keys display name, printed name in odorant_printed;
  IS semi-quantification and SIFT-MS ppb relative, calibration with authentic standards absolute.'
