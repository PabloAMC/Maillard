source: "xu2007"
pdf: "data/articles/xu2007.pdf"
reader: "b"
scope_note: "Table 1 approximate headspace quantities (peak area vs tridecane, RF 1; treatments in duplicate). Keyed: initial-pH ladders 5.6/7.0/8.0 (final pH printed in labels) separately within control and within SC-CO2. Not keyed: SC-CO2 vs control at each pH (the paper's focal lever; supercritical CO2 at 40 MPa is not a listed lever class, and it also shifts final pH). '-' keyed nd_with_limit 0.07 ng/mL, 'tr' keyed trace (<0.3 ng/mL). Ladders with every arm below DL not keyed: methylpyrazine (SC-CO2); 2,6-dimethylpyrazine (SC-CO2); 2-ethyl-6-methylpyrazine (SC-CO2); trimethylpyrazine (SC-CO2)."
