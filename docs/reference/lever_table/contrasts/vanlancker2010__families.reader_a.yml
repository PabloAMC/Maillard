# Reader A, second keying round (odorant families). Rules: PREREG.md secs. 3 - 4.
source: vanlancker2010
pdf: data/articles/vanlancker2010.pdf
reader: a
scope_note: 'Peak areas (SBSE-GC-MS), n unstated. Alkylpyrazines, unsubstituted pyrazine and total pyrazines keyed; ethenyl-,
  propenyl-, isopropenyl-, acetyl-, furyl-pyrazines, pyrrolopyrazine and pyrazinoindole not keyed (not alkylpyrazines); ''pyrazines
  (% of total GC-MS peak area)'' keyed as quantity share for total pyrazines. Free amino acids vs peptide (the paper''s question)
  has no lever row; keyed under amino acid identity with lever ''free vs peptide-bound''. Glucose vs methylglyoxal vs glyoxal
  not keyed (dicarbonyls at 10-fold lower concentration: two levers, no named pair). Pairs where every arm is not detected
  are omitted. Table 1-3 arm ''Lys (0.4 M)'' is paired with LysLys as its free counterpart; the Lys + X mixtures and Lys (0.4
  M) form the free-mixture network (equal total amino acid 0.4 M). Methyl-(3-methylbutyl)pyrazine isomers are distinguished
  by LRI.'
