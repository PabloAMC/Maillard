source: "thomas2014"
pdf: "data/articles/thomas2014.pdf"
reader: "a"
scope_note: "All values digitised from Fig. 2 (no table prints them); median of triplicate, min-max bars not keyed as SD. C+F and C+X arms lie on the axis floor and are digitised at ~0.2 (indistinguishable from zero at plot resolution). Not keyed: thiamine vs cysteine or fructose vs xylose between ladders (doses and co-precursors differ; floor values only); 2-methyl-3-(methyldithio)furan (not in odorant list); Table 1 hydrogen sulfide (industrial ham only, no contrast)."
