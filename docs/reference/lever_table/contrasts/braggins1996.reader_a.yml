source: braggins1996
pdf: data/articles/braggins1996.pdf
reader: a
scope_note: 'Ultimate meat pH groups (adrenaline-induced; SM mean pH 5.66/6.26/6.81, Table 1) cooked to 75 C internal in a
  100 C bath (~10 min); purge-and-trap of rendered fat, 2-octanone internal standard (relative), geometric means of n = 10
  animals, no SD. Table 4 prints only compounds that changed significantly. Table 5 footnote compounds ''targeted but not
  found in any of the samples'' keyed as all-ND. ''2,4 decadienal'' (KI 1330, isomer unspecified) keyed odorant_unlisted.
  Not keyed: hexanal (GC/O only), unlisted compounds, ''2-furanylmethanethiol sulfide'' (not resolvable to a declared odorant).'
