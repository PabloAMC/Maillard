source: "li2021lab"
pdf: "data/articles/li2021b.pdf"
reader: "a"
scope_note: "2x2 design (xylose x cysteine) plus unheated control, Table 4; pairs with both arms not detected skipped; 2,5-dimethylpyrazine printed as 0.00 keyed as nd; no LOD printed; '2-octenal' printed without stereo-descriptor"
