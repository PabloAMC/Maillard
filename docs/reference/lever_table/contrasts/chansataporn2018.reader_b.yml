source: chansataporn2018
pdf: data/articles/chansataporn2018.pdf
reader: b
scope_note: 'Only time courses at 100 C, all values digitised from Figs 1G and 5 (no tables); SDs read from error bars where visible (triplicate).
  HMF not detected (no limit) in glucose/lysine at all times and absent from chicken extract (only furfural detected): not keyable. Glucose/lysine
  vs chicken extract differs in many levers and shares no named odorant, so no matrix contrast. Volatiles quantified by SPME-GC-MS against internal
  standard propyl butyrate (keyed relative); furfural by HPLC-DAD (keyed absolute). Glucose/lysine pH: methods say phosphate pH 6.5 (no concentration),
  results 6.83 initial; ph_control unstated. 0 h value plotted at zero for all odorants (read as 0.0, not as non-detect). Fig. 3E/7D/8D ''volatile
  compounds'' are model-fit replots, not keyed.'
