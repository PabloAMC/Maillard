source: "grosch1992"
pdf: "data/articles/grosch1992.pdf"
reader: "a"
scope_note: "All amounts in ug per reaction (500 mL unless noted), isotope dilution with deuterated standards. Table II pairs keyed one lever at a time (cysteine-vs-GSH swap 6 vs 7 keyed only through the shared base, since it changes identity and amount). 'n.a.' arms omitted; Table II/V 'n.d.' has no printed limit (the 1.0/0.2 ug limits on p. 188 refer to meat samples). Table IV 0.2 mol/L column reprints Table III (keyed once, used only as the buffer-concentration arms). Table VIII method I column reprints Tables II and V (not keyed). Not keyed: Table VI thiamine+H2S vs Table II thiamine (cross-table), Table VII meat cuts (no designed lever), method I vs II (analytical). 'reflux' recorded as printed, not converted to a temperature."
