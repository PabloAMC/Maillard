source: mottram2002
pdf: data/articles/mottram2002.pdf
reader: a
scope_note: 'Approximate headspace quantities vs 1,2-dichlorobenzene IS with response factor 1: peak_area. tr = <0.5 ng/mmol
  (trace, limit 0.5); ''-'' = below detection limit ~0.1 ng/mmol (nd_with_limit); ''+'' = present, unquantified (value null,
  censor none). Unbuffered arms drift in pH on heating (final pH in each label). ''Phosphate'' buffer is pyrophosphate per
  Methods. 2-methyl-3-(2-furylmethyldithio)furan keyed as the MFT-FFT mixed disulfide.'
