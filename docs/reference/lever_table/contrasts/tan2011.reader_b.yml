source: tan2011
pdf: data/articles/tan2011.pdf
reader: b
scope_note: 'Keyed Table 1 (time ladder 30-180 min at 140 C) and Table 2 (temperature ladder 80-160 C at 120 min) for all 31 compounds x Glu/Asp; not keyed: Glu vs Asp (amino-acid identity is not a lever
  class in sec. 4), Total volatiles/Total pyrazines rows (sums, not odorants), Figs 3-6 (replot the tables). The 140 C arm of Table 2 prints values identical to the 120 min arm of Table 1 (same pot shared
  by both ladders, though Methods describes separate aliquots). ND printed with no LOD/LOQ. n=2 ("repeated twice"), values are mean ± SD. Final pH not printed. Rows with every arm ND are keyed but carry
  no estimate.'
