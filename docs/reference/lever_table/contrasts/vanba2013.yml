source: vanba2013
pdf: data/articles/vanba2013.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Readers agree on all 242 contrasts (every arm value and censor); base
  reader b, whose lever levels are usable (lipid levels ''none'' / C18:1n-9 / C18:2n-6 / C18:3n-3; the mixed contrasts ''fatty
  acid alone'' vs ''fatty acid + 21 amino acids + ribose''; reader a printed ''21'' for both arms of the mixed pairs). Decided
  call: ''Nf'' with the printed detection limit 0.09 ug/100 mL is nd_with_limit 0.09. Keyed: pH 5.5 vs 6.2 in every system
  (0.2 M phosphate, buffered); fatty-acid identity against the no-fatty-acid arm at each pH (lipid); fatty acid alone vs fatty
  acid + amino acids + ribose (mixed). ug/100 mL approximate (internal standard 2-methyl-3-heptanone, response factor 1; relative);
  pooled SEM only, no per-arm SD. Table 3 holds no declared odorant. No final pH printed. Conventions (resolver, uniform with
  batch 1): printed ND, ''-'', blank or 0 is nd_no_limit with value null; all-ND contrasts kept; one compound printed twice
  carries duplicate_of; co-eluting mixtures odorant_unlisted; odorant names canonicalised to the compound_keys display name,
  printed name in odorant_printed; IS semi-quantification and SIFT-MS ppb relative, calibration with authentic standards absolute.'
