source: laemont2023
pdf: data/articles/laemont2023.pdf
reader: b
scope_note: 'SIFT-MS headspace ppb (relative), Table 2, n = 3, no SD printed. Keyed: pH 4 vs pH 9 (both phosphate buffer,
  concentration not printed); the pH 7 control is unbuffered water, so it differs from pH 4/9 in buffer as well and is not
  in the pH contrast. Sugar: no-sugar control (pH 7 water) vs 20% glucose vs 20% fructose. Protein: control vs 17% whey protein
  isolate (precursor dose); WPI vs WPC keyed mixed (protein purity and lactose differ). Raw seeds not keyed (unroasted, unsoaked:
  several levers). Mixtures (dimethylpyrazine isomers; 2-pentylfuran + 2-ethylpyrazine) keyed odorant_unlisted. No final pH
  printed.'
