source: vanlancker2010
pdf: data/articles/vanlancker2010.pdf
reader: resolved
scope_note: 'Peak areas (SBSE-GC-MS, x 10^8), n unstated; carbonyl partner glucose 0.2 M or methylglyoxal / glyoxal 0.02 M, pH adjusted to 8 before heating, 130 C,
  2 h, unbuffered, sealed tubes. Tables 1-3 (glucose, methylglyoxal, glyoxal): per compound one amino-acid-identity contrast over the 16 arms Lys (0.4 M) to LysPhe
  (all 0.4 M total residues; free mixtures named ''free amino acids (...)'', dipeptides by name), as the paper''s multi-arm design (PREREG sec. 4 network; the pairwise
  free-vs-peptide and sub-network split of reader A re-used the same arms), plus the precursor-dose pair Lys 0.2 vs 0.4 M where either arm is detected; compounds
  with no detected arm in a contrast are omitted. Non-listed pyrazines (2,5(6)-dimethylpyrazine co-elution, ethenyl, acetyl, propenyl, furyl, alkyl, pyrrolo, indole)
  keyed with odorant_unlisted. ''Pyrazines (% of total GC-MS peak area)'' not keyed: a share, and the amount (total pyrazines) is printed. Cross-table carbonyl comparisons
  of pyrazines not keyed (different tables, two levers). Table 4: dipeptide vs free pairs per carbonyl, and the glucose/methylglyoxal/glyoxal comparison as mixed
  (the paper discusses it). ''-'' = nd, no printed limit; ''tr'' = trace. Values read by a positional parser of the PDF text layer, spot-checked against the page
  images.'
