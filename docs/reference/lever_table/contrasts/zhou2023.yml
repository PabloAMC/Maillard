source: "zhou2023"
pdf: "data/articles/Zhou2023b.pdf"
reader: "resolved"
scope_note: "Table 1 only (Fig. 3 Cys + MGO model has no thiols). ND printed with no LOD (calibration in SI, not read), so every ND arm is nd_no_limit. The ARP-alone pH ladders (all arms ND) and the Bis(2-furfuryl) disulfide cysteine-vs-none contrast at pH 8 (both arms ND) are kept as keyed-but-uninformative per PREREG sec. 3 (counted per cell, enter no estimate). Di-2-furfuryl sulfide (monosulfide) not on the odorant list. Arm order follows the table: ARP alone is printed before ARP + Cys at each pH."
