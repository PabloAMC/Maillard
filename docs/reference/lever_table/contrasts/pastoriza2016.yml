source: pastoriza2016
pdf: data/articles/pastoriza2016.pdf
reader: resolved
scope_note: 'Resolved 2026-11-14 (step 15, temperature/time cluster). Readers agree on all 29 contrasts: every lever value,
  unit, arm value, SD and censor match; base reader a (table-and-column locations). The 7 glucosylisomaltol rows (23-29) are
  not in data/keys, so the comparison tool could not pair them; re-read against Table 4 (p. 6) and sec. 3.4 text, values confirmed.
  Keyed: heating time 0-30 min at 100/120/140 C (time ladders), temperature 100/120/140 C at 30 min, and glutamine vs arginine
  at 30 min (lever_class ''amino acid identity'', used by existing resolved files) for HMF (Table 2), furfural (Table 3) and
  GIM (Table 4), HPLC-UV mg/L, absolute. Not keyed: OPA fluorescence loss (Table 1), A420 (Table 5), fluorescence (Table 6),
  not odorants. n.d. has no printed LOD: nd_no_limit; GIM in arginine systems is from the text ''No GIM was found'' (nd_no_limit).
  Time 0 arms are unheated baselines (HMF 0.04 mg/L from dextrinomaltose); times exclude a ~2 min come-up. Temperature and
  amino-acid contrasts use 30 min (longest; no main-result time stated). pH 6.5 initial, 0.1 M phosphate; final pH not printed.
  Odorant names canonicalised to the compound_keys display name (GIM has no key), printed name in odorant_printed.'
