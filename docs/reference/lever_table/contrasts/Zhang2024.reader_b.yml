source: Zhang2024
pdf: data/articles/Zhang2024.pdf
reader: b
scope_note: 'All thiol values digitised from figures (no table prints them). MMFT (methyl disulfide) not keyed (not in the
  thiol list). Cys-vs-GSH at matched dose derivable from Fig. 2 arms, not keyed separately. Fig. S1/S2, Tables S1-S7 (supplement)
  not available; RSM (Fig. 3) and thermal-process-flavouring data (Fig. 4) give no thiol values. | Zhang2024-1: Sec. 2.2 states
  60 min reaction but no temperature; sec. 2.3 (multi-component, with Met) states 115 C. Bars digitised; SD bars not keyed.
  | Zhang2024-2: Sec. 2.2 states 60 min reaction but no temperature; sec. 2.3 (multi-component, with Met) states 115 C. Bars
  digitised; SD bars not keyed. | Zhang2024-3: Non-monotone (peak near 50-62.5 mg/mL). Points at 0.5-10 mg/mL lie on the baseline
  and overlap; their digitised values are rough (+-0.05 ng/mL). | Zhang2024-4: Non-monotone (peak near 50-62.5 mg/mL). Points
  at 0.5-10 mg/mL lie on the baseline and overlap; their digitised values are rough (+-0.05 ng/mL). | Zhang2024-5: Non-monotone
  (peak near 50-62.5 mg/mL). Points at 0.5-10 mg/mL lie on the baseline and overlap; their digitised values are rough (+-0.05
  ng/mL). | Zhang2024-6: Non-monotone (peak near 50-62.5 mg/mL). Points at 0.5-10 mg/mL lie on the baseline and overlap; their
  digitised values are rough (+-0.05 ng/mL).'
