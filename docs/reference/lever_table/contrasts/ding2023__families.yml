source: ding2023
pdf: data/articles/ding2023.pdf
reader: resolved
scope_note: 'Table 2 GC-MS, ng/g (unit from the text) semi-quantified against 1,2-dichlorobenzene (peak_area). Ladder A-E
  (0-1% cysteine, all heated 110 C 60 min); unheated control F excluded (differs in heating too). ND without a limit keyed
  nd_no_limit. GC-IMS fingerprints (Fig. 4) not keyed (heat-map intensities; the table covers the GC-MS values). (E)-2-octenal
  is printed twice (rows 47 and 58, same CAS) and keyed twice as printed. Pentanal (valeraldehyde) and (E,E)-2,4-decadienal
  detected only in unheated F: nothing to key. Subtotals by class are not total pyrazines: not keyed. Resolution: the printed
  sum of pyrazines (text p. 12, 1105.15 -> 39.34 ng/g, 0 vs 1.0% cysteine) keyed from reader B as "Pyrazines".'
