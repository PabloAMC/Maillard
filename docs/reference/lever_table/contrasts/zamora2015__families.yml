reader: resolved
scope_note: 'Phenylacetaldehyde (focal) and benzaldehyde (incidental). Table 1: lipid identity per pH x atmosphere; nitrogen
  vs air per lipid and pH (oxygen, level ''inert'' for nitrogen); pH 3 (citrate) vs pH 6 (phosphate) keyed as mixed (buffer
  switch). Values printed 0.00 +/- 0.00 and digitised zero-line points keyed nd_no_limit. Supplement S1-S6 digitised; S2 pH
  ladder split at the buffer switches (citrate 2.15-6, phosphate 6-8) with a citrate-vs-phosphate buffer pair at pH 6 and
  the pH 8 (phosphate) vs 9 (borate) step as mixed. S5/S6 benzaldehyde not plotted. Supplement S1 values at 20 % O2 differ
  from Table 1 air values; keyed as printed. Fig. 2 and Fig. 4 are PEA/PAC ratios, not keyed.'
