source: li2021ph
pdf: data/articles/li2021.pdf + supplement (Table S2)
reader: resolved
scope_note: 'Full factorial pH (5.5, 4.5) x xylose (0 - 3.5 g/100 mL) x temperature (90/95/100 C), 60 min, in enzymatically hydrolysed pork trimmings; every one-lever ladder or pair keyed from Table S2
  (Fig. 4 shows the same data for hexanal, furfural and 2-pentylfuran; not digitised). The 281 single-lever contrasts agree between the readers (phenylacetaldehyde, printed benzeneacetaldehyde, differed
  only in spelling). Five mixed pairs (unheated control vs a heated, xylose-added sample; hexanal and furfural at both pH values, 2-pentylfuran at pH 5.5) are kept because sec. 3.5 discusses exactly those
  pairs; values re-read in Table S2 (the text prints 9.14 for the pH 4.5 furfural control where Table S2 prints 9.41; the table value is keyed). Their unheated arm is not a heated system. ''-'' = not detected,
  no LOD (nd_no_limit); a compound row absent from a block of Table S2 gives no arm; contrasts with every arm not detected are not keyed (1-hexanol: only in unheated controls). Per-group RPA (%) rows not
  keyed.'
