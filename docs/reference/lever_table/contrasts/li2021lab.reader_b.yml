  location: Table 4
  digitised: false
  unit: ug/L
  quant_type: peak_area
  quantity: amount
  time_course_rule: not a time course
  arms:
  - label: L0-0
    lever_value: none
    value: null
    censor: nd_no_limit
    limit: null
    n: 3
    sd: null
    conditions:
      ph: 5.5
      ph_basis: initial
      temp_C: 100
      time_min: 60
      precursors:
        xylose: 0 g/100 mL
        L-cysteine: 0 g/100 mL
      buffer: none (adjusted with lactic acid / NaOH)
