source: li2021lab
pdf: data/articles/li2021b.pdf
reader: b
scope_note: Only 2-furfurylthiol among the thiols is reported (MFT, H2S and disulfides not in Table 4). nd printed without
  LOD. Unheated control not keyed as a lever. Values semi-quantified against 2-octanol (internal standard).
contrasts:
- id: li2021lab-1
  odorant: 2-furfurylthiol
  lever_class: sulfur source
  lever: L-cysteine added (none vs 1.0 g/100 mL), xylose 0 g/100 mL
