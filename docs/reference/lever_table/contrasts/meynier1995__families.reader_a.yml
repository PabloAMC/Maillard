source: meynier1995
pdf: data/articles/meynier1995.pdf
reader: a
scope_note: 'Amino-acid-identity contrasts (glycine vs lysine vs cysteine vs methionine) not keyed: they span Tables 1-4,
  not one table. Values are approximate (internal-standard area, no response factors). Thiols, disulfides and other sulfur
  compounds out of scope; 4,5-dihydro-2-methyl-3(2H)-furanone not on the odorant list. nd limit printed as c. 10 ng/10 mg
  ribose, keyed as 0.01 in the table unit; tr printed as <0.1 ug/10 mg ribose. pH held (no change > 0.2 unit after heating).'
