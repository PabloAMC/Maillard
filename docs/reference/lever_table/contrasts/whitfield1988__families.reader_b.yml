# Reader b, blind double-keying, second round (families). Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: whitfield1988
pdf: data/articles/whitfield1988.pdf
reader: b
scope_note: 'Table 1 values (ng) keyed; ratios not keyed. Not keyed: thiols (MFT, FFT, thiophenethiols), thiophenes, pyridines, other thiazoles and 1-(2-furfuryl)pyrrole
  (outside the families); lecithin-only control (footnote b) vs amino acid systems (only a total 2-alkylfuran ratio is discussed). Alkylfurans other than 2-pentylfuran,
  methylfurfural isomers and benzofuran keyed with odorant_unlisted. - = not found, no limit printed. 2,5- and 2,6-dimethylpyrazine printed separately.'
