source: braggins1996
pdf: data/articles/braggins1996.pdf
reader: b
scope_note: 'Meat ultimate pH (semimembranosus, Table 1 means 5.66 / 6.26 / 6.81), induced by preslaughter adrenaline, not
  titrated (unadjusted); cooked mince, volatiles from rendered fat by purge-and-trap GC-MS, ng/g rendered fat via 2-octanone
  internal standard (relative). Tables 4-5 print ONLY compounds that changed significantly (hexanal etc. not printed, so not
  keyed). Pyrazines, furfural and 2-methylfuranthiol were targeted but ''not found in any of the samples'' (Table 5 footnote):
  keyed as all-ND contrasts. The isomer-unspecified ''2,4 decadienal'' row is keyed odorant_unlisted beside the (E,E) row.'
