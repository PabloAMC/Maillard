# Reader b, blind. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: "schirle1992"
pdf: "data/articles/schirle1992.pdf"
reader: "b"
scope_note: "Glucose (0.5 mol) + cysteine (0.1 mol) in 400 mL water, sealed stirred reactor, 100/120/150 C; 80 C data unusable (paper). Amounts exist only as figures of normalized GC area (carbon channel, used by the authors for kinetics) and are digitised by eye from log-free linear axes, so values are rough (t=0 points sit at a common baseline). Table 1 prints zero-order rate constants (UNA/hr) per temperature, keyed as quantity rate; furfurol has no 100 C value printed. Superscript exponents in Table 1 are hard to read in the scan (120 C 2-acetylfuran read as 1.945e5, 5-Me furfural as 2.537e5). HMF and DHMP are outside the odorant list. Temperature arms at 150 C are not keyed as amounts (different time grid and concentration factor 150x vs 300x)."
contrasts:
  # ---------------- Table 1: zero-order rate constants vs temperature (rate) ----------------
  - id: "schirle1992-1"
    odorant: "furfural"
    lever_class: "temperature"
    lever: "reaction temperature 100, 120, 150 C"
    focal: true
    location: "Table 1 (zero order k)"
    digitised: false
    unit: "UNA hr-1 (units of normalized area per hour)"
    quant_type: "peak_area"
    quantity: rate
    time_course_rule: "not a time course"
    arms:
      - {label: "Temperature 100C", lever_value: 100, value: 1692, censor: none, limit: null, n: null, sd: null, conditions: {ph: null, ph_basis: "unstated", temp_C: 100, time_min: 600, precursors: {glucose: "0.5 mol in 400 ml", cysteine: "0.1 mol in 400 ml"}, buffer: "none", matrix: "water", headspace: "sealed, unstated"}}
      - {label: "Temperature 120C", lever_value: 120, value: 50700, censor: none, limit: null, n: null, sd: null, conditions: {ph: null, ph_basis: "unstated", temp_C: 120, time_min: 600, precursors: {glucose: "0.5 mol in 400 ml", cysteine: "0.1 mol in 400 ml"}, buffer: "none", matrix: "water", headspace: "sealed, unstated"}}
