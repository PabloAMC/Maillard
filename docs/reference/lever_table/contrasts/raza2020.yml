source: raza2020
pdf: data/articles/raza2020.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 9, post-A6). Base reader b (96 = 12 odorants x [4 axial ladders + 4 factorial pairs
  differing only in cysteine: MRP-6/5, 13/19, 14/18, 7/16]); reader a keyed 65 (skipped all-not-detected contrasts). The readers''
  only value differences were the order of the five centre replicates; by convention the centre replicates MRP-2/3/4/8/11
  now enter each ladder as ONE arm (mean, n = 5, sd = sample SD of the five printed means), between the axial-low and axial-high
  runs, all other factors at centre. In no ladder is the centre partly detected. ''0±0'' (2,5-dimethylpyrazine MRP-10/11)
  is nd_no_limit. MRP-16 methylpyrazine 920.02 is keyed as printed (it enters only the cysteine pair 7/16; looks anomalous).
  Face-centred CCD, Table 1 design, Table 3 values (ug/mL), external-standard curves with pure standards: absolute. Heating
  time and final pH not printed. pH set with NaOH/HCl, no buffer: adjusted_unbuffered. Bare ''Pyrazine'' keyed as Unsubstituted
  pyrazine. Conventions applied (resolver, uniform across batch 1): a printed ND, ''-'', ''–'', blank, 0, 0.000 or 0±0 is
  censor nd_no_limit with value null; contrasts whose arms are all not detected are kept (keyed, counted, enter no estimate);
  only run pairs differing in exactly one factor are keyed; odorant names canonicalised to the compound_keys display name
  with the printed name in odorant_printed; quant_type absolute only where the paper states calibration with authentic standards
  for that compound, internal-standard semi-quantification relative.'
