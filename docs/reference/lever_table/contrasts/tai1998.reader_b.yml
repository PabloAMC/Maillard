source: "tai1998"
pdf: "data/articles/tai1998.pdf"
reader: "b"
scope_note: "Only thiol in scope printed is 2-furfurylthiol (Table 1); Table 2 (glutathionesulfonic acid) lists no 2-furfurylthiol, keyed as nd_no_limit; mg/mol is an internal-standard (tridecane) estimate, keyed peak_area; H2S, MFT and disulfides not reported. Glucose amount not printed separately (sentence gives 0.0012 mol for the sulfur source)."
contrasts:
