    odorant: "2-furfurylthiol"
    lever_class: "pH"
    lever: "initial pH (3.0, 6.0, 8.0), glutathione/glucose"
    focal: false
    location: "Table 1, p. 2262"
    digitised: false
    unit: "mg/mol"
    quant_type: "peak_area"
    time_course_rule: "not a time course"
    arms:
      - label: "pH 8.0"
        lever_value: 8.0
        value: 11.9
        censor: none
        limit: null
        n: null
        sd: null
        conditions: {ph: 8.0, ph_basis: initial, temp_C: 160, time_min: 120, precursors: {glutathione: "0.0012 mol in 50 mL", glucose: "unstated (with glutathione)"}, buffer: "none (adjusted pH, distilled water)", matrix: water, headspace: "sealed, unstated"}
