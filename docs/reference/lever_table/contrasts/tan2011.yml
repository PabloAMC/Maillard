source: tan2011
pdf: data/articles/tan2011.pdf
reader: resolved
scope_note: 'Resolved 2026-11-14 (step 15, A6 batch 3). Readers agree on all 124 contrasts (identical ids, odorants, lever
  values, every arm value, SD and censor); base reader a. The comparison tool reported tan2011-45/46 unmatched only because
  2,2''-Methylenebisfuran (compound 23, not in compound_keys) was capitalised differently; the PDF row was checked and both
  readers'' values match it. Keyed: Table 1 time ladder (140 C, 30-180 min, stirred, vessel/headspace not stated) and Table
  2 temperature ladder (80-160 C, 120 min, sealed 48-mL vials), for 31 compounds x Glu/Asp with ascorbic acid, 0.2 M phosphate
  pH 8.0 (initial; final pH not printed). The 140 C / 120 min arm is printed in both tables with identical values: one measurement
  shared by the two ladders, keyed in both as printed (Methods describes separate aliquots; it must not be counted as two
  independent pots). Values are HS-SPME GC-TIC peak areas x10^6, mean +/- SD, n=2; printed ND is nd_no_limit with value null
  (no LOD/LOQ printed); all-ND contrasts kept. Not keyed: Glu vs Asp (amino-acid identity; that class exists in other resolved
  files, but neither reader keyed it and the resolver re-reads only differing rows, so it is not added here), Total volatiles
  / Total pyrazines rows (sums), Figs. 3-6 (replot the tables). Non-Maillard compounds (BHT, 2,4-di-tert-butylphenol, 2-ethylhexanol)
  kept as printed. Odorant names canonicalised to the compound_keys display name where it is a synonym (3-Ethyl-2,5-dimethylpyrazine
  -> 2-Ethyl-3,6-dimethylpyrazine), printed name in odorant_printed; ''Pyrazine'' (the parent compound) kept as printed.'
