# PREREG secs. 3 - 4, reader A (blind). Key what the source prints; do not judge it.
source: yang2011
pdf: data/articles/yang2011.pdf
reader: a
scope_note: 'Box-Behnken RSM (29 runs): only run pairs differing in ONE factor keyed (6 per factor; centre runs 3/9/10/15/18
  pair with no single-factor neighbour). Initial and final pH from Table 3. ''-'' and blank cells keyed nd_no_limit; pairs
  with both arms nd not keyed. Table 1 prints no unit. The ''concentration (mL)'' factor is a volume of 0.2 M phosphate buffer
  at fixed reactant mass (a dilution); keyed as buffer concentration, reader unsure of the class.'
contrasts:
- id: yang2011-1
  odorant: 2-Methyl-3-furanthiol
  lever_class: pH
  lever: initial pH
  focal: true
  location: Table 1
  digitised: false
  unit: unstated (internal-standard quantity)
  quant_type: relative
  time_course_rule: not a time course
  ph_control: buffered
  arms:
