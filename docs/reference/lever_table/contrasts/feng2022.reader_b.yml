source: feng2022
pdf: data/articles/feng2022.pdf
reader: b
scope_note: GSH-vs-none arms sit in two tables (1 and 2) of the same study and method; ARP + Cys/Glu/Gly models report only
  pyrazines (Table 3) and thiazoles (Fig. S3, not read), no thiol values; Fig. 2g (sulfur volatiles time course) not digitised
  since Tables 1-2 print the values.
contrasts:
- id: feng2022-1
  odorant: 2-methyl-3-furanthiol
  lever_class: temperature
  lever: 120 vs 100 C, ARP model
  focal: false
  location: Table 1, p. 9098
  digitised: false
  unit: ug/L
  quant_type: absolute
  time_course_rule: main result time (120 min; the only time at 100 C)
  arms:
  - label: ARP-120 C, 120 min
    lever_value: 120
    value: 7.22
    censor: none
    limit: null
    n: 3
    sd: 0.44
    conditions:
      ph: 7.0
      ph_basis: initial
      temp_C: 120
      time_min: 120
      precursors:
        RG-ARP (N-(1-deoxy-D-ribulos-1-yl)-glutathione): 20 mmol/L
      buffer: none (pH adjusted with 6 mol/L NaOH)
      matrix: water
      headspace: sealed, unstated (pressure-resistant glass bottle)
  - label: ARP-100 C, 120 min
    lever_value: 100
    value: 4.39
