source: "Zhang2024"
pdf: "data/articles/Zhang2024.pdf"
reader: "a"
scope_note: "No table prints thiol values; all arms digitised from low-resolution figures (Fig. 1a bars; Fig. 2d, 2f points). Fig. 2 points lying on the x-axis read as 0.0 (unresolvable below ~0.05 ng/mL). Fig. 1 simple-model temperature not printed (sec. 2.2 gives only 60 min). Cys vs GSH at matched dose in Fig. 2 not keyed separately (same arms as the dose ladders). Time course of MFT (Fig. S1 / Table S6-S7) and RSM data are supplementary, not read. MMFT (methyl disulfide) not a listed thiol; Fig. 4 prints no thiol. Fig. 2 pH 4.9 phosphate taken from sec. 2.3 (sec. 2.6 states no pH or Met/VB1/Xyl concentration)."
