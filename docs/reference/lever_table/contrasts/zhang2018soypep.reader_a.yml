source: zhang2018soypep
pdf: data/articles/zhang2018.pdf + supplement (zhang2018_supplementary.txt, Tables S1-S4)
reader: a
scope_note: 'Group T from Table S1 (and the second Bis(2-furfuryl)disulfide row in Table S2): the two tables print different values under the same name, keyed as two separate rows. No H2S, MFT disulfide
  or mixed disulfide row is printed. Thiols subtotal not keyed (includes other thiols). Values are percentages of total GC-MS peak area (''-'' = not detected, no limit printed); no SD or n printed in the
  tables. Temperature ladders keyed per series (XS, XSC); cysteine vs none keyed per temperature; pairs with both arms not detected are not keyed. All arms: initial pH 7.6 (final pH differs by arm, Table
  1 not transcribed), 2 h.'
contrasts:
