# PREREG secs. 3 - 4, reader A (blind). Key what the source prints; do not judge it.
source: kang2026
pdf: data/articles/Kang2026.pdf (+ Kang2026_supplementary.pdf)
reader: a
scope_note: 'Base pot is TTCA (cysteine-xylose Maillard intermediate), not free precursors. Printed 0.000 / ND keyed nd_no_limit;
  Table 1 Met MFT cell prints a dash, keyed nd_no_limit. Inconsistencies keyed as printed: Table S5 ''pH 7, 120 C'' column
  equals Table S4 ''100 C'' column; Table S4 ''120 C'' column equals Table 1 Control but in μg/L vs mg L-1 (text also quotes
  S4 values in mg L-1). Final pH (5.1/4.9/4.7) printed only for the pH series. 2-Acetylfuran and 1-(2-furanyl)-ethanone are
  the same compound printed as two rows. Quant type: absolute where Table 1 asterisk / Table S3 curve, else relative. Table
  S4 pyrazines all 0 not keyed; S5 norfuraneol all 0 not keyed. Methods list 13 amino acids, Table 1 prints 8.'
contrasts:
