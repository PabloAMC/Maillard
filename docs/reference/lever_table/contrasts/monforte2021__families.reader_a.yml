# Reader A, second keying round (odorant families). Rules: PREREG.md secs. 3 - 4.
source: monforte2021
pdf: data/articles/monforte2021.pdf
reader: a
scope_note: 'Phenylacetaldehyde only (PTR-TOF-MS, ppbv). Not keyed: metal addition (Fe2+/Cu2+ vs none; no lever class), SO2
  addition vs none (release 0.0375 vs 0.0058, text p. 5; SO2 is a trap, not a sulfur source), and order of glucose vs metal
  addition (Fig. 3). Table 1 conditions: sec. 2.2 says the temperature series used Phe + gallic acid + Fe2+/Cu2+, sec. 3.2
  says a solution with Phe, glucose, gallic acid and metals; keyed as sec. 3.2 states. Table 2 ''release'' values are ppb
  in the swept headspace per unit time (an emission rate, quantity: rate); Fig. 4 cumulative curves (amount purged) digitised
  at 60 min since no table prints them.'
contrasts:
