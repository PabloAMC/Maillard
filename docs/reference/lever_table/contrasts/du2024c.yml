source: du2024c
pdf: data/articles/du2024c.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Readers agree on all 110 contrasts (every arm value, lever, ph_control);
  base reader a. 3 (initial pH 5.8 / 7.0 / 10.0 in 0.2 M phosphate) x 2 (linoleic acid 0 / 1.5 %) x 2 (reheated or not) factorial,
  Table 3, ug/L by internal standard with response factor 1 (relative). Keyed: pH ladders in each linoleic x reheating cell,
  and linoleic acid added vs none in each pH x reheating cell. Not keyed: reheating (5 d at 0 C then 10 min boiling; storage
  plus extra heating, not one sec. 4 lever). ''Total of pyrazines'' read from the rotated Table 3 continuation. Printed 3-ethyl-2,5-dimethylpyrazine
  is 2-Ethyl-3,6-dimethylpyrazine. No final pH printed. Conventions (resolver, uniform with batch 1): printed ND, ''-'', blank
  or 0 is nd_no_limit with value null; all-ND contrasts kept; one compound printed twice carries duplicate_of; co-eluting
  mixtures odorant_unlisted; odorant names canonicalised to the compound_keys display name, printed name in odorant_printed;
  IS semi-quantification and SIFT-MS ppb relative, calibration with authentic standards absolute.'
