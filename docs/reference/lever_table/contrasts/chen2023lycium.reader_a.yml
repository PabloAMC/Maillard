source: chen2023lycium
pdf: data/articles/chen2023.pdf
reader: a
scope_note: One categorical lever (six sugars, each 0.3 g with 1.0 g LSH + 0.15 g L-cysteine, initial pH 7.5, 120 C, 120 min, sealed ampoule); GC-MS (Table S1) and GC-IMS (Table S2) keyed as separate contrasts.
  ND = not detected, no LOD (nd_no_limit). Table S1 GC-MS ng/g are single-internal-standard semi-quantitation, keyed as peak_area. No other lever varied. Table S1 prints FFT twice (row 5 'Furfuryl mercaptan'
  and row 21 '2-Furfurylthiol') with differing F- and G-MRPs values; both keyed, resolver to decide.
