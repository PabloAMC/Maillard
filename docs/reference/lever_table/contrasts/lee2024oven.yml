source: lee2024oven
pdf: data/articles/lee2024.pdf
reader: resolved
scope_note: 'Resolved 2026-11-14 (temperature/time round). All values digitised (digitised: true) from Fig. 1 (acetic acid,
  furfural, 5-methylfurfural, furfuryl alcohol, 5-HMF; G and G+L) and Fig. 2 (3-methylbutanal and four pyrazines; G+L plotted
  only); no table prints them. Unit as on the axes, nmol.L_air-1.g_DM-1 (text says mmol; axis followed); TD-GC-MS with deuterated
  IS and calibration (absolute). n per temperature from the legends (140 C n=4, 170 C n=6, 200 C n=4; 25 and 50 Hz runs pooled
  as the paper does); error bars unlabelled, sd null. Sampling times are the medians of 4-min trapping windows; 140 C carries
  88, 93 and 118 min points. Keyed: (1) time ladders, one per odorant x recipe x temperature, every sampling time kept (reader
  A only; re-read); (2) temperature 140/170/200 C per odorant x recipe at ONE time, 88 min, the longest time sampled at every
  temperature (the paper names no main-result time); (3) L-leucine added (G+L) vs none (G) per odorant x temperature at ONE
  time, the longest at that temperature (118 min at 140 C, 88 min at 170 and 200 C). Both readers keyed (2) and (3) with every
  sampling time inside one contrast; they are reduced here to that one time (PREREG sec. 3, Dependence). Per point: both readers
  numeric within 0.05 dex -> mean; otherwise re-read by pixel digitising of the embedded 300 dpi figure (marker centre against
  the axis ticks; occluded triangles located from their visible base or apex). below_value (reading floor, not a printed LOD)
  is kept only where both readers read it so, at the larger of the two floors; a point at the zero line that only one reader
  censored is dropped. 3-MB at 200 C from 10 min (hatched, above the calibration range) is not keyed (no above_range censor).
  G arms of the Strecker markers (Fig. 2, not plotted; text: only found in G+L) are nd_no_limit, as both readers keyed them.
  Dropped contrasts (fewer than two keyable arms): 3-MB time ladder at 200 C, 3-MB temperature contrast (no 140 C point at
  88 min, 200 C above range), 3-MB leucine contrast at 200 C, 5-HMF G+L temperature contrast and 5-HMF leucine contrast at
  170 C (G+L 170 C 88 min triangle hidden). Not keyed: convection 25 vs 50 Hz (Table 2 prints ANOVA p-values only); text-only
  fold statements; Fig. 4, which reprints the matrix F and 5-HMF data of Lee et al. 2022 (Food Chem 376:131917) with model
  fits: no keyed value comes from Lee et al. 2022. Odorant names are compound_keys display names (furfuryl alcohol -> 2-Furanmethanol);
  ''Pyrazine'' is the single compound (unsubstituted pyrazine), not the class that the key ''pyrazine'' resolves to; printed
  names in odorant_printed. Precursor amounts, pH and water not printed (batter per Lee et al. 2020).'
