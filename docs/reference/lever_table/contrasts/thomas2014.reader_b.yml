source: thomas2014
pdf: data/articles/thomas2014.pdf
reader: b
scope_note: Values digitised from Fig. 2 (no table); C+F and C+X series lie on the zero baseline and overlap, so their arms
  (and the fructose-vs-xylose sugar-identity contrasts at each cysteine dose) carry no readable number; thiamine series x10000
  a.u. read at ~0.1-0.5 resolution; H2S appears only in Table 1 (commercial ham, no contrast); cooking 40-69 C at 0.1 C/min
  then 120 min at 69 C (time_min 410 = ramp + hold).
