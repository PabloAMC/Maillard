# Reader b, blind double-keying, second round (families). Rules: PREREG secs. 3 - 4.
source: "farmer1992"
pdf: "data/articles/farmer1992.pdf"
reader: "b"
scope_note: "Cysteine and ribose are added together, so the Maillard-reactant contrast is keyed as 'mixed'; lipid-identity contrasts keyed per +/- column; tr,cis/cis,tr-2,4-decadienal, other alkenals/alkadienals, ketones, other alcohols and other 2-alkylfurans are not on the declared list and not keyed; 2-octenal and 2-nonenal printed without stereo-descriptor."
contrasts:
  - id: "farmer1992-1"
    odorant: "hexanal"
    lever_class: "mixed"
    lever: "cysteine + ribose absent vs present (two precursors added together), lipid BTG"
    focal: true
    location: "Table 1, No. 1, p. 490 - 491"
    digitised: false
    unit: "RPA (relative peak area)"
    quant_type: "peak_area"
    quantity: amount
    time_course_rule: "not a time course"
    note: "RPA = relative peak area (1 ng 1,2-dichlorobenzene = 100), mean of quadruplicate with SD in parentheses; printed 0 keyed as value 0 with censor nd_no_limit."
    arms:
      - label: "BTG -"
        lever_value: "without cysteine + ribose"
        value: 8310
        censor: none
        limit: null
        n: 4
        sd: 76
        conditions:
          ph: 5.6
          ph_basis: "label"
          temp_C: 140
          time_min: 60
          precursors:
            "beef triglyceride": "30 mg"
          buffer: "0.5 M phosphate, pH 5.6, 2 mL"
          matrix: "buffer + beef triglyceride emulsion"
          headspace: "inert (N2 flushed, flame-sealed ampoule)"
      - label: "BTG +"
        lever_value: "with cysteine + ribose"
        value: 3900
        censor: none
        limit: null
        n: 4
        sd: 1870
        conditions:
          ph: 5.6
          ph_basis: "label"
          temp_C: 140
          time_min: 60
          precursors:
            "beef triglyceride": "30 mg"
            "L-cysteine": "5 mg/mL (2 mL)"
            "D-ribose": "4.5 mg/mL (2 mL)"
          buffer: "0.5 M phosphate, pH 5.6, 2 mL"
          matrix: "buffer + beef triglyceride emulsion"
          headspace: "inert (N2 flushed, flame-sealed ampoule)"
