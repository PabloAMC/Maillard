source: "wei2019flax"
pdf: "data/articles/wei2019.pdf"
reader: "b"
scope_note: "Only 'Pyrazines (6)', a printed class sum, qualifies (keyed as total pyrazines); furans, aldehydes, alcohols are class sums with no listed odorant; individual compounds are in supplementary material not in the PDF. Values semi-quantified vs one internal standard (1,2-dichlorobenzene). pH-series and thermal-series temperature/time/cysteine are not stated per series (methods give 100-140 C, 0-180 min, 0.15 g Cys for the pH series); cysteine series conditions from p. 88 text (120 C, 2.0 h, initial pH 7.5). Printed '0' keyed as nd_no_limit with value 0. Temperature keyed at 120 min (conclusion's main condition, 120 C/120 min); time keyed as one series per temperature. Xylose 1.0 g per methods (conclusion says 0.3 g)."
contrasts:
