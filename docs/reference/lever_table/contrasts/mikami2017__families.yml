source: mikami2017
pdf: data/articles/mikami2017.pdf
reader: resolved
scope_note: 'Resolved from readers A and B. HMFO (4-hydroxy-5-methyl-3(2H)-furanone) keyed as Norfuraneol (NF). All values
  digitised from Figs. 3 and 6B (no table prints them); Fig. 3 values are % of a stated 100 % amount (24, 20, 33 mg/100 mL
  for panels A, B, C), an amount scaled by one constant (quant_type relative). Contrast 12 (Fig. 6B) is added HMFO heated
  alone at pH 8 and its remaining amount: system fed_odorant (stability, not formation); on re-read its 3 h and 6 h points
  sit on the zero line of the 0-2 mM axis (below digitising resolution, about 0.02 mM), keyed nd_no_limit.'
