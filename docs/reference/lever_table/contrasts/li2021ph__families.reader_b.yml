source: li2021ph
pdf: data/articles/li2021.pdf
reader: b
scope_note: Only Fig. 4 prints per-arm values (hexanal, furfural, 2-pentylfuran; digitised, error bars read as SD, n = 3);
  other odorants (methional, benzeneacetaldehyde, 2-methylbutanal, benzaldehyde, heptanal) are only in supplementary Table
  S2, not in the PDF. Arms with a value printed in the text (A100-35, B100-35 hexanal and furfural; A100-5 2-pentylfuran)
  use the printed number. Unheated controls (A0, B0; 25 C, no heating) not keyed as a lever.
