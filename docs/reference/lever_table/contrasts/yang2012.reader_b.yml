# Reader B, STATUS_AND_PLAN sec. 0 step 11 (A6 batch 2). Keyed blind; PREREG secs. 3 - 4 + A1 - A6.
source: yang2012
pdf: data/articles/yang2012.pdf
reader: b
scope_note: 'The 29-run Box-Behnken RSM (Table 2) reports only a sensory score per run, no odorant value, so no RSM contrast
  is keyable. Keyed: Table 4 Groups I / II / III (precursor sets, Table 3) at the optimal condition, against Group I. Assumed
  the reference groups ran at the optimal condition (132 C, 95 min, 50 mL 0.2 M phosphate, pH 4.8 initial) - the paper does
  not restate it. Group I* (13C-labelled) has no Table 4 column. Other Table 4 compounds are off the declared list.'
contrasts:
- id: yang2012-1
  odorant: 2-methyl-3-furanthiol
  lever_class: sulfur source
  lever: 'sulfur-donor set: GSH + cysteine + thiamine vs GSH + cysteine vs GSH alone (xylose fixed)'
  focal: true
  location: Table 4 (groups defined in Table 3)
  digitised: false
  unit: mg/mL (as printed; internal standard, response factor 1)
  quant_type: relative
  time_course_rule: not a time course
  ph_control: buffered
  arms:
  - label: Group I
    lever_value: GSH + cysteine + thiamine
    value: 0.62
    censor: none
    limit: null
    n: 3
    sd: null
    conditions:
      ph: 4.8
      ph_basis: initial
      final_ph: null
      final_ph_location: ''
      temp_C: 132
      time_min: 95
      precursors: &id001
        GSH: 0.19 mmol
        cysteine: 0.19 mmol
        D-xylose: 0.67 mmol
        thiamine: 0.02 mmol
      buffer: 0.2 M phosphate (50 mL)
      matrix: buffer
      headspace: sealed, unstated
  - label: Group II
    lever_value: GSH + cysteine (no thiamine)
    value: 0.61
    censor: none
    limit: null
    n: 3
    sd: null
    conditions:
      ph: 4.8
      ph_basis: initial
      final_ph: null
      final_ph_location: ''
      temp_C: 132
      time_min: 95
      precursors: &id002
