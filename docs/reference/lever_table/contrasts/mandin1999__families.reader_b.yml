source: "mandin1999"
pdf: "data/articles/mandin1999.pdf"
reader: "b"
scope_note: "Table 2 only; 'nd' printed without a limit; RSD printed only as a 2-25% range (no per-cell SD). Pairs with both arms nd not keyed. Odorants keyed: hexanal, heptanal, 1-octen-3-ol, 2-pentylfuran, (E)-2-octenal, (E)-2-nonenal, (E,E)-2,4-decadienal, methional (1-pentanol, 2,4-nonadienal, (E,Z)-2,4-decadienal out of list)."
