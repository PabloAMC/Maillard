source: zhang2018soypep
pdf: data/articles/zhang2018.pdf + supplement (zhang2018_supplementary.txt, Tables S1-S4)
reader: resolved
scope_note: 'Resolved: readers A and B agree on every arm value and on structure; the report''s ONLY A / ONLY B rows were name and location spellings. All rows checked against the supplement text (Tables
  S1, S2). 2 x 4 design (xylose + soybean peptides, without / with 0.1 g cysteine, 80 / 100 / 120 / 140 C): one temperature ladder per cysteine state and one none-vs-cysteine pair per temperature, keyed
  only where the compound is detected in at least one arm. Every value is a percentage of total GC-MS peak area: quantity: share, enters no cell (amendment A1); no amount is printed. ''-'' = not detected,
  no limit; no SD or n printed. Bis(2-furfuryl)disulfide is printed in Table S1 (XS-140 only) and again in Table S2 (XSC-120, XSC-140) with different values: both kept, the Table S2 contrasts marked duplicate_of.
  No H2S, MFT disulfide or mixed disulfide row.'
