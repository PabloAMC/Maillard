source: kang2026
pdf: data/articles/Kang2026.pdf (+ Kang2026_supplementary.pdf)
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 9, post-A6). Base reader b (28) plus reader a''s pyrazines class-total pH contrast
  (text p. 3243: ''detected only at pH 8'', 0.838 mg/L = sum of the three S5 pyrazines; S5 prints 0.000 at pH 5.5 and 7),
  keyed as kang2026-29, incidental. Reader b''s extra contrasts (S4 pyrazine, methylpyrazine, 2,5-dimethylpyrazine x temperature
  and S5 norfuraneol x pH, all arms 0.000) kept by convention. Base pot is TTCA (cysteine-xylose Amadori/Maillard intermediate).
  Paper inconsistencies keyed as printed: Table S5 ''pH 7'' column (at 120 C) equals Table S4 ''100 C'' column; Table S4 ''120
  C'' column equals Table 1 Control, Table 1 in mg/L vs S4 in ug/L (the text also quotes S4 values in mg/L). Final pH 5.1/4.9/4.7
  (text p. 3243) on the pH series only. Table 1 prints ''2-Acetylfuran'' (RI 1491) and ''1-(2-Furanyl)-ethanone'' (RI 1497),
  one compound: the second row carries duplicate_of the first; the S4 row ''1-(2-Furanyl)-ethanone'' is the only row there
  and is keyed as 2-acetylfuran. quant_type as both readers agreed: absolute for compounds asterisked in Table 1 / with a
  Table S3 curve; Table 1''s 2-acetylthiazole carries no asterisk (relative) although S3 prints a curve for it. Storage-loss
  rates (A1) not keyed. Conventions applied (resolver, uniform across batch 1): a printed ND, ''-'', ''–'', blank, 0, 0.000
  or 0±0 is censor nd_no_limit with value null; contrasts whose arms are all not detected are kept (keyed, counted, enter
  no estimate); only run pairs differing in exactly one factor are keyed; odorant names canonicalised to the compound_keys
  display name with the printed name in odorant_printed; quant_type absolute only where the paper states calibration with
  authentic standards for that compound, internal-standard semi-quantification relative.'
