source: zhang2018soypep
pdf: data/articles/zhang2018.pdf + supplement (Tables S1-S4)
reader: b
scope_note: 'Values are % of total GC-MS peak area (share), no SD. 2x4 design: temperature ladders and none-vs-cysteine pairs keyed; rows with every arm nd skipped. 3-methylbutanal (''3-Methyl butanal''
  and ''Butanal, 3-methyl-'', Table S4) and 2-acetylfuran (''Ethanone, 1-(2-furanyl)-'', Tables S2 and S4) are each printed as two rows; each row keyed as printed. Only alkylpyrazines, the parent pyrazine
  and the printed ''Pyrazines (21)'' sum are keyed (alkenyl, methylthio and hydroxymethyl pyrazines not keyed).'
contrasts:
