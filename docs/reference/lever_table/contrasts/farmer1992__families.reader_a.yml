# One file per source and reader. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4. Key what the source prints.
source: "farmer1992"
pdf: "data/articles/farmer1992.pdf"
reader: "a"
scope_note: "Table 1 RPA (relative peak area vs 1 ng 1,2-dichlorobenzene = 100; mean (SD), quadruplicate). Two levers keyed per odorant: (i) cysteine + ribose added vs buffer alone, per lipid (two precursors added together: lever_class mixed, focal); (ii) lipid identity BTG / BPL / PC / PE, within the - and within the + series (lipid, incidental). A printed 0 (no SD) keyed as value 0 with censor nd_no_limit (no LOD printed). Pentanal, (E)-2-octenal stereo not printed (keyed as printed 2-octenal / 2-nonenal). Table 4 class sums not keyed."
contrasts:
  - id: "farmer1992-1"
    odorant: "hexanal"
    lever_class: "mixed"
    lever: "cysteine + ribose added vs buffer alone (BTG)"
    focal: true
    location: "Table 1, no. 1, p. 490"
    digitised: false
    unit: "relative peak area (RPA, 1 ng 1,2-dichlorobenzene = 100)"
    quant_type: "peak_area"
    quantity: amount
    time_course_rule: "not a time course"
    arms:
      - {label: "BTG -", lever_value: "none", value: 8310, censor: none, limit: null, n: 4, sd: 76, conditions: {ph: 5.6, ph_basis: "label", temp_C: 140, time_min: 60, precursors: {beef triglyceride: "30 mg", volume: "2 mL"}, buffer: "0.5 M phosphate pH 5.6", matrix: "buffer", headspace: "inert (N2 blown over, flame-sealed ampoule)"}}
