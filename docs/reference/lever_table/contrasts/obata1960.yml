source: "obata1960"
pdf: "data/articles/obata1960.pdf"
reader: "resolved"
scope_note: "Table I only. Heated (120 C oil bath) aqueous solutions of sulfur compounds, no sugar; values are cumulative H2S swept out of the flask by CO2. Sulfur-source contrast at 6 h (longest time; no main time stated). 100 ml water here vs 10 ml in mizutani1960, so the cystine/cysteine arms are not duplicates. Both readers agreed on every row; level names normalised to plain lower-case and odorant to the canonical name."
