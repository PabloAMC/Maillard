source: yang2012
pdf: data/articles/yang2012.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader a (15). Readers agree on every Table 4 value (5 odorants
  x Groups I / II / III; reader b keyed one three-level sulfur-source network). Decided call: Group I vs II (thiamine added
  or not, GSH + cysteine + xylose fixed) and Group II vs III (GSH 0.19 + cysteine 0.19 mmol vs GSH 0.37 mmol) are sulfur source;
  Group I vs III (thiamine and cysteine removed, GSH doubled) is mixed. The 29 Box-Behnken RSM runs (Table 2) report only
  a sensory score: no contrast. Groups assumed run at the optimal condition (132 C, 95 min, 50 mL 0.2 M phosphate, initial
  pH 4.80; buffered). ''mg/mL'' as printed, internal standard with response factor 1 (relative). Group I* (13C-labelled) has
  no Table 4 column. No final pH printed. Conventions (resolver, uniform with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit
  with value null; all-ND contrasts kept; one compound printed twice carries duplicate_of; co-eluting mixtures odorant_unlisted;
  odorant names canonicalised to the compound_keys display name, printed name in odorant_printed; IS semi-quantification and
  SIFT-MS ppb relative, calibration with authentic standards absolute.'
