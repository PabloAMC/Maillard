# Reader B, STATUS_AND_PLAN sec. 0 step 9 keying. Rules: PREREG secs. 3 - 4 and A1 - A6.
source: kang2026
pdf: data/articles/Kang2026.pdf (+ Kang2026_supplementary.pdf)
reader: b
scope_note: 'Three single-lever series: Table S4 temperature (100/120/140 C, initial pH 7, 120 min), Table S5 initial pH (5.5/7/8,
  120 C; final pH 5.1/4.9/4.7 printed in text), Table 1 amino-acid identity (9 arms vs TTCA control, pH 7, 120 C). ''0.000''
  keyed value 0 nd_no_limit; Table 1 ''—'' keyed nd_no_limit (undefined symbol). Table 1 unit read off the rendered page as
  ug/L (text layer gives mg). Inconsistency printed: S5 ''pH 7'' column equals S4 ''100 C'' column, while S4 ''120 C'' equals
  Table 1 Control; keyed as printed. Table 1 lists both ''2-Acetylfuran'' (RI 1491) and ''1-(2-Furanyl)-ethanone'' (RI 1497),
  the same compound by name; both keyed. Final pH of S4 and Table 1 arms not printed. Quant: asterisked compounds standard
  curve + IS (absolute), others IS only (relative). Storage loss rates (A1 rates) not keyed.'
