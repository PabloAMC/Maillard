# Reader b, blind double-keying, second round (families). Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: vanlancker2012
pdf: data/articles/vanlancker2012.pdf
reader: b
scope_note: 'Tables 1-9: one amino-acid-identity contrast per compound per table over all printed columns (free mixtures, glycine-alone controls, di-/tripeptides;
  peptide vs free keyed as amino acid identity, no closer class). Table 10: temperature ladders (100-180 C) for glycine and for diglycine, plus Gly vs GlyGly at each
  temperature; 100 C arms all not detected. Table 10 furans other than furfural, 5-methylfurfural and 2-acetylfuran keyed with odorant_unlisted, as are non-alkyl
  pyrazines. Cross-table carbonyl comparisons not keyed (two levers, qualitative only).'
contrasts:
- id: vanlancker2012-1
  odorant: unsubstituted pyrazine
  lever_class: amino acid identity
  lever: 'amino compound: X-Lys dipeptides vs free X + Lys; carbonyl glucose'
  focal: true
  location: Table 1
  digitised: false
  unit: GC-MS peak area x 10^8
  quant_type: peak_area
  quantity: amount
  time_course_rule: not a time course
  arms:
  - label: Gly + Lys
    lever_value: free Gly + Lys
    value: 1.46
    censor: none
    limit: null
    n: null
    sd: null
    conditions:
      ph: 8
      ph_basis: initial
      temp_C: 130
      time_min: 120
      precursors:
        glycine: 1 mmol
        lysine: 1 mmol
        glucose: 1 mmol
      buffer: none (unbuffered)
