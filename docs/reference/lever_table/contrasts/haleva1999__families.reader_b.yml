# Reader b, blind. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
# YAML anchors (&name) define each pot's conditions once; aliases (*name) reuse them.
source: "haleva1999"
pdf: "data/articles/haleva1999.pdf"
reader: "b"
scope_note: "In-scope odorants: 5-methylfurfural (MF, Table 1, mg/L, HPLC with standards) and Furaneol (HDMF, Fig. 1 and Fig. 2, digitised; Fig. 1A and 1C have log axes). HMF is outside the odorant list. Table 1 prints mean +/- SEM (n = 3); SEM is not an SD so sd is left null. ND has no printed limit (nd_no_limit). Fig. 1A pH 5 rhamnose-only bars are absent except Cys 5 and 10 mM (text: Furaneol not detected with rhamnose alone, <0.5 mg/L with 5 and 10 mM Cys); absent bars keyed nd_no_limit; the all-ND AcCys/rhamnose ladder is not keyed. Rhm+Arg at pH 7 and glucose Furaneol (~2 mg/L) are 'data not shown'. Fig. 2 (loss of added Furaneol at pH 3.5, no sugar) keyed as quantity rate. Factorial design (pH x arginine x thiol type x thiol dose) keyed along every single-lever direction."
contrasts:
