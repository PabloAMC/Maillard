source: zhou2023c
pdf: data/articles/zhou2023c.pdf
reader: resolved
scope_note: 'Fig. 1 heat map prints numeric cell values (keyed as printed, digitised false; unit not stated, values match
  Table 1 ug/L); printed 0 keyed nd_no_limit. Sulfur source (ARP alone vs +GSH vs +Cys) keyed as one 3-level categorical contrast
  at 60 min, the only time with all three arms and the time of Table 1; reader B''s added-vs-none pairs (precursor dose, partly
  at 120 min) and GSH-vs-Cys pairs are subsumed. Fig. 1 ARP+GSH-60 and ARP+Cys-60 pyrazine cells equal the Table 1 values
  (same pots): they enter the sulfur-source cell via Fig. 1 and the amino-acid-identity cell via Table 1. Table 1 column order
  GSH, Glu, Cys, Gly, pGlu (pyrazine Cys 11.0, Gly 5.97, re-read). Fig. 5a digitised. Not keyed: all-zero ARP-alone time series
  (pyrazines, 2-acetylthiazole); 2,3-butanedione; 2-propionylfuran (unlisted furan, keyed by neither reader); sulfur volatiles
  and thiols.'
