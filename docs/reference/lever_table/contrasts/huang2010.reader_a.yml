source: huang2010
pdf: data/articles/huang2010.pdf
reader: a
scope_note: 'SIFT-MS headspace ppb (relative). Keyed: Table 3 pH ladders (alkalized before / after roasting), Fig. 1-2 pyrazines
  (digitised; low-pH points of Fig. 1 unreadable at the 300000 ppb scale so only readable arms keyed; the unlabelled pH 5.2/5.3
  points of Fig. 1-2 not in Table 3 skipped), before vs after roasting at matched final pH as mixed, Fig. 3 pH ladders and
  40 vs 70 C pairs (digitised). Not keyed: Fig. 4-5 (ratios), Fig. 6 commercial powders (proprietary processes, not one lever),
  (E,Z)-2,6-nonadienal and other unlisted compounds; DMP and 2-/3-methylbutanal are printed mixtures (odorant_unlisted).'
contrasts:
