scope_note: Arms printed '+' (present, quantification confounded by adjacent peak) keyed with value null and censor none (no
  category fits). tr = <0.5 ng/mmol sugar; '-' = below detection limit ~0.1 ng/mmol sugar. Only the paper-discussed mixed
  pair (unbuffered vs phosphate 4.2) keyed; phthalate 5.6 vs phosphate 4.2 and other two-lever pairs not keyed. Table 2 has
  no thiol.
