source: huang2010
pdf: data/articles/huang2010.pdf
reader: b
scope_note: 'SIFT-MS headspace ppb (relative). Table 3 aldehydes/furans keyed as pH ladders per series; pyrazines (Figs 1-2)
  and the 40/70 C hold experiment (Fig. 3) digitised; Fig. 1 values below ~10,000 ppb are at the plot''s resolution limit
  (about +-2,000 ppb) and the pH 5.9 before-TrMP point is hidden under other markers. Not keyed: 2,3-diethyl-5-methylpyrazine
  and other compounds off the declared lists; commercial cocoa powders (Fig. 6; proprietary processes differ in more than
  pH); before- vs after-roasting at matched pH (pH not matched and the lever is process order); the ratio plots (Figs 4-5).'
