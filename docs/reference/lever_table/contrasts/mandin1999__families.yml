source: mandin1999
pdf: data/articles/mandin1999.pdf
reader: resolved
scope_note: 'Table 2 only (ug recovered from 400 mL, internal standard without response factors: peak_area). Single-lever
  pairs only: glucose added, methionine added, linoleic acid added (each against the system without it) and potato starch
  added (L/M/G vs L/M/G/S, keyed as matrix: the paper tests starch binding and concludes it acts as extra carbohydrate). Reader
  b''s two-lever pairs (e.g. G vs L, L/G vs L/M) not keyed: the paper discusses no such pair as a contrast. Pairs with both
  arms nd not keyed; nd printed without a limit (nd_no_limit). Family compounds off the declared list (1-pentanol, 2-heptenal,
  2-ethylhexanal, decanal, 2,4-nonadienal, (E,Z)-2,4-decadienal) not keyed by either reader.'
