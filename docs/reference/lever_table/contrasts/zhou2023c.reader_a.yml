    odorant: "2-methyl-3-furanthiol"
    lever_class: "sulfur source"
    lever: "added sulfur compound: none vs GSH vs Cys (with ARP)"
    focal: false
    location: "Fig. 1"
    digitised: false
    unit: "unstated (heat-map cells; calibrated against standards)"
    quant_type: "absolute"
    time_course_rule: "main result time"
    arms:
      - label: "ARP-60 min"
        lever_value: "none"
        value: 0
        censor: nd_no_limit
        limit: null
        n: 3
        sd: null
        conditions:
          ph: 7.5
          ph_basis: "initial"
          temp_C: 120
          time_min: 60
          precursors: {ARP: "20 mmol/L"}
          buffer: "none (pH set with 3 mol/L NaOH)"
