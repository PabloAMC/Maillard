source: "zhou2023c"
pdf: "data/articles/zhou2023c.pdf"
reader: "a"
scope_note: "Thiol values only in the Fig. 1 heat map (values printed in the cells, so not digitised); Fig. 1 prints no unit (Table 1 of the same study is ug/L). Cells printed '0' keyed as nd_no_limit (the LOD/LOQ list in Methods is not attributable compound by compound). ARP-alone time series not keyed (all four arms printed 0 for MFT and FFT). Table 1 and Fig. 5 carry no thiol. Cys arm concentration in Fig. 1 not printed ('same conditions')."
contrasts:
