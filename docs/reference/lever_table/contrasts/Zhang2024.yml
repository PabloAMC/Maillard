reader: resolved
scope_note: No table prints thiol values; all arms digitised (Fig. 1a bars; Fig. 2d, 2f points). Fig. 2d/2f re-read at 600
  dpi from marker centroids; points at 0.5-10 mg/mL sit on the baseline and overlap (+-0.05 ng/mL, near the digitising floor).
  Fig. 2 ladders are non-monotone (peak near 50-62.5 mg/mL). Fig. 1 simple-model temperature not printed (sec. 2.2 gives only
  60 min); Fig. 2 pH 4.9 phosphate from sec. 2.3. Cys vs GSH at matched dose not keyed separately (same arms as the ladders).
  MMFT (methyl disulfide) not a listed odorant; supplement not read.
