# Reader b, blind. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: "mikami2017"
pdf: "data/articles/mikami2017.pdf"
reader: "b"
scope_note: "Only odorant in scope is HMFO (4-hydroxy-5-methyl-3(2H)-furanone, norfuraneol), by HPLC-DAD. No table prints values: all arms digitised from Fig. 3 bar charts (relative %, 100% = 24, 20 and 33 mg/100 mL for panels A, B, C; n = 3, error bars read as SD though the caption does not say SD or SEM). Fig. 3B is keyed both as time series (per pH) and as a pH contrast at 1 h (the paper's main heating time). Fig. 3C keyed as sugar identity per pH and pH per sugar. Fig. 6B (loss of added HMFO at pH 8, mM) keyed as quantity rate; the 6 h point is plotted at about 0. No other listed odorant is measured."
