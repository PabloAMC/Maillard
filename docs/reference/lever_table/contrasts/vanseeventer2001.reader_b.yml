source: "vanseeventer2001"
pdf: "data/articles/vanseeventer2001.pdf"
reader: "b"
scope_note: "Storage stability at 50 C, not formation: the printed quantity is the decrease in concentration (% per day, zero-order fit over 0-24 h), keyed as printed. '>90' cells have no template censor code (they are lower bounds on a loss); keyed censor above_value, limit 90. Fig. 1 cysteine ladder digitised (no table); its 0 and 150 mM points may be the same experiments as Table 1 entries 2 and 4 but the values differ (FFT 46 vs 39), so both are keyed. Air vs argon stated 'data not presented', not keyable."
contrasts:
  - id: "vanseeventer2001-1"
    odorant: "2-methyl-3-furanthiol (MFT)"
    lever_class: "mixed"
    lever: "aqueous model process flavouring (with its residual cysteine 15 mM / ribose 25 mM, thiols ~5 uM) vs reconstituted mixture in buffer (thiols 50 uM, no addition)"
    focal: false
    location: "Table 1, entries 1 vs 2"
    digitised: false
    unit: "% decrease per day"
    quant_type: "relative"
    time_course_rule: "not a time course"
    arms:
      - label: "1 model process flavoring"
        lever_value: "process flavouring"
        value: 59
        censor: none
        limit: null
        n: null
        sd: null
        conditions: {ph: 5.0, ph_basis: label, temp_C: 50, time_min: 1440, precursors: {ribose: "100 mM before heating (130 C, 20 min); residual 25 mM", cysteine: "33 mM before heating; residual 15 mM"}, buffer: "0.5 M phosphate", matrix: "other (heated ribose/cysteine process flavouring)", headspace: "air (closed bottles)"}
      - label: "2 no addition"
        lever_value: "reconstituted, no addition"
        value: 90
        censor: above_value
        limit: 90
        n: 2
        sd: null
        conditions: {ph: 5.0, ph_basis: label, temp_C: 50, time_min: 1440, precursors: {thiols_and_furanones: "50 uM each"}, buffer: "0.5 M phosphate", matrix: buffer, headspace: "air (closed glass containers)"}
