source: yang2011
pdf: data/articles/yang2011.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 9, post-A6). Base reader b (168 = 7 odorants x 24 one-factor run pairs of the 4-factor
  Box-Behnken design; reader a keyed the 119 that are not all-not-detected, values identical). Every arm value was re-checked
  against Table 1 (runs) and Table 3 (initial / final pH). Centre runs 3/9/10/15/18 differ from every other run in two factors,
  so they enter no contrast (no axial points in a Box-Behnken design). Factor C ''concentration of phosphate buffer (mL)''
  is the volume of 0.2 M phosphate buffer at fixed reactant masses: keyed lever_class precursor dose, lever ''all reactants
  diluted together'', lever_value = 1/V (higher = more concentrated); arms print the masses and the volume. quant_type set
  to relative (reader b had absolute): the paper computes IS x area ratio / response factor but does not state a calibration
  with authentic standards (standards were used for identification). Table 1 prints no unit; ug/L from the Fig. 3 axis. Not
  keyed (not on the declared list): S-ethyl ethanethioate, dihydro-2-methyl-3(2H)-furanone, 2,4,5-trimethylthiazole, dihydro-2-methyl-3(2H)-thiophenone,
  3,5-dimethyl-1,2,4-trithiolane, benzothiazole. Conventions applied (resolver, uniform across batch 1): a printed ND, ''-'',
  ''–'', blank, 0, 0.000 or 0±0 is censor nd_no_limit with value null; contrasts whose arms are all not detected are kept
  (keyed, counted, enter no estimate); only run pairs differing in exactly one factor are keyed; odorant names canonicalised
  to the compound_keys display name with the printed name in odorant_printed; quant_type absolute only where the paper states
  calibration with authentic standards for that compound, internal-standard semi-quantification relative.'
