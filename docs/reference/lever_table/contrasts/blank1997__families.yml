source: blank1997
pdf: data/articles/blank1997.pdf
reader: resolved
scope_note: 'Resolved from readers A and B (A''s structure kept; B differed mainly in odorant naming). HDMF keyed as DMHF,
  EHMF (homofuraneol) as HEMF. All values IDA means of >= 2 assays, max SD <= 10 %, ug/mmol sugar; n and sd null. Table 1
  xylose arms are the same pots as Table 3 phosphate, so the xylose amino-acid contrast (with the no-amino-acid control, footnote
  c, ''<0.01'') is keyed once from Table 3. Table 2: amino acid added to xylose/4-aminobutyric acid (none, glycine, alanine).
  Table 3 water arms: no buffer (''none''), pH 6 at the start but not controlled during heating, so the buffer contrast also
  carries pH drift. Table 5 precursor dose levels are the amino-acid-to-xylose molar ratio (1, 2, 4).'
