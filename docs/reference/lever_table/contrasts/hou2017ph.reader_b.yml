# Reader B, STATUS_AND_PLAN sec. 0 step 11 (A6 batch 2). Keyed blind; PREREG secs. 3 - 4 + A1 - A6.
source: hou2017ph
pdf: data/articles/hou2017ph.html
reader: b
scope_note: 'Table 2 is a flattened text layer of a table image (cells unseparated, blanks dropped); each value was placed
  in its pH column by reconciling against the printed subtotals (thiols, N-heterocycles, O-heterocycles, others per column).
  Two GC columns: the HP-5MS block (RI ~700-1100, printed first) is keyed, the DB-WAX block as duplicate_of. Uncertain placements:
  bis(2-furfuryl) disulfide HP-5MS (two values; subtotals put them at pH 6.5 and 7.5) and its DB-WAX values (three, left-filled).
  3-ethyl-2,5-dimethylpyrazine keyed as 2-ethyl-3,6-dimethylpyrazine. Final pH = initial - printed drop (Table 1). The 90
  C intermediate study has no odorant. Not keyed: N-heterocycle subtotal (includes pyrroles, pyridines), off-list compounds.'
