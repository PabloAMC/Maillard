# PREREG secs. 3 - 4, reader A (blind). Key what the source prints; do not judge it.
source: chen2000
pdf: data/articles/chen2000.pdf
reader: a
scope_note: Table 2 blanks keyed nd_no_limit; pairs with both arms blank not keyed. Amounts vs internal standard tridecane
  (no response factors stated) -> relative. Urea addition keyed as precursor dose (no better lever class; reader unsure).
  2,5-(and 2,6-)dimethylpyrazine is a co-elution printed as one row. Table 3 (urea + acetoin/diacetyl) holds tetramethylpyrazine
  at pH 5 vs 8.5 but is a different model system; keyed as chen2000-T3 contrast at the end.
contrasts:
