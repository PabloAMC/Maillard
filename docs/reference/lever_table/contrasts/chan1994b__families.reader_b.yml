# Reader b, blind double-keying, second round (families). Rules: PREREG secs. 3 - 4.
source: "chan1994b"
pdf: "data/articles/chan2005.pdf"
reader: "b"
scope_note: "Only the 95 C pH series of 3-methylbutanal and phenylacetaldehyde is printed as amounts (figures only, digitised); temperature, 2-acetyl-1-pyrroline and 2-acetylfuran are reported only as pooled activation energies (Table I), with no per-arm values or rate constants, so not keyed. 'Duplicates at each temperature and pH' -> n = 2."
contrasts:
  - id: "chan1994b-1"
    odorant: "isovaleraldehyde (3-methylbutanal)"
    lever_class: "pH"
    lever: "initial pH (adjusted with 0.1 M phosphate buffer and NaOH) 6 vs 7 vs 8"
    focal: true
    location: "Figs. 1 - 3, p. 136 - 137 (60 min point)"
    digitised: true
    unit: "mole (Conc. in reaction mixture)"
    quant_type: "peak_area"
    quantity: amount
    time_course_rule: "longest time"
    note: "Values read at 60 min, the longest time common to Figs. 1 - 3 (no main-result time stated); internal standard 4-methylthiazole, no response-factor calibration described."
    arms:
      - label: "95 C - pH 6 (Fig. 1)"
        lever_value: 6
        value: 0.00222
        censor: none
        limit: null
        n: 2
        sd: null
        conditions:
          ph: 6
          ph_basis: "initial"
          temp_C: 95
          time_min: 60
          precursors:
            "glucose": "0.5 mol in 400 mL"
            "methionine": "0.075 mol in 400 mL"
            "phenylalanine": "0.075 mol in 400 mL"
            "proline": "0.075 mol in 400 mL"
            "leucine": "0.075 mol in 400 mL"
          buffer: "0.1 M phosphate (pH adjustment) + NaOH"
          matrix: "water"
          headspace: "sealed pressure reactor; N2 added after each sampling"
      - label: "95 C - pH 7 (Fig. 2)"
        lever_value: 7
        value: 0.00221
        censor: none
        limit: null
        n: 2
        sd: null
        conditions:
          ph: 7
