source: chansataporn2018
pdf: data/articles/chansataporn2018.pdf
reader: resolved
scope_note: 'Resolved 2026-11-14 (step 15, A6 batch 3). The comparison tool matched 0 of 4 only because reader a keyed time
  levels in hours and reader b in minutes; after converting, the readers agree on odorant, lever, unit type and every arm
  value within 0.05 dex except furfural 0 h (a 0.004, b 0.0), re-read. Base reader b; lever_value and time_min in minutes.
  Four time courses at 100 C, all digitised from figures (no tables): pyridine in 2.3 mM glucose / 23 mM lysine in phosphate
  buffer (Fig. 1G, 0-24 h); furfural, aldehydes and pyrazines in chicken-breast extract (Fig. 5B/G/H, 0-30 h). Aldehydes and
  pyrazines are class sums (individual compounds not printed), kept as class-sum odorants following the existing resolved
  files (e.g. desousafontes2024 ''Pyrazines''). Volatiles by SPME-GC-MS vs internal standard propyl butyrate (relative); furfural
  by HPLC-DAD (absolute). 0 h values plotted on the axis read as 0.0 (not a non-detect). HMF not detected (no limit) in glucose/lysine
  and absent from chicken extract: not keyed. Glucose/lysine vs chicken extract differ in many levers and share no odorant:
  no matrix contrast. Glucose/lysine pH: methods print phosphate pH 6.5 (concentration not printed), results 6.83 initial
  -> 6.74 at 24 h. Fig. 3E/7D/8D are model-fit replots, not keyed. Ladders enter as one slope over the monotone range (sec.
  4); the pyridine 21->24 h and aldehyde 5->10 h dips are within error bars.'
