source: lee2024oven
pdf: data/articles/lee2024.pdf
reader: b
scope_note: 'All values digitised from Figs 1-2 (no table prints them; unit on axes nmol.L_air^-1.g_DM^-1 of oven vapour, text says mmol, axis followed); quantified by TD-GC-MS with deuterated IS; temp_C
  is oven set-point; time is median of 4-min vapour sampling window; error bars not labelled (sd left null). Points on the zero line keyed below_value with limit = digitisation resolution (not a printed
  LOD); 3-MB at 200 C 10-88 min keyed censor above_range (hatched, above calibration range). 3-MB 140 C 35/54/88 min not visible in Fig. 2 (omitted). G series of Strecker markers not plotted; keyed nd_no_limit
  from text. Precursor amounts and pH not printed (recipe in Lee et al. 2020). Convection lever (25 vs 50 Hz) not keyable: only ANOVA p-values (Table 2), no values. Each series keyed once as a temperature
  ladder and again in G vs G+L pairs; no separate time contrasts. Paper says vapour data are original; the matrix F/5-HMF values in Fig. 4 are from Lee et al. 2022 (Food Chem 376:131917) and were not keyed.'
