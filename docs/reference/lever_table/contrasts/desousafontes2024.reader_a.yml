source: "desousafontes2024"
pdf: "data/articles/desousa-fontes2024.pdf"
reader: "a"
scope_note: "Only F4 vs F6 (Table 2) keyed: H and GV differ from the flavorings in heating, supplements and pH (not one lever); model systems M4/M6 have no printed values ('data not shown', Fig. 2 is a standardised heat map). No supplementary file in data/articles. Concentrations are IS (1,2-dichlorobenzene) semi-quantification, keyed quant_type relative. No final pH printed (Table 1 has no pH row). (Z)-2-nonenal printed, not the declared (E) isomer: not keyed. 2-Acetylfuran (furans) and 2-furyl methyl ketone (ketones) are the same compound printed as two rows; both keyed as printed. Location column/italic (polar-column) status not distinguishable in text extraction. No H2S measured."
