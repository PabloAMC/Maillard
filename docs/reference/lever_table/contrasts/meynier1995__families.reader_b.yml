# Reader b, blind. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
# YAML anchors (&name) define each pot's conditions once; aliases (*name) reuse them.
source: "meynier1995"
pdf: "data/articles/meynier1995.pdf"
reader: "b"
scope_note: "Tables 1-4: amino acid (100 mM) + ribose (70 mM) in 0.2 M pyrophosphate, pH 4.5 - 6.5, sealed ampoules, 140 C, 1 h; 'approximate quantities' from GC area vs octadecane internal standard without response factors (keyed peak_area); mean of 3 replicates, CVs < 20% stated globally, no per-arm SD. nd = not detected, LOD c. 10 ng/10 mg ribose (0.01 ug/10 mg); tr = trace (<0.1 ug/10 mg ribose). pH basis keyed 'held': adjusted before heating, measured after, no change > 0.2 unit. Table 3 prints 'Dimethypyrazine' (LRI 912, same as 2,5-dimethylpyrazine in Tables 1-2). Excluded: MFT, 2-furylmethanethiol and dimethyl di/trisulfides (thiols/sulfides), pyridines, thiophenes, 4,5-dihydro-2-methyl-3(2H)-furanone, 2-furylmethyl methyl sulphide (not in the odorant list). Amino-acid-identity contrasts span Tables 1-4 at each pH."
contrasts:
