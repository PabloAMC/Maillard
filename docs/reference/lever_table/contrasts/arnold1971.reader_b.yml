source: "arnold1971"
pdf: "data/articles/arnold1971.pdf"
reader: "b"
scope_note: "H2S only. Figs 4-5 digitised (no table); Table I used for open-air and nitrogen time series and the open-air vs nitrogen contrast (Fig 5 30-min points for those systems not keyed, table preferred). pH 3.5/5.0 and pH<5.5 points carry no markers (curves at ~0); oxidant (ferricyanide/permanganate) and cysteine arms and the chicken-broth test print no numbers and were not keyed."
