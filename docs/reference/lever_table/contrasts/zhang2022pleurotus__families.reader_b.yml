source: "zhang2022pleurotus"
pdf: "data/articles/zhang2022b.pdf"
reader: "b"
scope_note: "Table 3 keyed as sulfur source (Cys / Met / Thi, each with xylose); the two-lever control PCH-TDPs keyed only for total pyrazines, the comparison the paper discusses; pyrazines detected only in the control (ethylpyrazine, 2,3-dimethylpyrazine, 2-ethyl-5-methylpyrazine, 2-ethenyl-6-methylpyrazine) not keyed; ND printed without a limit."
contrasts:
  - id: "zhang2022pleurotus-1"
    odorant: "methional"
    lever_class: "sulfur source"
    lever: "L-cysteine vs L-methionine vs thiamine (equal S, with xylose)"
    focal: true
    location: "Table 3"
    digitised: false
    unit: "ng/g (peak area vs internal standard 1,2-dichlorobenzene)"
    quant_type: "peak_area"
    quantity: "amount"
    time_course_rule: "not a time course"
    arms:
      - label: "Cys-MRPs"
        lever_value: "L-cysteine"
        value: 1.2
        censor: none
        limit: null
        n: 3
        sd: 0.07
        conditions:
          ph: 7.4
          ph_basis: "initial"
          temp_C: 100
          time_min: 120
          precursors: {"P. citrinopileatus hydrolysate (PCH)": "1.0 g", "D-xylose": "0.3 g", "L-cysteine": "0.15 g (equal S content)"}
          buffer: "none"
          matrix: "plant protein (Pleurotus citrinopileatus mushroom hydrolysate), 10% w/v in water"
