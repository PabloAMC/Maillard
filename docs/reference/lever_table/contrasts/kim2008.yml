source: kim2008
pdf: data/articles/kim2008.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader a (180); the readers agree on every arm value (180 of
  180 contrasts pair value for value). Decided call: each pH arm has its own 0.5 M buffer (acetate pH 4, phosphate pH 7, carbonate
  pH 10), so pH and buffer type change together: the 60 pH ladders are lever_class mixed (reader a; reader b keyed pH), ph_control
  buffered. Sugar identity (glucose vs fructose) per amino acid and pH, and amino-acid identity (none / glycine / L- and D-asparagine
  / L- and D-lysine) per sugar and pH, as both readers keyed. Amino-acid levels written as glycine / asparagine / lysine (L)
  and ''asparagine (D-enantiomer)'' / ''lysine (D-enantiomer)'' so that the generator''s L-/D- prefix stripping does not merge
  the enantiomers; sugar alone is level ''none''. HPLC with authentic-standard calibration (absolute), mM, n = 3 with SD.
  ''Heated without pH control''; no final pH printed. HMF not keyed (off the declared list). Conventions (resolver, uniform
  with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit with value null; all-ND contrasts kept; one compound printed
  twice carries duplicate_of; co-eluting mixtures odorant_unlisted; odorant names canonicalised to the compound_keys display
  name, printed name in odorant_printed; IS semi-quantification and SIFT-MS ppb relative, calibration with authentic standards
  absolute.'
