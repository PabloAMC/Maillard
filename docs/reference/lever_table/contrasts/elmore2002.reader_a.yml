source: "elmore2002"
pdf: "data/articles/elmore2002.pdf"
reader: "a"
scope_note: "Thiols only in Table 1 (lipid lever: none, methyl linoleate 18:2n-6, methyl alpha-linolenate 18:3n-3). Approximate quantities from peak area vs 100 ng 1,2-dichlorobenzene with response factor 1 (keyed peak_area). 'tr' = <10 ng in extract from 100 mL (keyed trace, limit 10); '-' = not detected, LOD 2 ng in 100 mL (keyed nd_with_limit 2). n = 4, SD in parentheses. The 3-thienyl and 2-methyl-3-thienyl mixed disulfides are not listed thiols and were not keyed."
