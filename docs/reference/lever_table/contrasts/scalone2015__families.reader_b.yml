  acid addition as precursor dose) and Table 5 (water activity). Not keyed: sterilization rows with every arm N/D; Table 4 hydrolysed-whey glucose 7.5 vs 15 mg (reprint
  of Table 2 columns, keyed once there); roasting vs sterilization (two-plus levers: temperature, time, water; paper also attributes part of the difference to headspace
  partitioning, so no mixed contrast keyed). N/D has no printed limit. Table 5 0.16 aw column reprints Table 2 glucose 7.5 mg column.'
