source: "arnold1971"
pdf: "data/articles/arnold1971.pdf"
reader: "resolved"
scope_note: "Thiamine (no sugar) heated in 0.1 M phosphate; H2S only. Figs 4-5 digitised (no table prints them); Table I (pH 7, open air and N2 purge, 5-15 min; the same series as Fig 5, which adds 30 min) keyed from the table. Fig 4 pH 5.5 markers for open air, sealed tube and N2 sit in one blob on the baseline: text says small amounts below pH 6, so keyed present-but-not-quantified (nd_no_limit, null); no markers at pH 5.0 or 3.5. pH 6.0 markers of sealed tube and N2 overlap (digitising uncertainty about +-0.5 mmol/mol, i.e. 0.2-0.4 dex at these values); pH 6.0/6.5/7.0 values are the mean of both readers' digitisations, which agreed within 0.05 dex except at pH 6.0. 'Boiling water' keyed temp_C 100 (time counted from 96 C; reader B used 96). Sealed tube vs open air not keyed as oxygen (different vessel, volume and H2S recovery correction, not only headspace gas). Table I open air vs N2 at 15 min not keyed as an oxygen contrast: it is the 15-min point of the Fig 5 time course, whose longest time (30 min) is the Fig 4 pH 7 pair. Oxidant (ferricyanide, permanganate), cysteine and chicken-broth arms print no H2S numbers. Fig 5 30-min points are the Fig 4 pH 7 pots."
