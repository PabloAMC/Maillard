# PREREG secs. 3 - 4, reader A (blind). Key what the source prints; do not judge it.
source: raza2020
pdf: data/articles/raza2020.pdf
reader: a
scope_note: 'Face-centred CCD (21 runs). Keyed: the four axial ladders (axial-centre-axial; the five centre replicates MRP-2/3/4/8/11
  entered as separate arms) and the four factorial pairs that differ only in cysteine. No other single-factor pair exists.
  Heating time not printed. pH set with NaOH/HCl (materials list, no buffer) -> adjusted_unbuffered, reader inference. Quantified
  by external standards -> absolute. ''0±0'' cells (2,5-dimethylpyrazine MRP-10/11) keyed nd_no_limit. ND keyed nd_no_limit;
  ladders with all arms ND not keyed. 3,3''-Dithiobis[2-methylfuran] keyed as bis(2-methyl-3-furyl) disulfide. No final pH
  printed.'
