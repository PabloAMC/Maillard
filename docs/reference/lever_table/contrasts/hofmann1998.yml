source: hofmann1998
pdf: data/articles/hofmann1998.pdf
reader: resolved
scope_note: 'Aqueous conditions (0.5 M phosphate, 145 C, 20 min, autoclave) taken from Methods for all tables; pH basis not
  stated. Table 5 FFT/MFT reprint Table 1 (not re-keyed); Table 2 pH 5.0 aqueous column equals Table 1 (its sugar contrast
  keyed once via Table 1). Tables 3 and 4 vary the carbonyl precursor (not only sugars) and are keyed as sugar identity for
  want of a precursor-identity class. Table 10 hydroxyacetaldehyde/mercapto-2-propanone and thiamin arms differ in more than
  one lever, not keyed. Resolved: aqueous vs dry-heated (Tables 2, 8) keyed as mixed with levels "aqueous" / "dry-heated"
  (dry arms 300 uL 2 mol/L phosphate on 3.0 g silica gel, 180 C, 6 min, per Methods); Table 4 NF level named "norfuraneol";
  Table 10 NF/H2S arm (211.2 ug) is the same value as Table 4 NF arm (shared arm). Tables 3, 4, 8, 10 footnotes say only "aqueous
  solution ... pH 5.0"; buffer 0.5 mol/L phosphate taken from Methods.'
