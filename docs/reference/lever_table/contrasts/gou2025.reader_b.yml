# Reader B, STATUS_AND_PLAN sec. 0 step 11 (A6 batch 2). Keyed blind; PREREG secs. 3 - 4 + A1 - A6.
source: gou2025
pdf: data/articles/gou2025.pdf
reader: b
scope_note: 'Solid-state model (8 g odorless red jujube matrix + 35 mL phosphate buffer, concentration NOT printed - keyed
  buffered on the named buffer). Keyed: Table 1 amino-acid identity (pH 5.5); Tables 2 vs 3 pH 5.5 vs 7.8 at the 10 h end
  point; Tables 2, 3 heating-time ladders (2 - 10 h); Table 4 freeze-drying verification (matrix and precursor-addition pairs).
  Not keyed: Fig. 1 (calibrated 3,5-EDMP, but the tables print the compound); 2,3-dimethylpyrazine and 2-furanmethanol pH
  contrasts (each printed in only one of Tables 2/3). 3-ethyl-2,5-dimethylpyrazine keyed as 2-ethyl-3,6-dimethylpyrazine;
  ''Total'' rows of pyrazine blocks as Pyrazines. Table 4 temperature/time = freeze-dryer plate program (to 85 C 3 h, 70 C
  5 h, 65 C 1 h).'
