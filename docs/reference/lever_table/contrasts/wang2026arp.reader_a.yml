# PREREG secs. 3 - 4, reader A (blind). Key what the source prints; do not judge it.
source: wang2026arp
pdf: data/articles/Wang2026.pdf (+ Wang2026-supplementary.docx)
reader: a
scope_note: 'Base pot is Glu- and Cys-Amadori intermediates in 0.2 M PBS. The conditions held fixed in each one-factor series
  (temperature and time of the pH series, etc.) are not printed: keyed null. Methods print times 80-120 min, Table S4 prints
  60-140 min; keyed the table. Printed 0 keyed nd_no_limit. CAS 98-02-2 is printed for both ''2-Furanethiol'' and ''Furfuryl
  mercaptan'', and ''Difurfuryl disulfide'' and ''Bis(2-furfuryl) disulfide'' are two rows of what may be one compound: each
  row keyed as printed. Internal standard (1,2-dichlorobenzene) -> relative. No final pH printed.'
