source: cremer2000c
pdf: data/articles/cremer2000c.pdf
reader: a
scope_note: 'Group F. Only Fig. 1 prints values (no table): 2-MB and 3-MB are given only as mol% of their own sum (quantity:
  share); the absolute amount is printed only for that sum (right axis), which is not a listed odorant, so not keyed. Arm
  values digitised and read so that each pair sums to ~100; 2-MB at ratio 0 is a plotted 0. The Fru-Leu/OPD experiment prints
  no numbers (text only): not keyed.'
