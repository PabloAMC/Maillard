source: seo2015
pdf: data/articles/seo2015.pdf
reader: resolved
scope_note: 'Resolved 2026-11-14 (step 15, A6 batch 3). Readers agree on all 33 contrasts (every arm value, SD, n and censor;
  comparison tool reports no differences); base reader a. Table 4 re-checked against the PDF (p. 181): 230 / 250 / 280 C,
  15 min each in the direct-heated continuous reactor (Methods). Keyed: one temperature ladder per odorant (33 aroma-active
  compounds). ppm by 3-heptanol internal standard, response factor 1 (relative); n = 2 (duplicate analysis); SD as printed,
  including 3-methylbutanal 250 C 6.3 +- 9.0. Tables 2 / 3 are single-arm (250 C); Fig. 2 plots class totals of Table 4, not
  keyed. pH, headspace not reported. No amino-acid-identity or other out-of-list contrasts. Odorant names canonicalised to
  the compound_keys display name, printed name in odorant_printed; names compound_keys does not resolve take the standard
  spelling; printed ''pyrazine'' is keyed as the single compound Pyrazine (compound_keys maps it to the class key ''Pyrazines'',
  wrong for this row).'
