source: chen2023lycium
pdf: data/articles/chen2023.pdf + supplement foods-2643023-SI.pdf
reader: b
scope_note: Only lever is sugar identity (6 sugars). Table S1 (GC-MS, ng/g against one internal standard, keyed peak_area) and Table S2 (GC-IMS peak areas, no SD) are keyed separately. 'Total pyrazines'
  is the printed 'Pyrazines' subtotal row of Table S1. '3(2H)-Furanone' and other unlisted compounds are not keyed.
