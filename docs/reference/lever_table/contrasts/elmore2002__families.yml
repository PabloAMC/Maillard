source: elmore2002
pdf: data/articles/elmore2002.pdf
reader: resolved
scope_note: Listed odorants are only in Table 2 (lipid-derived; approx. ng in headspace vs 1,2-dichlorobenzene IS, n = 4).
  Lipid identity (methyl linoleate vs methyl alpha-linolenate) keyed with and without cysteine + ribose; cysteine + ribose
  added vs none keyed as mixed (two precursors added at once; discussed in text). Table 2 prints no cysteine/ribose-alone
  column. 'tr' (<10 ng) keyed trace, limit 10; '-' nd, LOD 2 ng. Pairs with both arms censored not keyed (1-hexanol lipid
  without CR; benzaldehyde CR in 18:2n-6; 1-hexanol, heptanal, 1-octen-3-ol, (E,E)-2,4-decadienal CR in 18:3n-3). Unlisted
  family members (e.g. (E)-2-heptenal, (E)-2-hexenal, 2-ethylfuran, 1-pentanol) were keyed by neither reader.
