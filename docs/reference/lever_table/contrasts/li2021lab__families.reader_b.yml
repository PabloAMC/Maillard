source: li2021lab
pdf: data/articles/li2021b.pdf
reader: b
scope_note: 2x2 design (xylose 0/3.5 x cysteine 0/1.0 g/100 mL), all at initial pH 5.5, 100 C, 60 min. 2-octenal printed without
  isomer. 2,5-dimethylpyrazine printed as 0.00 (not 'nd') in three arms, keyed as printed. nd without LOD. Unheated control
  not keyed. Values semi-quantified against 2-octanol.
contrasts:
- id: li2021lab-1
  odorant: methional
  lever_class: sulfur source
  lever: L-cysteine added (none vs 1.0 g/100 mL), xylose 0 g/100 mL
  focal: true
  location: Table 4
  digitised: false
  unit: ug/L
  quant_type: peak_area
  quantity: amount
  time_course_rule: not a time course
  arms:
  - label: L0-0
    lever_value: none
    value: 4.61
    censor: none
    limit: null
    n: 3
    sd: 0.86
    conditions:
      ph: 5.5
      ph_basis: initial
      temp_C: 100
      time_min: 60
      precursors:
        xylose: 0 g/100 mL
        L-cysteine: 0 g/100 mL
      buffer: none (adjusted with lactic acid / NaOH)
      matrix: other (Lactobacillus fermentum fermented pork hydrolysate)
