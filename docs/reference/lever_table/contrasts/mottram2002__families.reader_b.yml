source: "mottram2002"
pdf: "data/articles/mottram2002.pdf"
reader: "b"
scope_note: "Listed odorants: 2-furfural and methylpyrazine (Table 1, cysteine + ribose form, headspace, ng/mmol sugar vs IS, response factor 1, triplicate means, no SD; 'tr' <0.5, '-' below ~0.1 ng/mmol) and 2-furfural and 4-hydroxy-5-methyl-3(2H)-furanone (norfuraneol) (Table 2, sugar alone, solvent extract, ug/mmol, mean (SD) n=3; 'tr' <5 ug/mmol, '-' nd without limit). Sets whose arms are all censored not keyed (furfural sugar identity in phosphate pH 5.6; furfural buffer type for IMP; methylpyrazine unbuffered and phosphate pH 4.2 sugar sets, IMP buffer/pH sets, unbuffered vs pH 4.2; norfuraneol buffer type for ribose). Unbuffered vs phosphate pH 4.2 keyed as mixed (paper discusses this pair) for furfural only. pH arms in phosphate are held pH (paper: buffers held pH within 0.3 unit); unbuffered pH is initial; final pH given in labels."
contrasts:
