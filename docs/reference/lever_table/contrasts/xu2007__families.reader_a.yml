source: xu2007
pdf: data/articles/xu2007.pdf
reader: a
scope_note: 'pH ladders keyed separately within the control and within the SC-CO2 series (initial pH; final pH in labels).
  Not keyed: SC-CO2 (40 MPa CO2) vs control, the paper''s focal lever, which is pressure/CO2 and not a listed lever class;
  ladders with every arm below detection. ''-'' = below detection limit ~0.07 ng/mL; ''tr'' < 0.3 ng/mL; quantities vs tridecane
  internal standard, response factor 1. All-nd SC-CO2 ladders skipped: methylpyrazine, 2,6-dimethylpyrazine, 2-ethyl-6-methylpyrazine,
  trimethylpyrazine.'
