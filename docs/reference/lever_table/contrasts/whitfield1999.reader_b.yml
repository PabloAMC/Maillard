# Reader B, step 9 keying (PREREG secs. 3 - 4, A1 - A6). Key what the source prints.
source: whitfield1999
pdf: data/articles/whitfield1999.pdf
reader: b
scope_note: 'Sulfur-source contrast only (HMF + cysteine vs HMF + H2S, both 0.5 M phosphate pH 4.5, 140 C 60 min). Duplicate
  analyses printed; arm value = mean of the two (MFT: cys 15,15; H2S 16,8. bis(2-methyl-3-furyl) disulfide: cys 2,3; H2S 7,2).
  Cysteine ~0.1 mmol vs H2S ~0.2 mmol (saturated solution): molar sulfur dose not equal. No final pH printed. Other declared
  odorants not found; 2-acetyl-5-methylfuran and thiophenes not on the lists.'
