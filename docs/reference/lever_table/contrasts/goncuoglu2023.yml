source: goncuoglu2023
pdf: data/articles/goncouglu2023.pdf
reader: resolved
scope_note: 'Resolved 2026-11-14 (step 15, A6 batch 3). Readers structured the keying differently (A 281 contrasts, one per
  time point plus time courses; B 30 contrasts with whole time series as arms); resolved by the rules, not either structure.
  Keyed: salt type (categorical, 20 mmol salt per 100 g flour vs no-salt control, first arm = control) one contrast per odorant
  at the longest common time (Fig. 4, 160 C, 11 min, 7 arms; HMF Fig. 1 at 160 C 11 min, 180 and 200 C 7 min, 5 arms; no single
  main-result time is printed for these); temperature (HMF 160/180/200 C) one ladder per salt arm at 7 min, the longest time
  common to the three temperatures; time ladders per salt arm per odorant (Fig. 4 at 160 C; HMF at 160, 180 and 200 C, kept
  because valid under the rules though only reader A keyed them). lever_class ''salt type'' is outside the PREREG sec. 4 list
  and no earlier resolved file uses it (kept on the orchestrator''s instruction). Dropped: text-printed percentage changes
  (sec. 3.5) as duplicates of plotted data (2-methylpropanal, 2-methylbutanal and the 180 C pyrazine percentages are plotted
  only in the supplement, not opened); 0-min points (plotted at zero, unheated); acrylamide (not an odorant); MgCl2 (no volatile
  or HMF data). All values digitised from the PDF''s vector figures by reading each series'' plotted vertices (calibrated
  to the frame and gridlines; check: acrylamide 160 C 7 min reductions read 14/24/43/45/60/64/67 %, printed 14/24/44/45/60/64/67
  %); HMF from the insets where present, CaCl2 and 200 C from the main axes; Pyrazine CaCl2 4 min from the marker centre (vertex
  absent). Vertices are quantised at about 0.22 pt, so a point under 1.0 pt above the zero line is keyed below_value at the
  1.0 pt equivalent. Volatiles n = 2 (sec. 2.6); error bars not keyed. quant_type relative for 2-methylfuran, 2-acetylfuran,
  2-furanmethanol, 5-methylfurfural (no standard listed) and 2-acetylpyridine, 2-acetylpyrrole (furfural curve). Independence
  flag: the readers shared a scratchpad and reader A reports reader B overwrote one of A''s digitising scripts, so reader
  agreement is not independent evidence. Check: the resolver re-digitised from the PDF with fresh code in a separate directory,
  every point; of 540 heated points where the readers agree within 0.05 dex, 500 match the vector reading within 0.05 dex
  (Fig. 1 75/75, Fig. 4 425/465), and 10 of 10 designated points spread across Fig. 1 and Fig. 4 match; the 40 misses are
  mostly low points on the furan, 2-acetylpyridine and 2-acetylpyrrole panels where both readers read high by a similar amount;
  such contrasts are marked re-read. | 2026-11-14: the 18 salt-type contrasts were dropped at resolution: salt type is not
  a PREREG sec. 4 lever class and no other resolved source uses it (the resolver brief rule).'
