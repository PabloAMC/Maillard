source: boonbumrung2023
pdf: data/articles/Boonbumrung2023.pdf
reader: resolved
scope_note: 'Resolved from readers A and B. Table 4 (ppm vs one internal standard, peak-area basis, n = 3, mean +/- SD); all
  treatments heated 120 C 60 min. Keyed: xylose ladder A/B/C; yeast extract B vs D and C vs E; methionine D vs F and E vs
  G. Blank cells = not detected, no limit (nd_no_limit). Not keyed: unheated TVPH vs Trt A (heating plus dilution); D vs E
  and F vs G (xylose and yeast extract both doubled, not discussed as a pair); pairs with every arm blank (trimethylpyrazine
  B/D, D/F, E/G). Text p. 398 prints methylpyrazine A/B/C as 0.007/0.015/0.016 ppm, Table 4 0.007/0.01/0.01; the table is
  keyed. ''2,5-Dimethyl-3-ethylpyrazine'' is keyed as its structural identity 2-ethyl-3,6-dimethylpyrazine. (Z)-4-heptenal
  and 2-ethyl-1-hexanol not keyed by either reader. Class totals (Fig. 1) not keyed.'
