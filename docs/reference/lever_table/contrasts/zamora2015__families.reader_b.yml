source: "zamora2015"
pdf: "data/articles/zamora2015.pdf (+ zamora2015_supplementary.pdf)"
reader: "b"
scope_note: "Supporting Figs. S5/S6 per-temperature PAC time series (9 series) not keyed as separate time contrasts: the paper summarises them as the Fig. 3 rate constants, which are keyed. Fig. 2 and Fig. 4 are PEA/PAC ratios (not an odorant amount), not keyed. Benzaldehyde has no rate data. S2 borate pH 9 point not keyed in a single-lever ladder."
