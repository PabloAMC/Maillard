source: lotfy2021
pdf: data/articles/lotfy2021.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader a (18). Readers agree on 17 contrasts; reader a also keys
  Table 2''s ''3-Ethyl-2,5-dimethylpyrazine'' (row 20, ''-'' / ''-'' / 1.80 / 6.51 / 5.16 at pH 5 - 9), re-read and confirmed;
  it is the same compound as 2-ethyl-3,6-dimethylpyrazine (decided call), canonical odorant 2-Ethyl-3,6-dimethylpyrazine (lotfy2021-8).
  Row 18 (5-ethyl-2,3-dimethylpyrazine, not keyed) prints partly the same numbers; keyed as printed. GC-MS TIC peak areas
  x 10^6 (peak_area), n = 3 with SD, initial pH 5 - 9 with NaOH/HCl, no buffer (adjusted_unbuffered); no final pH printed.
  Conventions (resolver, uniform with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit with value null; all-ND contrasts
  kept; one compound printed twice carries duplicate_of; co-eluting mixtures odorant_unlisted; odorant names canonicalised
  to the compound_keys display name, printed name in odorant_printed; IS semi-quantification and SIFT-MS ppb relative, calibration
  with authentic standards absolute.'
