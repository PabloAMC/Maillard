source: laemont2023
pdf: data/articles/laemont2023.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader a (126 = 14 odorants x 9). Every Table 2 value of both
  readers checked against the table: identical. Decided calls: pH 4 vs pH 9 (both phosphate, concentration not printed) is
  pH, buffered; the pH 7 control is deionized water, so the 4 / 7 / 9 ladder (water vs buffer) is mixed; raw unsoaked seeds
  vs soaked-and-roasted control is mixed. Sugar: reader b keyed one three-level sugar-identity network (none / glucose / fructose);
  resolved to reader a''s form: glucose vs fructose (sugar identity) and each 20% sugar soak vs the water control (precursor
  dose, sugar), so that ''none'' is not a sugar-identity level. Whey: 17% whey protein isolate vs water control is precursor
  dose (both readers); whey protein concentrate vs control adds protein and substantially more lactose (text p. 9), so it
  is mixed (reader a had precursor dose; reader b did not key it); isolate vs concentrate is mixed (both readers). SIFT-MS
  headspace ppb (relative), n = 3, no SD; seeds soaked 15 h at 25 C, dried, roasted 165 C 8 min. No final pH printed. Not
  keyed: Table A1 (unheated soaks), off-list compounds. ''dimethylpyrazine isomers'' and ''2-pentylfuran'' (isobaric with
  2-ethylpyrazine in SIFT-MS) are odorant_unlisted. Conventions (resolver, uniform with batch 1): printed ND, ''-'', blank
  or 0 is nd_no_limit with value null; all-ND contrasts kept; one compound printed twice carries duplicate_of; co-eluting
  mixtures odorant_unlisted; odorant names canonicalised to the compound_keys display name, printed name in odorant_printed;
  IS semi-quantification and SIFT-MS ppb relative, calibration with authentic standards absolute.'
