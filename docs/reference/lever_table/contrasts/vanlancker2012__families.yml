# Resolved keying (third read) of reader A and reader B. Rules: PREREG.md secs. 3 - 4 and amendments.
source: vanlancker2012
pdf: data/articles/vanlancker2012.pdf
reader: resolved
scope_note: 'Resolved third read. Tables 1-9 (SBSE, peak area x 10^8, 130 C, 2 h, unbuffered pH 8): one amino-acid-identity
  contrast per compound per table over every printed column (free amino-acid mixtures, the glycine-alone controls, di-/tripeptides),
  arms in column order; the paper''s free-vs-peptide question is a categorical lever, so every level stays in one contrast
  (PREREG sec. 4). Table 10 (SPME, peak area x 10^6, glucose + glycine 2 mmol or diglycine 1 mmol, pH 8, 2 h): temperature
  ladders 100-180 C per amine, and glycine vs diglycine at each temperature (100 C pairs all not detected, omitted). All single-ring
  pyrazines and the Table 10 furans/furanone keyed; names off the registry list keep their printed name with odorant_unlisted
  (2,5(6)-dimethylpyrazine is a co-eluting 2,5/2,6 pair; isomers printed under one name are tagged by LRI). 3-ethyl-2,5-dimethylpyrazine
  = 2-ethyl-3,6-dimethylpyrazine. The fused 1,4-dimethylpyrrolo[1,2-a]pyrazine is not keyed. The ''pyrazines (% of total peak
  area)'' row is a share and the same tables print total pyrazines as an amount, so the amount is keyed. Totals printed 0.00
  (all components not detected) keyed as not detected. Contrasts whose every arm is not detected are omitted. Precursor amounts
  for Tables 1-9 are not printed in this paper (methods refer to ref. 12; dicarbonyls at 10-fold lower concentration). Glucose
  vs methylglyoxal vs glyoxal across tables not keyed (carbonyl identity and dose both change; no named pair).'
