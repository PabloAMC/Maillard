source: "elmore2002"
pdf: "data/articles/elmore2002.pdf"
reader: "b"
scope_note: "Table 2 (2x2: methyl linoleate vs methyl alpha-linolenate, each with/without cysteine + ribose) keyed for listed lipid odorants; the cysteine/ribose-only mixture has no Table 2 column, so lipid added vs none cannot be keyed for them. Table 1 holds no listed odorant. Pairs with both arms censored (nd or tr) not keyed: 1-hexanol (ML vs MLn; MLn vs MLn+CR), heptanal (MLn vs MLn+CR), benzaldehyde (ML vs ML+CR), 1-octen-3-ol (MLn vs MLn+CR), (E,E)-2,4-decadienal (MLn vs MLn+CR). Values are ng-equivalents vs internal standard, response factor 1 (keyed as peak_area); 'tr' = <10 ng, '-' = nd, LOD 2 ng per 100 mL. Adding cysteine + ribose keyed as precursor dose (two precursors added together vs none)."
contrasts:
  # ---------- pentanal ----------
  - id: "elmore2002-1"
    odorant: "pentanal"
    lever_class: "lipid"
    lever: "methyl linoleate (18:2n-6) vs methyl alpha-linolenate (18:3n-3), no cysteine/ribose"
    focal: true
    quantity: amount
    location: "Table 2, p. 1129"
    digitised: false
    unit: "ng in headspace of 100 mL reaction mixture (relative to 100 ng 1,2-dichlorobenzene IS)"
    quant_type: "peak_area"
    time_course_rule: "not a time course"
    arms:
      - {label: "18:2n-6", lever_value: "methyl linoleate", value: 72, censor: none, limit: null, n: 4, sd: 33, conditions: &eML {ph: 5.5, ph_basis: "label", temp_C: 140, time_min: 30, precursors: {"methyl linoleate": "0.5 mmol in 20 mL"}, buffer: "0.2 M pyrophosphate pH 5.5", matrix: "buffer", headspace: "sealed, unstated"}}
      - {label: "18:3n-3", lever_value: "methyl alpha-linolenate", value: 45, censor: none, limit: null, n: 4, sd: 18, conditions: &eMLn {ph: 5.5, ph_basis: "label", temp_C: 140, time_min: 30, precursors: {"methyl alpha-linolenate": "0.5 mmol in 20 mL"}, buffer: "0.2 M pyrophosphate pH 5.5", matrix: "buffer", headspace: "sealed, unstated"}}
