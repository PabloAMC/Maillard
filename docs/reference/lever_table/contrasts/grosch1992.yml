source: grosch1992
pdf: data/articles/grosch1992.pdf
reader: resolved
scope_note: 'All amounts ug per reaction (500 mL unless noted), isotope dilution with deuterated standards, method I (reflux
  2 h, extract after cooling) unless noted; reflux/SDE boiling keyed temp_C 100. Table II categorical additions keyed as one
  contrast per base (none/cysteine/glutathione/glutathione + cysteine on thiamine+ribose); cysteine added to thiamine keyed
  as sulfur source (none vs cysteine), not as a dose from 0. ''n.a.'' arms omitted; ''n.d.'' has no printed limit (the 1.0/0.2
  ug limits on p. 188 refer to meat samples) -> nd_no_limit. Table III 30 umol column arms 0 and 325 and Table IV 0.2 mol/L
  column reprint Table II nos. 3, 6 and Table III (same pots; Table IV 0.2 M column keyed only as buffer-concentration arms).
  Table VIII method I column reprints Table II (not keyed). Not keyed: Table VI thiamine+H2S vs Table II no. 1 (cross-table),
  Table VII meat cuts (no designed lever), method I vs II (analytical), Table II no. 4 vs no. 7 (two levers, redundant with
  keyed single-lever contrasts).'
