source: schirle1992
pdf: data/articles/schirle1992.pdf
reader: a
scope_note: 'Carbon-channel (AED) data used, the channel the paper uses for kinetics; oxygen-channel series not keyed. Table
  1 zero-order k keyed as rate (furfurol row blank at 100 C as printed); first-order k not keyed. Time series digitised from
  Figs. 3-5 (low resolution, approximate). No temperature contrast on amounts: sampling times differ by temperature. HMF and
  di(H)di(OH)-6-Me-pyranone out of scope.'
