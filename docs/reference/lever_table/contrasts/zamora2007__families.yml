source: zamora2007
pdf: data/articles/zamora2007.pdf
reader: resolved
scope_note: 'All values digitised from figures. Fig. 2 pH ladders split at the buffer switches (citrate 2.15-6, phosphate
  6-8 and 11-12, borate 8-10): the duplicate points at pH 6 and 8 cannot be assigned to a buffer and are left out, so each
  series gives a citrate ladder (2.15-5), a borate pair (9-10), a phosphate pair (11-12) and one mixed cross-buffer step (10
  vs 11). Air vs inert is ''data not shown'', not keyed. Zero values at 0 umol lipid / 0 h are read off the plot as 0 (agreed
  by both readers). Methods say 1 mL buffer, captions acetonitrile/buffer 2:1.'
