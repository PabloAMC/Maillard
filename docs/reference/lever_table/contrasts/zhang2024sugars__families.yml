source: zhang2024sugars
pdf: data/articles/zhang2024b.pdf + data/articles/zhang2024sugars_supplementary/foods-2927528-supplementary.pdf
reader: resolved
scope_note: 'Chicken carcass enzymatic hydrolysate heated 100 C, 60 min, natural pH 6.62. Table S1 (2.5 g/100 g): ONE sugar-identity contrast per compound with every heated arm the table has, heated control
  first as level ''none'' (reader A''s structure; reader B''s 4-sugar contrasts and its control-vs-2.5 % dose pairs were the same arms keyed again and are folded in; values agree). Fig. 5 (methional, furfural,
  hexanal, 2-pentylfuran): the 0 - 3.5 g/100 g dose ladder per sugar (both readers, digitised, agree within 0.05 dex; 0 and 2.5 % arms from Table S1), and sugar identity at 0.5, 1.5 and 3.5 g/100 g (reader
  B only; kept, the figure''s capital letters compare sugars at one dosage), built from the same ladder arms. Hexanal Xyl-15 and Ara-15 take the values the text prints (62.47, 177.61; the text writes x10^6
  where the figure axis is x10^5; attribution to the 1.5 % arms is by agreement with the bars). Bars absent in Fig. 5 are nd_no_limit. Unheated control not keyed (differs in heating). Group sums and RPA
  % not keyed. Compounds off the declared list (2-ethylfuran, 2-methylfuran, other alkylfurans, substituted benzaldehydes, 2(5H)-furanone, sulfur volatiles other than methional) were keyed by neither reader.'
