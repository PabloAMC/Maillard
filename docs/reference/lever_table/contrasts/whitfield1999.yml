scope_note: 'Resolved 2026-11-13 (step 9, post-A6): readers a and b agree on every compared field after canonical odorant
  names and level spellings; base file reader a. Sulfur doses differ (cysteine ~0.05 M against H2S ~0.1 M in the pot): a sulfur-source
  contrast at unequal dose, as both readers flagged. Single lever: sulfur source (cysteine vs H2S) with HMF at pH 4.5, 0.5
  M phosphate, 140 C 60 min. Values are approximate ug/10 mg HMF from peak area vs methyl decanoate IS (response factors 1);
  Table 1 prints duplicate analyses, keyed as their mean with n 2 (duplicates in the label). Sulfur donors are not equimolar
  (cysteine ~0.05 M vs H2S ~0.1 M in the pot). No final pH printed. The 2-fold/10-fold cysteine runs report only tr* (no contrast).
  No other declared odorant in Table 1.'
