source: zhou2023c
pdf: data/articles/zhou2023c.pdf
reader: a
scope_note: 'Fig. 1 heat map prints numeric cell values (keyed as printed, digitised false; unit not stated, printed 0 keyed
  nd_no_limit). Fig. 1 ARP+Cys-60 pyrazine values differ from Table 1 ARP+Cys; both keyed as printed. Fig. 5a digitised (bars,
  ~+/-2 ug/L). 2,3-butanedione and 2-propionylfuran not in list. Not keyed: pyrazine time (ARP alone, all 0); methylpyrazine
  time (ARP alone, all 0); 2,5-dimethylpyrazine time (ARP alone, all 0); 2-acetylthiazole time (ARP alone, all 0).'
contrasts:
- id: zhou2023c-1
