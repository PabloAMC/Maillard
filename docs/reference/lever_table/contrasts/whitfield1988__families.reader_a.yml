# Reader A, second keying round (odorant families). Rules: PREREG.md secs. 3 - 4.
source: whitfield1988
pdf: data/articles/whitfield1988.pdf
reader: a
scope_note: 'Table 1 (ng, mean of 3; quantified against authentic compounds, else estimated from isomers). Keyed: lecithin
  absent vs present per amino acid (the paper''s question), and glycine vs lysine vs cysteine with and without lecithin (initial
  pH differs with the amino acid: 5.7 Gly/Cys, 6.2 Lys, as printed). The printed -/+ ratio column is not keyed. Not keyed:
  lecithin-alone control (footnote b; no amino acid or ribose), 3- or 4-methyl-2-furfural (not 5-methylfurfural), other furans/pyridines/thiophenes
  not on the list; thiols excluded by brief.'
