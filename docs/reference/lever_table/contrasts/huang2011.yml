source: huang2011
pdf: data/articles/huang2011.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader b (34 = 17 odorants x 2 bean varieties, Table 2 temperature
  ladders 120 / 150 / 170 C, unalkalized beans, end of 15 min roasting). Readers agree on every arm value; they differed only
  on the pH fields. Decided call: the bean pH measured on the product (Table 3: Don Homero unalkalized 5.8 / 5.7 / 5.6 at
  120 / 150 / 170 C) is ph_basis final with final_ph = that pH (reader b); Arriba bean pH is not printed (null). ph_control
  is unstated (these beans were not alkalized). SIFT-MS roaster-headspace ppb (relative); focal as reader b (pyrazines and
  Strecker aldehydes are the stated question). Not keyed: bean variety (not a sec. 4 lever), Table 3 times to peak (not amounts),
  Fig. 2 time courses (Table 2 prints the 15 min values), Fig. 4 DMP mixture vs pH. DMP and methylbutanal are printed isomer
  mixtures (odorant_unlisted). Conventions (resolver, uniform with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit
  with value null; all-ND contrasts kept; one compound printed twice carries duplicate_of; co-eluting mixtures odorant_unlisted;
  odorant names canonicalised to the compound_keys display name, printed name in odorant_printed; IS semi-quantification and
  SIFT-MS ppb relative, calibration with authentic standards absolute.'
