# Reader B, blind. Rules: PREREG secs. 3 - 4 and A1 - A6.
source: "desousafontes2024"
pdf: "data/articles/desousa-fontes2024.pdf"
reader: "b"
scope_note: "Only F4 vs F6 (initial pH 4.0 vs 6.0, Table 2) is keyable. M4/M6 model systems: data not shown, only a standardised heat map (Fig. 2), not keyed. H/GV vs flavorings differ in heating + additions + pH (not one lever), not keyed. No final pH printed (Table 1 has no pH row though pH was measured). pH set with 1 M HCl, no buffer. Values semi-quantified vs internal standard 1,2-dichlorobenzene (relative); some rows are from the polar column (italics in the PDF, not distinguished here). 2-Acetylfuran keyed from the Furans row (nd vs 40.50); the synonym row '2-Furyl methyl ketone' (Ketones, nd vs 2.44) not keyed twice. (Z)-2-nonenal is printed, not (E), so not keyed. 2-furfuryl 2-methyl-3-furyl disulfide keyed as 2-methyl-3-(2-furfuryldithio)furan. nd has no printed limit."
