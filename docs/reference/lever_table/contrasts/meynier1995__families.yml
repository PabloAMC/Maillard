source: meynier1995
pdf: data/articles/meynier1995.pdf
reader: resolved
scope_note: Resolved from readers A and B. Amino acid (100 mM) + ribose (70 mM), 0.2 M pyrophosphate, pH 4.5-6.5 held (no
  change > 0.2 unit after heating), 140 C, 1 h; 'approximate quantities' from GC area vs internal standard without response
  factors (peak_area), mean of 3. nd limit c. 10 ng/10 mg ribose (0.01 in the table unit); tr < 0.1. Amino-acid-identity contrasts
  pair the same pH across Tables 1-4 (one study, one design, one method; B's keying kept). Table 3 'Dimethypyrazine' (LRI
  912, as 2,5-dimethylpyrazine in Tables 1-2) keyed as 2,5-Dimethylpyrazine. Table 4 prints '3-(Methylthio)propanol' at LRI
  903 while the abstract and text name 3-(methylthio)propanal; LRI 903 fits methional, so keyed as Methional (name uncertain).
  Thiols, sulfides, thiophenes, pyridines out of scope; 4,5-dihydro-2-methyl-3(2H)-furanone not keyed by either reader.
contrasts:
