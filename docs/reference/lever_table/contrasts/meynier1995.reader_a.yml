source: meynier1995
pdf: data/articles/meynier1995.pdf
reader: a
scope_note: 'Quantities are approximate (peak area vs octadecane internal standard, response factors not determined): keyed
  as peak_area. pH adjusted before heating and changed <0.2 unit on heating: keyed as held. tr = <0.1 ug/10 mg ribose; LOD
  c. 10 ng/10 mg ribose. No thiol in glycine, lysine or methionine systems, so no amino-acid (sulfur source) contrast exists.'
