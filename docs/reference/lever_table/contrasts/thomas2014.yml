source: thomas2014
pdf: data/articles/thomas2014.pdf
reader: resolved
scope_note: 'All values digitised from Fig. 2 (no table prints them); medians of triplicates, min-max bars not keyed as SD.
  Digitising resolution near the zero baseline is about +/-0.15 a.u. (x 10000), i.e. 0.1-0.2 dex for the 0.3-1.8 arms. Arms
  whose marker sits on the zero baseline (all C+F and C+X arms, and the T 0 disulfide arm) are present-but-not-quantified:
  nd_no_limit, value null; the four cysteine ladders therefore enter no estimate. The T 0 arm of the MFT thiamine ladder was
  keyed 0.2 by both readers (agreed, copied) although it also sits on the baseline; treat it as a floor value. Not keyed:
  thiamine vs cysteine or fructose vs xylose between ladders (different doses/co-precursors, baseline values only); 2-methyl-3-(methyldithio)furan
  (not on the odorant list); Table 1 hydrogen sulfide (commercial ham only, no contrast). Cooking: 40-69 C ramp at 0.1 C/min
  then 120 min hold at 69 C; time_min records the hold.'
