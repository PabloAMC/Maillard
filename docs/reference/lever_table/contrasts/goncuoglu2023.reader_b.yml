source: goncuoglu2023
pdf: data/articles/goncouglu2023.pdf
reader: b
scope_note: 'All arm values are digitised from vector figures (Figs 1 and 4; no table prints volatile or HMF values); values under 3 % of the panel axis maximum (marker radius) are keyed censor below_value
  with that floor as limit; 0-min (unheated) points not keyed. Salt dose fixed (20 mmol per 100 g flour + 50 mmol glucose), so salt is a categorical lever; CaCl2 and MgCl2 also lower initial pH (5.47, 5.41
  vs 5.82) - salt arms are not pH-matched. Each salt contrast carries its full time series (heating time can be read per salt). Fig. 4 is 160 C only; 180/200 C volatile time courses, 2-methylpropanal, 2-methylbutanal,
  methional, methyl-/2,3-/2,6-dimethyl-/2-ethyl-3-/2-ethyl-5-methylpyrazine, 2,2-bifuran, DMDS, DMTS are only in the supplement (not opened) - so the temperature lever for volatiles is supplement-only;
  text percentages keyed as relative contrasts where single-valued; ranges/pooled statements (CaCl2 -52/-36/-32 % Strecker aldehydes by temperature, CaCl2 -80-92 % methylpyrazine/2,5-DMP, CaLactate diketones
  up to 3-4 fold, 2-furanmethanol >=1.5-fold) not keyed. 2-methylfuran, 2-acetylfuran, 2-furanmethanol, 5-methyl-2-furfural have no stated calibrant; 2-acetylpyridine/2-acetylpyrrole are furfural-equivalent:
  keyed relative. MgCl2 arm (acrylamide/pH only) has no volatile data. Volatile n=2 (duplicate analysis); HMF n unstated; SDs only as error bars, not keyed.'
