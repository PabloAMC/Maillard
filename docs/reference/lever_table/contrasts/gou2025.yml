source: gou2025
pdf: data/articles/gou2025.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader b (85). Readers agree on every value they share (Table
  1 amino-acid identity at pH 5.5; Tables 2 - 3 heating-time ladders 2 - 10 h; Tables 2 vs 3 pH 5.5 vs 7.8 at 10 h; Table
  4 glucose + L-lysine added vs none on the odorless matrix and on red jujube slices, mixed). Reader b also keys two Table
  4 pairs, re-read and kept: odorless (volatile-extracted) red jujube matrix vs original red jujube slices, no additions (matrix;
  the two controls of sec. 2.5), and Model 3 vs Model 4 (odorless matrix 8 g + pH 5.5 phosphate vs red jujube 30 g + water,
  both with glucose + lysine: mixed). Table 4 is a freeze-drying programme (plate to 85 C 3 h, 70 C 5 h, 65 C 1 h). ''2-Octenal''
  is printed without a stereo descriptor: odorant_unlisted (as braggins1996''s ''2,4 decadienal''); all its arms are ND. Phosphate
  buffer named, concentration not printed (buffered). ug/kg 2-cyclohexen-1-one equivalents (internal standard; relative);
  Fig. 1 (calibrated 3,5-EDMP) not digitised since the tables print the compound. Printed 3-ethyl-2,5-dimethylpyrazine is
  2-Ethyl-3,6-dimethylpyrazine; ''Total'' rows of the pyrazine blocks are Pyrazines. 2,3-dimethylpyrazine and 2-furanmethanol
  are printed in only one of Tables 2 / 3 (no pH contrast). No final pH printed. Conventions (resolver, uniform with batch
  1): printed ND, ''-'', blank or 0 is nd_no_limit with value null; all-ND contrasts kept; one compound printed twice carries
  duplicate_of; co-eluting mixtures odorant_unlisted; odorant names canonicalised to the compound_keys display name, printed
  name in odorant_printed; IS semi-quantification and SIFT-MS ppb relative, calibration with authentic standards absolute.'
