source: "park2022mealworm"
pdf: "data/articles/park2022.pdf"
reader: "a"
scope_note: "Table 2 is one 12-arm amino-acid network (MP-RF = no added amino acid). Alkenyl pyrazines (nos. 10, 14, 19) not keyed (not alkylpyrazines); \"total pyrazines\" is the printed Sum of pyrazines row (includes them, no SD). Methional (no. 56) and 3-(methylthio)propanal (no. 57) are printed as two separate rows and keyed separately as printed. 2-octenal, 2-nonenal, 2,4-decadienal printed without stereo-descriptors. No 2-methylbutanal, 3-methylbutanal, 2-methylpropanal, HDMF/HEMF/norfuraneol, 2-acetyl-1-pyrroline, 2-acetylthiazole, pentanal or 1-hexanol in Table 2. ND has no printed limit."
