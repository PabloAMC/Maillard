source: hofmann2000b
pdf: data/articles/hofmann2000b.pdf
reader: resolved
scope_note: 'Resolved from readers A and B. Precursor form (ARP-Phe vs glucose + L-phenylalanine) keyed as sugar identity
  with levels ''glucose-phenylalanine amadori compound'' and ''glucose'' (the name shared with weenen2001). Table 1 FD factors
  (AEDA) kept as a relative quantity (reader A only; uncertain whether FD factors should count as amounts). Expt II vs III
  (copper ions alone) not keyed: copper is no lever class. Oxygen levels named inert (argon) and air. Fig. 1 digitised (no
  table); temperature reflux, unstated; Fig. 1 caption lists glucose/phenylalanine first.'
