source: "feng2022"
pdf: "data/articles/feng2022.pdf"
reader: "a"
scope_note: "Tables 1 (ARP) and 2 (ARP + GSH) only; ARP-vs-ARP+GSH contrasts pair arms across the two tables (same experiment, method, calibration). Table 3 / Fig. S3 (ARP + Glu/Cys/Gly) report no thiols. Temperature and GSH contrasts at 120 min, the only time run at 100 C and the time the text compares."
contrasts:
  - id: "feng2022-1"
    odorant: "2-methyl-3-furanthiol"
    lever_class: "temperature"
    lever: "reaction temperature 120 vs 100 C, ARP alone"
    focal: false
    location: "Table 1, p. 9098"
    digitised: false
    unit: "ug/L"
    quant_type: "absolute"
    time_course_rule: "main result time"
    arms:
      - {label: "ARP-120 C, 120 min", lever_value: 120, value: 7.22, censor: none, limit: null, n: 3, sd: 0.44,
         conditions: {ph: 7.0, ph_basis: "initial", temp_C: 120, time_min: 120, precursors: {RG-ARP: "20 mmol/L"}, buffer: "none (pH adjusted with 6 mol/L NaOH)", matrix: "water", headspace: "sealed, unstated"}}
