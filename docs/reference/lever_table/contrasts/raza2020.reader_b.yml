# Reader B, STATUS_AND_PLAN sec. 0 step 9 keying. Rules: PREREG secs. 3 - 4 and A1 - A6.
source: raza2020
pdf: data/articles/raza2020.pdf
reader: b
scope_note: 'Face-centred CCD (21 runs, 5 centre points 2,3,4,8,11): each axis keyed as a 3-level ladder (low axial, the five
  centre runs as separate arms, high axial); plus 4 factorial run pairs differing only in cysteine (6/5, 13/19, 14/18, 7/16).
  Other factorial pairs differ in >=2 factors, not keyed. Heating time not stated (time_min null); no final pH printed. ND
  keyed nd_no_limit; ''0±0'' (2,5-DMP MRP-10/11) keyed value 0 with nd_no_limit. MRP-16 methylpyrazine 920.02 keyed as printed
  (looks anomalous). Odorant ''3,3''-Dithiobis[2-methyl-furan]'' = bis(2-methyl-3-furyl) disulfide. pH set with NaOH/HCl in
  water, no buffer named (adjusted_unbuffered inferred from the reagents list).'
