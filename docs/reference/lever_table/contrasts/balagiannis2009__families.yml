source: "balagiannis2009"
pdf: "data/articles/balagiannis2009.pdf"
reader: "resolved"
scope_note: "Resolved from readers A and B. All values digitised (no table prints the aldehyde data). The 130 C panels of Fig. 5 reprint Fig. 1e,f: batches 1-3 at 130 C keyed once, from Fig. 1e,f; batch 2 at 140 C and batch 4 at 120 C from Fig. 5. Time ladders start at 20 min: the 5-15 min points of most series overlap on the axis (lag phase) and cannot be read; batch 2 is sampled at 140/190 min, batches 1 and 3 at 120/180 min. Liver-extract batches differ in initial glucose and free amino acids (no single controlled lever): batch comparisons keyed mixed. Table 1 rate constants are fitted model parameters, no contrast. At least two replicates per time; pH unstated."
