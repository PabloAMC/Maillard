# Reader B, STATUS_AND_PLAN sec. 0 step 9 keying. Rules: PREREG secs. 3 - 4 and A1 - A6.
source: yang2011
pdf: data/articles/yang2011.pdf
reader: b
scope_note: 'Box-Behnken RSM (temp 130-170 C, time 90-150 min, buffer volume 40-100 mL, initial pH 4.7-6.7): only the 24 within-block
  run pairs that differ in one factor (others identical) are keyed, per odorant; edge-vs-centre runs differ in two factors
  and are not keyed. ''–'' keyed nd_no_limit; two blank cells (run 8 nonanal, run 5 benzothiazole) keyed as nd_no_limit with
  the label saying so. Values are means of triplicates (IS + response factor). Factor C (buffer mL) keyed as precursor dose
  of all reactants (fixed masses, varied volume) - uncertain class. Benzothiazole, S-ethyl ethanethioate, thiophenone, trithiolane,
  trimethylthiazole, dihydrofuranone not on the declared list.'
