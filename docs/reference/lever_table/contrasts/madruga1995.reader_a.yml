# Reader A, STATUS_AND_PLAN sec. 0 step 9. Rules: PREREG secs. 3 - 4 + A1 - A6.
source: madruga1995
pdf: data/articles/madruga1995.pdf
reader: a
scope_note: 'Table 2 values are ''approximate concentrations'' from GC-MS peak area vs a dichlorobenzene internal standard
  (no response factors), printed as mg/kg meat; n of headspace collections ''usually no less than three'' (not keyed as n).
  One 4-level initial-pH ladder (HCl into beef, no added buffer; final pH from Table 1). Tr printed as ''trace (2 mg/kg meat)''
  keyed censor trace, limit 2; ND has no printed limit. Not keyed (not on the declared lists): 2-ethyl-(5 or 6)-methylpyrazine,
  2,3-diethyl-5-methylpyrazine, decanal, other sulfur compounds, alkylfurans other than 2-pentylfuran.'
contrasts:
- id: madruga1995-1
  odorant: 2-Methyl-3-furanthiol
  lever_class: pH
  lever: initial pH of minced beef (adjusted with 1 M HCl before cooking), 4-level ladder 4.0/4.5/5.0/5.6
  focal: true
  location: Table 2 (p. 308); final pH Table 1
  digitised: false
  unit: mg/kg meat (approximate, vs internal standard)
  quant_type: relative
  time_course_rule: not a time course
  ph_control: adjusted_unbuffered
  arms:
  - label: pH 4
    lever_value: 4.0
    value: 130
    censor: none
    limit: null
    n: null
    sd: 20
    conditions:
      ph: 4.0
      ph_basis: initial
      final_ph: 4.4
      final_ph_location: Table 1
      temp_C: 140
      time_min: 30
      precursors:
        beef (M. psoas major): 100 g
        1 M HCl: 12 ml (in 12 ml added solution)
      buffer: none
      matrix: meat (minced beef, M. psoas major)
      headspace: sealed, unstated
