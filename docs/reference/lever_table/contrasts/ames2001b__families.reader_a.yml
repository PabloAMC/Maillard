source: ames2001b
pdf: data/articles/ames2001b.pdf
reader: a
scope_note: 'Group F only. Table 3 (extrusion, 3 NaOH/pH labels x 3 target temperatures) keyed as one temperature ladder per
  pH label and one pH ladder per temperature; pH lever_value is the printed label, conditions.ph the measured extrudate pH
  (Table 1, after processing). Blank table cells keyed nd_no_limit. Table 4 (reaction tube, 180 C, 25 s ramp + 60 s hold;
  time_min approximates the 85 s total) keyed as water contrasts. Not keyed: cyclopentapyrazines, 5-methylquinoxaline, 2-(2''-furyl)-5(6)-methylpyrazine
  (not alkylpyrazines); 2-methyl-4,5-dihydro-3(2H)-furanone and other furans not on the list.'
