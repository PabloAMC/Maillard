# Reader a, blind double-keying, second round (odorant families). Rules: PREREG secs. 3 - 4.
source: xu2011
pdf: data/articles/xu2011.pdf
reader: a
scope_note: Semi-quantitative (cyclohexanone IS, no per-analyte calibration) so keyed peak_area. Table 2 (E)-2-octenal has
  no entry printed for Xyl-Cys-fresh lard, so its two contrasts with that arm are not keyed. Pairs where every arm is n.d.
  are not keyed. Table 2 lists no no-lard arm. Thiols/thiophenes of Table 1 out of scope.
contrasts:
- id: xu2011-1
  odorant: furfural
  lever_class: lipid
  lever: lard added (none / fresh lard / oxidized lard) to cysteine-xylose
  focal: true
  location: Table 1
  digitised: false
  unit: ug/mL (cyclohexanone internal standard equivalent)
  quant_type: peak_area
  time_course_rule: not a time course
  quantity: amount
  arms:
  - label: Xyl-Cys
    lever_value: none
    value: 22.95
    censor: none
    limit: null
    n: 3
    sd: 3.09
    conditions:
      ph: 5.0
      ph_basis: initial
      temp_C: 120
      time_min: 60
      precursors:
        L-cysteine: 0.2 g in 10 mL
        D-xylose: 0.2 g in 10 mL
      buffer: 0.2 mol/L phosphate (Na2HPO4/NaH2PO4)
      matrix: buffer
      headspace: sealed, unstated
  - label: Xyl-Cys-fresh lard
    lever_value: fresh lard
    value: 9.85
    censor: none
    limit: null
    n: 3
    sd: 1.18
    conditions:
      ph: 5.0
      ph_basis: initial
      temp_C: 120
      time_min: 60
      precursors:
        L-cysteine: 0.2 g in 10 mL
        D-xylose: 0.2 g in 10 mL
        fresh lard: 0.1 g in 10 mL
      buffer: 0.2 mol/L phosphate (Na2HPO4/NaH2PO4)
      matrix: 'buffer + lard (other: lard in phosphate buffer)'
      headspace: sealed, unstated
  - label: Xyl-Cys-oxidized lard
    lever_value: oxidized lard
    value: 9.05
    censor: none
    limit: null
    n: 3
    sd: 0.27
    conditions:
      ph: 5.0
      ph_basis: initial
      temp_C: 120
      time_min: 60
      precursors:
        L-cysteine: 0.2 g in 10 mL
        D-xylose: 0.2 g in 10 mL
        oxidized lard: 0.1 g in 10 mL
      buffer: 0.2 mol/L phosphate (Na2HPO4/NaH2PO4)
      matrix: 'buffer + lard (other: lard in phosphate buffer)'
