source: braggins1996
pdf: data/articles/braggins1996.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Readers agree on all 19 contrasts; base reader a. Kept as lever_class
  pH (decided call): ultimate meat pH groups 5.66 / 6.26 / 6.81 (semimembranosus, Table 1), ph_control unadjusted. The pH
  groups were produced by pre-slaughter adrenaline, a biological treatment and a possible confound of the pH lever. Tables
  4 - 5 print only compounds that changed significantly (hexanal etc. not printed, not keyed); the compounds ''targeted but
  not found in any of the samples'' (Table 5 footnote) are keyed as all-ND contrasts. ''2-methylfuranthiol'' (printed with
  no ring position) is odorant_unlisted (decided call); the isomer-unspecified ''2,4 decadienal'' row is odorant_unlisted
  beside the (E,E) row. ng/g rendered fat by 2-octanone internal standard (relative), geometric means of n = 10, no SD. Conventions
  (resolver, uniform with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit with value null; all-ND contrasts kept; one
  compound printed twice carries duplicate_of; co-eluting mixtures odorant_unlisted; odorant names canonicalised to the compound_keys
  display name, printed name in odorant_printed; IS semi-quantification and SIFT-MS ppb relative, calibration with authentic
  standards absolute.'
