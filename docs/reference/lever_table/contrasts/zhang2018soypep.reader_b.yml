source: zhang2018soypep
pdf: data/articles/zhang2018.pdf + supplement (Tables S1-S4)
reader: b
scope_note: 'Values are % of total GC-MS peak area (share), no SD. 2x4 design (cysteine none/0.1 g x 80/100/120/140 C): temperature ladders and none-vs-cysteine pairs keyed. Bis(2-furfuryl)disulfide is
  printed in two tables (S1 and S2) with different values; both rows keyed as printed. H2S not measured. Class sums (thiols) not keyed.'
