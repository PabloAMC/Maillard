# One file per source and reader. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4. Key what the source prints.
source: "chan1994b"
pdf: "data/articles/chan2005.pdf"
reader: "a"
scope_note: "Only Figs. 1-3 (95 C; pH 6, 7, 8) print values, for isovaleraldehyde and 2-phenylethanal (phenylacetaldehyde); all digitised (no table of amounts). 2-acetyl-1-pyrroline, 2-acetylfuran and the other temperatures/pH effects are described in text only or as activation energies (Table I), no per-arm values. pH ladder spans three figures (one per pH), keyed as one contrast at the longest plotted time (60 min). Quantified against 4-methylthiazole internal standard (no per-compound calibration stated): keyed peak_area. Multi-amino-acid system (Met, Phe, Pro, Leu + glucose)."
contrasts:
  - id: "chan1994b-1"
    odorant: "isovaleraldehyde (3-methylbutanal)"
    lever_class: "pH"
    lever: "initial pH (6, 7, 8)"
    focal: true
    location: "Figs. 1-3, pp. 136-137"
    digitised: true
    unit: "mole (conc. in reaction mixture)"
    quant_type: "peak_area"
    quantity: amount
    time_course_rule: "longest time"
    arms:
      - label: "95C-pH 6, 60 min"
        lever_value: 6
        value: 2.2e-3
        censor: none
        limit: null
        n: 2
        sd: null
        conditions: &chan_cond6
          ph: 6
          ph_basis: "initial"
          temp_C: 95
          time_min: 60
          precursors: {glucose: "0.5 mol", methionine: "0.075 mol", phenylalanine: "0.075 mol", proline: "0.075 mol", leucine: "0.075 mol", volume: "400 mL"}
          buffer: "0.1 M phosphate (+ NaOH to pH)"
          matrix: "water"
          headspace: "sealed, unstated (N2 added after each sampling)"
      - label: "95C-pH 7, 60 min"
        lever_value: 7
        value: 2.3e-3
        censor: none
        limit: null
        n: 2
        sd: null
        conditions: &chan_cond7
          ph: 7
          ph_basis: "initial"
          temp_C: 95
          time_min: 60
          precursors: {glucose: "0.5 mol", methionine: "0.075 mol", phenylalanine: "0.075 mol", proline: "0.075 mol", leucine: "0.075 mol", volume: "400 mL"}
          buffer: "0.1 M phosphate (+ NaOH to pH)"
          matrix: "water"
          headspace: "sealed, unstated (N2 added after each sampling)"
      - label: "95C-pH 8, 60 min"
        lever_value: 8
        value: 2.5e-3
        censor: none
        limit: null
        n: 2
        sd: null
        conditions: &chan_cond8
          ph: 8
          ph_basis: "initial"
