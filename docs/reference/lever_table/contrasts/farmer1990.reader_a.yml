source: "farmer1990"
pdf: "data/articles/farmer1990.pdf"
reader: "a"
scope_note: "Only Table 2 carries thiols (2-furanmethanethiol no. 20, 2-methyl-3-furanthiol no. 21); no disulfides or H2S quantified. Values are relative peak areas (1 ng 1,2-dichlorobenzene = 100), SD in parentheses; n = 5 for cysteine+ribose alone, 4 otherwise. Lever is lipid identity (none, beef triglyceride, beef phospholipid, egg PC, egg PE), 30 mg lipid per ampoule."
contrasts:
  - id: "farmer1990-1"
    odorant: "2-furanmethanethiol"
    lever_class: "lipid"
    lever: "lipid added: none vs beef triglyceride vs beef phospholipid vs egg PC vs egg PE"
    focal: false
    location: "Table 2 (no. 20)"
    digitised: false
    unit: "relative peak area (1 ng 1,2-dichlorobenzene = 100)"
    quant_type: "peak_area"
    time_course_rule: "not a time course"
    arms:
      - {label: "Alone", lever_value: "none", value: 50200, censor: none, limit: null, n: 5, sd: 7090,
         conditions: {ph: 5.6, ph_basis: "label", temp_C: 140, time_min: 60, precursors: {cysteine: "5 mg/mL", ribose: "4.5 mg/mL"}, buffer: "0.5 M phosphate, pH 5.6", matrix: "buffer", headspace: "inert"}}
      - {label: "+BTG", lever_value: "beef triglyceride", value: 33400, censor: none, limit: null, n: 4, sd: 3560,
         conditions: {ph: 5.6, ph_basis: "label", temp_C: 140, time_min: 60, precursors: {cysteine: "5 mg/mL", ribose: "4.5 mg/mL", beef triglyceride: "30 mg per 2 mL"}, buffer: "0.5 M phosphate, pH 5.6", matrix: "buffer", headspace: "inert"}}
      - {label: "+BPL", lever_value: "beef phospholipid", value: 31600, censor: none, limit: null, n: 4, sd: 7530,
         conditions: {ph: 5.6, ph_basis: "label", temp_C: 140, time_min: 60, precursors: {cysteine: "5 mg/mL", ribose: "4.5 mg/mL", beef phospholipid: "30 mg per 2 mL"}, buffer: "0.5 M phosphate, pH 5.6", matrix: "buffer", headspace: "inert"}}
      - {label: "+PC", lever_value: "egg phosphatidylcholine", value: 31000, censor: none, limit: null, n: 4, sd: 2490,
         conditions: {ph: 5.6, ph_basis: "label", temp_C: 140, time_min: 60, precursors: {cysteine: "5 mg/mL", ribose: "4.5 mg/mL", egg PC: "30 mg per 2 mL"}, buffer: "0.5 M phosphate, pH 5.6", matrix: "buffer", headspace: "inert"}}
      - {label: "+PE", lever_value: "egg phosphatidylethanolamine", value: 35900, censor: none, limit: null, n: 4, sd: 7130,
         conditions: {ph: 5.6, ph_basis: "label", temp_C: 140, time_min: 60, precursors: {cysteine: "5 mg/mL", ribose: "4.5 mg/mL", egg PE: "30 mg per 2 mL"}, buffer: "0.5 M phosphate, pH 5.6", matrix: "buffer", headspace: "inert"}}
