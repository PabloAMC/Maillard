source: "martin2001"
pdf: "data/articles/martin2001.pdf"
reader: "b"
scope_note: "Blank table cells keyed nd_no_limit; L/I/P/M pyrazines keyed nd from the text (no Table 4 column). Pairs with both arms nd not keyed. Model U (untreated chips) and X/Y/Z vs single-amino-acid systems differ in many levers, not keyed; mixed pairs limited to two additions/removals (no amino-acid swap with sugar change). Amino-acid identity arms carry the potato-proportional (unequal) steeping concentrations as printed. Fig. 2 RY keyed (digitised) only for systems whose pyrazine totals no table prints (FA, GFA, Y). Table 5 keyed only for contrasts involving F, FA, GFA, Y, Z (others duplicate Table 4 pots)."
contrasts:
  - id: "martin2001-1"
    odorant: "3-methylbutanal"
    lever_class: "amino acid identity"
    lever: "amino acid infused, with glucose"
    focal: true
    location: "Table 3"
    digitised: false
    unit: "relative GC peak area units (vs internal standard)"
    quant_type: "peak_area"
    quantity: "amount"
    time_course_rule: "not a time course"
    arms:
      - label: "GL"
        lever_value: "glucose + leucine"
        value: 4500
        censor: none
        limit: null
        n: 3
        sd: null
        conditions:
          ph: null
          ph_basis: "unstated"
          temp_C: "180 (oil, falling to 160)"
          time_min: 2
          precursors:
            "glucose": "500 mg/100 mL"
            "leucine": "25 mg/100 mL"
            "note": "steeping-solution concentrations (40 C, 10 min) into leached potato slices"
          buffer: "none"
          matrix: "potato slices (sugars and amino acids leached, then infused); fried in palmolein"
