source: hou2017ph
pdf: data/articles/hou2017ph.html
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Base reader a (22) plus one resolver row. Table 2 is an image; its
  values come from the page''s hidden text layer, where blank cells are dropped. Decided call: the resolver re-derived every
  placement itself: values were parsed per row (HP-5MS block = first RI, DB-WAX = second; a row with one RI may sit in either
  block) and placed in pH columns by an integer program constrained by the printed per-column subtotals of each class (thiols/disulfides,
  thiazoles, N-heterocycles, O-heterocycles, others; tolerance 0.03 ng), testing every placement of every row. Determined
  (unique) for every keyed row; all 22 of reader a''s rows and reader b''s 23 shared rows agree with it. bis(2-furfuryl) disulfide
  HP-5MS (1.06 / 2.03) is determined at pH 4.5 / 5.5 (ND at 6.5 / 7.5): keyed as hou2017ph-23 (reader a left it unkeyed; reader
  b placed it at 6.5 / 7.5, which the subtotals exclude). Not keyed (placement not determined): the DB-WAX rows of bis(2-methyl-3-furyl)
  disulfide (9.00 / 12.81 / 3.25: pH 4.5 / 5.5 / 6.5 or 4.5 / 5.5 / 7.5) and of bis(2-furfuryl) disulfide (1.41 / 2.62 / 0.55:
  4.5 / 5.5 / 6.5 or 4.5 / 6.5 / 7.5); both would be duplicate_of their HP-5MS rows anyway. HP-5MS rows are primary; the DB-WAX
  row of a compound printed in both blocks is duplicate_of the HP-5MS one; DB-WAX-only compounds (2,6-/2,3-dimethylpyrazine,
  ethylpyrazine, trimethylpyrazine, 2-ethyl-3,6-dimethylpyrazine printed as 3-ethyl-2,5-, 2-pentylfuran) are primary. final_ph
  = initial - printed drop (Table 1): 4.13 / 5.08 / 6.05 / 6.90. 0.2 M phosphate (buffered), 140 C 30 min; ng by internal
  standard (1,2-dichlorobenzene, response factor 1; relative). No pyrazine class total printed (the N-heterocycle subtotal
  includes pyrroles / pyridines). Conventions (resolver, uniform with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit
  with value null; all-ND contrasts kept; one compound printed twice carries duplicate_of; co-eluting mixtures odorant_unlisted;
  odorant names canonicalised to the compound_keys display name, printed name in odorant_printed; IS semi-quantification and
  SIFT-MS ppb relative, calibration with authentic standards absolute.'
