  odorant: pyrazine
  lever_class: pH
  lever: initial pH (no urea)
  focal: true
  location: Table 2; final pH Table 4
  digitised: false
  unit: mg/g of ribose
  quant_type: relative
  time_course_rule: not a time course
  ph_control: adjusted_unbuffered
  arms:
  - label: RC5
    lever_value: 5.0
    value: null
    censor: nd_no_limit
    limit: null
    n: 2
    sd: null
    conditions:
      ph: 5.0
