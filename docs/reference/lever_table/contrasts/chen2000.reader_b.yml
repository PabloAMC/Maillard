# Reader B, STATUS_AND_PLAN sec. 0 step 9 keying. Rules: PREREG secs. 3 - 4 and A1 - A6.
source: chen2000
pdf: data/articles/chen2000.pdf
reader: b
scope_note: '2x2 design (pH 5 / 8.5 x urea none / equimolar), 180 C 2 h, sealed Hoke cylinders; each odorant keyed as 4 one-lever
  pairs. Urea keyed as precursor dose (0 vs 0.01 mol) - no better lever class. Blank cells = not detected, keyed nd_no_limit.
  Values: means of duplicates, tridecane IS (relative). Final pH from Table 4. pH ''adjusted'' in distilled water, no buffer
  (adjusting agent unstated). Table 3 (urea + acetoin/diacetyl) tetramethylpyrazine pH pairs keyed; diacetyl vs acetoin (carbonyl
  identity) has no sec. 4 lever, not keyed. 3-ethyl-2,5-dimethylpyrazine keyed as printed (= 2-ethyl-3,6-dimethyl-pyrazine).
  Urea contents of meats (Table 1) and NH3 release (Fig. 1) not odorants.'
contrasts:
