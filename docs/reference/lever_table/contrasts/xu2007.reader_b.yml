source: "xu2007"
pdf: "data/articles/xu2007.pdf"
reader: "b"
scope_note: "Table 1 approximate headspace quantities (peak area vs tridecane, RF 1; treatments in duplicate). Keyed: initial-pH ladders 5.6/7.0/8.0 (final pH printed in labels) separately within control and within SC-CO2. Not keyed: SC-CO2 vs control at each pH (the paper's focal lever; supercritical CO2 at 40 MPa is not a listed lever class, and it also shifts final pH). '-' keyed nd_with_limit 0.07 ng/mL, 'tr' keyed trace (<0.3 ng/mL). H2S and difurfuryl disulfide not reported. 2-Methyl-3-(2-furfuryldithio)furan keyed as the MFT-FFT mixed disulfide."
contrasts:
  - id: "xu2007-1"
    odorant: "2-methyl-3-furanthiol"
    lever_class: "pH"
    lever: "initial pH 5.6 / 7.0 / 8.0, conventional heating (control)"
    focal: false
    location: "Table 1, pp. 332-333"
    digitised: false
    unit: "ng/mL of mixture (approximate, vs tridecane, RF 1)"
    quant_type: "peak_area"
    quantity: "amount"
    time_course_rule: "not a time course"
    arms:
      - label: "Contr. initial pH 5.6 (final pH 5.5)"
        lever_value: 5.6
