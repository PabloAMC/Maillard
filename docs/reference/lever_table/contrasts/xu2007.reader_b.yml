        censor: none
        limit: null
        n: 2
        sd: null
        conditions:
          ph: 5.6
          ph_basis: "initial"
          temp_C: 140
          time_min: 60
          precursors:
            "D-ribose": "5 mmol in 100 mL (0.05 M)"
