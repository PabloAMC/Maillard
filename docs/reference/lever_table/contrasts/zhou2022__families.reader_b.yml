source: "zhou2022"
pdf: "data/articles/zhou2022.pdf"
reader: "b"
scope_note: "Table 1 ARP-alone series that are ND at every time (pyrazine, methylpyrazine, 2-acetylthiazole) and the Table 3 pH 7 2,5-dimethylpyrazine ladder (all ND) not keyed as contrasts. Table 3 pH 7 '20 ARP' and '20 ARP + 20 Cys' columns reprint Table 1 60 min values. 2,3-butanedione, thiophenes, thiazoles other than 2-acetylthiazole, and thiols out of scope."
contrasts:
  - id: "zhou2022-1"
    odorant: "furfural"
    lever_class: "precursor dose"
    lever: "cysteine 0 vs 20 mmol/L added to 20 mmol/L AX-ARP"
    focal: false
    location: "Table 1, 120 min"
    digitised: false
    unit: "ug/L"
    quant_type: "absolute"
    quantity: "amount"
    time_course_rule: "main result time"
    note: "120 min chosen before reading values: the abstract reports the pyrazine result at 120 C, 120 min"
    arms:
      - label: "ARP"
        lever_value: 0
        value: 1261.12
        censor: none
        limit: null
        n: 3
        sd: 118.93
        conditions:
          ph: 7
          ph_basis: "initial"
          temp_C: 120
          time_min: 120
          precursors:
            "AX-ARP (N-(1-deoxy-D-xylulos-1-yl)-alanine)": "20 mmol/L"
            "cysteine": "0 mmol/L"
          buffer: "none (pH adjusted with NaOH)"
          matrix: "water"
          headspace: "sealed, unstated"
      - label: "ARP + Cys"
        lever_value: 20
        value: 510.92
        censor: none
        limit: null
        n: 3
        sd: 36.03
        conditions:
          ph: 7
