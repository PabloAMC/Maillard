source: "xu2011"
pdf: "data/articles/xu2011.pdf"
reader: "b"
scope_note: "Table 2 lipid odorants keyed as four pairs per compound (oxidation state with/without Xyl-Cys; Xyl-Cys added vs lard alone as mixed, two precursors); pairs with both arms n.d. skipped; (2E)-octenal Xyl-Cys-fresh lard cell printed blank, not keyed; no no-lard arm printed for Table 2 compounds; final pH printed (3.60/3.65/3.71) not used as lever"
contrasts:
  - id: "xu2011-1"
    odorant: "Furfural"
    lever_class: "lipid"
    lever: "no lard vs fresh lard vs oxidized lard (cysteine + xylose present)"
    focal: true
    location: "Table 1"
    digitised: false
    unit: "ug/mL"
    quant_type: "peak_area"
    quantity: "amount"
    time_course_rule: "not a time course"
    note: "semi-quantitative against internal standard cyclohexanone (response factor 1)"
    arms:
      - label: "Xyl-Cys"
        lever_value: "none"
        value: 22.95
        censor: "none"
        limit: null
        n: 3
        sd: 3.09
        conditions:
          ph: 5.0
          ph_basis: "initial"
          temp_C: 120
          time_min: 60
          precursors:
            "L-cysteine": "0.2 g in 10 mL"
            "D-xylose": "0.2 g in 10 mL"
          buffer: "0.2 mol/L phosphate, 10 mL"
          matrix: "buffer"
