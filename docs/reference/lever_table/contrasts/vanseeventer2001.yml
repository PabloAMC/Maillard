# Resolved (third read) from reader_a / reader_b, PREREG secs. 3 - 4 and amendment A1.
source: vanseeventer2001
pdf: data/articles/vanseeventer2001.pdf
reader: resolved
scope_note: 'Storage stability at 50 C, not formation: every value is a % decrease in concentration per day (zero-order
  fit over 0-24 h), keyed quantity: rate (amendment A1; enters no cell). ''> 90'' cells keyed censor above_value, limit
  90, value null. Table 1 values re-read and confirmed (MFT 59/>90/>90/69/42; FFT 28/>90/>90/39/43). Fig. 1 cysteine
  ladders digitised; their 0 and 150 mM points may be the same pots as Table 1 entries 2 and 4 (printed FFT 39 vs digitised
  46), so both are kept. Air vs argon ''data not presented'', not keyable.'
