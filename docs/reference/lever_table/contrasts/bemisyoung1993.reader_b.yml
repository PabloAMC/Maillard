# Reader B, STATUS_AND_PLAN sec. 0 step 11 (A6 batch 2). Keyed blind; PREREG secs. 3 - 4 + A1 - A6.
source: bemisyoung1993
pdf: data/articles/bemis-young1993.pdf
reader: b
scope_note: 'Table 2 (pyrazines, mean relative weight % of the pyrazine fraction) and Table 3 (furfuryl alcohol, % of non-pyrazine
  compounds) over 8 initial pH arms (NaOH/HCl, explicitly unbuffered); final pH measured but not printed. Not keyed: odorants
  off the declared list (2-ethyl-5/6-methylpyrazine, vinylpyrazine, diethylpyrazines, quinoxalines, acetoin, acetol, pyrroles).
  Values are composition shares, not amounts.'
