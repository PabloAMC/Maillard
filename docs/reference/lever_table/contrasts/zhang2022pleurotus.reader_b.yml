source: "zhang2022pleurotus"
pdf: "data/articles/zhang2022b.pdf"
reader: "b"
scope_note: "Table 3 keyed as sulfur source (Cys / Met / Thi, each with xylose); MFT, H2S and the MFT-FFT mixed disulfide not reported; the no-xylose no-sulfur control (PCH-TDPs) differs in two levers and is not discussed for thiols, so not keyed; ND printed without a limit."
