source: wang2026arp
pdf: data/articles/Wang2026.pdf (+ Wang2026-supplementary.docx)
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 9, post-A6). Base reader b (34; reader a''s 34 carry the same values, matched after
  canonical names; differences were only location wording and 0 vs null). Every value checked against Tables S2 - S4 of the
  supplementary docx. Three one-factor ladders (S2 pH 5 - 9, S3 85 - 125 C, S4 60 - 140 min) on Glu- and Cys-Amadori intermediates
  in 0.2 M PBS; the held values of the other factors are not printed (keyed null); final pH not printed. Two printed rows
  per compound, keyed by convention: CAS 98-02-2 ''2-Furanethiol'' (first printed) and ''Furfuryl mercaptan'' (S2 only) are
  both 2-furfurylthiol, the second carries duplicate_of; ''Difurfuryl disulfide'' (first) and ''Bis(2-furfuryl) disulfide''
  (printed with CAS 6911-51-9, which the table also gives bis(2-thienyl) disulfide) likewise. Quantified vs 1,2-dichlorobenzene
  internal standard: relative. ''Pentanaldehyde'' = pentanal; ''3-Bis(2-methyl-3-furanyl) disulfide'' = bis(2-methyl-3-furyl)
  disulfide (CAS 28588-75-2); bare ''Pyrazine'' keyed as Unsubstituted pyrazine. Conventions applied (resolver, uniform across
  batch 1): a printed ND, ''-'', ''–'', blank, 0, 0.000 or 0±0 is censor nd_no_limit with value null; contrasts whose arms
  are all not detected are kept (keyed, counted, enter no estimate); only run pairs differing in exactly one factor are keyed;
  odorant names canonicalised to the compound_keys display name with the printed name in odorant_printed; quant_type absolute
  only where the paper states calibration with authentic standards for that compound, internal-standard semi-quantification
  relative.'
