# Reader b, blind double-keying, second round (families). Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: vanlancker2010
pdf: data/articles/vanlancker2010.pdf
reader: b
scope_note: 'Tables 1-3: one amino-acid-identity contrast per compound per carbonyl over the 16 arms Lys (0.4 M) to LysPhe (all 0.4 M total amino acid residues),
  plus a precursor-dose contrast Lys 0.2 vs 0.4 M; 0 compound rows with no detected value in the identity arms keyed only where the dose pair has a value. Dipeptide
  vs free mixture is keyed as amino acid identity (no closer class). Non-alkyl pyrazines (ethenyl, propenyl, acetyl, furyl, pyrrolo, indole) keyed with odorant_unlisted.
  Cross-carbonyl pyrazine comparisons (Tables 1 vs 2 vs 3) not keyed: different tables, two levers, discussed only qualitatively. Not detected (-) has no printed
  limit.'
