# Reader B, STATUS_AND_PLAN sec. 0 step 11 (A6 batch 2). Keyed blind; PREREG secs. 3 - 4 + A1 - A6.
source: vanba2013
pdf: data/articles/vanba2013.pdf
reader: b
scope_note: 'Tables 1 - 2 (Table 3 holds no declared odorant). ''Nf'' keyed nd_with_limit at the printed detection limit 0.09
  ug/100 mL. Keyed: pH 5.5 vs 6.2 in every system; fatty-acid identity (none / C18:1 / C18:2 / C18:3, against the first-listed
  arm) at each pH; fatty acid alone vs fatty acid + 21 amino acids/ribose (mixed: amino acids and sugar both added). Lipid
  odorants are printed only for fatty-acid systems (no amino acids/ribose-alone column in Table 1). SD not printed (pooled
  SEM only); n = 3 runs.'
contrasts:
- id: vanba2013-1
  odorant: 2-methyl-3-furanthiol
  lever_class: pH
  lever: pH 5.5 vs 6.2 (pyrophosphate buffer); amino acids/ribose; printed as 2-Methyl-3-furanthiol
  focal: true
  location: Table 2
  digitised: false
  unit: ug/100 mL (approximate; internal standard 2-methyl-3-heptanone, response factor 1)
  quant_type: relative
  time_course_rule: not a time course
  ph_control: buffered
  arms:
  - label: Amino acids/ribose, pH 5.5
    lever_value: 5.5
    value: 5.3
    censor: none
    limit: null
    n: 3
    sd: null
    conditions:
      ph: 5.5
      ph_basis: initial
      final_ph: null
      final_ph_location: ''
      temp_C: 121
      time_min: 10
      precursors:
        amino acids: 21 amino acids, 0.25 mM each
        ribose: 0.25 mM
      buffer: 0.2 M pyrophosphate
      matrix: buffer
      headspace: sealed, unstated
