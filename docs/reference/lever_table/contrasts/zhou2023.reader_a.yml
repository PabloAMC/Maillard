    odorant: "2-methyl-3-furanthiol"
    lever_class: "pH"
    lever: "initial pH (6, 7, 8), ARP + Cys"
    focal: true
    location: "Table 1, p. 2475"
    digitised: false
    unit: "ug/L"
    quant_type: "absolute"
    time_course_rule: "not a time course"
    arms:
