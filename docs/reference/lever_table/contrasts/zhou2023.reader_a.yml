source: "zhou2023"
pdf: "data/articles/Zhou2023b.pdf"
reader: "a"
scope_note: "Table 1 only (Fig. 3 Cys+MGO model has no thiols). ARP-alone pH ladders not keyed: every ARP-alone thiol/disulfide arm is ND. Difurfuryl disulfide Cys-vs-none at pH 8 not keyed (both arms ND). di-2-furfuryl sulfide (monosulfide) out of scope. ND has no printed LOD."
contrasts:
  # ---- pH ladders, ARP + Cys ----
