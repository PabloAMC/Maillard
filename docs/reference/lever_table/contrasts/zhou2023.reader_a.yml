         conditions: {ph: 6, ph_basis: "initial", temp_C: 120, time_min: 60, precursors: {ARP: "20 mmol/L", L-cysteine: "20 mmol/L"}, buffer: "none (pH adjusted with 3 mol/L NaOH)", matrix: "water", headspace: "unstated"}}
