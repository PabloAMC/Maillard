scope_note: 'Phosphate buffer named but its concentration is not printed (ph_control keyed buffered). Fig. 1 (calibrated 3,5-EDMP
  time course) not digitised: Tables 2-3 print the compound. 2,3-dimethylpyrazine (Table 3 only) and 2-furanmethanol (Table
  2 only) have no row in the other pH table, so no pH contrast. Table 4 additions (lysine + glucose) are two precursors at
  once: keyed mixed. Printed 3-ethyl-2,5-dimethylpyrazine keyed as 2-ethyl-3,6-dimethylpyrazine (same compound). Final pH
  not printed.'
