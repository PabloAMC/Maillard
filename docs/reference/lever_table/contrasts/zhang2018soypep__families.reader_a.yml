source: zhang2018soypep
pdf: data/articles/zhang2018.pdf + supplement (zhang2018_supplementary.txt, Tables S1-S4)
reader: a
scope_note: 'Group F from Tables S1-S4. Duplicate-name rows keyed separately as printed (3-methylbutanal rows 8 and 10 of Table S4; 2-acetylfuran in Tables S2 and S4). Not keyed: rows with no value in any
  arm (2,6-dimethylpyrazine, 2-ethyl-6-methylpyrazine, 2-butyl-3,5-dimethylpyrazine), alkenyl / thio / hydroxymethyl pyrazines (not alkylpyrazines), 5-methyl-2-furanmethanol, maltol, and class subtotals
  other than total pyrazines. No methional, 2-methylbutanal, phenylacetaldehyde, furanone or 2-acetyl-1-pyrroline row is printed. Values are percentages of total GC-MS peak area (''-'' = not detected, no
  limit printed); no SD or n printed in the tables. Temperature ladders keyed per series (XS, XSC); cysteine vs none keyed per temperature; pairs with both arms not detected are not keyed. All arms: initial
  pH 7.6 (final pH differs by arm, Table 1 not transcribed), 2 h.'
