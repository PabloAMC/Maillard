  (citrate 2.15-5, phosphate 6-8, borate 9-10) with the two cross-buffer steps keyed as mixed. Time ladders keyed only for
  the highest-temperature series of Figs. 3, 5, 6 (the other series enter only through the Fig. 4 rate constants; neither
  reader keyed them as time contrasts). Oxygen: one amount pair (Figs. 6B vs 6C, 180 C, 12 min) and four rate pairs (Fig.
  4C). Fig. 3/5/6 y-axis printed ''umol/mmol PhIP'' (read as Phe). Table 2 cross-column (temperature + time) comparisons and
  Ea values not keyed. Oxygen level for nitrogen arms written ''inert''.'
