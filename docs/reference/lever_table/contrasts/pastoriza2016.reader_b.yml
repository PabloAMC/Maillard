source: pastoriza2016
pdf: data/articles/pastoriza2016.pdf
reader: b
scope_note: 'Not keyed: OPA fluorescence loss (Table 1), A420 (Table 5), fluorescence (Table 6) - not odorants/volatiles.
  Amino-acid identity (Gln vs Arg) keyed under a lever_class not in sec. 4. HMF and GIM are low-volatility furanics, keyed
  as printed. n.d. has no printed LOD (nd_no_limit). Time 0 arms are unheated baselines (HMF from dextrinomaltose). Temperature
  and amino-acid contrasts use 30 min (longest; no single main-result time stated). Final pH not printed.'
