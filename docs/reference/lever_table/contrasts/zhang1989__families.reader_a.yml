source: "zhang1989"
pdf: "data/articles/zhang1989.pdf"
reader: "a"
scope_note: "Single pair (cysteine vs glutathione). The PDF's last page belongs to a different paper (Kuo et al. 1989, pyrazine purge-and-trap); not keyed."
contrasts:
  - id: "zhang1989-1"
    odorant: "hexanal"
    lever_class: "sulfur source"
    lever: "cysteine vs glutathione (equimolar), with 2,4-decadienal"
    focal: true
    location: "Table I"
    digitised: false
    unit: "mg/mol (per mol cysteine or glutathione)"
    quant_type: "peak_area"
    quantity: "amount"
    time_course_rule: "not a time course"
    note: "quantified against an internal standard without response factors; also Table III (same values, keyed once)"
    arms:
      - label: "cysteine"
        lever_value: "L-cysteine"
        value: 278.6
        censor: "none"
        limit: null
        n: null
        sd: null
        conditions:
          ph: 7.5
          ph_basis: "initial"
          temp_C: 180
          time_min: 60
          precursors:
            "2,4-decadienal": "200 mg (0.001 mol) in 100 mL water"
            "cysteine": "0.005 mol in 100 mL water"
          buffer: "none (adjusted with 1 N NaOH or HCl)"
          matrix: "water"
          headspace: "sealed, unstated"
      - label: "glutathione"
