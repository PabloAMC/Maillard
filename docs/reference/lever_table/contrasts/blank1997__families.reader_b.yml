# Reader b, blind. Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: "blank1997"
pdf: "data/articles/blank1997.pdf"
reader: "b"
scope_note: "HDMF and EHMF (HEMF) by IDA, ug/mmol pentose, 90 C 1 h. Tables print means of at least two assays with only 'maximum SD <= 10%' (no per-arm SD; n not exact, left null). Table 3 water arms are unbuffered with pH not controlled (footnote c), keyed as buffer type. The same xylose/glycine and xylose/alanine pots (2.6/0.3, 0.9/7.5) recur in Tables 1, 3, 4 and 5; each table's lever is keyed once. Table 1 footnote c gives the xylose control without amino acid as '<0.01' for both furanones; it is used as the 'none' arm of the xylose amino-acid contrasts. No other qualifying odorants measured."
contrasts:
  # ---------------- Table 1: sugar identity (arabinose, xylose, ribose) ----------------
  - id: "blank1997-1"
    odorant: "HDMF"
    lever_class: "sugar identity"
    lever: "pentose: arabinose vs xylose vs ribose, with glycine"
    focal: true
    location: "Table 1"
    digitised: false
    unit: "ug/mmol pentose"
    quant_type: "absolute"
    quantity: amount
    time_course_rule: "not a time course"
    arms:
      - {label: "arabinose/glycine", lever_value: "arabinose", value: 5.1, censor: none, limit: null, n: null, sd: null, conditions: {ph: 6.0, ph_basis: "label", temp_C: 90, time_min: 60, precursors: {arabinose: "equimolar", glycine: "equimolar"}, buffer: "0.2 M phosphate", matrix: "buffer", headspace: "unstated"}}
