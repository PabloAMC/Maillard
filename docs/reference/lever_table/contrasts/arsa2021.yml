reader: resolved
scope_note: 'Resolved 2026-11-13 (step 11, A6 batch 2). Readers agree on every contrast (3 pyrazine pH ladders, Fig. 1 digitised;
  arm values within 0.03 dex, so no figure re-read was needed); base reader a. Spray-dried (160 C inlet / 80 C outlet) initial-pH
  arms pH 7 - 10 set with NaOH, no buffer (adjusted_unbuffered); ug/g by internal-standard semi-quantification (relative);
  no final pH printed. Not keyed: 2-ethyl-5-/2-ethyl-6-methylpyrazine (off the declared list). Conventions (resolver, uniform
  with batch 1): printed ND, ''-'', blank or 0 is nd_no_limit with value null; all-ND contrasts kept; one compound printed
  twice carries duplicate_of; co-eluting mixtures odorant_unlisted; odorant names canonicalised to the compound_keys display
  name, printed name in odorant_printed; IS semi-quantification and SIFT-MS ppb relative, calibration with authentic standards
  absolute.'
