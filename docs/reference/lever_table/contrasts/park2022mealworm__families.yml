source: park2022mealworm
pdf: data/articles/park2022.pdf
reader: resolved
scope_note: 'Table 2 is one 12-arm amino-acid network (MP-RF = no added amino acid, level ''none''); relative peak area vs benzyl acetate IS, n = 3; ND has no printed limit. Re-read: no. 1 is the parent
  pyrazine; alkenyl pyrazines nos. 10, 14, 19 are printed with values and kept as odorant_unlisted (nos. 10 and 14 are the same structure, isopropenylpyrazine, printed as two rows at RI 1015 and 1101; kept
  as printed); ''Sum of pyrazines'' is a printed row (no SD) keyed as ''Pyrazines''; methional is printed as two separate peaks (no. 56 ''Methional'', RI 904; no. 57 ''3-(Methylthio)-propanal'', RI 907),
  both keyed as Methional with the row number in location. 2-octenal, 2-nonenal, 2,4-decadienal are printed without stereo-descriptors while the table prints them elsewhere ((Z)-2-heptenal), so they are
  kept as printed with odorant_unlisted. No 2-/3-methylbutanal, 2-methylpropanal, DMHF/HEMF/norfuraneol, 2-acetyl-1-pyrroline, 2-acetylthiazole, pentanal or 1-hexanol in Table 2.'
