source: chansataporn2018
pdf: data/articles/chansataporn2018.pdf
reader: a
scope_note: All values digitised from figures (no tables); every time point keyed, rule time = longest (24 h model, 30 h extract); SD read from error bars only where bars clear the symbol, else null; phosphate
  buffer concentration not printed; aldehydes and pyrazines are class sums (individual compounds not printed); volatiles quantified vs propyl butyrate internal standard (keyed relative); HMF not detected
  in glucose/lysine and not plotted in extract (only furfural detected), no LOD printed; glucose/lysine vs chicken extract differ in many levers and share no plotted odorant, not keyed; the paper's focus
  is kinetic modelling, so all contrasts incidental; pyridine t0 and pyrazine/aldehyde t0 read as 0 (at axis zero).
