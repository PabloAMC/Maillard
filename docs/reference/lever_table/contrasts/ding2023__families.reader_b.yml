scope_note: 'Cysteine ladder A-E (110 C, 60 min); unheated F not keyed. (E)-2-octenal appears twice in Table 2 with the same CAS (rows 47 and 58): both keyed as printed. Pentanal (valeraldehyde) and (E,E)-2,4-decadienal
  are ND in all heated arms: not keyed. Total pyrazines printed only in text for A and E. Class subtotals (furans, N-containing, aldehydes) not keyed. ND has no printed LOD: nd_no_limit.'
