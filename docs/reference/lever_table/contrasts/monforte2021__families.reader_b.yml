# Reader b, blind double-keying, second round (families). Rules: docs/reference/lever_table/PREREG.md secs. 3 - 4.
source: monforte2021
pdf: data/articles/monforte2021.pdf
reader: b
scope_note: 'Phenylacetaldehyde only. Not keyed: metals (Fe/Cu) and SO2 additions (no lever class), sequential-addition curves (Fig. 3). Weibull k values (Fig. 2B,
  Table 1) and Table 2 release values (ppbv per unit time) keyed as quantity rate; cumulative amounts at 60 min digitised from Fig. 4B/D because no table prints them.
  pH/temperature arms contain Phe, gallic acid, glucose and Fe/Cu (per Sec. 3.2).'
contrasts:
- id: monforte2021-1
  odorant: phenylacetaldehyde
  lever_class: precursor dose
  lever: glucose absent vs added (2.4 mM), no metals
  focal: true
  location: Fig. 2A inset table ([Phenylacetaldehyde]final)
  digitised: false
  unit: ppb (cumulative, PTR-ToF-MS)
  quant_type: absolute
  quantity: amount
  time_course_rule: longest time
  note: final cumulative value after 60 min; PTR-MS signal converted to ppbv with a common rate coefficient
  arms:
  - label: Phe+Gal, no metals
    lever_value: glucose 0
    value: 13.9
    censor: none
    limit: null
    n: null
    sd: null
    conditions:
      ph: 3.4
      ph_basis: initial
      temp_C: 80
      time_min: 60
      precursors:
        phenylalanine: 2.4 mM
        gallic acid: 2.4 mM
      buffer: 10 mM tartrate (pH adjusted with NaOH)
      matrix: wine-like model solution (buffer)
      headspace: open flask, headspace swept with oxygen
