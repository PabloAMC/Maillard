# Reader A, STATUS_AND_PLAN sec. 0 step 9. Rules: PREREG secs. 3 - 4 + A1 - A6.
source: madruga1998
pdf: data/articles/madruga1998.pdf
reader: a
scope_note: 'Table 1 prints presence only (''+'' clear MS, ''nd'' not detected, no LOD); no amounts anywhere, so every arm
  has value null: ''+'' arms are keyed censor none with value null (detected, unquantified), nd arms nd_no_limit; none can
  enter an estimate. pH set by pyrophosphate buffer whose concentration is not printed (ph_control keyed buffered; strictly
  the concentration is missing). Final pH only as text ''decreased by less than 0.2 pH unit after heating'' (p. 262), no per-arm
  value, so final_ph null. Triplicate reactions (n 3). No pyrazines or 2-acetylthiazole were detected at any pH.'
