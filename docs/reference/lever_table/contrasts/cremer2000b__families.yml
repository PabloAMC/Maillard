source: cremer2000b
pdf: data/articles/cremer2000b.pdf
reader: resolved
scope_note: 'Group F. No table prints values; both contrasts digitised (300 dpi render). Fig. 2 (3-MB standardised to max
  = 1 vs pH, 60 min) is the same model data as Fig. 1 and is not keyed again. Plant powders (paprika, tomato) report only
  the sum of acetaldehyde + 2-MP + 2-MB + 3-MB, not a listed single odorant: not keyed. Fig. 5 carbonyl partners are not sugars
  (glyoxal, methylglyoxal); keyed under sugar identity as the nearest class.'
