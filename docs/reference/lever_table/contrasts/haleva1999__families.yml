source: haleva1999
pdf: data/articles/haleva1999.pdf
reader: resolved
scope_note: 'Re-read (third reader) of every contrast: the comparison matched none because the readers named the odorants
  differently (MF vs 5-methylfurfural; Furaneol vs Furaneol (HDMF)); odorants now carry the registry names 5-Methylfurfural
  and DMHF. Table 1 (MF, mg/L, mean +/- SEM n = 3; SEM not keyed as sd; ND without limit) values agreed and were confirmed.
  Fig. 1 re-digitised from a 500 dpi render with pixel-located ticks (A and C log axes, B linear); both readers had read the
  log panels too low (pH 5 Rhm+Arg + Cys ~23-28, not 17-20 mg/L; pH 7 Rhm + Cys 5/10 mM ~6, not 3 mg/L), so those values are
  replaced. The shared no-thiol control drawn in both pH 5 panels is keyed once at 9.3 mg/L. Fig. 1A pH 5 rhamnose-only bars
  absent: text says Furaneol not detected with rhamnose alone, <0.5 mg/L with 5 and 10 mM Cys; absent bars nd_no_limit (the
  all-ND AcCys ladder and the 1 mM pair are kept; they enter no estimate). Fig. 2 is Furaneol (20 mg/L) ADDED to sugar-free
  buffer pH 3.5 and heated 48 h at 70 C with thiols, the amount remaining keyed as system fed_odorant, quantity amount (reader
  B had keyed it rate). HMF out of scope; Rhm+Arg pH 7 and glucose Furaneol are data not shown. Sulfur-source levels: cysteine,
  n-acetylcysteine.'
