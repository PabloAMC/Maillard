source: "zhang1991"
pdf: "data/articles/zhang1991.pdf"
reader: "b"
scope_note: "Table I, IMP-Cys vs IMP-GSH; blank cells keyed nd_no_limit; mg/mol is an internal-standard (tridecane) estimate, keyed peak_area; the two arms' measured pH differ slightly (2.3 vs 2.2) as printed; bis(2-methyl-3-furyl) disulfide and H2S not reported."
