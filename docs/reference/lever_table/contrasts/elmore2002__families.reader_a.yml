  ribose; heptanal 18:3n-3 vs 18:3n-3 cysteine ribose; 1-octen-3-ol 18:3n-3 vs 18:3n-3 cysteine ribose; (E,E)-2,4-decadienal
  18:3n-3 vs 18:3n-3 cysteine ribose. Mixed contrasts = cysteine+ribose added (two precursors), discussed in text.'
