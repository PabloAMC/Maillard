source: chen2024coprinus
pdf: data/articles/chen2024.pdf
reader: a
scope_note: '''-'' keyed as nd_no_limit (no LOD printed), ''N.Q.'' (low S/N) as trace; blank table cells (3-methylbutanal
  R-GA, methylpyrazine X-GA, 2,5-dimethyl-3-(3-methylbutyl)pyrazine X-C) are omitted arms; contrasts with no detected arm
  not keyed. Cysteine/methionine/proline/glutamic acid keyed as amino acid identity (4-level). Only group-T odorant reported:
  bis(2-methyl-3-furyl) disulfide; no MFT/FFT/H2S. Ribose vs xylose with cysteine not keyed (both ND).'
contrasts:
- id: chen2024coprinus-1
  odorant: bis(2-methyl-3-furyl) disulfide
  lever_class: sugar identity
  lever: ribose vs xylose with methionine
  focal: true
  location: Table 1, pp. 8-9
  digitised: false
  unit: ug/L (semi-quantitated vs internal standard 2-methyl-3-heptanone)
  quant_type: peak_area
  quantity: amount
  time_course_rule: not a time course
  arms:
  - label: R-M MRPs
    lever_value: ribose
    value: 9.37
    censor: none
    limit: null
    n: 3
    sd: 1.29
    conditions:
      ph: 7.4
      ph_basis: initial
      temp_C: 125
      time_min: 120
      precursors:
        Coprinus comatus protein hydrolysate (CPEH): 30 g
        methionine: 0.2 g
        ribose: 0.4 g (amino acid:sugar 1:2 w/w)
