source: chen2000
pdf: data/articles/chen2000.pdf
reader: resolved
scope_note: 'Resolved 2026-11-13 (step 9, post-A6). Base reader b (54 = reader a''s 40 + 14 contrasts a did not key: 11 with
  all arms not detected, kept by convention, and 3-ethyl-2,5-dimethylpyrazine = 2-ethyl-3,6-dimethylpyrazine, which a skipped).
  Every value both readers keyed agrees and was checked against Table 2. 2x2 design (initial pH 5/8.5 x urea 0/0.01 mol),
  180 C, 2 h, no buffer; final pH from Table 4. Urea keyed lever_class precursor dose, lever naming urea (amine source added).
  Bare ''pyrazine'' keyed as Unsubstituted pyrazine (not the class). ''2,5- (and 2,6-) dimethylpyrazine'' is one co-eluting
  peak: odorant_unlisted. Table 3 (urea + acetoin / diacetyl) tetramethylpyrazine pH pairs keyed (diacetyl pair all not detected).
  Values are mg/g ribose vs a tridecane internal standard: relative. Conventions applied (resolver, uniform across batch 1):
  a printed ND, ''-'', ''–'', blank, 0, 0.000 or 0±0 is censor nd_no_limit with value null; contrasts whose arms are all not
  detected are kept (keyed, counted, enter no estimate); only run pairs differing in exactly one factor are keyed; odorant
  names canonicalised to the compound_keys display name with the printed name in odorant_printed; quant_type absolute only
  where the paper states calibration with authentic standards for that compound, internal-standard semi-quantification relative.'
