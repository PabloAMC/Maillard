source: pastoriza2016
pdf: data/articles/pastoriza2016.pdf
reader: a
scope_note: 'Odorants keyed: HMF, furfural, glucosylisomaltol (HPLC-UV, mg/L). Not keyed: OPA fluorescence loss, A420, fluorescence (not odorants). Amino-acid identity (Gln vs Arg) keyed with lever_class
  "amino acid identity", a class outside the template list. No LOD printed: n.d. keyed nd_no_limit. Temperature and amino-acid contrasts use 30 min (longest; no main-result time declared). Times exclude
  a ~2 min come-up. t=0 HMF (0.04) is from the dextrinomaltose ingredient. No final pH printed.'
contrasts:
