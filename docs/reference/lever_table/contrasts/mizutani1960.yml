    odorant: "Hydrogen Sulfide"
    lever_class: "sulfur source"
    lever: "sulfur compound heated (equal sulfur, 32 mg S), H2S liberated after 6 h"
    focal: true
    location: "Table I, p. 384"
    digitised: false
    unit: "ug H2S liberated"
    quant_type: "absolute"
    time_course_rule: "longest time"
    resolution: "re-read"
