source: "mizutani1960"
pdf: "data/articles/mizutani1960.pdf"
reader: "resolved"
scope_note: "Table I only (Table II is ammonia). Heated (120 C oil bath) aqueous solutions of cysteine-aldehyde thiazolidines, no sugar; values are cumulative H2S swept out of the flask by CO2. Sulfur-source contrast at 6 h (longest time; no main time stated); it omits L-cysteine-furfural (II), which differs from (I) only by >1 month storage and has no 6 h value. The '-' printed for n-butyraldehyde at 0.5 h is keyed nd_no_limit; the '-' for furfural (II) at 6 h follows a cumulative 723 ug at 3 h, so it means not measured, and that arm is omitted (not a censored arm)."
