source: "kumazawa2003"
pdf: "data/articles/kumazawa2003.pdf"
reader: "resolved"
scope_note: "Model solutions are FFT (1 ppm) degradation in McIlvaine buffer, not Maillard formation from precursors. Fig. 3 (FFT residual ratio vs pH, same samples as Table 3) not digitised because Table 3 prints the values. Table 1 is GCO-H FD factors in a coffee drink; 2-furfuryl methyl disulfide and methanethiol are not on the odorant list. Table 2 buffer/FFT level not restated for that table; conditions copied from the Methods model experiment. Contrast 7 compares unheated (0 min) with retorted (10 min, 121 C) coffee: a 0-min arm has no log time, so it cannot enter a doubling-of-time slope as keyed."
contrasts:
  - id: "kumazawa2003-1"
    odorant: "2-Furfurylthiol (FFT)"
    lever_class: "pH"
    lever: "buffer pH 6.8 vs 6.0, 121 C 10 min"
    focal: true
    location: "Table 2, p. 2677"
    digitised: false
    unit: "% residual ratio"
    quant_type: "relative"
    time_course_rule: "not a time course"
    resolution: "agreed"
    arms:
      - {label: "pH 6.8, 121 C 10 min", lever_value: 6.8, value: 5.5, censor: none, limit: null, n: null, sd: null,
         conditions: {ph: 6.8, ph_basis: "label", temp_C: 121, time_min: 10, precursors: {2-furfurylthiol: "1 ppm"}, buffer: "citric acid / Na2HPO4 (mixed 1/10 M citric acid and 1/5 M Na2HPO4)", matrix: "buffer", headspace: "sealed (canned without deoxidization)"}}
      - {label: "pH 6.0, 121 C 10 min", lever_value: 6.0, value: 48.3, censor: none, limit: null, n: null, sd: null,
         conditions: {ph: 6.0, ph_basis: "label", temp_C: 121, time_min: 10, precursors: {2-furfurylthiol: "1 ppm"}, buffer: "citric acid / Na2HPO4 (mixed 1/10 M citric acid and 1/5 M Na2HPO4)", matrix: "buffer", headspace: "sealed (canned without deoxidization)"}}
