  keyed once via Table 1). Tables 3 and 4 vary the carbonyl precursor (not only sugars) and are keyed as sugar identity for
  want of a precursor-identity class. Table 10 hydroxyacetaldehyde/mercapto-2-propanone and thiamin arms differ in more than
  one lever, not keyed.
