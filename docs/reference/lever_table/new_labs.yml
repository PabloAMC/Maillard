# Laboratories absent from the frozen split v1 (docs/reference/contrast_benchmark/split.yml), and the keying queue of
# their papers (PREREG secs. 2 and 7; STATUS_AND_PLAN sec. 0 step 5).
#
# Written 2026-11-12, BEFORE any reader file of these sources exists and before any of their result values was read:
# the laboratories were assigned from the papers' author lines and affiliations only. A laboratory listed here is TEST
# (PREREG sec. 2) unless its id is a DEVELOPMENT laboratory of split v1. lab_ids.yml and split.yml are not edited.
#
# Laboratory assignment follows lab_ids.yml's merge rules: one research group = one laboratory (rule 1); an
# institute's co-author groups merge only when the same senior authors chain the papers (rule 2); a two-group paper is
# the lead (home) group's (rule 4). Where a paper's senior authors also carry the affiliation of a split laboratory,
# the paper is given THAT laboratory: over-merging can only move contrasts from TEST to DEVELOPMENT, never fake
# independence (lab_ids.yml rule 2's own rationale).
#
# `engine_seen: true` marks a source whose results already entered engine work (step 0's diagnosis, the directional
# claims panel or the contrast benchmark). Its contrasts enter the lever table, but step 5 does not count them as
# held-out evidence for the engine.
#
# Fields: lab (id), lab_name, doi, pdf (main checkout, data/articles/), priority (download queue), cells (what the
# queue expected the paper to feed, from title / abstract / design only).

