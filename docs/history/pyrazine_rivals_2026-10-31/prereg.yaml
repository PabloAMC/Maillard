# ---------------------------------------------------------------------------------------------------------------
power_check:
  method: "for each test, synthetic data from each rival at the noise bands above (2000 draws per rival per dataset); power = P(the rule separates rival X from the null | X true); size = P(rule fires | null true)"
  drop_rule: "a test with power < 0.6 against the rival it is meant to discriminate, or size > 0.1, is NOT scored (reported only)"

# ---------------------------------------------------------------------------------------------------------------
verdict_rules:
  admitted: "passes every powered test within its bands; PROVISIONAL if the passing evidence is single-lab for its discriminating channel"
  rejected: "fails a powered test whose failure is not removable inside the declared bands, in >= 2 labs or in one lab plus a mass balance"
  inconclusive: "otherwise"

expectations:    # my probabilities before any run
  - {claim: "P0 rejected (S5a and/or S6)", p: 0.85}
  - {claim: "S1 powered against P2 / P1x at the calibrated noise", p: 0.8}
  - {claim: "shared-constant family (P0, P1) rejected by S1 + S2 (two labs)", p: 0.65}
  - {claim: "S3 powered at the PRIMARY (uncorrected [M-H]) band", p: 0.3}
  - {claim: "S3 powered at the SECONDARY (corrected) band", p: 0.7}
  - {claim: "P1x rejected at the primary band", p: 0.25}
  - {claim: "P2 (some sub-variant) admitted, provisional", p: 0.55}
  - {claim: "P2a_aa rejected in the 180 C matrices (S4), not testable in water", p: 0.7}
  - {claim: "NC fails S4 (control works)", p: 0.97}
  - {claim: "final picture: P0 rejected; P1 rejected or inconclusive; P1x and P2b not separated by on-disk data at the primary band", p: 0.45}

# ---------------------------------------------------------------------------------------------------------------
amendment_1:   # 2026-10-31 14:30, BEFORE the script existed or any number was simulated
  issue: >
    The alternative rivals are NESTED around the null (P1x at u = 1 and P2 at e = 0 are P1). Band-averaged power
    over an uninformed band is then dominated by its near-null part and measures the band, not the test.
  change: >
    Power is reported two ways: (i) band-averaged (as above) and (ii) at the MATERIAL effect, declared now:
    S1/S2: the rival at least doubles R relative to the null bound (P2: e >= 0.41; P1x: u >= 5.8), h in its band;
    S3: P2 with extra share w = e/(1+e) >= 0.3 and (|g - f_pairing| >= 0.2 or rho >= 0.5);
    S4: P2a_aa with w >= 0.3; NC as declared;
    S5a: P1 with an aminoketone sink >= 3x the pyrazine flux (B_true >= 0.48);
    S6: P1 with Y <= 0.1;
    S7: P1 with a partition pH effect drawn U[-1, +1] dex.
    The DROP RULE applies to (ii); (i) is reported. Size is always computed at the null's least favourable
    point inside its bands (h = 1, leakage at band top, transfer at band edge).
  also: "S6 is reported for GO as well as MGO (both Table 4 argon rows were listed under S6 data)."
