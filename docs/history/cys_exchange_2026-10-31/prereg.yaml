datasets:   # every on-disk dataset bearing on the exchange: role
  zhai2021_fig6_cys_xyl: {role: "tests T1, T2, T3 (Cys, Xyl at 100 C, 4 pH, +-Xyl); xylose-only control = k_x input", lab: jiangnan}
  zhai2021_fig4b_ttca_ph_ladder: {role: "forced TTCA input for T1-T3 AND test T4 (exchange gate) on the 8 pots", lab: jiangnan}
  zhai2021_fig3a_ttca_tladder: {role: "test T4 at 120 / 140 C (pH 5.5, TTCA alone; 100 C duplicates Fig. 4b pH 5.5)", lab: jiangnan}
  zhai2021_fig5_dicarbonyls: {role: "forced input of E3's adduct sink only. NOT scored: dicarbonyls are downstream of the CAMA / deoxyosone hub (B7, single-lab, uncertain); no exchange rival predicts them without importing the hub"}
  zhai2019_fig3a_ttca_cama: {role: "tests T5 (approach), T6 (plateau) at 70 and 90 C; CAMA forced; t = 0 point = initial condition. 110 / 130 C EXCLUDED: TTCA peaks at 20 min then falls (net of an unbanded TTCA degradation at pH ~6-7, no band from other data), so the exchange signal at 20 min is confounded by a free nuisance per temperature", lab: jiangnan}
  zhai2019_fig3b_dicarbonyls_ttca: {role: "EXCLUDED: TTCA 5 mM +- Cys 5 mM, 120 C, only dicarbonyls printed (no TTCA / Cys series). The +Cys suppression discriminates the dicarbonyl ROUTE (TTCA -> CAMA vs free xylose), not the exchange; every rival predicts Le Chatelier retention of TTCA", lab: jiangnan}
  cao2017_fig4ab_cys_xyl: {role: "test T7 (equilibration speed) with fig5", lab: btbu}
  cao2017_fig5_ttca_cama_glyarp: {role: "TTCA -> T7; CAMA forced input; glycine arms EXCLUDED (slurries, Flag 1; glycine unmeasured)", lab: btbu}
  cao2017_fig4c_ph: {role: "input: in-situ pH of the Cao pot (E1 phosphate base fraction; E2 / E4 pH law)", lab: btbu}
  kang2026_figS3: {role: "EXCLUDED: dossier-only digitisation (not keyed); the 100 C series duplicates Zhai 2021 Fig. 6 pH 7 to the digit (not independent); 120 / 140 C have no TTCA series to force"}
  kang2026_figS4_and_pH_drift: {role: "BANDS only (k_th; E2's dilute drift)"}
  zhai2023jafc / zhai2023foodchem / hou2017: {role: "EXCLUDED: no TTCA, free Cys or free Xyl series (dicarbonyls, volatiles, UV only)"}
  kallen1971 / fife1991 / schubert1939 / deroos2005: {role: "BANDS only (no TTCA-Xyl measurement)"}

