tests:
  T1_xyl_contrast_cys:   {data: zhai2021_fig6, obs: "mean log10 Cys(+Xyl)/Cys(-Xyl), 60-120 min, per label pH (4)", sigma: 0.07, kind: 6}
  T2_cys_level:          {data: zhai2021_fig6, obs: "log10 Cys(120 min) TTCA-alone, per pH (4); shared figure offset tau 0.20 + point 0.061", kind: 5}
  T3_xyl_consumption:    {data: zhai2021_fig6, obs: "log10 Xyl(TTCA+Xyl, 120) / Xyl(control, 120) at pH 5.5 / 6 / 7 (3)", sigma: 0.05, kind: 6,
                          excluded_point: "pH 8: xylose falls 6.39 -> 2.99 mM at 80-120 min while TTCA < LOD; no exchange rival can route it through TTCA (needs turnover > 8 /min; red team sec. 6) -- it tests a non-exchange xylose sink"}
  T4_exchange_gate:      {data: [zhai2021_fig4b (8 pots, 100 C), zhai2021_fig3a (120, 140 C, pH 5.5)], obs: "v = max_t [integral of net exchange release - measured TTCA loss]_+ / charge, per pot (10); observed 0", sigma: 0.03, kind: 5,
                          basis_sigma: "TTCA replicate SD 0.1-0.4 mM of 10 mM (Fig. 4b / 3a bars)"}
  T5_formation_approach: {data: zhai2019_fig3a, obs: "f20 = (TTCA20 - TTCA0) / (TTCA60 - TTCA0) at 70 and 90 C (2)", sigma: 0.06, kind: 7, basis_sigma: "read +-0.7 mM, ELSD non-linearity, model floor"}
  T6_formation_plateau:  {data: zhai2019_fig3a, obs: "log10 mean TTCA 60-160 min at 70 and 90 C (2)", sigma: 0.04, kind: 5}
  T7_cao_equilibration:  {data: cao2017 fig4ab + fig5, obs: "log10 Q(30 min) / mean Q(60-300 min), Q = TTCA / (Cys Xyl) (1)", sigma: 0.06, kind: 7, basis_sigma: "Cys SD 7 % and TTCA bar +-10 % at 0.5 h, Xyl 2 %; floor 0.03"}
lab_split: {jiangnan: [T1, T2, T3, T4, T5, T6], btbu: [T7]}

# ---------------------------------------------------------------------------------------------------------------
power:
  method: "N_score = 600 draws per rival inside its bands; N_truth = 80 further draws per rival as synthetic truths + realistic noise (the sigmas above; T2 with the figure offset). Pairwise power = P(truth's band log-marginal > the other's), both directions averaged."
  rule: "A test is SCORED if its pairwise power >= 0.8 for at least one pair among E0-E4; otherwise dropped (reported). Controls enter scoring but not the power rule."
scoring:
  - "Per test and joint (scored tests only): log-marginal (mean likelihood over band draws) and feasibility share (draw within 2 sigma on every component; T2 after the best figure offset within 2 tau; T4 v <= 0.06)."
  - "Feasibility search (not a fit; constants are not reported as estimates): for any rival with joint feasibility 0 of 600, scipy differential_evolution on max |z| over the scored tests, inside the bands (<= ~3000 evaluations)."
verdict_rule:
  admitted: "joint feasibility > 0 (sampled or by search, max |z| <= 2) on the scored tests of BOTH labs and joint log-marginal within 3 nats of the best rival -> 'admitted, provisional' (Zhai 2019 / 2021 one lab; Cao the only cross-lab check, on one test)"
  rejected: "the search's best max |z| > 3 on the scored tests, with the failing test(s) powered against that rival"
  inconclusive: "otherwise (2 < best max |z| <= 3, or failing only on an unpowered / single-component test)"
  controls: "NC1 must fail T4 and NC2 must fail T5 / T7, else the battery is broken and nothing is read"

# ---------------------------------------------------------------------------------------------------------------
expectations:   # probabilities stated before any run
  controls_fail_as_designed: 0.95
  T4_powered_fast_vs_slow: 0.9          # E0 / E3 / NC1 vs E1 / E2 / E4
  T1_powered_fast_vs_slow: 0.75
  T5_powered_NC2_vs_rest: 0.9
  T5_separates_E1_from_E2: 0.4
  T6_powered_E2_vs_E0: 0.6
  T7_powered_slow_vs_fast: 0.8
  E0_fails_T4: 0.9
  E0_passes_T7: 0.8
  E0_rejected: 0.85
  E3_rejected: 0.8                      # a sink cannot repair the gate (it drains TTCA faster)
  E1_passes_T4_and_T7: 0.5
  E1_fails_T5_with_T4: 0.6              # physchem-pinned catalysis gives <= x3.5 at 83 mM vs x1.3 at 10 mM
  E1_admitted: 0.2
  E2_admitted: 0.15                     # an acid limb can separate Cao (pH 4.5) from Zhai 2021 (5.1-5.5) but slows Zhai 2019 (pH 6-7)
  E4_admitted: 0.25
  no_rival_admitted: 0.5                # then the conflict points outside the listed structures
  unlisted_live: >-
    (i) observation operator: post-quench re-equilibration at 4 C / RT before HPLC (exothermic K) inflates TTCA in
    concentrated pots and the t = 0 point; (ii) ELSD non-linearity (Zhai 2023d prints log-log calibrations);
    (iii) Zhai 2019's Xyl : Cys 2 : 1 vs "equimolar" (Flag 3) -- changes the plateau, not the approach.
