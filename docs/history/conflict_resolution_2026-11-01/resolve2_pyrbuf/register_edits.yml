# 4. experiment_register.yml: a new entry
experiment_entry:
  - id: EX-NEW
    date: "2026-11-01"
    kind: probe
    question: "Batch-2 resolution (resolve2_pyrbuf): the form of buffer catalysis (E5 / CF-011); whether Piloty 1979 discriminates E4's step vs supply; which pyrazine rivals produce condition-dependent R; three early-step items (Huber F15 -> F07, the a_w maximum, Wolf's lysine plateau)."
    hypothesis: "Neutral; rivals, bands (DEV / unsplit only), decision rules and probabilities in the prereg before any number."
    design: "Arithmetic on dossier / keyed TEST tables (Potman, Larralde, Kallen, Thornalley for E5; Lee 2024 for E13) with a power check for the form test and a negative control (carboxylates on Amadori decay). An in-memory engine probe of Piloty's pot under the shipped slope and s = 0, with a no-MGO control. A pool-invariance test of R on time courses and supply arms (Shibamoto 1976, Koehler 1969, Lee 2024)."
    expected: "see prereg.md"
    artifacts: [docs/history/conflict_resolution_2026-11-01/resolve2_pyrbuf/prereg.md, docs/history/conflict_resolution_2026-11-01/resolve2_pyrbuf/results.md]
    commit: pending
    verdict: partial
    conclusion: >-
      E5: buffer catalysis is linear per step (Potman TEST, power 1.0); Kallen's saturation is a change of rate-determining
      step (predicted within 0.2 dex); selectivity is step-specific (P 0.6: carboxylates speed browning and free-sugar
      loss, not Amadori decay); the pH 8 'fade' is the uncatalysed rate rising (Potman pH 9 reproduced, -0.03 dex);
      browning is not the Amadori step. E4: Piloty is not discriminating (the engine's Strecker step is <= 1e-3 of its
      measured consumption under both rivals); it exposes a missing dicarbonyl-amine adduct sink (~1e3x). E13 / E14: P0
      rejected (5 labs); a lower-order extra MPZ route rejected by pool invariance (Shibamoto time course, |z| 3 - 6;
      Koehler); pair-specific constants survive, separable from a second-order extra route only by labels; Lee 2024 fails
      the pairing bounds at both readings of its x10 conflict. Huber: F15 -> F07. a_w: Cui is end-point, no conflict.
      Wolf: neither glycation structure gives the plateau.
    follow_up: >-
      A3: E5 as a linear per-step factor with the proposed bands (red team first); a citrate arm in CF-011's buffer arm C
      and on fed DFG decay; the E4 designed pot must measure the aldehyde, not amino-acid loss; download Wolf 1977a;
      Zhou 2024 raw ions (EX-052 open).
