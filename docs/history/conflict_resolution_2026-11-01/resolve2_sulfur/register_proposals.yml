CF-076_amend:
  sources_add: [karpinski1990, radomski1989, bustillotrueba2018, kallen1973]
  tests_append: >-
    resolve2_sulfur re-test (2026-11-01; scratchpad resolve2_sulfur/results.md, phi1_retest.json; DEV-lab feasibility
    only, E10 has one TEST lab). Release anchored at 25 C by Karpinski 1990 (pentose-Cys ring AThz 1.8e-4 /min at pH
    6.0, phi = AThz/Thz ~1, Warsaw), band k25 [3e-5, 2.5e-4] (deflated for Karpinski's x3.3 phosphate / ionic-strength
    excess over Kallen's TC), coupled to k_r45(100) through Kallen's pH shape and one Ea; pKa_T 5.2-6.1 (Radomski 1989).
    S1, DE maxiter 20. Controls: NC1 58, NC2 34 (fail); uncoupled E4c 1.29 (passes). Coupled E2c 1.40 and E4c 1.76 in
    the class band, both ONLY at k25's floor (3.0-3.2e-5) with Ea 40.6-42.9 at its floor; Ea 30 fixed 1.10 (k25 still at
    its floor); Ea 50 fixed 3.43 and Ea 64 fixed 11.95 (rejected; T4, T8b). Post hoc, k25 fixed at the printed 1.8e-4:
    feasible (1.39) only with Ea 26 and the steepest acid limb (s_lo 0.81). Every feasible point has pKa_T 5.2-5.5,
    inside Radomski's band: the pKa is no longer the binding unknown; the release Ea is.
  explanations_first_replace: "In-situ pH with Kallen-shaped K(pH) and k_r(pH), TTCA ring-N pKa 5.2-5.5: feasible with the release rate anchored at 25 C by a pentose-Cys ring (Karpinski, phi ~1) ONLY if the release Ea is <= ~45 kJ/mol (Ea 26 at the printed rate, ~40 if Karpinski's rate is deflated x6 for buffer catalysis); rejected at Ea >= 50. No thiazolidine release Ea has been measured. Admitted, provisional and CONDITIONAL on a low release Ea; P 0.35 (was 0.45)."  # and: K-released 0.2 -> 0.25; unlisted 0.2 -> 0.25
  remedy_append: >-
    Update 2026-11-01 (resolve2_sulfur): the declared band k_r(100 C, pH 4.5) 2-8e-4 /min stands only with a release Ea
    of ~17-45 kJ/mol; at class-typical Ea (>= 50) the phi ~1 anchor rejects the family. Cheapest decider, ahead of
    the pKa titration: ONE Arrhenius series of cysteine release from TTCA (or Karpinski's AThz) at fixed pH 4.5 and 6,
    25-90 C, cysteine trapped (iodoacetate / N-ethylmaleimide) or by voltammetry; Ea <= 45 keeps the admission, >= 55
    returns CF-076 to plain OPEN. The pKa titration stays second. No engine change.

# ---------------------------------------------------------------------------------------------------------------
# 2. NEW: van den Ouweland 1975 is not an MFT source (Q2)
# ---------------------------------------------------------------------------------------------------------------
- id: CF-092
  kind: code_mismatch
  scope: corpus
  sources: [vandenouweland1975, whitfield1999, hofmann1998_reconciliation, hofmann1995]
  quantity: "identity of the aromatic furanthiol from norfuraneol (NF) + H2S, and what the repo cites van den Ouweland & Peer 1975 for"
  observation: >-
    van den Ouweland & Peer 1975 (Unilever Duiven; NF + ~100x H2S, water, 95-100 C, 4 h, no yields) print peak 3 as
    4-mercapto-2-methylfuran, drawn with SH remote from the methyl, and name the MFT-pattern products only as the
    dihydrofuran (3-mercapto-2-methyl-4,5-dihydrofuran) and thiophenes. The repo's legacy texts describe the paper as a
    synthesis of MFT from NF (docs/history/AUDIT_legacy_lane_2026-08.md, README_legacy_lane_2026-09-03.md,
    tasks/audit_remediation.md, docs/validation/isotope_topology_evidence.md row 12), and the deep-research backlog
    describes it as "MFT in cooked pork by SIDA". Whitfield & Mottram 1999's introduction says it identified MFT;
    Hofmann & Schieberle 1998 say it could not identify MFT. Whitfield 1999 also finds none of the dihydro derivatives
    that van den Ouweland reports.
  explanations:
    - "Mis-citation (the citation trail, not the paper): the print names, draws and regio-distinguishes the 4-isomer (Table I lists both 3- and 4-mercapto-2-methylthiophene, peaks 10 and 13; footnote a: checked against synthesised references); its MS [M-H]+/M+ 0.50 vs MFT's 0.28. Hofmann 1995 cites it for 2-methyl-3-thiophenethiol, Whitfield 1999's own Table 1 cites MFT to Evers 1976. P 0.85."
    - "The authors misidentified MFT as the 4-isomer (packed GC, a synthesised 4-isomer reference): P 0.15. A misnaming in the print (intending MFT): P <= 0.05."
    - "The dihydro products vs none (Whitfield 1999): conditions (100x H2S, strongly reducing, unbuffered, 95-100 C / 4 h vs ~2x H2S, pH 4.5 phosphate, 140 C / 1 h), P 0.6; packed-column co-elution / identification, P 0.25; unlisted 0.15."
  tests:
    - "Read Table I from the 220 dpi render (scratchpad ing1101/vohi-2r.png): name, drawn structure and the table's own 3- / 4-isomer distinction agree on the 4-isomer (resolve2_sulfur/corrections.md sec. B)."
    - "Citation contexts read in the PDFs: hofmann1998.pdf intro ('unable to identify MFT'); whitfield1999.pdf intro (says MFT) vs its Table 1 (MFT cited to Evers 1976; van den Ouweland only for 2-methyl-3-thiophenethiol) and discussion (dihydro derivatives)."
    - "Route existence without it: fed NF makes MFT in four laboratories on disk (Cerny 2003 pot D, labelling, 95 C; Hofmann 1998 Table 4, 145 C; Whitfield 1999 / 2001, 140 C; de Roos 2005, boiling). The NF route's existence does not depend on van den Ouweland (P 0.97); E6 (the NF share) never did (no yields)."
  status: error_confirmed
  remedy: >-
    Erratum lines (history files are not rewritten) in AUDIT_legacy_lane_2026-08.md, README_legacy_lane_2026-09-03.md,
    tasks/audit_remediation.md; correct docs/validation/isotope_topology_evidence.md row 12 and line ~100; fix the
    backlog description at its source (03_thiamine_degradation.md l. 590) and regenerate deep_research_backlog.json;
    flag the intro sentence in whitfield1999_extraction.md; vandenouweland1975_extraction.md: P(misidentified MFT) 0.3
    -> 0.15 with the reasons. No model change: k_nf_mft and E6 never rested on this paper.
  affects:
    - {file: docs/validation/isotope_topology_evidence.md, symbol: "row 12 Norfuraneol"}
    - {file: results/literature/deep_research_backlog.json, symbol: "van den Ouweland & Peer (1975)"}

