# 3. CF-031: amend (Q4). Append to sources / observation / tests; new explanation first; remedy rewritten.
# ---------------------------------------------------------------------------------------------------------------
CF-031_amend:
  sources_add: [zhang2022, zhang2021, yiltirak2026]
  observation_append: >-
    [Amended 2026-11-01, resolve2_sulfur] Zhang 2022 SI (Hefei; Xyl + Cys, pH 7.2 unbuffered, 120 C / 90 min, 4:1
    oil : aqueous, phases separated): water-phase FREE MFT x0.36-4.8 and FFT x0.93-6.5 vs the oil-free control, i.e.
    the opposite sign to Xu 2011 (same sugar, amino acid and temperature) and Reading. But the control holds 95 % of its
    MFT pool as bis(2-methyl-3-furyl) disulfide (2.81 vs 0.14 ng/mL), which vanishes from every raw-oil water phase:
    free + disulfide MFT falls x1/3.4-1/25 (raw oils), x1/1.0-1/3.5 (lipase-hydrolysed, mildly oxidised ENTH oils).
    Measured species by lab: free MFT only -- Xu 2011, Whitfield 1988, Yiltirak 2026, Zhang 2021 (CMRC, keyed TEST),
    US 8,920,862, du2025; free AND disulfide -- Elmore 2002 (pool x1/17 with linoleate, < 1/100 with linolenate) and
    Zhang 2022. Zhang 2021 (0.07-0.24 % phospholipid, no bulk oil phase): MFT x0.31-0.60 in 6 / 6 contrasts, FFT
    x0.70-1.83.
  explanations_prepend:
    - "Measurement species (free thiol vs free + disulfide pool): both labs that measured the disulfide (Reading / Elmore 2002, Hefei / Zhang 2022) see the MFT POOL fall by comparable factors (x1/17; raw-oil median x1/13), as Xu 2011's free MFT does (x1/21, fresh lard). Zhang 2022's free-MFT rise is a speciation shift (the oil-free control is 95 % disulfide; with oil the water phase holds free MFT only). EXPLAINS the sign disagreement Zhang 2022 vs Xu 2011 / Reading; P 0.65. Not explained by it: the oxidation direction (Zhang's ENTH oils suppress less, but they are lipase-hydrolysed with PV <= 4.3 vs Xu's 184; free fatty acids raise MFT in du2025: hydrolysis, P ~0.5); the Nestle mesophase raise (single run)."
  tests_append:
    - >-
      resolve2_sulfur (2026-11-01; scratchpad resolve2_sulfur/corrections.md sec. C): species table per lab from the
      Methods and tables; the pool rule (pre-registered: labs measuring the disulfide agree within x3 on pool
      suppression; free-only labs diverge) holds: Elmore x1/17 vs Zhang 2022 raw-oil median x1/13. Partition is
      excluded as the main term: Zhang 2021 lowers MFT with 0.07-0.24 % phospholipid and no bulk oil phase; Zhang 2022
      water-phase FFT rises under 4:1 oil (pure partition: x1/20-1/400). Post hoc sign check on the keyed TEST table
      (data/lit/fit_rows/heldout_zhang2021_table3.yml, not a score): MFT falls, and falls more than FFT, in 6 / 6
      phospholipid contrasts.
  status: open   # the Zhang 2022 sign part is EXPLAINED (P 0.65); the entry as a whole stays open (oxidation direction, Nestle raise)
  remedy_replace: >-
    Direction for the E7 writer (not applied): ONE term, a lipid-electrophile capture of the MFT pool (free +
    disulfide), first order in MFT and lipid-carbonyl load, MFT-selective over FFT (log-suppression ratio >= ~3;
    Huazhong, Reading, Hefei, consistent with CMRC). No oil-phase partition term (not supported cross-lab). No
    oxidation-dose law and no free-MFT 'protection' term (one lab each). Every E7 row carries `mft_species: free |
    pool`; free rows are compared with free MFT only where the pot's disulfide share is known or bounded. Carried
    failure: this structure predicts the TEST contrast F25#17@us8920862 (MFT x10 up) wrong in sign. Ask Zhang et al.
    (Hefei) for n / SD and the absolute charge (flag 1); ask Xu et al. whether bis(2-methyl-3-furyl) disulfide was
    seen. Designed (ENGINE_VS_LITERATURE E7 row): add free + disulfide (or TCEP-reduced total) MFT to the buffer /
    fresh / oxidised oil arms.
  affects_add: [zhang2022_fig2_fig4_xyl_cys_oil_water, zhang2022_text_lipid_volatiles_and_si_tables, zhang2021_tab3_cys_xyl_phospholipid_reheat, elmore2002_tab1_tab3_cys_ribose_pufa_ester]
