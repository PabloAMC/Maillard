  # THIS IS THE ROW THE CAMPAIGN ASKED FOR. sources.liu_2021_ncsu_thesis carried the note
  # "The hexanal / heptanal / octanal x pea percent-bound values this campaign most wanted
  # are in Figure 3.1a of this thesis and are FIGURE-ONLY. They are not transcribed."
  # Bi et al. 2022 supply a hexanal x pea number that is NOT figure-only: it is stated in
  # the body text, with both underlying partition coefficients printed alongside it.
  - record_id: bi2022_hexanal_pea_protein_prv
    source_id: bi_2022_foodchem
    quantity: percent_bound_at_conditions
    value: 71.72
    uncertainty: null
    uncertainty_note: >-
      NO UNCERTAINTY IS PRINTED for the retention percentages or for the partition
      coefficients they come from. "All the experiments were conducted in triplicate" is the
      only replication statement, with no spread given. Recorded as null rather than assigned
      a plausible-looking number.
    units: percent_bound
    protein_source: pea_iso
    compound: hexanal
    compound_class: aldehyde
    conditions:
      protein_concentration_g_per_L: 10.0
      protein_basis: g_isolate_powder
      protein_basis_note: >-
        "A 2% (w/v) pea protein solution was prepared in 0.01 M potassium phosphate buffer
        (pH 7.6)" and "After mixing, the final concentration of protein was 1%", i.e. 10 g/L
        of the freeze-dried lab-extracted powder. THE PAPER REPORTS NO PROTEIN PURITY, so
        this is a POWDER basis, not a protein basis, and it cannot be converted to one. If
        the powder is (say) 85 wt% protein like a typical commercial isolate, the true
        g_protein loading is 8.5 g/L and the inferred K_eff is ~18% larger. That uncertainty
        is real and is not resolvable from this source.
      flavor_concentration: "1260 +/- 114 ug/kg, i.e. the real in-pea hexanal level from Bi et al. 2020, ~12.6 uM"
      pH: 7.6
      buffer: "0.01 M potassium phosphate"
      temperature_celsius: 37.0
      method: "phase ratio variation (PRV), static headspace GC/MS; R(%) = (1 - K1/K2) x 100 where K1 is the buffer/gas and K2 the pea-protein-matrix/gas partition coefficient"
    location: "Results section 3.8 (body text); the underlying Table S3 is in the Supplementary, which this PDF does not contain"
    quote: >-
      "The partition coefficients of hexanal between the pea protein matrix and the headspace
      and between the potassium phosphate buffer and the headspace were 116.37 and 32.90,
      respectively." ... "The percentage retention of (Z)-2-penten-1-ol, hexanal, and
      (E)-2-octenal by pea protein was 29.29%, 71.72%, and 79.31%, respectively."
    arithmetic_check: >-
      1 - 32.90/116.37 = 71.73%, against the printed 71.72%. The two printed partition
      coefficients and the printed retention are mutually consistent to the last digit, which
      is why this record is admissible even though Table S3 itself is not held.
    dilute_ligand_note: >-
      UNUSUALLY WELL SUITED to the single-site Langmuir this repository uses, and worth
      stating because most percent-bound records in this file are not. The PRV experiment was
      run at the REAL in-pea flavour concentration (~12.6 uM hexanal), not at the 0.05-2.5 mM
      levels used for the Klotz analysis, so it sits far inside the dilute-ligand limit where
      f_free = 1/(1 + K_eff c_p) is the correct form. The same paper shows that at 0.5-2.5 mM
      the binding percentage COLLAPSES (see mechanism_caveats below), i.e. the high-
      concentration branch is NOT in the dilute limit at all.
    verification_status: content_verified_full_text
    usable_for_model: true
    model_role: cross_check_only
    model_role_note: >-
      Enters `src/protein_binding.cross_check_percent_bound` as the FIRST HEXANAL ROW that
      cross-check has ever had, on the compound that carries the most weight anywhere in the
      matrix lane. It is NOT promoted to a prediction constant: the shipped binding mode
      predicts from `a_p * Pow` alone, and swapping in a per-compound measured constant for
      hexanal and nothing else would make the mode a hybrid of measured physics and
      per-compound patching -- which is the pattern this whole audit exists to remove. If a
      future wave wants a per-compound route it must do it for every compound or not at all.

