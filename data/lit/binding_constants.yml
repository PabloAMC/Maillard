# -------------------------------------------------------------------------------------
# OCTANOL-WATER PARTITION COEFFICIENTS (the Pow that multiplies a_p)
# -------------------------------------------------------------------------------------
octanol_water_partition:
  basis_note: >-
    a_p was fitted by Snel et al. against KOWWIN v1.68 estimates, so the Pow convention is
    part of the constant. Where an EXPERIMENTAL Hansch value exists it is used and the
    convention mismatch is quantified: on the one compound where both are available in
    this table's sources (2-octanone) KOWWIN gives 2.22 and Hansch 2.37, a 0.15 dex /
    1.41x difference in Pow, which propagates linearly into K_eff. That is the dominant
    stated uncertainty of the a_p route for the aldehyde markers.
  entries:
    - compound: hexanal
      log_p: 1.78
      pow: 60.26
      basis: experimental
      source_id: pubchem_logp
      pubchem_cid: 6184
      quote: >-
        'log kow = 1.78' -- PubChem LogP section, reference "Hansch, C., Leo, A., D.
        Hoekman. Exploring QSAR - Hydrophobic, Electronic, and Steric Constants.
        Washington, DC: American Chemical Society., 1995., p. 24"
      verification_status: content_verified_database_record
    - compound: 1-hexanol
      log_p: 2.03
      pow: 107.15
      basis: experimental
      source_id: pubchem_logp
      pubchem_cid: 8103
      quote: >-
        'log Kow = 2.03' -- PubChem LogP section, reference "Hansch, C., Leo, A., D.
        Hoekman. Exploring QSAR ... 1995., p. 25"
      verification_status: content_verified_database_record
    - compound: nonanal
      log_p: 3.3
      pow: 1995.26
      basis: computed_xlogp3
      source_id: pubchem_logp
      pubchem_cid: 31289
      quote: >-
        PubChem PUG-REST property XLogP = 3.3 for CID 31289 (nonanal). PubChem returns
        PUGVIEW.NotFound for the experimental LogP heading, i.e. no Hansch value is
        indexed for this compound.
      verification_status: content_verified_database_record
      caveat: >-
        COMPUTED, NOT MEASURED. This is the single largest lever on the nonanal lane's
        binding correction; a 0.3 dex error in log P is a 2x error in K_eff.
    - compound: 2-pentylfuran
      log_p: 3.7
      pow: 5011.87
      basis: computed_xlogp3
      source_id: pubchem_logp
      pubchem_cid: 19602
      quote: >-
        PubChem PUG-REST property XLogP = 3.7 for CID 19602 (2-pentylfuran). No
        experimental LogP heading is indexed.
      verification_status: content_verified_database_record
      caveat: "COMPUTED, NOT MEASURED."
    - compound: octanal
      log_p: 2.7
      pow: 501.19
      basis: computed_xlogp3
      source_id: pubchem_logp
      pubchem_cid: 454
      quote: >-
        PubChem PUG-REST property XLogP = 2.7 for CID 454 (octanal). PubChem's
        experimental LogP heading gives 'log Kow = 3.5 at pH 6.9 (by HPLC)', an
        HPLC-derived value 0.8 dex above the estimate; both are recorded and the
        cross-check in src/protein_binding.py reports the result under BOTH.
      verification_status: content_verified_database_record
      experimental_alternative: 3.5
      experimental_alternative_basis: "HPLC, PubChem LogP heading"
    - compound: 2-octanone
      log_p: 2.37
      pow: 234.42
      basis: experimental
      source_id: pubchem_logp
      pubchem_cid: 8093
      quote: >-
        'log Kow = 2.37' -- PubChem LogP section, reference "Hansch, C., Leo, A., D.
        Hoekman. Exploring QSAR ... 1995., p. 49". KOWWIN gives 2.22 for the same compound
        (Snel et al. 2023 Table 1), the 0.15 dex convention gap quoted above.
      verification_status: content_verified_database_record
    - compound: 2-heptanone
      log_p: 1.98
      pow: 95.50
      basis: experimental
      source_id: pubchem_logp
      pubchem_cid: 8051
      quote: >-
        'log Kow = 1.98' -- PubChem LogP section, reference "Hansch, C., Leo, A., D.
