  - source_id: bi_2022_foodchem
    citation: >-
      Bi, S.; Pan, X.; Zhang, W.; Ma, Z.; Lao, F.; Shen, Q.; Wu, J. (2022). "Non-covalent
      interactions of selected flavors with pea protein: Role of molecular structure of
      flavor compounds." Food Chemistry 389: 133044.
    doi: "10.1016/j.foodchem.2022.133044"
    crossref_verified: "2026-08-28"
    access: full_text
    retrieved_from: >-
      data/articles/1-s2.0-S0308814622010068-main.pdf, obtained by the repository owner via
      interlibrary loan. The PDF is gitignored and NOT committed. Identity confirmed from the
      PDF itself (title, author list, "Food Chemistry 389 (2022) 133044", and the printed
      "https://doi.org/10.1016/j.foodchem.2022.133044"), not assumed from the filename.
    retrieved_on: "2026-08-28"
    verification_status: content_verified_full_text
    material: >-
      LAB-EXTRACTED, NOT A COMMERCIAL ISOLATE. "the defatted pea flour was dispersed in DI
      water (1:10, w/v) with the pH adjusted to 9.0 using 2.0 M NaOH ... the pH of the
      supernatant was adjusted to 4.5 using 2 M HCl ... the pH of the pea protein suspension
      was adjusted to 7.0, and then the protein was collected and kept at -80 degC for 24 h.
      The frozen pea protein solution was placed into a vacuum freeze-dryer ... at -40 degC
      for 48 h." Alkaline-extracted / isoelectric-precipitated whole pea protein. NO PROTEIN
      PURITY IS REPORTED, no 7S/11S fractionation, and the native/denatured state is never
      stated (they report 17.9% alpha-helix by CD without flavours, and dock against the 11S
      crystal structure PDB 3KSC). Transferability to a commercial PPI is unverified.
    method_summary: >-
      "2.3. Investigation of binding of flavor compounds to pea protein using static headspace
      gas chromatography/mass spectrometry"; 1% (w/v) final pea protein in 0.01 M potassium
      phosphate buffer pH 7.6; "The vial was kept at 37 degC for 2 h"; binding % from headspace
      depletion against a protein-free control. Partition coefficients by the phase ratio
      variation (PRV) method under "the same conditions as those described in Section 2.3.1".
    cosolvent_caveat: >-
      A METHANOL CO-SOLVENT IS PRESENT AND THE AUTHORS DO NOT DISCUSS IT. "Stock solutions of
      the flavor compounds were prepared by dissolving each compound in the potassium phosphate
      buffer solution to a concentration of 10 mM. An appropriate amount of absolute methanol
      was needed for easy dissolution. The ratio of methanol to potassium phosphate buffer was
      1:19." That is ~5% methanol in the stock and ~1.25% v/v in the assay after dilution.
      Methanol perturbs hydrophobic binding; the effect is unquantified and uncorrected here.
    ionic_strength_caveat: "Never stated beyond '0.01 M potassium phosphate buffer (pH 7.6)'; no added NaCl."
    supplementary_not_held: >-
      The PDF is the main article only. Tables S1-S4 and Figs S1-S2 are cited but absent, so
      only the supplementary values RESTATED IN THE BODY TEXT are recorded here.

