# =====================================================================================
# data/lit/binding_constants.yml
#
# MEASURED protein-flavour binding data for the matrix observability lane.
# Created 2026-08-27, Wave S4 (tasks/audit_remediation.md).
#
# WHY THIS FILE EXISTS. Until this wave the matrix lane converted a predicted total
# volatile concentration into a "headspace observable" number through the FITTED
# observability factors in `src/matrix_calibration_registry.py`. Several of those were
# back-solved from their own benchmark, and two (the 1-hexanol pair, 0.143 / 0.063) were
# back-solved from values that appear in NO paper (Wave T3). This file holds the
# alternative: binding numbers measured in real experiments, in their NATIVE units, each
# with a verbatim quote from a retrieved full text.
#
# NOTHING IN THIS FILE IS FITTED. No value here was chosen, scaled or adjusted to make
# any prediction match any benchmark. Every number is transcribed from a source that was
# retrieved and read, and the quote that contains it is stored beside it.
#
# THE PHYSICS THIS FILE SERVES (see src/protein_binding.py for the implementation):
#
#     f_free = 1 / (1 + K_eff * c_p)
#
# a single-site Langmuir in the dilute-ligand limit, where `c_p` is the protein
# concentration in the SAME mass units K_eff was measured in (g/L) and `f_free` is the
# fraction of the total analyte that is free in the aqueous phase and therefore drives
# the headspace. Two record types feed it:
#
#   (1) `hydrophobic_interaction_parameter_ap` -- the Harrison & Hills / Viry partition
#       model as applied to plant proteins by Snel et al. 2023. There K_eff = a_p * Pow,
#       with a_p in L per gram of protein and Pow the compound's octanol-water partition
#       coefficient. This is the only record type in this file whose units already
#       normalise by protein MASS, which is why it can be used without inventing a
#       protein molar mass.
#
#   (2) `percent_bound_at_conditions` -- a percentage bound measured at ONE stated
#       protein loading. It is stored AS THAT, with its conditions, and is inverted to
#       K_eff = (p/(1-p)) / c_p_measured only at the point of use, which is exact
#       arithmetic under the same single-site form. It is NOT extrapolated into an
#       "affinity constant" it is not.
#
# WHAT IS DELIBERATELY *NOT* HERE.
#   * No Klotz/Scatchard K in M^-1 has been converted to a per-gram basis. Those
#     constants are defined per MOLE of protein, and none of the sources retrieved
#     states the protein molar mass it used, so the conversion cannot be done without
#     inventing one. The two such studies found are recorded under
#     `not_usable_without_protein_molar_mass` with their numbers, so a later wave with
#     that datum can promote them.
#   * No denaturation / heat adjustment is applied anywhere. The one source that
#     addresses it (Barallat-Perez 2023, Figure 4) reports the effect QUALITATIVELY
#     ("increasing the temperature also led to a slight increase in the level of hexanal
#     binding"); it prints no number for it. Recorded under
#     `denaturation_effect_evidence` and NOT MODELLED. See src/protein_binding.py.
#
# UNITS DISCIPLINE. Every record carries `units` and, where a mass basis is involved,
# `protein_basis` (`g_protein` vs `g_isolate_powder`). These are NOT interchangeable: a
# commercial isolate is 77-93 wt% protein, so mixing them is a up-to-1.3x error in c_p.
# Consumers must read `protein_basis` and say which basis they are working in.
# =====================================================================================

schema_version: 1
created: "2026-08-27"
wave: "S4"
fitted_content: none
fit_status: >-
  No value in this file is fitted, tuned or back-solved. Every number is a literature
  transcription with a verbatim quote. This file must never receive a value derived from
  a repository prediction or from agreement with a repository benchmark.

