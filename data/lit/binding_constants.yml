sources:
  - source_id: snel_2023_heliyon
    citation: >-
      Snel, S.J.E.; Pascu, M.; Bodnar, I.; Avison, S.; van der Goot, A.J.; Beyrer, M.
      (2023). "Flavor-protein interactions for four plant proteins with ketones and
      esters." Heliyon 9(6): e16503.
    doi: "10.1016/j.heliyon.2023.e16503"
    crossref_verified: "2026-08-27"
    crossref_returned_title: "Flavor-protein interactions for four plant proteins with ketones and esters"
    access: open_access
    retrieved_from: "Europe PMC PMC10245154 fullTextXML"
    retrieved_on: "2026-08-27"
    verification_status: content_verified_full_text
    method_summary: >-
      Equilibrium headspace (APCI-MS / GC) on flavoured protein dispersions of soy, yellow
      pea, fava bean, chickpea and whey protein isolate at 5 protein-isolate levels
      (5, 10, 20, 30, 50 g/kg dispersion), each with a C4/C6/C8/C10 ketone and ester
      series; the Harrison & Hills flavour-partitioning model was fitted to the resulting
      headspace suppression to obtain one hydrophobic interaction parameter a_p per
      protein per chemical class.
    model_quote: >-
      "Eq (7) leads to:(8)Kwgeff=Kwgf1+Kpfcpe For ketones and esters, the flavor-protein
      interaction is assumed to be dominated by hydrophobic interactions, the global
      interaction constant could be approached with [23]:(9)Kpf=apPowf in which ap and
      Powf are the unknown hydrophobic interaction parameter of the protein and the known
      octanol-water partition coefficient of the flavor compound."
    protein_basis_quote: >-
      "This resulted in dispersions of 5, 10, 20, 30, and 50 gkg-1 for each protein
      isolate. ... The exact amount of protein in each dispersion was then calculated
      based on the protein content and dry matter content of the protein isolates."
    pow_convention_quote: '"1Software EPIWEB v4.1, KOWWIN v1.68"'
    pow_convention: KOWWIN_v1_68_estimate
    protein_contents_quote: >-
      "Protein content (g/100 g dw) 83.25 +/- 2.77a (Soy) 77.11 +/- 0.29b (Yellow pea)"

  - source_id: barallat_perez_2023_jafc
    citation: >-
      Barallat-Perez, C.; Janssen, H.-G.; Martins, S.; Fogliano, V.; Oliviero, T. (2023).
      "Unraveling the Role of Flavor Structure and Physicochemical Properties in the
      Binding Phenomenon with Commercial Food Protein Isolates." J. Agric. Food Chem.
      71(50): 20274-20284.
    doi: "10.1021/acs.jafc.3c05991"
    crossref_verified: "2026-08-27"
    crossref_returned_title: "Unraveling the Role of Flavor Structure and Physicochemical Properties in the Binding Phenomenon with Commercial Food Protein Isolates"
    access: open_access_cc_by
    retrieved_from: "Europe PMC PMC10739987 fullTextXML"
    retrieved_on: "2026-08-27"
    verification_status: content_verified_full_text
    repo_history_note: >-
      This is the paper whose mis-attribution Wave T3 settled: the repository record
      `jafc_3c05991_ppi_hexanal_binding` claimed 52.76 +/- 4.65 %bound for HEXANAL in PPI.
      The paper reports that number for OCTANAL, pooled over PPI/SPI/LPI, and reports NO
      hexanal percentage anywhere. The octanal record below is that value, correctly
      attributed. The hexanal claim is recorded here as qualitative-only.
    method_quote: >-
      "From a 2 wv% protein solution, for each protein type, 1 mL was added into a 20 mL
      GC-MS vial followed by the addition of 1 mL of flavor stock solution. Thus, a final
      protein solution of 1 wv% and 5 mg/L flavor concentration was obtained."
    binding_definition_quote: >-
      "Flavor binding to proteins was calculated and expressed in %, in the absence and
      presence of protein, as depicted in eq 1(15)1where HS1 (protein solution + flavor)
      is the abundance in the headspace of the flavored-protein-based aqueous solution,
      and HS2 and HS3 are the abundances in the headspace in the absence of flavor (HS2)
      or protein (HS3)."
    buffer_quote: >-
      "(PPI, SPI, LPI, and WPI) at an initial concentration of 2 wv% in sodium phosphate
      buffer (pH 7.0, 50 mM)."
    incubation_quote: >-
      "Samples were incubated and shaken for 14 min at 40 degC, following a modified
      version of the Wang and Arntfield protocol."
    protein_basis: g_isolate_powder
    protein_basis_note: >-
      "1 wv%" is 1 g of the commercial isolate powder per 100 mL, i.e. 10 g powder/L. The
      paper states its isolates are ">83% protein (Table S2)", so the protein-basis
      concentration is 8.3-9.5 g/L; the powder basis is used here and the difference is
      carried as a stated <=1.2x uncertainty on c_p.

