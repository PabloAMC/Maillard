# -------------------------------------------------------------------------------------
# EVIDENCE THAT EXISTS BUT IS NOT USABLE AS A CONSTANT
# -------------------------------------------------------------------------------------
not_usable_without_protein_molar_mass:

  - record_id: bi2022_pea_klotz
    source_id: bi_2022_foodchem
    citation: >-
      Bi, S.; Pan, X.; Zhang, W.; Ma, Z.; Lao, F.; Shen, Q.; Wu, J. (2022). "Non-covalent
      interactions of selected flavors with pea protein: Role of molecular structure of
      flavor compounds." Food Chemistry 389: 133044.
    doi: "10.1016/j.foodchem.2022.133044"
    crossref_verified: "2026-08-28"
    retrieved_from: "data/articles/1-s2.0-S0308814622010068-main.pdf (interlibrary loan, not committed)"
    verification_status: content_verified_full_text
    values_quoted:
      note: >-
        Table 1, "Binding parameters characterizing binding pea proteins to different selected
        flavors at 37 degC", columns as printed: Flavor compounds | n | K (M-1) | nK (M-1).
        Lab-extracted pea protein 1% w/v, 0.01 M potassium phosphate pH 7.6, 37 degC.
      table_1_quote: >-
        "(Z)-2-penten-1-ol 2.55 +/- 1.34 | 438.68 +/- 259.27 | 1119.90 +/- 273.72 ;
        hexanal 4.84 +/- 0.36 | 684.46 +/- 109.43 | 3313.23 +/- 308.45 ;
        (E)-2-octenal 26.95 +/- 2.92 | 8207.72 +/- 2223.82 | 221238.94 +/- 39964.95"
      body_text_corroboration: >-
        "were 438.68 +/- 259.27, 684.46 +/- 109.43, and 8207.72 +/- 2223.82 M-1, respectively"
        (for K), and "1119.90 +/- 273.72, 3313.23 +/- 308.45, and 221,238.94 +/- 39,964.95"
        (for nK, units omitted in the text; the table header carries them).
      scope_restriction_quoted_by_the_authors: >-
        "The values for n for the binding of pea protein with (Z)-2-penten-1-ol, hexanal, and
        (E)-2-octenal AT HIGH FLAVOR COMPOUND CONCENTRATIONS were 2.55 +/- 1.34, 4.84 +/-
        0.36, and 26.95 +/- 2.92, respectively." High = 0.5-2.5 mM. NO CONSTANTS ARE REPORTED
        FOR THE 0.05-0.25 mM BRANCH, which is the branch the in-food concentrations sit in.
    why_not_usable: >-
      THE SAME REASON AS wongprasert2024_ppi_klotz, and it is worth restating because this is
      the single most-wanted constant in the campaign and it still cannot be used. K is defined
      per MOLE of protein through v = ([L]t - [L])/Cp, and the paper NEVER STATES the protein
      molar mass it used -- it gives pea protein only in % w/v and mg/mL. So 684.46 M-1 cannot
      be converted to the L/g basis this model works in without inventing a globulin mass, and
      inventing one would put a free multiplicative parameter under the most load-bearing
      constant in the matrix lane. What CAN be salvaged from this paper is the PRV retention
      percentage, which is measured at a stated g/L loading and needs no molar mass; that is
      record `bi2022_hexanal_pea_protein_prv` above. Note also that K = a/b (intercept over
      slope) is itself independent of the assumed Cp, so K is robust while n = 4.84 is not
      interpretable at all without the molar mass -- another reason not to build on n.
    do_not_confuse_with_the_stern_volmer_constants: >-
      The same paper prints Stern-Volmer quenching constants in Fig. 2 in L/mol -- the SAME
      units as K -- and for hexanal at 37 degC Ksv = 14.205 L/mol against Klotz K = 684.46
      M-1. That is a ~48x disagreement at the same temperature, in the same buffer, in the
      same paper, and the authors never reconcile or even mention it. Anyone promoting a
      constant out of this paper must say which of the two they mean. (The Ksv values are
      figure-legend text, not table values, and F0/F only reaches ~1.06 at 2.5 mM, so the
      fluorescence route is measuring something much weaker than the headspace route.)
  - record_id: wongprasert2024_ppi_klotz
    source_id: null
    citation: >-
      Wongprasert, T.; Mathatheeranan, P.; Siripitakpong, P.; Vilaivan, T.; Suriya, U.;
      Rungrotmongkol, T. et al. (2024). "Effect of functional groups in strawberry
      flavoring on pea protein-flavor interactions." Food Chemistry: X 23:101702.
    doi: "10.1016/j.fochx.2024.101702"
    crossref_verified: "2026-08-27"
    retrieved_from: "Europe PMC PMC11342753 fullTextXML"
    verification_status: content_verified_full_text
    values_quoted:
      note: "Klotz double-reciprocal analysis, PPI 3 g/100 mL, 0.05 M phosphate pH 7.0."
      table_3_quote: >-
        "K (x105) (M-1) 25 degC: vanillin 230.35 +/- 8.38; gamma-decalactone 210.17 +/-
        14.10; furaneol 21.82 +/- 1.40; (Z)-3-hexen-1-ol 14.40 +/- 3.90 ... n 25 degC:
        2.68 +/- 0.07; 3.23 +/- 0.14; 2.05 +/- 0.07; 13.70 +/- 3.55"
    why_not_usable: >-
      K is per MOLE of protein and the paper states no molar mass for its PPI, so nK
      cannot be converted to the L/g basis this model works in. (Z)-3-hexen-1-ol is the
      closest published analogue to 1-hexanol on pea protein found anywhere in this
      campaign, which is exactly why the gap is recorded rather than filled by assuming a
      globulin mass. [P]

qualitative_only:
  - record_id: barallat2023_hexanal_ordering
    source_id: barallat_perez_2023_jafc
    compound: hexanal
    finding: "SPI > LPI > PPI ~ WPI in hexanal binding affinity; no number is printed."
    quote: >-
      "SPI exhibited a higher binding affinity for hexanal followed by LPI (Figure 4),
      independently of the temperature applied (5, 70, and 90 degC). In contrast, PPI and
      WPI showed the lowest binding affinity for hexanal. However, these differences were
      often not statistically significant."
    consequence: >-
      DIRECTION CONFLICT WITH THE SHIPPED REGISTRY, RECORDED NOT RESOLVED. The matrix
      registry encodes soy as releasing 2.2098x MORE hexanal than pea; this source says
      soy BINDS hexanal more than pea, i.e. releases LESS. The a_p route agrees with
      Barallat-Perez in neither direction (a_p pea 25e-5 > soy 16e-5 says pea binds more).
      Two open-access sources disagree with each other on the sign of the pea-vs-soy
      hexanal binding difference, and neither prints a hexanal number. This is the single
      sharpest evidence gap in the matrix observability lane.
    verification_status: content_verified_full_text

  - record_id: bi2022_hexanal_binds_by_hydrogen_bonding_not_hydrophobically
    source_id: bi_2022_foodchem
    direction: mechanism_challenge_to_the_shipped_binding_physics
    quantified: false
    quote: >-
      Abstract: "Hydrophobic interactions were dominant in the non-covalent interactions
      between (E)-2-octenal/(Z)-2-penten-1-ol and pea protein, whereas HYDROGEN BONDING WAS
      DOMINANT IN THE NON-COVALENT INTERACTIONS BETWEEN HEXANAL AND PEA PROTEIN." And:
      "The values of dH and dS for the binding reaction between hexanal and pea protein were
      -150.916 kJ/mol and -0.446 kJ/(mol K), respectively, at 37 degC, which implies that van
      der Waals interactions or hydrogen bonds played a major role in the interaction." And,
      from the docking: "a hydrogen bond was formed between the Gln40 residue and the oxygen
      atom in hexanal with a length of 2.89 A."
    why_this_matters_here: >-
      READ THIS BEFORE TRUSTING THE BINDING MODE ON HEXANAL. The shipped binding physics is
      K_eff = a_p * Pow -- a purely HYDROPHOBIC partition model, in which a compound's
      affinity is set by its octanol-water partition coefficient and nothing else. Bi et al.
      conclude that for hexanal specifically, and in contrast to the two other compounds they
      studied, the dominant interaction is NOT hydrophobic. If that is right, then the one
      compound the matrix lane leans on hardest is the one the model's functional form is
      least entitled to describe, and any agreement on hexanal is partly luck. This is a
      MECHANISM-LEVEL caveat, not a numerical correction: nothing in the model was changed
      for it, because the alternative form is not specified anywhere well enough to implement.
      The authors do concede a secondary hydrophobic component -- "It is worth noting that
      hexanal also decreased the surface hydrophobicity of pea protein. This may have been
      due to the fact that important secondary hydrophobic interactions occurred between the
      protein and the flavor compound in addition to hydrogen bonding or van der Waals
      forces" -- so this is a claim about which term dominates, not that Pow is irrelevant.
    verification_status: content_verified_full_text

  - record_id: bi2022_binding_is_reversible_and_non_covalent
    source_id: bi_2022_foodchem
    direction: supports_the_reversible_partition_assumption
    quantified: false
    quote: >-
      Conclusions: "By the combination of calculations of thermodynamic parameters, protein
      surface hydrophobicity measurements, and the use of bond-disrupting agents, it was
      confirmed that the interactions of pea protein with the three flavor compounds were
      REVERSIBLE and involved hydrophobic interactions, as well as hydrogen bonds."
    why_this_matters_here: >-
      The repository's binding model assumes a reversible equilibrium partition, and
      `describe_model()` reports `covalent_binding_modelled: False`. This is the first
      retrieved source that tests reversibility on pea protein directly and finds it. NOTE
      THE LIMIT OF WHAT IT SHOWS: the paper makes NO measurement of covalent adduct formation
      at all -- no adduct MS search, no borohydride reduction, no bound-residue analysis --
      so it establishes that the interaction it measured is reversible, not that no covalent
      route exists. Aldehyde-lysine Schiff-base chemistry is exactly what this paper did not
      look for, and at 37 degC / 2 h it would not have had much chance to.
    verification_status: content_verified_full_text

  - record_id: bi2022_binding_percentage_collapses_above_0_25_mM
    source_id: bi_2022_foodchem
    direction: langmuir_form_fails_at_high_ligand
    quantified: true
    value: "hexanal binding rises with concentration to ~86% at 0.25 mM, then COLLAPSES to ~16% at 0.5 mM and ~6% at 2.5 mM"
    quote: >-
      "The retention by pea protein of the flavor compounds increased with the flavor
      compound concentration in the range from 0.05 to 0.25 mM. However, this trend was
      reversed in the concentration range of 0.5-2.5 mM, and the percentage retention was
      lower than that at low concentrations (0.05-0.25 mM)." And: "When the concentration of
      the flavor compounds reached a certain value (2.5 mM) that exceeded the binding
      capacity of pea protein, the binding percentages decreased."
    caveat: >-
      THE PER-CONCENTRATION NUMBERS ARE FIGURE-ONLY (Fig. 1A) and are NOT transcribed as
      data. The value field above is a qualitative summary of a read-off, and is stored here
      in the qualitative section for exactly that reason. What is quotable is the direction
      and the authors' own explanation.
    why_this_matters_here: >-
      A single-site Langmuir predicts binding percentage INDEPENDENT of ligand concentration
      in the dilute limit and monotonically decreasing above it -- it cannot produce a rise
      then a collapse. So the model's functional form is wrong somewhere in this range. The
      practical consequence is a bound on where the model may be used: the PRV record
      `bi2022_hexanal_pea_protein_prv` was measured at ~12.6 uM, twenty times below the
      turning point, so it is in the regime the model can describe. The Klotz constants were
      fitted ABOVE it, in the regime the model cannot -- a second, independent reason not to
      promote them.
    verification_status: content_verified_full_text

denaturation_effect_evidence:
  summary: >-
    THREE RETRIEVED SOURCES ADDRESS HEAT AND THEY DO NOT AGREE. Two say heat REDUCES
    binding (Liu 2026, quantified, small; Heng 2005, quantified, large) and one says it
    RAISES it (Barallat-Perez 2023, qualitative). The one number measured on the material
    class this repository's lanes actually are -- commercial SPI -- is Liu 2026's ~10%
    decrease for hexanal, which changes f_free by under 1 percentage point at any lane
    loading in this file. A term that is disputed in sign and, on the best-matched
    source, smaller than every other uncertainty in the chain is not worth carrying.
    DENATURATION IS NOT MODELLED. See src/protein_binding.describe_model().
  entries:
    - record_id: liu2026_denaturation_spi
      source_id: liu_2026_ilc_spi
      direction: heat_decreases_binding
      quantified: true
      value_hexanal_percent_change_in_K: -10.0
      value_series_percent_change_in_K: [-6.0, -18.0]
      treatment: "column heated to 85 C for 30 min, then cooled and stabilised at 25 C"
      quote: >-
        "Therefore, a decline in the binding constant of approximately 6-18% was observed,
        with larger changes for more hydrophobic compounds, and the reduction in binding
        following treatment at 85 C suggests that partial denaturation of soy protein
        contributes to the loss of binding functionality." / "When comparing individual
        aldehydes, the binding constant of pentanal remained nearly unchanged after heat
        treatment, while hexanal and heptanal showed slight decreases of around 10%. In
        contrast, octanal exhibited the most pronounced reduction, with a decrease of
        nearly 18%."
      authors_own_caveat: >-
        The protein is silica-immobilised; the authors call the system "a controlled model
        rather than a direct representation of protein behavior in real food matrices".
      per_compound_values_are_figure_only: true
      verification_status: content_verified_full_text

    - record_id: heng2005_denaturation_vicilin
      source_id: heng_2005_wur_thesis
      direction: heat_decreases_binding
      quantified: true
      value: "octanal on vicilin: 96% bound non-heated -> 32% bound after 90 C / 30 min"
      quote: '"Vicilin heated | Octanal ~9 32 | 2-Octanone <0.5 16"'
      caveat: >-
        Purified vicilin, not a commercial isolate, and the loading ambiguity that
        disqualifies the aldehyde rows for the cross-check applies here too.
      verification_status: content_verified_full_text

    - record_id: barallat2023_temperature_effect
      source_id: barallat_perez_2023_jafc
      direction: heat_increases_binding
      quantified: false
      quote: >-
        "Besides time, increasing the temperature also led to a slight increase in the
        level of hexanal binding (Figure 4). ... Wang and Arntfield, showed hexanal binding
        to canola proteins at 95 degC. Hexanal binding to canola proteins increased by ~32%
        when applying heat."
      caveat: >-
        The only number in that passage (~32%) is second-hand and is for CANOLA protein;
        the primary (Wang & Arntfield) was retrieved in this wave as the author's thesis
        and its canola hexanal heat data is FIGURE-ONLY there too.
      verification_status: content_verified_full_text
  modelled: false
