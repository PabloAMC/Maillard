# -------------------------------------------------------------------------------------
# MATRIX PROTEIN LOADINGS -- the c_p of each lane, from each lane's own source
# -------------------------------------------------------------------------------------
# `quantification_basis` is the OTHER half of the physics and is just as important as
# c_p: it says WHICH concentration the source's reported number is.
#   matrix_matched  -> standards were spiked INTO the matrix, so the reported number is
#                      the TOTAL analyte and NO binding correction applies (f_free = 1).
#   water_calibrated-> the calibration curve was built in water, so the reported number
#                      is the FREE-equivalent concentration = total * f_free.
#   unknown         -> not stated in what this repository has read. Treated as
#                      matrix_matched (the conservative choice: it applies no correction).
# -------------------------------------------------------------------------------------
