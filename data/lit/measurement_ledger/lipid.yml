# MEASUREMENT LEDGER -- lipid lane.
# One entry per quantitative data set in data/lit/extraction_dossiers/*.md that bears on the lipid lane:
# lipid oxidation (hydroperoxides, peroxide value, TBARS, oxygen uptake, linoleate/linolenate/oleate loss,
# LOX activity), its volatiles (hexanal, nonanal, 2,4-decadienal, 2-alkenals, 1-octen-3-ol, 2-pentylfuran),
# lipid-Maillard cross-products (alkylpyridines, alkylpyrazines, alkylthiophenes/thiapyrans from lipid
# aldehydes; lipid-vs-no-lipid arms of Maillard pots), carbonyl-amine chemistry of lipid aldehydes, and matrix
# lipid-aldehyde levels in plant proteins, meat analogues, dairy and meat. Binding, partition, release and
# thresholds of lipid aldehydes live in matrix.yml (rule of 2026-10-29: one entry per data set, in the ledger
# of the quantity it measures; the former copies here were merged into matrix.yml).
# All 444 dossiers were searched, including sulfur and trunk dossiers (whose ledgers excluded lipid data);
# sets indexed in both carry the flag also_in_sulfur_ledger.
# Records WHERE the data are and WHAT they are; never the values. Conditions checked against each
# dossier's methods text, not its headings.
# status:  in_model_fit (entered a frozen fit or sets a declared constant) | in_model_check (hold-out,
#          directional claim or panel check) | digitised_in_dossier (numbers in the dossier, unused) |
#          figure_only (only a figure, not digitised) | supplement_missing (SI not on disk) | text_only
lane: lipid
built: 2026-10-29
