# MEASUREMENT LEDGER -- aroma_other lane.
# One entry per quantitative data set in data/lit/extraction_dossiers/*.md that bears on the non-sulfur,
# non-lipid aroma chemistry outside trunk.yml: pyrazines (data sets trunk.yml does not carry), Strecker
# aldehydes (methional, 2-/3-methylbutanal, 2-methylpropanal, phenylacetaldehyde, benzaldehyde) and their
# amino-acid loss, proline-derived odorants (2-acetyl-1-pyrroline, 2-acetyltetrahydropyridine), methionine
# chemistry, glycation / protein-bound products (CML, CEL, furosine, lysine loss), browning / melanoidin not in
# trunk.yml, and matrix / meat / meat-analogue / plant-protein odorant and precursor-composition data.
# Binding, partition, release/retention and thresholds live in matrix.yml (rule of 2026-10-29: one entry per
# data set, in the ledger of the quantity it measures; cross-relevance is a flag "also_relevant: <ledger>").
# `complements: <id>` marks the rows of a table whose other rows sit in trunk.yml or sulfur.yml.
# Records WHERE the data are and WHAT they are; never the values. Conditions checked against each
# dossier's methods text, not its headings.
# status:  in_model_fit (entered a frozen fit or sets a declared constant) | in_model_check (hold-out,
#          directional claim, panel check, or fit row of a wave that did not ship) |
#          digitised_in_dossier (numbers in the dossier, unused) |
#          figure_only (only a figure, not digitised) | supplement_missing (SI not on disk) | text_only
lane: aroma_other
