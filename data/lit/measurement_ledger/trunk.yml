# MEASUREMENT LEDGER -- trunk lane.
# One entry per quantitative data set in data/lit/extraction_dossiers/*.md that bears on the trunk:
# sugar degradation / isomerisation, Amadori and Heyns compounds, deoxyosones, alpha-dicarbonyls,
# furans (HMF, furfural, norfuraneol, furaneol), organic acids and pH / NaOH uptake, time-resolved
# browning, Strecker aldehydes and pyrazines from fed dicarbonyls. Sulfur compounds live in another ledger.
# Records WHERE the data are and WHAT they are; never the values. Conditions checked against each
# dossier's methods text, not its headings.
# status:  in_model_fit (entered a frozen fit or sets a declared constant) | in_model_check (hold-out,
#          directional claim or panel check) | digitised_in_dossier (numbers in the dossier, unused) |
#          figure_only (only a figure, not digitised) | supplement_missing (SI not on disk) | text_only
