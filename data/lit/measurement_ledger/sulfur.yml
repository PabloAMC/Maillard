# MEASUREMENT LEDGER, sulfur lane. One entry per quantitative data set (figure panel series group or table)
# in data/lit/extraction_dossiers/. Carries WHERE the data are and WHAT they are, never the values.
# status: in_model_fit (a row of the B2.3/B47/B16 fits or the cysteine-route calibration stage 1; also a row of
#         another lane's fit that carries sulfur species, B3 acrylamide / B22 / B22b methionine; a fit that did not
#         ship carries the flag fit_wave_not_shipped_<wave> (route stage 1: fit_not_forwarded_route_stage1), so
#         "constrains the shipped model" is a lookup;
#         or a measured constant B3 ships) |
#         in_model_check (hold-out bundle, hold-out diagnosis or pre-declared check) |
#         digitised_in_dossier | figure_only | supplement_missing | text_only
