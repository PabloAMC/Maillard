# MEASUREMENT LEDGER -- matrix layer.
# One entry per quantitative data set in data/lit/extraction_dossiers/*.md on how a food matrix changes
# what is released or measured: flavour-protein binding (reversible and covalent; constants, % bound,
# by protein, odorant, pH, heating), air-water and air-matrix partition (Henry constants, static
# headspace K), fat/oil-water partition and emulsions, salt/sugar effects on partition, thiol loss to
# protein, release/retention in meat analogues, plant-protein matrices and gels, paired matrix/water
# odour thresholds, and the protein site densities and calibration facts the matrix code uses
# (src/kinetic_core/parameters_matrix.py, matrix_oav.py, matrix_sites.py; data/species/protein_matrices.yml).
# GC retention indices and formation kinetics are out of scope (other lanes). Thiol/disulfide binding
# sets already indexed in sulfur.yml are NOT repeated here (sun2025, gigl2021, hofmann2001,
# anantharamkrishnan2020/2020b sulfur rows, sun2019 FFT, kumazawa2003 coffee, hamzalioglu2018 coffee,
# yuan2023 adduct panel); see the cross-reference notes on the entries that sit next to them.
# Rule (2026-10-29): one entry per data set, in the ledger of the quantity it measures. Binding,
# partition, release/retention and odour thresholds live here; formation and loss kinetics live in their
# lane. Cross-relevance is a flag "also_relevant: <ledger>", never a second entry. The parallel lipid.yml /
# aroma_other.yml copies were merged into these entries on 2026-10-29 (one matrix entry may lump several
# former lane entries). A data set measuring both kinds is split, each entry listing only its own quantity.
# Empty temperature_c / time_min lists carry the flag "condition_not_stated: <field>" (not stated or not
# applicable, e.g. cited values).
# "Directional claim" = a direction recorded in a code register (e.g. BINDING_AT_PROCESS_TEMPERATURE in
# parameters_matrix.py) whose numbers no computation reads.
# Records WHERE the data are and WHAT they are; never the values. Conditions checked against each
# dossier's methods text, not its headings.
# kind (this lane): endpoint = an equilibrium quantity per condition (K_aw, K_b, threshold, site density);
#          ratio = matrix/water or % bound; time_series = release or binding vs time; rate_constant =
#          adduct or exchange kinetics; ranking / other as in trunk.yml.
# status:  in_model_fit (entered a frozen fit or sets a declared constant) | in_model_check (hold-out,
#          directional claim or panel check) | digitised_in_dossier (numbers in the dossier, unused) |
#          figure_only (only a figure, not digitised) | supplement_missing (SI not on disk) | text_only
# "unused" here means no engine code path reads it; numbers transcribed only into
# data/lit/binding_constants.yml or data/lit/retention_reference_payloads.json (no engine consumer) count
# as digitised_in_dossier, and the note says so.
lane: matrix
