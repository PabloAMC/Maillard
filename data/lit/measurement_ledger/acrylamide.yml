# MEASUREMENT LEDGER -- acrylamide lane.
# One entry per quantitative data set in data/lit/extraction_dossiers/*.md that bears on the acrylamide lane:
# acrylamide formation / elimination, asparagine and reducing-sugar loss in acrylamide systems, 3-aminopropionamide
# and the decarboxylated Amadori / Schiff-base intermediates, asparaginase, acrylamide in fried, baked, roasted or
# extruded foods (incl. extruder residence time for the extrusion row), inhibitor / pH / water-activity studies.
# Trunk species of the same pots live in trunk.yml, thiol-acrylamide adducts in sulfur.yml.
# Records WHERE the data are and WHAT they are; never the values. Conditions checked against each
# dossier's methods text, not its headings.
# status:  in_model_fit (entered a frozen fit or sets a declared constant) | in_model_check (hold-out,
#          directional claim, panel check, or fit row of a wave that did not ship) |
#          digitised_in_dossier (numbers in the dossier, unused) |
#          figure_only (only a figure, not digitised) | supplement_missing (SI not on disk) | text_only
