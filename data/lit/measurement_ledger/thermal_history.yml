# MEASUREMENT LEDGER -- thermal_history lane (created 2026-11-03).
# One entry per data set in data/lit/extraction_dossiers/*.md that records HOW A FOOD HEATS OR DRIES during cooking:
# measured or printed temperature-time programmes (surface, sub-surface, crust, core, pan / air boundary), water and
# fat loss vs time, crust growth, and simulated surface temperature / water activity where no measurement exists.
# The engine runs pots at fixed temperature (mechanism item 8 of docs/guides/STATUS_AND_PLAN.md is thermal
# history); these are the candidate programmes and boundary conditions for that work. Chemistry measured in the
# same cooking experiments (HAA, acrylamide, browning, volatiles) lives in its own lane with
# "also_relevant: thermal_history" (rule of 2026-10-29: one entry per data set, in the ledger of the quantity it
# measures).
# Fields (from sprague2011_extraction.md sec. 7): product, heating_mode, setpoint, boundary {air_t_c,
# air_velocity_m_s, humidity, h_w_m2_k}, observable, positions, time_min, representation (data_points |
# printed_fit | model_output), location, usable_as_programme (crust | sub_surface | core | boundary_only | no),
# status (as in trunk.yml), flags.
# Records WHERE the data are and WHAT they are; never the values.
lane: thermal_history
