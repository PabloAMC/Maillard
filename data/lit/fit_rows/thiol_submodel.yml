# KEYED FIT TABLE -- sub-model 4, thiol formation and loss (results/validation/kinetic_core_thiol_submodel_prereg.md).
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS; every row an sd as
# printed or a read_error in dex). Laboratory and quantification class come from the ledger entry.
# FINAL TABLE after adjudication (agent-thiol-adjudicator-2026-10-29) of two independent readings:
#   first  agent-sm4-reader1-2026-10-29 (its table was this file),
#   second agent-sm4-reader2-2026-10-29 (data/lit/fit_rows/second/thiol_submodel.yml),
#   reconciliation results/validation/source_reading_reconciliation_thiol_submodel.md.
# The inventory is the UNION of both readings; every one-sided data set was verified a second time against the paper
# by the adjudicator (data/lit/source_verification/thiol_submodel.yml says how).
# Conventions:
#   * initial_mmol_L uses engine species keys where one exists (PENT = ribose or xylose, Cys, H2S, NF, FUR, TDP, HA, MP,
#     THI, Glc, Fru, GSH, TTCA, ARP = the alanine-xylose Amadori compound, FFT); Feng 2022's precursor is recorded as
#     printed ("RG-ARP") with engine_precursor_mapping unresolved (CF-058).
#   * row species: engine keys or fit_rows.OBSERVABLES (MFT_FFT_mixed_disulfide).
#   * label_ph: the pH set before heating (none of these sources follows the pH during heating).
#   * one pot per recipe; where the paper heats one vessel per sampling time, `minutes` is the longest time.
#   * errors: `sd` = the printed SD (value units); `read_error` (dex) = the transcription error only (half the last
#     printed digit of a number printed without SD, or the reading error of a digitised point). Neither covers the
#     replicate scatter a paper did not print: the measurement model's per-series noise must (fitting.MeasurementModel).
#   * Hofmann 1998: sd = 10 % of the value, the stated bound "differed by not more than 10%" (triplicates).
#   * `printed` records the value as the source prints it where a conversion was made; ng/mL = ug/L and ng/g = ug/kg
#     are relabels. ND / zero cells (left-censored, no LOD printed) are not rows.
#   * A cell printed in two places enters ONCE (count once): see the notes of the Zhai pots.
# Hofmann 1998 Table 9 (1-mercapto-2-propanone from glucose + cysteine, pH 3 / 5 / 7) added 2026-10-30 after two
# readings (data/lit/fit_rows/thiol_hofmann_t9.yml, second/; reconciliation
# results/validation/source_reading_reconciliation_thiol_hofmann_t9.md): it tests the hexose -> MGO -> MP flux in a
# cysteine pot (thiol prereg sec. 3). Separate _mp pots (same recipe; the paper does not say the same vessels).
