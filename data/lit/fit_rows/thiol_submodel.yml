# KEYED FIT TABLE -- sub-model 4, thiol formation and loss (results/validation/kinetic_core_thiol_submodel_prereg.md).
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS; every row an sd as
# printed or a read_error for a digitised point). Laboratory and quantification class come from the ledger entry.
# First reader: agent-sm4-reader1-2026-10-29, against the PDFs / SI (data/articles/), not the dossiers; second reader
# pending (data/lit/source_verification/thiol_submodel.yml). Rows also carry their pot's ledger_id (redundant, for grep).
# Conventions:
#   * initial_mmol_L uses engine species keys (src/kinetic_core/species.py, species_sulfur.py): PENT (ribose = xylose),
#     Cys, H2S, NF, FUR, TDP (3-deoxyribosulose), HA, MP, THI, Glc, Fru, MFT, FFT.
#   * row species are engine keys (MFT, FFT, MFTD, FFTD, FUR, H2S) EXCEPT "MFT-SS-FFT", the mixed disulfide
#     2-furfuryl 2-methyl-3-furyl disulfide, which the engine does not carry (listed as missing; a fit must drop or
#     add it).
#   * label_ph: the pH the paper sets; ph_measured_at: where and when the paper's electrode read it.
#   * one pot per recipe: where the paper heats one vessel per sampling time, the pot is the recipe and `minutes`
#     its longest time (per_time_vessels: true).
#   * `printed` records the value as the source prints it, before any unit conversion; ng/mL = ug/L and
#     ng/g = ug/kg are relabels, not conversions.
#   * ND cells (left-censored) are not rows; the pot's notes say where they are.
status: draft   # first reader done for the sources below; second reader pending (fit_rows.load refuses a draft)
