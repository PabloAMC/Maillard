# KEYED TEST TABLE -- Lee J, Roux S, Descharles N, Rega B & Bonazzi C 2024, Food Res Int 183:114183 (UMR SayFood, INRAE /
# AgroParisTech, Universite Paris-Saclay; doi 10.1016/j.foodres.2024.114183), Fig. 2 (p. 6): pyrazine (PZ), 2-methylpyrazine (MPZ),
# 2,5-dimethylpyrazine (DMP) and 2,6-dimethylpyrazine (DMP26) in the OVEN VAPOUR while baking a glucose + L-leucine (G + L) model
# sponge cake at oven set-points 140, 170 and 200 C, 4 - 118 min. The 3-methylbutanal panel (panel 1) is not keyed.
# PURPOSE: TEST data for the contrast benchmark, engine error E13 ('CF-077 methylpyrazine cross-pair factor';
# docs/reference/contrast_benchmark/split_v2_per_change.yml): the within-pot ratio MPZ^2 / (PZ x DMP) and its temperature trend.
# NEVER a fit input: fit_rows.load refuses every row (unit nmol_per_L_air_per_g_DM is not in fit_rows.UNITS; DMP26 is not an engine species;
# the laboratory is in no group of data/keys/laboratories.yml); keep it so. Caveat for any score: an open, low-moisture,
# non-isothermal system with volatility-dependent stripping; vapour, not cake, concentrations (the paper's Eqs. 1-6 link the two).
# Format: src/kinetic_core/fit_rows.py. Ledger entry lee2024_fig2_fig3_oven_vapour_volatiles (data/lit/measurement_ledger/trunk.yml; semi_quantitative).
# The glucose-only cake G has NO pyrazine rows: Sec. 3.2.2, the pyrazines 'were only found during the baking of model cake G + L'
# (no LOD printed): not detected in G (a presence contrast, no row). lee2022 is the same bakes with disjoint species (CF register,
# lee2022 / lee2024 'same_experiment_as'): nothing double-counted.
#
# READERS (2026-11-01), independent and in parallel: reader A (agent-readerA-2026-11-01; pdfimages page 6 raster 1016 x 1743 px, 300 ppi; panels
# cropped and 3x upscaled with sips, values against the y ticks in the same crop) and reader B (agent-readerB-2026-11-01; the same raster, panels
# calibrated from the y tick labels, 2x crops for large points, 4x for the near-zero band; marker centre = bbox midpoint).
# Raw files: the coordinator's scratchpad; B's rows: fit_rows/second/heldout_lee2024_fig2.yml.
# ADJUDICATION (agent-heldout-adjudicator-2026-11-01): value = mean(A, B); read error = max(A, B, |A-B|/2) in nmol/L_air/g_DM, then dex. Plotted error bars (both
# readers numeric) enter as sd (their mean; statistic not stated, SD presumed; n = 4 / 6 / 4). The readers agree within their errors
# on 79 of the 80 points; the exception, MPZ 170 C 35 min (A 0.0003, B 0.0022), is at the reading floor and is dropped below.
#
# RESOLUTIONS OF THE FLAGGED AMBIGUITIES (re-read in the PDF, 2026-11-01):
#  (1) Figure number: the data are Fig. 2 (p. 6); Fig. 3 is the reaction scheme (no data); Sec. 3.2.2 itself mis-cites 'Fig. 3'.
#  (2) Symbol-to-temperature mapping: the caption's symbol glyphs are lost from the text layer but present in the rendered caption
#      (pdftoppm, 600 dpi): 140 C = grey filled square, 170 C = green filled triangle, 200 C = magenta filled circle. This confirms
#      both readers' inference (squares the only series at 93 / 118 min; the hatched >range 3-MB points are circles). RESOLVED.
#  (3) Units, text vs axis: every Fig. 2 axis reads nmol.L_air-1.g_DM-1; Sec. 3.2.1 quotes the Fig. 1 furanic levels in
#      'mmol.L-1 air.gDM'. Sec. 2.6 (model) states the plotted values were 'previously shown as nmol.L-1 air.gDM' and converts them
#      with 10^-3 x V_oven to umol/g DM; and 2 mmol per litre of oven air per g DM is physically impossible (air is ~0.03 mol/L at
#      200 C). RESOLVED: nmol (the axis; the text's 'mmol' is a typo; P > 0.95).
# ROWS DROPPED (39 of 80; the rule was fixed before any ratio was computed):
#  * 35 points at the reading floor: adjudicated value <= its read error (near-zero markers, several hidden under another
#    series; a zero has no log residual). Read them as '< value + error' (upper bounds for presence contrasts), not as rows;
#  * 4 points of the 140 C series plotted at 88 min: the Methods sampled 140 C at 91-95 and 116-120 min INSTEAD of 86-90 min, yet
#    squares appear at 88 min in panels 2-5 (not in the 3-MB panel). Which run or time they are cannot be resolved from the paper.
#  Dropped (species, set-point, median time: adjudicated value +- read error, nmol/L_air/g_DM):
#    PZ 200 C   4 min: 0.00055 +- 0.0010
#    PZ 170 C   4 min: 0.00025 +- 0.0015
#    PZ 170 C  10 min: 0.00200 +- 0.0020
#    PZ 140 C   4 min: 0.00055 +- 0.0010
#    PZ 140 C  10 min: 0.00005 +- 0.0010
#    PZ 140 C  22 min: 0.00050 +- 0.0010
#    PZ 140 C  35 min: 0.00095 +- 0.0010
#    PZ 140 C  54 min: 0.00075 +- 0.0010
#    PZ 140 C  88 min: 0.00215 +- 0.0010 (140 C @ 88 min)
#    PZ 140 C  93 min: 0.00045 +- 0.0010
#    PZ 140 C 118 min: 0.00000 +- 0.0010
#    MPZ 200 C   4 min: 0.00045 +- 0.0015
#    MPZ 170 C   4 min: 0.00000 +- 0.0015
#    MPZ 170 C  10 min: 0.00000 +- 0.0015
#    MPZ 170 C  22 min: 0.00090 +- 0.0015
#    MPZ 170 C  35 min: 0.00125 +- 0.0015
#    MPZ 140 C   4 min: 0.00040 +- 0.0015
#    MPZ 140 C  10 min: 0.00000 +- 0.0015
#    MPZ 140 C  22 min: 0.00015 +- 0.0015
#    MPZ 140 C  35 min: 0.00015 +- 0.0015
#    MPZ 140 C  54 min: 0.00000 +- 0.0015
#    MPZ 140 C  88 min: 0.00045 +- 0.0015 (140 C @ 88 min)
#    MPZ 140 C  93 min: 0.00045 +- 0.0015
#    MPZ 140 C 118 min: 0.00045 +- 0.0015
#    DMP 170 C   4 min: 0.00005 +- 0.0005
#    DMP 170 C  10 min: 0.00005 +- 0.0005
#    DMP 140 C  54 min: 0.00010 +- 0.0003
#    DMP 140 C  88 min: 0.00020 +- 0.0003 (140 C @ 88 min)
#    DMP 140 C 118 min: 0.00020 +- 0.0003
#    DMP26 200 C   4 min: 0.00030 +- 0.0003
#    DMP26 200 C  10 min: 0.00030 +- 0.0003
#    DMP26 170 C   4 min: 0.00000 +- 0.0005
#    DMP26 170 C  10 min: 0.00000 +- 0.0005
#    DMP26 170 C  22 min: 0.00010 +- 0.0004
#    DMP26 140 C  10 min: 0.00015 +- 0.0003
#    DMP26 140 C  22 min: 0.00000 +- 0.0003
#    DMP26 140 C  35 min: 0.00005 +- 0.0003
#    DMP26 140 C  54 min: 0.00000 +- 0.0003
#    DMP26 140 C  88 min: 0.00000 +- 0.0003 (140 C @ 88 min)
# TEXT CHECKS (no rows):
#  * Sec. 3.2.2 'P increased over time whereas the other pyrazines displayed measurements at 86 min that were lower than at 56 min':
#    holds at 200 C. 'P ... similar quantities as 2,5-DMP' (54 min 0.0172 vs 0.0221) and '2,6-DMP 2-fold lower than 2,5-DMP'
#    (0.0133 vs 0.0221 = 1.7x): hold.
#  * 'MP displayed the lowest concentrations of all pyrazines' CONTRADICTS the figure, where MPZ is the HIGHEST at 200 C (0.098 at
#    54 min, 4 - 7x the others). The panel's tick labels read 0.00 / 0.05 / 0.10 / 0.15 (re-read on the render). Either the text is
#    wrong or the MPZ axis is 10x too high. UNRESOLVED; the figure is kept (convention), but any E13 score must report the ratio
#    MPZ^2 / (PZ x DMP) also with MPZ / 10 (a 100x swing in that ratio). Proposed as a conflicts-register entry.
#  * 140 C pyrazines are mostly at the reading floor (no PZ or MPZ row; DMP at 4 - 35 and 93 min and DMP26 at 4 / 93 / 118 min survive, all <= 0.0011 with 0.16 - 0.37 dex errors), so the 140 C arm carries
#    little contrast power.
# NEW SPECIES KEYS: DMP26 2,6-dimethylpyrazine (not an engine species), LEU L-leucine (as strecker_hofmann2000). Engine keys: PZ, MPZ,
# DMP (2,5-dimethylpyrazine), Glc.
