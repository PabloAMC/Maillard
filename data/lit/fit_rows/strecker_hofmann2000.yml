# KEYED FIT TABLE -- Strecker degradation: Hofmann, Munch & Schieberle 2000 (J Agric Food Chem 48:434-440, DFA Garching;
# doi 10.1021/jf990954c, printed on p. 434 and as the page-440 footer 'JF990954C'):
# phenylacetaldehyde (PHEAL) and phenylacetic acid (PHEAC) from L-phenylalanine with methylglyoxal (time course, Table 3),
# with four alpha-dicarbonyls under argon / air / air + Cu (Table 4), across pH 3-9 (Figs. 4-5); Strecker aldehydes and
# acids from glucose + Phe / Ala / Leu (Table 2); and the four dicarbonyls in the glucose + Phe pot (Fig. 3).
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS). Laboratory and
# quantification class from the ledger entries (data/lit/measurement_ledger/trunk.yml, hofmann2000_*).
# FIRST READER (agent-hofmann2000-reader1-2026-10-31), read from data/articles/hofmann2000.pdf (text layer +
# 300 dpi page renders; figures from the embedded 300 ppi 1-bit rasters). The dossier hofmann2000_extraction.md was a
# map only. Verification: data/lit/source_verification/strecker_hofmann2000.yml.
#
# NEW SPECIES KEYS (not in the engine; every pot is engine_species_missing, so these are verified data for later, NOT
# fit rows today; fit_rows.load refuses them by species): PHE L-phenylalanine, LEU L-leucine, ALA L-alanine, PHEAL
# phenylacetaldehyde, PHEAC phenylacetic acid, MEBUAL3 3-methylbutanal, ACAL acetaldehyde, MEBUAC3 3-methylbutanoic acid
# (coined here: the brief named no key). Engine keys used: Glc, MGO, GO, TDG (3-deoxy-2-hexosulose), G (2-hexosulose =
# glucosone), AA (acetic acid). NB deoxyosone_hofmann1999.yml writes L-alanine as 'Ala'; this table uses ALA as briefed.
#
# UNITS. The paper prints umol per mmol of the charged reactant (Tables 2, 4; Fig. 3 per mmol glucose; Figs. 4-5 per
# mmol phenylalanine) or umol in the pot (Table 3). Every pot charges 1.0 mmol + 1.0 mmol in 10 mL, so 1 umol/mmol =
# 1 umol per pot = 0.1 mmol/L, and value / reactant0 (100 mmol/L) is the printed ratio exactly. The solutes' volume
# (<= 2.5 %) is ignored. Text check: the paper itself writes 0.42 umol/mmol as '0.042 mol %'. Phenylalanine (Table 3)
# is printed as % degraded; the row is the residual, 100 x (1 - % / 100) mmol/L.
# ERRORS. No SD, no n, no error bars anywhere in the paper. Printed numbers carry half the last printed digit (dex);
# digitised points a read error (dex): bounding-box centre of the marker, axes fitted on the tick marks found in the
# pixels, +-1 px per marker (more where markers overlap; +-2 px for triangles, bbox vs centroid), tick-fit residual in
# quadrature. Read error is transcription only: it is not the replicate scatter, which the paper never gives.
# LEFT OUT: Fig. 3 glucosone at 300 / 500 min (ring centred on the x-axis: zero). [The first reading also left out
# glucosone at 10 / 240 min and Fig. 5 glucosone pH 3, glucose pH 3 and pH 5; the adjudicator restored all five, see
# ADJUDICATION (3)-(4).] Table 1 (FD factors), Table 5 (13C2-label experiment;
# PAA 40.1 ug/mmol = 0.295 umol/mmol, a cross-check of Table 2's 0.29, quantified against furan-2-carboxylic acid) and
# Fig. 2 (PA / PAA in the glucose + Phe pot) are outside the brief and not keyed (Fig. 2 is digitisable: 6 times x 2).
# CONTRADICTIONS (kept as printed, flagged on the rows): buffer molarity 0.5 mmol/L (Experimental, twice) vs 0.5 mol/L
# (Tables 1-3, 5) vs 0.1 mol/L (Table 4); 'heated at 98 C' vs 'refluxed'; Table 4 'refluxed ... in a closed vial';
# glucosone maximum 0.009 mol % in the text vs 0.059 mol % in Fig. 3; 'MGO 3x glyoxal at 500 min' vs 5.1x in Fig. 3.
# DUPLICATES: text ratios (2x, 7x, 3:1, 1:5, 'nearly 4') are read off the tables / figures: kept as text_check on the
# rows, counted once. Figs. 4-5 at pH 7 vs Table 4 model B: PA agrees to 1-2 %, PAA 4-46 % higher in the figure:
# possibly one experiment, adjudicator to decide. Table 3's Phe-degraded column is near-identical to hofmann2000b
# Table 3 (a glucose + Phe pot): flagged in the ledger.
#
# TWO READERS (2026-10-31): first agent-hofmann2000-reader1-2026-10-31 (this file), second
# agent-hofmann2000-reader2-2026-10-31 (fit_rows/second/strecker_hofmann2000.yml, kept as written); compared by
# scripts/reconcile_source_readings.py (results/validation/source_reading_reconciliation_strecker_hofmann2000.md).
# Before adjudication: Tables 2, 3, 4 agree on every pot and row; Fig. 3 and Figs. 4-5 agree on every value both keyed
# and differ only in five near-axis markers the first reader left out (and the second reader's Figs. 4-5 conditions
# verdict 'unstated'). 106 rows (first) vs 111 (second).
# ADJUDICATION (agent-hofmann2000-adjudicator-2026-10-31, against hofmann2000.pdf: text layer, and the page-437
# rasters re-dumped pixel by pixel). Each ruling also sits in the `adjudication` field of its verification entry.
#  (1) BUFFER. Experimental prints '0.5 mmol/L' twice (p. 435, both model-reaction paragraphs); the footnotes of
#      Tables 1, 2, 3, 5 print '0.5 mol/L' and Table 4's '0.1 mol/L'. 0.5 mmol/L phosphate (~0.3 mmol/L per pH unit of
#      capacity) cannot hold pH 7 against 100 mmol/L amino acid + 100 mmol/L dicarbonyl and their acids: a misprint.
#      Each pot takes its own footnote (0.5 mol/L; Table 4 0.1 mol/L; Fig. 3 the glucose / Phe footnotes' 0.5 mol/L).
#      Table 4's 0.1 is not overruled (the paper gives no reason to); alternative 0.5 mol/L. Evidence it hardly
#      matters at 60 min: Table 3 (0.5 mol/L, air) 10.6 / 20.6 umol vs Table 4 expt 1 model B (0.1 mol/L) 10.2 / 20.4.
#  (2) TEMPERATURE. '98 C' (p. 435 Methods twice, p. 436 text, Table 3 footnote) vs 'refluxed' (Tables 1, 2, 4, 5
#      footnotes; p. 439 'at reflux') vs abstract '100 C'. Not a real conflict: at Garching (~480 m, ~957 hPa standard
#      atmosphere) water boils at 98.4 C (Antoine), the 0.5 mol/L phosphate + 0.2 mol/L solutes add ~0.6 K, so reflux
#      is ~99 C. 98 C kept; alternative 99 C (~ +9 % on a rate with Ea 100 kJ/mol). Table 4's 'refluxed ... in a
#      closed vial' is read as the Methods' 'heated at 98 C in closed vials' (a closed vial cannot reflux).
#  (3) FIG. 3 GLUCOSONE AT 10 AND 240 MIN (second reader only): restored. The 240-min ring spans raster rows 554-564,
#      centre 559.0, 3.5 px above the 300-min ring (rows 557-568, centred on the axis, row 562): 0.09 umol/mmol. The
#      10-min ring is hidden under the MGO disc except its bottom arc, which ends on row 564 like the 240-min ring:
#      same height. Values and read errors as the second reader (0.29 / 0.44 dex: near-zero, they weigh little).
#  (4) FIG. 5 NEAR-AXIS PAA (second reader only): restored. pH 5 glucose: triangle apex row 501, base 511, axis 509
#      (15.64 px per unit): centre 506 = 0.19 umol/mmol. pH 3: one blob (rows 501-512); its top is a disc's (6 px
#      wide at row 501) and its bottom widens to 11 px on rows 511-512, a triangle base 1 px below pH 5's: glucosone
#      0.22, glucose 0.13 umol/mmol, assignment uncertain (+-0.15 umol/mmol covers a swap; 0.30 / 0.50 dex).
#      Precedent: ph_acid_submodel (near-zero points one reader kept are included with their read error).
#  (5) FIGS. 4-5 CONDITIONS. The paper prints none (p. 438 'glucose and each dicarbonyl were individually reacted in
#      the presence of L-phenylalanine at different pH values'; captions give pH only). Kept as DECLARED assumptions,
#      both readers alike: 98 C, 1 + 1 mmol in 10 mL, 60 min, air. Air is not a guess: at pH 7 MGO PAA reads 21.2 vs
#      Table 4 model B (air) 20.4 and model A (argon) 4.7. 60 min: pH 7 MGO PA 10.4 / PAA 21.2 sit between Table 3's
#      30 min (9.5 / 17.2) and 120 min (12.3 / 23.1), nearest 60 min (10.6 / 20.6); alternative 30-120 min. Buffer and
#      how pH 3 / 5 / 9 were set: unknown (phosphate barely buffers at pH 5). The mmol/L scale rests on the declared
#      1 mmol Phe / 10 mL. The pH 7 points are NOT a replot of Table 4 model B (3-DG PAA 4.8 vs 3.3, glucosone 2.6 vs
#      2.1): kept as a separate run; if a fit treats them as replicates of one experiment, count one of the two.
#  (6) TABLE 3 CLASS. The ledger entry is 'other' (the first reader's change from sida, confirmed): PA / PAA rows are
#      SIDA (p. 435), but the paper never says how phenylalanine was measured (the second reader: 'unknown, not
#      SIDA'). PHE rows: method semi_quantitative (precedent: davidek2006a formic acid, no calibration described),
#      not calibrated as first keyed; the companion hofmann2000b used an amino-acid analyser (ninhydrin), which this
#      paper does not claim. Owner may upgrade only with evidence. The Phe-degraded column (9 / 18 / 36 / 49 / 61 % at
#      10 / 30 / 60 / 120 / 300 min) matches hofmann2000b Table 3's glucose + Phe pot (8.0 / 17.5 / 36.0 / 49.0 / 60.2 %)
#      to <= 1 point at all five shared times: probable reuse of one series under two different pots (ledger flag
#      phe_loss_series_coincides_with_hofmann2000b); the PHE rows carry duplicate_candidate and must not be fitted as
#      independent of hofmann2000b.
#  (7) TEXT vs FIGURE. Glucosone 'maximum of concentration of 0.009 mol %' (p. 436) vs Fig. 3's 0.59 umol/mmol =
#      0.059 mol % at 60 min: the figure is kept (its marker sits on a smooth curve consistent with the other three
#      series); the text value equals the figure's 10 / 240-min markers, not its maximum. 'More 2-oxopropanal ... by a
#      factor of 3 than, for example, glyoxal' (p. 437) vs Fig. 3 at 500 min MGO / GO 10.95 / 2.16 = 5.1 (MGO / 3-DG
#      2.75): the figure is kept; the text's 'for example' fits 3-DG, not glyoxal. Neither text number is a row.
#  (8) SPECIES KEYS. MEBUAC3 (3-methylbutanoic acid) was coined by both readers independently; kept as a provisional
#      key with PHE, PHEAL, PHEAC, ACAL, MEBUAL3, ALA, LEU. None is an engine species: fit_rows.load refuses this table
#      by species (src/ and data/keys/ untouched). Verified literature data, NOT fit rows today.
