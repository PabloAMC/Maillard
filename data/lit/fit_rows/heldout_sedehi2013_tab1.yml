# KEYED TEST TABLE -- Sedehi N, Takano H, Blasic VA, Sullivan KA & De Haan DO 2013, Atmos Environ 77:656-663 (University of San Diego,
# De Haan), Table 1 (p. 661): pH laws log10 k = slope x pH + intercept of glyoxal and methylglyoxal loss with glycine, serine, arginine,
# methylamine and ammonium sulfate (1H NMR in D2O, 0.2 - 1.5 M, room temperature), activation energies where printed, and the pooled
# laws Eq. (3) (glyoxal) and Eq. (4) (methylglyoxal).
# PURPOSE: TEST data for engine error E4 ('pyrazine pH law on the Strecker step'): the dicarbonyl + amine step's own pH dependence (MG +
# glycine slope 0.262 per pH; glyoxal + glycine 0.741). University of San Diego (De Haan) is a new TEST lab for E4 (not UCSD / Miller).
# The transfer is large: 4 - 25 C, 0.2 - 1.5 M, D2O, pH read on an ISFET without pD correction; MG-loss k includes amine-catalysed aldol
# self-reaction (20 - 30 % for Gly / Arg at low pH, more elsewhere): an upper bound on the imine step, not the step itself.
# NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: sedehi2013_tab1_glyoxal_methylglyoxal_glycine_ammonium_ph_rate_laws (trunk.yml).
# FLAG supplement_missing: the per-run rate constants (Supplement Table S2) and Arrhenius plots (Fig. S5) are NOT on disk; only the
# PRINTED rate laws are keyed. Rows are law parameters: unit per_pH (slope), log10_per_M_per_s (intercept), kJ_per_mol (Ea),
# per_M_per_s (Eq. 3); k is per ACTIVE (unhydrated) aldehyde (fAld 7.0e-4 glyoxal, 2.7e-3 MG, computed) and the paper puts it within
# ~ factor 2 (footnote a).
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_sedehi2013_tab1.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: printed numbers, identical in both readings (10 laws, 6 Ea, Eqs. 3-4); intercept signs read on the render (the text
# layer drops minus signs: both readers). Read error = half the last printed digit in the row's own unit (not dex).
# RESOLUTIONS: (1) Glyoxal + ammonium sulfate (slope 1.05, intercept -7.45, Ea 21 +- 15) is a fit to Yu et al. 2011 data (footnote i),
# not this laboratory: DROPPED. (2) The MG slope is printed '0.36 +- 0.06' in Eq. (4) and '0.36 +- 0.08' in the text: Eq. (4)'s +- kept.
# (3) pH ranges of each law (x-range of the fitted points, Figs. 2 / 3) were read by reader A only: pot context, not rows. (4) Ea rows
# come from methylglyoxal loss or formic acid production rates (footnote c; species basis per row not stated). OH / NO3 radical rows
# (literature values) and the aerosol concentration / contribution columns (model estimates) are not measurements: not keyed.
status: ready   # two readers + adjudication (2026-11-01); TEST data, never a fit input: fit_rows.load refuses every row (units outside fit_rows.UNITS)
