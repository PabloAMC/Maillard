# KEYED TEST TABLE -- Meynier A & Mottram DS 1995, Food Chem 52:361-366 (University of Reading, Mottram), 'The effect of pH on the
# formation of volatile compounds in meat-related model systems': Tables 1 (glycine), 2 (lysine) and 4 (methionine) + D-ribose, five
# pH arms 4.5 - 6.5 each, 0.2 M pyrophosphate, 140 C / 1 h, sealed ampoules. Three keying units of docs/reference/contrast_benchmark/
# keying_queue.yml (ranks 1, 14, 15), one paper, one table file.
# PURPOSE: TEST data for the contrast benchmark, engine error E4 ('pyrazine pH law on the Strecker step'; docs/reference/contrast_benchmark/
# split_v2_per_change.yml): MPZ and 2,5-DMP vs pH with glycine and lysine (Tables 1, 2); methional (Strecker aldehyde of Met) vs pH for
# E4 and E3 ('no Strecker-aldehyde lane'; Table 4). Furfural, norfuraneol and furfuryl alcohol fall with pH in every table (context for
# the pentose lane). NEVER a fit input: fit_rows.load refuses every row (unit ug_per_10mg_ribose is not in fit_rows.UNITS; most species
# are coined keys); keep it so. The laboratory (Reading) is DEV for E8 and E20 but a NEW TEST lab for E4.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS). Ledger entries: meynier1995_table1_gly_ribose_ph_ladder,
# meynier1995_table2_lys_ribose_ph_ladder (data/lit/measurement_ledger/aroma_other.yml), meynier1995_table4_met_ribose_ph_ladder
# (sulfur.yml); quantification semi-quantitative (octadecane IS added to the SDE ether, response factors NOT determined: between-arm
# ratios only). Table 3 (cysteine) is not part of these units.
#
# READERS (2026-11-01), independent and in parallel: reader A (agent-readerA-2026-11-01; 300 dpi 1-bit scan, OCR checked against the
# rendered strips) and reader B (agent-readerB-2026-11-01; 200 ppi render read visually, pdftotext as a cross-check). Raw files: the
# coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml); B's rows as written: fit_rows/second/heldout_meynier1995_tab1_2_4.yml.
# ADJUDICATION (agent-queue-adjudicator-2026-11-01): table cells, so value = the printed cell. A and B agree on all 105 cells
# (30 + 35 + 40), including every nd / tr. The OCR text layer of Table 1 is scrambled (furan rows interleaved); both readers read the
# image. Read error = half the last printed digit (0.05 ug) in dex; no SD is printed (triplicate analyses, CV < 20 % except some
# low-concentration compounds).
#
# RESOLUTIONS OF THE FLAGGED AMBIGUITIES (re-read on a 300 dpi render of p. 364, 2026-11-01):
#  (1) Methional identity. Table 4 prints '3-(Methylthio)propanol' at LRI 903 (confirmed on the render). The abstract ('dimethyl
#      disulphide and 3-(methylthio)propanal ... the latter compound showed a small decrease') and the discussion ('Methional was the
#      most abundant volatile ... decreased slightly in concentration as the pH increased') describe exactly this row (167.2 -> 90.0);
#      LRI 903 on DB-5 fits methional (~905), not methionol (~980). RESOLVED as methional, species MTAL (P ~0.9); each row keeps the
#      printed label. The series is not monotone (167.2, 98.6, 138.2, 109.1, 90.0): only the end points carry the 'slight decrease'.
#  (2) DMDS cells. Confirmed on the render: '24.82' at pH 5.5 (two decimals, every other cell one) and '8.6' at pH 6.0. 24.82 is kept
#      (24.8 or 24.82 differ by 0.0004 dex; precision taken as 0.05). 8.6 breaks the rise the text states ('while the dimethyl
#      disulphide increased': 16.2, 22.2, 24.8, -, 41.9) by ~3x; a misprint (28.6?) is plausible but not provable: DROPPED (below).
#      DMDS and DMTS are tentative identifications (footnote a).
#  (3) Reactant amounts. The printed 100 mM amino acid + 70 mM ribose is the stock BEFORE the 25 -> 50 mL make-up; in-pot 50 + 35 mM
#      (INFERRED, P ~0.85: the 'ug / 10 mg ribose' basis is a 2 mL aliquot at 35 mM ribose = 10.5 mg; at 70 mM it would be 21 mg). Lysine
#      carries two amino groups (100 mM amine N in the lysine pots). The pH is set at room temperature before heating; the per-pot
#      measured pH after heating is not printed (within 0.2 unit).
# DROPPED (1 cell): Table 4, dimethyl disulphide, pH 6.0, printed 8.6 (reason above).
# NOT ROWS: 'nd' (not detected, LOD c. 10 ng / 10 mg ribose) and 'tr' (< 0.1 ug / 10 mg ribose) cells; each pot lists them under
# not_detected / trace_below_0p1 for sign and onset contrasts (the pyrazines are nd at pH 4.5 and 5.0 with glycine, nd at 4.5 with
# lysine, and nd / tr at every pH with methionine).
# NEW SPECIES KEYS (coined, not engine species; listed per pot under engine_species_missing): LYS free L-lysine; V_FURFURYL_ALCOHOL
# 2-furylmethanol; V_4_5_DIHYDRO_2_METHYL_3_2H_FURANONE; V_2_ETHYL_4_METHYLPYRIDINE and V_A_DIMETHYLPYRIDINE (tentative);
# V_2_FURYLMETHYL_METHYL_SULPHIDE; V_DIMETHYL_TRISULPHIDE (tentative). Engine keys: MPZ, DMP, FUR, NF, MTAL, DMDS, Gly, MET, PENT.
status: ready   # two readers + adjudication (2026-11-01); TEST data, never a fit input: fit_rows.load refuses every row (units outside fit_rows.UNITS)
purpose: 'TEST data for the contrast benchmark, engine error E4 (pyrazine pH law on the Strecker step; Tables 1, 2, 4) and E3 (no Strecker-aldehyde lane; Table 4 methional) (keying_queue.yml ranks 1, 14, 15); never a fit input'
