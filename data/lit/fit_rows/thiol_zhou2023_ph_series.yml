# ADJUDICATION (2026-10-30): both readers transcribed Fig. 2's six final-pH bars (agreeing within 0.01 pH); they
# are dropped here because the same six values are already rows of ph_acid_submodel.yml (one measurement, one row).
# KEYED FIT TABLE -- Zhou et al. 2023 (J Agric Food Chem 71:2472; PDF data/articles/Zhou2023b.pdf), Table 1 and Fig. 2:
# 2-methyl-3-furanthiol (MFT), 2-furfurylthiol (FFT), bis(2-methyl-3-furyl) disulfide (MFTD) and 2-furfural (FUR) from
# the alanine-xylose Amadori compound (engine ARP) with and without cysteine at initial pH 6 / 7 / 8, 120 C, 60 min,
# and the final pH of the six pots (Fig. 2). 2-acetylthiazole of the same table is in thiol_zhou2023_actz.yml.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS; every row an sd as
# printed or a read_error). Laboratory and quantification class come from the ledger entry.
# FIRST READER: agent-zhou2023ph-reader1-2026-10-30, against the PDF and its supplement (zhou2023b_supporting.pdf), not
# the dossier. Second reader: pending (data/lit/source_verification/thiol_zhou2023_ph_series.yml).
# NOTE ON THE FILE: the ledger's dossier is zhou2023_extraction.md, but data/articles/Zhou2023.pdf is a different paper
# (Zhu et al., Food Chem 400:133854); this Table 1 and Fig. 2 are in Zhou2023b.pdf.
# Conventions:
#   * pot ids, conditions and ledger ids as thiol_zhou2023_actz.yml (one pot per Table 1 column). initial_mmol_L in
#     engine keys: ARP = N-(1-deoxy-D-xylulos-1-yl)-alanine (the purified Amadori compound fed as a reactant), Cys.
#   * label_ph = the initial pH set with 3 M NaOH (no pot is buffered; the pH is not followed during heating).
#   * concentration errors: `sd` = the printed SD (n = 3, Table 1 footnote a), in ug/L; the printed Duncan letters are
#     kept in `printed` (they look unreliable: see the verification file).
#   * ND cells (Table 1 footnote e 'ND: not detected'; no LOD printed) are not rows; each pot's rows_note lists them.
#   * final pH rows (species pH, t_min 60): Fig. 2 is a bar chart with no printed numbers; values DIGITISED from the
#     embedded 600 dpi raster (1333 x 755 px; 106.1 px per pH unit from the 0/2/4/6 tick centres), bar value = centre
#     of the bar's top outline; sd = half the drawn error bar (Statistical Analysis: 'results are shown as mean
#     values +- standard deviation', three repeats; Fig. 2's legend does not say what the bars are); read_error 0.02 pH.
#   * LEDGER IDS: the pH 7 columns belong to zhou2023_table1_ph7_arp_cys_volatiles, the pH 6 / 8 columns to
#     zhou2023_table1_ph6_ph8_arp_cys_volatiles; the final-pH rows name zhou2023_fig2_final_ph in their own
#     `ledger_id`. fit_rows.load (and the source-verification gate) take the ledger entry from the POT, not the row,
#     so a pH row is gated and labelled by its pot's Table 1 entry; the row's ledger_id is a record only.
#   * The same six Fig. 2 values are already rows of ph_acid_submodel.yml (pots zhou2023_arp_ph6 ... _cys_ph8, ledger
#     zhou2023_fig2_final_ph): a fit that loads both tables counts each final pH twice.
# ADJUDICATION NOTES (2026-10-30, both readers): (1) the printed Duncan letters contradict the SDs (furfural
# 1339 / 473 / 437 all 'c'; MFT 697 and 1589 both 'c'): kept in `printed`, not used. (2) The MFT disulfide's
# calibration line (SI Table S1) crosses zero response near 34 ug/L, close to the 50 - 103 ug/L cells: those rows
# depend on the intercept and are not used for fitting until a reason to trust them is found. (3) The text's
# 'furan only detected at pH 8' contradicts Table 1 (not transcribed). (4) Quantification: internal-standard
# calibration curves (1,2-dichlorobenzene), not isotope dilution.
