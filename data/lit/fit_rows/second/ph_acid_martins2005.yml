name: ph_acid_martins2005
status: draft
reader: agent-m2005-reader2-2026-10-29
note: 'Second reader''s independent transcription of Martins & van Boekel 2005 Food Chem 90:257 (martins2005.pdf; martins2003.pdf
  is the Carbohydr. Res. 338:1665 DFG paper, not the thesis). Figures are vector: values are the exact marker/error-bar coordinates
  of pdftocairo -svg output, calibrated on the printed ticks (least squares, max tick residual 0.07 mmol/L), zero anchored on the
  0 tick. Concentrations mmol/L; read_error in dex; sd none (no figure defines its bars). Times are the nominal sampling times
  (marker x within 1.3 min). Points on the zero axis are not transcribed (no log residual): every t = 0 point (all at zero except
  one 120 C AA marker one grid step up, 0.135 mmol/L), 80 C AA to 60 min and 80 C FA to 90 min. Replicate index = drawing order
  within a time point (the three markers of one time are drawn consecutively), not a run identity across times. pH: Fig. 1c prints
  the 100 C trajectory, but it is the Martins 2005b Fig. 4 pH 6.8 series (same values at 10 shared times, within 0.04 pH), so no
  pH rows here.'
