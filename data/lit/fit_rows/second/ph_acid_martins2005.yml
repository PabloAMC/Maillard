      Gly: 200.0
    buffer: phosphate 0.1 mol/L (counter-ion not stated here); pH not held
    label_ph: 6.8
    ph_measured_at: not stated in this paper (samples cooled in ice water before analyses); the companion paper (Martins & van
      Boekel 2005b, same lab and recipe) states the initial pH was set at 20 C and reports pH "as measured at room temperature"
    ph_control: none (drifting; Fig. 1c shows 6.73 -> 5.50 over 240 min at 100 C)
    vessel: screw-capped glass tubes 16 x 160 mm, 10 mL, oil bath
    source_figure: Fig. 8d (80 C, dashed), three markers per time
    condition_quote: Equimolar solutions of D-glucose and glycine (0.2 mol L-1) were prepared in phosphate buffer (10 mL, 0.1 mol
      L-1, pH 6.8), filtered (0.2 um, Schleicher & Schuell) and heated at 80, 90, 100, 110 and 120 C in an oil bath, in screw-capped
      glass tubes (Schott, 16 x 160 mm). At predetermined heating times, samples were taken and immediately cooled in ice water,
      prior to analyses.
