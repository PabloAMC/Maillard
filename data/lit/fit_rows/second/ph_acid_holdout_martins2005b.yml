# ADJUDICATED 2026-10-30 (lead): Fig. 3's 210 / 240 min points removed. Fig. 3 disagrees with Fig. 7 at 90 min
# (FA 0.36 vs 0.48-0.53, AA 0.21 vs 0.35) and may be a separate run set or summary; counted once, Fig. 7 only, as reader 1.
# SECOND READER -- Martins & van Boekel 2005, Food Chem 92:437 (martins2005b.pdf): formic and acetic acid hold-out time courses.
# Independent of the first reading (data/lit/fit_rows/ph_acid_holdout_martins2005b.yml and its source_verification not opened,
# no dossier numbers, nothing under results/validation/). Verification: data/lit/source_verification/second/ph_acid_holdout_martins2005b.yml.
# Method: the figures are vector. pdftocairo -svg page 6 (Fig. 5) and page 8 (Fig. 7), page 5 (Fig. 3); every marker's path parsed,
# value = least-squares tick calibration of that panel (diamond = top-vertex x / side-vertex y; square, circle, triangle = bbox centre,
# checked on t = 0 markers that sit exactly on the zero axis; asterisk / plus = the shared start point of their rays). Overlapping
# markers are separate paths (or ray groups 6 rays per asterisk, 4 per plus), so coincident replicates are counted, not lost.
# Fig. 3 points are read at the error-bar origin (the squares sit 0.3 pt off it; the bar origin lands on the 0 tick and time ticks).
# Times are the nominal sampling times (marker x within 0.6 min of 0,5,15,30,...,240; Fig. 5 also 10, 20, 105).
# Replicate index = drawing order within one time point (zeros included in the count), not a run identity across times.
# sd: none -- no figure defines its error bars (Fig. 3 bars recorded as bar_half_length_undefined only); every row carries read_error
# (dex) = read error in mmol/L / (value x ln 10).
# Series identity (Fig. 7 caption): pH 4.8 filled diamond, 5.5 asterisk, 6.0 open circle, 6.8 plus, 7.5 filled triangle; series are
# drawn in that order in both panels. Fig. 5d: formic filled diamond, acetic open square.
# NOT transcribed: the pH 6.8 (+) arm of Fig. 7 (a reprint of the Martins 2005 100 C replicate acids); Fig. 3 means at times shared
# with Fig. 7 (counted once); every other species.
# Axis zeros left out (marker centre on the zero line; t_min and replicate):
#   Fig. 7g FA pH 4.8: ALL 24 markers (0, 15, 30, 45, 60, 75, 90, 120, 150, 180, 210, 240 min; r1 and r2) -- no FA row for pH 4.8
#   Fig. 7g FA pH 5.5: 0(r1), 0(r2), 0(r3)
#   Fig. 7g FA pH 6.0: 0(r1), 0(r2), 15(r1), 15(r2), 30(r1), 30(r2), 45(r2)
#   Fig. 7g FA pH 7.5: 0(r1), 0(r2)
#   Fig. 7h AA pH 4.8: 0(r1), 0(r2), 15(r1), 15(r2), 30(r1), 30(r2), 45(r1), 45(r2), 60(r1), 60(r2), 75(r1), 75(r2), 90(r1), 90(r2)
#   Fig. 7h AA pH 5.5: 0(r1), 0(r2), 0(r3), 15(r1), 15(r2), 15(r3), 30(r1), 30(r2), 30(r3), 45(r1), 45(r2), 45(r3)
#   Fig. 7h AA pH 6.0: 0(r1), 0(r2), 15(r1), 15(r2)
#   Fig. 7h AA pH 7.5: 0(r1), 0(r2), 5(r1), 15(r1)
#   Fig. 5d FA and AA: t = 0 (one marker each)
#   Fig. 3 FA and AA: t = 0 (not entered anyway: shared time)
