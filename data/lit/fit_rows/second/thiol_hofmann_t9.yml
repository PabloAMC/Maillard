# FIT ROWS, Hofmann & Schieberle 1998 Table 9 (1-mercapto-2-propanone from glucose + cysteine at pH 3 / 5 / 7):
# the INDEPENDENT SECOND READING (agent-hofmann-t9-reader2-2026-10-30).
# Format: src/kinetic_core/fit_rows.py. Values are transcribed from the paper (J Agric Food Chem 1998, 46, 235-241,
# p. 240, Table 9), read on the 300 dpi page image and the text layer (they agree); not from a dossier.
# Unit conversion: the table prints "amount (ug)" per 100 mL pot (footnote a: "A solution (100 mL) ..."), so
# ug per pot x 10 = ug/L. The pot fill is 100 mL in a 200 mL autoclave (Model Experiments).
# Errors: `read_error` (dex) is half the last printed digit (0.05 ug per pot); no SD is printed. Footnote b of Table 1
# (which Table 9 cites) says the values are means of triplicates that "differed by not more than 10%": a bound on
# replicate scatter (~0.04 dex if read as +-10 %), NOT entered as `sd`; the measurement model must add it.
# Table 9 has only one compound column (mercapto-2-propanone = engine key MP); no other engine species in it.
# Pot `minutes` = the single sampling time (endpoint, 20 min at 145 C).
