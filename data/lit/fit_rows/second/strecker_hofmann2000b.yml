# SECOND READER -- Hofmann & Schieberle 2000, J. Agric. Food Chem. 48:4301-4305 (hofmann2000b.pdf): Table 2, phenylacetaldehyde
# (PHEAL) and phenylacetic acid (PHEAC) from the fed Amadori compound N-(1-deoxy-D-fructosyl)-L-phenylalanine (ARP-Phe) or from
# glucose + L-Phe under argon / air / air + Cu(II) at 100 C, 120 min; Table 3, ARP-Phe and free Phe over 10-300 min in a refluxed
# glucose + Phe pot. Independent of the first reading (data/lit/fit_rows/strecker_hofmann2000b.yml and its source_verification
# NOT opened). Conventions follow data/lit/fit_rows/second/strecker_hofmann2000.yml. Verification:
# data/lit/source_verification/second/strecker_hofmann2000b.yml.
#
# Ledger ids (data/lit/measurement_ledger/trunk.yml): hofmann2000b_table2_arp_phe_oxygen (Table 2),
# hofmann2000b_table3_arp_phe_formation (Table 3).
#
# Pot naming rule (this reader): <paper key>_<precursor>_phe_<declared T>c_<time>_<atmosphere> for Table 2 (arp = fed ARP-Phe,
# glc = glucose + Phe; atmosphere argon / air / air_cu = expts I / II / III); <paper key>_glc_phe_reflux_timecourse for Table 3
# (printed "refluxed", as the second-reader strecker_hofmann2000 file names its reflux pots).
#
# Species keys. PHE, PHEAL, PHEAC are NOT engine species (named in engine_species_missing). ARP-Phe is keyed as the engine's
# Amadori node AMA -- an assumption (the engine's AMA is the glucose-glycine Amadori); alternative ARPPHE.
#
# Units. Table 2 prints umol/mmol precursor; Table 3 absolute umol in the 10 mL pot. Every pot is 1.0 mmol (+ 1.0 mmol) in 10 mL
# -> 100 mmol/L nominal, so 1 umol/mmol = 1 umol per 10 mL = 0.1 mmol/L. read_error = print rounding (half the last digit) in
# dex, linearised (half-unit / value / ln 10): transcription error, NOT method or replicate scatter.
#
# NOT keyed: Table 1 (FD factors), Table 3's "yield of ARP-Phe (%)" column (derived from the keyed ARP and Phe: checked in
# text_checks), Figs. 1-3 (outside the brief; Fig. 1 eyeballed only for the duplicate check in strecker_hofmann2000_fig2), t = 0.
#
# ADJUDICATOR RELABEL (agent-hofmann2000-fig2-2000b-adjudicator-2026-10-31): identifiers only, no value, error or condition
# touched. ARP-Phe AMA -> PHEARP in initial_mmol_L, species and engine_species_missing (ruling S of the first-reader table
# strecker_hofmann2000b.yml: the engine AMA is DFG, C8 N1, N-(1-deoxy-D-fructos-1-yl)glycine, src/kinetic_core/species.py;
# ARP-Phe is C15 N1 and releases Phe, not Gly). The species_mapping fields below keep this reader's AMA reasoning as written.
