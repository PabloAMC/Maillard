# ADJUDICATION (2026-10-30): both readers transcribed Fig. 2's six final-pH bars (agreeing within 0.01 pH); they
# are dropped here because the same six values are already rows of ph_acid_submodel.yml (one measurement, one row).
# Draft fit table, Zhou et al. 2023 J Agric Food Chem 71:2472 (Zhou2023b.pdf; NOT Zhou2023.pdf, a different paper):
# Table 1 MFT / FFT / MFTD / FUR in the xylose-alanine ARP +/- cysteine pots at initial pH 6 / 7 / 8, 120 C, 60 min,
# and the final pH of the six pots (Fig. 2). SECOND, independent reader (agent-zhou2023ph-reader2-2026-10-30); read
# from the paper and its SI only (the first reader's ph_series files not opened). status: draft.
# Table 1 cells: read from the text layer (pdftotext -layout) and checked on a 200 dpi render of the rotated page 2475.
# sd: the printed SD (ug/L), mean +/- SD, n = 3 (Table 1 footnote a). printed: the cell as printed, Duncan letter kept.
# ND cells (ARP-alone arm for MFT, FFT, MFTD at every pH) are not rows; they go under below_detection (no LOD printed).
# Final pH: digitised from Fig. 2 (embedded raster, 1333 x 755 px at 600 ppi, extracted with pdfimages; y axis
# 106.1 px per pH unit, least-squares on the 0 / 2 / 4 / 6 ticks, residual < 1 px). Each pH row carries sd (the
# error-bar half-span, SD n = 3 per the Statistical Analysis section) AND read_error (0.02 pH: +/-1 px line-centre
# location + < 1 px calibration residual, rounded up).
# Ledger: pH 7 columns zhou2023_table1_ph7_arp_cys_volatiles; pH 6 / 8 columns zhou2023_table1_ph6_ph8_arp_cys_volatiles;
# final pH zhou2023_fig2_final_ph. The pH rows sit in the same pots as the volatile rows but come from a different
# ledger entry, so each pH row names its own ledger_id (the loader as written takes the pot's ledger_id for every row;
# the owner decides whether the pH rows move to their own pots).
status: draft
submodel: thiol_submodel
