# SECOND READER -- Hofmann, Muench & Schieberle 2000, J. Agric. Food Chem. 48:434-440 (hofmann2000.pdf), Fig. 2: the time
# course of phenylacetaldehyde (PHEAL, open circles) and phenylacetic acid (PHEAC, filled circles) from glucose + L-Phe.
# Independent of the first reading (data/lit/fit_rows/strecker_hofmann2000_fig2.yml and its source_verification NOT opened).
# Conventions follow data/lit/fit_rows/second/strecker_hofmann2000.yml. Verification:
# data/lit/source_verification/second/strecker_hofmann2000_fig2.yml.
#
# Ledger id: hofmann2000_fig2_fig3_glucose_phe_dicarbonyls is the only trunk.yml entry naming Fig. 2 on 2026-10-31 (its Fig. 3
# half is keyed under hofmann2000_fig3_dicarbonyls_glucose_phe); its quant_class "calibrated" fits the dicarbonyls, not the
# SIDA-quantified PA / PAA of Fig. 2.
#
# Pot naming rule (this reader): <paper key>_<precursors>_<declared T>c_<regime>, as in the second-reader strecker_hofmann2000
# file; "_fig2" is appended because the Fig. 3 pot hofmann2000_glc_phe_98c_timecourse is a nominally identical recipe with a
# different sampling grid and the paper never says they share a pot.
#
# Digitisation. 1-bit raster 995 x 661 px at 300 ppi (pdfimages, unscaled). Axes: y axis line col 92, x axis line row 563.
# y ticks (left of the axis) at rows 10 / 121 / 231 / 341 / 452 for 5 / 4 / 3 / 2 / 1 and the axis row 563 for 0; least-squares
# fit 110.51 px per umol/mmol, tick residuals <= 0.59 px. x ticks (below the axis) at cols 242 / 392 / 542 / 690.5 / 840.5 for
# 50-250 min and the axis col 92 for 0 (2.993 px/min, residuals <= 0.67 px); after the break a 500 tick at col 974. Marker
# centres = midpoint of the top and bottom ink rows of each 11-12 px circle on ASCII pixel maps (open rings and filled disks
# separated by hand where they touch at 10 and 60 min). Read error +-1.5 px (+-0.014 umol/mmol); +-2 px for the touching pairs.
# All twelve readings fall within 0.01 umol/mmol of a 0.1 grid (the authors probably plotted rounded values).
#
# NOT keyed: the origin (curves start at 0, no marker). Units: umol/mmol glucose x 0.1 = mmol/L at 100 mmol/L glucose (the
# conversion rests on the inferred recipe: conditions_inferred).
#
# ADJUDICATOR RELABEL (agent-hofmann2000-fig2-2000b-adjudicator-2026-10-31): identifier only, no value touched. Ledger id
# hofmann2000_fig2_fig3_glucose_phe_dicarbonyls -> hofmann2000_fig2_pa_paa_glucose_phe (the Fig. 2-only SIDA entry the first
# reader added and this reader proposed; ruling L of the first-reader table strecker_hofmann2000_fig2.yml).
name: strecker_hofmann2000_fig2
status: draft
reader: agent-hofmann2000-fig2-2000b-reader2-2026-10-31
read_by: agent-hofmann2000-fig2-2000b-reader2-2026-10-31
pots:
  hofmann2000_glc_phe_98c_timecourse_fig2:
    ledger_id: hofmann2000_fig2_pa_paa_glucose_phe
    t_c: 98
    t_c_basis: not stated for Fig. 2; the "L-Phenylalanine/Glucose" model reaction is "heated at 98 C" (methods); Tables 1-2 footnotes "refluxed";
      abstract "100 C". Declared 98 C; alternative 100 C (aqueous reflux).
    minutes: 500
    conditions_inferred: true
    conditions_basis: Fig. 2 caption and the text introducing it state NO condition (no concentration, temperature, buffer, vessel or atmosphere).
      Declared from the methods' glucose/Phe recipe (written for 30 min) because the 30-min PAA marker (0.295) equals Table 2's 0.29 umol/mmol;
      the 30-min PA marker (0.499) is 19 % above Table 2's 0.42, so Fig. 2 may be a separate run.
    initial_mmol_L:
      Glc: 100.0
      PHE: 100.0
    concentration_basis: '1.0 mmol each in 10 mL buffer -> 100 mmol/L nominal (methods recipe, inferred for Fig. 2); y axis per mmol glucose:
      1 umol/mmol glucose = 0.1 mmol/L'
    engine_species_missing:
    - PHE
    - PHEAL
    - PHEAC
    label_ph: 7.0
    ph_measured_at: not stated (methods recipe as prepared); pH not re-measured
    buffer: phosphate pH 7.0 (methods recipe, inferred); molarity 0.5 mol/L as read (see buffer_contradiction)
    buffer_contradiction: Methods print "0.5 mmol/L" (both model-reaction paragraphs); Tables 1, 2, 3, 5 print "0.5 mol/L"; Table 4 prints
      "0.1 mol/L". 0.5 mmol/L cannot buffer 100 mmol/L solutes, so mmol/L is read as a misprint for mol/L.
    atmosphere: not stated for Fig. 2 (the methods' glucose/Phe recipe has no degassing; argon bubbling is written only for the dicarbonyl
      runs) -> air presumed, not controlled
    vessel: 'not stated (Table 2 footnote: refluxed; methods: heated at 98 C); one pot per time not stated'
    source_figure: Fig. 2 (p. 436), 1-bit raster 995 x 661 px at 300 ppi (pdfimages page 3 object 50); y "amount [umol/mmol glucose]" 0-5,
      x "t (min)" 0-250 then a break to 450-500; markers at 10, 30, 60, 120, 240 and 500 min; curves from the origin (no t = 0 marker)
    quantification_note: PA and PAA by SIDA ([13C2]phenylacetaldehyde, [13C2]phenylacetic acid; GC-MS CI), as for Table 2
    condition_quote: Fig. 2 caption "Time course of the formation of phenylacetaldehyde (open circle) and phenylacetic acid (filled circle)
      from glucose and L-phenylalanine." / Methods "Model Reactions. L-Phenylalanine/Glucose. A solution of glucose (1.0 mmol) and L-phenylalanine
      (1.0 mmol) in phosphate buffer (10 mL; 0.5 mmol/L, pH 7.0) was heated at 98 C for 30 min." / text p. 436 "The results showed (Figure
      2) that the formation of PA was slightly favored within the first 60 min of the thermal treatment. However, increasing the reaction
      time then led to a predominant generation of PAA. After ~8 h, the amounts of the acid were nearly twice as high as the concentration
      of the aldehyde."
    possible_same_pot: hofmann2000_glc_phe_98c_timecourse (Fig. 3 dicarbonyls, strecker_hofmann2000) is also a glucose + Phe time course;
      Fig. 3 has a 300-min point Fig. 2 lacks, and the paper does not say they share a pot. Kept separate; the adjudicator may merge.
