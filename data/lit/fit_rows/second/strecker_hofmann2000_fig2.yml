text_checks:
- quote: p. 436 "the formation of PA was slightly favored within the first 60 min"
  reading: PA > PAA at 10 / 30 / 60 min (0.200 / 0.096, 0.499 / 0.295, 0.897 / 0.793); curves cross at ~70 min -> consistent
- quote: p. 436 "After ~8 h, the amounts of the acid were nearly twice as high as the concentration of the aldehyde."
  reading: '500 min (8.3 h): PAA / PA = 3.503 / 2.209 = 1.59; ''nearly twice'' is generous (hofmann2000b text says 1.7 at 500 min for its
    own glucose/Phe Fig. 1)'
- quote: 'Table 2 (same paper): PA 0.42, PAA 0.29 umol/mmol at 30 min, glucose + Phe refluxed'
  reading: 'Fig. 2 at 30 min: PA 0.499 (+19 %, = 8.7 px, outside the read error), PAA 0.295 (match). CONTRADICTION on PA: Table 2 and Fig.
    2 are not the same measurement, or one is a different run; rows keep the figure.'
- quote: 'hofmann2000b Table 2 expt II (Glc/Phe, 100 C, 120 min, closed vial, air): PA 1.4, PAA 1.8 umol/mmol'
  reading: 'Fig. 2 at 120 min: PA 1.395, PAA 1.797 -> identical to 0.1. DUPLICATE CANDIDATE: the 2000b air value may be this run''s 120-min
    point (or a coincidence); do not count both as independent.'
- quote: hofmann2000b Fig. 1 (glucose/Phe, open squares PA, filled squares PAA; eyeballed, not digitised)
  reading: '2000b Fig. 1 reads roughly PA 0.6 / 1.2 / 2.1 / 2.8 and PAA 0.5 / 1.5 / 2.8 / 3.7 at 60 / 120 / 240 / 500 min, i.e. NOT the same
    series as this Fig. 2 (0.90 / 1.40 / 2.00 / 2.21 and 0.79 / 1.80 / 3.20 / 3.50): two runs of the nominally same pot; spread ~10-30 %'
