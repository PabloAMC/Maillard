# SECOND READER (reader B) -- Larralde, Robertson & Miller 1995, PNAS 92:8158-8160 (larralde1995.pdf; 600 ppi 1-bit scan): the
# phosphate rate law and the bicarbonate ratio (text), Fig. 2 (Arrhenius points) and Fig. 1 (pD profile). Reader B's values AS
# WRITTEN: B read log10 k (s-1); value = 10^(B's log k), read_error = B's error in dex. The raw reading (coordinator's scratchpad,
# keying_reader_B.yml) is not repeated here. Independent of reader A.
# Pots: B wrote one pot for the four Fig. 2 temperatures and the text, and one for all of Fig. 1; split here per temperature and
# per nominal pD (names suffixed _b) so that scripts/reconcile_source_readings.py can pair them (it matches pots by temperature
# and label pH). The rate-law unit label (per_min) is the adjudication's; B keyed the printed 's-1' as printed and left it
# unresolved (B's note: in s-1 the law contradicts the 73-min half-life and Fig. 2; in min-1 it is within ~0.1 dex of Fig. 2).
