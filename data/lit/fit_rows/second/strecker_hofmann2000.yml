# SECOND READER -- Hofmann, Muench & Schieberle 2000, J. Agric. Food Chem. 48:434-440 (hofmann2000.pdf): Strecker aldehyde
# and acid (phenylacetaldehyde PHEAL, phenylacetic acid PHEAC; acetaldehyde ACAL / acetic acid AA; 3-methylbutanal MEBUAL3 /
# 3-methylbutanoic acid MEBUAC3) from L-Phe / L-Ala / L-Leu with glucose or alpha-dicarbonyls (MGO, GO, TDG, G), and the
# alpha-dicarbonyls of a glucose + Phe pot. Independent of the first reading (data/lit/fit_rows/strecker_hofmann2000.yml, its
# source_verification, the extraction dossier and any ledger entry naming hofmann2000 NOT opened). Verification:
# data/lit/source_verification/second/strecker_hofmann2000.yml.
#
# Species keys PHE, LEU, ALA, PHEAL, PHEAC, ACAL, MEBUAL3, MEBUAC3 are NOT engine species (fit_rows.load refuses them today);
# every pot names them in engine_species_missing. MEBUAC3 (3-methylbutanoic acid) is a key proposed by this reader (the
# brief listed no key for it). AA = engine acetic acid.
#
# Units. Tables 2 and 4 and Figs. 4-5 print umol/mmol (amino acid); Fig. 3 umol/mmol glucose; Table 3 absolute umol in the
# pot. Every pot is 1.0 mmol + 1.0 mmol in 10 mL -> 100 mmol/L nominal, so 1 umol/mmol = 1 umol per 10 mL = 0.1 mmol/L.
# Each row keeps value_as_printed / unit_as_printed. Figs. 4-5 carry NO conditions in the paper: their pots are declared
# from the Table 4 recipe (conditions_inferred: true) and the conversion inherits that assumption.
#
# Errors. No SD, CV or replicate count is printed anywhere. Table rows carry print rounding only (half the last digit, in
# dex): transcription error, NOT method or replicate scatter -- the measurement model must add series noise. Figure rows
# carry the digitisation error: Figs. 3-5 are 1-bit 300 ppi rasters (pdfimages, unscaled); ticks located by ink sums
# (Fig. 3 ticks 1 px rows, 32.4 px/unit, 1 px non-linearity at 12 -> piecewise-linear between ticks; zero = the x-axis line);
# filled markers: bbox centre after a 5x5 morphological opening (removes the 1 px lines); open circles: holes filled first;
# plus signs: the horizontal bar row; triangles: apex/base midpoint; overlapping markers resolved on ASCII pixel maps.
# Typical +-1.5 px (= +-0.05 umol/mmol Fig. 3, +-0.04 Fig. 4, +-0.10 Fig. 5); 2-3 px where markers overlap.
#
# NOT keyed: t = 0 points (origin) of Fig. 3; Fig. 3 glucosone at 300 and 500 min (centre on / 1 px below the x axis, i.e.
# zero, left out); Table 1 (FD factors), Table 5 ([13C2]-PA spike: 40.1 / <0.5 ug/mmol, furan-2-carboxylic acid IS) and
# Fig. 2 (glucose + Phe PA / PAA time course) -- outside the brief; the "0.042 / 0.029 mol %" of the text (= Table 2).
name: strecker_hofmann2000
status: draft
reader: agent-hofmann2000-reader2-2026-10-31
read_by: agent-hofmann2000-reader2-2026-10-31
pots:
  hofmann2000_glc_phe_reflux_30min:
    ledger_id: hofmann2000_table2_glucose_amino_acids
    t_c: 98
    t_c_basis: printed "refluxed" (Table footnote) but text / methods say 98 C; declared 98 C. Open reflux of this ~0.6-0.7 osmol/kg
      solution boils ~100.3-100.5 C; abstract says "100 C".
    minutes: 30
    initial_mmol_L:
      Glc: 100.0
      PHE: 100.0
    concentration_basis: 1.0 mmol each in 10 mL buffer -> 100 mmol/L nominal (solute volume ~0.2 mL ignored, -0.009 dex if included);
      1 umol/mmol = 0.1 mmol/L
    engine_species_missing:
    - PHE
    - PHEAL
    - PHEAC
    label_ph: 7.0
    ph_measured_at: not stated (as prepared); pH not re-measured
    buffer: phosphate, pH 7.0; molarity as printed in the table footnote (see buffer_contradiction); 0.5 mol/L
    buffer_contradiction: Methods print "0.5 mmol/L" (both model-reaction paragraphs); Tables 1, 2, 3, 5 print "0.5 mol/L"; Table 4
      prints "0.1 mol/L". 0.5 mmol/L cannot buffer 100 mmol/L amino acid + dicarbonyl, so mmol/L is read as a misprint for mol/L; the
      Table 4 0.1 mol/L is unresolved.
    atmosphere: open reflux (air), not controlled
    vessel: reflux, volume 10 mL
    source_table: Table 2, column "phenylalanine"
    condition_quote: Table 2 footnote a "A solution of glucose (1.0 mmol) and the respective amino acid (1.0 mmol), dissolved in phosphate
      buffer (10 mL; 0.5 mol/L, pH 7.0), was refluxed for 30 min. b na, not analyzed." / text p. 436 "Quantification of the amounts
      of phenylacetaldehyde and phenylacetic acid formed after 30 min at 98 C using SIDA revealed that both odorants were formed in
      the same orders of magnitude of 0.042 and 0.029 mol %, respectively (cf. Table 2)."
