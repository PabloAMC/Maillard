# Draft fit table, Hofmann 1999 Eur Food Res Technol 209:113 (hofmann1999.pdf), xylose + L-alanine pot:
# methylglyoxal (MGO) and glycolaldehyde (HA). SECOND, independent reader (agent-sm34-reader2-2026-10-30); read from the
# paper only (no dossier, no first reader's file). status: draft.
#
# Units. The paper prints amounts per mmol starting xylose: Fig. 10 in ug/mmol xylose; Table 3 as "relative browning
# activity" = concentration (umol/mmol, Eq. 1, p. 118) x CD factor (Table 1: 2-oxopropanal 256, glycolaldehyde 1024).
# Rows are in mmol/L on a DECLARED volume basis (the pot's): 6 mmol xylose + 6 mmol L-alanine dissolved in 4 mL buffer,
# final volume 4.94 mL from the partial molar volumes (xylose ~95.5, L-alanine ~60.5 cm3/mol, 25 C):
#   c [mmol/L] = (umol per mmol xylose) x 6 / 4.94 = (umol/mmol) x 1.21457.
# The same factor sets the pot's PENT, so yields per xylose are invariant to it; a 4.0 mL basis would shift every row
# and the initial PENT by +0.09 dex together. Each row keeps the printed number (value_as_printed, unit_as_printed).
#
# Each value once. Table 3 (printed integers) is used at 5 / 10 / 60 / 120 min; Fig. 10 only at the times Table 3 lacks
# (MGO 20 / 40 / 180, HA 20 / 40 / 80 / 180). Fig. 10 has no HA point at 5 min and no MGO point at 60 / 80 min (axis
# break 70-100), so Table 3 is the only source there.
# Errors: no SD, no replicates printed. read_error (dex) = transcription only: half the last printed digit of the Table 3
# integer, or 2 px on the Fig. 10 raster (4 px for MGO 40 min, see read_error_basis). It does NOT cover replicate or method
# scatter; the measurement model must add it (fitting.estimate_series_noise).
# CROSS-CHECK (overlap times, Fig. 10 / Table 3): MGO 0.99, 1.01, 1.03 (5, 10, 120 min) -> consistent. HA 0.88, 0.90, 0.86
# (10, 60, 120 min) -> Fig. 10 sits 0.04-0.07 dex BELOW Table 3, systematically; the HA series mixes both sources, so the
# HA rows carry source_disagreement_dex for the adjudicator.
status: draft
submodel: deoxyosone_submodel
read_by: agent-sm34-reader2-2026-10-30
pots:
  hofmann1999_xyl_ala_reflux:
