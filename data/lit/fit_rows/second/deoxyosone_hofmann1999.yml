    t_c: 100
    t_c_basis: 'Declared, not stated: "refluxed" (p. 115). An open reflux of this solution boils ~1.5-2.5 K above 100 C
      (xylose ~1.5 + alanine ~1.5 mol/kg water, 0.5 M phosphate; 0.512 K kg/mol), i.e. ~101.5-102.5 C at 1 atm; heat-up
      time to reflux not stated (matters for the 5 min point).'
    minutes: 180
    initial_mmol_L:
      PENT: 1214.6
      Ala: 1214.6   # adjudicated 2026-10-30: alanine is the amine; recorded as charged (not an engine species)
    engine_species_missing: true   # adjudicated: the lane has no xylose + alanine -> ARP condensation
    amino_acid_not_engine_species:
      L-alanine_mmol_L: 1214.6
      note: L-alanine 6 mmol, same volume basis. Alanine is not an engine species key (the engine's amino acid is Gly);
        recorded here, mapping left to the adjudicator.
    volume_basis: '6 mmol xylose + 6 mmol L-alanine in 4 mL buffer; final volume not stated; declared 4.94 mL (4 mL + 0.573
      mL xylose + 0.363 mL alanine from partial molar volumes at 25 C). Range 4.0-5.0 mL -> -0.005 / +0.09 dex.'
    label_ph: 7.0
    ph_measured_during: false
    buffer: phosphate 0.5 M (counter-ion not stated)
    condition_quote: Solutions of 6 mmol xylose or 6 mmol glucose in 4 ml phosphate buffer (0.5 mol/l, pH 7.0) were refluxed
      in the presence of 6 mmol L-alanine for the reaction times given in Figs. 3-6.
    note: 'Open reflux (air). Whether each time is a separate pot is not stated (wording suggests one pot per reaction time).
      Dicarbonyls: a quarter of the pot, derivatised AFTER cooling with 2 mL of 1 mmol/L 1,2-diaminobenzene (= 2 umol OPD,
      read on the page image) against ~1.5 mmol xylose worth of mixture that holds >10 umol of alpha-dicarbonyls at 5-20 min
      (3-deoxypentosone alone ~9.5 umol/mmol at 10 min, p. 116) -> OPD likely limiting; the [13C4]-butane-2,3-dione IS
      competes for the same OPD, which only partly compensates. Glycolaldehyde: 4 mmol ethoxamine (in excess).'
