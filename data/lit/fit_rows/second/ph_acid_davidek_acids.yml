# SECOND READER -- Davidek et al. 2008 (Ann NY Acad Sci 1126:241), Davidek et al. 2006a (JAFC 54:6667), Davidek et al. 2006b
# (JAFC 54:6677), Novotny et al. 2008 (Czech J Food Sci 26:117): acetic / formic acid and sugar consumed vs pH, T, time.
# Independent of the first reading (data/lit/fit_rows/ph_acid_davidek_acids.yml, its source_verification and any ledger entry
# naming these papers NOT opened). Verification: data/lit/source_verification/second/ph_acid_davidek_acids.yml.
# Method: every figure is a raster (davidek2008 Fig. 1: 8-bit gray 909 ppi; davidek2006a Figs. 3, 5: CCITT 1-bit stencils, 600 ppi),
# extracted unscaled with pdfimages; gridlines and ticks located by row/column ink sums; values by piecewise-linear interpolation
# between gridlines (removes the scan's 1 % spacing non-linearity), times by a linear fit to the tick marks (residual < 3 px).
# Marker centre = bbox centre (checked on davidek2008 Fig. 1: the pH 8 open triangles at 120 / 240 min sit on the 0 % line to 1 px).
# Filled markers: morphological opening (13 px, 9 px) removes lines; open markers: enclosed-hole centre (squares) or apex/base midpoint
# (triangles, height 58 px). Overlapping markers in davidek2006a Fig. 3 (pH 6.5 / 7 / 8) resolved by eye on 6x crops with a pixel ruler.
# Conversions to mmol/L: mol% of an equimolar 0.1 mol/L sugar (or precursor) + glycine pot -> 1 mol% = 1.0 mmol/L (either reference
# gives the same number); residual xylose % x 100 mmol/L / 100. davidek2006a Fig. 3 (mol/mol 1-deoxyglucosone) uses the NOMINAL
# 10 mmol/L of that pot (0.1 mmol in 2 mL, diluted five-fold) -- an assumption-laden conversion, flagged on the pot.
# Errors: tables print +- without saying what it is (footnotes give CV < 10 %), so rows carry read_error = 0.0414 dex (10 %) and the
# printed +- as pm_printed, never sd. Figure rows carry the read error in dex.
# NOT transcribed (see notes and the verification file): t = 0 zeros; the 100 % xylose at t = 0 (normalisation); pH 8 xylose at
# 60 / 120 / 240 min (on the 0 line, labelled "0"); every labelling percentage (davidek2008 Figs. 3-4, davidek2006a Table 2,
# davidek2006b 18O split beyond the total); acetone / propanoic acid (davidek2006a Fig. 5, no engine species); C4-aldonic acids
# (davidek2006b); the Amadori-compound yields 4 / 28 / 56 mol% (davidek2006a, cited from ref. 21, not measured in this paper);
# all of Novotny 2008 (no simulable condition; notes).
name: ph_acid_davidek_acids
# ADJUDICATION (2026-10-30): Davidek 2006a Fig. 3 (1-deoxyglucosone, no amine; its pH 6.5 / 7 markers overlap and
# the two readers assigned them differently, |diff| <= 0.44 mmol/L; the precursor concentration is not printed, so
# the rows rest on a nominal 10 mmol/L) and Fig. 5 (2,3- / 2,4-pentanedione + glycine: no engine species) are
# dropped from the verified table; both readings remain in git history (commit of 2026-10-30).
