note: 'Second reader. Rows: 95 = davidek2008 Fig. 1 19 (AA 11, PENT 8); davidek2006a Table 1 13 (AA); davidek2006a 3-DG text 6 (AA 3,
  FA 3); davidek2006a Fig. 3 25 (AA, five pH x five times); davidek2006a Fig. 5 29 (AA; engine_species_missing pots, not fit rows
  today); davidek2006b Table 1 3 (AA). Text yields 16 / 28 mol% (davidek2008) = the 240-min Fig. 1 points (printed as data labels "16"
  and "28" in Fig. 1): duplicates, not keyed again; this reading gives 16.15 and 27.59 mmol/L. davidek2006a "1, 17 and 38 mol %" after
  4 h = Table 1 240-min rows (duplicates); "89 and 11 %" = Fig. 5 pH 8 240-min rows (read 88.8 and 10.65); "85 mol %" (abstract) =
  Fig. 3 pH 8 60-min label 0.84; davidek2006b "about 32 mol %" = Table 1 (duplicate).'
