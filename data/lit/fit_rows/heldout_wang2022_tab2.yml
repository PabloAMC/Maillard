# KEYED TEST TABLE -- Wang Y, Xie J, Zhang C, Xu Y & Yang X 2022, Flavour Fragr J 37:274-284 (Beijing Technology and Business University,
# Xie J), Table 2 (pp. 277-278): 26 Maillard and 11 lipid-Maillard volatiles (ng/g) of L-cysteine + D-xylose (2 + 2 mmol in 5 mL 0.2 M
# sodium phosphate pH 5.5), 120 C / 150 min, without (blank) or with 1 % / 2 % methyl linoleate.
# PURPOSE: TEST data for engine errors E7 ('lipid lane inert to Maillard odorants') and E12 ('thiol losses'): MFT 1509.82 -> 445.08 ->
# 282.81, FFT 529.06 -> 256.90 -> 206.69 ng/g with 0 / 1 / 2 % methyl linoleate; 2-pentyl- and 2-hexylthiophene appear only with lipid.
# BTBU is a new TEST lab for E7. NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: wang2022_table2_lipid_vs_blank_120c_150min (lipid.yml); sulfur.yml's
# wang2022_table2_volatiles_120c_150min is the SAME table (nothing keyed under it here). Quantification semi-quantitative (1,2-dichloro-
# benzene injected with the fibre, calibration factor 1): between-arm ratios.
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_wang2022_tab2.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: table cells, value = the printed cell. A and B agree on all 111 cells (value, SD, letters; 35 '-' cells). Read error =
# half the last printed digit (0.005 ng/g) in dex, with the printed SD (n = 2).
# RESOLUTIONS: (1) Totals. The printed Subtotals reproduce the row sums (4011.16 / 1235.72 / 811.12; 0.00 / 713.23 / 596.74, within 0.01);
# the printed TOTAL row does not in any column (4003.84 vs 4011.16; 1891.92 vs 1948.95; 1424.24 vs 1407.86): the Total row is misprinted
# (both readers; P > 0.95). Totals and subtotals are sums, not rows. (2) Row 29 (2-methyl-3-pentanethiol), blank arm: the cell is EMPTY
# (no dash); footnote b defines the lipid-Maillard block as detected only with lipid: read as not detected. (3) Row 16
# (2-methoxy-5-methylthiophene, 2 % only) prints 7.75 +- 0.37, identical to row 6 in the same column: a copy error is possible (P ~0.5);
# both subtotals include it, so it is kept and flagged. (4) Dose basis: 1 % / 2 % are mass percentages of the TOTAL system (xylose +
# cysteine + methyl linoleate + buffer), ~56 / ~113 mg (not printed). Several SDs print 0.00 (n = 2). No row dropped.
# NOT ROWS: '-' cells, listed per pot under not_detected.
