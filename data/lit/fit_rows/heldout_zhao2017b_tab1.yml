# KEYED TEST TABLE -- Zhao J, Zhao MY, Cao CC, Zhen DW, Wang JX, Li L & Xie JC 2017, Food Science (China) 38(20):63-69 (Beijing
# Technology and Business University, Xie J), Table 1 (pp. 67-68): volatiles (TIC peak area x 1e5, mean of HP-5MS and DB-Wax) after 3 h
# at 90 C of L-cysteine + D-xylose (2 + 2 mmol in 5 mL 0.2 M sodium phosphate pH 5.5), without or with 0.5 mmol hexanal,
# (E)-2-heptenal or (E,E)-2,4-decadienal.
# PURPOSE: TEST data for engine error E7 ('lipid lane inert to Maillard odorants'): MFT 1133.0 -> 13.7 (hexanal) -> nd (heptenal,
# decadienal); FFT 33.9 -> nd with every aldehyde; alkylthiophenes appear only with the aldehydes. BTBU is a new TEST lab for E7.
# NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: zhao2017b_tab1_aldehyde_arm_volatiles_3h (lipid.yml); quantification: TIC areas,
# no internal standard (between-arm ratios of one compound only).
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_zhao2017b_tab1.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: table cells, value = the printed cell. A and B agree on all 164 cells (40 compounds x 4 arms, in the paper's three
# origin blocks; 112 '-' cells). Read error = half the last printed digit (0.05) in dex (3 parallel samples, SD within 15 % stated; no
# SD printed).
# RESOLUTIONS: (1) 4-methyl-2-propylfuran (77.0) is printed between the heptenal and decadienal columns; the block subtotals put it in
# the DECADIENAL arm (heptenal sums to its subtotal 13830.2 without it; decadienal to 10068.3 with it; both readers, P ~0.95): kept,
# flagged. (2) Thiophene appears in two blocks (cysteine-sugar: blank 4.7; aldehyde-Maillard: decadienal 26.0), same RI; the authors
# assign origin by arm: both kept (different pots). (3) Reactant amounts: (E)-2-heptenal printed 0.061 g for 0.5 mmol (0.056 g; 9 %):
# the text sets every aldehyde at 0.5 mmol, so 0.5 mmol is used (100 mM). Subtotals and totals re-summed by both readers (within 0.1).
# No row dropped. NOT ROWS: '-' cells (not detected, no LOD printed), listed per pot with their block.
