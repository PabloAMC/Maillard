# KEYED FIT TABLE -- Strecker degradation: Hofmann, Munch & Schieberle 2000 (J Agric Food Chem 48:434-440, DFA Garching;
# doi 10.1021/jf990954c, printed on p. 434), Fig. 2: the time course of phenylacetaldehyde (PHEAL, open circles) and
# phenylacetic acid (PHEAC, filled circles) in the glucose + L-phenylalanine pot (the recipe of Table 2 / Fig. 3).
# Companion of strecker_hofmann2000.yml (Tables 2-4, Figs. 3-5), whose verified header records the paper-wide rulings
# (buffer molarity, 98 C vs reflux); this table follows its conventions and does not re-rule them.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS). Laboratory and
# quantification class from the ledger entry hofmann2000_fig2_pa_paa_glucose_phe (data/lit/measurement_ledger/trunk.yml;
# NEW 2026-10-31: the older entry hofmann2000_fig2_fig3_glucose_phe_dicarbonyls mixes Fig. 2 (SIDA) with Fig. 3
# (quinoxalines) under class 'calibrated'; Fig. 3 was split out the same way, as hofmann2000_fig3_dicarbonyls_glucose_phe).
# FIRST READER (agent-hofmann2000-fig2-2000b-reader1-2026-10-31), read from data/articles/hofmann2000.pdf (text layer via
# pdftotext -layout; the embedded 300 ppi 1-bit stencil raster of Fig. 2, pdfimages object 50, page 436, 995 x 661 px).
# The dossier hofmann2000_extraction.md was a map only. Verification: data/lit/source_verification/strecker_hofmann2000_fig2.yml.
# Second reader: agent-hofmann2000-fig2-2000b-reader2-2026-10-31 (verified; see TWO READERS below).
#
# SPECIES KEYS (not in the engine; the pot is engine_species_missing, so these are verified data for later, NOT fit rows
# today; fit_rows.load refuses them by species): PHE, PHEAL, PHEAC, as strecker_hofmann2000.yml. Engine key: Glc.
#
# UNITS. The y axis reads 'amount [umol/mmol glucose]'. The recipe charges glucose 1.0 mmol + L-Phe 1.0 mmol in 10 mL
# (Experimental, p. 435; Tables 1-2 footnotes), so 1 umol/mmol = 1 umol per pot = 0.1 mmol/L, and value / Glc0
# (100 mmol/L) is the plotted ratio exactly. The solutes' volume (~0.25 mL) is ignored (<= 2.5 %).
# DIGITISATION. Axes fitted by least squares on the tick marks found in the pixels: y ticks 1-5 at rows 452 / 341 / 231 /
# 121 / 10 plus the x-axis line (row 563) as 0: 110.514 px per umol/mmol, zero at row 562.62, max residual 0.59 px;
# x ticks 0-250 min at cols 92 / 242 / 392 / 542 / 690 / 840.5: 2.9923 px/min, max residual 0.84 px. The x axis is
# broken between 250 and 450 min; the right segment carries one marker pair at the 500-min tick (col 974; markers at
# col 975), snapped to 500 min. Markers at 10, 30, 60, 120, 240, 500 min (x fit within 0.3 min of each), none at 0
# (both curves are drawn from the origin). Open circles: centre of the enclosed hole (9 x 9 px); filled circles: bbox
# centre after a 5 x 5 morphological opening (11 x 11 px discs). At 10 and 60 min the PA ring's bottom merges with the
# PAA disc's top (ASCII dumps): the disc is taken as its 11 clean rows, +-1.5 px for both markers there.
# ERRORS. No SD, no n, no error bars in the paper. read_error (dex) = sqrt(marker_px^2 + 0.59^2) / 110.514 / value /
# ln 10, marker +-1 px (+-1.5 px where markers merge); transcription only, not the replicate scatter.
# NOTE ON VALUES: every digitised point lies within 0.008 umol/mmol (0.8 px) of a multiple of 0.1 (PA 0.2 / 0.5 / 0.9 /
# 1.4 / 2.0 / 2.2; PAA 0.1 / 0.3 / 0.8 / 1.8 / 3.2 / 3.5): the figure was likely plotted from values rounded to 0.1.
# The rows keep the digitised values (the convention), the read error does not cover the plotting rounding (+-0.05).
#
# CONDITIONS (none printed for Fig. 2; DECLARED from the paper's glucose/Phe recipe, see the pot): 98 C (Experimental;
# footnotes 'refluxed'; abstract '100 C'); phosphate pH 7.0, 0.5 mol/L per the Tables 1-2 footnotes (Experimental:
# '0.5 mmol/L', ruled a misprint in strecker_hofmann2000 ruling 1); atmosphere not controlled; vessel / one pot sampled
# or one vessel per time: not stated. Whether Fig. 2 and Fig. 3 come from one run is not stated.
# CHECKS AGAINST THE PAPER'S OWN NUMBERS:
#  * text p. 436 'the formation of PA was slightly favored within the first 60 min' -- PA > PAA at 10 / 30 / 60 min,
#    curves cross at ~70 min: consistent.
#  * text p. 436 'After ~8 h, the amounts of the acid were nearly twice as high as ... the aldehyde' -- 500 min PAA / PA
#    = 3.498 / 2.204 = 1.59 (240 min: 1.60): 'nearly twice' is generous; flagged as text_check, no row.
#  * Table 2 (same recipe, 30 min reflux, printed) PA 0.42 / PAA 0.29 umol/mmol vs Fig. 2 at 30 min 0.494 / 0.295: PAA
#    agrees, PA 18 % higher in the figure (different run, or plotted differently). Not a duplicate; both kept.
#  * Figs. 4-5 glucose at pH 7 (declared 60 min, strecker_hofmann2000) PA 0.78 / PAA 0.63 vs Fig. 2 at 60 min 0.90 /
#    0.79: same order, 15-25 % apart.
# DUPLICATE CANDIDATE (recorded, not resolved): Fig. 2 at 120 min (PA 1.399, PAA 1.797) equals Hofmann & Schieberle 2000b
# Table 2 expt II, glucose/Phe (PA 1.4, PAA 1.8 umol/mmol; '100 C ... 120 min in a closed vial', 'Argon was replaced by
# air oxygen') to the printed digit. Same laboratory, same recipe, same time: probably one experiment printed twice,
# under two different condition statements (98 C / reflux / atmosphere not controlled here; 100 C / closed vial / air
# there). The 120-min rows carry duplicate_candidate; do not fit both as independent. Hofmann & Schieberle 2000b Fig. 1
# (glucose/Phe, squares) is a DIFFERENT series (eyeballed, not digitised: ~1.2 / ~1.5 at 120 min), not keyed here.
#
# TWO READERS (2026-10-31): first agent-hofmann2000-fig2-2000b-reader1-2026-10-31 (this file), second
# agent-hofmann2000-fig2-2000b-reader2-2026-10-31 (fit_rows/second/strecker_hofmann2000_fig2.yml, values kept as written;
# ledger id relabelled, see L); compared by scripts/reconcile_source_readings.py
# (results/validation/source_reading_reconciliation_strecker_hofmann2000_fig2.md). Before adjudication the readings agreed on
# every value (12 rows each) and differed only in the ledger id (inventory: one id per reader); after the relabel: 1 agree.
# ADJUDICATION (agent-hofmann2000-fig2-2000b-adjudicator-2026-10-31, against hofmann2000.pdf: text layer and the Fig. 2 raster).
#  (L) LEDGER ID. hofmann2000_fig2_pa_paa_glucose_phe (class sida; PA / PAA by [13C2]-SIDA, p. 435), not the combined
#      hofmann2000_fig2_fig3_glucose_phe_dicarbonyls, whose class 'calibrated' describes Fig. 3's quinoxalines; the same
#      split as Fig. 3 (hofmann2000_fig3_dicarbonyls_glucose_phe). The second reader proposed this id (its corrections item
#      3); its pot and entry were relabelled, nothing else.
#  (P) POT ID. hofmann2000_fig2_glc_phe_98c (this reader's name) is the record; the second reader's
#      hofmann2000_glc_phe_98c_timecourse_fig2 is the same pot (the tool matches pots by T, time, pH, initial amounts).
#      Rule, as strecker_hofmann2000: the first reading's names are kept, the second reading is not renamed. Not merged with
#      the Fig. 3 pot hofmann2000_glc_phe_98c_timecourse: the paper never says Figs. 2 and 3 share a run (Fig. 3 has a
#      300-min point Fig. 2 lacks).
#  (V) VALUES. All 12 within the larger read error; largest gap PA 30 min 0.494 vs 0.499 umol/mmol (0.55 px: hole centre vs
#      bbox midpoint). Re-measured on raster object 50 (bbox midpoints): 0.499 / 0.295 (30), 1.395 / 1.797 (120), 2.001 /
#      3.195 (240), 2.209 / 3.503 (500) -- the first reading's values are kept (within 0.6 px).
#  (C) CONDITIONS. Declared alike by both readers: 98 C (strecker_hofmann2000 ruling 2; alternative 99-100 C), phosphate
#      0.5 mol/L (ruling 1; the Experimental's 0.5 mmol/L a misprint), 1 + 1 mmol in 10 mL, pH 7.0 not held, air not
#      controlled, vessel / sampling not stated. Kept.
#  (D) DUPLICATE: the 120-min pair (1.399 / 1.797) equals hofmann2000b Table 2 expt II Glc/Phe (1.4 / 1.8) to the printed
#      digit. Ruled one experiment reported twice (P ~ 0.75), ORIGINAL = this figure: hofmann2000 was received 24 Aug 1999
#      and on the web 4 Jan 2000, hofmann2000b received 18 Jan 2000 and cites it for the SIDA; a time-course point is the
#      natural source of a single-time cell, not the reverse. The two condition statements are compatible except the
#      vessel: 98 C vs 100 C is one reflux (ruling 2); atmosphere uncontrolled = air; 'refluxed / heated' here vs 'closed
#      vial' there is the real difference. Coincidence (P ~ 0.25) is not excluded: run-to-run scatter at this recipe is
#      10-30 % (Table 2 vs this figure at 30 min, PA +18 %; hofmann2000b Fig. 1, ~1.2 / ~1.5 at 120 min). The 120-min rows
#      keep duplicate_candidate; for the conflicts register (and fitting.count_once) copy hofmann2000b expt II Glc/Phe ->
#      original these rows.
