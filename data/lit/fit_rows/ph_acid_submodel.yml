# KEYED FIT TABLE -- sub-model 1, pH and acid production (results/validation/kinetic_core_ph_acid_submodel_prereg.md).
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS; every row an sd as
# printed or a read_error for a digitised point). Laboratory and quantification class come from the ledger entry.
# FINAL TABLE (adjudicated 2026-10-29, agent-ph-adjudicator-2026-10-29): the UNION of the rows the first reader
# (agent-reader1-2026-10-29) and the second reader (agent-sm1-reader2-2026-10-29; data/lit/fit_rows/second/) transcribed
# from data sets that pass, each single-reader row confirmed against the paper by the adjudicator (`adjudication:`).
# Verification: data/lit/source_verification/ph_acid_submodel.yml. Reconciliation:
# results/validation/source_reading_reconciliation_ph_acid_submodel.md. Rows also carry their pot's ledger_id.
# Adjudication rules applied:
#   * no error is invented: a row carries a printed sd or a read error (rounding of a printed number counts); error
#     bars a paper does not define (Zhao 2017b, Zhang 2025) or that cannot be paired to their series (Deng 2021) are
#     recorded as `bar_half_length_*`, NOT used as sd; per-series noise (fitting.estimate_series_noise) weighs them;
#   * single error-free endpoints stay out (Chen 2000 / 2002, Xu 2008, Kang 2026, Zhai 2023, Martins 2003b's text
#     pH 5.5 drops): a series of < 3 rows gets no noise estimate;
#   * Cao 2017's x8-x24 glycine arms are out (3.2-9.6 mol/L glycine, CF-053);
#   * pots whose reactant has no engine species carry `engine_species_missing: true` (Nguyen M2 lactose, Zhang 2025
#     di-ARP, Zhao 2017b trans-2-heptenal): kept and reported, skipped by the fit;
#   * replicates are separate rows (Nguyen 2016, `replicate:`); t = 0 rows are the plotted / set pH;
#   * counted once: Martins 2003 Part II replots these Fig. 6 acids (CF-018); Davidek Table 5 = Fig. 5 / Table 4;
#     Brands Fig. 3 HPLC sum = Figs. 1-2 formic + acetic; Deng 2021 Fig. 6a pH also in trunk.yml
#     (deng2021_fig6_phosphate_100c) -- none of those copies is in this table.
# Conventions:
#   * initial_mmol_L uses engine species keys (src/kinetic_core/species.py): Glc, Fru, Gly, AMA (= DFG), PENT,
#     Cys, ARP, MARP, TTCA, LYSP.
#   * label_ph: the pH the paper sets or holds; ph_measured_at: where and when the paper's electrode read it.
#   * species "FA+AA" is the SUM of formic and acetic acid as the paper prints it (Davidek Table 5, Brands Fig. 3);
#     "TA_to_pH8.3" titratable acid (Brands); "NaOH_uptake" base added by the pH-stat (Davidek Table 5).
#   * `printed` records the value as the source prints it, before any unit conversion.
#   * Martins 2005 glucose + glycine formic / acetic acid (80 / 100 / 120 C; B1's fit data) added 2026-10-29 after two
#     readings (data/lit/fit_rows/ph_acid_martins2005.yml, second/; reconciliation
#     results/validation/source_reading_reconciliation_ph_acid_martins2005.md): the rival arms for k_aa_frag are
#     judged on the data it was fitted to (prereg sec. 4a).
