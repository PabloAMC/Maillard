# KEYED TEST TABLE -- Zhao J, Wang T, Xie J, Xiao Q, Cheng J, Chen F, Wang S & Sun B 2019, Food Chem 270:436-444 (Beijing Technology and
# Business University, Xie J): GSH 0.3 mmol + glucose 0.3 mmol in 5 mL phosphate pH 6.5, 140 C / 5 h, with or without 53.0 mg chicken fat
# or oxidised chicken fat. Table 1 (p. 438): relative peak areas of 53 volatiles, systems a / b / c. Table 2 (p. 441): CAMOLA isotopomer
# distributions with 1:1 [13C6]/[12C6]-glucose. Two keying units (queue ranks 6 and 11), one paper, one table file.
# PURPOSE: TEST data. Table 1 -> E7 ('lipid lane inert to Maillard odorants'): MFT 0.52 -> 0.32 -> 0.18, FFT 0.88 -> 0.63 -> 0.27 and the
# thiophenes with fat / oxidised fat vs none (BTBU is a new TEST lab for E7). Table 2 -> E6 / E11 ('MFT via free norfuraneol' route share;
# 'one formation barrier for every sulfur route'): MFT 50 : 47 (M+0 : M+5), FFT 52 : 47; only 2-ethylthiophene carries fat arms
# (52 -> 59 -> 75 % unlabelled). BTBU is DEV for E1 (the E6 + E11 prereg scores Zhao 2019b under E1: a scorer must say which).
# NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS; Table 2's composition rows are not concentrations); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entries: zhao2019b_table1_gsh_glucose_fat_volatiles (sulfur.yml; Table 1 pots) and
# zhao2019b_table2_camola_glucose_labelling (sulfur.yml; Table 2 pots). The lipid ledger's zhao2019b_tab1_gsh_glc_fat_oxidised_fat_volatiles
# and zhao2019b_tab2_camola_fat_systems are the SAME tables; nothing is keyed under them here.
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_zhao2019b_tab1_2.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: table cells, value = the printed cell. Table 1: A and B agree on all 159 cells (value, SD; 35 '-' cells); Duncan letters
# from reader B. Table 2: A and B agree on all 28 printed distributions cell by cell. Read error: Table 1 half the last printed digit
# (0.005) in dex, with the printed SD (n = 3); Table 2 half the last digit (0.5 %) in PERCENTAGE POINTS (a composition, not dex).
# RESOLUTIONS: (1) Table 2's system. Only no. 15 (2-ethylthiophene) prints a / b / c (footnotes); for the other 25 compounds the text
# (p. 440) says the patterns were 'unchanged, except for the 2-ethylthiophene' with fat or oxidised fat: those rows sit in the control pot
# (a) with system_basis saying they stand for a, b and c (reader A: 'unstated'; reader B: 'a'; P control-only ~0.6 by A). (2) Cell counts:
# nos. 11, 17, 18, 26 print one cell fewer than the carbon count needs (last column blank in print): kept, flagged; no. 11 sums to 96 %.
# (3) Table 1: the IS (1,2-dichlorobenzene, 60 ng) is injected with the fibre at the inlet, so relative areas carry no SPME partition
# correction; fat (1 % w/w) changes headspace partitioning in b / c: between-arm ratios carry that confound. Thiophene, thiazole and
# 3-mercapto-2-pentanone are GC-O-only ('-' in every arm). Buffer molarity not printed. No row dropped.
# NOT ROWS: '-' cells (Table 1; not_detected per pot) and '<1' cells (Table 2; below_1_percent per pot, as KEY:M+n).
status: ready   # two readers + adjudication (2026-11-01); TEST data, never a fit input: fit_rows.load refuses every row (units outside fit_rows.UNITS)
purpose: 'TEST data for the contrast benchmark: Table 1 for engine error E7 (lipid lane inert to Maillard odorants; keying_queue.yml rank 11), Table 2 for E6 / E11 (route share; rank 6; existing TEST contrasts F23#7, F24#4, F25#23); never a fit input'
