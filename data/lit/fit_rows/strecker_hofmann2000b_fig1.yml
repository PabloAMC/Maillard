# KEYED FIT TABLE -- Strecker degradation: Hofmann & Schieberle 2000b (J Agric Food Chem 48:4301-4305, DFA Garching;
# doi 10.1021/jf000076e), Fig. 1 (p. 4303): phenylacetaldehyde (PHEAL) and phenylacetic acid (PHEAC), 0 - 500 min, from
# glucose + L-phenylalanine (squares) and from N-(1-deoxy-D-fructosyl)-L-phenylalanine (ARP-Phe, PHEARP; circles).
# Companion of strecker_hofmann2000b.yml (Tables 2-3) and strecker_hofmann2000_fig2.yml; it follows their conventions.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS). Laboratory and
# quantification class from the ledger entry hofmann2000b_fig1_pa_paa_timecourse (data/lit/measurement_ledger/trunk.yml;
# sida: [13C2]-PA / [13C2]-PAA, HRGC/MS-CI, p. 4302).
# PURPOSE: the BLIND test pre-declared in results/validation/kinetic_core_strecker_forced_input_prereg.md sec. 12 (keyed
# after that declaration, before any model value was computed on it).
#
# READERS (2026-10-31), independent and blind to the hypothesis: reader A (agent-hofmann2000b-fig1-readerA-2026-10-31;
# raster pdfimages page 3 object 21, 1390 x 889 px, 300 ppi; crops upscaled with sips, edges read by eye) and reader B
# (agent-hofmann2000b-fig1-readerB-2026-10-31; same raster, 8-10x crops). Their raw files: the coordinator's scratchpad
# (fig1_reader_A.yml, fig1_reader_B.yml); B's rows as written: fit_rows/second/strecker_hofmann2000b_fig1.yml.
# EXPOSURE (recorded): both readers could see the rough, eyeballed Fig. 1 notes in the text_checks of
# fit_rows/second/strecker_hofmann2000_fig2.yml (PA ~0.6 / 1.2 / 2.1 / 2.8, PAA ~0.5 / 1.5 / 2.8 / 3.7 at 60 / 120 / 240 /
# 500 min) before they digitised. The 10- and 30-min points carry no such prior.
# Calibration: y ticks 0-12 at ~61.67 px per umol/mmol (A: twelve ticks, max residual ~0.35 px; B: four ticks, equal
# spacing); x 3.127 px/min, markers snapped to 10 / 30 / 60 / 120 / 240 / 300 / 500 min (axis break after ~320 min).
# The origin (all four curves start at 0; one filled square visible there) is not keyed (strecker_hofmann2000_fig2
# convention).
#
# ADJUDICATION (agent-strecker-feasibility-2026-10-31, on the coordinator's rule, without re-reading the raster):
# value = mean(A, B); read error = max(A's error, B's error, |A - B| / 2) in umol/mmol, then in dex
# (log10(e) x error / value). A and B agree within 0.011 umol/mmol everywhere (largest gap: ARP-Phe PA 60 min, 4.210 vs
# 4.200). The two Glc/Phe 10-min squares are AMBIGUOUS for both readers: hidden in one cluster with the ARP-Phe filled
# circle, read from curve continuity (PA 0.205 / 0.21, +-0.05 / 0.06; PAA 0.105 / 0.10, +-0.025 / 0.03): 0.126 / 0.127 dex.
# The sec. 12 resolution rule (6) drops them from the blind score; they stay as rows with their errors.
#
# UNITS. y 'Amount [umol/mmol starting material]' = per mmol glucose (and Phe, 1:1) for Glc/Phe, per mmol ARP-Phe for
# ARP-Phe (the readers' reading; 'starting material' is undefined). At 1 mmol in 10 mL, 1 umol/mmol = 0.1 mmol/L.
# CONDITIONS: NONE are printed for Fig. 1 (caption and text). INFERRED, both readers alike: the text introducing Fig. 1
# ('In further experiments ... in both reaction systems') follows Table 1 ('under the same conditions', column II), so
# 1.0 mmol glucose + 1.0 mmol L-Phe (or 1.0 mmol ARP-Phe) in 10 mL phosphate pH 7.0, 0.5 mol/L, REFLUXED (~100 C), air
# presumed (no argon treatment named; open reflux). The Methods print '0.1 mmol each ... 1 mL ... 0.5 mmol/L': the same
# 100 mmol/L; '0.5 mmol/L' vs every table footnote's '0.5 mol/L' is the misprint ruled in strecker_hofmann2000 ruling 1.
# ARP-Phe purity 'about 90 %' (strecker_hofmann2000b.yml (5)). Vessel / sampling (one pot or one vessel per time): not stated.
# CHECKS AGAINST THE PAPER'S OWN NUMBERS (text_check, no rows):
#  * p. 4302 'ARP-Phe preferentially gave the aldehyde independently from the reaction time': PA > PAA at every time.
#  * p. 4302 Glc/Phe 'formation of PA ... favored only within the first 60 min': PA > PAA at 10 / 30 / 60 min, crossover
#    between 60 and 120 min (~89 min, log-interpolated): consistent.
#  * p. 4302 'by a factor of 1.7 higher amounts of the acid were formed after 500 min': the figure gives PAA / PA =
#    3.709 / 2.804 = 1.32 at 500 min (1.33 at 240, 1.24 at 300). CONTRADICTION (CF-075): the figure is kept.
#  * Table 2 expt II (air, 100 C, 120 min, closed vial): ARP-Phe 5.5 / 3.0, Glc/Phe 1.4 / 1.8 umol/mmol vs the figure at
#    120 min 6.21 / 3.21 and 1.21 / 1.52: same order, 7 - 16 % apart (outside the read error): a DIFFERENT run (CF-075);
#    the Glc/Phe Table 2 cell is itself the hofmann2000 Fig. 2 120-min point (CF-074). Not a duplicate; count both, never
#    as the same measurement.
#  * hofmann2000 Fig. 2 (same recipe, 98 C): PA 0.90 / 1.40 / 2.00 / 2.20, PAA 0.79 / 1.80 / 3.20 / 3.50 at 60 / 120 /
#    240 / 500 min vs this figure 0.61 / 1.21 / 2.11 / 2.80, 0.50 / 1.52 / 2.81 / 3.71: two runs, 10 - 40 % apart.
# Plotting: all non-hidden points lie within ~0.01 - 0.02 of a 0.1 grid (both readers): plotted from rounded values;
# the read error does not cover that rounding (+-0.05).
