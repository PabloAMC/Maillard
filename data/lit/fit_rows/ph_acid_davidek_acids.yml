# KEYED FIT TABLE -- sub-model 1 (pH and acid production): MEASURED acetic / formic acid (and the sugar consumed) in
# Nestle (Davidek / Blank) aqueous phosphate systems, for the missing pentose -> acetic / formic acid route.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS). Laboratory and
# quantification class from the ledger entries (data/lit/measurement_ledger/trunk.yml, davidek2008_* / davidek2006a_* /
# davidek2006b_*): SIDA ([2H3]acetic acid, SPME or ether extract GC-MS) for acetic acid.
# DRAFT, FIRST READER (agent-davidek-reader1-2026-10-30), read from the PDFs in data/articles (davidek2008.pdf,
# davidek2006.pdf, davidek2006b.pdf, novotny2008.pdf); no dossier used. Verification:
# data/lit/source_verification/ph_acid_davidek_acids.yml.
#
# UNITS. Every source prints yields relative to the precursor (mol%, mol/mol, % residual). value (mmol/L) = printed
# fraction x the precursor's initial mmol/L, so value / precursor0 is the printed number exactly:
#   * Davidek 2008 Fig. 1: xylose 0.1 mol/L (0.35 mmol in 3.5 mL; Results: "(0.1 mol/L)") -> 1 mol% acetic acid =
#     1 % residual xylose = 1.00 mmol/L. Unambiguous.
#   * Davidek 2006a Table 1 (glucose 0.1 M), 3-DG text (0.05 mmol in 0.5 mL = 0.1 M), Fig. 5 (pentanediones 0.5 mmol
#     in 5 mL = 0.1 M): 1 mol% = 1.00 mmol/L. Fig. 3 (1-DG, no amine): mol/mol x 10 mmol/L NOMINAL 1-DG (0.1 mmol in
#     2 mL, diluted 5x; deprotection yield / resin losses not reported): a declared common scale, as hofmann1999.
#   * Davidek 2006b Table 1 prints mmol/L directly.
# ERRORS. Printed +- is kept as `sd` (undefined in the papers: "prepared at least in duplicate and injected twice");
# digitised points carry `read_error` (dex) only; text values carry half the last printed digit. Every paper states
# GC-MS CV < 10 % (Davidek 2006a/b), not used as a row error.
# ND / ZEROS. Davidek 2006a Table 1 "ND" = NOT DETERMINED (footnote b), not "not detected": no row. Davidek 2008
# Fig. 1 pH 8.0 residual xylose at 60, 120, 240 min sits on the x-axis (60 min printed "0"): left out (no log
# residual). t = 0 markers (acids 0, xylose 100 % by construction) left out.
# DUPLICATES (counted once): Davidek 2008 text/abstract "16 mol% and 28 mol%" (pH 6.0 / 8.0, 120 C, after 4 h) are the
# Fig. 1 240-min markers (end labels 16 / 28; digitised 16.15 / 27.60). Davidek 2006a text "about 1, 17 and 38 mol %"
# after 4 h = Table 1 240-min cells; abstract "85 mol %" = Fig. 3 end labels (0.84). Davidek 2006b "about 32 mol %" /
# "30-33 mol %" = its Table 1.
# NOT KEYED: Davidek 2008 90 C / 15 h runs (Methods; Fig. 4 legend says 16 h): only 13C-label shares printed, no
# amounts. Davidek 2006a: DFG (Amadori) "about 4, 28 and 56 mol %" at pH 4 / 6 / 8 after 4 h at 120 C -- no method,
# concentration or amine stated for that run (not simulable as printed; adjudicator's call); Table 2 / Fig. 3-4 of
# 2008 = isotopomer shares (see verification notes); Fig. 5 acetone / propanoic acid (open markers; no engine species).
# Davidek 2006b: aldonic acids (~0.7 / 2.2 / 5.1 mmol/L, no engine species), 17O / 18O NMR / MS runs at pH 10 (NaOH,
# unbuffered). Novotny 2008: no near-neutral condition (persulfate oxidant or 0.05-0.3 M NaOH, reflux 1 h, no amine).
# Pots marked engine_species_missing (2,3- / 2,4-pentanedione) are verified data for later, NOT fit rows today.
# ADJUDICATION (2026-10-30): Davidek 2006a Fig. 3 (1-deoxyglucosone, no amine; its pH 6.5 / 7 markers overlap and
# the two readers assigned them differently, |diff| <= 0.44 mmol/L; the precursor concentration is not printed, so
# the rows rest on a nominal 10 mmol/L) and Fig. 5 (2,3- / 2,4-pentanedione + glycine: no engine species) are
# dropped from the verified table; both readings remain in git history (commit of 2026-10-30).
# ADJUDICATION NOTES (2026-10-30, both readers): (1) Davidek 2008 never says how residual xylose was measured: the
# PENT rows carry no stated quantification class beyond the paper's; read them as the paper's, not as SIDA.
# (2) The 16 / 28 mol% of the abstract are Fig. 1's 240-min points (counted once). (3) The papers' +- is undefined;
# kept as sd. (4) Davidek 2006a Table 1 prints a 480-min pH 4 value although Methods say 4 h; kept as printed.
# (5) Formic acid (3-DG text) was quantified against [2H3]acetic acid: semi-quantitative, not isotope dilution.
# (6) Novotny 2008: every condition is persulfate or 0.05 - 0.3 M NaOH without amine: notes only, no rows.
status: ready   # two readers agree (2026-10-30): Davidek 2008 Fig. 1, Davidek 2006a Table 1 and 3-DG text, Davidek 2006b Table 1
