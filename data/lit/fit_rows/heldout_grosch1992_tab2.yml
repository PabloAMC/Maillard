# KEYED TEST TABLE -- Grosch W & Zeiler-Hilgart G 1992, ACS Symp Ser 490 (Flavor Precursors) 183-192 (Deutsche Forschungsanstalt fuer
# Lebensmittelchemie, Garching), Table II 'Thiamine as Precursor' (p. 185): MFT, FFT and bis(2-methyl-3-furyl) disulfide by SIDA after 2 h
# reflux of thiamine / thiamine pyrophosphate with or without ribose, cysteine and GSH in 0.2 M pyrophosphate pH 5.7 (eight systems).
# PURPOSE: TEST data for conflict CF-089 ('effect of cysteine on thermal thiamine degradation and so on thiamine-derived MFT / H2S') and
# engine error E18 ('3-mercapto-2-pentanone only from thiamine; thiamine pH'); contrasts no. 4 vs 1 (cysteine x7 on MFT), no. 6 vs 4
# (ribose lowers it 33 -> 19 ug), no. 8 vs 4 (GSH + cysteine + ribose: 27 %), no. 7 vs 6 (GSH vs cysteine). NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS; the laboratory string 'DFA Garching (Grosch)' is in no group of data/keys/laboratories.yml); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: grosch1992_tab2_mft_fft_disulfide_thiamine_cysteine_ribose_gsh_systems
# (data/lit/measurement_ledger/sulfur.yml); quantification SIDA (d-MF-SH, d-FF-SH, d-MF-S2).
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_grosch1992_tab2.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: table cells, value = the printed cell. A and B agree on all 24 cells (values, SDs, N, every '<x', 'n.a.', 'n.d.').
# Read error = half the last printed digit in dex; each row carries the printed SD and N (trials).
# RESOLUTIONS (re-read in the PDF text layer, p. 184-185): reactant amounts (footnote a) 30 umol thiamine.HCl (10.2 mg) or thiamine
# pyrophosphate (13.9 mg), 670 umol ribose (100 mg), 325 umol cysteine.HCl (57 mg), 230 umol GSH (71 mg); the masses and moles agree to
# 1 % for every reactant; in 500 mL: 0.060 / 1.34 / 0.65 / 0.46 mM. Temperature not printed ('refluxed for 2 h': ~100 C, open, air).
# Arms 6 and 7 differ in thiol identity AND amount (325 vs 230 umol). TEXT CHECKS (consistent): no. 1 = 41 nmol MFT and 17 nmol FFT from
# 30 umol thiamine; cysteine 'increased 7-fold' (33 / 4.7); ribose lowered MFT 'from 33 to 19 ug'; no. 8 'only 27 %' of no. 4.
# NOT ROWS: '<x' cells (detection limits that vary by row; listed per pot under upper_limits_ug), 'n.a.' (no. 3 MF-S2, not analysed) and
# 'n.d.' (no. 4 MF-S2, not detectable, no limit). Table III (cysteine dose x thiamine) and Table IV (0.1 vs 0.2 M pyrophosphate) share the
# design and are not keyed; Table III's 325 umol / 30 umol cell (19 ug) is this table's no. 6 (same pot, count once). No row dropped.
# NEW SPECIES KEYS: TPP thiamine pyrophosphate. Engine keys: MFT, FFT, MFTD, THI, PENT, Cys, GSH.
