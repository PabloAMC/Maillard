# KEYED TEST TABLE -- Xu H, Gao Y, Liu X & Zhao J 2008 (online 1 Oct 2007), J Sci Food Agric 88:328-335 (China Agricultural University,
# Gao Y), Table 1 (pp. 332-333): headspace volatiles of D-ribose + L-cysteine (50 + 50 mM) in 0.2 M pyrophosphate at initial pH 5.6 / 7.0 /
# 8.0, 140 C / 1 h, CONTROL columns (no supercritical CO2).
# PURPOSE: TEST data for engine error E8 ('FFT / furfural supply pH law too steep'): FFT 22.09 -> nd -> nd, furfural 3.19 -> 1.74 -> nd,
# MFT 16.62 -> 2.63 -> nd ng/mL from pH 5.6 to 8.0, against the measured final pH (5.5 / 6.2 / 6.8). China Agricultural University
# (Gao Y) is a new TEST lab for E8 (E8 has none today). NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: xu2007_table1_ph_axis_volatiles (sulfur.yml); quantification semi-quantitative
# (HS-SPME of 1 mL mixture, tridecane IS, RF = 1: between-arm ratios only).
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_xu2007_tab1.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# SCOPE: reader A keyed the thiols, MFT / FFT disulfides, furans and carbonyls, mercaptoketones, pyrazines and thiazoles (34 compounds) in
# all six columns; reader B keyed all 72 compounds in the three control columns. Rows = what both read: the 34 compounds x 3 control
# columns (102 cells, 65 numeric). NOT ROWS (single reader): the SC-CO2 columns (A only; a 40 MPa CO2 factor outside the pH-axis unit)
# and the 38 thiophenes / thiophenones / polysulfur heterocycles (B only).
# ADJUDICATION: table cells, value = the printed cell; A and B agree on all 102 cells (values and '-' / 'tr' / '+'). Read error = half
# the last printed digit in dex (mean CV < 20 %, max 47 %; no SD printed).
# RESOLUTIONS (re-read in the PDF text layer, p. 329): (1) The buffer is PYROPHOSPHATE: '0.2 mol L-1 phosphate buffer' is prepared 'by
# mixing ... 0.2 mol L-1 sodium pyrophosphate dibasic and 0.2 mol L-1 sodium pyrophosphate tetrabasic', and the pH is re-set with
# tetrasodium pyrophosphate (both readers; resolved). (2) Reactant amounts: 7.5064 g ribose or 6.0576 g cysteine per 500 mL = 0.1 M;
# 50 + 50 mL mixed (footnote b: 5 + 5 mmol in 100 mL) = 50 + 50 mM. (3) Final pH printed per column (5.5 / 6.2 / 6.8 control): the pH 7
# and 8 arms drift 0.8 and 1.2 units; label_ph is the initial pH, ph_final_measured the printed final. (4) The control ran in the same
# 300 mL vessel without CO2 (headspace gas not stated). DUPLICATES: the queue notes that the pH 5.6 columns duplicate Xu 2008
# (xu2008_table1_ph_norfuraneol_ratio_series): count once if both are scored (not checked here). No row dropped.
# NOT ROWS: '-' (below detection, ~0.07 ng/mL), 'tr' (< 0.3 ng/mL) and '+' (present, peak confounded) cells, listed per pot.
status: ready   # two readers + adjudication (2026-11-01); TEST data, never a fit input: fit_rows.load refuses every row (units outside fit_rows.UNITS)
