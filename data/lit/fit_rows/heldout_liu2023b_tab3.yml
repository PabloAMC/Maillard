# KEYED TEST TABLE -- Liu H, Nie R, Wei X, Shi H, Yu Y, Gao R, Zhou Y, Wang Z & Zhang D 2023, LWT 182:114874 (CAAS Institute of Food Science
# and Technology, Beijing; Zhang D), Table 3 (p. 5): isotopologue distributions of ten furans / thiophenes / thiols from 1:1
# [13C5]/[12C5]-D-ribose + L-cysteine at 168 C for 20, 40 and 60 min (CAMOLA).
# PURPOSE: TEST data for engine errors E6 ('MFT via free norfuraneol', route share) and E11 ('one formation barrier for every sulfur
# route'): MFT 41 / 3 / 2 / 1 / 12 / 40 % (M+0 ... M+5) at 20 min; norfuraneol 43 : 48; FFT 44 : 45. CAAS is already a TEST lab for E6 /
# E11. CF-086 (adjudicated 2026-11-01): the Methods' [M-1]+/[M]+ adjustment did not reach the labelled MFT ion, so the MFT fragment share
# is ~6 %, not 19 % (P 0.9): a scorer must apply it. NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS; the rows are compositions); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: liu2023b_carbon_module_labelling (sulfur.yml).
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_liu2023b_tab3.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: table cells, value = the printed cell. A and B agree on all 30 printed distributions (210 cells; furan at 20 min not
# detected). Read error = half the last printed digit (0.5 %) in PERCENTAGE POINTS (a composition, not dex); printed 0 cells are rows.
# RESOLUTIONS (re-read in the PDF text layer, pp. 3-5): (1) Table 3 EXISTS (p. 5); the queue's 'text_only' status was wrong (both
# readers). (2) Buffer naming: printed 'potassium phosphate tribasic buffer (0.5 mol/L)' with 'pH (5.88)'; a 0.5 M K3PO4 solution sits
# near pH 13, so pH 5.88 needs a mostly monobasic phosphate: the species is unresolved; molarity and pH kept as printed, the pot says
# so. (3) Reactant amounts: NOT printed ('prepared with a weight ratio of 10.10', read as 10:10 = 1:1 w/w, P ~0.6); no amounts, volume
# or vial size: initial_mmol_L null. TEXT CHECKS (consistent): MFT unlabelled and fully labelled 'both 38-43 %'; furfural [M]+ 37-42 %,
# [M+5]+ 21-25 %, [M+4]+ 23-24 %; FFT partly labelled 'less than 11 %' (3 + 3 + 1 + 4 = 11, borderline). No row dropped.
# NEW SPECIES KEYS: V_ACETALDEHYDE, V_2_MERCAPTOETHANOL, V_FURAN, V_2_METHYLFURAN, V_3_THIOPHENETHIOL, V_5_METHYL_2_THIOPHENECARBOXALDEHYDE.
