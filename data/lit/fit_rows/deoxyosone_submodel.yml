# KEYED FIT TABLE -- sub-model 3, the deoxyosones and their fates (results/validation/kinetic_core_deoxyosone_submodel_prereg.md).
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS; every row an sd as
# printed or a read_error for a digitised point). Laboratory and quantification class come from the ledger entry.
# First reader: agent-sm3-reader1-2026-10-29, against the PDFs (data/articles/), not the dossiers; second reader pending
# (data/lit/source_verification/deoxyosone_submodel.yml). Rows also carry their pot's ledger_id (redundant, for grep).
# Conventions:
#   * initial_mmol_L and species use engine keys (src/kinetic_core/species.py, species_sulfur.py): PENT (xylose /
#     ribose), Cys, Gly, TTCA, CAMA, ARP (= the alanine-xylose Amadori compound of species_sulfur), NF, and the measured
#     species DPO (1-deoxypentosone, 1-DX), TDP (3-deoxypentosone, 3-DX), FUR (furfural), NF (norfuraneol), MGO, GO.
#     GO is a trunk-only key (species.TRUNK_ONLY_KEYS): the sulfur lane's state vector does not carry it.
#   * label_ph: the pH the paper sets or holds; ph_measured_at: where and when the paper's electrode read it.
#   * read_error is in dex (log10 units), as fit_rows._sigma adds it; read_error_basis gives it in the figure's units.
#   * `printed` records the value as the source prints it, before any unit conversion.
status: draft   # first reader done for the sources below; second reader pending (fit_rows.load refuses a draft)
