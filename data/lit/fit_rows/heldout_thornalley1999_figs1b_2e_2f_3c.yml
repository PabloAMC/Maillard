# KEYED TEST TABLE -- Thornalley PJ, Langborg A & Minhas HS 1999, Biochem J 344:109-116 (University of Essex), the phosphate series:
# initial rates (first 2 days) of glyoxal, methylglyoxal and 3-DG formation at 37 C, pH 7.4, in 10 / 25 / 50 / 100 mM sodium phosphate,
# from glucose 50 mM (Fig. 1b), glucose + N-alpha-t-BOC-lysine (Fig. 2e), glucose + HSA 50 mg/mL (Fig. 2f) and fructosyl-lysine 0.5 mM
# (Fig. 3c); the 100 mM rates printed in the text (pp. 111, 113, 114).
# PURPOSE: TEST data for engine error E5 ('no buffer-species catalysis'): the phosphate dose law of dicarbonyl formation (glyoxal most
# phosphate-dependent). Essex is already a TEST lab for E5 (no new lab). Phosphate co-varies with its trace metals (the series is not
# crossed with DETAPAC): a scorer must say so. NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: thornalley1999_figs1b_2e_2f_3c_phosphate_series_initial_rates (trunk.yml);
# quantification calibrated (DDB derivatisation, HPLC; recoveries 52 / 70 / 59 %). Rows are RATES: t_min 0, unit uM_per_day.
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_thornalley1999_figs1b_2e_2f_3c.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: figure points, value = mean of A and B, read error = max(A, B, |A-B|/2) in uM/day, in dex; A and B agree within error on
# all 48 points. Text rates: printed numbers, half the last digit, with the printed SD (n = 3).
# RESOLUTIONS (text re-read in the PDF, pp. 111-114):
#  (1) Fig. 2e symbols. By the legend convention (circle glyoxal, square 3-DG, triangle MG; Figs. 1a / 2a / 3b) the 100 mM points read
#      3-DG 3.22 and MG 2.62, but the text gives MG 3.13 +- 0.15 and 3-DG 2.62 +- 0.62, the Fig. 2g bars agree with the text, and the text's
#      own fold changes vs glucose alone ('5-fold, 32-fold and 6-fold' for glyoxal, MG, 3-DG: 8.09 / 1.72, 3.13 / 0.098, 2.62 / 0.437)
#      confirm it. RESOLVED: in Fig. 2e the square is MG and the triangle 3-DG (P ~0.85); all four Fig. 2e points of each are re-assigned
#      (rows say so). B's second copy carries the same re-assignment.
#  (2) Fig. 1b vs text. MG at 100 mM plots at ~0.235 (A 0.24, B 0.23) against the text's 0.098 +- 0.003 and the Fig. 1c bar (~0.10): the
#      text and Fig. 1c agree, so the figure point is NOT used (dropped below); the text row stands at 100 mM. 3-DG 100 mM plots 0.485 vs
#      text 0.437 (within 0.05 dex); kept as the text value.
#  (3) Count once: at 100 mM the text rate and the figure point are the same measurement; where the text prints a rate (glucose, BOC-Lys,
#      fructosyl-lysine) the text row REPLACES the figure point (rows say so). Text values keyed by reader A; reader B wrote five of them
#      (3-DG and MG of glucose, 3-DG of fructosyl-lysine, 3-DG and MG of BOC-Lys) in its notes; the other four (glyoxal x 3, MG of
#      fructosyl-lysine) were re-read by the adjudicator in the PDF and agree with B's figure points within error.
#  (4) Fig. 2f (HSA) 3-DG at 100 mM reads 1.22 vs the Fig. 2h bar ~1.04 (both readers): kept, flagged (no text value).
# DROPPED: Fig. 1b methylglyoxal 100 mM figure point (conflict (2)). TEXT CHECKS (not rows): fructosamine loss 37.5 +- 10.8 uM/day
# (fructosyl-lysine); fructosamine formation 116 +- 4 uM/day (glucose + BOC-Lys); 3-DG 50 uM -> MG 0.09 +- 0.03 uM in 2 days.
# NEW SPECIES KEYS: V_BOC_LYSINE N-alpha-t-BOC-lysine, V_FRUCTOSYL_LYSINE free fructosyl-lysine. Engine keys: GO, MGO, TDG, Glc.
