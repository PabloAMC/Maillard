# KEYED FIT TABLE -- sub-model 2, the cysteine-pentose route (results/validation/kinetic_core_route_submodel_prereg.md).
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS; every row an sd as
# printed or a read_error for a digitised point). Laboratory and quantification class come from the ledger entry.
# First reader: agent-sm2-reader1-2026-10-29, against the PDFs (data/articles/), not the dossiers; second reader
# pending (data/lit/source_verification/route_submodel.yml). Rows also carry their pot's ledger_id (redundant, for grep).
# Conventions:
#   * initial_mmol_L uses engine species keys (src/kinetic_core/species_sulfur.py): TTCA, CAMA (cysteine Amadori
#     compound of the pentose), Cys, PENT (xylose), DPO (1-deoxypentosone = 1-DX), TDP (3-deoxypentosone = 3-DX).
#   * label_ph: the pH the paper sets; ph_measured_at: where and when the paper's electrode read it.
#   * sd: the printed SD (a drawn error bar read from the figure's vector paths is a printed SD); read_error: the
#     digitisation error in dex (log10(e) x absolute / value), its absolute value in read_error_basis.
#   * `printed` records the value as the source prints it, before unit conversion.
#   * A pot carries ONE ledger id; one heated system whose species sit in two ledger entries (two figures) appears as
#     two pot ids with identical conditions (named *_fig4 / *_fig5 etc.).
#   * t = 0 points that are the charge (or a plotted 0) are the pot's initial state, not rows (a measured 0 has no
#     log residual).
status: draft   # first reader done for the sources below; second reader pending (fit_rows.load refuses a draft)
