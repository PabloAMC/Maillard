# KEYED TEST TABLE -- Du W, Wang Y, Yan Q, Bai S, Huang Y, Li L, Mu Y, Shakoor A, Fan B & Wang F 2023, Food Res Int 173:113337 (CAAS
# Institute of Food Science and Technology, Beijing), Table 2 (p. 7): CAMOLA isotopomer distributions of volatiles from L-cysteine 1 mmol +
# 1:1 [13C6]/[12C6]-D-glucose 1 mmol + one C9 aldehyde 0.05 mmol (A nonanal, B (E)-2-nonenal, C (E,E)-2,4-nonadienal, D (E,Z)-2,6-nonadienal)
# in 5 mL 0.2 M phosphate pH 6.50, 150 C / 120 min.
# PURPOSE: TEST data for engine errors E6 / E11 (route share; lipid carbon in thiophenes): MFT A 52 : 48, B 57 : 43 (M+0 : M+5); 2-pentyl-
# thiophene 92 % unlabelled (C); 2-heptylthiophene 16 % M+2 (A). CAAS is already a TEST lab for E6 / E11. Du 2023 is dropped under the
# 'calibration_broad' alternative (HEXOSE_C5_ENTRY documentation): a scorer must say which split it uses.
# NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS; the rows are compositions); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: du2023_table2_camola_isotopomers (sulfur.yml); lipid.yml's du2023_tab2_camola_lipid_
# carbon_share is the SAME table (nothing keyed under it here).
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_du2023_tab2.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: table cells, value = the printed cell. A and B agree on all 59 printed rows cell by cell. Read error = half the last
# printed digit (0.5 %) in PERCENTAGE POINTS (a composition, not dex).
# RESOLUTIONS (re-read in the PDF text layer, Tables 1 and 2, Sec. 2.2 / 2.6):
#  (1) Missing control M. Sec. 2.2 / 2.6 run five systems (M = cysteine + glucose, no aldehyde) with the 1:1 glucose, but Table 2 prints
#      only A - D (Table 1 prints M's concentrations). UNRESOLVABLE from the paper: there is no in-paper no-aldehyde CAMOLA baseline; a
#      lipid-carbon share must be read against the 50 : 50 expectation of an intact glucose skeleton (e.g. MFT: A 52, B 57 % unlabelled).
#  (2) Duplicate no. 34 (2-thiophenecarboxaldehyde). Printed twice: a D row out of order between nos. 23 and 26 (25 / 32 / <1 / <1 / 16 /
#      27) and an A row after no. 32 (99 / 1 / <1 ...). Table 1 prints no. 34 in M (16.96) and A (3.04 ug/L) only, NOT in D: the A row
#      is consistent and kept; the D row's compound or system cannot be resolved: DROPPED.
#  (3) No. 26 (1-(2-thienyl)ethanone), next to the misplaced row: system C conflicts with Table 1 (not detected in C) and system D prints
#      only six cells summing to 47 %: both DROPPED; A and B (consistent with Table 1, sums 99-100 %) kept and flagged.
#  (4) No. 47 system A sums to 109 % (37 + 15 + 37 + 20): a misprinted cell, which one unknown: DROPPED (B and D kept).
#  (5) No. 12 prints ten cells for a C8 compound (extra cells '<1'): kept, flagged. Heating time: 'stirred at 150 C in an oil bath
#      followed by analysis of the volatile components for 120 min' read as 120 min heating, as the ledger (ambiguous).
# DROPPED (4 rows): no. 34 D, no. 26 C, no. 26 D, no. 47 A (reasons above). NOT ROWS: '<1' cells (below_1_percent per pot).
status: ready   # two readers + adjudication (2026-11-01); TEST data, never a fit input: fit_rows.load refuses every row (units outside fit_rows.UNITS)
