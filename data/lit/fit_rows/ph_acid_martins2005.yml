# ADJUDICATED 2026-10-29 (lead): the readers agree on every acid value (replicates paired in sorted order). Fig. 1c's
# pH is counted once: it is the series already in ph_acid_submodel.yml as martins2005b_ph68 (same laboratory, recipe
# and time grid; the means agree within 0.04 pH at all ten shared times, the read resolution). Reader 1 entered it
# (~75 % that it is a separate run set), reader 2 did not; a likely duplicate would double its weight, dropping it
# loses nothing the table lacks. The two 100 C pots stay apart: their acetic acid differs 15-30 % (same recipe), a
# between-run-set spread both readers measured.
# KEYED FIT TABLE -- sub-model 1 (pH and acid production): Martins & van Boekel 2005, Food Chem 90:257
# (doi 10.1016/j.foodchem.2004.04.006), ledger martins2005_glc_gly_multiresponse_timecourses.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS). Laboratory and
# quantification class come from the ledger entry (calibrated: HPLC ION-300, UV 210 nm, external standards, method of
# Martins, Marcelis & van Boekel 2003a = data/articles/martins2003b.pdf sec. 2.7).
# DRAFT, FIRST READER (agent-m2005-reader1-2026-10-29), read from data/articles/martins2005.pdf (the journal paper; its
# figures are vector graphics, read from the content stream via pdftocairo -svg, axes calibrated on their tick paths).
# data/articles/martins2003.pdf is NOT the thesis: it is Martins & van Boekel 2003, Carbohydr Res 338:1665 (DFG Part II);
# the thesis (Figs. 5.9 / 5.10) is not on disk and was not read.
# Verification: data/lit/source_verification/ph_acid_martins2005.yml.
#
# WHAT THE PAPER PRINTS (formic acid FA, acetic acid AA, pH; glucose, DFG, deoxyosones, melanoidins not transcribed):
#   * Fig. 8d: FA (x) and AA (filled diamond), every replicate, at 80 C (0-180 min), 100 C (0-120 min), 120 C (0-30 min);
#     three markers per time point (triplicates), temperatures told apart by the panel's time span and line style;
#   * Figs. 6c and 7c: the same 100 C replicates (0-150 min); this table takes 100 C from Fig. 7c (it adds 150 min) and
#     uses Figs. 6c / 8d as a check: replicate values agree within one coordinate quantum (median |diff| 0.06 mmol/L)
#     except FA at 30 / 45 min (Fig. 8d lower by up to 0.52 / 0.38 mmol/L) -- that spread is those rows' read error;
#   * Fig. 1c: FA, AA and pH at 100 C, "averages of duplicates", 0-240 min, with error bars the caption does not define
#     (kept as bar_half_length_undefined, NOT used as sd). Its acids are NOT the Fig. 6-8 replicates (AA 10.85 vs
#     9.33-9.59 mmol/L at 90 min, 15.24 vs 12.7-13.4 at 150; no 45 min sample): a second 100 C run set, so its own pot.
#   * 90 and 110 C acids are not printed (Fig. 8 shows 80 / 100 / 120 C only).
# Rows left out (listed in the verification notes): t = 0 acid markers (0 by construction; one 120 C AA replicate is
# plotted at 0.135); 80 C FA 15-90 min and AA 15-60 min, every replicate plotted ON the axis (0.000; no LOD is stated,
# a zero has no log residual).
# Count-once notes:
#   * pot martins2005_glc_gly_100c (Figs. 6c / 7c / 8d) is the SAME data as Martins 2005b Fig. 7g/h pH 6.8 (+)
#     (ledger martins2005b_fig7_ten_responses_five_ph; 2005b: "The glucose/glycine equimolar system at 100 C and pH 6.8
#     was used as control"): AA at 120 min 12.04 / 10.99 / 11.68 (2005b) vs 12.09 / 11.04 / 11.69 here. Not in any fit
#     table yet; if 2005b Fig. 7 is ever transcribed, count once.
#   * Fig. 1c pH (pot martins2005_glc_gly_100c_fig1) vs Martins 2005b Fig. 4 pH 6.8 (martins2005b_ph68 in
#     ph_acid_submodel.yml): judged NOT the same series (different sampling grid -- 2005b has 45 min, Fig. 1 never does --
#     and different error bars, e.g. 120 min +-0.08 here vs +-0.02 there), most likely the pH of a different run set
#     (Fig. 1 set vs the Fig. 6-8 / 2005b-control set); means agree within 0.036 pH. Entered; see the verification notes.
# Conventions as data/lit/fit_rows/ph_acid_submodel.yml: replicates are separate rows (`replicate:` k = the k-th marker
# drawn at that time, i.e. the figure's data-row order; identity of a physical replicate across times is not
# guaranteed); read_error of a concentration is in dex (log10(e) x absolute error / value), of a pH in pH units.
status: merged   # verified by two readers and merged into ph_acid_submodel.yml (2026-10-29); kept as the first reading
