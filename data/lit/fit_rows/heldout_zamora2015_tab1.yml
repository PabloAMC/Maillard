# KEYED TEST TABLE -- Zamora R, Leon MM & Hidalgo FJ 2015, J Agric Food Chem 63 (accepted manuscript; Instituto de la Grasa, CSIC, Seville),
# Table 1 (MS p. 20): 2-phenylethylamine (PEA), phenylacetaldehyde (PAC) and benzaldehyde from L-phenylalanine + one of eleven lipid
# oxidation products (or none), pH 3 (citrate) / pH 6 (phosphate) x nitrogen / air, low-moisture sand model, 140 C / 1 h.
# PURPOSE: TEST data for engine error E7 ('lipid lane inert to Maillard odorants'): the Strecker aldehyde PAC and the amine PEA from Phe
# with vs without lipid carbonyls / hydroperoxides (e.g. PAC 3.87 -> 104.52 nmol/umol with LOOH at pH 3 in air). Seville is a TEST lab
# for E7 already (F30#15) and DEV for E20, so it serves E7 only. NEVER a fit input: fit_rows.load refuses every row (the unit is not in fit_rows.UNITS); keep it so.
# Format: src/kinetic_core/fit_rows.py. Ledger entry: zamora2015_tab1_pea_pac_bza_by_lipid_carbonyl (lipid.yml); quantification
# calibrated (external curves in sand / pH 6 phosphate; PAC as 2-phenylethanol, benzaldehyde as benzyl alcohol after NaBH4).
#
# READERS (2026-11-01), independent and in parallel, blind to each other: reader A (agent-readerA-2026-11-01; pdftotext -layout for
# born-digital text, pdfimages / sips crops for scans and figures) and reader B (agent-readerB-2026-11-01; pages rendered at 200-300 ppi
# and read visually, pdftotext as a cross-check). Raw files: the coordinator's scratchpad (queue_reader_A.yml, queue_reader_B.yml);
# B's rows as written: fit_rows/second/heldout_zamora2015_tab1.yml. Adjudicator: agent-queue-adjudicator-2026-11-01.
# ADJUDICATION: table cells, value = the printed cell. A and B agree on all 144 cells (mean and SD); Tukey letters were keyed by reader B
# only and are not carried. Read error = half the last printed digit (0.005) in dex, with the printed SD (>= 3 experiments).
# RESOLUTIONS: (1) Buffers: the Methods say '0.3 M buffer'; the figure captions name sodium citrate (pH 3) and sodium phosphate (pH 6)
# (both readers). (2) Temperature / time: Table 1 does not restate them; the Methods' default 'usually 1 h at 140 C' is used
# (conditions_inferred). (3) Amounts: 10 umol Phe + 10 umol lipid product on 600 mg sand with 30 uL 0.3 M buffer + 80 uL water: a
# low-moisture solid, no solution concentration (initial_mmol_L empty; amounts_umol given). (4) The Phe-alone control is not zero (PEA
# 5.71 at pH 6 N2; PAC 21.08 at pH 6 air): lipid effects must be read against it. TEXT CHECKS (consistent): PEA '1.4-2.6 %' at pH 3
# with the hydroperoxides; 2-octenal 1.5 % (pH 3 air) and 2.4 % (pH 6 N2). No row dropped.
# NOT ROWS: '0.00 +- 0.00' cells (no log residual), listed per pot under zero_printed. Lipid keys: V_LOOH, V_LOOMe, V_LnOOMe, V_OC
# (2-octenal), V_HD (2,4-heptadienal), V_DD (2,4-decadienal), V_EH / V_ED (4,5-epoxy-2-heptenal / -decenal), V_OH / V_ON (4-oxo-2-hexenal /
# -nonenal), V_HN (4-hydroxy-2-nonenal); V_PHE L-phenylalanine.
