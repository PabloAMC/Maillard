# KEYED TEST TABLE -- Larralde R, Robertson MP & Miller SL 1995, Proc Natl Acad Sci USA 92:8158-8160 (University of California,
# San Diego, Miller), 'Rates of decomposition of ribose and other sugars: implications for chemical evolution': amine-free D-ribose
# loss by 1H NMR in D2O, 0.05 M deuterated phosphate or acetate, sealed NMR tubes. Text p. 8158 (the phosphate rate law), p. 8159
# (0.05 M bicarbonate vs 0.05 M phosphate), Fig. 2 (Arrhenius points, pD 7.4) and Fig. 1 (pD-rate profile, 4 temperatures).
# PURPOSE: TEST data for the contrast benchmark, engine error E5 ('no buffer-species catalysis';
# docs/reference/contrast_benchmark/split_v2_per_change.yml): the buffer-species contrast at equal pD (bicarbonate / phosphate
# = 0.52) and the phosphate dose law (k0 vs k0 + kP [P]). Fig. 2 is the reference k of the ratio; Fig. 1 is context (its buffer
# changes with pD). NEVER a fit input: fit_rows.load refuses every row (the units per_s, per_min, per_M_per_min and ratio are not
# in fit_rows.UNITS, and the laboratory is in no group of data/keys/laboratories.yml); keep it so.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS). Ledger entries (data/lit/measurement_ledger/trunk.yml):
# larralde1995_fig2_text_ribose_arrhenius_phosphate (text + Fig. 2) and larralde1995_fig1_ribose_pd_rate_profile (Fig. 1); quantification: calibrated (1H NMR, ribose C1-H furanose signals vs an
# external CHCl3 reference).
# ROWS ARE RATE CONSTANTS: species PENT (the engine's aldopentose; here D-ribose), value k, t_min 0 (fit_rows.ROW_FIELDS requires it;
# a rate constant has no sampling time). Figure reads were made in log10 k, so read_error is in dex directly.
#
# READERS (2026-11-01), independent and in parallel: reader A (agent-readerA-2026-11-01; one 4800 x 6500 px 1-bit page scan, 600 ppi, crops with
# sips; Fig. 2 read as offsets from the drawn line plus tick reading) and reader B (agent-readerB-2026-11-01; same raster; y ticks -3/-4/-5/-6 at
# 412.5 px per decade; square centre = outline midpoint). Raw files: the coordinator's scratchpad; B's rows: fit_rows/second/heldout_larralde1995.yml.
# ADJUDICATION (agent-heldout-adjudicator-2026-11-01): figure reads, value = mean of A and B in log10 k; error = max(A, B, |A-B|/2) dex. Fig. 2: A and B agree
# within 0.01 dex at all four temperatures; Fig. 1: within 0.05 dex (largest: 60 C, nominal pD 5.4, -6.93 vs -6.98) and 0.03 pD at all 19 points. Printed numbers: identical in
# both readings; error = half the last printed digit.
#
# RESOLUTIONS OF THE FLAGGED AMBIGUITIES (re-read in the PDF, 2026-11-01):
#  (1) Rate-law units. The scan prints 'rate (s-1) = 2.86 x 10-3 + 9.36 x 10-2 ([DPO4 2-] + [D2PO4 -])' (re-read on the raster:
#      the label is s-1). In s-1 the law is incompatible with the paper's own numbers: at the working 0.05 M it gives 7.54e-3 s-1
#      (t1/2 92 s), 48 - 55x the 73-min half-life (1.58e-4 s-1), the Arrhenius line at 100 C (log k -3.80) and the Fig. 2 100 C
#      point (-3.865). Read as min-1 it gives 1.257e-4 s-1 (log k -3.90): 0.035 dex from Fig. 2, 0.04 dex from Fig. 1's pD 7.55
#      point (-3.945), 0.10 dex from the line. RESOLVED as min-1 (P ~0.9; the alternative, a wrong exponent, is not distinguishable
#      and gives the same numbers). Rows keep the printed mantissas, unit per_min / per_M_per_min. Implied at 0.05 M: 62 % of the
#      rate is the phosphate term; k(0.05 M) / k0 = 2.64.
#  (2) Bicarbonate temperature: not printed in the sentence; 100 C INFERRED from the paragraph (the 73 min and the rate law are
#      both 100 C; P ~0.8). The ratio is kept with conditions_inferred. Counter-ion, D2O and pD control for bicarbonate: not stated.
#  (3) Fig. 1 buffer per point: not marked on the figure; assigned from the Methods ranges (acetate pD 4.4-5.4, phosphate 6.4-8.4
#      at 25 C). The plotted pD sits +0.0 to +0.3 above the nominal 25 C value and rises with temperature in every buffer, so the
#      points at plotted pD 5.44 - 5.72 are the nominal pD 5.4 ACETATE runs (both readers; resolved).
# TEXT CHECKS (no rows): the 73-min half-life (p. 8159, abstract 'pH 7.0 and 100 C') is the Arrhenius line at 100 C (log k -3.80,
# t1/2 72.8 min), not the Fig. 2 point (-3.865, ~85 min): a fit value, not a separate measurement. Arrhenius line 'log k (s-1) =
# 11.23 - 5608/T' (Ea 25.7 kcal/mol); kH2O / kD2O = 1.0 +- 0.2 at 100 C (keyed by reader A only); other half-lives at pD 7.4,
# 100 C: 2-deoxyribose 225 min, ribose 5-phosphate 7 min, ribose 2,4-bisphosphate 31 min (not rows). Fig. 3 (other aldoses) not
# keyed. COUNT ONCE: Fig. 1's nominal-pD 7.4 points and Fig. 2's points are probably the same runs (Fig. 2 'adjusted for the change
# in the buffer pD with temperature'); a pooled score must use one or the other.
status: ready   # two readers + adjudication (2026-11-01); TEST data (E5), never a fit input: fit_rows.load refuses it (units; laboratory unmapped)
