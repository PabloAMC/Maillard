# KEYED FIT TABLE -- sub-model 1 (pH and acid production), HOLD-OUT: Martins & van Boekel 2005, Food Chem 92:437
# ("Kinetics of the glucose/glycine Maillard reaction pathways: influences of pH and reactant initial concentrations",
# doi 10.1016/j.foodchem.2004.08.013), formic acid (FA) and acetic acid (AA) only.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS). Laboratory and
# quantification class come from the ledger entries (data/lit/measurement_ledger/trunk.yml): calibrated (HPLC, method of
# Martins & van Boekel 2004 = Martins 2005 Food Chem 90, external standards).
# DRAFT, FIRST READER (agent-m2005b-holdout-reader1-2026-10-30), read from data/articles/martins2005b.pdf (12 pp., the
# journal paper). Figures 3, 5 and 7 are VECTOR graphics: every value is a marker centre read from the content stream
# (pdftocairo -svg), axes calibrated on the tick paths (time: least squares on the x ticks, then snapped to the nominal
# sampling time, every |snap| < 1.6 min; value: zero on the x-axis line, slope by least squares through it). Marker
# centres: diamond = top-vertex x / side-vertex y; square, triangle, circle = bbox mid; asterisk / plus = common origin of
# the spokes (asterisk 6 spokes, plus 4). The dossier was opened for orientation only; no number was taken from it.
# Verification: data/lit/source_verification/ph_acid_holdout_martins2005b.yml.
#
# WHAT IS TRANSCRIBED
#   * Fig. 5d (pH-stat, 100 C, "pH kept constant by addition of 1 N NaOH (initial pH set at 6.8 at room temperature)"):
#     FA (filled diamond) and AA (open square), ONE marker per time at 0, 5, 10, 15, 20, 30, 60, 75, 90, 105, 120 min, no
#     error bars (a single pH-stat experiment: "one experiment was done where the pH was kept constant"). The held pH
#     value (the 100 C pH of the pH 6.8 / room-temperature solution) is NOT printed anywhere in the paper.
#   * Fig. 7g (FA) and 7h (AA), drifting pH, initial pH 4.8 (filled diamond, 0-240 min), 5.5 (asterisk, 0-180 min),
#     6.0 (open circle, 0-210 min) and 7.5 (filled triangle, 0-120 min; also a 5 min sample): every replicate marker.
#     Markers per time: TWO at pH 4.8, 6.0, 7.5; THREE at pH 5.5 (the paper: "at least in duplicate"). Exactly
#     coincident markers are counted from the drawing commands (each is drawn separately). pH 6.0 AA: the two markers
#     coincide at every time (within the 0.18 mmol/L quantum). Not transcribed: the pH 6.8 arm (+, three per time; a
#     reprint of Martins 2005 Figs. 6-8, already in ph_acid_submodel.yml), and the other eight panels.
#   * Acid spans per arm are what Fig. 7 plots; the paper fits "only data points ... for which the pH drop was not higher
#     than 1 unit" (Table 2 caption), which may be why the arms stop at different times (Fig. 4 runs to 240 min for all).
# ROWS LEFT OUT (marker centre on the x-axis line, i.e. < 0.5 coordinate quantum from 0; no LOD is stated; a zero has no
# log residual). Below one quantum (Fig. 7g 0.061, Fig. 7h 0.18, Fig. 5d 0.21 mmol/L) "0" means "< ~one quantum", not
# a measured zero:
#   * t = 0, every arm and both acids (Fig. 5d: 1 + 1; Fig. 7 pH 4.8 2 + 2, pH 5.5 3 + 3, pH 6.0 2 + 2, pH 7.5 2 + 2);
#   * Fig. 7g FA pH 4.8: ALL 24 markers (0-240 min, 2 per time) on the axis -> no FA row for pot martins2005b_fig7_ph48;
#   * Fig. 7g FA pH 6.0: 15 min (both), 30 min (both), 45 min replicate 2 (replicate 1 = 0.060, one quantum, kept);
#   * Fig. 7h AA pH 4.8: 15, 30, 45, 60, 75, 90 min (both replicates);
#   * Fig. 7h AA pH 5.5: 15, 30, 45 min (all three replicates);
#   * Fig. 7h AA pH 6.0: 15 min (both);
#   * Fig. 7h AA pH 7.5: 5 min replicate 1 and 15 min replicate 1 (the other replicate reads 0.18 / 0.88 mmol/L, kept).
# COUNT-ONCE NOTE, Fig. 3 (FA filled square, AA open square, pH 5.5, 0-240 min, ONE marker per time with error bars the
# caption does not define): NOT entered as rows. Its markers are means (bar half-lengths 0.007-0.10 mmol/L) at 0, 15, 30,
# 45, 60, 90, 120, 150, 180, 210, 240 min:
#     FA 0.069 0.128 0.209 0.312 0.364 0.680 0.835 1.019 1.195 1.254 (15-240 min; 0 at t = 0)
#     AA 0.040 0.084 0.092 0.194 0.217 0.592 0.820 1.107 1.276 1.335
#   It is NOT a strict subset of Fig. 7: (i) it adds 210 and 240 min, which Fig. 7 does not plot for pH 5.5; (ii) at
#   90 min it is lower than every Fig. 7 marker (FA 0.364 +- 0.045 vs 0.475 / 0.475 / 0.525; AA 0.217 +- 0.06 vs
#   0.359 x 3); elsewhere it agrees with the Fig. 7 replicate means within ~0.07 mmol/L (FA 120 min 0.680 vs 0.646;
#   180 min 1.019 vs 1.081). Same conditions and laboratory, so most likely the same experiment summarised differently
#   (~70 %), possibly a separate run set (~30 %). Left for the adjudicator: whether to add its 210 / 240 min means.
# Conventions as data/lit/fit_rows/ph_acid_submodel.yml: replicates are separate rows (`replicate:` k = the k-th marker
# drawn at that time, counting markers on the axis; identity of a physical replicate across times is not established);
# read_error of a concentration is in dex (log10(e) x absolute error / value). No sd is printed for any of these rows.
