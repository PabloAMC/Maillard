# KEYED TEST TABLE -- Zhang Z, Zang M, Zhang K, Wang S, Li D & Li X 2021, Food Res Int 139:109918 (China Meat Research
# Center, Beijing; doi 10.1016/j.foodres.2020.109918), Table 3 (pp. 4-5, landscape): sulfur volatiles from L-cysteine + D-xylose
# (4 + 4 mmol in 50 mL sodium phosphate pH 5.5, 120 C / 60 min, autoclave) with or without soybean lecithin and / or cephalin,
# each with or without reheating (eight groups A1 - D2, Table 1).
# PURPOSE: TEST data for the contrast benchmark, engine error E7 ("lipid lane inert to Maillard odorants";
# docs/reference/contrast_benchmark/split_v2_per_change.yml). The contrasts are phospholipid vs none within one reheat status
# (B1 / C1 / D1 vs A1; B2 / C2 / D2 vs A2). NEVER a fit input: fit_rows.load refuses every row (the laboratory string of the
# ledger entry is in no group of data/keys/laboratories.yml, and ten of the twelve species are not engine species); keep it so.
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS). Laboratory and quantification
# class from the ledger entry zhang2021_tab3_cys_xyl_phospholipid_reheat (data/lit/measurement_ledger/sulfur.yml; semi-quantitative: SPME, single internal
# standard 2-methyl-3-heptanone, response factor 1, formula (1) of the paper). The lipid ledger's
# zhang2021_tab3_phospholipid_cys_xyl_lipid_volatiles is the SAME Table 3 (its lipid-derived rows); nothing is keyed under it here.
#
# READERS (2026-11-01), independent, in parallel and blind to each other: reader A (agent-readerA-2026-11-01; text layer by pdftotext -bbox, every
# cell assigned to its column by x position, checked against the page render) and reader B (agent-readerB-2026-11-01; pdftotext -layout / -raw,
# column assignment checked against the render of pp. 4-5). Raw files: the coordinator's scratchpad (keying_reader_A.yml,
# keying_reader_B.yml); B's rows as written: fit_rows/second/heldout_zhang2021_table3.yml.
# ADJUDICATION (agent-heldout-adjudicator-2026-11-01): table cells, so value = the printed cell. A and B agree on all 96 cells of the twelve sulfur species
# (value, SD and Duncan letters), including the 28 '—' (not detected) cells; nothing needed a re-read for disagreement.
# Read error = half the last printed digit (0.005 ug/kg) in dex; each row also carries the printed SD (n = 3, 'average +- st.dev.').
# Reader A also keyed furfural (row 17) and the Subtotal row; reader B did not (the brief named MFT, FFT and thiophenes): not
# rows here; the Subtotal is a text check below.
#
# NOT DETECTED. '—' cells (footnote 1: 'not detected or the RI was not found'; in a data cell, not detected; no LOD printed) are
# not rows (a zero has no log residual); each pot lists them under not_detected, for sign / presence contrasts.
#
# RESOLUTIONS OF THE FLAGGED AMBIGUITIES (re-read in the PDF, 2026-11-01):
#  (1) Group composition. Table 1 prints lecithin / cephalin: A 0 / 0, B 0.24 % / 0, C 0 / 0.07 %, D1 0.24 % / 0.24 %, D2 0.07 % /
#      0.07 % (both readers; the PDF text layer agrees). The brief's 'with / without lecithin' is wrong: the design is none /
#      lecithin / cephalin / both. D1 and D2 differ in dose, yet the text treats D2 as the reheated D1 ('substances in the Group D2
#      (after reheating treatment) were lower than those in Group D1'): one of the two D columns of Table 1 is a misprint, and the
#      paper does not say which (unresolved; neither matches B + C, 0.24 % + 0.07 %). Kept as printed; the D pots carry
#      composition_conflict. Consequence: D1 vs A1 and D2 vs A2 are valid 'both phospholipids vs none' contrasts with an uncertain
#      dose; D1 -> D2 is NOT a clean reheating contrast. The % basis (w/v or w/w) is not printed.
#  (2) C2 Subtotal. Printed '78.80 ± 58.69 bc'. The column sums of Table 3 reproduce the seven other Subtotals to 0.01 ug/kg
#      (A1 500.40, A2 384.34, B1 787.69, B2 784.33, C1 466.13, D1 1052.81, D2 892.55; bbox parse of pp. 4-5); C2's cells sum to
#      478.80. The printed 78.80 drops the leading '4' (misprint; P > 0.99). It is not a row; it confirms the text's 'the other four
#      groups [B, C] exhibited the opposite' (C2 478.80 > C1 466.13).
#  (3) The shared 220.77 (row 26, 2-(4-methylpentyl)thiophene, B1 220.77 ± 36.67 a and D1 220.77 ± 83.31 a). Both Subtotals,
#      B1 787.69 and D1 1052.81, are reproduced only WITH 220.77 in each column, so the authors' sheet holds 220.77 in both cells:
#      as printed, both kept. A copy error upstream of the sheet cannot be excluded (identical 5-digit means with different SDs;
#      P ~0.3 that one is a copy); the D1 row is flagged.
# CONDITIONS. Buffer molarity, vessel, headspace and atmosphere: not printed. The *2 groups: 120 C / 60 min, cooled to 20 C, 24 h
# at 4 C, then 'chilling storage at 4 C for 5 days, and then a boiling for 30 min' (whether in the sealed vessel: not stated);
# the *1 groups: 120 C / 60 min, cooled, 24 h at 4 C. t_min 60 = the end of the 120 C hold (the analysis follows the post-heat
# history in post_heat). Concentration 4 mmol in 50 mL = 80 mmol/L each (solute volume ignored).
# TEXT CHECKS (no rows): the text's MFT statement (reheating lowers OAVs 'except for the two groups with the addition of
# cephalin') vs Table 3: MFT falls on reheating in A, B, D (D confounded, (1)) and rises in C (5.36 -> 6.53, same letters).
# Sec. 3.1 and 3.2 give conflicting compound counts (15 / 18 / 21 / 19 vs 16 / 22 / 24 / 20); not used.
# NEW SPECIES KEYS (coined here, not engine species; listed per pot under engine_species_missing): THIOPH_2ME 2-methylthiophene
# (row 4), THIOL_2ME_PENTANE_3 2-methylpentane-3-thiol (10), THIOPH_2_3MEBUTYL 2-(3-methylbutyl)thiophene (16),
# THIOPHENONE_2ME_DIHYDRO dihydro-2-methyl-3(2H)-thiophenone (20), THIOPH_2_4MEPENTYL 2-(4-methylpentyl)thiophene (26),
# THIOPH_2CHO thiophene-2-carboxaldehyde (27), THIOPH_2ACETYL_4ME 1-(4-methyl-2-thienyl)ethanone (28), THIOPH_2CHO_3ME
# 3-methyl-2-thiophenecarboxaldehyde (29), THIOPH_2_E2BUTENYL 2-[(E)-2-butenyl]thiophene (32), THIOPH_25DICHO
# 2,5-thiophenedicarboxaldehyde (33); SOY_PC soybean lecithin, SOY_PE soybean cephalin. Engine keys: MFT, FFT, PENT (xylose), Cys.
# No thiazole is listed in Table 3.
