# KEYED FIT TABLE -- Zhou et al. 2023 (J Agric Food Chem 71:2472; PDF data/articles/Zhou2023b.pdf), Table 1:
# 2-acetylthiazole (engine ACTZ) from the alanine-xylose Amadori compound (engine ARP) with and without cysteine at
# initial pH 6 / 7 / 8, 120 C, 60 min. For sub-model 4 (the cysteine + C3-fragment route to 2-acetylthiazole).
# Format: src/kinetic_core/fit_rows.py (pots: POT_FIELDS; rows: ROW_FIELDS; units: fit_rows.UNITS; every row an sd as
# printed or a read_error in dex). Laboratory and quantification class come from the ledger entry.
# FIRST READER: agent-sm34-reader1-2026-10-30, against the PDF and its supplement (zhou2023b_supporting.pdf), not the
# dossier. Second reader: pending (data/lit/source_verification/thiol_zhou2023_actz.yml).
# NOTE ON THE FILE: the ledger's dossier is zhou2023_extraction.md, but data/articles/Zhou2023.pdf is a different paper
# (Zhu et al., Food Chem 400:133854, kafirin / Baijiu odorants); this Table 1 is in Zhou2023b.pdf.
# Conventions:
#   * initial_mmol_L in engine keys: ARP = N-(1-deoxy-D-xylulos-1-yl)-alanine (the purified Amadori compound fed as a
#     reactant), Cys.
#   * one pot per Table 1 column; label_ph = the initial pH set with 3 M NaOH (none of the pots is buffered; the pH is
#     not followed during heating; Fig. 2 prints the final pH, not re-read here).
#   * errors: `sd` = the printed SD (n = 3, Table 1 footnote), in ug/L. The printed Duncan letters are kept in `printed`.
#   * ND cells (no LOD printed) are not rows: 2-acetylthiazole is ND in all three ARP-alone columns. Their pots are
#     kept, with no rows, so the record of what was heated is complete.
#   * The pH 7 columns belong to ledger zhou2023_table1_ph7_arp_cys_volatiles, the pH 6 / 8 columns to
#     zhou2023_table1_ph6_ph8_arp_cys_volatiles (the ledger splits Table 1 by column).
