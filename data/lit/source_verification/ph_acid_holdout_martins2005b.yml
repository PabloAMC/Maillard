  quote: 'Because of the observed heat-induced pH drop, an additional experiment was done at 100 °C where the pH was kept
    constant; the initial pH was 6.8 as set at room temperature. The pH stat controller monitored the pH and, when it
    dropped below its set point, an auto burette (ABU901 Radiometer Copenhagen) added a solution of NaOH (1 mol/l) to the
    reaction mix. ... When the pH was kept constant, this was done at the pH the solution had at 100 °C; the corresponding
    initial pH was 6.8 at room temperature.'
  notes: 'CONDITIONS as the ledger: Glc 0.2 M + Gly 0.2 M in 0.1 M phosphate (counter-ion not stated), 100 C, pH held by
    a pH-stat (1 M NaOH; Fig. 5 caption "1 N NaOH") at the pH the room-temperature pH 6.8 solution had at 100 C. The HELD
    VALUE IS NOT PRINTED anywhere (text, captions, Table 1: "Samples heated at 100 °C, pH 6.8"); ledger flag
    ph_hot_setpoint_value_unstated is right. Temperature monitored by a Consort R305; samples drawn through a septum with
    a Hamilton SampleLock (10 ml) and ice-cooled. Reaction volume and heating vessel of the pH-stat run are not stated;
    the NaOH added (dilution) is neither reported nor corrected. Plotted span 0-120 min (the axis runs to 150; ledger
    time_min [0, 150] is the axis). UNITS: Fig. 5d y axis "Acids mmol/l". QUANTIFICATION: "The used methodology has been
    described previously (Martins & Van Boekel, 2004)" (= Martins 2005 Food Chem 90: HPLC, external standards) ->
    calibrated, as the ledger. No error bars, no statement of replication for this run ("one experiment was done where the
    pH was kept constant"); every row carries a read error only. DUPLICATES: no other figure or table prints these acids
    (Table 1 "pH constant" column holds rate constants fitted to them, not data). VALUES: Fig. 5 is vector graphics; the
    ledger''s "terminal values only" is superseded: all 11 FA (filled diamond) and 11 AA (open square) markers read, at 0,
    5, 10, 15, 20, 30, 60, 75, 90, 105, 120 min, one marker per time. t = 0 markers sit on the axis (left out). E.g. FA
    0.837 / 4.493 / 8.740 and AA 1.080 / 11.770 / 27.787 mmol/L at 15 / 60 / 120 min. Coordinate quantum 0.59 pt = 0.21
    mmol/L (max y-tick residual 0.095 mmol/L, x-tick residual 0.23 min); time snaps all within 0.3 min of the nominal
    grid. 20 rows.'
- ledger_id: martins2005b_fig7_ten_responses_five_ph
  source_file: martins2005b.pdf
  read_by: agent-m2005b-holdout-reader1-2026-10-30
  second_reader: agent-m2005b-holdout-reader2-2026-10-30
  date: 2026-10-30
  checks:
    conditions: pass
