  - ledger_id: zhou2023_fig2_final_ph
    source_file: Zhou2023b.pdf
    read_by: "agent-zhou2023ph-reader1-2026-10-30"
    second_reader: agent-zhou2023ph-reader2-2026-10-30
    date: 2026-10-30
    checks:
      conditions: pass
      units: pass
      quantification: pass
      duplicates: pass
      values: pass
    quote: "Figure 2. Final pH value of thermally treated ARP with or without Cys at 120 °C for 60 min under different initial pH values (6, 7, and 8) (the concentrations of ARP and Cys were both 20 mmol/L)."
    notes: >-
      Same six pots as Table 1. Methods: 'A pH meter (Mettler-Toledo, Shanghai, China) was used to determine the pH
      value.' Neither when the final pH was read (presumably after the ice-bath cooling) nor at what temperature is
      stated. Fig. 2 is a bar chart with no printed numbers: digitised here from the embedded 600 dpi raster (pdfimages,
      1333 x 755 px), the y-scale from the 0 / 2 / 4 / 6 tick centres (106.1 px per pH unit, linear fit), each value
      the centre of the bar's top outline, the sd half the drawn error bar (the caps' midpoints agree with the outline
      to <= 0.01 pH). Read: ARP 3.98 / 4.10 / 4.96 (+- 0.02 / 0.07 / 0.18), ARP + Cys 3.23 / 3.43 / 5.05 (+- 0.06 /
      0.11 / 0.17) for initial pH 6 / 7 / 8; letters b, b, c / a, a, c. The ledger lists 3.99 / 4.13 / 4.99 / 3.22 /
      3.42 / 5.07: all within 0.03 pH of this reading, the largest gap ARP pH 7 (4.13 vs 4.10; the error-bar midpoint
      gives 4.11). Error bars: the figure legend does not say SD, the Statistical Analysis section says all results
      are mean +- SD of three repeats. Text agrees: final pH below the initial in every pot; at initial pH 7 ARP + Cys
      'significantly lower' than ARP alone; at pH 8 ARP + Cys 'not lower than' ARP alone. Duplicates: the same Fig. 2
      values are already rows of data/lit/fit_rows/ph_acid_submodel.yml (pots zhou2023_arp_ph6 ... zhou2023_arp_cys_ph8,
      same ledger id); a fit loading both tables would count each final pH twice. NOTE: fit_rows.load and the gate
      take a row's ledger entry from its POT, so in this table the six pH rows are gated by (and labelled with) the
      Table 1 ledger ids of their pots; this entry records the Fig. 2 reading.
