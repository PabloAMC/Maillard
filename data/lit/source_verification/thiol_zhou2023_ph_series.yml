# SOURCE VERIFICATION -- Zhou 2023 Table 1 (MFT, FFT, MFTD, furfural) and Fig. 2 (final pH)
# (fit table data/lit/fit_rows/thiol_zhou2023_ph_series.yml).
# Format and the five checks: the header of data/lit/source_verification.yml. First reader:
# agent-zhou2023ph-reader1-2026-10-30, against the PDF (data/articles/Zhou2023b.pdf -- NOT Zhou2023.pdf, which is Zhu
# et al. 2023 Food Chem 400:133854, an unrelated Baijiu paper) and its supplement (zhou2023b_supporting.pdf), not the
# dossier.
# second_reader "pending" = NOT verified (the loader and the gate refuse it until a second reader signs).
# `notes` is an extra field: what was checked, what was corrected, and why rows were left out.
entries:
  - ledger_id: zhou2023_table1_ph7_arp_cys_volatiles
    source_file: Zhou2023b.pdf
    read_by: "agent-zhou2023ph-reader1-2026-10-30"
    second_reader: agent-zhou2023ph-reader2-2026-10-30
    date: 2026-10-30
    checks:
      conditions: pass
      units: pass
      quantification: pass
      duplicates: pass
      values: pass
    quote: "The volatile substances detected in different systems were quantified according to the previous study.10 Different concentrations of the chemical standards and the fixed concentration of internal standards were mixed to construct standard curves. The x-axis and the y-axis represent the concentration of the flavor compounds and the peak area ratio of the corresponding compounds to the internal standard, respectively. The calibration equations established for different flavor substances are shown in Table S1."
    notes: >-
      Conditions (Methods, 'Heat Treatment of ARP with or without the Addition of Cys'): purified
      N-(1-deoxy-D-xylulos-1-yl)-alanine 20 mmol/L +- Cys 20 mmol/L, 'aqueous solutions', initial pH 6 / 7 / 8 set
      with 3 M NaOH, 120 C, 1 h, cooled in an ice bath. Unbuffered. The water grade is not stated for this step
      ('deionized' is stated for the ARP synthesis and the Cys + MGO model; the ledger's 'deionized water' is an
      inference, harmless); the pot `buffer` text says so. pH meter Mettler-Toledo, reading temperature and timing not
      stated. Vessel, fill volume and heating medium not stated. Units: Table 1 header 'concentration (ug/L)'.
      Quantification: HS-SPME (CAR/PDMS/DVB; 3 mL sample + 2 mL saturated NaCl; 60 C, 30 min, 300 rpm) GC-MS (DB-WAX),
      1,2-dichlorobenzene internal standard (0.0018 ug/uL in methanol; volume added not stated); external standard
      curves of the authentic compounds against the IS (all four compounds bought from Aladdin, identified 'MS, RI,
      S') -> calibrated, as the ledger (not SIDA). SI Table S1: 2-methyl-3-furanthiol y = 0.001x + 0.0029 (R2
      0.9966); 2-furfurylthiol y = 0.0018x + 0.0037 (R2 0.9951); bis(2-methyl-3-furyl) disulfide y = 0.0208x - 0.7126
      (R2 0.9984); furfural y = 0.0191x - 0.3498 (R2 0.9900). Calibration range and the standards' matrix not printed.
      Caution: the disulfide curve's x-intercept is 0.7126 / 0.0208 = 34 (x units not printed, presumably ug/L) and
      furfural's 18, so the disulfide values (50-103 ug/L) sit close to where the fitted line crosses zero response;
      a curve fitted over a high range and extrapolated down would bias them. Thiols quantified by HS-SPME at 60 C
      for 30 min may oxidise to the disulfide during extraction (not addressed by the paper). Duplicates: no figure
      reprints Table 1 (Fig. 1 is electronic-nose PCA, Fig. 3 the Cys + MGO model); the text prints no number of these
      four compounds (only 2-acetylthiazole 582.34); SI Table S2 OAVs are value / threshold and reproduce every cell
      transcribed here (MFT 1.39 / 3.18 / 1.05 x 10^5 at 0.005 ug/L; FFT 1.36 / 1.26 x 10^5, 5.42 x 10^4 at 0.006;
      MFTD 1.87 / 3.21 / 1.56 x 10^5 at 0.00032; furfural 0.54 / 0.20 / 0.45 / 0.16 / 0.15 / 0.07 at 3000), which
      independently confirms the column assignment (ARP alone in columns 1 / 3 / 5). Zhou 2022 is a sibling run of
      the pH 7 pot (CF-014, MFT x7.8): a reproducibility conflict, not a duplicate. Values (pH 7): ARP + Cys MFT
      1588.57 +- 21.24 (c), FFT 757.965 +- 13.03 (c; the only cell printed with three decimals), MFTD 102.59 +- 4.17
      (c), furfural 473.07 +- 14.04 (c); ARP alone furfural 1339.37 +- 83.04 (c), MFT / FFT / MFTD ND. n = 3 (footnote a).
      The Duncan letters are internally inconsistent and should not be used as data: within the furfural row 1339.37
      +- 83.04, 473.07 +- 14.04 and 436.63 +- 19.93 all carry 'c' (a 3x difference at n = 3); within the MFT row 696.99
      and 1588.57 share 'c' (SDs 17 and 21); within the MFTD row 59.70 (c) and 102.59 (c) are 'not different' while
      59.70 vs 50.07 (b) is. Unrelated text-vs-table contradiction (not transcribed): the text says furan 'was only
      detected at pH 8', Table 1 prints furan 30.77 +- 0.97 at pH 7 ARP + Cys.
