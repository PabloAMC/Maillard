    quote: "Table 1. Volatile Flavor Compounds of Thermally Treated ARP with or without Cys at 120 °C for 1 h under Different Initial pH Values (6, 7, and 8)"
    notes: >-
      Same experiment, method and calibration as the pH 7 entry (one sentence of the methods sets all three pH
      values). Values: pH 6 ARP + Cys MFT 696.99 +- 17.44 (c), FFT 813.65 +- 13.37 (c), MFTD 59.70 +- 2.75 (c),
      furfural 608.41 +- 22.97 (d); pH 8 ARP + Cys MFT 525.62 +- 16.88 (b), FFT 325.22 +- 14.61 (b), MFTD 50.07 +-
