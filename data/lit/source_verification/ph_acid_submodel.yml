  quote: 'Solutions of DFG (15 mmol) in water (150 mL) or in a phosphate buffer (150 mL, 100 mmol/L) were heated at 90 °C
    for 7 h. Experiments were performed at constant pH (5, 6, 7, or 8), measured at 90 °C, using a pH-stat device (Metrohm,
    Herisau, Switzerland) filled with a NaOH solution (3 mol/L) || Adjudicator: second reader''s 7 acid sums < 3 mmol/L and
    49 NaOH-uptake rows (species NaOH_uptake) confirmed cell by cell against Table 5; every row carries the table''s rounding
    as read_error; Fig. 5 / Table 4 are the same acids (count once).'
  notes: 'Conditions as the ledger states (DFG 0.1 M, 90 C, 7 h, water or 0.1 M phosphate, counter-ion not stated; pH held
    by a pH-stat whose electrode reads at 90 C). Units: Table 5 prints mmol per whole 150 mL reactor ("sum of acetic and formic
    acid (mmol)", "NaOH added (mmol)"); the fit table divides by 0.150 L (NaOH volume <= 4.4 mL and the 1 mL aliquots not
    corrected, as in the paper). Quantification: "Acetic acid ... and formic acid ... were quantified on the basis of calibration
    curves by comparing the peak areas with those of standard solutions containing known amounts of pure compounds. All samples
    were analyzed in duplicate." (HPAEC-conductivity) -> calibrated. Error: none printed for Table 5; Fig. 5 caption (same
    acid measurements): "The coefficient of variation was lower than 10% for concentrations above 3 mmol/L." Acid-sum rows
    >= 3 mmol/L carry sd = 10 % (the stated bound, applied to the sum; second reader to confirm); rows below it are left out.
    NaOH uptake has NO stated error (pH-stat burette), so its 49 values are NOT transcribed (owner decision needed). Duplicates:
    none in the register or ledgers; WITHIN the paper, Table 5''s acid sums are the sums of Fig. 5 A + B (ledger davidek2002_fig3_5_time_courses)
    and of Table 4''s yields -- count once if Fig. 5 is ever fitted. Values: all 112 cells of Table 5 compared with the dossier''s
    transcription (identical), e.g. water pH 7 acids 2.7 / 5.0 / 8.9 at 1 / 2 / 7 h, NaOH 13.1 at 7 h pH 8; phosphate pH 7
