# SOURCE VERIFICATION -- sub-model 1, pH and acid production (fit table data/lit/fit_rows/ph_acid_submodel.yml).
# Format and the five checks: the header of data/lit/source_verification.yml. One file per sub-model so parallel
# readers never edit the same file. First reader: agent-reader1-2026-10-29, against the PDFs / SI (not the
# dossiers). second_reader "pending" = NOT verified (the loader and the gate refuse it until a second reader signs).
# `notes` is an extra field: what was checked, what was corrected, and why rows were left out.

entries:
  - ledger_id: davidek2002_tab5_acids_naoh_uptake
    source_file: davidek2002.pdf
    read_by: "agent-reader1-2026-10-29"
    second_reader: "pending"
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: pass
      duplicates: pass
      values: pass
    quote: "Solutions of DFG (15 mmol) in water (150 mL) or in a phosphate buffer (150 mL, 100 mmol/L) were heated at 90 °C for 7 h. Experiments were performed at constant pH (5, 6, 7, or 8), measured at 90 °C, using a pH-stat device (Metrohm, Herisau, Switzerland) filled with a NaOH solution (3 mol/L)"
    notes: >-
      Conditions as the ledger states (DFG 0.1 M, 90 C, 7 h, water or 0.1 M phosphate, counter-ion not stated; pH held
      by a pH-stat whose electrode reads at 90 C). Units: Table 5 prints mmol per whole 150 mL reactor ("sum of acetic
      and formic acid (mmol)", "NaOH added (mmol)"); the fit table divides by 0.150 L (NaOH volume <= 4.4 mL and the
      1 mL aliquots not corrected, as in the paper). Quantification: "Acetic acid ... and formic acid ... were quantified
      on the basis of calibration curves by comparing the peak areas with those of standard solutions containing known
      amounts of pure compounds. All samples were analyzed in duplicate." (HPAEC-conductivity) -> calibrated.
      Error: none printed for Table 5; Fig. 5 caption (same acid measurements): "The coefficient of variation was lower
      than 10% for concentrations above 3 mmol/L." Acid-sum rows >= 3 mmol/L carry sd = 10 % (the stated bound, applied
      to the sum; second reader to confirm); rows below it are left out. NaOH uptake has NO stated error (pH-stat
      burette), so its 49 values are NOT transcribed (owner decision needed). Duplicates: none in the register or
      ledgers; WITHIN the paper, Table 5's acid sums are the sums of Fig. 5 A + B (ledger davidek2002_fig3_5_time_courses)
      and of Table 4's yields -- count once if Fig. 5 is ever fitted. Values: all 112 cells of Table 5 compared with
      the dossier's transcription (identical), e.g. water pH 7 acids 2.7 / 5.0 / 8.9 at 1 / 2 / 7 h, NaOH 13.1 at 7 h
      pH 8; phosphate pH 7 NaOH "Data not available" (ledger flag right).
