  - ledger_id: cao2017_fig5_ttca_cama_glyarp
    source_file: cao2017.pdf
    read_by: "agent-sm2-reader1-2026-10-29"
    second_reader: "pending"
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: pass
      duplicates: pass
      values: pass
    quote: "The amounts of cysteine and xylose used in the reaction models were both 2 mmol in 5 mL of phosphate buffer (0.2 M, pH 5.5). ... The vials were sealed and heated at 90 °C while stirring for 0.5, 1, 2, 3, 4, or 5 h. At the end time, the vials were removed and cooled immediately by a stream of tap water."
    notes: >-
      Accepted manuscript (not the typeset version). Conditions: Cys 0.40 + Xyl 0.40 mol/L, 0.2 M phosphate pH 5.5
      (reagents list NaH2PO4 and NaOH, so sodium phosphate by inference; strength 0.2 M as printed), 15 mL pressure
      glass vial, sealed, stirred, 90 C, 0.5-5 h, tap-water quench; pH read after cooling ("The pH was determined by a
      PHSJ-5 pH meter"); three replicates. Units: Fig. 5 axis "Concentration (mol/L)". Quantification: "An external
      standard method in SIM scan mode was used for quantitative determination of Cys-Amadori, TTCA ... The
      synthesized Cys-Amadori, TTCA, and Gly-Amadori were used as the standards", 0.05-0.5 mol/L, TTCA R2 0.9902,
      Cys-Amadori R2 0.9985 -> calibrated. Caveats kept: TTCA and Cys-Amadori share SIM m/z 254 / 236 (separated by
      retention only); the 0.5 h Cys-Amadori (0.0046 mol/L) lies 10x below the lowest standard. Duplicates: none in
      the register; Zhao 2017b (same lab, same recipe, HPLC-ELSD) is a sibling RUN, not a copy (its values differ).
      Values: Fig. 5 is VECTOR; blank-arm markers read from the paths: TTCA 0.3555 / 0.3371 / 0.2890 / 0.2669 /
      0.2529 / 0.2360 and Cys-Amadori 0.0046 / 0.0621 / 0.0886 / 0.1051 / 0.1086 / 0.1325 mol/L at 0.5-5 h; the
      dossier's raster reads differ by <= 0.0015 mol/L (inside its +-0.005). Error bars are SDs ("Means +- standard
      deviations were used to plot the figures (n=3)"); their half-lengths read from the paths become row sd; the
      blank TTCA bars at 2-5 h are not drawn (hidden or absent), those rows carry the read error only. Only the blank
      arm is transcribed: the glycine arms are 3.2-9.6 mol/L glycine (not solutions as written) and need chemistry
      outside this sub-model. t = 0 (plotted 0) is the pot's initial state, not a row.
