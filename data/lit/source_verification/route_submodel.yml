# SOURCE VERIFICATION -- sub-model 2, the cysteine-pentose route (fit table data/lit/fit_rows/route_submodel.yml;
# frame results/validation/kinetic_core_route_submodel_prereg.md).
# Format and the five checks: the header of data/lit/source_verification.yml. One file per sub-model so parallel
# readers never edit the same file. First reader: agent-sm2-reader1-2026-10-29, against the PDFs / SI (not the
# dossiers; the dossiers were used only for their digitised values, which were then checked against the figures).
# second_reader "pending" = NOT verified (the loader and the gate refuse it until a second reader signs).
# `notes` is an extra field: what was checked, what was corrected, and why rows were left out.
# Vector figures were read from the PDF's own paths (pdftocairo -svg; axes calibrated on the tick paths); a value
# called "vector" below is exact to the plotting software's coordinates (< 0.1 % of the axis).
#
# checks: conditions (T, time, pH and where it was measured, buffer and strength, concentrations, vessel),
#         units, quantification (sida / calibrated / semi_quantitative / relative, and the evidence), duplicates
#         (the ledger's `same_data_as` or the conflicts register's duplicate entries), values (a sample of
#         transcribed numbers against the table or figure).

