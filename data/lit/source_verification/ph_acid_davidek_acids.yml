- ledger_id: davidek2008_fig1_xylose_gly_acetic_residual_xylose
  source_file: davidek2008.pdf
  read_by: agent-davidek-reader1-2026-10-30
  second_reader: agent-davidek-reader2-2026-10-30
  date: 2026-10-30
  checks:
    conditions: pass
    units: pass
    quantification: corrected
    duplicates: pass
    values: pass
  quote: 'A solution of glycine (0.35 mmol) and D-xylose (0.35 mmol) in phosphate buffer (3.5 mL, 0.2 mol/L) was
    dispatched (0.4 mL/vial) into 1.5 mL screw-cap vials (Infochroma, Zug, Switzerland) and thermally treated in a
    silicone bath (90 C, 15 h or 120 C, 4 h). The experiments were performed at pH 6.0 and pH 8.0.'
  notes: 'CONDITIONS: xylose + glycine 0.1 M each (Results: "equimolar concentrations of glycine and unlabeled or
    13C-labeled xylose (0.1 mol/L)"), 0.2 M Na phosphate, pH 6.0 / 8.0 set before heating (when / at what temperature
    not stated; not held), 120 C, 0-240 min (Fig. 1 caption: "in phosphate buffer at 120 C at pH 6.0 (squares) and pH
    8.0 (triangles)"). UNITS: left axis "Residual xylose (%)", right axis "Acetic acid (mol%)"; converted x 1.00
    mmol/L per % (100 mmol/L xylose). QUANTIFICATION: acetic acid SIDA (SPME-GC/MS, [2H3]acetic acid). CORRECTED:
    the xylose method is NOT described anywhere in the paper; the ledger class sida applies to acetic acid, so the
    xylose rows inherit a class the paper does not support -- adjudicator should consider splitting xylose to class
    other / calibrated. DUPLICATES: text and abstract "16 mol% and 28 mol%" = after 4 h at pH 6.0 / 8.0, 120 C =
    the 240-min markers (end labels 16 / 28; read 16.15 / 27.60): counted once. VALUES: Fig. 1 is a 909-ppi raster
    (2550 x 2510 px); gridlines at 0/25/50/75/100 % (= 0/15/30/45/60 mol%) located to 1 px, x from 8 ticks
    (residual < 0.3 min). Sampling differs by pH: pH 6.0 at 0, 15, 30, 60, 120, 240 min; pH 8.0 at 0, 10, 20, 30, 60,
    120, 240 min. Read: AA pH 6.0 8.69/11.25/13.51/14.74/16.15; AA pH 8.0 17.69/22.38/24.12/26.90/26.91/27.60; xylose
    pH 6.0 42.08/26.26/13.33/7.35/2.47 %; xylose pH 8.0 14.59/3.42/1.40 % (10/20/30 min). Left out: t = 0 (acid 0;
    xylose 100 % by definition), pH 8.0 xylose 60/120/240 min (on the axis; 60 min labelled "0"). No error bars, no n.
    ISOTOPE NOTES (not rows): Fig. 3 (120 C, pH 6.0) singly labelled acetic acid from [1-13C] 85.2 %, [2-13C] 84.5 %,
    [5-13C] 10.5 % at 240 min (end labels); text: 85-89 % from C-1 / C-2 vs 8-11 % from C-5; Fig. 4 bars (90 C 16 h
    / 120 C 4 h, pH 6 / 8): C-1 ~85/87/82/77, C-2 ~86/87/83/79, C-5 ~10/9/13/15 %. CONTRADICTIONS: abstract C-1/C-2
    77-87 % and C-4/C-5 9-15 % vs text 85-89 % / 8-11 % (different condition sets); Methods 90 C 15 h vs Fig. 4 legend
    "90 C, 16h"; text "1-deoxypento-2,4-diulose" vs Fig. 2 caption "1-deoxypento-2,3-diulose". 22 rows.'
