    in a flask (10 mL) under argon. The solution was degassed by three cycles of vacuum and argon. Finally, the
    solution was bubbled with argon (10 min) and heated in a silicone bath (90 C, 15 h).'
  notes: 'Table 1 (mmol/L, as printed): argon 30.5 +- 0.4, air 32.3 +- 3.3, 18O2 22.9 +- 0.3 unlabelled + 10.6 +- 0.2
    labelled = 33.5 +- 0.5 total; footnote CV <= 10 %; "at least in duplicate", each injected twice; +- undefined.
    SIDA (ether extract, [2H3]acetic acid 600 ug). Three pots (atmosphere is a condition the engine does not carry;
    argon is the cleanest anoxic reference). Text "about 32 mol %" / "30-33 mol %" = same table. Aldonic acids (0.7 /
    2.2 / 5.1 mmol/L) and the pH 10 17O NMR runs (no amounts) not keyed. 3 rows.'
# NOVOTNY, CEJPEK & VELISEK 2008 (Czech J Food Sci 26:117; novotny2008.pdf), read, NO ROWS, no ledger entry:
# sugars (Glc, Fru, Ara, dihydroxyacetone, glyceraldehyde) 5 mmol in 50 mL (0.1 M), refluxed 1 h, NO amine, three
# models: (1) + K2S2O8 5 mmol in water (oxidant), (2) + K2S2O8 in 0.3 M NaOH, (3) 0.05 M NaOH; 3 determinations each.
# No near-neutral, oxidant-free condition -> nothing simulable. Yields % (n/n), formic / acetic: Table 1 (K2S2O8/H2O)
# Glc 9.93/0.79, Fru 7.59/1.68, Ara 18.04/0.52, Dha 10.66/2.39, Gla 11.63/2.57; Table 2 (K2S2O8/0.3 M NaOH) 20.64/1.53,
# 13.50/1.81, 15.64/1.21, 8.76/1.97, 10.11/2.56; Table 3 (0.05 M NaOH) 5.32/11.48, 5.91/12.06, 5.65/12.45 (arabinose,
# the only pentose), 6.47/7.81, 6.69/10.64. Useful only as an alkaline, amine-free ceiling: arabinose gives ~12 mol %
# acetic and ~6 mol % formic acid in 0.05 M NaOH at reflux.
