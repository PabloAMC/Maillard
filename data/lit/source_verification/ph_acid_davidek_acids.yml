  quote: 'A solution of glycine (0.35 mmol) and D-glucose or various 13C-labeled glucose isotopomers (0.35 mmol) in a
    phosphate buffer (3.5 mL, 0.2 mol/L) was dispatched (0.4 mL) into screw-cap vials (1.5 mL, Infochroma, Zug,
    Switzerland) and thermally treated in a silicone bath (90 C, 15 h or 120 C, 4 h). Experiments were performed at
    pH 4, pH 6, and pH 8.'
  notes: 'Table 1 "Formation of Acetic Acid from Glucose/Glycine in Phosphate-Buffered (0.2 mol/L) Model Systems at 120
    C"; glucose / glycine 0.1 mol/L (Results). Units mol% -> x 1.00 mmol/L. SIDA (SPME GC-MS, [2H3]acetic acid). Printed
    +- kept as sd (not defined; at least duplicate preparations x 2 injections; footnote CV < 10 %). ND = "not
    determined" (footnote b): pH 4 at 15 / 30 min, pH 6 at 15 / 480 min, pH 8 at 480 min -> no rows. The pH 4 arm runs
    to 480 min although Methods say 4 h at 120 C (noted, kept). Text "about 1, 17, and 38 mol %" after 4 h = the
    240-min cells (counted once). Table 2 (label shares at 90 / 120 C, pH 6 / 8: C-1 67-70 %, C-2 69-71 %, C-3 4-9 %,
    C-4 5-11 %, C-5 19-25 %, C-6 19-24 %) is not a row. 13 rows.'
