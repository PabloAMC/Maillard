      standard method" with a printed standard curve ("2-furfural (y = 8.9 x 10-3 x + 2.9 x 10-1, R2 = 0.9988)") ->
      calibrated. Dicarbonyls: OPD, "10 uL of 3,4-hexanedione (86 mmol/L) as the internal standard"; GO and MGO
      standards (40 % solutions) listed, no 1-DX / 3-DX standard: 3-DX / 1-DX are semi_quantitative in fact (ledger
      'calibrated'; same issue as the Zhai papers). Duplicates (correction): CF-019 calls this a re-publication of
      Zhou 2024. It is not a re-plot: Zhou 2024 Fig. 3 (same lab, same nominal pot: Ala-ARP 20 mM, pH 8.0, 120 C,
      0-120 min) prints 3-DX ~3.7 / 4.6 / 4.9 / 5.3, 1-DX ~3.0 / 2.9 / 2.7 / 2.1, GO ~1.0 / 2.5 / 3.9 / 4.9, MGO
      ~0.5 / 0.95 / 1.05 / 1.05 mmol/L (read at 100 dpi) against 0.37 / 0.52 / 0.55 / 0.52, 0.29 / 0.17 / 0.12 /
      0.09, 0.15 / 0.19 / 0.26 / 0.31, 0.08 / 0.08 / 0.07 / 0.09 here: 7-24x lower, ratio not constant, while ARP decay
      (20 -> ~4-5 -> ~1 mM) and pH (8 -> ~4.1-4.5) agree. NEW CONFLICT (reported); the AX-ARP-alone rows carry a
      flag. Values: the ledger's 'figure_only' superseded. Figs. 1 and 2 are vector graphics; read from a 600 dpi
      render (axis ticks located in the pixels; 1 px = 1.03 umol/L in 2b-d, 0.77 in 2e, 3.15 ug/L in 1e). Text
      check: "at 120 min, the concentration of GO in the AX-ARP-Xyl model was 0.36 mmol/L higher than that in the
      AX-ARP model" vs 0.677 - 0.314 = 0.363 read. Error bars (SD of triplicates) read where they clear the marker;
      where hidden the row carries the read error only and an sd_note. AX-ARP-Xyl MGO markers are partly hidden
      behind the AX-ARP ones (centre from the visible bottom edge, +-5 umol/L). Not transcribed: pyrazines (Fig.
      1a-d, not sub-model 3), AX-ARP / Ala / A420 / pH (Fig. 3).
