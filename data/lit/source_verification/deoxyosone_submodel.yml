    quote: "The initial concentrations of AX-ARP and Xyl were both set at 20 mmol/L. The pH of each system was adjusted to 8 before transferring the solution into the pressure-resistant flask. The reaction flask was then placed in an oil bath and heated at 120 °C for predetermined durations of 30, 60, 90, and 120 min."
    notes: >-
      Conditions as the ledger: AX-ARP (N-(1-deoxy-D-xylulos-1-yl)-alanine, purified in-house) 20 mM +- xylose 20 mM,
      water, no buffer, pH 8 initial (base not stated), pressure-resistant flask, oil bath 120 C, 30-120 min; pH
