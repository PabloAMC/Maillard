      (mmol/L)", "1-DX Concentration (mmol/L)"; rows in umol/L. Quantification: "external standards were used to
      quantify the alpha-dicarbonyls", the method deferred to Zhai 2021, which says 3-DX / 1-DX were quantified with
      diacetyl as INTERNAL standard (no authentic 3-DX / 1-DX standard exists commercially): the same 100 C data
      carry two different method statements (NEW CONFLICT); class should be semi_quantitative for 3-DX / 1-DX.
      Duplicates (NEW, correction): the 100 C arms are Zhai 2021 Fig. 5's pH 7 series re-plotted: TTCA-100 3-DX
      read here 0.513 / 0.471 at 100 / 80 min vs Zhai 2021 0.51 / 0.47; 1-DX 0.0795 / 0.0614 / 0.0689 vs 79 / 61 / 69
      umol/L; +Xyl-100 3-DX 0.579 / 0.932 vs 0.57 / 0.93. Only the 120 and 140 C arms are transcribed (the 100 C arms
      count once, as zhai2021_fig5_dicarbonyls_ph_ladder pH 7). Values: the ledger's 'figure_only' (dossier read
      peaks only, 3-DX 0.82 / 1.13, 1-DX 0.11 / 0.175) is superseded: digitised from the 300 dpi embedded raster
      (page 5; 3-DX axis 0-1.5 mmol/L = rows 652-149, 1 px = 3 umol/L; 1-DX axis 0-0.25 = rows 654-157, 1 px = 0.5
      umol/L), checked on the 100 C duplicates (agree with the vector-read Zhai 2021 values within 0.5 px). Peaks
      agree with the dossier (TTCA-140 3-DX 0.811, +Xyl-140 1.124; 1-DX 0.112 / 0.175). Read errors: 3-DX +-6
      umol/L clean, +-15 to +-30 where markers stack; 1-DX +-1 clean, +-2 to +-4 stacked. Left out: both 120 C arms
      at 20 min in both panels (four markers and two 100 C markers stacked within 0.05 mmol/L; identity unresolvable).
      Error bars are mostly hidden by the markers; the two visible beyond them (+Xyl-120 60 min: 3-DX +-69, 1-DX +-8
      umol/L) are carried as sd.
