# SOURCE VERIFICATION -- sub-model 3, the deoxyosones and their fates (fit table data/lit/fit_rows/deoxyosone_submodel.yml).
# Format and the five checks: the header of data/lit/source_verification.yml. One file per sub-model so parallel
# readers never edit the same file. First reader: agent-sm3-reader1-2026-10-29, against the PDFs (data/articles/), not
# the dossiers. second_reader "pending" = NOT verified (the loader and the gate refuse it until a second reader signs).
# `notes` is an extra field: what was checked, what was corrected, and why rows were left out.
# ADJUDICATED 2026-10-29 by agent-sm3-adjudicator-2026-10-29: `adjudication` records the decision per ledger id; sources only the second
# reader chose are copied here from second/ with the adjudicator as second_reader (checked row by row against the
# paper); hofmann1998 / mikami2017 were second-read by the adjudicator; deoxyosone splits carry `split_note`.
# Digitisation: embedded rasters extracted with pdfimages (native resolution), axes calibrated on the tick marks found
# in the pixels, marker centres from morphological opening (bbox centre), overlapped markers from the dashed-line
# centres either side of the marker. Scripts and images: the first reader's scratchpad (sm3_reader1, sm3_scripts).

entries:
  - ledger_id: zhai2019_fig3b_dicarbonyls_ttca
    source_file: zhai2019.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: agent-sm3-reader2-2026-10-29
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: corrected
      duplicates: pass
      values: pass
    quote: "For the reaction between Cys and TTCA, reactants were mixed in 10 mL of deionized water in a molar ratio of Cys to TTCA of 1:1 (Cys concentration was 5 mmol/L). The solutions were adjusted to pH 7.4 with NaOH (6 mol/L) and placed at room temperature for 10 min. Then the solutions were heated in a thermostatic oil bath at 120 °C for different times (0, 10, 20, 30, 40, 50, 60 min). ... The samples without Cys addition were also prepared as a control group."
    notes: >-
      Conditions as the ledger: TTCA 5 mmol/L alone, or + Cys 5 mmol/L; 10 mL unbuffered deionized water; pH 7.4 set
      with 6 M NaOH before heating (temperature of setting not stated, presumably room temperature; never re-measured);
      120 C oil bath; vessel not stated (120 C water needs a sealed tube). Plotted 10-60 min, no t = 0 point. Units: axis
      "Concentration (umol/L)". Quantification: "derivatized with o-phenylenediamine (OPD) for detection by HPLC-DAD
      with an internal standard ... Hexanedione as an internal standard (960 ppm, 40 uL)"; the Chemicals section lists
      NO dicarbonyl reference compound (no 1-DX, 3-DX, GO standard): the absolute scale rests on an assumed equal
      response of the analyte and hexanedione quinoxalines. The ledger's 'calibrated' is not supported by the paper;
      the honest class is semi_quantitative (NEW CONFLICT, reported; the ledger is not mine to edit; until it is
      changed these rows would enter a fit as calibrated). No error bars on Fig. 3B although the methods say mean +- SD
      of three runs: errors are read errors only. Duplicates: no re-plot found (Zhai 2023 JAFC uses TTCA 10 mM, other
      temperatures); not in the conflicts register. Values: re-digitised from the 600 dpi raster (page 5; 0-300 umol/L
      = rows 2055-1327 px, 2.427 px per umol/L; 10-60 min = cols 250-1350): TTCA arm 3-DX 89.4 / 164.0 / 199.2 /
      204.4 / 228.3 / 248.7, GO 54.8 / 95.0 / 112.9 / 122.0 / 138.3 / 149.4, 1-DX 42.9 / 69.0 / 77.3 / 90.0 / 92.1 /
      98.3 (dossier 89/164/199/205/228/249, 55/95/112/121/138/149, 42/68/76/89/91/98: agree within 2). TTCA+Cys arm
      markers overlap at 10-40 min; read from the dashed-line centres either side of each marker: 3-DX at 30 min 25.3
      (dossier 30) and 40 min 31.6 (dossier 33), within the dossier's +-5. Read error +-2 umol/L for clean markers,
      +-4 umol/L for overlapped ones (expressed in the rows as dex).
    adjudication: >-
      Both readings agree (36 rows). Quantification: hexanedione IS, no dicarbonyl standard in the Chemicals list -> 
      whole ledger entry semi_quantitative (CF-062). GO kept: 55-149 umol/L, above the LOD the later method paper 
      prints (CF-061 stays open on the GO/3-DX contrast).
  - ledger_id: zhai2021_fig5_dicarbonyls_ph_ladder
    source_file: zhai2021.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: agent-sm3-reader2-2026-10-29
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: corrected
      duplicates: pass
      values: corrected
    quote: "Aqueous TTCA (10 mmol/L) model systems with the presence or absence of Xyl (10 mmol/L) were prepared and adjusted to pH 5.5, 6, 7, and 8 using NaOH (2 mol/L) or HCl (2 mol/L) and heated in a thermostatic oil bath at 100, 120, and 140 °C for various durations (20, 40, 60, 80, 100, and 120 min)."
    notes: >-
      Conditions as the ledger: TTCA 10 mmol/L +- xylose 10 mmol/L, unbuffered water, pH set with 2 M NaOH / HCl
      (pH 5.5 is "the natural pH (5.5) of the TTCA solution", not adjusted); never re-measured; 100 C only in Fig. 5;
      vessel and heat-up not stated; triplicates, error bars = SD. Units: all four y axes "Concentration (mmol/L)";
      rows in umol/L (x 1000). Quantification: "3-DX quinoxaline (3-DXqx) and 1-DX quinoxaline (1-DXqx), were
      quantitated using diacetyl as an internal standard, and MGO quinoxaline (MGOqx) and GO quinoxaline (GOqx) were
      detected using external standards." 3-DX and 1-DX have no authentic standard (diacetyl-quinoxaline response
      assumed): semi_quantitative in fact, 'calibrated' in the ledger (NEW CONFLICT, reported). MGO / GO are
      calibrated against commercial 40 % solutions. Stated limits: "MGOqx (LOD = 0.605 mg/L, LOQ = 2.405 mg/L ...)
      and GO (LOD = 1.118 mg/L, LOQ = 2.691 mg/L ...)". Every GO mean in Fig. 5d (1.10-4.79 umol/L = 0.06-0.28 mg/L
      as GO, 0.14-0.62 mg/L as GOqx) lies BELOW the stated GO LOD on either basis: Fig. 5d is not transcribed
      (correction; NEW CONFLICT with Zhai 2019 Fig. 3B, where the same lab and method report GO 55-149 umol/L from
      5 mM TTCA at 120 C, GO/3-DX 0.6 vs 0.005 here). MGO rows below the LOQ (16.7 umol/L as MGOqx; 10 of 48) are
      transcribed with a `flag`. Duplicates: none in the register; Fig. 3a / 4b (TTCA) are other ledger entries, not
      replotted here. Values: Fig. 5 is vector graphics; the dossier read the paths (pdftocairo -svg). Sample check
      against a 600 dpi render of page 5 (my pixel calibration on the 0 and top ticks): 3-DX +Xyl pH 6 120 min 1.093
      vs dossier 1.09 mmol/L; TTCA pH 6 120 min 0.929 vs 0.93; TTCA pH 5.5 120 min 0.623 vs 0.62; TTCA pH 7 120 min
      0.421 vs 0.42; +Xyl pH 8 100 min 0.260 vs 0.258; MGO +Xyl pH 8 80 min 0.0675 vs 0.0672; TTCA pH 8 60 min 0.0575
      vs 0.0574; +Xyl pH 7 120 min 0.0424 vs 0.0425: all agree. Rows = the dossier's path reads (3-DX, 1-DX, MGO;
      48 each), errors = the drawn SDs; where two series share a mean and their bars cannot be assigned (3 cells)
      the larger SD is taken; t = 0 (plotted 0, not a measurement) left out. 3-DX +Xyl pH 8 20 min is 48 +- 74
      (only the upper bar half drawn). The dossier's flag that the 1-DX SDs repeat (2.4 at eight points) is
      confirmed visually and recorded, not corrected.
    adjudication: >-
      Unit disagreement only: Fig. 5 y axes read 'Concentration (mmol/L)'; the first reading had converted to umol/L 
      (x 1000), the second kept mmol/L; both readings agree within error once harmonised; rows now in mmol_L as the 
      axis prints. GO: the first reader's exclusion upheld -- 'GO (LOD = 1.118 mg/L, LOQ = 2.691 mg/L ...)' (p. 10650) 
      vs plotted GO 1.1-4.8 umol/L (0.06-0.28 mg/L as GO): every point below the LOD on either basis (CF-061); the 
      second reader's 48 GO rows moved to adjudication_excluded. MGO stays calibrated (external standards); 3-DX / 
      1-DX split to zhai2021_fig5ab_deoxyosones_ph_ladder (diacetyl IS, semi_quantitative). The pH 7 series are the 
      first print of a series reprinted in Zhai 2023 Food Chem and JAFC (CF-066): counted here.
  - ledger_id: zhai2023foodchem_fig2_deoxyosones
