# SOURCE VERIFICATION -- sub-model 3, the deoxyosones and their fates (fit table data/lit/fit_rows/deoxyosone_submodel.yml).
# Format and the five checks: the header of data/lit/source_verification.yml. One file per sub-model so parallel
# readers never edit the same file. First reader: agent-sm3-reader1-2026-10-29, against the PDFs (data/articles/), not
# the dossiers. second_reader "pending" = NOT verified (the loader and the gate refuse it until a second reader signs).
# `notes` is an extra field: what was checked, what was corrected, and why rows were left out.
# Digitisation: embedded rasters extracted with pdfimages (native resolution), axes calibrated on the tick marks found
# in the pixels, marker centres from morphological opening (bbox centre), overlapped markers from the dashed-line
# centres either side of the marker. Scripts and images: the first reader's scratchpad (sm3_reader1, sm3_scripts).

entries:
  - ledger_id: zhai2019_fig3b_dicarbonyls_ttca
    source_file: zhai2019.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: "pending"
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: corrected
      duplicates: pass
      values: pass
    quote: "For the reaction between Cys and TTCA, reactants were mixed in 10 mL of deionized water in a molar ratio of Cys to TTCA of 1:1 (Cys concentration was 5 mmol/L). The solutions were adjusted to pH 7.4 with NaOH (6 mol/L) and placed at room temperature for 10 min. Then the solutions were heated in a thermostatic oil bath at 120 °C for different times (0, 10, 20, 30, 40, 50, 60 min). ... The samples without Cys addition were also prepared as a control group."
    notes: >-
      Conditions as the ledger: TTCA 5 mmol/L alone, or + Cys 5 mmol/L; 10 mL unbuffered deionized water; pH 7.4 set
      with 6 M NaOH before heating (temperature of setting not stated, presumably room temperature; never re-measured);
      120 C oil bath; vessel not stated (120 C water needs a sealed tube). Plotted 10-60 min, no t = 0 point. Units: axis
      "Concentration (umol/L)". Quantification: "derivatized with o-phenylenediamine (OPD) for detection by HPLC-DAD
      with an internal standard ... Hexanedione as an internal standard (960 ppm, 40 uL)"; the Chemicals section lists
      NO dicarbonyl reference compound (no 1-DX, 3-DX, GO standard): the absolute scale rests on an assumed equal
      response of the analyte and hexanedione quinoxalines. The ledger's 'calibrated' is not supported by the paper;
      the honest class is semi_quantitative (NEW CONFLICT, reported; the ledger is not mine to edit; until it is
      changed these rows would enter a fit as calibrated). No error bars on Fig. 3B although the methods say mean +- SD
      of three runs: errors are read errors only. Duplicates: no re-plot found (Zhai 2023 JAFC uses TTCA 10 mM, other
      temperatures); not in the conflicts register. Values: re-digitised from the 600 dpi raster (page 5; 0-300 umol/L
      = rows 2055-1327 px, 2.427 px per umol/L; 10-60 min = cols 250-1350): TTCA arm 3-DX 89.4 / 164.0 / 199.2 /
      204.4 / 228.3 / 248.7, GO 54.8 / 95.0 / 112.9 / 122.0 / 138.3 / 149.4, 1-DX 42.9 / 69.0 / 77.3 / 90.0 / 92.1 /
      98.3 (dossier 89/164/199/205/228/249, 55/95/112/121/138/149, 42/68/76/89/91/98: agree within 2). TTCA+Cys arm
      markers overlap at 10-40 min; read from the dashed-line centres either side of each marker: 3-DX at 30 min 25.3
      (dossier 30) and 40 min 31.6 (dossier 33), within the dossier's +-5. Read error +-2 umol/L for clean markers,
      +-4 umol/L for overlapped ones (expressed in the rows as dex).
  - ledger_id: zhai2021_fig5_dicarbonyls_ph_ladder
