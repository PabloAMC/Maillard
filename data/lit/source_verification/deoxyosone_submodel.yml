    quote: "A solution of 0.2 M phosphate buffer (pH 8.0) containing 1.8 mM HMFO was heated at 100℃ for 0.5, 1, 3, and 6 h, and then reacted with the same amount of 1.8 mM OPD solution for 5 h at 20℃."
    notes: >-
      Conditions as the ledger: pure norfuraneol (HMFO, isolated and identified by X-ray in this paper) 1.8 mM
      (Methods) / 1.7 mM (Fig. 6 caption), 0.2 M Na/K phosphate pH 8.0, "test tube with a cap ... heated ... in
      boiling water" (the general method), 0-6 h; pH not re-measured; no amine. Units: right axis "HMFO (mM)", left
