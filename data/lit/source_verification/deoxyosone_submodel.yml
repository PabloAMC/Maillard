  - ledger_id: hofmann1998_t5_fa_nf_pairs
    source_file: hofmann1998.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: "agent-sm3-adjudicator-2026-10-29"
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: corrected
      duplicates: pass
      values: pass
    quote: "An aqueous solution (100 mL) of cysteine (3.3 mmol) and the corresponding carbohydrate (10.0 mmol) was reacted at pH 5.0 in a laboratory autoclave."
    notes: >-
      Conditions as the ledger: ribose 10.0 mmol + cysteine 3.3 mmol in 100 mL phosphate 0.5 mol/L, pH 5.0 (set, not
      re-measured), 145 C, 20 min, 200 mL autoclave (Experimental: "thermally treated for 20 min at 145 °C in a
      laboratory autoclave (200 mL; Type II; Roth, Germany)"); heat-up of the autoclave not stated. Endpoint only.
      Units: "Amounts (Micrograms)" per 100 mL pot -> ug/L x 10. Quantification (the ledger's 'unknown' corrected;
      rows name the class): furan-2-aldehyde by 5-methylfurfural internal standard with a measured response factor
      0.95; NF by the labelled homologue [13C2]-HDMF with a measured response factor 0.98 ("calculated from mixtures
      containing known amounts of the analyte and the labeled standard") -> calibrated, not SIDA. This also corrects
      CF-016's second explanation ("SIDA for furfural in Hofmann 1998"): Hofmann's furfural is internal-standard,
      not SIDA. Error: footnote b of Table 1, to which Table 5 refers: "Data are mean values of triplicates and
      differed by not more than 10%"; the 10 % bound is taken as sd (second reader to confirm). Duplicates: FFT / MFT
      columns repeat Table 1 (not transcribed here); the ribose FA and NF cells are already rows of the B2.3 fit
      (ledger status in_model_fit; hofmann_ribose_FUR_insitu): a sub-model fit together with the shipped B2.3
      constants uses them twice. Values: Table 5 read from a 400 dpi render: ribose FA 67.5, FFT 12.1, NF 54530.0,
      MFT 19.8; glucose 6.9 / 2.8 / 13.5 / 1.9; rhamnose 6.2 / 0.8 / 19.1 / 0.8 (match the dossier). NF 54530 ug =
      0.478 mmol = 4.8 mol % of the ribose, consistent with the text: "NF is generated in very high yields from
      ribose/cysteine". Rows: ribose FUR and NF only (glucose and rhamnose are not pentose pots). CF-016 confirmed
      against schieberle1998.pdf Table IV (column II, footnote d: same pot): furan-2-aldehyde 52 ug / 100 mmol ribose
      = 5.2 ug per pot; its OAV column (52 / 12000 -> "<1") is internally consistent with the 52, so the 13x gap is
      not a misprint in the Schieberle concentration column alone. The FUR row carries a flag.
    adjudication: >-
      Second reading by the adjudicator against hofmann1998.pdf: Table 5 ribose FA 67.5 ug and NF 54530.0 ug per 100 
      mL pot (rows 675 and 545300 ug/L, correct); conditions 'cysteine (3.3 mmol) and the corresponding carbohydrate 
      (10.0 mmol)' in 100 mL, pH 5.0, 0.5 mol/L phosphate, 20 min 145 C autoclave (Experimental) -> PENT 100, Cys 33 
      mM, correct. Quantification confirmed: furfural vs 5-methylfurfural IS with 'An MS response factor of 0.95 ... 
      calculated from mixtures containing known amounts'; NF vs [13C2]-HDMF with response factor 0.98 -> calibrated 
      (rows name it; ledger 'unknown'). SD: footnote b 'differed by not more than 10%' taken as sd -- accepted as a 
      bound. Both rows are also B2.3 fit rows (in_model_fit): a sub-model 3 fit must not run beside the shipped B2.3 
      constants. FUR row carries CF-016.
  - ledger_id: mikami2017_fig6b_norfuraneol_decay_ph8
    source_file: mikami2017.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: "agent-sm3-adjudicator-2026-10-29"
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: pass
      duplicates: pass
      values: corrected
    quote: "A solution of 0.2 M phosphate buffer (pH 8.0) containing 1.8 mM HMFO was heated at 100℃ for 0.5, 1, 3, and 6 h, and then reacted with the same amount of 1.8 mM OPD solution for 5 h at 20℃."
    notes: >-
      Conditions as the ledger: pure norfuraneol (HMFO, isolated and identified by X-ray in this paper) 1.8 mM
      (Methods) / 1.7 mM (Fig. 6 caption), 0.2 M Na/K phosphate pH 8.0, "test tube with a cap ... heated ... in
      boiling water" (the general method), 0-6 h; pH not re-measured; no amine. Units: right axis "HMFO (mM)", left
      axis "Quinoxaline (mM)". Quantification: HMFO by RP-HPLC-DAD at 280 nm; the calibration is not described but
      the authors hold the pure crystalline compound and the plotted t = 0 (1.72 mM) recovers the prepared 1.7-1.8
      mM, so 'calibrated' stands (second reader to confirm). Quinoxalines I (MGO) and II (diacetyl) identified by
      LC-MS and "coincided with the authentic samples of quinoxalines prepared from methylglyoxal and diacetyl";
      OPD only equimolar to the initial HMFO, derivatisation yield not stated: MGO rows carry a flag. Duplicates:
      none in the register; the NF decay constant derived from these points is already declared as B61's measured
      r_nf_decay_oh constant (ledger status in_model_fit): fitting k_nf_decay on these rows while that constant
      is enabled uses them twice. Values: the 350 dpi embedded raster (page 6) re-digitised (right axis ticks every
      0.25 mM at 72.2 px, 0 at row 654): NF 1.721 / 0.634 / 0.253 / 0.00 / 0.00 mM at 0 / 0.5 / 1 / 3 / 6 h (dossier
      1.72 / 0.63 / 0.25 / ~0.02 / ~0); MGO-quinoxaline 0.0107 / 0.0036 / 0.0040 mM at 0.5 / 1 / 3 h (dossier 0.011 /
      0.004 / 0.003). Error bars read where they clear the markers: NF 0 h +-0.078, 0.5 h +-0.062, 1 h +-0.104 mM.
      Left out: NF at 3 and 6 h (plotted on zero; not log-scorable, below detection), MGO at 6 h (zero), the
      diacetyl series (DA is a trunk-only key, not a sub-model 3 species; available 0.030 / 0.063 / 0.094 / 0.046 mM).
      t = 0 NF is kept on the pot (initial_mmol_L), not as a row.
    adjudication: >-
      Second reading by the adjudicator on the 350 ppi raster (p. 6, image 0): right axis 0 at the x-axis line (row 
      754), 0.5 mM per 144.2 px; NF 1.724 / 0.635 / 0.255 mM at 0 / 0.5 / 1 h (first reading 1.721 / 0.634 / 0.253: 
      agree); MGO-quinoxaline (left axis, 3849 px per mM) 10.7 / 3.9 umol/L at 0.5 / 1 h (agree), and at 3 h the red 
      square spans rows 728-760 (centre 744, bottom half behind the HMFO diamond) -> 2.6 umol/L, not 4.0 (corrected; 
      dossier ~3). Conditions quote and pure-compound calibration confirmed. In scope: direct evidence for k_nf_decay 
      (the second reader excluded it as 'outside this brief'; the pre-registration names k_nf_decay as a constant to 
      pin). Also B61's declared measured constant: fitting k_nf_decay on these rows while B61 is enabled uses them 
      twice.
