    quote: "Model systems of TTCA (10 mmol/L) with or without the presence of extra-added Xyl (10 mmol/L) were established. The model reactions were adjusted to pH 7 ± 0.01 using NaOH solution (6 mol/L and 2 mol/L) prior to the heat treatment under 100, 120, and 140 °C for varying times (20, 40, 60, 80, 100, 120 min) which were carried out using pressure resistant bottles in the collector-type magnetic stirrer (DF-101S)."
    notes: >-
      File: data/articles/Zhai2023.pdf is Zhai et al. 2023 Food Chem 404:134420. Conditions: as the ledger, plus
      the vessel (pressure-resistant bottles, stirred) and the plotted span 0-120 min (ledger time_min [20, 120] means
      the six points 20-120); the ledger's empty condition_quote is filled here. pH 7.0 initial only; the text's
