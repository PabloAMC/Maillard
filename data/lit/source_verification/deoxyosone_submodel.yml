      0.09, 0.15 / 0.19 / 0.26 / 0.31, 0.08 / 0.08 / 0.07 / 0.09 here: 7-24x lower, ratio not constant, while ARP decay
      (20 -> ~4-5 -> ~1 mM) and pH (8 -> ~4.1-4.5) agree. NEW CONFLICT (reported); the AX-ARP-alone rows carry a
      flag. Values: the ledger's 'figure_only' superseded. Figs. 1 and 2 are vector graphics; read from a 600 dpi
      render (axis ticks located in the pixels; 1 px = 1.03 umol/L in 2b-d, 0.77 in 2e, 3.15 ug/L in 1e). Text
      check: "at 120 min, the concentration of GO in the AX-ARP-Xyl model was 0.36 mmol/L higher than that in the
      AX-ARP model" vs 0.677 - 0.314 = 0.363 read. Error bars (SD of triplicates) read where they clear the marker;
