    notes: >-
      Conditions as the ledger: AX-ARP (N-(1-deoxy-D-xylulos-1-yl)-alanine, purified in-house) 20 mM +- xylose 20 mM,
      water, no buffer, pH 8 initial (base not stated), pressure-resistant flask, oil bath 120 C, 30-120 min; pH
