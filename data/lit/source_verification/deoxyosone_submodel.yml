      the authors hold the pure crystalline compound and the plotted t = 0 (1.72 mM) recovers the prepared 1.7-1.8
      mM, so 'calibrated' stands (second reader to confirm). Quinoxalines I (MGO) and II (diacetyl) identified by
      LC-MS and "coincided with the authentic samples of quinoxalines prepared from methylglyoxal and diacetyl";
      OPD only equimolar to the initial HMFO, derivatisation yield not stated: MGO rows carry a flag. Duplicates:
      none in the register; the NF decay constant derived from these points is already declared as B61's measured
      r_nf_decay_oh constant (ledger status in_model_fit): fitting k_nf_decay on these rows while that constant
      is enabled uses them twice. Values: the 350 dpi embedded raster (page 6) re-digitised (right axis ticks every
      0.25 mM at 72.2 px, 0 at row 654): NF 1.721 / 0.634 / 0.253 / 0.00 / 0.00 mM at 0 / 0.5 / 1 / 3 / 6 h (dossier
      1.72 / 0.63 / 0.25 / ~0.02 / ~0); MGO-quinoxaline 0.0107 / 0.0036 / 0.0040 mM at 0.5 / 1 / 3 h (dossier 0.011 /
      0.004 / 0.003). Error bars read where they clear the markers: NF 0 h +-0.078, 0.5 h +-0.062, 1 h +-0.104 mM.
      Left out: NF at 3 and 6 h (plotted on zero; not log-scorable, below detection), MGO at 6 h (zero), the
      diacetyl series (DA is a trunk-only key, not a sub-model 3 species; available 0.030 / 0.063 / 0.094 / 0.046 mM).
      t = 0 NF is kept on the pot (initial_mmol_L), not as a row.
  - ledger_id: zhou2025b_figs1_3_axarp_xylose_120c
    source_file: Zhou2025b.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: "pending"
    date: 2026-10-29
