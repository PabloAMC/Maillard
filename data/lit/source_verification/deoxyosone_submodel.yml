  - ledger_id: hofmann1998_t5_fa_nf_pairs
    source_file: hofmann1998.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: "pending"
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: corrected
      duplicates: pass
      values: pass
    quote: "An aqueous solution (100 mL) of cysteine (3.3 mmol) and the corresponding carbohydrate (10.0 mmol) was reacted at pH 5.0 in a laboratory autoclave."
    notes: >-
      Conditions as the ledger: ribose 10.0 mmol + cysteine 3.3 mmol in 100 mL phosphate 0.5 mol/L, pH 5.0 (set, not
      re-measured), 145 C, 20 min, 200 mL autoclave (Experimental: "thermally treated for 20 min at 145 °C in a
      laboratory autoclave (200 mL; Type II; Roth, Germany)"); heat-up of the autoclave not stated. Endpoint only.
      Units: "Amounts (Micrograms)" per 100 mL pot -> ug/L x 10. Quantification (the ledger's 'unknown' corrected;
      rows name the class): furan-2-aldehyde by 5-methylfurfural internal standard with a measured response factor
      0.95; NF by the labelled homologue [13C2]-HDMF with a measured response factor 0.98 ("calculated from mixtures
      containing known amounts of the analyte and the labeled standard") -> calibrated, not SIDA. This also corrects
      CF-016's second explanation ("SIDA for furfural in Hofmann 1998"): Hofmann's furfural is internal-standard,
      not SIDA. Error: footnote b of Table 1, to which Table 5 refers: "Data are mean values of triplicates and
      differed by not more than 10%"; the 10 % bound is taken as sd (second reader to confirm). Duplicates: FFT / MFT
      columns repeat Table 1 (not transcribed here); the ribose FA and NF cells are already rows of the B2.3 fit
      (ledger status in_model_fit; hofmann_ribose_FUR_insitu): a sub-model fit together with the shipped B2.3
      constants uses them twice. Values: Table 5 read from a 400 dpi render: ribose FA 67.5, FFT 12.1, NF 54530.0,
      MFT 19.8; glucose 6.9 / 2.8 / 13.5 / 1.9; rhamnose 6.2 / 0.8 / 19.1 / 0.8 (match the dossier). NF 54530 ug =
      0.478 mmol = 4.8 mol % of the ribose, consistent with the text: "NF is generated in very high yields from
      ribose/cysteine". Rows: ribose FUR and NF only (glucose and rhamnose are not pentose pots). CF-016 confirmed
      against schieberle1998.pdf Table IV (column II, footnote d: same pot): furan-2-aldehyde 52 ug / 100 mmol ribose
      = 5.2 ug per pot; its OAV column (52 / 12000 -> "<1") is internally consistent with the 52, so the 13x gap is
      not a misprint in the Schieberle concentration column alone. The FUR row carries a flag.
  - ledger_id: mikami2017_fig6b_norfuraneol_decay_ph8
    source_file: mikami2017.pdf
    read_by: "agent-sm3-reader1-2026-10-29"
    second_reader: "pending"
    date: 2026-10-29
    checks:
      conditions: pass
      units: pass
      quantification: pass
