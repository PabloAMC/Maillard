      2-furfural (ug/L)"; Fig. 2b-e "(mmol/L)". Quantification: furfural by "a combined internal and external
      standard method" with a printed standard curve ("2-furfural (y = 8.9 x 10-3 x + 2.9 x 10-1, R2 = 0.9988)") ->
      calibrated. Dicarbonyls: OPD, "10 uL of 3,4-hexanedione (86 mmol/L) as the internal standard"; GO and MGO
      standards (40 % solutions) listed, no 1-DX / 3-DX standard: 3-DX / 1-DX are semi_quantitative in fact (ledger
      'calibrated'; same issue as the Zhai papers). Duplicates (correction): CF-019 calls this a re-publication of
      Zhou 2024. It is not a re-plot: Zhou 2024 Fig. 3 (same lab, same nominal pot: Ala-ARP 20 mM, pH 8.0, 120 C,
      0-120 min) prints 3-DX ~3.7 / 4.6 / 4.9 / 5.3, 1-DX ~3.0 / 2.9 / 2.7 / 2.1, GO ~1.0 / 2.5 / 3.9 / 4.9, MGO
