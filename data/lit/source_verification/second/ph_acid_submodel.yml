    L; the reactor volume drifts by NaOH addition (up to 13 mmol of 3 M = 4.4 mL, ~3 %) and by 1-2 mL aliquots per sampling
    (unstated count), not corrected. Table 5 prints the SUM of acetic + formic acid, not the two acids separately (separate
    acids only in Fig. 5 and, per conversion, Table 4). Quantification: acids by HPAEC with suppressed conductivity, external
    calibration with pure standards, duplicate analyses (calibrated); NaOH added is the pH-stat''s titrant volume x 3 mol/L.
    Errors: Fig. 5 caption, CV < 10 % for concentrations above 3 mmol/L, applied as sd = 10 % to acid rows above 3 mmol/L;
    every row also carries the table''s rounding (+/-0.05 mmol per reactor) as read_error. NaOH rows have no printed error:
    rounding only. Rows of 0.0 mmol are not transcribed (below the table''s resolution; no log residual). Phosphate pH 7 NaOH
    column is ''Data not available'' (footnote a): acid rows only. Values sample: water pH 8 1 h acids 6.6 / NaOH 5.0; phosphate
    pH 6 7 h acids 8.7 / NaOH 12.1 -- re-read against the PDF.'
