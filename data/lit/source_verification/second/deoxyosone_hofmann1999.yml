    units: 'Fig. 10 y-axis ''Amount (ug / mmol xylose)''; Eq. 1 p. 118 ''BPA = concentration (umol/mmol) x browning ability
      (CD factor)''; Table 1 CD factors 2-oxopropanal 256, glycolaldehyde 1024 (powers of two, exact). Back-calculation verified
      on glyoxal: Table 3 5 min 133/128 = 1.039 umol/mmol = 60.3 ug/mmol vs text p. 118 ''59 ug/mmol xylose'' at 5 min; and
      3-deoxypentosone 10 min 2438/256 x 132.1 = 1258 vs text p. 116 ''1260''. Loader has no per-mmol-sugar unit: converted
      to mmol_L on a declared 4.94 mL volume basis (the same basis as the pot''s PENT). Note pdftotext renders ''ug'' as ''mg'';
      the page image reads ug.'
    quantification: 'calibrated, as the ledger says. MGO: OPD derivatisation of a quarter of the cooled pot, GC-MS-CI of
      2-methylquinoxaline against [13C4]-butane-2,3-dione (as its 2,3-dimethylquinoxaline) with a measured response factor
      Rf 0.97 (a labelled homologue, not an isotopologue: the paper calls it SIDA). Glycolaldehyde: O-ethyloxime, GC-MS-CI
      against [13C4]-3-hydroxy-2-butanone, Rf 0.96 (same caveat). CAVEAT for MGO: only 2 mL x 1 mmol/L = 2 umol OPD per quarter-pot
      (read on the page image), while the quarter-pot holds far more alpha-dicarbonyl than that early on (3-DP ~9.5 umol/mmol
      x 1.5 mmol = ~14 umol at 10 min) -> derivatisation likely incomplete; MGO could be biased low at 5-40 min. Not corrected.'
