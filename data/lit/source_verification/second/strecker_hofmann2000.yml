# Second reader, Hofmann, Muench & Schieberle 2000 (J. Agric. Food Chem. 48:434-440, doi 10.1021/jf990954c): Strecker aldehydes
# and acids from L-Phe / L-Ala / L-Leu with glucose or alpha-dicarbonyls; alpha-dicarbonyls in glucose + Phe. Independent of the
# first reading (data/lit/fit_rows/strecker_hofmann2000.yml, data/lit/source_verification/strecker_hofmann2000.yml, the
# extraction dossier and ledger entries naming hofmann2000 NOT opened). Rows: data/lit/fit_rows/second/strecker_hofmann2000.yml.
# Each entry's "location" says where in the paper the ledger id's data sit, so the adjudicator can match ids to reader 1's.
# Only hofmann2000_table3_mgo_phe_timecourse was found as an id in data/lit/measurement_ledger/ on 2026-10-31 (grep count only);
# the other four ids are cited as the brief names them.
reader: agent-hofmann2000-reader2-2026-10-31
role: independent second reader, Strecker sub-model (aldehyde / acid split, dicarbonyl donors, O2, pH)
common:
  quantification_quote: 'Methods p. 435 "Quantification by Stable Isotope Dilution Assays (SIDAs). Phenylacetaldehyde, Phenylacetic
    Acid, 3-Methylbutanal, 3-Methylbutanoic Acid, and Acetic Acid. Depending on the amino acid reacted, the mixtures were spiked with
    defined amounts of the labeled internal standards [13C2]phenylacetaldehyde and [13C2]phenylacetic acid (for L-phenylalanine),
    [2H2]-3-methylbutanal and [2H2]-3-methylbutanoic acid (for L-leucine), or [13C2]acetic acid (for L-alanine) ... Quantification was
    performed by mass chromatography" / "Acetaldehyde. The reaction mixture (containing L-alanine) was spiked with a defined amount of
    the labeled internal standard [13C2]acetaldehyde ... headspace ... CI mode" / "Quantification of alpha-Dicarbonyls. 2-Hexosulose
    and 3-Deoxy-2-hexosulose ... HPLC ... 320 nm ... quinoxaline derivatives" / "Glyoxal and 2-Oxopropanal ... the internal standard
    [13C4]butane-2,3-dione ... and a methanolic solution of 1,2-diaminobenzene (2 mL; 1 mmol/L)"'
  quantification_classes_as_read: 'PA, PAA, 3-methylbutanal, 3-methylbutanoic acid, acetic acid, acetaldehyde: SIDA (isotopologue
    standards, GC-MS CI). GO, MGO: internal-standard calibrated with a DIFFERENT dicarbonyl ([13C4]butane-2,3-dione) -> calibrated,
    not SIDA. TDG, G: HPLC-UV of quinoxalines, calibration not described -> calibrated (external presumed). Phenylalanine degraded
    (Table 3): no method anywhere in the paper -> unknown.'
  errors: No SD, CV, replicate count or "mean of n" anywhere in the paper.
  buffer_contradiction: 'Methods "phosphate buffer (10 mL; 0.5 mmol/L, pH 7.0)" in both model-reaction paragraphs; Tables 1, 2, 3, 5
    footnotes "0.5 mol/L"; Table 4 footnote "0.1 mol/L". mmol/L read as a misprint (cannot buffer 100 mmol/L solutes); 0.1 vs 0.5
    mol/L for Table 4 unresolved.'
  temperature_contradiction: 'Methods and Table 3 "98 C"; Tables 1, 2, 5 "refluxed"; Table 4 "refluxed for 60 min in a closed vial";
    abstract "100 C". All pots declared 98 C.'
