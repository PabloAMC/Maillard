      quantification: "Co-heated [2H2]-FFT internal reference, as FIG. 1: corrected to calibrated with a co-heated standard."
      duplicates: "Not a copy."
      values: >-
        Buffer arm (diamond) on an axis 10x coarser than FIG. 1 (216.8 px per 5000 ng/g, 23 ng/g per px): 2 h ~180,
