  - ledger_id: zhai2023jafc_fig3_ttca_arm_volatile_grid
    source_file: Zhai2023b.pdf
    read_by: agent-sm4-reader2-2026-10-29
    second_reader: self
    date: 2026-10-29
    checks: {conditions: pass, units: pass, quantification: corrected, duplicates: corrected, values: pass}
    quote: "Figure 3. Changes in volatile flavor compounds derived from TTCA (T) and TTCA−Cys (T−C) reaction systems under different temperatures of 100 °C (a), 120 °C (b), and 140 °C (c) with the initial pH of 7.0 and molar ratio of 1:1"
    notes:
      conditions: >-
        Zhai2023b.pdf is the JAFC 71:14300 paper (DOI 10.1021/acs.jafc.3c04166). "TTCA reaction models (10 mmol/L) ...
        heated ... in appropriate pressure-resistant bottles equipped with a collector-type magnetic stirrer"; Fig. 3:
        100 / 120 / 140 C, initial pH 7.0 (NaOH), columns A / C / E / G = T-40 / 80 / 120 / 180 min. Water, no
        buffer named; volume, headspace and final pH not stated. Matches the ledger.
      units: >-
        Cells printed as numbers in the heat map (vector, legible at 600 dpi). Methods: "x ... represented the
        concentration of flavor compounds (μg/L)". Read as ug/L.
      quantification: >-
        The paper claims "quantified by the corresponding calibration curves (Table S2)". Checked independently on the
        SI: Table S2 2-methylthiazole "y = 0.0084 x ₋ 0.0521" has its zero-area point at +6.2 ug/L, yet Fig. 3a row 5
        prints 0.001 / 0.022 / 0.142 / 0.072 / 0.096 ug/L, impossible from that curve; and the same laboratory's Food
        Chem 2023 states for the same ladder "the correction factor was 1". Corrected: semi-quantitative (RF = 1);
        the ledger already says semi_quantitative. MFT curve in S2 y = 0.0039 x + 0.0011, FFT y = 0.0287 x - 0.0003
        (7.4x apart), so cross-compound ratios are not response-factor-free.
      duplicates: >-
        Column E (120 min) equals the TTCA column of Zhai 2023 Food Chem Table 1 / Kang 2026 SI Table S4 (checked:
        MFT 1.237 / 1.388 / 5.907 and FFT 3.734 / 4.107 / 11.439 at 100 / 120 / 140 C, the values CF-005 lists for
        the Kang rows). Corrected: the 120-min cells here are the same measurement as zhai2023foodchem_table1_ttca_tladder;
        that table must not also enter for MFT / FFT. NEW (not in CF-005): the 100 C columns A / C / E are ALSO copies
        of Zhai 2023 Food Chem Fig. 1a (the earlier paper's 100 C TTCA heat map, columns C / G / K): MFT 0.078 / 0.509
        / 1.237 and FFT 0.708 / 1.206 / 3.734 identical cell for cell. So at 100 C only the 180-min column G is new
        here; the 100 C 40 / 80 / 120-min cells are entered once, from zhai2023foodchem_fig1a_100c_timecourse_grid,
        and dropped from this table. The 120 and 140 C columns A / C / G are printed nowhere else.
      values: >-
        Row 8 = 2-methyl-3-furanthiol, row 13 = 2-furfurylthiol (label lists of panels a, b, c read; same order).
        T arm MFT 100 C 0.078 / 0.509 / 1.237 / 0.923, 120 C 0.432 / 0.937 / 1.388 / 2.479, 140 C 1.129 / 3.043 /
        5.907 / 4.012; FFT 100 C 0.708 / 1.206 / 3.734 / 3.119, 120 C 1.129 / 3.019 / 4.107 / 4.279, 140 C 5.079 /
        12.439 / 11.439 / 4.906 ug/L at 40 / 80 / 120 / 180 min. No SD printed ("performed three times"). FFT at 140 C
        peaks by 80 min and falls 2.5x by 180 min; MFT at 100 and 140 C falls after 120 min. Row 29 is printed
        "Bis(2-furfuryl)sulfide" (a sulfide, not the disulfide): not transcribed.
