  - ledger_id: gigl2021_fig2_fig4_coffee_melanoidin_fft_binding
    source_file: gigl2021_supplementary.pdf
    read_by: agent-sm4-reader2-2026-10-29
    second_reader: self
    date: 2026-10-29
    checks: {conditions: corrected, units: corrected, quantification: pass, duplicates: pass, values: pass}
    quote: "After 96 h of incubation at RT, no free FFT could be observed in the spectrum (Table S2). However, in contrast to other tested odorants, newly generated signals were detected in the 1H NMR spectra of FFT at longer incubation times (Figure 3A). By means of spiking experiments, these additional signals could be identified as difurfuryldithiol, the dimer of FFT"
    notes:
      conditions: >-
        gigl2021.pdf methods: NMR tube, "NMR buffer (60 μL), HMW fraction (150 μL, concentration × 4), and odorant
        stock solution ... filled to 600 μL"; buffer = KH2PO4 10.2 g + KOH 1.5 g in 50 mL D2O, pH 5.5 (DCl), i.e.
        ~0.15 M phosphate in the tube; odorant "defined amounts ... (5 mmol/L)"; 300 K probe (RT), 5 min - 96 h. Only
        the RT series is printed (SI Table S2); the 279 / 333 K runs are figure-only. Corrected: the ledger's
        "temperature_c [6, 27, 60]" spans the figure, the printed series is 27 C only; and the medium is a melanoidin
        matrix, not a heated pot (needs the matrix layer).
      units: >-
        SI Table S2 "Percent of free odorant at incubation time (min)", relative to the qHNMR concentration of the
        melanoidin-free reference. Corrected to mmol/L as % x 5 mmol/L nominal (the reference concentration itself is
        not printed per sample; nominal 5 mmol/L used).
      quantification: "qHNMR, ERETIC 2 / PULCON against external L-tyrosine 5.21 mmol/L: absolute (calibrated)."
      duplicates: "Fig. 2 heat map plots the same numbers (Table S2 is \"used for hierarchical cluster analysis and heatmapping\"): enter once, from S2."
      values: >-
        Raw-text SI p. 3: "2-furanmethanethiol 100.0 32.3 32.3 32.2 32.3 31.3 27.0 23.3 15.3 0.0" at 1 / 5 / 30 / 60
        / 120 / 240 / 720 / 1440 / 2880 / 5760 min. The 1-min column is the 100 % reference (every compound 100.0),
        not a measurement: not transcribed; 5760 min = 0.0 (not detected): not transcribed. No SD printed. The
        ~68 % drop within 5 min, then a slow loss with the disulfide appearing, is the two-stage (binding, then
        dimerisation) shape the rival arms must separate.
