# SOURCE VERIFICATION, sub-model 4 (thiol formation and loss): the INDEPENDENT SECOND READING.
# Reader: agent-sm4-reader2-2026-10-29. Read against the papers and supplements in data/articles/ (pdftotext -layout,
# textutil for .docx); dossiers were used only to find the data sets, never for values or verdicts.
# Format and checks as in the header of data/lit/source_verification.yml (conditions, units, quantification,
# duplicates, values; verdicts pass / corrected / fail). `notes` gives the reason per check.
entries:
  - ledger_id: schieberle2000_t4_100c_time_course
    source_file: schieberle2000.pdf
    read_by: agent-sm4-reader2-2026-10-29
    second_reader: self
    date: 2026-10-29
    checks: {conditions: corrected, units: pass, quantification: pass, duplicates: pass, values: pass}
    quote: "Ribose (10 mmol) and cysteine (3.3 mmol) were reacted in phosphate buffer (100 mL; 0.5 mol/L; pH 5.0) at 100°C in a laboratory autoclave."
    notes:
      conditions: >-
        Table IV footnote (p. 141) gives the pot: ribose 100 mmol/L, cysteine 33 mmol/L, phosphate 0.5 M, pH 5.0,
        100 C, closed laboratory autoclave; headspace / fill not stated; pH not measured during or after. Corrected:
        the ledger's condition_quote is empty; the quote above fills it.
      units: >-
        "Amount (ug) formed after 30 / 60 / 360 / 720 min at 100 C", per the 100 mL pot: ug per pot x 10 = ug/L.
      quantification: >-
        Not stated for Table IV itself ("Hofmann and Schieberle, unpublished", ref. 16 "to be submitted"). The same
        chapter states for the 145 C pots (Table III) "the concentrations of 15 key odorants were determined by stable
        isotope dilution assays", and p. 140 compares Table IV with Table III as yields of the same assay ("by a factor
        of 13 higher yields of e.g., 2-methyl-3-furanthiol"). SIDA by inference from the laboratory and the
        comparison, not by a printed statement; no replicate count, no SD.
      duplicates: >-
        No other print of the 100 C time course found (CF-006 reaches the same conclusion; Table III is the Hofmann
        1998 145 C pot, not this one). Not a copy.
      values: >-
        All 8 MFT / FFT cells transcribed from the table: MFT 4.5 / 13.8 / 156 / 179, FFT 2.0 / 3.1 / 110 / 132 ug per
        pot. Finding: the text's "factor of 13" (100 C 6 h vs 145 C 20 min, MFT) does not reproduce: Table III MFT 198
        ug/L "based on 33 mmol of cysteine and 100 mmol of the carbohydrate" = 19.8 ug per 3.3 mmol pot, and 156 / 19.8
        = 7.9 (179 / 19.8 = 9.0 at 12 h). Any row built on the x13 should use the table, not the sentence.
  - ledger_id: us10076126_fig1_mft_time_course
    source_file: US10076126.pdf
    read_by: agent-sm4-reader2-2026-10-29
    second_reader: self
    date: 2026-10-29
    checks: {conditions: corrected, units: pass, quantification: corrected, duplicates: pass, values: pass}
    quote: "For each solvent, 75 mg of xylose (Fluka) and 60 mg of L-cysteine (Fluka) were weighed into 2.0 g of the solvent in a series of glass vials, together with an internal reference of labeled [2H2]-2-methyl-3-furanthiol ... The vials were then heated to 110° C. in an oil bath for periods between 30 minutes and 4 hours"
    notes:
      conditions: >-
        Example 1, arm C "an aqueous phosphate buffer at pH 5.5": xylose 0.500 mmol + cysteine 0.495 mmol in 2.0 g
        buffer = 250 / 248 mmol per kg of solvent (0.234 / 0.232 mol/kg of the 2.135 g mixture); buffer strength,
        vial volume / headspace and replicates NOT printed; crimped vials, oil bath 110 C, 0.5-4 h. Corrected: the
        table carries per-litre-of-solvent concentrations (density 1 assumed), not the ledger's rounded "~0.25".
      units: "FIG. 1 axis \"ng/g Reaction Mixture\" vs \"Hours\"; transcribed as ug_kg (= ng/g), times in min."
      quantification: >-
        Labelled [2H2]-MFT and [2H2]-FFT (aromaLAB) added BEFORE heating, then HS-SPME-GC-MS: an isotope-dilution
        assay on paper, but the standard was heated with the pot for the whole hold, so the ratio reads formed MFT
        over SURVIVING standard and inflates with time if the standard degrades. Corrected: class sida in name only;
        treat as calibrated with a co-heated standard (time shape biased upward at long holds).
      duplicates: "No other print; US 8,920,862 is a different experiment (3:1, 95 C, 6 h). Not a copy."
      values: >-
        Buffer arm = the open diamond, the lowest curve, as the text says ("both glycerol and the combination of
        glycerol and choline chloride produced more MFT and FFT than the aqueous buffer"). Digitised at 300 dpi
        against the 500-ng/g gridlines (193.3 px per 500 ng/g): 16 / 122 / 578 / 1862 ng/g at 0.5 / 1 / 2 / 4 h, read
        error ~10 ng/g (4 px). Other arms not transcribed (non-aqueous solvents).
