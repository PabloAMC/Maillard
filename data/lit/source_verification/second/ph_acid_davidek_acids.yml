  notes: 'Conditions: xylose + glycine 0.1 mol/L each (0.35 mmol in 3.5 mL), phosphate 0.2 M (Na), pH 6.0 / 8.0 (where measured not
    stated), 0.4 mL in 1.5 mL screw-cap vials, 120 C, 0-240 min. Units: left axis "Residual xylose (%)" 0-100, right axis "Acetic acid
    (mol%)" 0-60 sharing gridlines (1 % left = 0.6 mol% right). Conversion to mmol/L is unambiguous because the pot is equimolar
    at 100 mmol/L: 1 mol% = 1.0 mmol/L whichever reactant is the reference; residual xylose % = mmol/L of 100. Digitised (raster):
    AA pH 6 at 15, 30, 60, 120, 240 min = 8.69, 11.25, 13.51, 14.74, 16.15; AA pH 8 at 10, 20, 30, 60, 120, 240 = 17.72, 22.37, 24.10,
    26.89, 26.89, 27.59; xylose pH 6 at 15, 30, 60, 120, 240 = 42.1, 26.2, 13.4, 7.35, 2.44 %; xylose pH 8 at 10, 20, 30 = 14.6, 3.42,
    1.40 %; pH 8 xylose at 60, 120, 240 on the zero line (the 60-min marker labelled "0" by the authors; centre reads +0.2 %) -- left
    out as zeros. t = 0: AA 0 (left out), xylose 100 % (normalisation, left out). The two series have different time grids (pH 6 has
    15 min, pH 8 has 10 and 20 min). Text yields: 16 and 28 mol% are the 240-min (4 h) points of Fig. 1, also printed in the figure
    as data labels "16" and "28" next to the 240-min markers: the same numbers, not new data; keyed once (as the digitised Fig. 1
    points; read 16.15 / 27.59, consistent with the rounded labels). Fig. 1 is the 120 C set only; no amounts at 90 C anywhere in the
    paper (Figs. 3-4 are labelling percentages).'
