reader: agent-hofmann2000-fig2-2000b-reader2-2026-10-31
role: independent second reader, Strecker sub-model (fed Amadori vs glucose + Phe, argon / air / Cu; Amadori transient)
common:
  quantification_quote: Methods p. 4301 "Quantitation of Phenylacetaldehyde and Phenylacetic Acid by Stable Isotope Dilution Assays ... spiked
    with defined amounts of the labeled internal standards [13C2]-phenylacetaldehyde and [13C2]-phenylacetic acid" / p. 4302 "Quantification
    of L-Phenylalanine and N-(1-Deoxy-D-fructosyl)-L-phenylalanine. The reaction mixtures were diluted with water, filtered over a membrane
    (0.45 um), and then analyzed by means of an amino acid analyzer Type 3000 (Biotronic, Maintal, Germany). After postcolumn derivatization
    with ninhydrine, the reaction products were determined photometrically at 570 or 440 nm, respectively."
  errors: No SD, CV, replicate count or 'mean of n' anywhere in the paper.
  buffer_contradiction: Methods "Reaction Mixtures" print "phosphate buffer (1 mL; 0.5 mmol/L, pH 7.0)" with 0.1 mmol precursor; Tables 1-3
    footnotes print "(10 mL; 0.5 mol/L, pH 7.0)" with 1.0 mmol. Same 100 mmol/L precursor either way; 0.5 mmol/L cannot buffer 100 mmol/L
    solutes, read as a misprint for mol/L.
