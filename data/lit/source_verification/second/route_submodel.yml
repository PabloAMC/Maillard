      values: "Read by this reader at 500 dpi (dossier has fit lines only): xylose ln -0.77 / -1.23 / -1.56 / -1.82 / -2.18 / -2.44 / -3.13 / -3.49, cysteine -0.68 / -1.10 / -1.37 / -1.70 / -2.00 / -2.30 / -3.25 / -3.91 at 5-50 min. FLAG: the printed fit lines do not reproduce the plotted points: least squares on these points gives k_Xyl 0.061 (printed 0.073) and k_Cys 0.072 /min, intercept -0.30 (printed 0.059, -0.760); the drawn dashed lines match the printed equations, the markers sit off them systematically. The points, not the printed k, are transcribed."
      errors: "No SD read (bars hidden by markers); read error 0.08 (Xyl) and 0.06 (Cys) ln units."
    quote: "Ln (C/C0) of xylose and cysteine with reaction times along with the fitted linear equations, where the slopes indicated reaction rate constants. Note. C0 and C are the concentration of original reaction solution and that at certain reaction time"

