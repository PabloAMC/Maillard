# SOURCE VERIFICATION, sub-model 2 (the cysteine-pentose route): SECOND, INDEPENDENT READING.
# Reader: agent-sm2-reader2-2026-10-29. Each data set checked against the paper (PDF text layer, figures re-read from the
# raster or, where the figure is vector, from its drawing paths). Dossiers used only for figure values the paper does not
# print, and every such value was spot-checked against the figure. Checks as in data/lit/source_verification.yml.
# The draft table is data/lit/fit_rows/second/route_submodel.yml.

inventory:
  rule: >-
    Every ledger entry with a time series or dose series of TTCA, the cysteine Amadori compound, free cysteine, the pentose or
    a pentose Amadori compound in a pentose + cysteine system (TTCA alone counts: it is the pentose-cysteine condensate).
    Selected = simulable, absolute concentrations, conditions stated. Within a data set only the arms the route can
    simulate are taken (blank arms; no competing amine or aldehyde).
  selected:
    - {id: cao2017_fig5_ttca_cama_glyarp, why: "Xie lab; the one pot with TTCA formation and its Amadori isomer from Cys + Xyl, blank arm"}
    - {id: cao2017_fig4ab_cys_xyl, why: "same pot: free Cys and Xyl"}
    - {id: zhao2017b_fig2abde_xyl_cys_ttca_cama, why: "Xie lab sibling run of Cao's blank pot, different TTCA/CAMA assay; blank arm"}
    - {id: zhang2025b_fig2abc_ttca_cama_lysarp, why: "Xie lab, 40 mM, 0.2 M phosphate pH 6.5, 120 C; blank arm"}
    - {id: zhang2025b_fig2dh_rate_fits, why: "same pot: free Cys and Xyl, plotted as ln(C/C0); blank arm"}
    - {id: zhai2019_fig3a_ttca_cama, why: "Jiangnan; the only TTCA/CAMA formation ladder (70-130 C) from free Xyl + Cys, unbuffered"}
    - {id: zhai2021_fig3a_ttca_tladder, why: "TTCA decay, 100/120/140 C, natural pH 5.5"}
    - {id: zhai2021_fig4b_ttca_ph_ladder, why: "TTCA decay vs pH 5.5-8 at 100 C, +/- xylose (the route's pH test)"}
    - {id: zhai2021_fig6_cys_xyl, why: "free Cys released from TTCA (pH 5.5-8, +/- Xyl) and Xyl in TTCA + Xyl: the reverse step measured directly"}
    - {id: zhai2023foodchem_fig3_cys_da_mgo_go, why: "free Cys released from TTCA +/- Xyl at 120 and 140 C, pH 7"}
    - {id: zhai2023jafc_fig5_arp_dicarbonyls, why: "Cys-Amadori from TTCA +/- Cys at 100/120/140 C, pH 7, 20-180 min"}
    - {id: vanseeventer2001_text_precursor_conversion_130c, why: "third laboratory (Quest); residual Cys and ribose, 0.5 M phosphate pH 5, 130 C (endpoint)"}
  read_and_rejected:
    - {id: kang2026_si_fig_s3_cys_release_from_ttca, why: "a copy: same points as Zhai 2023 Food Chem Fig. 3a TTCA arm (and its 100 C series = Zhai 2021 Fig. 6a pH 7)"}
    - {id: deroos2005_fig4_xylulose_cysteine_ph_stability, why: "a drawn curve without markers, % left after 2 h, concentration and assay not stated"}
  not_selected:
    - {id: zhao2017b aldehyde arms / cao2017 glycine arms / zhang2025b lysine arms, why: "need an amine (or aldehyde) + xylose step outside sub-model 2; Cao x8-x24 arms also physically implausible (CF-053). Candidates for a later competition test"}
    - {id: zhou2022_fig1_arp_cys_ala_dicarbonyls, why: "alanine-xylose Amadori + Cys, no free pentose, no TTCA/CAMA measured: the ARP feed, not this route"}
    - {id: zhou2023c_fig3_gsh_degradation_products, why: "glutathione, not cysteine"}
    - {id: wang2022_fig4_cys_cama_uv_120c, why: "Cys and CAMA as uncalibrated ELSD peak areas (figure_only, quant class other)"}
    - {id: wang2026_fig5_temperature_ladder / wang2026_fig7_time_series / wang2026_fig2_ph_series, why: "Cys-Amadori as peak area, pH and quantification never stated"}
    - {id: deroos2005_fig1_thiazolidine_cysamadori_chromatograms, why: "chromatograms, no concentrations"}
    - {id: deroos2005_text_yields_continuous_reactor, why: "text yields, 20-40 % water batch and a resin column: not simulable"}
    - {id: zhai2023c_fig5_vacuum_dehydration, why: "vacuum dehydration (water removed): not simulable as a closed pot"}
    - {id: zhai2023c_text_ttca_cama_consumption_times / zhai2020_text_ttca_arp_proportion_spray_drying, why: "text only"}
    - {id: kang2026_fig2_storage_ttca_cama / kang2026_si_table_s6_storage_retention, why: "storage at 4-40 C for days; outside the heated-pot frame (a candidate out-of-condition check)"}
    - {id: zhang2022_fig2_fig4_xyl_cys_oil_water, why: "single endpoint, semi-quantitative, charge printed inconsistently ('0.4 mol' in 10 mL)"}
    - {id: raza2020_tab3_gsh_yeast_extract_rsm, why: "yeast-extract matrix, time not stated"}
    - {id: hou2017_*, zhao2019_*, zhang2023b_*, brehm2020_*, cerny2013_*, why: "no time or dose series of a route species"}
  gaps_found:
    - "Zhai 2020 (zhai2020.pdf) Fig. 2 prints TTCA and ARP yields vs time for the atmospheric (control) pot at 90 C, pH 7.4: a route time series with no ledger entry (yields in %, would need the charge to convert; may re-plot Zhai 2019 Fig. 1B)."

entries:
  - ledger_id: cao2017_fig5_ttca_cama_glyarp
    source_file: cao2017.pdf
    read_by: agent-sm2-reader2-2026-10-29
    second_reader: self
    date: 2026-10-29
    arms_used: [blank]
    checks: {conditions: pass, units: pass, quantification: pass, duplicates: pass, values: pass}
    notes:
      conditions: "Cys 2 mmol + Xyl 2 mmol in 5 mL 0.2 M phosphate pH 5.5 = 400 + 400 mmol/L; 15 mL sealed pressure vial, stirred, 90 C, 0.5-5 h. pH measured after heating with a PHSJ-5 meter (Fig. 4c, 5.49 -> 4.15 in the blank). Accepted manuscript, not the version of record."
      units: "Fig. 5 axis 'Concentration (mol/L)'; transcribed as mmol/L (x1000)."
      quantification: "LC-MS SIM, external standards of synthesised TTCA and Cys-Amadori (>98-99 %), calibrations printed (TTCA y = 72.398x + 0.613; Cys-Amadori y = 57.752x - 0.132; 0.05-0.5 mol/L). TTCA and Cys-Amadori share m/z 254/236 (retention only); Cys-Amadori at 0.5 h (0.006 M) is below the lowest standard."
      duplicates: "Zhao 2017b's blank is a sibling run (same lab, recipe, Cys/Xyl calibration) but a different TTCA/CAMA assay (HPLC-ELSD) and different values (CAMA 30-40 % lower): not a copy."
      values: "All 12 blank points re-read on the page-36 raster: TTCA 0.356 / 0.338 / 0.290 / 0.268 / 0.254 / 0.236, CAMA 0.006 / 0.063 / 0.090 / 0.106 / 0.109 / 0.133 mol/L agree within 0.005."
      errors: "Printed 'RSD ... all less than 10%' used as sd = 10 % of value, plus the 0.005 mol/L read error."
    quote: "The amounts of cysteine and xylose used in the reaction models were both 2 mmol in 5 mL of phosphate buffer (0.2 M, pH 5.5)."

