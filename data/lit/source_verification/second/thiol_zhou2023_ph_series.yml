      bars are taken as SD, n = 3.
    duplicates: No numeric print of the final pH anywhere in the paper or SI. The text states only orderings (final pH
      below initial; at initial pH 7 ARP + Cys significantly lower than ARP; at initial pH 8 ARP + Cys not lower than ARP),
      all consistent with the digitised bars and the letters (ARP b / b / c; ARP+Cys a / a / c).
