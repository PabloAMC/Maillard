    (10.0 mmol) was reacted at pH 5.0 in a laboratory autoclave"; methods "phosphate buffer (0.5 mol/L) at pH 3.0, 5.0,
    or 7.0 and thermally treated for 20 min at 145 C in a laboratory autoclave (200 mL; Type II; Roth, Germany)" = Cys 33
