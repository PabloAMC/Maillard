# SOURCE VERIFICATION -- sub-model 4, thiol formation and loss (fit table data/lit/fit_rows/thiol_submodel.yml;
# frame: results/validation/kinetic_core_thiol_submodel_prereg.md).
# Format and the five checks: the header of data/lit/source_verification.yml. One file per sub-model so parallel
# readers never edit the same file. First reader: agent-sm4-reader1-2026-10-29, against the PDFs / SI (not the
# dossiers). second_reader "pending" = NOT verified (the loader and the gate refuse it until a second reader signs).
# `notes` is an extra field: what was checked, what was corrected, and why rows were left out.
# Quantification matters most here: SIDA (isotope dilution) and external calibration give absolute levels;
# a single internal standard with response factor 1 ("semi_quantitative") gives within-compound shape only.

