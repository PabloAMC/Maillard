    quote: "VOCs were semi-quantified using cyclohexanone as an internal standard based on peak area ratios under the assumption of equal response factors among analytes."
    notes: >-
      Conditions (Wang2026b.pdf sec. 2.2): "D-Xylose (0.300 g) and L-cysteine (0.242 g) were dissolved at a 1:1 M ratio
      in 10 mL of 0.2 mol/L sodium dihydrogen phosphate buffer (pH 5.5) ... transferred into a 15 mL pressure-resistant
      thick-walled container and heated in a thermostatic magnetic stirring oil bath ... at 120 C for 60, 90, 120, or
      150 min. Then the MRPs were cooled immediately" = xylose 200 mM + cysteine 200 mM (2.0 mmol each in 10 mL),
      fill 10 of 15 mL (5 mL air headspace, not purged), stirred. Label pH 5.5; temperature of pH setting not stated;
      pH falls with time (Fig. 1A, not transcribed here). Each time point is a separate pot (one vessel per time).
      Units: SI Table S1 "Semi-quantitative concentration (ng/mL)" = ug/L exactly (relabel, no conversion).
      Quantification: HS-SPME (3 mL in 20 mL vial, 20 uL of 100 ug/mL cyclohexanone IS, 60 C), C = A_TC x M_IS /
      (A_IS x V_S): response factor 1 -> semi_quantitative (ledger agrees). Errors: mean +/- SD, "three independent
      replicates, which referred to independently prepared reaction batches" (sec. 2.6). Duplicates: main Table 1
      (OAVs = S1 / threshold) and Fig. 4A (plot of S1) are copies of this table within the paper (count once; this is
      the original numbers). No other paper prints these data. Values: all thiol / disulfide / furfural cells read from
      the docx and equal to the ledger note: MFT 543.73 +/- 124.61, 1830.61 +/- 191.56, 1877.38 +/- 47.22,
      2407.32 +/- 420.60 at 60 / 90 / 120 / 150 min; FFT 274.58 +/- 7.72 ... 2120.24 +/- 93.03; bis(2-methyl-3-furyl)
      disulfide 3730.50 ... 8722.94; difurfuryl disulfide ND at 60, 142.97 / 266.02 / 480.59 at 90-150 (its
      relative-abundance cell at 60 min is blank, not shifted); furfural 255.22 ... 423.35. MRPs-0 cells are "ND"
      (left-censored, no LOD printed): not transcribed. The mixed disulfide (2-furfuryl 2-methyl-3-furyl disulfide)
      is transcribed under a species name the engine does not carry (see the fit table header). Laboratory: the
      ledger's lab field says "affiliation not given in dossier"; the paper gives "SKL of Marine Food Processing &
      Safety Control ... Dalian Polytechnic University" (Lin S / Chen D) -- the ledger owner should set it, since the
