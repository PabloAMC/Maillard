    and Schieberle 2000 Table III; this is the original, the reprints are not read. Within the paper: Table 2''s pH 5.0
    column and Table 5''s FFT / MFT columns repeat these cells (not transcribed twice). Values: ribose 12.1 / 19.8, xylose
    9.6 / 14.3, fructose 3.2 / 2.5, glucose 2.8 / 1.9 (FFT / MFT, µg). Glucose-6-phosphate, rhamnose and maltose rows not
