# Martins & van Boekel -- glucose/glycine multiresponse kinetics at 100 C, pH 6.8
# NOTHING IN THIS FILE IS WIRED INTO THE MODEL OR THE CALIBRATION. Data only.
source:
  citation: "Martins, S.I.F.S. & van Boekel, M.A.J.S. (2005) A kinetic model for the glucose/glycine Maillard reaction pathways. Food Chemistry 90(1-2):257-269."
  doi: "10.1016/j.foodchem.2004.04.006"
  doi_verified: "resolved via api.crossref.org 2026-08-27: title/journal/volume/pages/authors all match"
  primary_source_used: "Martins, S.I.F.S. (2003) Unravelling the Maillard reaction network by multiresponse kinetic modelling. PhD thesis, Wageningen University, 170 pp. ISBN 90-5808-823-5. Chapter 5, Figure 5.9 (thesis p. 116 = PDF page 126)."
  primary_source_url: "https://edepot.wur.nl/121418"
  access: figure_readoff
  retrieved: 2026-08-27
  isbn_correction: "the ISBN was recorded as 90-5808-923-4; the thesis colophon (PDF page 4) prints 90-5808-823-5. Corrected 2026-08-27. The '170 pp' in the citation is correct and is printed on the same page."
  page_mapping_verified: "PDF page 126 carries the printed page number 116 and Figure 5.9, exactly as claimed."
system:
  reactants: {glucose: 0.2 M, glycine: 0.2 M}
  conditions:
    T_C: 100
    pH: 6.8
    pH_note: "initial pH; the paper reports that pH drops during heating (the effect of pH is concealed in the rate constants). pH was NOT controlled in this experiment."
    buffer: "phosphate, 0.1 mol/L"
    matrix: aqueous
    vessel: "screw-capped glass tubes (Schott 16 x 160 mm), 10 mL, oil bath"
    filtration: "solutions filtered 0.2 um before heating"
  replication: "each reaction mixture prepared, heated and analysed in at least duplicate (thesis Materials & Methods, Chapter 5). Figure 5.9 shows up to 3 markers per time point."
  conditions_verified: >-
    VERIFIED 2026-08-27 verbatim against the thesis Materials and Methods (printed p. 33 =
    PDF p. 42), "Preparation of reaction mixtures (Chapter 5)": "Equimolar solutions of
    glucose and glycine (0.2mol/L) were prepared in phosphate buffer (10 mL, 0.1 mol/L,
    pH 6.8), filtered (0.2 um, Schleicher & Schuell) and heated at 80, 90, 100, 110 and
    120 C in an oil bath, in screw-capped glass tubes (Schott, 16 x 160 mm). ... Each
    reaction mixture was prepared, heated and analysed in at least duplicate." Reactant
    concentrations, buffer, pH, filtration, vessel, volume, heating method and replication
    are all confirmed. The independent marker census below shows the replication was in fact
    3-fold, not merely duplicate.
extraction:
  method: vector_coordinate_extraction
  method_note: >-
    The figures in the thesis PDF are VECTOR graphics, not raster images. Each plotted
    marker is a distinct path in the PDF content stream. The marker centres were read
    directly out of the content stream and mapped to data coordinates with a linear
    calibration anchored on the plot-area frame, which was independently confirmed by the
    axis tick-mark coordinates (agreement better than 0.15 pt on every axis). This is far
    more precise than eyeball read-off but it is STILL A FIGURE READ-OFF, not a table:
    it recovers where the authors' plotting program placed the marker, not the number in
    the authors' spreadsheet.
  x_axis_note: >-
    Extracted marker x-coordinates cluster at 0.0, 15.0-15.5, 29.4-30.0, 44.8-45.4,
    59.3-59.8, 89.2-90.5, 119.1-120.4 and 149.7-150.5 min. They are reported below on the
    nominal grid 0/15/30/45/60/90/120/150 min. The thesis does not tabulate the sampling
    times; the grid is inferred from the marker positions (spread <= 1.1 min).
  estimated_uncertainty: "+/- 0.3% of each panel's full scale from calibration and marker centring, PLUS whatever rounding the authors' plotting program applied. Cross-checks below suggest the true error is under 1%."
  cross_checks:
    - "glucose and glycine at t=0 recover 198.3-199.9 and 199.8-201.8 mmol/L against a known charged concentration of 200 mmol/L (0.2 M) -- i.e. within 1%."
    - "the same experiment is replotted in thesis Figure 5.10 (100 C series). Independently extracting that figure gives glucose 183.3/190.2 at 15 min (vs 183.3/190.0 here), 169.3/172.2/179.0 at 30 min (vs 170.0/173.2/179.9), 167.9/169.3 at 45 min (vs 166.6/168.4), 153.9/156.8/158.2 at 60 min (vs 153.2/156.7/158.3) -- agreement ~1 mmol/L on a 250 mmol/L scale."
  replicate_note: >-
    Every DISTINCT marker position is listed. Where two or three replicate markers were
    drawn at exactly the same coordinates they cannot be separated and appear once, so the
    number of values at a time point is a LOWER BOUND on the number of replicates. Values
    within one time point are NOT averaged.
  symbol_legend_source: "Figure 5.9 caption, read at 500 dpi: A glucose (open diamond), glycine (plus); B fructose (filled triangle), DFG (open circle), methylglyoxal (open square); C formic acid (cross), acetic acid (filled diamond); D 1-deoxyglucosone (filled circle), 3-deoxyglucosone (open triangle); E melanoidins (asterisk)."
  melanoidin_basis: "melanoidins are reported by the authors in mmol/L via an extinction coefficient of 0.64 +/- 0.03 L.mmol-1.cm-1 at 470 nm (thesis section 3.3); they are an absorbance-derived quantity, not a directly measured molar concentration."
  axis_ranges_verified: >-
    VERIFIED 2026-08-27 against the retrieved figure. The printed axis labels of Figure 5.9
    are A: 0-250 mmol/L, B: 0-20 mmol/L, C: 0-18 'Acids mmol/L', D: 0-0.8 'DG mmol/L',
    E: 0-10 'Mel mmol/L', all against Time 0-200 min. Every panel range asserted in the
    series below is correct. The plot frames and tick marks in the content stream confirm
    the same ranges to better than 0.05 pt.
  symbol_assignment_verified: >-
    The Figure 5.9 caption in the retrieved PDF reads: "A: Glucose (diamond), Glycine (+);
    B: Fructose (filled triangle), N-(1-deoxy-D-fructos-1-yl)-glycine (open circle),
    methylglyoxal (square); C: Formic acid (.), Acetic acid (.); D: 1-deoxyglucosone (.),
    3-deoxyglucosone (open triangle); E: Melanoidins (.)" -- several marker glyphs do not
    survive text extraction. Independent path-geometry classification finds exactly the
    shapes the caption implies: panel B holds triangles, circles and squares; panel C holds
    crosses and diamonds; panel D holds circles and triangles; panel E holds only asterisks.
    Panels B, D and E are therefore pinned by the caption alone. THE ONE ASSIGNMENT THE
    CAPTION CANNOT SETTLE IS PANEL C, formic vs acetic acid. It is settled by the thesis
    body, printed p. 109: "acetic acid was always formed in higher concentrations than
    formic acid" and, of the glucose that degraded, the larger share "was acetic acid whereas
    only 5% was formic acid"; thesis p. 122 repeats "the low amount of formic acid detected
    relatively to acetic acid at pH 6.8". The larger series (reaching 13.57 mmol/L) is
    therefore acetic acid and the smaller (reaching 2.77) is formic acid, as assigned here.
  melanoidin_basis_verified: >-
    Confirmed verbatim. The thesis states the melanoidin extinction coefficient for the
    glucose/glycine system "was calculated to be 0.64 +/- 0.03" l.mmol-1.cm-1 at 470 nm
    (printed p. 52), and Chapter 3 uses it to convert absorbance to mmol/L (printed p. 37:
    "0.64 +/- 0.03 l.mmol-1.cm-1 at 470 nm. (See section 3.3) The concentration of melanoidins
    is thus ..."). The caveat that melanoidins here are an absorbance-derived quantity stands.
