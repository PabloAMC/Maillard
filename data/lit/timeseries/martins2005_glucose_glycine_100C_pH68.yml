file_verification:
  status: verified_figure_shape
  date: 2026-08-27
  wave: Q
  summary: >-
    ALL 183 POINTS INDEPENDENTLY RE-EXTRACTED AND REPRODUCED EXACTLY. No data value in this
    file required correction. One metadata error was found and fixed (the ISBN).
  method_of_verification: >-
    The thesis PDF was downloaded fresh and page 126 re-processed with a purpose-written
    content-stream parser that does not share code or calibration with the original harvest.
    Markers were classified by path geometry rather than by bounding-box heuristics: filled
    closed paths give diamond / triangle / circle / square, and the +, x and asterisk markers
    are drawn as 4 or 6 short segments radiating from a common start point, so that shared
    start point IS the plotted datum and is recovered with zero centring error. Axis
    calibration was re-derived from the drawn plot frames and their tick marks. PDF clipping
    paths (operator 'n') and the stroked M3 model-fit polylines were identified and excluded.
  per_panel_result:
    - "panel A: 24 diamonds -> 21 distinct glucose positions, and 24 plus markers -> 16 distinct glycine positions. Both match this file exactly."
    - "panel B: 22 fructose, 19 DFG, 20 methylglyoxal distinct positions. All match exactly."
    - "panel C: 15 formic, 19 acetic distinct positions. All match exactly."
    - "panel D: 17 1-DG, 15 3-DG distinct positions. All match exactly."
    - "panel E: 19 melanoidin distinct positions. All match exactly."
    - "Every panel draws 24 markers per species = 8 sampling times x 3 replicates. The 'up to 3 markers per time point' claim in system.replication is exact, and the replicate_note explanation of why some time points list fewer than 3 values is correct."
  independent_cross_check: >-
    The same experiment is replotted as Figure 5.10 on thesis p. 121. That figure was
    extracted separately (see martins2005_glucose_glycine_80_100_120C_pH68.yml) and its
    100 C series agrees with this file at EVERY shared time point for all ten species. The
    largest disagreement found is 1.3 mmol/L for glucose at 45 min (0.5% of that panel's
    250 mmol/L full scale) and 0.54 mmol/L for DFG at 60-120 min (2.2% of Figure 5.10's
    25 mmol/L DFG scale). Typical disagreement is well under 1% of full scale. Two figures
    drawn from one data set do not agree to better than the resolution at which each was
    plotted, and this is that resolution.
  residual_uncertainty: >-
    STILL A FIGURE READ-OFF. The re-extraction shows the numbers faithfully recover the
    marker positions the authors' plotting program produced; it cannot show those positions
    equal the authors' underlying measurements. The +/- 0.3% of panel full scale quoted in
    extraction.estimated_uncertainty is a floor.
provenance_note: >-
  Figure 5.9 of the Martins (2003) Wageningen thesis (= Fig. 5 of Martins & van Boekel 2005,
  Food Chem 90:257-269), which plots the measured concentrations (dots) together with the
  fitted M3 model (lines). ONLY THE DOTS were extracted; the fitted lines were identified
  and discarded, as were PDF clipping paths (content-stream operator 'n') that a naive
  extractor mistakes for markers. No point here is interpolated, smoothed, averaged or
  otherwise synthesised.
what_a_human_with_access_should_get_next: >-
  The underlying concentration tables were never published: both the thesis and the Food
  Chemistry paper present these data only as figures. The authors' raw data would have to
  come from Wageningen (Food Quality and Design group) or from S.I.F.S. Martins directly.
  Failing that, this vector extraction is the best available reconstruction and the
  numbers above are what should be used.

