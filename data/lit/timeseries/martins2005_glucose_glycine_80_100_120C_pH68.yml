file_verification:
  status: corrected
  date: 2026-08-27
  wave: Q
  summary: >-
    RE-EXTRACTED INDEPENDENTLY AND CORRECTED. 415 of the 418 values now in this file were
    reproduced exactly by an independent re-extraction. THREE VALUES WERE FOUND NOT TO EXIST
    IN THE FIGURE AND HAVE BEEN REMOVED, all three from the glycine 120 C series. This is the
    only file in this directory that required a data correction.
  method_of_verification: >-
    The thesis PDF was downloaded fresh and page 131 re-processed with a purpose-written
    content-stream parser sharing no code or calibration with the original harvest. For each
    of the ten species every marker was enumerated WITH ITS MULTIPLICITY (how many coincident
    markers are drawn at that position), which is what made the three phantom glycine values
    detectable: a position with zero markers cannot appear in the data. The complete set of
    distinct marker positions per species was then diffed against this file.
  per_species_result:
    - "glucose: 48 distinct positions / 66 markers -- PERFECT MATCH with this file"
    - "fructose: 43 / 66 -- PERFECT MATCH"
    - "glycine: 48 / 66 -- file listed 51; 3 removed, see the glycine 120 C verification block"
    - "DFG: 46 / 66 -- PERFECT MATCH"
    - "1-DG: 36 / 66 -- PERFECT MATCH"
    - "3-DG: 37 on-grid / 66 (plus 16 off-grid fit-curve dots correctly excluded) -- PERFECT MATCH"
    - "methylglyoxal: 38 / 66 -- PERFECT MATCH"
    - "formic acid: 34 / 66 -- PERFECT MATCH"
    - "acetic acid: 44 / 66 -- PERFECT MATCH"
    - "melanoidins: 44 / 66 -- PERFECT MATCH"
  corrections_applied:
    - "glycine T=120: removed [10, 196.1], [15, 179.5], [20, 185.1]; n_points 15 -> 12. Source of correction: content-stream enumeration of Figure 5.10 panel B, thesis PDF page 131."
    - "ISBN added to primary_source_used (90-5808-823-5, from the thesis colophon)."
    - "estimated_uncertainty and attribution_validation: the '1% of full scale' claim was replaced with the measured worst cases (up to 2.2% for DFG)."
    - "provenance_note: the dotted model-fit curve whose dots a naive extractor reads as data is in PANEL C (the 80 C fit for 3-deoxyglucosone), not panel B as previously stated."
  residual_uncertainty: >-
    STILL A FIGURE READ-OFF, and additionally the temperature attribution at shared sampling
    times is a RECONSTRUCTION, not something the figure labels. The reconstruction is
    corroborated for 100 C by Figure 5.9 and is structurally forced elsewhere by the differing
    sampling grids, but a reader who needs certainty on the 80 versus 120 C split at a
    particular time should re-derive it. The genuinely ambiguous points are already parked
    under ambiguous_80_or_100 and are not assigned.
provenance_note: >-
  Figure 5.10 of the Martins (2003) Wageningen thesis (= Fig. 6 of Martins & van Boekel
  2005). Only the plotted measurement markers were extracted; the fitted M4 model curves
  were identified and discarded, including a dotted fit curve in PANEL C (the 80 C fit for
  3-deoxyglucosone) whose dots a naive extractor reads as a data series -- it is excluded
  because its x-positions do not fall on the sampling grid. Corrected 2026-08-27: an earlier
  version of this note placed that curve in panel B. No point is interpolated, smoothed,
  averaged or synthesised.
what_a_human_with_access_should_get_next: >-
  The 90 C and 110 C series exist (the thesis Materials & Methods lists five temperatures
  and the rate constants in Table 5.2 were fitted to all five) but are plotted nowhere in
  the thesis. Recovering them needs the authors' raw data from Wageningen Food Quality and
  Design. That would turn this into a five-temperature Arrhenius data set instead of three.

