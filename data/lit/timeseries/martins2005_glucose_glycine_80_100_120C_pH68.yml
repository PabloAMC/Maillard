# Martins & van Boekel -- glucose/glycine multiresponse kinetics at 80, 100 and 120 C, pH 6.8
# NOTHING IN THIS FILE IS WIRED INTO THE MODEL OR THE CALIBRATION. Data only.
source:
  citation: "Martins, S.I.F.S. & van Boekel, M.A.J.S. (2005) A kinetic model for the glucose/glycine Maillard reaction pathways. Food Chemistry 90(1-2):257-269."
  doi: "10.1016/j.foodchem.2004.04.006"
  doi_verified: "resolved via api.crossref.org 2026-08-27; title/journal/volume/pages/authors match"
  primary_source_used: "Martins, S.I.F.S. (2003) Unravelling the Maillard reaction network by multiresponse kinetic modelling. PhD thesis, Wageningen University, 170 pp. ISBN 90-5808-823-5. Chapter 5, Figure 5.10 (thesis p. 121 = PDF page 131)."
  primary_source_url: "https://edepot.wur.nl/121418"
  access: figure_readoff
  retrieved: 2026-08-27
  page_mapping_verified: "PDF page 131 carries the printed page number 121 and Figure 5.10, exactly as claimed."
system:
  reactants: {glucose: 0.2 M, glycine: 0.2 M}
  conditions:
    T_C: [80, 100, 120]
    T_note: "the thesis states five temperatures were run (80, 90, 100, 110, 120 C); Figure 5.10 plots only 80, 100 and 120 C. The 90 and 110 C series are NOT in this figure."
    pH: 6.8
    pH_note: "initial pH, uncontrolled during heating"
    buffer: "phosphate, 0.1 mol/L"
    matrix: aqueous
    vessel: "screw-capped glass tubes (Schott 16 x 160 mm), 10 mL, oil bath"
  replication: "at least duplicate (thesis Materials & Methods, Chapter 5); the marker census shows the actual replication was 3-fold"
  conditions_verified: >-
    VERIFIED 2026-08-27 verbatim against the thesis Materials and Methods (printed p. 33 =
    PDF p. 42): "Equimolar solutions of glucose and glycine (0.2mol/L) were prepared in
    phosphate buffer (10 mL, 0.1 mol/L, pH 6.8), filtered (0.2 um, Schleicher & Schuell) and
    heated at 80, 90, 100, 110 and 120 C in an oil bath, in screw-capped glass tubes (Schott,
    16 x 160 mm). ... Each reaction mixture was prepared, heated and analysed in at least
    duplicate." This confirms the concentrations, buffer, pH, vessel, volume, heating method,
    replication AND the five-temperature claim in T_note above.
extraction:
  method: vector_coordinate_extraction
  method_note: >-
    Same method as martins2005_glucose_glycine_100C_pH68.yml: the figure is vector art in
    the thesis PDF and marker centres were taken from the content stream, calibrated on the
    plot frame and confirmed against the axis tick coordinates. STILL A FIGURE READ-OFF.
  temperature_attribution: >-
    Figure 5.10 uses the SAME marker shape for all three temperatures and distinguishes them
    only by line style, so each marker had to be assigned to a temperature. Two facts make
    this tractable. (1) The sampling grids differ: 5, 10 and 20 min occur only at 120 C, and
    150 and 180 min only at 80 C. (2) At the shared times the three series are separated by
    a large gap in the response, and reaction extent is monotone in temperature. Markers at
    each shared time were therefore split at the largest gaps and ordered by extent.
  attribution_validation: >-
    THE ASSIGNMENT IS INDEPENDENTLY VERIFIED, AND WAS RE-VERIFIED FROM SCRATCH ON 2026-08-27.
    The 100 C run in this figure is the same experiment plotted in Figure 5.9, which was
    extracted separately. For ALL TEN species the 100 C series recovered here agrees with
    Figure 5.9 at EVERY shared time point (e.g. glucose 15 min: 183.3/190.1 here vs
    183.3/190.0 from Fig 5.9; DFG 45 min: 10.57/10.84/11.39 vs 10.60/10.87/11.41).
    MEASURED, not asserted: the largest disagreement over the whole figure is 1.3 mmol/L
    (glucose, 45 min; 0.5% of that panel's 250 mmol/L scale), then 0.84 mmol/L (fructose,
    30 min; 1.4% of the 60 mmol/L scale), then 0.54 mmol/L (DFG, 60-120 min; 2.2% of the
    25 mmol/L scale). Methylglyoxal, formic and acetic acid and melanoidins all agree to
    0.1-0.3 mmol/L. An earlier version of this note said disagreement was "under 1% of full
    scale" and named methylglyoxal as the worst case; the true worst case in relative terms
    is DFG at 60-120 min, at about 2% of full scale. Corrected 2026-08-27.
    THE 100 C SERIES BELOW IS THEREFORE REDUNDANT with the other file and is retained only
    as the audit trail for the 80 and 120 C series, which are the new information.
  attribution_reverified_2026_08_27: >-
    The temperature split was re-derived independently and agrees with what is recorded
    below, series by series. Two structural facts make it decidable rather than guessed.
    (1) The sampling grids differ: 5, 10 and 20 min are drawn only for 120 C and 150 and
    180 min only for 80 C, so those points need no splitting at all. (2) At the shared times
    every panel draws exactly 3 markers per temperature (66 markers per species = 22 time-
    temperature cells x 3 replicates), and the three triples are separated by gaps far larger
    than the within-triple spread -- for glucose at 15 min, for instance, the nine markers
    fall at 148.4/148.4/150.0, 183.3/183.3/190.2 and 200.0/200.0/201.3. The middle triple
    is confirmed as 100 C by Figure 5.9 independently. Where that separation fails the values
    are parked under ambiguous_80_or_100 rather than assigned, and that parking was checked
    to be correct: at melanoidins t=15 and formic acid t=30 the six non-120 C markers really
    are indistinguishable.
  marker_census: >-
    Every species is drawn with exactly 66 markers, which equals 22 time-temperature cells
    x 3 replicates and confirms that no marker was missed. 3-deoxyglucosone appears to carry
    82 because the 80 C model-fit curve in panel C is drawn as a dotted line whose dots are
    triangles; those 16 extra dots sit at x = 17.6, 22.0, 32.6, 47.5, 55.5, 56.8, 62.5, 71.8,
    81.1, 92.5, 101.8, 111.0, 122.4, 141.9, 152.5 and 171.8 min, i.e. off the sampling grid,
    and are correctly excluded from the 3-DG series below.
  known_problems:
    - "acetic acid at 15 min, formic acid at 30 min and melanoidins at 15 min were mis-split by the automatic rule (the 80 and 100 C values are both near zero there). These three points were re-assigned by hand against Figure 5.9, and where that still could not separate 80 from 100 C the values are parked under ambiguous_80_or_100 rather than being guessed."
    - "FOUND AND FIXED 2026-08-27: the glycine 120 C series contained three values that do not exist in the figure -- [10, 196.1], [15, 179.5] and [20, 185.1]. Each was a duplicate of an adjacent time point, evidently inserted to make every time point show three replicates. They are removed; see the verification block on that series. This was the only such defect in the file: the other nine species were each re-enumerated marker by marker and matched exactly."
    - "fructose at 120 C, 10 min carries a value of 5.96 mmol/L alongside 11.98 and 12.30. It is on the nominal time grid and is a real marker, but it does not follow the 120 C trend (4.3-5.3 at 5 min, 14.3-16.6 at 15 min). It is reported as extracted, not corrected."
    - "at t = 0 all three temperature series are plotted on top of each other and cannot be separated. The distinct t=0 marker values are given per species under t0_markers and are NOT assigned to a temperature."
  estimated_uncertainty: "+/- 0.3% of each panel full scale from calibration and marker centring, plus the authors' plotting rounding. The Figure 5.9 cross-check bounds the real error at about 2% of full scale (measured 2026-08-27; the previous '1%' understated it -- see attribution_validation for the per-species figures)."
  replicate_note: "distinct marker positions only; coincident replicates collapse to one value, so counts are lower bounds. No averaging."
  symbol_legend_source: "Figure 5.10 caption: A glucose (open diamond), fructose (filled triangle); B glycine (plus), DFG (open circle); C 1-DG (filled circle), 3-DG (open triangle); D formic acid (cross), acetic acid (filled diamond); E methylglyoxal (open square); F melanoidins (asterisk). Line styles: 80 C and 100 C dashed/dotted, 120 C solid."
  axis_ranges_verified: >-
    VERIFIED 2026-08-27 from the retrieved figure, including the DUAL AXES, which are the
    main way this figure could be misread. Printed labels: panel A left "Glu mmol/L" 0-250
    and right "Fru mmol/L" 0-60; panel B left "Gly mmol/L" 0-250 and right "DFG mmol/L" 0-25;
    panel C "DG mmol/L" 0-1; panel D "Acids mmol/L" 0-21; panel E "MG mmol/L" 0-10; panel F
    "Mel mmol/L" 0-10. All against Time 0-200 min. Both right-hand axes were confirmed to be
    real drawn axes with their own tick marks spanning the same vertical extent as the left
    axis. Every axis range asserted in the series below is correct, and fructose and DFG are
    correctly read against the right-hand scale rather than the left.
  temperature_count_verified: >-
    The retrieved caption reads "model fit (lines) to experimental data (dots) of
    glucose/glycine aqueous system heated at 80 C ( ), 100 C (- - -) and 120 C ( )", i.e.
    three temperatures distinguished by line style only, confirming both the T_note above and
    the reason temperature attribution had to be reconstructed. Thesis Materials and Methods
    confirms five temperatures were run (80, 90, 100, 110, 120 C), so the 90 and 110 C series
    are genuinely absent from this figure rather than overlooked.
