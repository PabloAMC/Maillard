    doi: "10.1016/s0008-6215(03)00174-5"
    doi_verified: "resolved via api.crossref.org 2026-08-27"
  primary_source_used: "Martins, S.I.F.S. (2003) PhD thesis, Wageningen University -- Chapter 4, Table 4.1.1 (thesis p. 68) and Figures 4.1.1 / 4.1.2 (thesis p. 67 = PDF page 77)."
  primary_source_url: "https://edepot.wur.nl/121418"
  access: mixed
  access_detail: "Table 4.1.1 = table transcription (exact). Figures 4.1.1 and 4.1.2 = vector coordinate extraction (figure_readoff)."
  retrieved: 2026-08-27
  verified_2026_08_27: >-
    Thesis PDF downloaded fresh from https://edepot.wur.nl/121418 (1,633,582 bytes, 178 PDF
    pages, PDF 1.4). Title page, promotoren and the colophon on PDF page 4 match the citation
    ("Ph.D. Thesis, Wageningen University, The Netherlands. 170 pp."). Both Carbohydrate
    Research DOIs and the thesis page mapping were re-checked; see file_verification below.
  isbn: "90-5808-823-5 (printed on PDF page 4 of the thesis)"
system:
  reactants:
    DFG: "10 mmol/L N-(1-deoxy-D-fructos-1-yl)-glycine, synthesised in-house (Kroh method)"
  reactant_concentration_note: >-
    The thesis Materials & Methods states "N-(1-deoxy-D-fructos-1-yl)-glycine (0.237 g,
    10 mmol) was dissolved in phosphate buffer (100 mL)". 0.237 g of DFG (M = 237.2 g/mol)
    is 1.0 mmol, not 10 mmol, so the printed millimole figure is internally inconsistent.
    The initial concentration read off Figure 4.1.1 is 9.0-10.4 mmol/L, which matches
    1 mmol in 100 mL = 10 mmol/L. 10 mmol/L is therefore taken as the initial
    concentration and the "10 mmol" in the text is treated as a slip. FLAGGED, not silently
    corrected.
  conditions:
    T_C: [100, 120]
    pH: [5.5, 6.8]
    pH_note: "initial pH, uncontrolled during heating"
    buffer: "phosphate, 0.1 M K2HPO4 / KH2PO4"
    matrix: aqueous
    vessel: "screw-capped glass tubes (Schott 16 x 160 mm), oil bath"
    duration: "up to 4 h at 100 C, up to 3 h at 120 C"
  replication: "at least duplicate (thesis Materials & Methods, Chapter 4)"
extraction:
  method: "vector_coordinate_extraction for the two figures; table_transcription for Table 4.1.1"
  symbol_legend_source: >-
    Figure 4.1.1/4.1.2 captions read at 500 dpi: open triangle = 100 C pH 5.5;
    filled triangle = 100 C pH 6.8; open circle = 120 C pH 5.5; filled circle = 120 C pH 6.8.
  attribution_validation: >-
    Two statements in the thesis body independently confirm the symbol-to-condition mapping.
    (1) "After heating for 30 minutes at 120 C and pH 6.8, DFG was completely degraded" --
    the filled-circle series reaches 0.03 mmol/L at 30 min. (2) "after 180 minutes at 100 C
    and pH 5.5, only approximately 57% of the initial concentration had reacted" -- the
    open-triangle series runs 10.08 -> 4.40 mmol/L over 180 min, i.e. 56% reacted. A third
    statement, that 100 C/pH 6.8 and 120 C/pH 5.5 degrade at a similar rate, also holds for
    the filled-triangle and open-circle series.
  estimated_uncertainty: "+/- 0.3% of full scale (about 0.04 mmol/L on the DFG panel, 0.03 on the glycine panel), plus the authors' plotting rounding."
  axis_calibration_verified: >-
    VERIFIED 2026-08-27 by re-deriving the calibration from the drawn plot frames and axis
    tick marks in the PDF content stream, independently of the earlier pass. Figure 4.1.1
    frame: x 138.24-289.80 pt = 0-200 min, y 576.72-648.60 pt = 0-12 mmol/L (6 y-ticks at
    0/2/4/6/8/10/12 and 5 x-ticks at 0/50/100/150/200, matching the printed labels). Figure
    4.1.2 frame: x 347.29-523.81 pt = 0-200 min, y 512.87-647.88 pt = 0-10 mmol/L. The 0.3%
    full-scale figure quoted above is therefore about 0.036 mmol/L on Figure 4.1.1 and
    0.030 mmol/L on Figure 4.1.2, as stated.
  replicate_note: "one marker per time point in these figures; distinct positions only, no averaging."
  excluded: >-
    CORRECTED 2026-08-27. The earlier note here claimed "a filled-diamond series at irregular
    x-positions" had been identified as a dotted model-fit curve and discarded. That
    description is wrong: re-parsing the content stream shows NO diamond markers anywhere on
    this page. What is actually present, and correctly excluded, is four stroked polylines per
    panel (line width 0.736 pt, one per experimental condition) which are the model fits, plus
    PDF clipping paths (operator 'n'). The conclusion of the earlier note -- that non-data
    geometry was excluded -- stands; only its description of that geometry was inaccurate.
  independent_marker_census: >-
    Figure 4.1.1 contains exactly 10 open triangles, 9 filled triangles, 9 open circles and
    9 filled circles; Figure 4.1.2 contains exactly 10 open triangles, 9 filled triangles,
    9 open circles and 9 filled circles. These counts equal the point counts of the eight
    series below exactly, so no marker was dropped and none was invented.
