provenance_note: >-
  Figures 4.1.1 and 4.1.2 and Table 4.1.1 of the Martins (2003) Wageningen thesis
  (= Martins, Marcelis & van Boekel 2003, Carbohydr Res 338:1651-1663). Only plotted
  measurement markers were extracted; fit curves were identified and discarded. Nothing is
  interpolated, smoothed, averaged or synthesised.
value_for_this_repo: >-
  This is the cleanest available constraint on ONE step: the decomposition of the Amadori
  compound, isolated from its own formation, at two temperatures and two pH values. It is
  the natural target for the Amadori-degradation branch of the network, and the pH pair at
  fixed T is the only clean pH lever in this whole directory.
what_a_human_with_access_should_get_next: >-
  Chapter 4 (thesis section 4.1) also plots 1-DG, 3-DG, methylglyoxal, glucose, mannose,
  formic acid, acetic acid and melanoidins during DFG degradation (thesis Figures 4.1.3 to
  4.1.7, PDF pages 78-82) and the Chapter 4.2 model-fit figures (PDF pages 93-105) replot
  the same measurements at four conditions. Those are vector figures in the same PDF and
  can be extracted with the identical method; they were not done in this pass for time
  reasons, NOT because they are inaccessible.

