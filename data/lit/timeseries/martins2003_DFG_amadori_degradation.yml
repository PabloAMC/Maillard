glycine_yield_table:
  description: >-
    Table 4.1.1 of the thesis (p. 68), transcribed exactly. Yield of glycine expressed as a
    percentage of the amount of DFG that had reacted -- NOT a concentration. n.a. = not
    analysed; those time points are omitted rather than filled in.
  unit: "% (mol glycine formed / mol DFG reacted)"
  data_quality: table
  verification:
    status: verified_table
    date: 2026-08-27
    note: >-
      VERIFIED EXACTLY. All 32 printed values and all 12 n.a. cells of Table 4.1.1 (thesis
      p. 68 = PDF page 78) were re-read from the retrieved thesis and match this file digit
      for digit, including which time points are n.a. in which column. The table header
      confirms the four condition labels A-D used below (A: T100 C pH 5.5; B: T100 C pH 6.8;
      C: T120 C pH 5.5; D: T120 C pH 6.8) and the footnote confirms the unit: "The yield of
      glycine was calculated based on the amounts of DFG reacted." This table also
      independently confirms the sampling grid used for the two figures:
      5/10/15/30/45/60/75/90/120/150/180 min.
  conditions:
    A: {T_C: 100, pH: 5.5}
    B: {T_C: 100, pH: 6.8}
    C: {T_C: 120, pH: 5.5}
    D: {T_C: 120, pH: 6.8}
