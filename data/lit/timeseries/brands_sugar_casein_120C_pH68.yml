# Brands & van Boekel -- sugar/casein systems at 120 C, pH 6.8.
# NOTHING IN THIS FILE IS WIRED INTO THE MODEL OR THE CALIBRATION. Data only.
#
# TWO SOURCES, TWO DATA QUALITIES, KEPT SEPARATE ON PURPOSE.
#   `source`      -- the 2002 PhD thesis. Everything under it is data_quality: table,
#                    transcribed and image-verified (Wave 2026-08-27).
#   `source_2001` -- ADDED 2026-08-28 (Wave W). Brands & van Boekel (2001) JAFC 49:4667-4675,
#                    DOI 10.1021/jf001430b, full text obtained by interlibrary loan. This is
#                    the journal paper the 2026-08-27 pass explicitly said it did NOT hold and
#                    could not read (see what_was_deliberately_NOT_extracted, now amended).
#                    Everything under it is data_quality: figure_readoff -- THE PAPER CONTAINS
#                    NO TABLES AT ALL, so these numbers cannot be transcribed by anyone, ever.
#                    Do not mix the two qualities in any downstream average without saying so.
source:
  citation: "Brands, C.M.J. (2002) Kinetic modelling of the Maillard reaction between proteins and sugars. PhD thesis, Wageningen University. ISBN 90-5808-591-0."
  primary_source_url: "https://edepot.wur.nl/199005"
  access: full_text
  retrieved: 2026-08-27
  doi_status: >-
    THE THESIS ITSELF HAS NO DOI -- it is a Wageningen PhD thesis, openly downloadable at the
    URL above. That is not a defect in this file. The two thesis chapters that supply every
    number below were published as journal articles and BOTH of those DOIs are listed and
    CrossRef-verified under published_chapters_used. Note in particular that these data are
    NOT from Brands & van Boekel (2001) J Agric Food Chem 49:4667-4675 (DOI 10.1021/jf001430b),
    the sugar-casein reaction-network paper: that paper is a different chapter of the same
    thesis and none of its data are in this file. See what_a_human_with_access_should_get_next.
  verified_2026_08_27: >-
    Thesis PDF downloaded from https://edepot.wur.nl/199005 (3,911,354 bytes, 133 PDF pages,
    PDF 1.3). Title page and promotoren match the citation. ISBN printed on PDF page 4 is
    90-5808-591-0. Last numbered page of the body is 127.
  corrections_applied:
    - "ISBN was recorded as 90-5808-579-4; the thesis prints 90-5808-591-0 (PDF page 4). Corrected."
    - "citation claimed '137 pp'; no page-count statement exists in the thesis and the scan is 133 PDF pages ending at printed page 127. The unsupported page count was removed."
    - "Table 6.1 was cited as thesis p. 101; it is printed on thesis p. 99 (PDF page 105). Corrected. (Table 6.2 IS on p. 101 = PDF page 107, as originally stated.)"
