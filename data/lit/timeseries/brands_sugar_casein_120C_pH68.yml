# Brands & van Boekel -- sugar/casein systems at 120 C, pH 6.8: transcribed TABLES only
# NOTHING IN THIS FILE IS WIRED INTO THE MODEL OR THE CALIBRATION. Data only.
source:
  citation: "Brands, C.M.J. (2002) Kinetic modelling of the Maillard reaction between proteins and sugars. PhD thesis, Wageningen University. ISBN 90-5808-591-0."
  primary_source_url: "https://edepot.wur.nl/199005"
  access: full_text
  retrieved: 2026-08-27
  doi_status: >-
    THE THESIS ITSELF HAS NO DOI -- it is a Wageningen PhD thesis, openly downloadable at the
    URL above. That is not a defect in this file. The two thesis chapters that supply every
    number below were published as journal articles and BOTH of those DOIs are listed and
    CrossRef-verified under published_chapters_used. Note in particular that these data are
    NOT from Brands & van Boekel (2001) J Agric Food Chem 49:4667-4675 (DOI 10.1021/jf001430b),
    the sugar-casein reaction-network paper: that paper is a different chapter of the same
    thesis and none of its data are in this file. See what_a_human_with_access_should_get_next.
  verified_2026_08_27: >-
    Thesis PDF downloaded from https://edepot.wur.nl/199005 (3,911,354 bytes, 133 PDF pages,
    PDF 1.3). Title page and promotoren match the citation. ISBN printed on PDF page 4 is
    90-5808-591-0. Last numbered page of the body is 127.
  corrections_applied:
    - "ISBN was recorded as 90-5808-579-4; the thesis prints 90-5808-591-0 (PDF page 4). Corrected."
    - "citation claimed '137 pp'; no page-count statement exists in the thesis and the scan is 133 PDF pages ending at printed page 127. The unsupported page count was removed."
    - "Table 6.1 was cited as thesis p. 101; it is printed on thesis p. 99 (PDF page 105). Corrected. (Table 6.2 IS on p. 101 = PDF page 107, as originally stated.)"
    - "Table 3.1 was cited as thesis p. 36; it is printed on thesis p. 37 (PDF page 44). Page 36 only refers to it in the running text. Corrected."
    - "the a/b' microanalysis column of Table 3.1 had been omitted; it is now included as sugar_molecules_per_lysine_residue_microanalysis."
  published_chapters_used:
    - citation: "Brands, C.M.J., Alink, G.M., van Boekel, M.A.J.S., Jongen, W.M.F. (2000) Mutagenicity of heated sugar-casein systems: effect of the Maillard reaction. J. Agric. Food Chem. 48:2271-2275."
      doi: "10.1021/jf9907586"
      doi_verified: "resolved via api.crossref.org 2026-08-27; title/journal/volume/pages/authors match"
      supplies: "thesis Chapter 6 = Tables 6.1 (thesis p. 99) and 6.2 (thesis p. 101) below"
    - citation: "Brands, C.M.J., Wedzicha, B.L., van Boekel, M.A.J.S. (2002) Quantification of melanoidin concentration in sugar-casein systems. J. Agric. Food Chem. 50:1178-1183."
      doi: "10.1021/jf010789c"
      doi_verified: "resolved via api.crossref.org 2026-08-27; title/journal/volume/pages/authors match"
      supplies: "thesis Chapter 3 = Table 3.1 (thesis p. 37) below"

system:
  reactants: {sugar: 150 mM, sodium_caseinate: 3% w/w}
  conditions:
    T_C: 120
    pH: 6.8
    pH_note: "initial pH; the thesis reports a pH drop during heating"
    buffer: "phosphate, 0.1 mol/L"
    matrix: aqueous
    vessel: "screw-capped glass tubes (Schott 16 x 160 mm), oil bath"
  sugars_studied: [glucose, fructose, galactose, tagatose, lactose, lactulose]
  conditions_verified: >-
    VERIFIED 2026-08-27 against the thesis Materials and Methods. Chapter 6 (thesis p. 97 =
    PDF p. 103), section 6.2.2, reads verbatim: "Sodium caseinate (3% w/w) and sugar (150 mM)
    were dissolved in a phosphate buffer (0.1 M; pH 6.8) and heated for 20, 40 and 60 minutes
    at 120 C in screw-capped glass tubes in an oil bath." Section 6.2.3 confirms the browning
    dilution: "The samples were diluted 4 times with sodium dodecyl sulphate (SDS; 16% w/w) to
    reduce scattering due to protein aggregates. If necessary the samples were diluted once
    more with water." Section 6.2.4 confirms Ames strain TA100 with and without S9, triplicate.
    Chapter 3 (thesis p. 31 = PDF p. 37), section 3.2.2, independently confirms 3% w/w sodium
    caseinate, 150 mM glucose or fructose, phosphate 0.1 M pH 6.8, 120 C, oil bath, Schott
    16 x 160 mm tubes, and states glucose-casein was run in three-fold and fructose-casein in
    two-fold. Every condition asserted in this file is therefore supported by retrieved text.

extraction:
  method: table_transcription
  method_note: >-
    The Brands thesis PDF is a BITONAL SCAN, not vector art, so no coordinate extraction is
    possible. Confirmed 2026-08-27: the table pages carry a single 1-bit image each
    (about 1310 x 1889 px per page, i.e. roughly 160 dpi, NOT 200 dpi as previously stated)
    and zero vector drawing operators. Every number below was transcribed from the OCR text
    layer and then INDEPENDENTLY RE-READ from the page rendered at 4x (about 640 dpi) as an
    image. Because the text layer is OCR of a bitonal scan it cannot be trusted on its own;
    the image re-reading is what verifies these digits.
  what_was_deliberately_NOT_extracted: >-
    The concentration-time multiresponse data that make this thesis valuable -- glucose,
    fructose, formic acid, acetic acid, lysine loss and melanoidins vs time in glucose-casein
    and fructose-casein systems (thesis Figures 2.1, 2.2, 2.7, 4.x) -- exist ONLY as figures
    in a 1-bit 200 dpi scan. Reading points off those figures would be eyeball estimation at
    low resolution and was NOT attempted. Those numbers are NOT in this repository.

