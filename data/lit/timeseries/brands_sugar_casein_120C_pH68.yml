provenance_note: >-
  All values transcribed from tables in the Brands (2002) Wageningen thesis. Nothing is
  interpolated, smoothed or averaged beyond the means the thesis itself prints (Tables 6.1
  and 3.1 report mean +/- SEM; Table 6.2 prints single values with no dispersion).
file_verification:
  status: verified_table
  date: 2026-08-27
  wave: Q
  summary: >-
    ALL 60 DATA VALUES IN THIS FILE ARE VERIFIED AGAINST THE RETRIEVED SOURCE. The thesis PDF
    was downloaded fresh from https://edepot.wur.nl/199005 and Tables 6.1 (PDF p. 105), 6.2
    (PDF p. 107) and 3.1 (PDF p. 44) were rendered as images at 4x and read directly, not via
    the OCR text layer. Every printed digit, every +/- and every SEM matched what this file
    already contained; not one data value required correction. The 6 additional values of the
    a/b' microanalysis column were added because they had been omitted.
  what_was_wrong: >-
    Only metadata was wrong: the ISBN, an unsupported page count, and the printed page numbers
    of Tables 6.1 and 3.1. All four are corrected above under source.corrections_applied.
  not_verified: >-
    Nothing in this file is unverified. What is NOT here -- the multiresponse concentration
    time series -- is described under what_a_human_with_access_should_get_next.
caveats:
  - "A420 in Table 6.2 is measured on samples diluted 4x in 16% w/w SDS (and sometimes diluted once more with water). It is NOT directly comparable to an undiluted absorbance."
  - "the Ames values are already background-corrected: 94 +/- 2 spontaneous revertants/plate were subtracted; positive control 862 +/- 45 revertants/plate."
  - "these are 3 time points per system. They constrain browning ORDERING across sugars far better than they constrain a rate."
what_a_human_with_access_should_get_next: >-
  The real prize in this thesis is the multiresponse concentration data, which are figures
  in a bitonal scan here. Brands & van Boekel (2001) J. Agric. Food Chem. 49:4667-4675,
  DOI 10.1021/jf001430b ("Reactions of monosaccharides during heating of sugar-casein
  systems: building of a reaction network model") is the published version; someone with
  ACS access should check whether its figures are vector in the publisher PDF, in which
  case the same coordinate-extraction used on the Martins figures would recover the
  glucose/fructose/formic-acid/acetic-acid/lysine/melanoidin time series at 120 C.

# =========================================================================================
# WAVE W (2026-08-28) -- the concentration-time trajectories, from the JOURNAL PAPER.
# =========================================================================================
source_2001:
  citation: "Brands, C.M.J.; van Boekel, M.A.J.S. Reactions of Monosaccharides during Heating of Sugar-Casein Systems: Building of a Reaction Network Model. J. Agric. Food Chem. 2001, 49 (10), 4667-4675."
  doi: "10.1021/jf001430b"
  access: full_text
  retrieved: 2026-08-28
  retrieved_from: >-
    data/articles/brands2001.pdf, obtained by the repository owner via interlibrary loan. The
    PDF is gitignored and is NOT committed; only extracted data enters the repo.
  identity_verified: >-
    Confirmed from the PDF itself, not from the filename. Running head: "J. Agric. Food Chem.
    2001, 49, 4667-4675". Title as printed: "Reactions of Monosaccharides during Heating of
    Sugar-Casein Systems: Building of a Reaction Network Model". Authors as printed: "Carline
    M. J. Brands and Martinus A. J. S. van Boekel*", "Department of Agrotechnology and Food
    Sciences, Product Design and Quality Management Group, Wageningen University". The DOI is
    not printed on a labelled line; the copyright line reads "10.1021/jf001430b CCC: $20.00
    (C) 2001 American Chemical Society" and the article ID at the end is "JF001430B".
  quoted_method: >-
    "Preparation of Reaction Model Systems. Sodium caseinate (3% w/w) and sugar (150 mM
    monosaccharide) were dissolved in a phosphate buffer (0.1 M; pH 6.8) to give a molar ratio
    of sugar to lysine residues of 10:1. The samples were heated for various times (0-40 min)
    at 120 degC in an oil bath in screw-capped glass tubes (Schott, 16 x 160 mm). The chosen
    heating temperature corresponds to sterilization temperatures usually used in the food
    industry. The reported heating times include the heating-up period of ~2-3 min. After a
    given heating time, samples were cooled in ice water, prior to analysis. The reaction
    mixtures were heat-treated and analyzed in at least duplicate."
  quoted_quantification: >-
    Sugars and acids: "The last 6 mL, containing the sugars and organic acids, was analyzed by
    HPLC using an ion-exchange column (ION-300 ...). The eluent consisted of 0.0025 M sulfuric
    acid in water, the flow rate was 0.4 mL/min, and the column was kept at 85 degC. Sugars
    were detected by monitoring the refractive index and organic acids by their UV absorbance
    at 210 nm." Total acids: "Samples of 15 mL of reaction mixture were titrated with 0.1 N
    NaOH to pH 8.3." Amadori: "The Amadori compound was determined by means of furosine, using
    HPLC. ... Furosine concentration was recalculated to that of the Amadori compound using a
    conversion factor of 3.1 (11)." Lysine: "Available lysine residues were determined after
    derivatization with o-phthaldialdehyde (9)." Melanoidins: "The extinction coefficient of
    protein-bound melanoidins formed in glucose-casein and fructose-casein systems was measured
    to be 500 mol-1 L cm-1 (unpublished results). The concentration of melanoidins is thus
    expressed as sugar units incorporated in the brown products."
  the_paper_contains_no_tables: >-
    STATED PLAINLY BECAUSE IT GOVERNS EVERY SERIES BELOW. Brands & van Boekel 2001 has ZERO
    tables -- a search of the full text layer returns no table caption and no tabulated data.
    Every quantity it reports as a function of time exists ONLY inside bitmap figures (1-bit
    CCITT stencils with no vector text). There is therefore NO transcription path for these
    numbers for anybody, and `data_quality: table` is not achievable from this source at any
    future date. What is achievable is a careful digitization, labelled as one, which is what
    the series below are.
  reports_no_kinetic_parameters: >-
    The paper fits NO rate constants and NO activation energies, and says so four times, e.g.
    "The reaction pathways found were put together into a model, which will be evaluated by
    kinetic modeling in a subsequent paper." The only two numeric constants it states are the
    furosine-to-Amadori conversion factor 3.1 and the melanoidin extinction coefficient 500
    mol-1 L cm-1. IF ANY RATE CONSTANT IN THIS REPOSITORY IS EVER ATTRIBUTED TO THIS DOI, IT IS
    MISATTRIBUTED -- the kinetics are in the companion paper (Brands & van Boekel 2002, JAFC
    50:6725), which this repository does not hold.
  ph_is_stated_three_different_ways_in_one_paper: >-
    Recorded rather than silently resolved. Methods say the buffer is "pH 6.8"; the abstract
    says the systems "were heated at 120 degC and pH 6.7"; the measured t=0 pH in Figure 3 is
    6.72 (glucose) and 6.70 (fructose). This file keeps its top-level `system.conditions.pH:
    6.8` because that is the Methods value and is what the thesis chapters also state, and it
    carries the measured pH as its own series so a reader can see all three.
  ph_drop_quoted: >-
    "The formation of organic acids caused pH decreases of 0.3 pH unit in a glucose-casein
    system and 0.4 pH unit in a fructose-casein system after heating for 40 min at 120 degC
    (Figure 3)." The digitized pH series below give 6.72 -> 6.45 (0.27) and 6.70 -> 6.33
    (0.37), consistent with the quoted 0.3 and 0.4 -- one of the cross-checks listed under
    figure_readoff_method.
  mass_balance_quoted: >-
    "The results of the mass balance calculations (Figure 5) showed an almost negligible amount
    of missing compounds after 40 min of heating at 120 degC when all reaction products
    including brown compounds and unidentified acids were calculated. ... Between 10 and 30 min
    more compounds were missing." And, importantly for anyone tempted to close a budget with
    these numbers: "The titration experiment showed that acid formation was higher than the
    total amount of acetic and formic acid. Hence, other organic acids were formed but were not
    identified."

figure_readoff_method:
  what_was_done: >-
    Figure bitmaps extracted from the PDF with pdfimages; each panel calibrated against its own
    detected axis line and printed tick positions; marker centres located by a 21x21 ink-density
    peak detector, with series identity checked by marker-shape (corner-ink) tests and by visual
    zoom. Symbol key from the captions, which the text extraction mangles through ligature loss:
    4 = open triangle, 0 = open square, b = filled circle, 9 = filled square, O = open circle,
    ] = open diamond, / = asterisk.
  stated_accuracy: >-
    About +/-0.5-1% of each panel's full scale: +/-1 mmol/L on a 0-160 axis, +/-0.05 mmol/L on
    a 0-8 axis, +/-0.1 mmol/L on a 0-16 axis, +/-0.03 on an A420 axis. THIS IS A DIGITIZATION
    UNCERTAINTY AND IT IS NOT THE EXPERIMENT'S UNCERTAINTY. The paper reports no error bars and
    states only that "The reaction mixtures were heat-treated and analyzed in at least
    duplicate", so the true measurement uncertainty on every point below is UNKNOWN and is
    larger than the digitization error. Do not quote the +/-1% as if it were an experimental
    error bar.
  independent_verification: >-
    Four checks, all passed, all recorded because a digitization nobody checked is a guess.
    (1) INTERNAL: the "acids by HPLC" series digitized from Figure 3 equals formic + acetic
    digitized independently from Figures 1 and 2, to within 2% at every time point (glucose
    t=40: 3.29 + 5.24 = 8.53 vs 8.37 read from Fig 3; fructose t=40: 4.96 + 5.85 = 10.81 vs
    10.63). Two figures, two separate digitizations, one arithmetic identity.
    (2) TEXTUAL: the digitized pH endpoints reproduce the pH drops the paper states in prose
    (0.3 and 0.4 units) to 0.03 units.
    (3) AXIS IDENTITY: Figure 4's two y-axes stand in exactly the 1:2 ratio the paper's own
    extinction coefficient implies (c[mmol/L] = 2 x A420 at eps = 500 mol-1 L cm-1), which is
    an independent check that the axis calibration is right.
    (4) HUMAN RE-READ: Wave W re-read Figure 7 and Figure 1's left panel directly from
    upsampled renders, point by point, without reference to the digitizer output. Figure 7
    agreed on all 18 values to within one least-significant digit (e.g. Amadori 0.43 / 0.40 /
    0.165 / 0.03 / 0 / 0 vs digitized 0.431 / 0.401 / 0.168 / 0.031 / 0 / 0). Figure 1's
    glucose series agreed on all 8 values to within ~1 mmol/L.
  points_that_are_ambiguous_and_are_flagged_not_resolved: >-
    Four points where two markers physically superimpose because the curves cross there, so the
    two series cannot be separated: Fig 1 t=10 formic/acetic (both ~0.7); Fig 2 t=30
    formic/acetic (both ~4.1); Fig 6 fructose-only t=40 formic/acetic (both ~6.58); Fig 4A t=10
    total/protein browning. Each is carried below with `ambiguous: true` on the point rather
    than resolved to a number. Separately, the t=0 and t=2 markers overlap in every 0-160
    mmol/L panel (2 min is about one marker width at that scale), so those two columns are
    marked lower confidence. And one point is simply ABSENT from the paper: the formic-acid
    series in Figure 6's fructose panel has no t=15 marker (7 circles against 8 squares,
    verified at 4x zoom). It is omitted, not interpolated.

