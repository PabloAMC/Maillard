not_quantified_in_the_source:
  hmf_and_furfuryl_alcohol: >-
    "However, HMF and furfuryl alcohol were formed in very low amounts (0-40 uM)." A RANGE, not
    a series -- no time course is printed, so none is recorded here. Note the magnitude: 0-40
    uM against 150 mM starting sugar is at most 0.027% conversion, which is a useful bound on
    how much of this system's carbon can be flowing through the HMF route.
  hhmf_and_ddmp: >-
    "HHMF and DDMP could not be quantified because no reference material was available."
  methylglyoxal: >-
    Detected but not quantified: "Experiments in which we trapped reactive alpha-dicarbonyl
    compounds with o-phenylenediamine showed that methylglyoxal was indeed formed." No
    concentration is given anywhere in the paper.
  galactose_and_tagatose: >-
    NO DATA AT ALL, despite both appearing in the Methods: "The reaction products that were
    detected in the heated galactose- and tagatose-casein systems were comparable with those in
    the glucose- and fructose-casein systems (results not shown)." The thesis Table 6.2 above
    does carry galactose and tagatose browning endpoints; those are a different run and are
    NOT interchangeable with these trajectories.
  figure_5_mass_balance: >-
    Figure 5 is a STACKED AREA CHART of the quantities already listed above, re-expressed as a
    percentage of initial sugar. Its band boundaries were deliberately not digitized -- they
    carry no information the component series do not, and digitizing stacked boundaries
    compounds the error of every band beneath. Only the top of the stack (total recovery) was
    read, approximately: glucose-casein ~99-100% at 0-5 min, dipping to ~97% around 15-20 min,
    back to ~99-100% by 30-40 min; fructose-casein ~100% to 10 min, dipping to ~92% at 20 min,
    ~99% at 30 and ~96-98% at 40. Consistent with the paper's prose.
