provenance_note: >-
  All values transcribed from tables in the Brands (2002) Wageningen thesis. Nothing is
  interpolated, smoothed or averaged beyond the means the thesis itself prints (Tables 6.1
  and 3.1 report mean +/- SEM; Table 6.2 prints single values with no dispersion).
file_verification:
  status: verified_table
  date: 2026-08-27
  wave: Q
  summary: >-
    ALL 60 DATA VALUES IN THIS FILE ARE VERIFIED AGAINST THE RETRIEVED SOURCE. The thesis PDF
    was downloaded fresh from https://edepot.wur.nl/199005 and Tables 6.1 (PDF p. 105), 6.2
    (PDF p. 107) and 3.1 (PDF p. 44) were rendered as images at 4x and read directly, not via
    the OCR text layer. Every printed digit, every +/- and every SEM matched what this file
    already contained; not one data value required correction. The 6 additional values of the
    a/b' microanalysis column were added because they had been omitted.
  what_was_wrong: >-
    Only metadata was wrong: the ISBN, an unsupported page count, and the printed page numbers
    of Tables 6.1 and 3.1. All four are corrected above under source.corrections_applied.
  not_verified: >-
    Nothing in this file is unverified. What is NOT here -- the multiresponse concentration
    time series -- is described under what_a_human_with_access_should_get_next.
caveats:
  - "A420 in Table 6.2 is measured on samples diluted 4x in 16% w/w SDS (and sometimes diluted once more with water). It is NOT directly comparable to an undiluted absorbance."
  - "the Ames values are already background-corrected: 94 +/- 2 spontaneous revertants/plate were subtracted; positive control 862 +/- 45 revertants/plate."
  - "these are 3 time points per system. They constrain browning ORDERING across sugars far better than they constrain a rate."
what_a_human_with_access_should_get_next: >-
  The real prize in this thesis is the multiresponse concentration data, which are figures
  in a bitonal scan here. Brands & van Boekel (2001) J. Agric. Food Chem. 49:4667-4675,
  DOI 10.1021/jf001430b ("Reactions of monosaccharides during heating of sugar-casein
  systems: building of a reaction network model") is the published version; someone with
  ACS access should check whether its figures are vector in the publisher PDF, in which
  case the same coordinate-extraction used on the Martins figures would recover the
  glucose/fructose/formic-acid/acetic-acid/lysine/melanoidin time series at 120 C.
