# One Arrhenius pair (Ea in kJ/mol, A), traced to its paper.
#
# 2026-10-27: this file once held twelve families under a header claiming they were verified. Ten had no
# source that holds their value (dead or off-topic DOIs, an aggregator URL, a bare author-year, a review,
# a simulation); schiff_condensation had a sourced Ea (Martins 2005) but a prefactor the paper does not
# give. All eleven were deleted; git history keeps them. The pair below was refitted on 2026-08-30 from
# Zheng & Ho 1994's own Table I, as its audit_flag note records. Nothing that makes a prediction reads this file: the
# kinetic core carries its own constants (src/kinetic_core/), and the reader here is the prefactor audit
# (scripts/generators/generate_prefactor_audit.py).

arrhenius_data:
  cysteine_thermolysis:
    A_value: 1.931e12 # B8, 2026-08-30: was 1.0e14, which is 51.8x Zheng & Ho's OWN Table I refit. See the B8 note in audit_flag.
    A_unit: "1/s"
    Ea_kj_mol: 133.0 # B8, 2026-08-30: was 130.4 (the pH 3-9 MEAN, which is not a matched pair with any single column's A). This is the pH 5.0 column, the repo's reference pH, and it is the partner of A = 1.931e12.
    temp_range_C: "80-110 (aqueous)"
    pH: "3-9 (weak dependence)"
    substrate: "Cysteine"
    source: "10.1021/bk-1994-0564.ch011"
    source_quality: "literature"
    audit_flag: >-
      2026-08-26: non-peer-reviewed EGUsphere geoscience preprint on TGA/DSC of geologic materials
      (Congo Basin sediments, Lake Cadagno); it contains no amino-acid kinetics at all, and the
      "midpoint of 162-250" in the comment above could not be located in it. Transfer of Ea = 206 kJ/mol
      to food-phase cysteine thermolysis is unsupported.
      2026-08-26 (source recovery): the closest real measurement of this exact process is Zheng & Ho,
      "Kinetics of the Release of Hydrogen Sulfide from Cysteine and Glutathione During Thermal
      Treatment", ACS Symp. Ser. 564 (Sulfur Compounds in Foods), 138-146 (1994),
      doi 10.1021/bk-1994-0564.ch011: 0.1 M aqueous L-cysteine, pH 3-9, 80-110 C, first-order H2S
      release, Ea = 31.3 / 31.8 / 32.2 / 29.4 kcal/mol at pH 3 / 5 / 7 / 9 = 131.0 / 133.1 / 134.7 /
      123.0 kJ/mol (mean 130.4). Supporting brackets: Yu & Tang, Czech J. Food Sci. 34:503-510 (2016),
      doi 10.17221/86/2016-CJFS, 114.3 kJ/mol for browning-product formation in an
      ascorbate/cysteine system at 125-155 C; and, for the dry/pyrolytic regime only, Yablokov et al.,
      Russ. J. Gen. Chem. 79:1141-1145 (2009), doi 10.1134/S1070363209060188, 193 kJ/mol for neat solid
      L-cysteine at 190-240 C (cystine 184, methionine 195). Recommended aqueous food-phase value:
      Ea ~ 125 kJ/mol, range 115-140 - which is also what FAST_BARRIERS already uses (30 kcal/mol),
      so Zheng & Ho is a better anchor for that number than the "Wedzicha 1984, upper range" comment
      currently attached to it in src/barrier_constants.py.
      CAUTION - do not change Ea alone: paired with the current A = 3.16e7 1/s, Ea = 206 gives
      k(100 C) ~ 5e-22 1/s, i.e. cysteine is inert on any cooking timescale, so the A/Ea pair is
      internally broken independently of the Ea error. A unimolecular prefactor consistent with
      Ea ~ 130 kJ/mol and minutes-to-hours half-lives at 100 C is A ~ 1e14-1e15 1/s. Re-fit A and Ea
      together, and if a dry/low-moisture channel is genuinely needed (extrusion, crust, >180 C),
      add it as a SECOND step at ~190 kJ/mol rather than averaging the two regimes into one barrier -
      averaging is how 206 arose in spirit, and it fits neither regime. APPLIED 2026-08-26
      (owner-approved): Ea 130.4 kJ/mol + A 1e14 1/s per the Zheng & Ho anchor; a dry/pyrolytic
      second channel (~190 kJ/mol) remains future work if extrusion/crust regimes need it.
      2026-08-30 (WAVE B8, FIT_HOLDOUT_DECLARATION.md Amendment 16 clause 1 -- THE PAIR IS NOW
      MATCHED): the 2026-08-26 repair fixed the Ea and left the prefactor a guess. A = 1e14 1/s was
      chosen from the "A ~ 1e14-1e15" order-of-magnitude sentence three lines above, not fitted, and
      results/validation/prefactor_audit.md measured it at 51.8x Zheng & Ho's OWN Table I: a
      weighted refit of the pH 5.0 column (n = 4, weighted R^2 0.9746, unweighted reference fit
      identical) gives Ea = 133.0 kJ/mol with A = 1.931e12 1/s. Both members of the pair now move,
      TOGETHER, exactly as this note's own CAUTION demands: transplanting the fitted A onto the old
      130.4 would have introduced a fresh ~2x rate error at 150 C in the course of removing a 51.8x
      one, because 130.4 was the pH 3-9 MEAN and is a matched partner of no single column's
      prefactor. THIS ALSO CLOSES THE CROSS-LANE FLAG: src/kinetic_core/parameters_sulfur.py's
      `k_cys_h2s` already shipped (133.0 kJ/mol, 1.158e14 1/min = 1.93e12 1/s) from the same table,
      and the two lanes -- which never read each other -- now agree to 0.1% instead of disagreeing
      by 51.8x. The pH axis is NOT represented here: this file has one row per family, the kinetic
      core carries the full pH-resolved matched set in `ZHENG_CYSTEINE_THERMOLYSIS`
      (`cysteine_thermolysis_arrhenius`), and that remains the operative object. What is fixed here
      is the Cantera-lane row that was contradicting it.
