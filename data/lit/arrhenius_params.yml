# ------------------------------------------------------------------------------
# Maillard Reaction & Advanced Sulfur Kinetics: Evaluated Arrhenius Parameters
# ------------------------------------------------------------------------------
# This dataset compiles verified kinetic parameters (Activation Energy, Ea, and 
# Pre-exponential factor, A). It passed external model verification for accuracy.
# 
# Verification & Trust Notes:
# 1. Units: All activation energies have been standardized to kJ/mol. Literature 
#    values reported in kcal/mol have been explicitly converted (1 kcal = 4.184 kJ).
# 2. Placeholders: Pre-exponential factors (A_value) marked as `0.0` denote pathways
#    where the frequency factor is highly dependent on the food matrix (moisture, 
#    physical state, collision frequency). These require empirical calibration against
#    experimental concentration data when used in ordinary differential equation (ODE) solvers.
# 3. Midpoints: Where literature defines a range without specific matrix context, 
#    the mathematical midpoint is utilized as the heuristic baseline.
#
# AUDIT 2026-08-26 (citation verification pass): several sources below did NOT
# survive adversarial checking. Entries carry an `audit_flag` where the source is
# dead, off-topic, or non-citable; values are UNCHANGED pending human re-anchoring
# (see tasks/audit_remediation.md). Known cross-file inconsistency: this file and
# src/barrier_constants.py FAST_BARRIERS disagree on several families while both
# claiming literature anchoring — most severely thiol_addition (29 kJ/mol here vs
# 28.85 kcal/mol = 120.7 kJ/mol in FAST_BARRIERS: same numerals, different units,
# a suspected kJ/kcal transcription collision). FAST_BARRIERS values are fitted
# calibration constants; do not treat the two files as interchangeable anchors.
#
# ==============================================================================
# AUDIT 2026-08-27 (Wave I fix 10) — READ THIS BEFORE USING ANY A/Ea PAIR BELOW.
# Red-team finding H5. NOTHING IN THIS FILE WAS RETUNED BY WAVE I. Every value
# is byte-identical to what shipped before; what follows is arithmetic, not a
# change. Several A/Ea pairs are physically broken, and the breakage is only
# visible once you actually evaluate k(T) — which nobody had.
#
# WHICH TABLE IS AUTHORITATIVE FOR WHICH LANE (state this before comparing them):
#   * src/barrier_constants.py FAST_BARRIERS (kcal/mol) is authoritative for the
#     SCREENING / recommend lane: src/recommend.py, src/pipeline.py, the FAST
#     rankings and every benchmark prediction that goes through
#     src/benchmark_validation.py. Those are FITTED calibration constants.
#   * THIS FILE (kJ/mol + A) is authoritative for the CANTERA EXPORT lane:
#     src/barrier_constants.get_arrhenius_params -> src/cantera_export.py ->
#     scripts/run_cantera_kinetics.py. Those claim to be literature values.
#   The two lanes never read each other's numbers, which is why the
#   disagreements below have survived: no single code path evaluates both.
#
# SCHIFF / AMADORI ORDERING INVERSION — the two tables disagree about which of
# the first two steps of the entire Maillard cascade is faster, and they
# disagree by nine orders of magnitude in the ratio. At 150 C:
#     FAST_BARRIERS (screening lane, Eyring-form with its own A=1e11 reference):
#         schiff_condensation   15.0 kcal/mol -> t1/2 = 2.59e-4 s
#         amadori_rearrangement 23.0 kcal/mol -> t1/2 = 5.26 s
#         => SCHIFF IS ~2.0e4 x FASTER than Amadori.
#     THIS FILE (Cantera lane, with the A values as written):
#         schiff_condensation   A=1.5e11, Ea=97.0 kJ/mol -> t1/2 = 4.36 s
#         amadori               A=1.0e11, Ea=59.0 kJ/mol -> t1/2 = 1.33e-4 s
#         => AMADORI IS ~3.3e4 x FASTER than Schiff.
#   The rate-determining step of the cascade is therefore whichever file you
#   happened to read.
#
# ------------------------------------------------------------------------------
# RESOLVED 2026-08-27 (Wave S3) — THIS FILE HAS THE ORDERING RIGHT AND THE
# MAGNITUDE WRONG BY ~700x. VALUES UNCHANGED.
# ------------------------------------------------------------------------------
# Wave S3 fitted the sugar trunk to MEASURED concentration-time trajectories:
# Martins' glucose/glycine multiresponse data at 80/100/120 C, which measure the
# Amadori compound (DFG) directly, plus a second experiment on ISOLATED DFG that
# separates the rearrangement from its own formation. Both live in
# data/lit/timeseries/. Fit: scripts/generators/generate_trunk_rate_calibration.py
# Result: results/validation/trunk_rate_calibration_refit.{json,md}
#
# The comparison can only be made on a PSEUDO-FIRST-ORDER basis, because the
# condensation is bimolecular and the rearrangement is not. At the experiment's
# own 200 mmol/L glycine loading and 100 C:
#     k_schiff * [Gly] = 3.39e-3 1/min   (condensation)
#     k_amadori        = 1.51e-1 1/min   (rearrangement)
#     => AMADORI IS ~45x FASTER; the CONDENSATION is rate-determining.
# A profile likelihood rejects every ratio from 0.1 to 1e6 outside a narrow band
# around 45, at 95% confidence.
#
# SCORECARD, both files:
#   * THIS FILE says ~3.3e4 (Amadori faster). RIGHT SIGN. Rejected on magnitude
#     (chi-square statistic ~9.1e2): 59 kJ/mol paired with A = 1e11 1/s gives a
#     sub-millisecond half-life, and the measurement gives minutes.
#   * src/barrier_constants.py FAST_BARRIERS says ~1/2.0e4 (Schiff faster).
#     WRONG SIGN, rejected far more strongly (~7.5e4).
# The reconciliation is therefore NOT "pick a file". The ordering this file
# asserts is correct and the screening lane's is inverted; the magnitude this
# file asserts is wrong by roughly three orders of magnitude.
#
# WHAT WAS AND WAS NOT CHANGED. Nothing here moved. The `amadori` entry's A/Ea
# pair remains internally broken for the reason its own audit_flag gives, and
# the fitted rate now bounds what a repaired pair must reproduce:
#     k_amadori(100 C) = 0.151 1/min = 2.52e-3 1/s  (95% CI 0.104-0.220 1/min)
#     Ea = 42 kJ/mol (95% CI 20-64), CONSTRAINED but poorly, because a step this
#     fast contributes little curvature to the observable over 80-120 C.
# Any repair must satisfy A * exp(-Ea/(R*373.15)) = 2.52e-3 1/s. Written out
# with the current Ea = 59.0 kJ/mol:
#     59000 / (8.314 * 373.15) = 19.017;  exp(-19.017) = 5.50e-9
#     A = 2.52e-3 / 5.50e-9   = 4.6e5 1/s
# not the 1.0e11 written below — i.e. the PREFACTOR is the member of the pair
# that is wrong, by 5.3 orders of magnitude, exactly as this entry's own
# audit_flag suspected ("the A = 1e11 1/s is a generic unimolecular TST
# prefactor that was never fitted jointly with this Ea").
# DO NOT PATCH EITHER HALF ALONE. OPEN OWNER ITEM.
# ==============================================================================

arrhenius_data:
  # 1. Mutarotation & Ring Opening
  mutarotation:
    A_value: 1.0e12 # TST default for unimolecular
    A_unit: "1/s"
    Ea_kj_mol: 94.5 # Midpoint of 91-98
    temp_range_C: "Standard"
    pH: "Solvent-assisted"
    substrate: "Hexoses, Pentoses"
    source: "10.1063/5.0288357"
    source_quality: "estimated_tst"
    
  # 2. Schiff Base Formation
  schiff_condensation:
    A_value: 1.5e11 # NOT from the source (thesis reports a reparameterised X = k(T_av), not Arrhenius A); legacy value retained
    A_unit: "L/mol.s"
    Ea_kj_mol: 97.0 # corrected 2026-08-26 from 57.0 (owner-approved): thesis Table 5.2, Glu+Gly -> DFG step, 97 +/- 3 kJ/mol
    temp_range_C: "80-120"
    pH: 6.8 # the pH at which the 97 kJ/mol was fitted (was recorded as 5.5, unsupported)
    substrate: "Acyclic Carbonyl + Amine"
    source: "10.1016/j.foodchem.2004.04.006"
    source_quality: "literature"
    audit_flag: >-
      2026-08-26 (source recovery): the cited source is Martins & Van Boekel, Food Chemistry 90:257-269
      (2005), = Chapter 5 of Martins' Wageningen PhD thesis 'Unravelling the Maillard reaction network by
      multiresponse kinetic modelling' (2003, open access at https://edepot.wur.nl/121418). That chapter's
      Table 5.2 is the only Ea table in the work; for the glucose + glycine condensation step (step 1,
      Glu + Gly -> DFG, which lumps Schiff-base formation with the Amadori rearrangement) it reports
      Ea = 97 +/- 3 kJ/mol, fitted multiresponse over 80-120 C at pH 6.8. The full set of fitted Ea values
      is 97, 123, 93, 97, 30, 125, 107, 76, 95, 237 kJ/mol - 57 kJ/mol appears nowhere in the thesis, and
      no Ea is reported at the pH 5.5 recorded in this entry. The A_value comment ("from Martins & van
      Boekel") is also not literal: the thesis reports a reparameterised prefactor X = k(T_av) = 1.61e-5,
      not an Arrhenius A. CORRECTED to 97 kJ/mol on 2026-08-26 (owner-approved). CAVEAT that remains
      open: Martins' 97 kJ/mol is an apparent condensation+rearrangement composite, so this entry and
      `amadori` (59 kJ/mol) now partially double-count the same lumped barrier - re-derive the split
      when the Cantera lane is next recalibrated.

  # 3. Amadori/Heyns Rearrangement
  amadori:
    A_value: 1.0e11 # Typical for Amadori rearrangement (Martins 2003)
    A_unit: "1/s"
    Ea_kj_mol: 59.0
    temp_range_C: "80-120"
    pH: "Neutral"
    substrate: "Aldosylamine"
    source: "10.1021/jf025561j"
    source_quality: "literature_estimated"
    audit_flag: >-
      2026-08-26: DOI resolves to Davidek/Clety/Aubin/Blank 2002, not Martins 2003 as the A_value
      comment claims; value unverified against either.
      2026-08-27 (Wave I fix 10, red-team H5) — PHYSICALLY BROKEN A/Ea PAIR. VALUE UNCHANGED,
      arithmetic stated so it stops being invisible. Ea = 59.0 kJ/mol is 14.10 kcal/mol. Paired
      with the A = 1.0e11 1/s written above:
          k(100 C) = 5.50e2 1/s   -> t1/2 = 1.26 ms
          k(140 C) = 3.47e3 1/s   -> t1/2 = 0.20 ms
          k(150 C) = 5.21e3 1/s   -> t1/2 = 0.13 ms
      The Amadori rearrangement is the step the whole cascade is named for and it is measured in
      MINUTES TO HOURS at these temperatures; a sub-millisecond half-life means this pair models it
      as instantaneous, i.e. it cannot be rate-determining for anything and the Cantera lane's
      Amadori pool is at steady state the moment the Schiff base appears. Two candidate causes,
      neither resolved here: (a) 59 kJ/mol is roughly HALF the 97-125 kJ/mol band that Martins'
      own multiresponse fit spans, so it may be a mis-transcribed member of that set; (b) the
      A = 1e11 1/s is a generic unimolecular TST prefactor that was never fitted jointly with this
      Ea — the same failure mode that was found and repaired in `cysteine_thermolysis` (see its
      CAUTION note: do not change Ea alone). DO NOT patch Ea without re-fitting A.
      See also the SCHIFF/AMADORI ORDERING INVERSION block in this file's header: this entry is the
      faster half of an ordering that src/barrier_constants.py FAST_BARRIERS reverses.

  # 3.5 Enolisation (1,2 and 2,3 pathways)
  enolisation:
    A_value: 1e12 # TST range
    A_unit: "1/s"
    Ea_kj_mol: 120.0 
    temp_range_C: "Standard"
    pH: "Matrix dependent"
    substrate: "Amadori/Heyns Product"
    source: "10.1016/S0924-2244(01)00022-X"
    source_quality: "literature_estimated"

  # 4. Dehydration (e.g. Fructose to HMF)
  dehydration:
    A_value: 3.09e11 # 10^11.49
    A_unit: "1/s"
    Ea_kj_mol: 123.88
    temp_range_C: "Standard"
    pH: "Acidic/Neutral"
    substrate: "Fructose / 3-DG"
    source: "https://www.science.gov/topicpages/m/model+compounds+reaction.html"
    source_quality: "non_citable_aggregator"
    audit_flag: "2026-08-26: source is a topic-aggregator URL (currently unreachable), not a publication; Ea/A untraceable."
    
  # 5. Strecker Degradation
  strecker:
    A_value: 1e10 # Estimated from Hofmann 2000 (lower due to complex transition state)
    A_unit: "1/s"
    Ea_kj_mol: 80.3328 
    temp_range_C: "Standard"
    pH: "Neutral"
    substrate: "a-Dicarbonyl + Leucine"
    source: "T.P. Labuza 1998"
    source_quality: "non_citable_author_year_only"
    audit_flag: "2026-08-26: source is a bare author-year string with no DOI, title or venue, so it is not resolvable or verifiable; the A_value comment separately credits 'Hofmann 2000', a third uncited work. Ea=80.33 kJ/mol is unanchored."

  # 5.5 Retro-aldol Cleavage
  retro_aldol:
    A_value: 1e15 # Extremely high due to fragmentation entropy
    A_unit: "1/s"
    Ea_kj_mol: 160.0 
    temp_range_C: "High heat / Pyrolysis"
    pH: "Alkaline favored"
    substrate: "Amadori Product / Intact Sugars"
    source: "10.1080/10408398.2017.1378865"
    source_quality: "off_topic_source"
    audit_flag: "2026-08-26: DOI is ALjahdali & Carbonero 2017, a nutrition/digestion review of MRP health effects; it contains no retro-aldol activation energies."

  # 6. Pyrazine Condensation 
  pyrazine_condensation:
    A_value: 1.0e11 # Typical bimolecular
    A_unit: "L/mol.s"
    Ea_kj_mol: 138.072 
    temp_range_C: "Standard"
    pH: "Alkaline favored"
    substrate: "a-aminoketones"
    source: "10.1016/j.foodchem.2025.145652"
    source_quality: "estimated"

  # 7. Cysteine Thermolysis (H2S release)
  cysteine_thermolysis:
    A_value: 1.0e14 # re-fitted 2026-08-26 together with Ea (old pair was internally broken: A=3.16e7 with Ea=206 gave k(100C)~5e-22/s, i.e. inert)
    A_unit: "1/s"
    Ea_kj_mol: 130.4 # corrected 2026-08-26 from 206.0 (owner-approved): Zheng & Ho 1994 aqueous H2S release, mean over pH 3-9
    temp_range_C: "80-110 (aqueous)"
    pH: "3-9 (weak dependence)"
    substrate: "Cysteine"
    source: "10.1021/bk-1994-0564.ch011"
    source_quality: "literature"
    audit_flag: >-
      2026-08-26: non-peer-reviewed EGUsphere geoscience preprint on TGA/DSC of geologic materials
      (Congo Basin sediments, Lake Cadagno); it contains no amino-acid kinetics at all, and the
      "midpoint of 162-250" in the comment above could not be located in it. Transfer of Ea = 206 kJ/mol
      to food-phase cysteine thermolysis is unsupported.
      2026-08-26 (source recovery): the closest real measurement of this exact process is Zheng & Ho,
      "Kinetics of the Release of Hydrogen Sulfide from Cysteine and Glutathione During Thermal
      Treatment", ACS Symp. Ser. 564 (Sulfur Compounds in Foods), 138-146 (1994),
      doi 10.1021/bk-1994-0564.ch011: 0.1 M aqueous L-cysteine, pH 3-9, 80-110 C, first-order H2S
      release, Ea = 31.3 / 31.8 / 32.2 / 29.4 kcal/mol at pH 3 / 5 / 7 / 9 = 131.0 / 133.1 / 134.7 /
      123.0 kJ/mol (mean 130.4). Supporting brackets: Yu & Tang, Czech J. Food Sci. 34:503-510 (2016),
      doi 10.17221/86/2016-CJFS, 114.3 kJ/mol for browning-product formation in an
      ascorbate/cysteine system at 125-155 C; and, for the dry/pyrolytic regime only, Yablokov et al.,
      Russ. J. Gen. Chem. 79:1141-1145 (2009), doi 10.1134/S1070363209060188, 193 kJ/mol for neat solid
      L-cysteine at 190-240 C (cystine 184, methionine 195). Recommended aqueous food-phase value:
      Ea ~ 125 kJ/mol, range 115-140 - which is also what FAST_BARRIERS already uses (30 kcal/mol),
      so Zheng & Ho is a better anchor for that number than the "Wedzicha 1984, upper range" comment
      currently attached to it in src/barrier_constants.py.
      CAUTION - do not change Ea alone: paired with the current A = 3.16e7 1/s, Ea = 206 gives
      k(100 C) ~ 5e-22 1/s, i.e. cysteine is inert on any cooking timescale, so the A/Ea pair is
      internally broken independently of the Ea error. A unimolecular prefactor consistent with
      Ea ~ 130 kJ/mol and minutes-to-hours half-lives at 100 C is A ~ 1e14-1e15 1/s. Re-fit A and Ea
      together, and if a dry/low-moisture channel is genuinely needed (extrusion, crust, >180 C),
      add it as a SECOND step at ~190 kJ/mol rather than averaging the two regimes into one barrier -
      averaging is how 206 arose in spirit, and it fits neither regime. APPLIED 2026-08-26
      (owner-approved): Ea 130.4 kJ/mol + A 1e14 1/s per the Zheng & Ho anchor; a dry/pyrolytic
      second channel (~190 kJ/mol) remains future work if extrusion/crust regimes need it.

  # 8. Thiol Addition
  thiol_addition:
    A_value: .nan # Placeholder
    A_unit: "L/mol.s"
    Ea_kj_mol: 29.0 # Midpoint 28-30
    temp_range_C: "Standard"
    pH: "Neutral"
    substrate: "H2S + Carbonyls"
    source: "https://www.researchgate.net...acrylamide_removal"
    source_quality: "non_citable_truncated_url"
    audit_flag: >-
      2026-08-26: literally truncated ResearchGate URL, not a citation. Also the suspected kJ/kcal
      collision partner of FAST_BARRIERS thiol_addition (28.85 kcal/mol); establish intended units
      before any recalibration.
      2026-08-27 (Wave I fix 10, red-team H5) — BROKEN PAIR. VALUE UNCHANGED. Two separate defects:
      (1) EFFECTIVELY BARRIERLESS. Ea = 29.0 kJ/mol is 6.93 kcal/mol. A_value is `.nan`, so
      src/barrier_constants.get_arrhenius_params silently substitutes 6.25e12 ("TST @ 150C"),
      giving
          k(100 C) = 5.45e8   -> t1/2 = 1.27e-9 s
          k(140 C) = 1.35e9   -> t1/2 = 5.15e-10 s
          k(150 C) = 1.64e9   -> t1/2 = 4.22e-10 s
      HONESTY NOTE ON THE RED-TEAM WORDING: the finding was filed as "implies a rate faster than
      diffusion". Evaluated, that overstates it. Read as a bimolecular constant, 1.6e9 L/mol/s at
      150 C sits roughly one to two orders of magnitude BELOW the aqueous diffusion ceiling
      (~1e10 L/mol/s at 25 C, higher at 150 C). The defensible statement is weaker but still
      damning: 6.93 kcal/mol makes H2S addition to a carbonyl essentially barrierless and therefore
      never rate-limiting, in a model whose entire sulfur branch is supposed to be selectivity-
      controlled at exactly this step. The 2026-08-26 kJ/kcal collision hypothesis is the likely
      cause: FAST_BARRIERS uses 28.60 kcal/mol = 119.7 kJ/mol in the same slot, 4.1x this value.
      (2) UNIT MISMATCH IN THE NaN SUBSTITUTION. A_unit here is "L/mol.s" (bimolecular), but the
      substituted 6.25e12 is a UNIMOLECULAR TST prefactor in 1/s. The Cantera lane is therefore
      handed a first-order prefactor for a second-order reaction whenever this entry is used.
      Both are OPEN OWNER ITEMS; fixing either requires re-fitting A and Ea together.

  # 9. DHA beta-elimination
  beta_elimination_dha:
    A_value: .nan # Placeholder
    A_unit: "1/s"
    Ea_kj_mol: 79.496 # Midpoint 19 kcal/mol * 4.184
    temp_range_C: "Standard"
    pH: "Mildly alkaline"
    substrate: "Serine/Cysteine"
    source: "10.1021/bi00270a010 (Helmerhorst, E., & Stokes, G. B., 1983)"
    audit_flag: >-
      2026-08-26: DOI resolves correctly to Helmerhorst & Stokes 1983 Biochemistry, but that paper
      characterises an acid-stable persulfide-like residue in alkali/sulfhydryl-treated insulin —
      mechanistic evidence for beta-elimination of disulfides, not a kinetics study; the
      19 kcal/mol (79.5 kJ/mol) midpoint cannot be traced to it.
      2026-08-27 (Wave I fix 10, red-team H5) — THE DEFECT HERE IS THE PREFACTOR, NOT THE BARRIER.
      VALUE UNCHANGED. A_value is `.nan`, a bare placeholder, so this entry HAS NO PREFACTOR AT ALL:
      the pair cannot produce a rate as written, and the Cantera export lane only gets a number
      because src/barrier_constants.get_arrhenius_params silently substitutes 6.25e12 1/s
      ("TST @ 150C") for any NaN. That substitution is undeclared at the point of use, so the
      "literature-anchored" label this file claims is, for this entry, carrying a hard-coded
      default. With the substituted prefactor and Ea = 79.496 kJ/mol (19.00 kcal/mol):
          k(100 C) = 46.5 1/s   -> t1/2 = 14.9 ms
          k(140 C) = 5.56e2 1/s -> t1/2 = 1.25 ms
          k(150 C) = 9.60e2 1/s -> t1/2 = 0.72 ms
      i.e. dehydroalanine formation is instantaneous on any cooking timescale, and the DHA /
      lysinoalanine crosslinking lane downstream of it can never be limited by this step. Unlike
      `amadori` and `thiol_addition` the BARRIER is at least in a plausible band and agrees with the
      screening lane (FAST_BARRIERS `beta_elimination` = 18.0 kcal/mol, 1 kcal/mol lower), so the
      repair needed is a real fitted A, not a new Ea. Compare `cysteine_thermolysis`, whose A was
      re-fitted for exactly this reason on 2026-08-26. OPEN OWNER ITEM.

  # 10. Thiamine Thermal Degradation
  thiamine_degradation:
    A_value: 1.0e9 # 10^9
    A_unit: "1/s"
    Ea_kj_mol: 100.8
    temp_range_C: "4-160"
    pH: "Matrix dependent"
    substrate: "Vitamin B1"
    source: "10.1016/0022-1416(84)90226-9 (or similar lit)"
    source_quality: "dead_doi"
    audit_flag: "2026-08-26: DOI does not resolve (CrossRef 404), and the source string itself hedges with 'or similar lit'; no replacement located. Ea=100.8 kJ/mol is unanchored. Real thiamine kinetics anchors already exist in benchmark_intake_registry.json (Voelker 2018 10.1016/j.foodres.2018.06.056; Voelker 2021 10.1186/s13065-021-00773-y)."
