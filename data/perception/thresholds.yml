schema_version: 1
schema: data/schemas/perception_thresholds.schema.json
step: perception 7.1 (docs/reference/perception/SCOPING_2026-11.md sec. 4, row 7.1 and its result block)
curated: 2026-11-15
description: >-
  Odour thresholds for the odorants of the lever table (results/validation/lever_table.json, every compound that
  enters a cell), one entry per odorant: a cited threshold with its medium, units, criterion and route, or an
  explicit no_measured_threshold with the reason. Hand-curated; every record quotes its table and row. A reference
  INPUT for a perception reading, never a scored prediction, and not read by the engine (src/kinetic_core/).
rules:
  - One panel and one method first. Czerny et al. 2008 Table 1 (water, orthonasal, detection threshold) is keyed
    for every lever-table odorant it lists; the recognition threshold of the same row is quoted in the notes, not
    keyed as a second criterion.
  - Other sources only where Czerny 2008 has no value for that odorant in that medium. A secondary source counts
    only when it names the primary for that row; it is then keyed with source_kind secondary_quotation and the
    primary in primary_citation.
  - One criterion per odorant per medium. A gelatin record (75 % uncorrected) next to a water record (triangle
    series) is a different medium, not a conversion; the two are never compared without matching media.
  - The value is keyed as printed with the printed units. value_ug_per_l is the same number in ug/L; any
    conversion behind it is stated in unit_conversion.
excluded_sources:
  - source: data/species/desirable_targets.yml, data/species/off_flavour_targets.yml
    reason: uncited; their declared source (pathways.md) exists nowhere (the files say so).
  - source: Zhou 2023 SI Table S2 (WATER_THRESHOLDS in src/kinetic_core/matrix_oav.py)
    reason: provenance unknown; the SI prints no reference for any value.
  - source: Thong et al. 2024 (Food Res Int 177:113848) Table 4, Threshold column
    reason: no primary citation and no medium for any row, so it fails the secondary-source rule. Its values are
      quoted in the notes of the odorants it lists, for comparison only.
  - source: matrix_oav.py water values back-solved from published OAVs (Xin 2026 / 2026b) or printed there without
      a citation (1-octen-3-ol, nonanal, 2-pentylfuran, 2-heptanone)
    reason: no measured threshold behind them; back-solving recovers the unnamed value another paper used.
