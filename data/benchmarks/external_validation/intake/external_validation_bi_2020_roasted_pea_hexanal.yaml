measured_volatiles:
  hexanal:
    conc_ppb: 324.0
    value_provenance: derived_from_oav_and_repo_threshold
    value_provenance_note: '2026-08-27 (Wave I, cold-start red-team finding): this
      value is NOT an independently measured concentration in this repo''s chain of
      custody. The arithmetic is exact: OAV 72 (the value the intake registry records
      for this anchor, the roasted-pea carryover point, 324 ug/kg) x 4.5 ppb, where
      4.5 ppb is THIS REPO''S OWN hexanal odour-detection threshold -- itself a compilation-level
      number that has never been read off a primary table (see the hexanal ODT anchor''s
      harmonization_note in this file; published aqueous hexanal ODTs span 0.3-14
      ug/L). 72 x 4.5 = 324.0 to the digit. It is therefore possible that the source
      reports 324 ug/kg directly and the OAV is the derived quantity -- but that has
      NOT been confirmed against the paper, and the exact divisibility by our own
      unsourced constant is precisely why the two readings cannot be told apart from
      inside the repo. Scored as a hold-out point it is a consistency check against
      our own threshold, not an external measurement, and it MOVES if that threshold
      is ever corrected.'
