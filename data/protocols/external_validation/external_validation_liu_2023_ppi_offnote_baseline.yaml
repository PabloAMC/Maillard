    The bundle stays evidence_class external_validation_only, stays out of every fit,
    and its classification is unchanged by carrying the correct DOI.'
  content_correction_note: '2026-08-27 (Wave R): BOTH scored rows of this bundle were
    content-corrected. The prior citation string ''Liu, Y. (2023 thesis)'' was doubly
    wrong -- the thesis is 2021, and the numbers attached to it (hexanal 15-180 ppb,
