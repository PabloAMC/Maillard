  notes: 'Lot-to-lot pea-protein off-note baseline from Liu (2021 thesis / 2023 paper).
    Conditions are proxied onto the existing ambient pea-isolate matrix-only lane
    so the bundle stays executable but external-only. 2026-08-27 (Wave R): the proxied
    pH 6.0 is NOT the source pH -- Table 2.3 reports the rehydrated 10%-solids slurries
