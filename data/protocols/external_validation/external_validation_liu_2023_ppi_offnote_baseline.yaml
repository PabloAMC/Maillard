experiment_id: external_validation_liu_2023_ppi_offnote_baseline
source_kind: external_literature
evidence_class: external_validation_only
protein_type: pea_iso
process_state: ambient_slurry
matrix_format: commercial pea protein rehydrated to 10% solids (w/w) in deionized
  water; external hold-out. The 9 quantified samples of Table 2.7 are 5 ISOLATES (4,
  12, 13, 14, 16) and 4 CONCENTRATES (1, 2, 19, 22). protein_type stays `pea_iso`
  because that is the executable lane this bundle is proxied onto, not because the
  panel is isolate-only.
conditions:
  temp_C: 40.0
  ph: 6.0
  water_activity: 0.95
  time_min: 10.0
formulation:
  precursors:
    Pea Protein Isolate:
      concentration_mM: 1000.0
measured_volatiles:
  hexanal:
    conc_ppb: 11320.0
    value_provenance: band_geometric_midpoint
    value_provenance_note: '2026-08-27 (Wave R): the source reports one value per
      commercial lot, not a single number. The scored hold-out number is the geometric
      midpoint sqrt(2445.0 * 52454.0) = 11320 ppb (4 s.f.) of the inter-lot min/max
      -- a construction of ours. The honest uncertainty is the band itself (a factor
      of 21.45 end to end), so a prediction landing inside it is weak evidence. UNITS
      BASIS: ug/L OF THE REHYDRATED 10%-SOLIDS (w/w) SLURRY, read as ppb on the aqueous
      slurry (rho ~ 1 kg/L). It is NOT a per-gram-of-powder basis and NOT a headspace
      concentration. DI-WATER CALIBRATION CAVEAT: quantified by HS-SPME-GC-MS/MS external
      standard curves with response factors (R^2 > 0.95), and the curves were built
      by spiking the authentic standards into DI WATER, not into the protein matrix
      (thesis section 2.9: "SPME extracts were prepared as described earlier ... except
      that pea protein solutions were replaced with 5 mL DI water and were spiked
      with known compounds at five different levels"). Protein binding of the analyte
      is uncorrected, so every value here is a LOWER BOUND on total analyte in the
      slurry.'
    band_min_ppb: 2445.0
    band_max_ppb: 52454.0
    band_span_fold: 21.5
    uncertainty_pct: 363.2
    uncertainty_pct_basis: upward half-width of the reported band relative to its
      geometric midpoint; NOT a symmetric analytical uncertainty. Read band_min_ppb/band_max_ppb
      instead.
    content_correction_note: 'CONTENT CORRECTION 2026-08-27 (Wave R). PREVIOUS VALUE:
      band 15.0-180.0 ppb, geometric midpoint 51.96 ppb, with OAV 3-40. WHAT IT MATCHED
      IN THE SOURCE: NOTHING. No hexanal concentration and no hexanal OAV in the thesis
      is within two orders of magnitude of those numbers; the band is retired as unsourced.
      SOURCE: Yaozheng Liu, "Flavor Chemistry of Pea Proteins", MS thesis, North Carolina
      State University, 2021 (NC State Institutional Repository item db647868-5ffe-4621-9f11-bbc4db357406);
      published as Liu, Cadwallader & Drake (2023), Food Chemistry 406:134998, doi
      10.1016/j.foodchem.2022.134998. TABLE/ROW: Table 2.7 ''Concentrations of positively
      identified aroma-active compounds of pea proteins'', row `Hexanal 2` = 4318
      +/- 481, 3360 +/- 274, 2445 +/- 212, 6052 +/- 776, 6383 +/- 409, 11203 +/- 2216,
      12181 +/- 4237, 52454 +/- 34133, 2533 +/- 804 ug/L. NEW BAND = that inter-lot
      min/max (2445-52454). Table 2.7 quantifies 9 of the 24 commercial pea proteins:
      samples 4, 12, 13, 14, 16 (isolates) and 1, 2, 19, 22 (concentrates), per Table
      2.3. Column order in the row quotations below is 1, 2, 4, 12, 13, 14, 16, 19,
      22. OAV RANGE 543-11656 is Table 2.8, row `Hexanal`, against the thesis''s own
      4.5 ug/L water threshold -- which happens to equal this repo''s hexanal ODT,
      so the OAVs transfer without rescaling. UNITS BASIS: ug/L OF THE REHYDRATED
      10%-SOLIDS (w/w) SLURRY, read as ppb on the aqueous slurry (rho ~ 1 kg/L). It
      is NOT a per-gram-of-powder basis and NOT a headspace concentration. DI-WATER
      CALIBRATION CAVEAT: quantified by HS-SPME-GC-MS/MS external standard curves
      with response factors (R^2 > 0.95), and the curves were built by spiking the
      authentic standards into DI WATER, not into the protein matrix (thesis section
      2.9: "SPME extracts were prepared as described earlier ... except that pea protein
      solutions were replaced with 5 mL DI water and were spiked with known compounds
      at five different levels"). Protein binding of the analyte is uncorrected, so
      every value here is a LOWER BOUND on total analyte in the slurry. NOT SCORED,
      recorded for honesty: the ISOLATE-ONLY subset (samples 4, 12, 13, 14, 16) is
      2445-12181 ug/L, geometric mid 5457. The 52454 top of the scored band is sample
      19, a CONCENTRATE and the lowest-protein sample of the panel (52.8 wt% protein,
      Table 2.3).'
  nonanal:
    conc_ppb: 0.8018
    value_provenance: band_geometric_midpoint
    value_provenance_note: '2026-08-27 (Wave R): the source reports one value per
      commercial lot, not a single number. The scored hold-out number is the geometric
      midpoint sqrt(0.188 * 3.42) = 0.8018 ppb of the inter-lot min/max -- a construction
      of ours. The honest uncertainty is the band itself (a factor of 18.19 end to
