      OF THE REHYDRATED 10%-SOLIDS (w/w) SLURRY, read as ppb on the aqueous slurry
      (rho ~ 1 kg/L). It is NOT a per-gram-of-powder basis and NOT a headspace concentration.
      DI-WATER CALIBRATION CAVEAT: quantified by HS-SPME-GC-MS/MS external standard
      curves with response factors (R^2 > 0.95), and the curves were built by spiking
      the authentic standards into DI WATER, not into the protein matrix (thesis section
      2.9: "SPME extracts were prepared as described earlier ... except that pea protein
      solutions were replaced with 5 mL DI water and were spiked with known compounds
      at five different levels"). Protein binding of the analyte is uncorrected, so
      every value here is a LOWER BOUND on total analyte in the slurry.'
    band_min_ppb: 0.188
    band_max_ppb: 3.42
    band_span_fold: 18.2
    uncertainty_pct: 326.5
    uncertainty_pct_basis: upward half-width of the reported band relative to its
      geometric midpoint; NOT a symmetric analytical uncertainty. Read band_min_ppb/band_max_ppb
      instead.
    content_correction_note: 'CONTENT CORRECTION 2026-08-27 (Wave R). PREVIOUS VALUE:
      band 5.0-50.0 ppb, geometric midpoint 15.81 ppb, with OAV 5-50. WHAT IT MATCHED
      IN THE SOURCE: NOTHING. Every nonanal value in the thesis is sub-ppb to low-single-digit
      ppb; the old band was 6x-266x too HIGH and is retired as unsourced. SOURCE:
      Yaozheng Liu, "Flavor Chemistry of Pea Proteins", MS thesis, North Carolina
      State University, 2021 (NC State Institutional Repository item db647868-5ffe-4621-9f11-bbc4db357406);
      published as Liu, Cadwallader & Drake (2023), Food Chemistry 406:134998, doi
      10.1016/j.foodchem.2022.134998. TABLE/ROW: Table 2.7, row `Nonanal 2` = 0.797
      +/- 0.55, 0.469 +/- 0.30, 0.188 +/- 0.040, 0.301 +/- 0.075, 0.652 +/- 0.11,
      0.861 +/- 0.11, 1.06 +/- 0.77, 1.15 +/- 0.66, 3.42 +/- 0.71 ug/L. NEW BAND =
      that inter-lot min/max (0.188-3.42). Table 2.7 quantifies 9 of the 24 commercial
      pea proteins: samples 4, 12, 13, 14, 16 (isolates) and 1, 2, 19, 22 (concentrates),
      per Table 2.3. Column order in the row quotations below is 1, 2, 4, 12, 13,
      14, 16, 19, 22. INDEPENDENT CORROBORATION IN THE SAME THESIS: Table 2.8 reports
      nonanal OAV as ''<1 <1 <1 <1 <1 1 1 1 3'' against a 1 ug/L water threshold,
      which is only consistent with sub-ppb-to-3-ppb concentrations. Because that
      threshold is 1.0, the OAV band and the concentration band coincide numerically.
      UNITS BASIS: ug/L OF THE REHYDRATED 10%-SOLIDS (w/w) SLURRY, read as ppb on
      the aqueous slurry (rho ~ 1 kg/L). It is NOT a per-gram-of-powder basis and
      NOT a headspace concentration. DI-WATER CALIBRATION CAVEAT: quantified by HS-SPME-GC-MS/MS
      external standard curves with response factors (R^2 > 0.95), and the curves
      were built by spiking the authentic standards into DI WATER, not into the protein
      matrix (thesis section 2.9: "SPME extracts were prepared as described earlier
      ... except that pea protein solutions were replaced with 5 mL DI water and were
      spiked with known compounds at five different levels"). Protein binding of the
      analyte is uncorrected, so every value here is a LOWER BOUND on total analyte
      in the slurry. CONSEQUENCE, REPORTED PLAINLY: this correction makes the hold-out
      WORSE, not better. See the Wave R hold-out table in tasks/audit_remediation.md.'
