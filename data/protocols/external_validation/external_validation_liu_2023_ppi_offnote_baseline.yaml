measured_volatiles:
  hexanal:
    conc_ppb: 51.96
    value_provenance: band_geometric_midpoint
    value_provenance_note: '2026-08-27 (Wave I): the source reports a RANGE across
      commercial PPI lots, not a value. The scored hold-out number is the geometric
      midpoint sqrt(15.0 * 180.0) -- a construction of ours. The honest uncertainty
      is the band itself (a factor of 12.0 end to end), so a prediction landing inside
      it is weak evidence. Until 2026-08-27 the midpoint was written at full float
      precision (e.g. 51.96152422706632), advertising a precision that exists nowhere
      in the chain.'
    band_min_ppb: 15.0
    band_max_ppb: 180.0
    band_span_fold: 12.0
    uncertainty_pct: 246.4
    uncertainty_pct_basis: upward half-width of the reported band relative to its
      geometric midpoint; NOT a symmetric analytical uncertainty. Read band_min_ppb/band_max_ppb
      instead.
  nonanal:
    conc_ppb: 15.81
    value_provenance: band_geometric_midpoint
    value_provenance_note: '2026-08-27 (Wave I): the source reports a RANGE across
      commercial PPI lots, not a value. The scored hold-out number is the geometric
      midpoint sqrt(5.0 * 50.0) -- a construction of ours. The honest uncertainty
      is the band itself (a factor of 10.0 end to end), so a prediction landing inside
      it is weak evidence. Until 2026-08-27 the midpoint was written at full float
      precision (e.g. 51.96152422706632), advertising a precision that exists nowhere
      in the chain.'
    band_min_ppb: 5.0
    band_max_ppb: 50.0
    band_span_fold: 10.0
    uncertainty_pct: 216.2
    uncertainty_pct_basis: upward half-width of the reported band relative to its
      geometric midpoint; NOT a symmetric analytical uncertainty. Read band_min_ppb/band_max_ppb
      instead.
