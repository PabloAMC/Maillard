  ku_leuven_ghent_fraeye:
    strings: ["KU Leuven Ghent (Fraeye) / Paleo (Sanctorum)"]
    evidence: "Devaere et al. 2022: Ilse Fraeye's meat-technology group, KU Leuven Ghent campus, with Paleo (myoglobin supplier); apart from the Leuven brewing group (bustillotrueba2018)"
  inra_qpa_kondjoyan:
    strings: ["INRA Clermont QuaPA (Kondjoyan)"]
    evidence: "Kondjoyan et al. 2016: INRA QuaPA, Clermont-Ferrand, Kondjoyan's process team; same unit as 'INRA QuaPA (Berdague)' but a different team, kept apart"
  llnl_felton_knize:
    strings: ["LLNL (Felton / Knize)"]
    evidence: "the Tran 2002 / Salmon 2000 frying data re-plotted by Sprague & Colvin 2011: Lawrence Livermore National Laboratory (Felton, Knize)"
  lund_tornberg:
    strings: ["Lund (Tornberg)"]
    evidence: "Kovacsne Oroszvari et al. 2005 / 2006: Eva Tornberg, Food Technology, Lund University; apart from 'Copenhagen (Lund)' (a person named Lund) and 'Lund (Skog)'"
  cidca_salvadori:
    strings: ["CIDCA La Plata (Purlis / Salvadori)"]
    evidence: "Purlis & Salvadori 2009: CIDCA (CONICET / UNLP), La Plata"
  cirad_bohuon:
    strings: ["CIRAD / SupAgro QualiSud (Bohuon)"]
    evidence: "Bassama et al. 2011: UMR QualiSud (CIRAD / Montpellier SupAgro), Bohuon corresponding"
