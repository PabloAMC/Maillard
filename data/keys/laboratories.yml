# Which research GROUP produced each ledger entry: the leave-one-laboratory-out unit of the fitting module.
#
# HAND-CURATED (2026-10-29). The ledgers' `lab` field is free text and spells one group several ways ("Jiangnan
# (Zhang X / Cui H / Ho)" and "Jiangnan (Zhang X. / Ho)"), so leave-one-out would split one laboratory in two. A
# laboratory here is a group with shared methods, instruments and calibrations, not an institution: two groups in one
# university stay apart. src/kinetic_core/fit_rows.py maps every ledger `lab` string of a fit table through `groups`
# and refuses a table whose laboratory is not mapped, so a new source must be placed here, with its evidence, before
# it can be fitted. Add a string only after checking the paper's authors (corresponding author first).

groups:
  wageningen_van_boekel:
    strings: ["Wageningen (van Boekel)"]
    evidence: "Martins, Brands, Nguyen papers; van Boekel corresponding or senior author"
  nestle_blank:
    strings: ["Nestle Research (Blank)", "Nestle (Kraehenbuehl / Davidek / Belrhlid)"]
    evidence: "Davidek 2002 (Blank, Nestle Research Center); US 10,076,126 (Kraehenbuehl, Davidek, Viton, Oertling, Belrhlid; Nestec, Lausanne): Davidek in both, same Nestle Research Center flavour group -- merged as one laboratory, the conservative choice for leave-one-out (thiol adjudicator, 2026-10-29)"
  btbu_xie:
    strings: ["BTBU (Xie J)", "Beijing Technology and Business University (Xie)"]
    evidence: "Cao 2017, Zhao 2017b, Hou 2017, Zhao 2019: Jianchun Xie corresponding (xjchun@th.btbu.edu.cn); 'BTBU (Cao Y)' is a different group"
  jiangnan_zhang_x:
    strings: ["Jiangnan (Zhang X / Cui H / Ho)", "Jiangnan (Zhang X. / Ho)", "Zhejiang Gongshang / Jiangnan (Fu Y / Zhang X / Ho)"]
    evidence: "Zhang Xiaoming's group at Jiangnan (Cui, Hayat, Zhai, Zhou, Deng, Feng); Ho (Rutgers) co-authors many. Zhai 2023 JAFC (Zhai Y, Cui, Hayat, Fu, Zhang X*, Ho*) belongs here"
  dfa_hofmann_schieberle:
    strings: ["DFA Garching (Hofmann / Schieberle)", "DFA Munich (Hofmann / Schieberle)", "DFA Garching (Hofmann)"]
    evidence: "Deutsche Forschungsanstalt fuer Lebensmittelchemie (Garching, by Munich): Hofmann and Schieberle, one institute and method set"
  ogawa_kumazawa:
    strings: ["Ogawa & Co. (Kumazawa / Masuda)"]
    evidence: "Kumazawa 2003: Ogawa & Co. (Kumazawa, Masuda)"
  dalian_polytechnic_chen_d:
    strings: ["affiliation not given in dossier (Wang / Chen)"]
    evidence: "Wang 2026b p. 1: corresponding author D. Chen, School of Food Science and Technology, Dalian Polytechnic University; distinct from 'Dalian Polytechnic University (Qin, Huang)'"
  ochanomizu_murata:
    strings: ["Ochanomizu (Murata)"]
    evidence: "Mikami 2017: Masatsune Murata corresponding, Ochanomizu University, Tokyo"
  reading_mottram:
    strings: ["Reading (Mottram / Parker / Elmore)", "Reading (Mottram)", "Reading (Elmore)"]
    evidence: "Desclaux 2006 (Mottram, University of Reading, School of Food Biosciences); Parker and Elmore in the same flavour group; Yiltirak 2026 (Yiltirak, Balagiannis, Koek, Koch, Elmore*; University of Reading, Food and Nutritional Sciences). 'Reading (Ames)' is a different group"
  zhejiang_gongshang_zhai_fu:
    strings: ["Zhejiang Gongshang (Fu Y / Zhai Y)"]
    evidence: "Kang 2026: Fu Y* and Zhai Yun* (Zhang X's former student) at Zhejiang Gongshang; its own group. Its SI Figs. S3 / S4 reprint Jiangnan's Zhai 2023 Food Chem data, which must enter once, as Jiangnan's (CF-005 family), not as a second laboratory"
  quest_givaudan:
    strings: ["Givaudan / Quest (Weenen / Kerler)", "Givaudan / Quest (Weenen / de Roos)"]
    evidence: "van Seeventer 2001 (Weenen, Winkel*, Kerler: Quest International, Naarden); de Roos's work from the same Quest flavour group"
  ndsu_chen_rao:
    strings: ["North Dakota State Univ. (Chen B / Rao J)", "North Dakota State Univ. / USDA-ARS Fargo (Rao)", "North Dakota State University / USDA-ARS Fargo (Rao)", "North Dakota State (Rao J.)"]
    evidence: "Gao 2020 (Gao ... Chen B, Rao J*), Zha 2019 (Zha, Yang, Rao J, Chen B*) and Cui 2020 (Cui, Kimmel, Zhou, Rao J, Chen B*): Department of Plant Sciences, North Dakota State University, Fargo; Chen and Rao co-lead one plant-protein group with shared HS-SPME methods (2026-11-02)"
  ubc_li_chan:
    strings: ["UBC Vancouver (Li-Chan)"]
    evidence: "Moon & Li-Chan 2007a / 2007b (Food Res Int 40): Eunice Li-Chan corresponding, Food, Nutrition and Health, University of British Columbia, Vancouver (2026-11-02)"
  scut_cui_c:
    strings: ["SCUT (Cui C / Sun-Waterhouse D)"]
    evidence: "Fang 2020 (Fang, Xiang, Sun-Waterhouse, Cui C*, Lin): South China University of Technology; kept apart from 'South China University of Technology (Yu)' and '(Sun, Zhao)' (Cui C has co-authored with Zhao M: merging with Sun/Zhao is the conservative alternative; fang2020 dossier) (2026-11-02)"
  btbu_song:
    strings: ["BTBU (Song H)"]
    evidence: "Alim, Song H* et al. 2019 (LWT 112:108239) and the Wang 2012 / Xu 2013 / Raza 2020 ledger rows: Huanlu Song corresponding, Beijing Technology and Business University; its own group, apart from btbu_xie and 'BTBU (Cao Y)' (2026-11-03)"
  afbi_belfast_farmer:
    strings: ["AFBI Belfast (Farmer)"]
    evidence: "Aliani 2013 (Meat Sci 94:55; Aliani, Farmer*, Kennedy, Moss, Gordon): Linda Farmer corresponding, Agri-Food and Biosciences Institute, Belfast. The 1990s 'AFRC Bristol (Mottram / Farmer)' strings are Mottram-era work and stay unmapped (2026-11-03)"
  # ---- added 2026-11-03 for the dossiers of 2026-11-02 / 03 (evidence: each dossier's Laboratory paragraph) ----
  hacettepe_gokmen:
    strings: ["Hacettepe (Gokmen)"]
    evidence: "Gokmen 2006 / 2012, Palazoglu & Gokmen 2008: Vural Gokmen corresponding, Food Engineering, Hacettepe University, Ankara. 'University of Reading (Parker) / Hacettepe (Gokmen)' is a joint paper and stays unmapped"
  karel_mit_rutgers:
    strings: ["Rutgers (Karel)", "MIT (Karel)"]
    evidence: "Buera & Karel 1993 (Rutgers) and the Eichner / Karel 1972 rows (MIT): Marcus Karel's group, which moved from MIT to Rutgers; merged as one laboratory, the conservative choice for leave-one-out"
  unilever_duiven_van_den_ouweland:
    strings: ["Unilever Duiven (Peer / van den Ouweland)", "Unilever (van den Ouweland)", "Unilever Duiven (Tonsbeek)"]
    evidence: "Peer & van den Ouweland 1968, van den Ouweland & Peer 1975, Tonsbeek et al. 1968 / 1969: Unilever Research Laboratory, Duiven, one flavour group (P ~0.75 that Tonsbeek's work is the same group; merged, the conservative choice). 'Unilever Research Duiven (Schutte)' and the Vlaardingen strings stay apart"
  nara_womens_matoba:
    strings: ["Nara Women's Univ. (Matoba / Hasegawa)"]
    evidence: "Matoba, Kuchiba, Kimura & Hasegawa 1988; Kuchiba, Kaizaki, Matoba & Hasegawa 1990 (Matoba corresponding)"
  alberta_sporns:
    strings: ["Univ. Alberta (Sporns)"]
    evidence: "Shaoul & Sporns 1987: Peter Sporns, Food Science, University of Alberta"
  ict_prague_velisek:
    strings: ["ICT Prague (Davidek / Velisek)"]
    evidence: "Davidek, Velisek & Janicek 1972: Dept. Food Chemistry & Analysis, Institute of Chemical Technology, Prague; NOT the Nestle Davidek (nestle_blank); the id used in docs/reference/contrast_benchmark/lab_ids.yml"
  cftri_modi:
    strings: ["CFTRI Mysore (Modi)"]
    evidence: "Kavitha & Modi 2007: V.K. Modi, Central Food Technological Research Institute, Mysore. 'CFTRI Mysore / Nottingham (Taylor)' stays apart (a joint paper)"
  ajinomoto_kuroda:
    strings: ["Ajinomoto Food Research Labs (Kuroda / Ueda)"]
    evidence: "Kuroda, Nagaba, Tsubuku, Kawajiri & Ueda 1997: Food Research Laboratories, Ajinomoto Co."
  tu_berlin_methner:
    strings: ["TU Berlin Brewing (Jacob / Methner)"]
