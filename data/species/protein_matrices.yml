# Protein matrices as chemistry (2026-09-08, pre-registered in results/validation/matrix_sites_prereg.md).
#
# One entry per matrix whose reactive-site densities a dossier on disk states. Sites are per gram of
# protein; a spec charges them with `protein_g_per_l`. A matrix that is not here is charged only when
# the spec states its own `protein_sites` (free thiol, disulfide, amine, in mmol per gram); otherwise
# the engine charges nothing and says so. Nothing here is a rate: the rates are in
# src/kinetic_core/matrix_sites.py with their own anchors.
schema_version: 1
matrices:
  blg:
    display_name: beta-lactoglobulin (variant A, 18 362 Da)
    molar_mass_g_per_mol: 18362
    source: "anantharamkrishnan2020_extraction.md (18 362 Da, variant A); anantharamkrishnan2020b_extraction.md Methods (15 Lys / 1 free Cys / 2 disulfides / 3 Arg per monomer)"
    per_monomer: {lysine: 15, free_cysteine: 1, disulfide: 2, arginine: 3}
    # mmol per gram = count / molar mass * 1000
    sites_mmol_per_g:
      free_thiol: 0.05446
      disulfide: 0.10892
      amine: 0.81692
    amine_available_band: [0.4, 1.0]
    amine_band_note: "anantharamkrishnan2020b flag X-8: the control spectrum shows mono- and di-lactosylated BLG, so not all 15 lysines are free; the band is declared, not measured"
  # ---- isolates with MEASURED densities (2026-09-08, from the dossiers named; per gram of PROTEIN) ----
  # A measured entry states `sites_mmol_per_g` as the dossiers print them (µmol per gram / 1000) and the
  # spread across laboratories or fractions as `bands_mmol_per_g`. A pool that is not on file is left
  # out, charges nothing, and the answer says so. The densities are the NATIVE isolate's; every dossier
  # shows heating moves them (soy loses 90 % of its free thiol at 100 C / 30 min, pea globulin gains
  # free thiol and loses disulfide at 85 C / 60 min), and that change is not modelled: the sites are
  # charged once, at the start of the cook.
  soy_isolate:
    display_name: soy protein isolate (native; laboratory alcohol-washed and commercial isolates agree)
    source: "ruan2014_extraction.md section 4 (free SH 7.5 +/- 0.26 umol/g protein, DPS in 2 % SDS; S-S ~53 umol/g inferred from the paper's own half-cystine ~114); shimada1988_extraction.md section 4 (total SH 8.0 umol/g protein, DTNB in 6 M urea + 0.5 % SDS; half-cystine 100-104 umol/g by two methods; S-S = (100 - 8)/2 = 46 umol/g derived)"
    sites_mmol_per_g:
      free_thiol: 0.0078     # mean of 0.0075 (Ruan 2014) and 0.0080 (Shimada & Cheftel 1988)
      disulfide: 0.050       # mean of 0.046 (Shimada, derived) and 0.053 (Ruan, inferred): both rest on a half-cystine total, not a direct S-S assay
    bands_mmol_per_g:
      free_thiol: [0.0075, 0.0080]
      disulfide: [0.046, 0.053]
    note: "free thiol is 7-8 % of the half-cystine in both isolates; the disulfide is derived from half-cystine minus free thiol, over two (no paper prints a direct S-S assay of the native isolate)"
    heated_reference: "ruan2014: 100 C / 30 min at 22.5 g/L leaves free SH 0.75 umol/g and S-S 56.6 umol/g; shimada1988: half-cystine constant 80-120 C, free SH down by up to half (figure-only)"
  pea_isolate:
    display_name: pea protein isolate (native, whole isolate; the globulin fraction alone carries about a fifth of the sites)
    source: "gao2020_extraction.md Table 2 (alkaline-extracted, isoelectric pea isolate, 83-85 % protein N x 6.25: free SH 14.72 / 12.94 / 12.25 umol per g powder and S-S 18.66 / 21.15 / 24.80 at extraction pH 8.5 / 9.0 / 9.5, Ellman's in 8 M urea; per g protein 0.0174 / 0.0155 / 0.0147 and 0.0220 / 0.0254 / 0.0297 mmol/g); shen2022_extraction.md section 4 (whole isolate, free SH 13.52 +/- 0.09 umol/g, basis not stated, agrees); chihi2016_extraction.md section 4 (globulin fraction only, 94 % protein: free SH 2.1 +/- 0.1, S-S 4.2 +/- 0.1 umol/g protein, DTNB in 1.5 M GdnCl)"
    sites_mmol_per_g:
      free_thiol: 0.0159     # mean of Gao 2020's three extraction pHs, per gram of protein
      disulfide: 0.0257      # mean of Gao 2020's three extraction pHs, per gram of protein
    bands_mmol_per_g:
      free_thiol: [0.0021, 0.0174]   # from the globulin fraction (Chihi 2016) to the pH-8.5 whole isolate (Gao 2020)
      disulfide: [0.0042, 0.0297]    # from the globulin fraction (Chihi 2016) to the pH-9.5 whole isolate (Gao 2020)
    note: "the whole isolate's albumins carry most of the free thiol (Gao 2020, Shen 2022 agree; the globulin fraction of Chihi 2016 has a fifth); the band spans both; Shen 2022's free amino number (8.44 mmol/g) is physically implausible and is NOT used for the amine pool; Wang 2014 cites a lysine content of 6.25 g per 100 g protein (0.43 mmol/g) second-hand from Khattab 2009, not entered until that paper is read"
    heated_reference: "chihi2016: the globulins at 85 C / 60 min, 2 wt %, pH 7.2 give free SH 7.1 and S-S 1.8 umol/g (half-cystine conserved at ~10.5); no heated whole-isolate value is on disk"
