# Protein matrices as chemistry (2026-09-08, pre-registered in results/validation/matrix_sites_prereg.md).
#
# One entry per matrix whose reactive-site densities a dossier on disk states. Sites are per gram of
# protein; a spec charges them with `protein_g_per_l`. A matrix that is not here is charged only when
# the spec states its own `protein_sites` (free thiol, disulfide, amine, in mmol per gram); otherwise
# the engine charges nothing and says so. Nothing here is a rate: the rates are in
# src/kinetic_core/matrix_sites.py with their own anchors.
schema_version: 1
matrices:
  blg:
    display_name: beta-lactoglobulin (variant A, 18 362 Da)
    molar_mass_g_per_mol: 18362
    source: "anantharamkrishnan2020_extraction.md (18 362 Da, variant A); anantharamkrishnan2020b_extraction.md Methods (15 Lys / 1 free Cys / 2 disulfides / 3 Arg per monomer)"
    per_monomer: {lysine: 15, free_cysteine: 1, disulfide: 2, arginine: 3}
    # mmol per gram = count / molar mass * 1000
    sites_mmol_per_g:
      free_thiol: 0.05446
      disulfide: 0.10892
      amine: 0.81692
    amine_available_band: [0.4, 1.0]
    amine_band_note: "anantharamkrishnan2020b flag X-8: the control spectrum shows mono- and di-lactosylated BLG, so not all 15 lysines are free; the band is declared, not measured"
  # ---- isolates with MEASURED densities (2026-09-08, from the dossiers named; per gram of PROTEIN) ----
  # A measured entry states `sites_mmol_per_g` as the dossiers print them (µmol per gram / 1000) and the
  # spread across laboratories or fractions as `bands_mmol_per_g`. A pool that is not on file is left
  # out, charges nothing, and the answer says so. The densities are the NATIVE isolate's; every dossier
  # shows heating moves them (soy loses 90 % of its free thiol at 100 C / 30 min, pea globulin gains
  # free thiol and loses disulfide at 85 C / 60 min), and that change is not modelled: the sites are
  # charged once, at the start of the cook.
  soy_isolate:
    display_name: soy protein isolate (native; three isolates and two thiol reagents)
    source: "ruan2014_extraction.md section 4 (free SH 7.5 +/- 0.26 umol/g protein, DPS in 2 % SDS; S-S ~53 umol/g inferred from the paper's own half-cystine ~114); shimada1988_extraction.md section 4 (total SH 8.0 umol/g protein, DTNB in 6 M urea + 0.5 % SDS; half-cystine 100-104 umol/g by two methods; S-S = (100 - 8)/2 = 46 umol/g derived); xiao2024_extraction.md section 4 (free SH 4.74 +/- 0.15, S-S 38.07 +/- 0.51 umol/g protein, Ellman's after 8 M urea, total after beta-mercaptoethanol); amine: jaeger2023_extraction.md section 4 (commercial soy isolate, 89 % protein N x 6.25: lysine 5.343 +/- 0.743 g per 100 g dry powder = 0.410 mmol per g protein, ion chromatography), gorissen2018_extraction.md section 4 (seven commercial soy isolates pooled: lysine 4.6 % of protein = 0.31 mmol/g, UPLC-MS/MS), tang2024_extraction.md section 4 (soy protein at 78 % protein: 84.2 mg Lys per g protein = 0.576 mmol/g, LC-MS/MS), xiao2024_extraction.md section 6 (soybean flour 0.379)"
    sites_mmol_per_g:
      free_thiol: 0.0067     # mean of 0.0075 (Ruan 2014), 0.0080 (Shimada & Cheftel 1988) and 0.0047 (Xiao 2024)
      disulfide: 0.0457      # mean of 0.053 (Ruan, inferred), 0.046 (Shimada, derived) and 0.038 (Xiao, derived): none is a direct S-S assay of the native isolate
      amine: 0.36            # lysine epsilon-amines per gram of protein: mean of two COMMERCIAL isolates (Jaeger 2023: 0.410 +/- 0.057; Gorissen 2018: 0.31, seven isolates pooled); the flour value (0.379) and Tang 2024's 78 %-protein preparation (0.576) sit inside the band
    bands_mmol_per_g:
      free_thiol: [0.0047, 0.0080]
      disulfide: [0.038, 0.053]
      amine: [0.31, 0.58]
    amine_available_band: [0.4, 1.0]
    amine_band_note: "as for beta-lactoglobulin: not every lysine is free (glycation, burial in the isolate); the band is declared, not measured. The TNBS free-amino numbers of Shen 2022 / Xiao 2024 / Xiao 2025 (8-10 mmol/g) are 20-25x the lysine content and are recorded as an artefact, NOT used."
    note: "free thiol is 5-8 % of the half-cystine in all three isolates; the disulfide is half-cystine minus free thiol, over two"
    heated_reference: "ruan2014: 100 C / 30 min at 22.5 g/L leaves free SH 0.75 umol/g and S-S 56.6 umol/g; shimada1988: half-cystine constant 80-120 C, free SH down by up to half (figure-only); xiao2025: low-moisture extrusion of soy blends leaves 0.41-0.92 of the free SH"
  pea_isolate:
    display_name: pea protein isolate (native, whole isolate; the globulin fraction alone carries about a fifth of the thiol sites)
    source: "gao2020_extraction.md Table 2 (alkaline-extracted, isoelectric pea isolate, 83-85 % protein N x 6.25: free SH 14.72 / 12.94 / 12.25 umol per g powder and S-S 18.66 / 21.15 / 24.80 at extraction pH 8.5 / 9.0 / 9.5, Ellman's in 8 M urea; per g protein 0.0174 / 0.0155 / 0.0147 and 0.0220 / 0.0254 / 0.0297 mmol/g); xiao2024_extraction.md section 4 (free SH 6.26 +/- 0.17, S-S 28.83 +/- 1.24 umol/g protein); chen2022_extraction.md (urea-exposed SH 7.8-10 umol/g protein, native, figure-bounded); shen2022_extraction.md section 4 (whole isolate, free SH 13.52 +/- 0.09 umol/g, basis not stated); chihi2016_extraction.md section 4 (globulin fraction only, 94 % protein: free SH 2.1 +/- 0.1, S-S 4.2 +/- 0.1 umol/g protein); amine: jaeger2023_extraction.md section 4 (commercial pea isolate, 81 % protein N x 6.25: lysine 6.399 +/- 0.891 g per 100 g dry powder = 0.539 mmol per g protein, ion chromatography), gorissen2018_extraction.md section 4 (three commercial pea isolates pooled: lysine 5.9 % of protein = 0.40 mmol/g, UPLC-MS/MS), tang2024_extraction.md section 4 (pea protein at 79 % protein: 101.7 mg Lys per g protein = 0.696 mmol/g), xiao2024_extraction.md section 6 (pea flour 0.524)"
    sites_mmol_per_g:
      free_thiol: 0.0159     # mean of Gao 2020's three extraction pHs, per gram of protein; Xiao 2024 (0.0063), Chen 2022 (0.0078-0.010) and Shen 2022 (0.0135) sit inside the band
      disulfide: 0.0257      # mean of Gao 2020's three extraction pHs; Xiao 2024's 0.0288 agrees
      amine: 0.47            # lysine epsilon-amines per gram of protein: mean of two COMMERCIAL isolates (Jaeger 2023: 0.539 +/- 0.075; Gorissen 2018: 0.40, three isolates pooled); the flour value (0.524) and Tang 2024's 79 %-protein preparation (0.696) sit inside or at the top of the band
    bands_mmol_per_g:
      free_thiol: [0.0021, 0.0174]   # from the globulin fraction (Chihi 2016) to the pH-8.5 whole isolate (Gao 2020)
      disulfide: [0.0042, 0.0297]    # from the globulin fraction (Chihi 2016) to the pH-9.5 whole isolate (Gao 2020)
      amine: [0.40, 0.70]
    amine_available_band: [0.4, 1.0]
    amine_band_note: "as for soy; the TNBS free-amino numbers of Shen 2022 / Xiao 2024 (8-10 mmol/g) are an artefact and are NOT used"
    note: "the whole isolate's albumins carry most of the free thiol (Gao 2020, Shen 2022, Chen 2022 agree; the globulin fraction of Chihi 2016 has a fifth); the band spans both"
    heated_reference: "chihi2016: the globulins at 85 C / 60 min, 2 wt %, pH 7.2 give free SH 7.1 and S-S 1.8 umol/g (half-cystine conserved at ~10.5); chen2022: the whole isolate at 95 C / 15 min, 1 %, pH 7 keeps urea-exposed SH 7.8 umol/g protein"
