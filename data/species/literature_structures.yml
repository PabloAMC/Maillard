# Structures the hypothesis layer's rules name that are NOT kinetic-core species (2026-09-08).
#
# The engine's own table (structures.yml) must hold exactly the engine's species; the rules read on
# 2026-09-08 (miyazaki2023, cao2020, chen2017, yang2024, choe2006 extraction dossiers) name
# hydroperoxide isomers and products the lipid lane lumps or lacks. They live here, keyed so they
# never collide with an engine key (src/network_hypotheses/structures.py raises on a clash), and the
# enumerator treats them as known compounds with no engine reaction: a step onto one of them is
# placed "mechanism known, not modelled", which is the refusal the wishlist reports. Methyl esters,
# as for the engine's linoleate hydroperoxides; trans double bonds, the autoxidation geometry. The
# engine never reads this file.
schema_version: 1
species:
  # ---- oleate hydroperoxides, the four positional isomers the engine lumps as LOOH_OL (cao2020 section 5; Choe & Min 2006 Table 1: 26-28 / 22-25 / 22-24 / 26-28 % of the autoxidation mixture) ----
  OL_8_OOH:  {kind: molecule, smiles: "CCCCCCCC/C=C/C(OO)CCCCCCC(=O)OC", note: "methyl 8-hydroperoxy-9(E)-octadecenoate"}
  OL_9_OOH:  {kind: molecule, smiles: "CCCCCCC/C=C/C(OO)CCCCCCCC(=O)OC", note: "methyl 9-hydroperoxy-10(E)-octadecenoate"}
  OL_10_OOH: {kind: molecule, smiles: "CCCCCCCCC(OO)/C=C/CCCCCCC(=O)OC", note: "methyl 10-hydroperoxy-8(E)-octadecenoate"}
  OL_11_OOH: {kind: molecule, smiles: "CCCCCCCC(OO)/C=C/CCCCCCCC(=O)OC", note: "methyl 11-hydroperoxy-9(E)-octadecenoate"}
  # ---- the linoleate 10-hydroperoxide (non-conjugated; a photo-oxidation and isomerisation product; miyazaki2023 Figure 3) ----
  LOOH_10:   {kind: molecule, smiles: "CCCCC/C=C\\CC(OO)/C=C/CCCCCCC(=O)OC", note: "methyl 10-hydroperoxy-8(E),12(Z)-octadecadienoate"}
  # ---- volatile products the rules make that the engine has no species for ----
  PENTYLFURAN: {kind: molecule, registry_id: 2_pentylfuran}
  OCTEN3OL:    {kind: molecule, registry_id: 1_octen_3_ol}
  OCTANAL:     {kind: molecule, smiles: "CCCCCCCC=O"}
  DECANAL:     {kind: molecule, smiles: "CCCCCCCCCC=O"}
  DECENAL_2E:  {kind: molecule, smiles: "CCCCCCC/C=C/C=O", note: "(E)-2-decenal"}
  UNDECENAL_2E: {kind: molecule, smiles: "CCCCCCCC/C=C/C=O", note: "(E)-2-undecenal"}
  # ---- the glyceride-side (here methyl-ester-side) core fragments ----
  ME_8_OXOOCTANOATE:     {kind: molecule, smiles: "O=CCCCCCCC(=O)OC"}
  ME_10_OXODECANOATE:    {kind: molecule, smiles: "O=CCCCCCCCCC(=O)OC"}
  ME_10_OXO_8_DECENOATE: {kind: molecule, smiles: "O=C/C=C/CCCCCCC(=O)OC"}
  ME_HEPTANOATE:         {kind: molecule, smiles: "CCCCCCC(=O)OC"}
  ME_8_FURYL_OCTANOATE:  {kind: molecule, smiles: "COC(=O)CCCCCCCc1ccco1", note: "methyl 8-(furan-2-yl)octanoate, the ester-side product of the 9-hydroperoxide's furyl route"}
  # ---- the negative control every lipid rule must refuse (Yang 2024: stearic acid gives no volatile) ----
  ME_STEARATE: {kind: molecule, smiles: "CCCCCCCCCCCCCCCCCC(=O)OC"}
