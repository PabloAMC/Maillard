[project]
name = "Maillard"
version = "0.1.0"
description = "A kinetic model of the Maillard reaction for alternative-protein flavour work, scored on held-out literature pots"
authors = [
    { name = "PabloAMC" }
]
requires-python = ">=3.12"
# 2026-09-08: every entry has an importer under src/ or scripts/ (checked by grep). Add a
# dependency only together with its consumer.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
# rdkit is needed only to rebuild data/keys/compounds.yml (scripts/generators/build_compound_registry.py)
# and by one unit test; the runtime reads the generated registry.
registry = ["rdkit>=2023.9.1"]
dev = [
    "pytest>=8.0",
    "coverage",
    "rdkit>=2023.9.1",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 2026-09-03 (test audit). The envelope and the directional scorer fork worker processes;
# without `concurrency = multiprocessing` + `parallel` their modules measured 0 % although
# their tests pass. Run: ./scripts/docker_maillard.sh coverage
[tool.coverage.run]
source = ["src", "scripts"]
branch = false
parallel = true
concurrency = ["multiprocessing"]
omit = ["scripts/generators/generate_kinetic_core_b*_*.py", "scripts/generators/probe_amine_fate_b2_4.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false
precision = 0
