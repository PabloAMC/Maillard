[project]
name = "Maillard"
version = "0.1.0"
description = "Computational Maillard Reaction Network Explorer for Alt-Protein Science"
authors = [
    { name = "PabloAMC" }
]
dependencies = [
    "rdkit>=2023.9.1",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "SciencePlots>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "optuna>=3.5",
    "cantera>=3.0",
    "torch>=2.0.0",
    "mace-torch>=0.3.3",
    "sella",
    "ase>=3.23",
    "pytest>=8.0",
    "hypothesis>=6.100"
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "black",
    "isort",
    "pytest-timeout",
    "types-PyYAML"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 2026-09-03 (test audit). The envelope and the directional scorer fork worker processes;
# without `concurrency = multiprocessing` + `parallel` their modules measured 0 % although
# their tests pass. Run: ./scripts/docker_maillard.sh coverage
[tool.coverage.run]
source = ["src", "scripts"]
branch = false
parallel = true
concurrency = ["multiprocessing"]
omit = ["scripts/generators/generate_kinetic_core_b*_*.py", "scripts/generators/probe_amine_fate_b2_4.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false
precision = 0
