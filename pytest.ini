[pytest]
markers =
    regression: marks tests as regression tests (deselect with '-m "not regression"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    scientific_regression: fast scientific regression tests for FAST, benchmarks, and calibrated recommendation behavior
    monte_carlo_power: slow Monte-Carlo size / power checks of the frozen revised judge (src/kinetic_core/predictive_densities.py); CI runs them weekly and on a PR that touches the judge, its test or scripts/diagnostics/judge_calibration.py
    kinetics_validation: slower Cantera or kinetics-reference validation tests
    artifact_rebuild: rebuilds a tracked artifact that scripts/ci/artifact_freshness_gate.py also rebuilds and compares (whole payload); CI deselects these in the test jobs and runs the gate in its own job
pythonpath = .
# ADDED 2026-08-27 (Wave J2, red-team finding: dead xfails). Without this, an xfail-marked
# test that starts PASSING reports "xpass" and the suite stays green -- so a known gap that
# gets fixed leaves behind a test nobody is told to promote, and the marker's stale reason
# string keeps documenting a limitation that no longer exists. `xfail_strict` makes an
# unexpected pass a FAILURE, which forces whoever closed the gap to come back and turn the
# test into a real assertion.
#
# Safe to switch on repo-wide as of this date: the suite contains exactly two xfail markers,
# both in tests/scientific/test_blind_spots.py, and both were already made strict=True
# explicitly in this wave. There are no non-strict xfails left for this to surprise.
xfail_strict = true
filterwarnings =
    ignore:.*torch.jit.*:DeprecationWarning
    ignore:.*Environment variable TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD.*:UserWarning
    ignore:.*Log flushes by default now.*:FutureWarning
    ignore:Implicitly cleaning up <_TemporaryFileWrapper.*:ResourceWarning
