[pytest]
markers =
    regression: marks tests as regression tests (deselect with '-m "not regression"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    scientific_regression: fast scientific regression tests for FAST, benchmarks, and calibrated recommendation behavior
    kinetics_validation: slower Cantera or kinetics-reference validation tests
    deterministic_helper_lane: pure-python deterministic helper tests for optional QM infrastructure
    optional_mlp_acceleration_lane: tests that require optional ML acceleration backends or models
    optional_dft_authority_lane: tests that require optional DFT, IRC, or offline benchmark datasets
pythonpath = .
filterwarnings =
    ignore:.*torch.jit.*:DeprecationWarning
    ignore:.*Environment variable TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD.*:UserWarning
    ignore:.*Log flushes by default now.*:FutureWarning
    ignore:Implicitly cleaning up <_TemporaryFileWrapper.*:ResourceWarning
