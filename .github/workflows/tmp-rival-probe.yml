name: TEMP rival probe (to be removed)
on:
  push:
    branches: [rival-linux-robustness]
jobs:
  probe:
    name: TEMP ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: [sug01-score]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: maillard
          python-version: "3.12"
          auto-activate-base: false
      - run: bash scripts/ci/setup_env.sh
      - if: matrix.job == 'sug01-reps'
        shell: bash -el {0}
        env:
          PROBE_MODE: baseline
          PROBE_BUDGET: "200000"
          PROBE_WORKERS: "4"
          PROBE_REPS: "20"
          PROBE_PERTURB: "3e-8"
        run: python scripts/tmp_probe/probe_sug01.py
      - if: matrix.job == 's3-subset'
        shell: bash -el {0}
        env:
          OUT: /tmp/s3_subset.jsonl
          WORKERS: "4"
          SUBSET_EVERY: "6"
        run: python scripts/tmp_probe/s3_subset_compare.py
      - if: matrix.job == 'sug01-score'
        shell: bash -el {0}
        env:
          MAILLARD_WORKERS: "4"
        run: |
          python - <<'PY'
          import json
          from src.kinetic_core import directional as d, ph_balance_refusal as s3
          p = d.load_panel(d.PANEL_PATH)['panel']
          r = d.score_claim(p[0], flat_tolerance_pct=5.0)
          print("SUG-01 status", r["status"], "failures", [v.failure for v in s3._CACHE.values()])
          tracked = json.load(open("results/validation/core_directional_scores.json"))
          print("tracked", json.dumps([c for c in tracked.get("claims", tracked.get("rows", [])) if c.get("claim_id") == "SUG-01"])[:600])
          PY
