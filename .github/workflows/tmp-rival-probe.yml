name: TEMP rival probe (to be removed)
on:
  push:
    branches: [rival-linux-robustness]
jobs:
  probe:
    name: TEMP probe ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, coldph, bdf, rtol8]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: maillard
          python-version: "3.12"
          auto-activate-base: false
      - run: bash scripts/ci/setup_env.sh
      - shell: bash -el {0}
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_BUDGET: "1500000"
          PROBE_WORKERS: "4"
        run: |
          python -c "import numpy, scipy, platform; print(numpy.__version__, scipy.__version__, platform.machine()); numpy.show_config()" | head -60
          python -c "from src.kinetic_core import ph_kernel; print('numba compiled', ph_kernel.COMPILED)"
          python scripts/tmp_probe/probe_sug01.py
