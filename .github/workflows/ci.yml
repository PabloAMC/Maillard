name: CI

# Enforced checks for the Maillard repo.
#
# Tiering
# -------
#   gates       (~1 min, pip-only)  : the data-integrity gates (citation, hold-out
#                                     isolation, fit-target circularity, benchmark
#                                     schema, dossier coverage). No conda, cannot
#                                     flake on a solver.
#   tests-unit  (~10 min + env)     : tests/unit.
#   tests-full  (~25 min + env)     : tests/scientific (the headline guards pin the
#                                     README's numbers to the artifacts), then the
#                                     artifact-freshness gate (tracked artifacts
#                                     equal what the generators produce).
#
# No job asserts that predicted ppb agrees with measured ppb: the accuracy numbers
# are pinned by tests/scientific/test_core_headline_guards.py and are poor on
# purpose. A green page means the repository is consistent, not that the model is right.

# 2026-08-27 (owner request): test tiers run on PULL REQUESTS, not on every
# branch push -- 8 pushes in one day each triggered a full ~30-min pipeline.
# push triggers remain only for main (post-merge protection). Draft PRs run
# only the cheap gates; mark the PR "Ready for review" (or use
# workflow_dispatch) to run the full tiers. Note the previous pull_request
# branch filter [main, audit-remediation] filtered on the BASE branch, so it
# never matched PR #12 (base: s27-matrix-path-accuracy) at all -- the filter
# is removed rather than extended.
on:
  push:
    branches: [main]
  # 2026-11-06: ready_for_review is listed so that marking a draft ready STARTS a run (without `types` it does
  # not, and re-running the draft's run reuses its draft payload, so the draft-gated jobs skip again)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    # Weekly (Mondays): the DOI liveness sample (advisory, see citation-liveness) and the frozen-fit drift gate's
    # slow fits (blocking for that run, see frozen-fit-drift-slow).
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # Belt and braces: conda >=25.3 refuses the `defaults` channel non-interactively until
  # its terms are accepted; environment.yml uses conda-forge only, so this should never fire.
  CONDA_PLUGINS_AUTO_ACCEPT_TOS: "yes"
  # The hosted runner has 4 vCPUs. src/kinetic_core/parallel.py forks this many workers for independent pots (the
  # directional panel's claims, the S3 refusal's 23 carried rival points); results are bit-identical to the serial
  # loop (tests/unit/test_parallel.py, test_ph_balance_refusal.py). Without it the S3 rivals ran serially and both
  # test jobs hit their timeouts on main (2026-11-11, after PR #108).
  MAILLARD_WORKERS: "4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # -e: fail on error. -l: login shell, required for `conda activate` to work
    # in steps that setup-miniconda has prepared.
    shell: bash -el {0}

jobs:
  # ---------------------------------------------------------------------------
  # Tier 0: data-integrity gates. Offline, deterministic, ~1 minute.
  # ---------------------------------------------------------------------------
  gates:
    name: Data integrity gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # These gates read JSON/YAML and parse Python with ast. PyYAML is the only
      # dependency; deliberately no conda and no science stack, so this check
      # cannot be taken down by a dependency-solve failure.
      - name: Install gate dependencies
        run: python -m pip install --disable-pip-version-check "pyyaml>=6.0" "jsonschema>=4.0"

      - name: Citation contamination gate (offline)
        run: python scripts/ci/citation_gate.py

      - name: Hold-out exclusion guard
        run: python scripts/ci/holdout_guard.py

      # 2026-08-27 (Wave I). Blocking. Both failure modes this gate checks actually
      # happened during the audit: a constant was re-derived against two benchmarks and
      # those same two benchmarks were then scored as literature coverage (they were the
      # only two hits in the headline), and a 17-significant-figure fit residue shipped as
      # a "literature_anchored" calibration constant. Neither was visible to any existing
      # check. Like the other gates in this tier it is stdlib-only and offline.
      - name: Fit-target circularity + constant-precision gate
        run: python scripts/ci/fit_target_gate.py

      # 2026-09-01 (cleaning, Phase 4). Every benchmark payload validates against
      # data/schemas/benchmark.schema.json, its id equals its file stem, its volatiles
      # resolve in data/keys/compounds.yml, and hold-out bundles are labelled.
      - name: Benchmark schema + compound-key gate
        run: python scripts/ci/schema_gate.py

      # 2026-10-27. Every `*_extraction.md` named in a tracked file exists, and the hand-curated
      # data/keys/pdf_dossier_aliases.yml is coherent. The per-article half needs data/articles/,
      # which is local only, so here it is skipped with a note; it runs on the owner's machine.
      - name: Dossier coverage gate
        run: python scripts/ci/dossier_coverage_gate.py

      # 2026-10-28. Every non-measured number or decision is registered with its alternatives, and every
      # entry points at code that still exists (docs/reference/choices_register.yml).
      - name: Choices register gate
        run: python scripts/ci/choices_register_gate.py

      # 2026-10-29. Every conflict between sources, duplicate data set and condition error is registered with
      # its sources and its resolution, and points at data and code that exist (docs/reference/conflicts_register.yml).
      - name: Conflicts register gate
        run: python scripts/ci/conflicts_register_gate.py

      # 2026-10-29. Nothing enters a fit unverified against its paper; no generator sets an engine switch at import.
      - name: Source verification gate
        run: python scripts/ci/source_verification_gate.py
      - name: Import-time switch gate
        run: python scripts/ci/import_time_switch_gate.py
      - name: Unpinned constants gate
        run: python scripts/ci/unpinned_constants_gate.py
      # 2026-10-31 (owner: "are we logging the experiments ... in case we want to revisit them?"). Every fit,
      # signature, diagnosis and probe record is in docs/reference/experiment_register.yml, well-formed.
      - name: Experiment register gate
        run: python scripts/ci/experiment_register_gate.py
      # 2026-11-06 (plan sec. 7 S1). The evidence-tier record: every row tiered, inputs current, no fitted_identified
      # without its profile, no tier change without its review. The engine's enumeration of the shipped coordinates
      # needs numpy, so the full gate runs in the unit tier; this job runs the record-only checks.
      - name: Evidence tier gate (record only)
        run: python scripts/ci/evidence_tier_gate.py --record-only

  # ---------------------------------------------------------------------------
  # Tier 1: fast test tier.
  # ---------------------------------------------------------------------------
  tests-unit:
    name: Unit tests
    # Draft PRs skip the expensive tiers; gates still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 60 until 2026-11-11: the S3 refusal integrates 23 rival points per balance-solved pot
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          # Bump CACHE_EPOCH to force a cold rebuild without touching environment.yml.
          CACHE_EPOCH: 1
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('environment.yml') }}

      - name: Install conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          # The env is built by scripts/ci/setup_env.sh in the next step, from environment.yml,
          # so CI and the Dockerfile share one recipe.
          miniforge-version: latest
          activate-environment: maillard
          python-version: "3.12"
          auto-activate-base: false
          pkgs-dirs: ~/conda_pkgs_dir

      - name: Build the maillard environment
        run: bash scripts/ci/setup_env.sh

      # So a failing run has the full resolved environment in its log.
      - name: Environment report
        if: always()
        run: |
          conda info
          conda list

      - name: Unit tests
        # pytest.ini sets pythonpath=., so no editable install is needed.
        # NOTE: neither pytest-timeout nor pytest-xdist is in environment.yml, so
        # do not add --timeout or -n here; the job-level timeout-minutes is the
        # runaway guard.
        # -m "not artifact_rebuild": see the tests-full job; the freshness gate rebuilds those artifacts once.
        # -m "not slow": the panel, model-card and S3-rival tests run in tests-unit-slow, concurrently (2026-11-13:
        # together the tier took 65 min and timed out at 90 on two of four merges to main).
        run: python -m pytest tests/unit -q -m "not artifact_rebuild and not slow" --durations=15

      # 2026-10-29. Every rate constant's evidence anchor resolves and every measured constant cites its paper's
      # dossier. It imports the engine (numpy), so it runs here, not in the dependency-light gates job.
      - name: Evidence anchor gate
        run: python scripts/ci/evidence_anchor_gate.py

      # 2026-11-06 (plan sec. 7 S1): every shipped coordinate the engine reads has a tier in the evidence-tier record
      # (plus the record-only checks the gates job runs). Imports the engine, so it runs here.
      - name: Evidence tier gate
        run: python scripts/ci/evidence_tier_gate.py

      # 2026-11-07 (PR #107): every cheap frozen fit's objective, evaluated once at its frozen point, still gives its
      # recorded S and rows, or the drift is allow-listed at its exact current S with its class and CF
      # (docs/reference/frozen_fit_drift_allowlist.yml). Imports the engine, so it runs here (~10 s); the slow fits
      # (B2.3, B60) run weekly in frozen-fit-drift-slow.
      - name: Frozen-fit drift gate
        run: python scripts/ci/frozen_fit_drift_gate.py

      # 2026-09-01: data/ is read-only at runtime. Fails if the tier above wrote,
      # rewrote or deleted anything under data/ (see scripts/ci/data_readonly_gate.py).
      - name: data/ untouched by the unit tier
        if: always()
        run: python scripts/ci/data_readonly_gate.py

  # ---------------------------------------------------------------------------
  # Tier 1b: the unit tests marked slow (whole-panel scoring, the model card, the S3 rivals), beside tier 1.
  # ---------------------------------------------------------------------------
  tests-unit-slow:
    name: Unit tests (slow)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          CACHE_EPOCH: 1
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('environment.yml') }}

      - name: Install conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: maillard
          python-version: "3.12"
          auto-activate-base: false
          pkgs-dirs: ~/conda_pkgs_dir

      - name: Build the maillard environment
        run: bash scripts/ci/setup_env.sh

      # 2026-11-13: the Monte-Carlo size / power checks of the frozen revised judge (~11 min) run only where they can
      # fail: on the weekly schedule, on a manual run, and on a pull request that touches the judge, its test or the
      # calibration script it loads. The judge is frozen (STATUS_AND_PLAN sec. 7), so no other change can move them.
      - name: Decide whether the judge's Monte-Carlo checks run
        id: judge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) run=true ;;
            pull_request)
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
              if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(src/kinetic_core/predictive_densities\.py|tests/unit/test_predictive_densities_revised_judge\.py|scripts/diagnostics/judge_calibration\.py|pytest\.ini)$'; then
                run=true
              fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "judge Monte-Carlo checks run: $run"

      - name: Unit tests marked slow
        run: |
          marks="slow and not artifact_rebuild"
          if [ "${{ steps.judge.outputs.run }}" != "true" ]; then marks="$marks and not monte_carlo_power"; fi
          python -m pytest tests/unit -q -m "$marks" --durations=15

      - name: data/ untouched by the slow unit tier
        if: always()
        run: python scripts/ci/data_readonly_gate.py

  # ---------------------------------------------------------------------------
  # Tier 2: scientific + integration.
  # ---------------------------------------------------------------------------
  tests-full:
    name: Scientific and integration tests
    # Draft PRs skip the expensive tiers; gates still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # No `needs: tests-unit`: the tiers run concurrently so a red unit tier never hides a
    # skipped scientific tier.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          CACHE_EPOCH: 1
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('environment.yml') }}

      - name: Install conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          # See the tests-unit job for why environment-file is not passed here.
          miniforge-version: latest
          activate-environment: maillard
          python-version: "3.12"
          auto-activate-base: false
          pkgs-dirs: ~/conda_pkgs_dir

      - name: Build the maillard environment
        run: bash scripts/ci/setup_env.sh

      - name: Scientific and integration tests
        # pipefail: without it the step's status is tee's, and a failing test would leave the job green (2026-11-11).
        # -m "not artifact_rebuild": the tests that rebuild a tracked artifact the freshness gate also rebuilds and
        # compares (stricter: the whole payload) run in the artifact-freshness job instead, not twice (pytest.ini).
        run: |
          set -o pipefail
          mkdir -p results
          python -m pytest tests/scientific -q -m "not artifact_rebuild" --durations=15 2>&1 | tee results/pytest_full.log

      - name: data/ untouched by the full tier
        if: always()
        run: python scripts/ci/data_readonly_gate.py

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-log
          path: results/pytest_full.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Artifact freshness (2026-11-11): its own job, concurrent with the test tiers. Since the S3 refusal (PR #108) every
  # balance-solved pot also integrates 23 carried rival points, so rebuilding the directional and panel scorecards and
  # the model card costs tens of minutes; run inside the scientific job (and again as pytest staleness tests) it
  # pushed both test jobs past their timeouts. The gate compares the whole payload; the pytest tests marked
  # artifact_rebuild check a subset of the same thing and are deselected in CI.
  # ---------------------------------------------------------------------------
  artifact-freshness:
    name: Artifact freshness gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          CACHE_EPOCH: 1
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('environment.yml') }}

      - name: Install conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: maillard
          python-version: "3.12"
          auto-activate-base: false
          pkgs-dirs: ~/conda_pkgs_dir

      - name: Build the maillard environment
        run: bash scripts/ci/setup_env.sh

      - name: Artifact freshness gate
        # Every tracked artifact under results/validation equals what its generator
        # produces from the tracked inputs (modulo date and git head).
        run: python scripts/ci/artifact_freshness_gate.py

      - name: data/ untouched by the gate
        if: always()
        run: python scripts/ci/data_readonly_gate.py

  # ---------------------------------------------------------------------------
  # Tier 2b (2026-11-05, A2 + H3): the JAX sulfur lane against the NumPy sulfur lane, LIVE, in the separate
  # maillard-jax env (environment-jax.yml = environment.yml's package set plus JAX). This is the enforcement of
  # docs/guides/A2_MODULE_CONTRACT.md sec. 6.2.2: an edit of src/kinetic_core/sulfur.py that the JAX lane
  # (src/kinetic_core_jax/sulfur_lane.py) does not follow fails here. The structural half also runs in the core
  # env's unit tier (tests/unit/test_jax_sulfur_structure.py).
  # ---------------------------------------------------------------------------
  tests-jax-sulfur:
    name: JAX sulfur lane parity
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          CACHE_EPOCH: 1
        with:
          path: ~/conda_pkgs_dir
          key: conda-jax-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('environment-jax.yml') }}

      - name: Install conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: maillard-jax
          python-version: "3.12"
          auto-activate-base: false
          pkgs-dirs: ~/conda_pkgs_dir

      - name: Build the maillard-jax environment
        run: conda env update -n maillard-jax --file environment-jax.yml

      - name: Preflight (the JAX stack imports; a skip below would otherwise test nothing)
        run: python -c "import jax, diffrax, equinox.internal; jax.config.update('jax_enable_x64', True); print(jax.__version__, diffrax.__version__)"

      - name: Every JAX test (unit and scientific) against the NumPy lanes
        env:
          MAILLARD_REQUIRE_NO_SKIPS: "1"   # tests/conftest.py: a skip fails this job
        run: python -m pytest tests/unit/test_jax_*.py tests/scientific/test_jax_*.py -q -rs

      - name: data/ untouched by the JAX parity tier
        if: always()
        run: python scripts/ci/data_readonly_gate.py

  # ---------------------------------------------------------------------------
  # Weekly (2026-11-07, PR #107): the frozen-fit drift gate with the slow fits (B2.3, B60: 22-35 s per evaluation,
  # ~1 min in all), which the unit tier skips. Scheduled and manual only.
  # ---------------------------------------------------------------------------
  frozen-fit-drift-slow:
    name: Frozen-fit drift gate, slow fits (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          CACHE_EPOCH: 1
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ env.CACHE_EPOCH }}-${{ hashFiles('environment.yml') }}

      - name: Install conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: maillard
          python-version: "3.12"
          auto-activate-base: false
          pkgs-dirs: ~/conda_pkgs_dir

      - name: Build the maillard environment
        run: bash scripts/ci/setup_env.sh

      - name: Frozen-fit drift gate (every fit)
        run: python scripts/ci/frozen_fit_drift_gate.py --slow

      - name: data/ untouched by the drift gate
        if: always()
        run: python scripts/ci/data_readonly_gate.py

  # ---------------------------------------------------------------------------
  # Advisory: DOI liveness. Never blocks a PR.
  # ---------------------------------------------------------------------------
  citation-liveness:
    name: DOI liveness sample (advisory)
    # Scheduled and manual only. Network-dependent by construction, so it must
    # never gate a merge -- doi.org being slow is not a reason to block work.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        run: python -m pip install --disable-pip-version-check "pyyaml>=6.0" "jsonschema>=4.0"

      - name: Resolve a random DOI sample against doi.org
        # --fail-on-online is intentionally omitted: dead DOIs are reported in the
        # log for triage, but a transient doi.org outage must not create a red X
        # that people learn to ignore.
        run: python scripts/ci/citation_gate.py --online --sample 40
